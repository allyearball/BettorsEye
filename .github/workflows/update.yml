name: Rebuild and deploy WNBA app
on:
  schedule:
    # Runs every 10 minutes, all day, every day. GitHub's scheduler is best-effort —
    # during high load across GitHub it can occasionally run a few minutes late, but
    # this is the tightest practical interval for a free scheduled workflow.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab, for manual testing
concurrency:
  group: build-and-deploy
  cancel-in-progress: true
permissions:
  contents: read
  deployments: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ubuntu-latest is a fresh, disposable VM every single run -- nothing written to disk
      # survives between runs on its own. build.py does an INCREMENTAL fetch (only the gap
      # since the last run) and expects data/ to already have everything through last time,
      # so without this cache step every 10-minute run would silently fall back to a full
      # season re-fetch (5-10 minutes of continuous ESPN requests, every 10 minutes, forever)
      # instead of a quick incremental one. This restores whatever the most recent run saved.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: wnba-data-${{ github.run_id }}
          restore-keys: |
            wnba-data-

      - name: Build app (download fresh data, regenerate index.html)
        run: python build/build.py

      # Saves this run's updated data/ under a unique key (the previous step's restore-keys
      # prefix match will pick it up next time, since exact keys never collide on save).
      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: wnba-data-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: wnba-explorer
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # REMOVED: "Check for gold-tier bets and send push notifications" (build/check_gold_bets.py).
      # That file doesn't exist -- only the subscribe/dedupe infrastructure for push notifications
      # was ever built, not the actual detect-a-qualifying-bet-and-send-it piece. Running this
      # step would fail every single run. This is a separate, substantial feature (VAPID JWT
      # signing + Web Push encryption) to build as its own task, not something to fake here.
