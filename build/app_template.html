// Builds all four Season-tab tables into `container`.
function buildPlayerSeasonTab(container, playerName, team){
  const splits = computePlayerSeasonSplits(playerName);
  if(!splits.seasons.length){
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
    na.textContent = `No season totals found for ${playerName}.`;
    container.appendChild(na);
    return;
  }
  const TABLES = [
    {title:'Season Totals — Standard', cols:SEASON_STD_TOTALS_COLS, pick:'stdTotals',
     def:'One row per season she played (one row per team within a season if she was ever traded mid-year), with her career line as the last row. Shooting percentages are computed from combined makes and attempts across the whole span, never by averaging season percentages together.'},
    {title:'Season Averages (Per Game Played) — Standard', cols:SEASON_STD_AVG_COLS, pick:'stdAverages',
     def:'Per-game averages over games she actually played — DNPs are excluded from the denominator. GP/GS stay as counts. FG%/3P%/FT% are the same combined-makes-over-combined-attempts figures as the totals table above, since a "per game" shooting percentage isn’t a meaningful number.'},
    {title:'Season Totals — Advanced', cols:SEASON_ADV_TOTALS_COLS, pick:'advTotals',
     def:'Season-level cumulative and efficiency figures. The rate stats (TS%, eFG%, USG%, AST/TO, 3PAr, FTr) are computed from season totals, so the Career row is a true career rate rather than an average of season rates. USG% uses the standard Basketball-Reference formula against her team’s combined totals in the games she played.'},
    {title:'Season Averages (Per Game Played) — Advanced', cols:SEASON_ADV_AVG_COLS, pick:'advAverages',
     def:'Per-game and per-36-minute rates, plus season-long volatility (StdDev/IQR over every game she played that season, not a trailing 10-game window) and the average matchup difficulty she faced. Per-36 figures show rate production independent of playing time — useful for comparing a starter’s season to a bench season.'},
  ];
  TABLES.forEach(t=>{
    const title = document.createElement('div'); title.className='section-title'; title.textContent = t.title;
    container.appendChild(title);
    appendDefIcon(title, t.def);
    makeTable(container, t.cols, splits.seasons.map(s=>s[t.pick]), {
      defaultSort:'season', defaultDir:'desc', noHideDNP:true,
      seasonFor: r => (r.season && /^\d{4}$/.test(String(r.season))) ? String(r.season) : undefined,
      footerRows: splits.career ? [{label:'Career', values: splits.career[t.pick]}] : [],
    });
  });
}

// Every page that is ABOUT a single player says which team she plays for, spelled out in full
// (city + nickname) and clickable. The bare short code ("Fever") isn't enough on a page you can
// land on directly from a bet, a Specials row, or a shared link -- and the height-tier detail
// pages didn't name the team at all.
// `block:true` renders it on its own line under the <h2> (the pagehead layout); the default
// inline form is for .player-header, which is already a baseline-aligned flex row.
function appendPlayerTeamByline(container, team, opts){
  opts = opts || {};
  const el = document.createElement(opts.block ? 'div' : 'span');
  el.className = 'meta';
  el.style.cssText = `color:var(--sub);font-size:13px;${opts.block ? 'margin-top:2px;' : ''}`;
  el.appendChild(teamLinkEl(team, FULL_TEAM_NAME[team] || team, opts.season));
  // Sits immediately under the player's name rather than after whatever else the header holds,
  // so on the empty/error states the team line reads before the explanation instead of trailing
  // it as an apparent afterthought.
  const h2 = container.querySelector('h2');
  if(h2 && h2.nextSibling) container.insertBefore(el, h2.nextSibling);
  else container.appendChild(el);
  return el;
}

function renderPlayerPage(playerName, team, returnTo, windowMode, year, month){
  windowMode = windowMode===undefined ? 'all' : windowMode; // default matches prior behavior
  month = month || 'full';
  const key = `${playerName}|${team}`;
  const fullLogObj = DATA.fullPlayerLogs[key];
  const fullLog = fullLogObj ? fullLogObj.log : [];
  const years = availableYearsForLog(fullLog);
  year = year || years[years.length-1];
  lastRender = () => renderPlayerPage(playerName, team, returnTo, windowMode, year, month);
  main.innerHTML = '';

  const back = document.createElement('button'); back.className='backbtn'; back.textContent='\u2190 Back';
  back.addEventListener('click', ()=>navBack(()=>{ if(returnTo) returnTo(); else renderLeagueStatsPage(); }));
  main.appendChild(back);

  if(!fullLogObj){
    const head = document.createElement('div'); head.className='pagehead';
    head.innerHTML = `<h2>${playerName}</h2><div class="meta">No recent game log found for ${playerName} on ${FULL_TEAM_NAME[team] || team}.</div>`;
    appendPlayerTeamByline(head, team, {block:true});
    main.appendChild(head);
    return;
  }

  const dateFiltered = fullLog.filter(g => g.date.slice(0,4)===year && (month==='full' || g.date.slice(5,7)===month));
  const windowedLog = windowSlice(dateFiltered, windowMode);
  const pl = { player: fullLogObj.player, team: fullLogObj.team, athleteId: fullLogObj.athleteId, log: windowedLog };

  const teamData = DATA.teams[team];
  let bio = null;
  if(teamData){
    // bio (height/weight/age/dob) is static, pull from the full-season summary either way
    bio = teamData.summaryFull.totals.find(r=>r.athleteId===pl.athleteId) || teamData.summaryFull.totals.find(r=>r.player===playerName);
  }
  const gpInWindow = pl.log.filter(g=>!g.dnp).length;
  const gsInWindow = pl.log.filter(g=>!g.dnp && g.starter).length;

  const head = document.createElement('div'); head.className='player-header';
  head.innerHTML = `<h2>${playerName}</h2>`;
  appendPlayerTeamByline(head, team, {season: year});
  main.appendChild(head);

  const myInjury = teamInjuries(team).find(inj=>inj.player===playerName);
  if(myInjury && noteworthyInjuryStatus(myInjury.status)){
    const color = INJURY_SEVERITY_COLOR[injuryStatusSeverity(myInjury.status)] || '#7a5200';
    const injuryLine = document.createElement('div');
    injuryLine.style.cssText = 'font-size:13px;padding:6px 2px;margin:6px 0 4px;border-left:3px solid #f0b83c;padding-left:10px;color:#7a5200;';
    injuryLine.innerHTML = `\u26a0\ufe0f <b style="color:${color};">${myInjury.status||'Status unclear'}</b>`;
    main.appendChild(injuryLine);
  }

  if(bio){
    const bioDiv = document.createElement('div'); bioDiv.className='player-bio';
    const position = getPlayerPosition(playerName, team);
    bioDiv.innerHTML = `
      <span><b>Position:</b> ${position ?? '\u2014'}</span>
      <span><b>Height:</b> ${bio.height ?? '\u2014'}</span>
      <span><b>Weight:</b> ${bio.weight ?? '\u2014'} lb</span>
      <span><b>Age:</b> ${bio.age ?? '\u2014'}</span>
      <span><b>DOB:</b> ${bio.dob ?? '\u2014'}</span>
      <span><b>GP:</b> ${gpInWindow} / <b>GS:</b> ${gsInWindow} (in range/window selected below)</span>
    `;
    main.appendChild(bioDiv);
  }

  // Year/Month filter — narrows the calendar range; the rolling-window buttons below then
  // apply within whatever that range contains (e.g. "Last 10" within June 2026 specifically).
  // Placed right after the bio, before the tabs, so it's visible at the very top of the page
  // rather than buried below the Production tab's content.
  const selectorRow = document.createElement('div');
  selectorRow.style.cssText = 'display:flex;align-items:center;gap:10px;margin:14px 0;';
  const selectorLabel = document.createElement('div'); selectorLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;';
  selectorLabel.textContent = 'Season:';
  selectorRow.appendChild(selectorLabel);
  selectorRow.appendChild(buildYearMonthSelector(
    years, (y)=>availableMonthsForYearInLog(fullLog,y), year, month,
    (y,m)=>renderPlayerPage(playerName, team, returnTo, windowMode, y, m)
  ));
  main.appendChild(selectorRow);

  main.appendChild(renderGameWindowStickyBar(windowMode, (val)=>{ if(val!==windowMode) renderPlayerPage(playerName, team, returnTo, val, year, month); }));

  // Three tabs to cut down on scrolling: Production (teammate-out impact, height-tier analysis,
  // next opponent), Gamelogs (box score + advanced metrics, plus the year/month/window controls
  // that actually drive them), Vs. Opponent (matchup-specific gamelog + advanced metrics). Each
  // existing section's own internal logic is untouched -- this only changes which container it
  // gets appended to and which one is visible at a time.
  const tabBar = document.createElement('div'); tabBar.className = 'compact-only'; tabBar.style.cssText = 'display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;';
  const prodTabContent = document.createElement('div');
  const gamelogTabContent = document.createElement('div');
  const vsOppTabContent = document.createElement('div');
  const seasonTabContent = document.createElement('div');
  const TAB_DEFS = [
    {label:'Production', content: prodTabContent},
    {label:'Gamelogs', content: gamelogTabContent},
    {label:'Vs. Opponent', content: vsOppTabContent},
    {label:'Season', content: seasonTabContent},
  ];
  const tabButtons = TAB_DEFS.map((def, myIndex)=>{
    const btn = document.createElement('button');
    btn.textContent = def.label;
    btn.style.cssText = 'padding:9px 18px;border-radius:6px;border:1px solid var(--line);font-size:13.5px;cursor:pointer;font-family:var(--sans);font-weight:700;';
    btn.addEventListener('click', ()=>{
      LAST_TAB.player = myIndex;
      TAB_DEFS.forEach((d,i)=>{
        d.content.style.display = d===def ? '' : 'none';
        tabButtons[i].style.background = d===def ? 'var(--navy2)' : 'var(--panel)';
        tabButtons[i].style.color = d===def ? '#fff' : 'var(--ink)';
      });
    });
    tabBar.appendChild(btn);
    return btn;
  });
  main.appendChild(tabBar);
  TAB_DEFS.forEach(def=>main.appendChild(def.content));
  // Tabs are Compact-mode-only -- in Full mode every section stays visible at once (the
  // original long-scroll layout), the tab bar itself is hidden via the compact-only class above,
  // and clicking tabs (which can't happen since the bar is hidden) would be moot anyway.
  if(getLayoutMode()==='compact'){
    // Everything except the first tab starts hidden -- written as a loop rather than one line
    // per tab so adding a tab (as the Season tab just did) can't leave one silently visible.
    // Opens on whichever tab was last used, not always the first -- so Back from a box score
    // or a tier page returns you to the tab you left. Clamped in case the remembered index is
    // from a page with more tabs than this one.
    const openAt = Math.min(LAST_TAB.player, TAB_DEFS.length - 1);
    TAB_DEFS.forEach((d,i)=>{
      d.content.style.display = i===openAt ? '' : 'none';
      tabButtons[i].style.background = i===openAt ? 'var(--navy2)' : 'var(--panel)';
      tabButtons[i].style.color = i===openAt ? '#fff' : 'var(--ink)';
    });
  }

  // Teammate-out impact -- for every teammate currently listed as officially out, how this
  // player's own per-game production has historically differed in games that teammate missed
  // vs played. Only shows teammates actually out right now, since the point is "who's out for
  // the upcoming game", not a general career-long injury-replacement history.
  const teammateImpact = computeTeammateOutImpact(playerName, team);
  if(teammateImpact.length){
    const impactTitle = document.createElement('div'); impactTitle.className='section-title';
    impactTitle.textContent = 'Production When a Teammate Is Out';
    prodTabContent.appendChild(impactTitle);
    const impactWrap = document.createElement('div');
    impactWrap.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;';
    teammateImpact.forEach((imp, i)=>{
      if(i>0) impactWrap.appendChild(document.createElement('hr'));
      const header = document.createElement('div'); header.style.cssText = 'font-weight:700;margin-bottom:4px;';
      header.innerHTML = `${imp.teammate} <span style="font-weight:400;color:var(--sub);font-size:12px;">(${imp.status||'Out'})</span>`;
      impactWrap.appendChild(header);
      if(imp.insufficientSample){
        const note = document.createElement('div'); note.style.cssText = 'font-size:12.5px;color:var(--sub);';
        note.textContent = `Only ${imp.gamesWithout} game(s) on record without ${imp.teammate} \u2014 too small a sample to draw a real comparison from.`;
        impactWrap.appendChild(note);
        return;
      }
      const sampleNote = document.createElement('div'); sampleNote.style.cssText = 'font-size:11.5px;color:var(--sub);margin-bottom:6px;';
      sampleNote.textContent = `${imp.gamesWithout} game(s) without ${imp.teammate} vs ${imp.gamesWith} game(s) with her.`;
      impactWrap.appendChild(sampleNote);
      const statsRow = document.createElement('div'); statsRow.style.cssText = 'display:flex;gap:20px;flex-wrap:wrap;';
      // Per-game labels, matching what the numbers actually are. 3PM/G is spelled out rather than
      // the bare "3PM" used as a table column header elsewhere, because every other label in this
      // widget carries its per-game unit.
      const STAT_LABELS = Object.assign({}, STAT_SHORT_LABEL, {pts:'PPG', reb:'RPG', ast:'APG', tpm:'3PM/G'});
      imp.stats.forEach(s=>{
        const box = document.createElement('div');
        const lbl = document.createElement('div'); lbl.style.cssText = 'font-size:11px;color:var(--sub);'; lbl.textContent = STAT_LABELS[s.statKey];
        const val = document.createElement('div'); val.style.cssText = 'font-weight:700;font-size:14px;';
        const deltaText = formatTeammateOutDelta(s.statKey, s.delta);
        val.textContent = deltaText;
        val.style.color = deltaText.startsWith('Insignificant') ? 'var(--sub)' : (s.delta>0 ? 'var(--green)' : (s.delta<0 ? 'var(--red)' : 'var(--sub)'));
        const detail = document.createElement('div'); detail.style.cssText = 'font-size:10.5px;color:var(--sub);';
        detail.textContent = `${s.withoutAvg!==null?s.withoutAvg.toFixed(1):'\u2014'} without vs ${s.withAvg!==null?s.withAvg.toFixed(1):'\u2014'} with`;
        box.appendChild(lbl); box.appendChild(val); box.appendChild(detail);
        statsRow.appendChild(box);
      });
      impactWrap.appendChild(statsRow);
    });
    prodTabContent.appendChild(impactWrap);
  }

  // Vs opposing position-group height -- proxy analysis, see buildHeightTierSection's own
  // comment for exactly what this does and doesn't measure.
  const heightTierTitle = document.createElement('div'); heightTierTitle.className='section-title';
  heightTierTitle.textContent = 'Production vs. Opposing Position Height';
  prodTabContent.appendChild(heightTierTitle);
  const heightTierWrap = document.createElement('div');
  heightTierWrap.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;';
  prodTabContent.appendChild(heightTierWrap);
  const heightTierData = buildHeightTierSection(heightTierWrap, playerName, team, windowMode, heightTierTitle);

  // "Estimated Share of Allowed/Gm vs Opponent" -- her share (by minutes, and separately by
  // actual production) of her position group's Allowed/Gm against her next opponent specifically.
  const shareTitle = document.createElement('div'); shareTitle.className='section-title';
  shareTitle.textContent = 'Estimated Share of Allowed/Gm vs Opponent';
  prodTabContent.appendChild(shareTitle);
  const shareWrap = document.createElement('div');
  shareWrap.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;';
  shareWrap.textContent = 'Looking up next opponent\u2026';
  prodTabContent.appendChild(shareWrap);

  // Next opponent's players at her position -- async, since it needs the live schedule/odds
  // feed to know who's actually next.
  const nextOppTitle = document.createElement('div'); nextOppTitle.className='section-title';
  nextOppTitle.textContent = 'Next Opponent \u2014 Same Position';
  prodTabContent.appendChild(nextOppTitle);
  const nextOppWrap = document.createElement('div');
  nextOppWrap.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;';
  nextOppWrap.textContent = 'Looking up next opponent\u2026';
  prodTabContent.appendChild(nextOppWrap);

  // Single shared lookup feeds all three of the above -- the tier outline, the new share
  // section, and the existing next-opponent table -- rather than three separate async calls
  // each independently hitting the live odds feed for the same answer.
  computeNextOpponentGroupTier(playerName, team, heightTierData).then(result=>{
    if(!result){
      shareWrap.textContent = 'Position unavailable, or no upcoming game found.';
      nextOppWrap.textContent = 'Position unavailable, or no upcoming game found.';
      return;
    }
    if(heightTierData && heightTierData.setHighlightTier) heightTierData.setHighlightTier(result.groupTier);
    renderShareOfAllowedSection(shareWrap, playerName, team, result.opp, windowMode, heightTierData, result.groupTier);
    renderNextOpponentPositionSectionFromResult(nextOppWrap, playerName, team, heightTierData, result);
  });

  const windowLabelText = windowMode==='all' ? 'Full Season' : `Last ${windowMode}`;
  const monthLabelText = month==='full' ? 'Full Season' : (MONTH_NAMES[month]||month);
  const t1 = document.createElement('div'); t1.className='section-title';
  t1.textContent = `Gamelog - Normal, ${windowLabelText} (DNPs included)`;
  gamelogTabContent.appendChild(t1);

  const logRows = pl.log.map(g=>({
    date: g.date, opp: g.opp, homeAway: g.homeAway, starter: g.starter, dnp: g.dnp,
    min: g.min, pts: g.pts, fgm: g.fgm, fga: g.fga, fgPct: g.fgPct,
    tpm: g.tpm, tpa: g.tpa, tpPct: g.tpPct, ftm: g.ftm, fta: g.fta, ftPct: g.ftPct,
    oreb: g.oreb, dreb: g.dreb, reb: g.reb, ast: g.ast, stl: g.stl, blk: g.blk,
    to: g.to, pf: g.pf, plusMinus: g.plusMinus,
  }));
  attachGameRecords(logRows, team);
  attachPra(logRows);

  const footerRows = [];
  const labels = [
    {label:'TOTAL (games played)', fn: arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)*100)/100 : null},
    {label:'MIN (games played)', fn: arr => arr.length ? Math.min(...arr) : null},
    {label:'MAX (games played)', fn: arr => arr.length ? Math.max(...arr) : null},
    {label:'AVERAGE (games played)', fn: arr => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100)/100 : null},
    {label:'MEDIAN (games played)', fn: median},
    {label:'MODE (games played)', fn: mode},
  ];
  labels.forEach(({label, fn})=>{
    const values = {};
    // logRows, not pl.log: identical games and the same `dnp` flags, but these carry the derived
    // P+R+A that the raw log has no field for.
    STAT_KEYS_FOR_SUMMARY.forEach(k=>{ values[k] = fn(statValues(logRows, k)); });
    footerRows.push({label, values, oneDecimal:true});
  });

  const gameIdForLogRow = r => findGameIdForTeamDate(team, r.date);
  makeTable(gamelogTabContent, PLAYER_LOG_COLS, logRows, {defaultSort:'date', defaultDir:'desc', footerRows, hideLabel:'Hide games she didn\u2019t play (DNP)', gameIdFor: gameIdForLogRow});

// Rebuildable so login/logout can refresh just this piece without touching the page nav
// buttons. Lives in its own small container appended after the page nav buttons inside
// #toplinks, which naturally puts it furthest right (toplinks is a flex row).
function renderAccountControls(){
  let container = document.getElementById('accountControls');
  if(!container){
    container = document.createElement('div');
    container.id = 'accountControls';
    container.style.cssText = 'display:flex;gap:6px;margin-left:10px;padding-left:10px;border-left:1px solid rgba(255,255,255,.25);';
    document.getElementById('toplinks').appendChild(container);
  }
  container.innerHTML = '';

  const settingsBtn = document.createElement('button');
  settingsBtn.textContent = '\u2699\ufe0f Settings';
  settingsBtn.addEventListener('click', ()=>{
    if(!isLoggedIn()){
      showLoginRequiredModal(()=>{ renderAccountControls(); renderSettingsPage(); });
      return;
    }
    renderSettingsPage();
  });

  let adminBtn = null;
  if(isLoggedIn() && isAdminUser()){
    adminBtn = document.createElement('button');
    adminBtn.textContent = '\ud83d\udee1\ufe0f Admin';
    adminBtn.addEventListener('click', ()=>renderAdminPage());
  }

  const authBtn = document.createElement('button');
  if(isLoggedIn()){
    authBtn.textContent = 'Log Out';
    authBtn.addEventListener('click', async ()=>{
      try{ await fetchJson(`${(await loadSavedUrl()) || DEFAULT_WORKER_URL}/auth/logout`, {method:'POST', headers: authHeaders()}); }catch(e){ /* best-effort */ }
      clearAuthSession();
      renderAccountControls();
      if(lastRender) lastRender(); // refresh whatever page is currently showing, in case it shows account-specific content
    });
  } else {
    authBtn.textContent = 'Login / Sign-Up';
    authBtn.addEventListener('click', ()=>{
      showLoginRequiredModal(()=>{ renderAccountControls(); if(lastRender) lastRender(); });
    });
  }

  container.appendChild(settingsBtn);
  if(adminBtn) container.appendChild(adminBtn);
  container.appendChild(authBtn);

  // Compact-mode-only hamburger menu -- CSS hides every direct child of #accountControls in
  // Compact mode (the desktop-style button row above), so this needs to live as a SIBLING of
  // #accountControls rather than inside it, or the same hide-everything rule would catch it too.
  buildCompactMenu(container, {settingsBtn, adminBtn, authBtn});
}
// Builds (once) the hamburger button + slide-out panel + overlay, appended as a sibling of
// #accountControls rather than a child of it (see the comment at the call site for why).
// Rebuilds the panel's contents fresh each call so it reflects current login/admin state.
function buildCompactMenu(afterEl, actions){
  let menuBtn = document.getElementById('compactMenuBtn');
  let panel = document.getElementById('compactMenuPanel');
  let overlay = document.getElementById('compactMenuOverlay');
  if(!menuBtn){
    menuBtn = document.createElement('button');
    menuBtn.id = 'compactMenuBtn';
    menuBtn.textContent = '\u2630';
    afterEl.insertAdjacentElement('afterend', menuBtn);
  }
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'compactMenuOverlay';
    document.body.appendChild(overlay);
  }
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'compactMenuPanel';
    document.body.appendChild(panel);
  }
  function closePanel(){ panel.classList.remove('open'); overlay.classList.remove('open'); }
  function openPanel(){ panel.classList.add('open'); overlay.classList.add('open'); }
  menuBtn.onclick = openPanel;
  overlay.onclick = closePanel;

  panel.innerHTML = '';
  const closeBtn = document.createElement('button'); closeBtn.className = 'panel-close'; closeBtn.textContent = '\u2715';
  closeBtn.addEventListener('click', closePanel);
  panel.appendChild(closeBtn);

  function panelItem(text, onClick){
    const b = document.createElement('button'); b.className = 'panel-item'; b.textContent = text;
    b.addEventListener('click', ()=>{ closePanel(); onClick(); });
    panel.appendChild(b);
    return b;
  }
  panelItem('\u2699\ufe0f Settings', ()=>actions.settingsBtn.click());
  if(actions.adminBtn) panelItem('\ud83d\udee1\ufe0f Admin', ()=>actions.adminBtn.click());
  panelItem(actions.authBtn.textContent, ()=>actions.authBtn.click());
}

function buildTopLinks(){

  const allNavBtns = [homeBtn,explorerBtn,oddsBtn,trackerBtn,appTrackerBtn];
  function clearActive(){ allNavBtns.forEach(b=>b.classList.remove('active')); [...document.querySelectorAll('#bottomTabBar button')].forEach(b=>b.classList.remove('active')); }

  // initial gate is still the only way in.
  function withLogin(fn){

// ================= Click tracking (admin-visible usage analytics) =================
// Batches clicks in memory and flushes periodically rather than one network request per click
// -- with as many interactive elements as this app has (filters, sortable headers, track
// buttons), per-click requests would be wasteful and could realistically overwhelm the Worker.
// Only active while logged in -- there's no user to associate anonymous activity with, and no
// point tracking the login screen itself.
const CLICK_BATCH_FLUSH_INTERVAL_MS = 15000;
let _clickEventBuffer = [];
function currentPageLabel(){
  const activeNav = document.querySelector('.toplinks button.active');
  if(activeNav) return activeNav.textContent.trim();
  const h2 = document.querySelector('#main h2');
  if(h2) return h2.textContent.trim().slice(0,60);
  return document.title || 'unknown';
}
// Walks up a few levels from the actual clicked element to find the nearest meaningful
// clickable ancestor (a raw click often lands on an icon or text span inside a real button) --
// data-track-label lets any specific button opt into a clean, deliberate description instead of
// relying on this generic fallback.
function describeClickTarget(el){
  let node = el;
  for(let i=0; i<4 && node; i++){
    if(node.hasAttribute && node.hasAttribute('data-track-label')) return node.getAttribute('data-track-label');
    if(node.tagName === 'BUTTON' || node.tagName === 'A'){
      const text = (node.textContent||'').trim().replace(/\s+/g,' ').slice(0,80);
      const cls = node.className ? '.'+String(node.className).split(' ')[0] : '';
      return `${node.tagName.toLowerCase()}${cls}: ${text||'(no text)'}`;
    }
    if(node.tagName === 'INPUT'){
      return `input[${node.type||'text'}]${node.placeholder?': '+node.placeholder:''}`;
    }
    node = node.parentElement;
  }
  const tag = (el.tagName||'').toLowerCase();
  const cls = el.className ? '.'+String(el.className).split(' ')[0] : '';
  return `${tag}${cls}`;
}
async function flushClickEvents(){
  if(!_clickEventBuffer.length || !isLoggedIn()) return;
  const events = _clickEventBuffer.splice(0, _clickEventBuffer.length);
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    await fetch(`${workerBase}/track/click`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({events}), keepalive:true});
  }catch(e){ /* best-effort -- a lost batch of clicks isn't worth retrying or blocking on */ }
}
function initClickTracking(){
  document.addEventListener('click', (e)=>{
    if(!isLoggedIn()) return;
    _clickEventBuffer.push({page: currentPageLabel(), element: describeClickTarget(e.target), ts: new Date().toISOString()});
    if(_clickEventBuffer.length >= 50) flushClickEvents(); // flush early on a burst rather than waiting for the timer
  }, true); // capture phase -- still captures the click even if some handler later calls stopPropagation
  setInterval(flushClickEvents, CLICK_BATCH_FLUSH_INTERVAL_MS);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushClickEvents(); });
  window.addEventListener('beforeunload', flushClickEvents);
}

async function initApp(){
  // Started before anything renders, so every table the app ever builds -- including the ones
  // behind the login gate and inside modals -- gets its headers aligned to its data.
  startHeaderAlignmentSync();
  const urlParams = new URLSearchParams(window.location.search);
  const setupToken = urlParams.get('setupToken');
  if(setupToken){
    renderAccountSetupPage(setupToken);
    return;
  }
  const resetToken = urlParams.get('resetToken');
  if(resetToken){
    renderResetPasswordPage(resetToken);
    return;
  }
  const verifyToken = urlParams.get('verifyToken');
  if(verifyToken){
    renderVerifyEmailPage(verifyToken);
    return;
  }
  try {
    DATA = await loadData();
  } catch (err) {
    document.getElementById('main').innerHTML =
      '<div style="padding:24px;color:#b3261e;">Failed to load app data: ' + (err && err.message ? err.message : err) +
      '<br><br>If this is an older browser without gzip decompression support, try updating it or opening in a different browser.</div>';
    console.error('Data load failed', err);

  }

  // conversation notes on why this is a UI-level gate, not real access control: DATA is already
  // fully loaded into the page by this point regardless (loadData() above runs unconditionally),
  // so this stops someone from using the app through the normal UI, not from viewing source.
  if(!isLoggedIn()){
    renderAuthGate(main, ()=>{ renderAccountControls(); renderHomePage(); });
    return;
  }

  renderHomePage();
}

/* ================= Browser Back / Forward =================
   This is a single page, so until now the browser Back button (and the iOS swipe-back gesture /
   Android system back) walked straight out of the app to whatever was in the address bar before
   it -- usually a search page -- no matter how deep you'd navigated inside. Every page-level
   render function is wrapped below so in-app navigation pushes a real history entry, and
   popstate replays it.

   WHY WRAPPING INSTEAD OF EDITING CALL SITES: top-level function declarations become properties
   of the global object, and a bare `renderTeamPage(...)` call resolves through it, so
   reassigning window.renderTeamPage changes what every existing call reaches. ~40 call sites,
   plus the `lastRender` thunks and every inline click handler, are covered without touching one
   of them.

   WHY THE URL DOESN'T CHANGE: pushState is passed the current href deliberately. Encoding page
   state into the path or hash would collide with the ?setupToken=/?resetToken=/?verifyToken=
   entry points initApp() reads, and would advertise deep links that a hard reload can't restore
   (the entries live in memory, not in the URL). Back/forward is the goal here, not shareable
   per-page URLs -- those would need a real serialize/parse layer for every page's arguments. */
const HISTORY_PAGES = ['renderHomePage','renderOddsPage','renderLeagueStatsPage','renderTeamPage',
  'renderTeamHeightPage','renderGamePage','renderPlayerPage','renderHeightTierDetailPage',
  'renderLineHistoryPage','renderAppTrackerPage','renderBetTrackerPage','renderSettingsPage',
  'renderAdminPage'];
// Deliberately NOT in the list: renderAccountSetupPage / renderResetPasswordPage /
// renderVerifyEmailPage (one-shot token landings -- backing into a consumed token is worse than
// leaving the site) and renderAuthGate (backing into a login form you've already passed).

const navEntries = [];   // {name, args, active} -- args held in memory, history.state holds only the index
let navIdx = -1;
let navReplaying = false; // suppresses re-recording while a popstate-driven render runs
let navSkipPops = 0;      // popstate events to swallow (from history.back() we triggered ourselves)

// Equality key for "is this the same page I'm already on". Functions collapse to 'fn' because
// the only function arguments are `returnTo` breadcrumbs, which don't change which page you're
// looking at.
function navArgKey(a){
  if(typeof a === 'function') return 'fn';
  if(a === null || a === undefined) return '';
  if(typeof a === 'object'){
    if(a.gameId != null) return 'g' + a.gameId;
    if(a.id != null) return 'i' + a.id;
    try { return JSON.stringify(a).slice(0, 160); } catch(e){ return 'obj'; }
  }
  return String(a);
}
// Trailing empty args are trimmed so that renderTeamPage('Fever') and the `lastRender` thunk's
// renderTeamPage('Fever', undefined, undefined, undefined) hash to the same page -- without this
// an in-app "Back" button (which always calls the fully-argumented thunk) reads as a brand new
// page and stacks a forward duplicate instead of moving the history pointer back.
function navKey(name, args){
  const parts = [...args].map(navArgKey);
  while(parts.length && parts[parts.length-1] === '') parts.pop();
  return name + '|' + parts.join('~');
}

// The top bar / bottom tab highlight is set by buildTopLinks()'s goHome/goExplorer/... handlers
// BEFORE they call the render function, not by the render function itself -- so calling a render
// function directly on a pop would replay the page with the wrong tab lit. Captured here and
// re-applied on the way back.
function navCaptureActive(){
  const t = document.querySelector('#toplinks button.active');
  const b = document.querySelector('#bottomTabBar button.active');
  return {top: t ? [...document.querySelectorAll('#toplinks button')].indexOf(t) : -1,
          tab: b ? b.id : ''};
}
function navRestoreActive(active){
  if(!active) return;
  const tops = [...document.querySelectorAll('#toplinks button')];
  tops.forEach(b=>b.classList.remove('active'));
  [...document.querySelectorAll('#bottomTabBar button')].forEach(b=>b.classList.remove('active'));
  if(active.top >= 0 && tops[active.top]) tops[active.top].classList.add('active');
  const tabBtn = active.tab && document.getElementById(active.tab);
  if(tabBtn) tabBtn.classList.add('active');
}

// Records a WITHIN-page view change as its own history entry -- a drill-down that swaps what the
// page is showing without re-running its render function. Live Lines is the case: clicking a game
// card and then Top Matchup Bets are two real navigations to the user, but neither re-renders the
// page, so without this the browser Back button jumped straight out of Live Lines from three
// levels deep. `restore` must put the page back into that state without re-fetching.
function navPushSubView(restore){
  if(navReplaying) return;
  navEntries.length = navIdx + 1;
  navEntries.push({name: null, thunk: restore, key: 'subview:' + navEntries.length, active: navCaptureActive()});
  navIdx = navEntries.length - 1;
  try { history.pushState({navIdx}, '', location.href); } catch(e){ /* Safari rate limit */ }
}

function navRecord(name, args){
  if(navReplaying) return;
  const key = navKey(name, args);
  const cur = navEntries[navIdx];
  // Re-rendering the page you're already on (the Top Bets refresh button, the post-login
  // `lastRender()` refresh) must not stack up duplicate history entries.
  if(cur && cur.key === key){ cur.args = args; return; }
  // A render that lands exactly on the previous entry IS a back navigation -- that's what every
  // in-app "← Back" button does via its returnTo thunk. Move the real history pointer with it
  // instead of pushing a forward duplicate, otherwise browser-Back after an in-app Back would
  // take you deeper rather than out.
  const prev = navEntries[navIdx - 1];
  if(prev && prev.key === key){
    navIdx--; navEntries[navIdx].args = args;
    navSkipPops++;      // the render is already happening; ignore the popstate this fires
    history.back();
    return;
  }
  const isFirst = navIdx < 0;
  navEntries.length = navIdx + 1;   // navigating after going back truncates the forward entries
  navEntries.push({name, args, key, active: navCaptureActive()});
  navIdx = navEntries.length - 1;
  try {
    // The landing page REPLACES the entry installHistoryNav() stamped rather than pushing a
    // second one -- otherwise Back from the home page would replay the home page once before
    // finally leaving the site.
    if(isFirst) history.replaceState({navIdx}, '', location.href);
    else history.pushState({navIdx}, '', location.href);
  } catch(e){ /* Safari throttles pushState; navigation still works, just without the entry */ }
}

// What every in-app "← Back" button now calls. Delegating to real browser history rather than
// invoking the returnTo thunk directly keeps the two in lockstep: otherwise an in-app Back would
// render the previous page while the browser's own history pointer stayed put, so the next press
// of the browser Back button would jump FORWARD into the page you'd just left. The thunk is kept
// as the fallback for the one case history can't serve -- the deep-linked first page, where
// there's nothing behind us but the site the user arrived from.
function navBack(fallback){
  if(navIdx > 0){ history.back(); return; }
  if(typeof fallback === 'function') fallback();
}

function installHistoryNav(){
  HISTORY_PAGES.forEach(name=>{
    const orig = window[name];
    if(typeof orig !== 'function') return;
    window[name] = function(...args){
      navRecord(name, args);
      return orig.apply(this, args);
    };
    window[name]._orig = orig;
  });
  // Entry 0, so the first Back press from the landing page is the one that leaves the site.
  try { history.replaceState({navIdx: 0}, '', location.href); } catch(e){}

  window.addEventListener('popstate', (e)=>{
    if(navSkipPops > 0){ navSkipPops--; return; }
    const idx = e.state && typeof e.state.navIdx === 'number' ? e.state.navIdx : 0;
    const entry = navEntries[idx];
    // After a hard reload the in-memory entries are gone while the browser's history isn't.
    // Nothing sensible to replay, so leave the page as-is rather than guessing.
    if(!entry || (!entry.name && !entry.thunk)) return;
    navIdx = idx;
    navReplaying = true;
    try {
      navRestoreActive(entry.active);
      if(entry.thunk){
        // A within-page view (see navPushSubView) -- restores state on the page that's already
        // rendered, so no nav reset and no re-render of the page around it.
        entry.thunk();
      } else {
        nav.innerHTML = ''; nav.style.display = 'none';
        const fn = window[entry.name] && window[entry.name]._orig;
        if(fn) fn.apply(null, entry.args);
      }
    } finally { navReplaying = false; }
  });
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');

// Entirely derived from box scores already loaded client-side \u2014 no extra data source needed.
// For every stat + position bucket, ranks all 15 teams by how much of that stat they've allowed
// per game to opposing players of that position, season-long. Rank 1 = stingiest defense (fewest

// Buckets ESPN's position strings (G, F, C, and hybrids like "G-F") down to a single primary
// position by taking whichever letter appears first \u2014 the simplification broadcasts use too.
function positionBucket(pos){
  if(!pos) return null;
  const p = String(pos).toUpperCase();
  if(p.indexOf('C')===0) return 'C';
  if(p.indexOf('F')===0) return 'F';
  if(p.indexOf('G')===0) return 'G';
  return null;
}

// A player's position isn't stored on her season summary, only per-game box score rows \u2014
// so this scans every game once (cached after first call) and takes each player's most
// frequently listed position across the season as her "primary" position.
let _playerPositionCache = null;
function getPlayerPosition(playerName, team){
  if(!_playerPositionCache){
    _playerPositionCache = {};
    Object.values(DATA.games).forEach(g=>{
      g.rows.forEach(r=>{
        if(!r.pos) return;
        const key = r.player+'|'+r.team;
        if(!_playerPositionCache[key]) _playerPositionCache[key] = {};
        _playerPositionCache[key][r.pos] = (_playerPositionCache[key][r.pos]||0) + 1;
      });
    });
  }
  const counts = _playerPositionCache[playerName+'|'+team];
  if(!counts) return null;
  let best=null, bestCount=-1;
  Object.entries(counts).forEach(([pos,c])=>{ if(c>bestCount){ best=pos; bestCount=c; } });
  return best;
}

// need the bigger sample), cached after first computation since it scans every game once.
let _defenseVsPositionCache = null;
function computeDefenseVsPosition(){
  if(_defenseVsPositionCache) return _defenseVsPositionCache;
  const STAT_KEYS = PROP_STAT_KEYS;
  const BUCKETS = ['G','F','C'];
  const allowed = {};
  TEAM_NAMES.forEach(team=>{

    BUCKETS.forEach(b=>{ allowed[team][b] = (()=>{ const z={}; PROP_STAT_KEYS.forEach(k=>{z[k]=0;}); return z; })(); });
  });
  Object.values(DATA.games).forEach(g=>{
    g.rows.forEach(r=>{
      if(r.dnp) return;
      const bucket = positionBucket(r.pos);
      if(!bucket) return;
      const defTeam = r.team===g.home ? g.away : g.home;
      if(!allowed[defTeam]) return;
      const acc = allowed[defTeam][bucket];
      // Combos are summed from the same row, so adding a combination to COMBO_STAT_PARTS needs
      // no change here.
      PROP_STAT_KEYS.forEach(k=>{ acc[k] += (COMBO_STAT_PARTS[k] ? (comboFrom(r, k) || 0) : (r[k] || 0)); });
    });
  });

  const perGame = {};
  TEAM_NAMES.forEach(team=>{
    const gp = DATA.teams[team] ? DATA.teams[team].gameIdsFull.length : 0;
    perGame[team] = {};
    BUCKETS.forEach(b=>{
      perGame[team][b] = {};
      STAT_KEYS.forEach(k=>{ perGame[team][b][k] = gp ? allowed[team][b][k]/gp : null; });
    });
  });

  const ranks = {};
  TEAM_NAMES.forEach(team=>{ ranks[team] = {G:{},F:{},C:{}}; });
  BUCKETS.forEach(bucket=>{
    STAT_KEYS.forEach(statKey=>{
      const withData = TEAM_NAMES.filter(t=> perGame[t][bucket][statKey]!==null);
      const sorted = withData.slice().sort((a,b)=> perGame[a][bucket][statKey]-perGame[b][bucket][statKey]);
      sorted.forEach((team,i)=>{
        ranks[team][bucket][statKey] = { rank: i+1, of: sorted.length, perGame: Math.round(perGame[team][bucket][statKey]*10)/10 };

// better or worse recently, which a season-long average would smooth over. A team with fewer
// than N games played uses however many it has. cutoffDate (optional) restricts to that team's
// N most recent games strictly BEFORE that date -- for showing what a defense's rank actually
// was right before some specific past game, not leaking in games that happened after.

const _dvpBaselineAsOfCache = {};
function computeDvpBaselineAsOf(cutoffDate){
  if(_dvpBaselineAsOfCache[cutoffDate]) return _dvpBaselineAsOfCache[cutoffDate];
  const ranks = computeDefenseVsPositionAsOf(cutoffDate);
  const baseline = {};
  ['G','F','C'].forEach(b=>{

    PROP_STAT_KEYS.forEach(k=>{

// ================= "Her share" of a position-group Allowed/Gm number =================
// Allowed/Gm is computed against her whole position group (every player on her team who shares
// her position bucket, combined) -- this estimates what fraction of that number might
// reasonably belong to HER specifically, using her share of the group's total minutes played
// as a proxy for her share of the group's production. This is an opportunity-share proxy, not a
// production-share measurement -- a player who's more (or less) productive per minute than her
// position-mates would have a real share above (or below) her minutes share. Still a much more
// specific number than the flat, undifferentiated team-wide Allowed/Gm on its own.
// gamesOverride, when given, replaces the window entirely with an explicit list of her game-log
// entries -- that's how the height-tier breakdown asks the same question over just her games
// against short/middle/tall opposing groups, without duplicating any of this maths.
function computePositionMinutesShare(playerName, team, windowSize, gamesOverride){
  const bucket = positionBucket(getPlayerPosition(playerName, team));
  if(!bucket) return null;
  const key = playerName+'|'+team;
  const rec = DATA.fullPlayerLogs[key];
  if(!rec) return null;
  const herGames = gamesOverride || windowSlice(rec.log.filter(g=>!g.dnp), windowSize); // her own last N games actually played, oldest-first same as windowSlice's convention elsewhere
  if(!herGames.length) return null;
  let herMin = 0, groupMin = 0;
  herGames.forEach(g=>{
    herMin += g.min || 0;
    const gameId = findGameIdForTeamDate(team, g.date);
    const gameRec = gameId ? DATA.games[gameId] : null;
    if(!gameRec) return;
    gameRec.rows.filter(r=>r.team===team && !r.dnp && positionBucket(r.pos)===bucket).forEach(r=>{
      groupMin += r.min || 0;
    });
  });
  if(groupMin<=0) return null;
  return { share: herMin/groupMin, herMin, groupMin, gp: herGames.length, bucket };
}
// Combines the share above with the opponent's existing Allowed/Gm number for one stat, and
// returns a ready-to-display node (or null if either input is unavailable). Uses the
// season-long defense rank for 'all'/undefined, and the matching windowed version (L5/L10/L15)
// otherwise, same distinction the rest of the app already makes for Allowed/Gm and DvP.
function buildHerShareNode(playerName, team, opponentTeam, statKey, windowSize, gamesOverride){
  const shareData = computePositionMinutesShare(playerName, team, windowSize, gamesOverride);
  if(!shareData) return null;
  const rank = (!windowSize || windowSize==='all')
    ? getDefenseRank(opponentTeam, statKey, shareData.bucket)
    : getDefenseRankWindow(opponentTeam, statKey, shareData.bucket, windowSize);
  if(!rank || rank.perGame===null || rank.perGame===undefined) return null;
  const herShare = shareData.share * rank.perGame;
  const span = document.createElement('span');
  span.textContent = herShare.toFixed(1);
  return span;
}

// ================= "Her share" of a position-group's actual STAT PRODUCTION =================
// Same position-group framing as the minutes-share version above, but measuring her share of
// the group's actual points/rebounds/assists/etc instead of her share of the group's minutes.
// This is the more accurate of the two -- it doesn't assume production scales evenly with
// playing time, which is exactly the gap the minutes-share version's info icon flags -- but
// it's read from her own team's recent production, same window either way, not a measurement of
// the upcoming opponent (no app has play-by-play tracking of who guarded whom).
function computePositionProductionShare(playerName, team, statKey, windowSize, gamesOverride){
  const bucket = positionBucket(getPlayerPosition(playerName, team));
  if(!bucket) return null;
  const key = playerName+'|'+team;
  const rec = DATA.fullPlayerLogs[key];
  if(!rec) return null;
  const herGames = gamesOverride || windowSlice(rec.log.filter(g=>!g.dnp), windowSize);
  if(!herGames.length) return null;
  function statVal(g){ return statValue(g, statKey) || 0; }
  let herStat = 0, groupStat = 0;
  herGames.forEach(g=>{
    herStat += statVal(g);
    const gameId = findGameIdForTeamDate(team, g.date);
    const gameRec = gameId ? DATA.games[gameId] : null;
    if(!gameRec) return;
    gameRec.rows.filter(r=>r.team===team && !r.dnp && positionBucket(r.pos)===bucket).forEach(r=>{
      groupStat += statVal(r);
    });
  });
  if(groupStat<=0) return null;
  return { share: herStat/groupStat, herStat, groupStat, gp: herGames.length, bucket };
}
function buildHerProductionShareNode(playerName, team, opponentTeam, statKey, windowSize, gamesOverride){
  const shareData = computePositionProductionShare(playerName, team, statKey, windowSize, gamesOverride);
  if(!shareData) return null;
  const rank = (!windowSize || windowSize==='all')
    ? getDefenseRank(opponentTeam, statKey, shareData.bucket)
    : getDefenseRankWindow(opponentTeam, statKey, shareData.bucket, windowSize);
  if(!rank || rank.perGame===null || rank.perGame===undefined) return null;
  const herShare = shareData.share * rank.perGame;
  const span = document.createElement('span');
  span.textContent = herShare.toFixed(1);
  return span;
}

// ================= Injuries =================
// Populated by the pipeline's ESPN injury-report fetch (see fetch_injuries.py), merged into
// DATA.injuries[shortTeam] = [{player, position, status, detail, date}, ...]. Missing/empty
// is handled gracefully throughout \u2014 the pipeline step is best-effort and can come up empty.

// "Key player" = averages 23+ minutes per game this season (current season only; averages
// aren't tracked per-year yet). Uses the same summaryFull.averages data already loaded for
// everything else on the Team Explorer pages.
function isKeyPlayer(playerName, team){
  const t = DATA.teams[team];
  if(!t) return false;
  const row = t.summaryFull.averages.find(r=>r.player===playerName);
  return !!(row && row.min!==null && row.min!==undefined && row.min>=23);
}

function teamInjuries(team){
  return (DATA.injuries && DATA.injuries[team]) || [];
}

// Buckets ESPN's free-text status into a rough severity so the UI can color-code it. Checks
// substrings rather than an exact match since ESPN's exact wording has changed before.
function injuryStatusSeverity(status){
  if(!status) return 'unknown';
  const s = String(status).toLowerCase();
  if(s.includes('out') || s.includes('injured reserve') || s.includes('suspension')) return 'out';
  if(s.includes('doubtful')) return 'doubtful';
  if(s.includes('questionable') || s.includes('day-to-day') || s.includes('day to day') || s.includes('game-time')) return 'questionable';
  return 'other';
}
const INJURY_SEVERITY_COLOR = {out:'var(--red)', doubtful:'var(--red)', questionable:'var(--ink)', other:'var(--sub)', unknown:'var(--sub)'};

// How this player's per-game production has differed, historically, in games her teammate
// missed vs played -- for every teammate CURRENTLY listed as officially out. Cross-references
// by date (both players are on the same team, so at most one game per date), not by any shared
// game id, since player logs don't store one directly.
// The bar below which a change is called "Insignificant" rather than reported as a real shift.
// PRA gets double the bar since it's a sum of the other three -- the same-size swing in each
// individual stat would otherwise look artificially bigger once combined. 3PM gets a much SMALLER
// bar than points/rebounds/assists: a typical rotation player makes 0.5-2 threes a game, so a full
// made three per game is an enormous move, and a 1.0 bar would dismiss nearly every real change as
// noise. Half a three a game is ~1.5 points -- a genuinely bettable shift.
// A two-stat combination gets 1.5 -- above the 1.0 a single stat gets, below the 2.0 PRA gets for
// summing three.
const TEAMMATE_OUT_INSIGNIFICANT_THRESHOLD = {pts:1.0, reb:1.0, ast:1.0, tpm:0.5, pra:2.0, pr:1.5, pa:1.5, ra:1.5};
// For a player, computes her per-game production against opposing same-position players,
// bucketed into three tiers by that opponent group's minutes-weighted height. Tier boundaries
// (terciles) are fixed from her FULL season, so "shortest/middle/tallest" means the same thing
// no matter which window (L5/L10/L15/season) ends up being displayed -- otherwise a 5-game
// window's own min/max would make the tiers incomparable across window sizes.
// This is a proxy, not real defensive matchup data -- "opposing players at her position," not
// "who actually guarded her." No box-score source tracks real defensive assignments.
// Current in-app season -- the one live data actually covers right now. Update this the day a
// new season's data replaces this as "current" (and DATA.fullPlayerLogs/DATA.games start
// reflecting that new season instead).
const CURRENT_SEASON = '2026';

// Historical seasons are expected to eventually live at DATA.historicalSeasons[year], each
// shaped exactly like the top-level current-season data: {fullPlayerLogs: {...}, games: {...}}
// with the same key conventions (fullPlayerLogs keyed by "PlayerName|TEAM", games keyed by
// gameId). That data doesn't exist yet -- until it's added to the pipeline and uploaded, every
// season other than CURRENT_SEASON will correctly report "no data" rather than silently break.
function getSeasonData(season){
  if(!season || season===CURRENT_SEASON) return { fullPlayerLogs: DATA.fullPlayerLogs, games: DATA.games };
  return (DATA.historicalSeasons && DATA.historicalSeasons[season]) || null;
}
// Every season currently loaded (current + whichever historical years actually have data) --
// used both to populate the season dropdown and to build the "All" (career) combined view.
function availableSeasonsForDropdown(){
  const years = [CURRENT_SEASON];
  if(DATA.historicalSeasons) Object.keys(DATA.historicalSeasons).forEach(y=>{ if(!years.includes(y)) years.push(y); });
  return years.sort().reverse(); // most recent first
}

function computeHeightTierData(playerName, team, season){
  const key = playerName+'|'+team;
  let combinedLog = [];
  let gamesLookup = {};
  if(season==='all'){
    // Combine every season currently loaded -- right now that's just CURRENT_SEASON, but this
    // automatically picks up historical years the moment they're added to DATA.historicalSeasons,
    // no further code changes needed here.
    let anyFound = false;
    availableSeasonsForDropdown().forEach(yr=>{
      const sd = getSeasonData(yr);
      // sd.fullPlayerLogs must be checked, not just sd -- make_season_data.py's season_YEAR.json
      // currently emits {season, teams, teamVenues, playerBios, games} with NO fullPlayerLogs at
      // all, so the moment a historical season is wired into DATA.historicalSeasons in that
      // shape, `sd.fullPlayerLogs[key]` would throw a TypeError and take the whole page down.
      if(sd && sd.fullPlayerLogs && sd.fullPlayerLogs[key]){
        anyFound = true;
        combinedLog = combinedLog.concat(sd.fullPlayerLogs[key].log.map(g=>Object.assign({}, g, {_season:yr})));
        // CAVEAT for whenever historical data actually gets built: if gameIds are ever reused
        // across seasons (e.g. each season's numbering restarts from a similar range), this
        // Object.assign would silently let a later season's game overwrite an earlier season's
        // same-numbered game. Worth a quick check against the real pipeline output once historical
        // seasons are actually wired in -- if IDs collide, this needs a season-namespaced key
        // instead (e.g. `${yr}-${gameId}`) on both this lookup and findGameIdForTeamDate below.
        Object.assign(gamesLookup, sd.games);
      }
    });
    if(!anyFound) return null;
  } else {
    const sd = getSeasonData(season);
    // Same guard as the 'all' branch above: a season file present but shaped without
    // fullPlayerLogs is "not usable yet", not a crash.
    if(!sd || !sd.fullPlayerLogs) return { noData: true, season }; // season selected but not loaded into the app yet
    const rec = sd.fullPlayerLogs[key];
    if(!rec) return null;
    combinedLog = rec.log;
    gamesLookup = sd.games;
  }

  const bucket = positionBucket(getPlayerPosition(playerName, team));
  if(!bucket) return null;

  const gamesWithOppHeight = combinedLog.filter(g=>!g.dnp).map(g=>{
    const gameId = findGameIdForTeamDate(team, g.date);
    if(!gameId) return null;
    const gameRec = gamesLookup[gameId];
    if(!gameRec) return null;
    const oppRows = gameRec.rows.filter(r=>r.team!==team && !r.dnp && positionBucket(r.pos)===bucket && (r.min||0)>0);
    if(!oppRows.length) return null;
    let totalMin = 0, weightedSum = 0;
    oppRows.forEach(r=>{
      const bio = bioLookup(r.player, r.team);
      if(bio.heightIn===undefined || bio.heightIn===null) return;
      totalMin += r.min; weightedSum += bio.heightIn*r.min;
    });
    if(totalMin<=0) return null;
    // Carries the player's FULL box score line for this game, not just the five headline stats
    // -- the tier detail page shows all of them. Shooting percentages come straight off the log
    // (already computed per game by the pipeline) rather than being recomputed here, so they
    // match what every other table in the app shows for the same game.
    return {
      date: g.date, gameId, opp: g.opp, oppHeight: weightedSum/totalMin,
      homeAway: g.homeAway, starter: !!g.starter,
      min: g.min||0, pts: g.pts||0,
      fgm: g.fgm||0, fga: g.fga||0, fgPct: g.fgPct,
      tpm: g.tpm||0, tpa: g.tpa||0, tpPct: g.tpPct,
      ftm: g.ftm||0, fta: g.fta||0, ftPct: g.ftPct,
      oreb: g.oreb||0, dreb: g.dreb||0, reb: g.reb||0,
      ast: g.ast||0, stl: g.stl||0, blk: g.blk||0,
      to: g.to||0, pf: g.pf||0, plusMinus: g.plusMinus,
      pra: (g.pts||0)+(g.reb||0)+(g.ast||0),
      pr: (g.pts||0)+(g.reb||0), pa: (g.pts||0)+(g.ast||0), ra: (g.reb||0)+(g.ast||0),
    };
  }).filter(Boolean);

  if(gamesWithOppHeight.length < 6) return null; // too few games all season to tier into three groups meaningfully at all

  const sortedHeights = gamesWithOppHeight.map(g=>g.oppHeight).slice().sort((a,b)=>a-b);
  function percentile(arr, p){
    const idx = (arr.length-1)*p;
    const lo = Math.floor(idx), hi = Math.ceil(idx);
    return lo===hi ? arr[lo] : arr[lo] + (arr[hi]-arr[lo])*(idx-lo);
  }
  const p33 = percentile(sortedHeights, 1/3), p67 = percentile(sortedHeights, 2/3);
  gamesWithOppHeight.forEach(g=>{ g.tier = g.oppHeight<p33 ? 'shortest' : (g.oppHeight<=p67 ? 'middle' : 'tallest'); });
  gamesWithOppHeight.sort((a,b)=>a.date.localeCompare(b.date)); // oldest first, so .slice(-N) gets the most recent N

  return { bucket, p33, p67, allGames: gamesWithOppHeight };
}
// windowSize: null/undefined = full season, else last N games chronologically (matching this
// app's usual L5/L10/L15 convention elsewhere).
function heightTierStatsForWindow(heightData, windowSize){
  const games = windowSize ? heightData.allGames.slice(-windowSize) : heightData.allGames;
  const byTier = {shortest:[], middle:[], tallest:[]};
  games.forEach(g=>byTier[g.tier].push(g));
  const STAT_KEYS = PROP_STAT_KEYS;
  const result = {};
  ['shortest','middle','tallest'].forEach(tierName=>{
    const tGames = byTier[tierName];
    const stats = {};
    STAT_KEYS.forEach(k=>{
      const vals = tGames.map(g=>g[k]);
      const n = vals.length;
      const avg = n ? Math.round((vals.reduce((a,b)=>a+b,0)/n)*10)/10 : null;
      const variance = computeVariance(vals); // already returns null for n<2
      const stdDev = variance!==null ? Math.round(Math.sqrt(variance)*100)/100 : null;
      stats[k] = { avg, variance, stdDev, n };
    });
    result[tierName] = stats;
  });
  return result;
}

// Renders the vs-opposing-position-height section with its own L5/L10/L15/Season toggle
// (independent of the page's main window selector, since this needs its own fixed-tier-boundary
// logic regardless of what window the rest of the page is showing).
// Player name, avg minutes (last 15 games played), height, and injury status for every player
// on her NEXT opponent who shares her position bucket -- async since the next opponent comes
// from the live odds feed, not season data. Injury status is deliberately collapsed to exactly
// the three categories asked for: Healthy (no notable injury on file), Day-To-Day, or Out.
// Shared between renderNextOpponentPositionSection (full breakdown display) and
// buildHeightTierSection (which, in Compact mode, uses just the resulting tier to decide which
// one of Shortest/Middle/Tallest is most relevant to show by default -- the one matching her
// actual next opponent, rather than all three at once).
// The synchronous core of computeNextOpponentGroupTier: given an opponent that's ALREADY known,
// works out that team's rotation at her position, each player's tier against her own season
// cutoffs, and the minutes-weighted tier of the group as a whole. Split out so the Specials tab
// (which knows the opponent from the bet itself) can ask the same question without going through
// the async next-opponent lookup.
function computePositionGroupTierVsOpponent(bucket, opp, heightTierData){
  function tierFor(heightIn){
    if(!heightTierData || heightIn===undefined || heightIn===null) return null;
    if(heightIn < heightTierData.p33) return 'shortest';
    if(heightIn <= heightTierData.p67) return 'middle';
    return 'tallest';
  }
  const rows = Object.keys(DATA.fullPlayerLogs)
    .filter(k => k.slice(k.lastIndexOf('|')+1) === opp)
    .map(k=>{
      const pname = k.slice(0, k.lastIndexOf('|'));
      if(positionBucket(getPlayerPosition(pname, opp)) !== bucket) return null;
      const rec = DATA.fullPlayerLogs[k];
      const recentGames = rec.log.filter(g=>!g.dnp).slice(-15);
      if(!recentGames.length) return null; // hasn't played recently -- not a real rotation piece to list
      const avgMin = Math.round((recentGames.reduce((a,g)=>a+(g.min||0),0)/recentGames.length)*10)/10;
      const bio = bioLookup(pname, opp);
      const inj = teamInjuries(opp).find(i=>i.player===pname);
      const note = inj ? noteworthyInjuryStatus(inj.status) : null;
      const status = note==='out' ? 'Out' : (note==='dayToDay' ? 'Day-To-Day' : 'Healthy');
      const tier = tierFor(bio.heightIn);
      return { player: pname, avgMin, heightIn: bio.heightIn, height: bio.height || '—', tier: tier ? tier.charAt(0).toUpperCase()+tier.slice(1) : null, status };
    }).filter(Boolean).sort((a,b)=>b.avgMin-a.avgMin);

  // Players ruled OUT are excluded from the minutes-weighted height: if their 6'8" centre is out
  // tonight, the group she actually faces IS shorter, and leaving that player in the average
  // reports a tier she won't see. Day-To-Day is kept -- those players usually suit up, and
  // dropping them would swing the tier on a maybe.
  const measurable = r => r.heightIn !== undefined && r.heightIn !== null && r.avgMin > 0;
  const available = rows.filter(r => measurable(r) && r.status !== 'Out');
  // If literally everyone measurable is out, fall back to the full group rather than reporting no
  // tier at all -- a stale tier is more useful than a blank one.
  const withHeight = available.length ? available : rows.filter(measurable);
  const excludedForInjury = available.length ? rows.filter(r => measurable(r) && r.status === 'Out').length : 0;
  let groupTier = null, weightedHeight = null;
  if(withHeight.length){
    const totalMin = withHeight.reduce((a,r)=>a+r.avgMin,0);
    weightedHeight = withHeight.reduce((a,r)=>a+r.heightIn*r.avgMin,0)/totalMin;
    groupTier = tierFor(weightedHeight); // lowercase ('shortest'/'middle'/'tallest') -- matches the keys buildHeightTierSection's stats object uses
  }
  return { bucket, opp, rows, groupTier, weightedHeight, excludedForInjury };
}

async function computeNextOpponentGroupTier(playerName, team, heightTierData){
  const bucket = positionBucket(getPlayerPosition(playerName, team));
  if(!bucket) return null;
  const opp = await fetchNextOpponent(team);
  if(!opp) return null;
  return computePositionGroupTierVsOpponent(bucket, opp, heightTierData);
}


async function renderNextOpponentPositionSection(container, playerName, team, heightTierData, windowMode){
  container.textContent = 'Looking up next opponent\u2026';
  const result = await computeNextOpponentGroupTier(playerName, team, heightTierData);
  if(!result){ container.textContent = 'Position unavailable, or no upcoming game found.'; return null; }
  renderNextOpponentPositionSectionFromResult(container, playerName, team, heightTierData, result);
  return result;
}

// on the player page itself) can feed this AND the "Estimated Share of Allowed/Gm" section AND

  const table = document.createElement('table'); table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12.5px;';
