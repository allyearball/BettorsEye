  const forgotEmailInput = document.createElement('input');
  forgotEmailInput.type = 'email'; forgotEmailInput.placeholder = 'Email'; forgotEmailInput.autocomplete = 'email';
  forgotEmailInput.style.cssText = emailInput.style.cssText;
  const forgotStatus = document.createElement('div');
  forgotStatus.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';
  const forgotBtn = document.createElement('button'); forgotBtn.className = 'addbtn'; forgotBtn.textContent = 'Send Reset Link';

  forgotLink.addEventListener('click', ()=>{
    forgotWrap.style.display = forgotWrap.style.display === 'none' ? 'block' : 'none';
  });
  forgotBtn.addEventListener('click', async ()=>{
    forgotStatus.style.color = 'var(--sub)';
    const email = forgotEmailInput.value.trim();
    if(!email){ forgotStatus.style.color = '#b3261e'; forgotStatus.textContent = 'Enter your email.'; return; }
    forgotBtn.disabled = true; forgotBtn.textContent = 'Sending\u2026';
    try{
      const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
      const result = await fetchJson(`${workerBase}/auth/forgot-password`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})});
      forgotStatus.style.color = 'var(--green)';
      forgotStatus.textContent = result.message || 'If an account exists with that email, a reset link has been sent.';
    }catch(e){
      forgotStatus.style.color = '#b3261e';
      forgotStatus.textContent = extractErrorMessage(e);
    }
    forgotBtn.disabled = false; forgotBtn.textContent = 'Send Reset Link';
  });

  forgotWrap.appendChild(forgotSub);
  forgotWrap.appendChild(forgotEmailInput);
  forgotWrap.appendChild(forgotStatus);
  forgotWrap.appendChild(forgotBtn);

  wrap.appendChild(emailInput);
  wrap.appendChild(pwInput);
  wrap.appendChild(signupFieldsWrap);
  wrap.appendChild(errorDiv);
  wrap.appendChild(btnRow);
  // toggleLink (switches to Sign Up mode) intentionally not appended -- self-signup is hidden
  // for now, per request. The form stays permanently in 'login' mode (its default), which also
  // still correctly handles the "set your password" prompt for admin-created accounts. The
  // signup backend endpoint itself is untouched, just unreachable from this UI.
  wrap.appendChild(document.createElement('br'));
  wrap.appendChild(forgotLink);
  wrap.appendChild(forgotWrap);
  container.appendChild(wrap);
}

function renderAdminPage(){
  lastRender = () => renderAdminPage();
  main.innerHTML = '';
  removeGameWindowStickyBar();

  if(!isLoggedIn()){
    renderAuthGate(main, ()=>renderAdminPage());
    return;
  }
  if(!isAdminUser()){
    main.innerHTML = '<div style="padding:24px;color:#b3261e;">Admin access required. If you believe this is wrong, log out and back in \u2014 admin status is only refreshed on login.</div>';
    return;
  }

  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\ud83d\udee1\ufe0f Admin</h2><div class="meta">Manage user accounts.</div>`;
  main.appendChild(head);

  const backLink = document.createElement('a'); backLink.href='javascript:void(0)'; backLink.className='backbtn';
  backLink.textContent = '\u2190 Back to Bet Tracker';
  backLink.addEventListener('click', ()=>renderBetTrackerPage());
  main.appendChild(backLink);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.marginBottom='14px';
  statusDiv.textContent = 'Loading users\u2026';
  main.appendChild(statusDiv);

  // ---- Create User ----
  const createSec = document.createElement('div');
  createSec.style.cssText = 'max-width:420px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:20px;';
  const createTitle = document.createElement('div'); createTitle.style.cssText = 'font-weight:800;font-size:15px;margin-bottom:4px;';
  createTitle.textContent = 'Create User';
  const createNote = document.createElement('div'); createNote.className = 'footnote'; createNote.style.marginBottom = '14px';
  createNote.textContent = 'No password needed here \u2014 they set their own the first time they log in with this email (any password value on that first attempt triggers a "create your password" prompt).';
  function styledInput(placeholder, type){
    const inp = document.createElement('input');
    inp.type = type || 'text'; inp.placeholder = placeholder;
    inp.style.cssText = 'width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--sans);box-sizing:border-box;display:block;';
    return inp;
  }
  const cEmail = styledInput('Email', 'email');
  const cUsername = styledInput('Username (3-20 chars, letters/numbers/underscore)');
  const cFirst = styledInput('First Name');
  const cLast = styledInput('Last Name (optional)');
  const cBirthdayLabel = document.createElement('div'); cBirthdayLabel.className='footnote'; cBirthdayLabel.style.cssText='margin:-4px 0 4px;';
  cBirthdayLabel.textContent = 'Birthday';
  const cBirthday = styledInput('', 'date');
  const createStatus = document.createElement('div'); createStatus.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';
  const createBtn = document.createElement('button'); createBtn.className = 'addbtn'; createBtn.textContent = 'Create User';
  createBtn.addEventListener('click', async ()=>{
    createStatus.style.color = '#b3261e'; createStatus.textContent = '';
    if(!cEmail.value.trim() || !cUsername.value.trim() || !cFirst.value.trim() || !cBirthday.value){
      createStatus.textContent = 'Email, username, first name, and birthday are all required.'; return;
    }
    createBtn.disabled = true; createBtn.textContent = 'Creating\u2026';
    try{
      const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
      const result = await fetchJson(`${workerBase}/admin/create-user`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({
        email: cEmail.value.trim(), username: cUsername.value.trim(), firstName: cFirst.value.trim(), lastName: cLast.value.trim(), birthday: cBirthday.value,
      })});
      if(result.error) throw new Error(result.error);
      if(result.emailSent){
        createStatus.style.color = 'var(--green)';
        createStatus.textContent = `Created and invite email sent to ${result.email}.`;
      } else if(result.setupUrl){
        createStatus.style.color = '#b3261e';
        createStatus.textContent = `Account created for ${result.email}, but the invite email failed to send (${result.emailError || 'unknown error'}). Copy the link below and send it to them yourself instead:`;
        const linkRow = document.createElement('div'); linkRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:8px;';
        const linkInput = document.createElement('input'); linkInput.type='text'; linkInput.readOnly = true; linkInput.value = result.setupUrl;
        linkInput.style.cssText = 'flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:monospace;background:#f4f5f7;';
        const copyBtn = document.createElement('button'); copyBtn.textContent = 'Copy'; copyBtn.className = 'addbtn';
        copyBtn.addEventListener('click', async ()=>{
          try{ await navigator.clipboard.writeText(result.setupUrl); copyBtn.textContent = 'Copied!'; setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1500); }
          catch(e){ linkInput.select(); }
        });
        linkRow.appendChild(linkInput); linkRow.appendChild(copyBtn);
        createStatus.appendChild(document.createElement('br'));
        createStatus.appendChild(linkRow);
      } else {
        createStatus.style.color = '#b3261e';
        createStatus.textContent = `Account created for ${result.email}, but the invite email failed to send: ${result.emailError || 'unknown error'}. They can still get in \u2014 have them go to the site, click Login/Sign-Up, enter that email and any password, and they\u2019ll be prompted to set their real one.`;
      }
      cEmail.value=''; cUsername.value=''; cFirst.value=''; cLast.value=''; cBirthday.value='';
      await refresh();
    }catch(e){
      createStatus.style.color = '#b3261e';
      createStatus.textContent = extractErrorMessage(e);
    }
    createBtn.disabled = false; createBtn.textContent = 'Create User';
  });
  [createTitle, createNote, cEmail, cUsername, cFirst, cLast, cBirthdayLabel, cBirthday, createStatus, createBtn].forEach(el=>createSec.appendChild(el));
  main.appendChild(createSec);

  const tableDiv = document.createElement('div');
  main.appendChild(tableDiv);

  function extractErrorMessage(err){
    const match = String(err.message||'').match(/\{.*\}/);
    if(match){ try{ const parsed = JSON.parse(match[0]); if(parsed.error) return parsed.error; }catch(_){} }
    return err.message || 'Something went wrong.';
  }

  async function refresh(){
    statusDiv.textContent = 'Loading users\u2026';
    let users;
    try{
      const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
      const result = await fetchJson(`${workerBase}/admin/users`, {headers: authHeaders()});
      users = result.users || [];
    }catch(e){
      statusDiv.textContent = `Couldn\u2019t load users: ${extractErrorMessage(e)}`;
      return;
    }
    statusDiv.textContent = `${users.length} user(s).`;

    tableDiv.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th class="left">Email</th><th class="left">Username</th><th class="left">Name</th><th class="left">Created</th><th>Verified</th><th>Admin</th><th class="left">Locked?</th><th></th></tr>';
    const tbody = document.createElement('tbody');
    table.appendChild(thead); table.appendChild(tbody);
    wrap.appendChild(table); tableDiv.appendChild(wrap);

    const myEmail = getAuthEmail();
    users.forEach(u=>{
      const tr = document.createElement('tr');
      const tdEmail = document.createElement('td'); tdEmail.className='left'; tdEmail.textContent = u.email + (u.email===myEmail ? ' (you)' : '');
      const tdUsername = document.createElement('td'); tdUsername.className='left'; tdUsername.textContent = u.username || '\u2014';
      const tdName = document.createElement('td'); tdName.className='left'; tdName.textContent = [u.first_name, u.last_name].filter(Boolean).join(' ') || '\u2014';
      const tdCreated = document.createElement('td'); tdCreated.className='left'; tdCreated.textContent = (u.created_at||'').slice(0,10);
      const tdVerified = document.createElement('td'); tdVerified.textContent = u.email_verified ? '\u2705' : '\u2014';
      const tdAdmin = document.createElement('td'); tdAdmin.textContent = u.is_admin ? '\ud83d\udee1\ufe0f' : '\u2014';
      const tdLocked = document.createElement('td'); tdLocked.className='left';
      tdLocked.textContent = (u.locked_until && new Date(u.locked_until) > new Date()) ? `Locked until ${new Date(u.locked_until).toLocaleTimeString()}` : '\u2014';

      const tdActions = document.createElement('td'); tdActions.style.cssText='display:flex;gap:8px;';
      const isSelf = u.email === myEmail;

      const adminToggleBtn = document.createElement('button');
      adminToggleBtn.textContent = u.is_admin ? 'Remove Admin' : 'Make Admin';
      adminToggleBtn.style.cssText = 'padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11px;cursor:pointer;font-family:var(--sans);';
      if(isSelf && u.is_admin){ adminToggleBtn.disabled = true; adminToggleBtn.title = 'You can\u2019t remove your own admin status.'; }
      adminToggleBtn.addEventListener('click', async ()=>{
        const makeAdmin = !u.is_admin;
        if(!confirm(`${makeAdmin ? 'Grant' : 'Remove'} admin access ${makeAdmin?'to':'from'} ${u.email}?`)) return;
        try{
          const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
          const result = await fetchJson(`${workerBase}/admin/set-admin`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({userId: u.id, makeAdmin})});
          if(result.error) throw new Error(result.error);
          await refresh();
        }catch(e){ alert(extractErrorMessage(e)); }
      });

      const deleteBtn = document.createElement('button'); deleteBtn.className='rmbtn'; deleteBtn.textContent = '\ud83d\uddd1\ufe0f';
      deleteBtn.title = 'Delete this user and all their data';
      if(isSelf){ deleteBtn.disabled = true; deleteBtn.title = 'You can\u2019t delete your own account here.'; }
      deleteBtn.addEventListener('click', async ()=>{
        if(!confirm(`Permanently delete ${u.email}? This removes their account, sessions, and all tracked bets. This can\u2019t be undone.`)) return;
        try{
          const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
          const result = await fetchJson(`${workerBase}/admin/delete-user`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({userId: u.id})});
          if(result.error) throw new Error(result.error);
          await refresh();
        }catch(e){ alert(extractErrorMessage(e)); }
      });

      const viewBtn = document.createElement('button');
      viewBtn.textContent = '\ud83d\udc41\ufe0f View Data';
      viewBtn.style.cssText = 'padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11px;cursor:pointer;font-family:var(--sans);';
      viewBtn.addEventListener('click', ()=>showAdminUserBetTrackerModal(u.id, u.email));

      const activityBtn = document.createElement('button');
      activityBtn.textContent = '\ud83d\udcca Activity';
      activityBtn.style.cssText = viewBtn.style.cssText;
      activityBtn.addEventListener('click', ()=>showAdminClickEventsModal(u.id, u.email));

      tdActions.appendChild(adminToggleBtn); tdActions.appendChild(viewBtn); tdActions.appendChild(activityBtn); tdActions.appendChild(deleteBtn);
      [tdEmail, tdUsername, tdName, tdCreated, tdVerified, tdAdmin, tdLocked, tdActions].forEach(td=>tr.appendChild(td));
      tbody.appendChild(tr);
    });
  }

  refresh();
}

function renderSettingsPage(activeTab){
  activeTab = activeTab || 'account';
  lastRender = () => renderSettingsPage(activeTab);
  main.innerHTML = '';
  removeGameWindowStickyBar();

  if(!isLoggedIn()){
    renderAuthGate(main, ()=>renderSettingsPage(activeTab));
    return;
  }

  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\u2699\ufe0f Settings</h2><div class="meta">Manage your account.</div>`;
  main.appendChild(head);
  renderVerifyEmailBanner(main);

  // ---- Tab menu ----
  const tabBar = document.createElement('div');
  tabBar.style.cssText = 'display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid var(--line);';
  const tabs = [
    {key:'account', label:'Account Info'},
    {key:'email', label:'Change Email'},
    {key:'password', label:'Change Password'},
  ];
  tabs.forEach(t=>{
    const btn = document.createElement('button');
    btn.textContent = t.label;
    const isActive = t.key === activeTab;
    btn.style.cssText = `padding:9px 16px;border:none;border-bottom:3px solid ${isActive?'var(--navy2)':'transparent'};background:none;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:${isActive?'700':'500'};color:${isActive?'var(--navy2)':'var(--sub)'};`;
    btn.addEventListener('click', ()=>renderSettingsPage(t.key));
    tabBar.appendChild(btn);
  });
  main.appendChild(tabBar);

  function extractErrorMessage(err){
    const match = String(err.message||'').match(/\{.*\}/);
    if(match){ try{ const parsed = JSON.parse(match[0]); if(parsed.error) return parsed.error; }catch(_){} }
    return err.message || 'Something went wrong.';
  }
  function styledInput(type, placeholder, autocomplete){
    const inp = document.createElement('input');
    inp.type = type; if(placeholder) inp.placeholder = placeholder; if(autocomplete) inp.autocomplete = autocomplete;
    inp.style.cssText = 'width:100%;max-width:340px;padding:10px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--sans);box-sizing:border-box;display:block;';
    return inp;
  }
  function sectionBox(){
    const el = document.createElement('div');
    el.style.cssText = 'max-width:400px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:20px;';
    return el;
  }

  if(activeTab === 'account'){
    const sec = sectionBox();
    const fields = [
      {label:'Username', locked:true, value: getAuthUsername() || ''},
      {label:'First Name', key:'firstName', value: getAuthFirstName() || ''},
      {label:'Last Name', key:'lastName', value: getAuthLastName() || '', optional:true},
      {label:'Email', locked:true, value: getAuthEmail() || '', note:'Change this on the "Change Email" tab.'},
      {label:'Birthday', key:'birthday', value: getAuthBirthday() || '', type:'date'},
    ];
    const inputs = {};
    fields.forEach(f=>{
      const label = document.createElement('div');
      label.className = 'footnote'; label.style.cssText = 'margin:0 0 4px;font-weight:700;';
      label.textContent = f.label + (f.optional ? ' (optional)' : '') + (f.locked ? ' \ud83d\udd12' : '');
      sec.appendChild(label);
      if(f.locked){
        const val = document.createElement('div');
        val.style.cssText = 'padding:10px;margin-bottom:4px;background:#f4f5f7;border-radius:6px;color:var(--sub);font-size:14px;';
        val.textContent = f.value || '\u2014';
        sec.appendChild(val);
        if(f.note){ const n = document.createElement('div'); n.className='footnote'; n.style.marginBottom='10px'; n.textContent = f.note; sec.appendChild(n); }
      } else {
        const inp = styledInput(f.type||'text', '', '');
        inp.value = f.value;
        inputs[f.key] = inp;
        sec.appendChild(inp);
      }
    });
    const status = document.createElement('div'); status.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';
    const saveBtn = document.createElement('button'); saveBtn.className = 'addbtn'; saveBtn.textContent = 'Save Changes';
    saveBtn.addEventListener('click', async ()=>{
      status.style.color = '#b3261e'; status.textContent = '';
      if(!inputs.firstName.value.trim()){ status.textContent = 'First name is required.'; return; }
      if(!inputs.birthday.value){ status.textContent = 'Birthday is required.'; return; }
      saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026';
      try{
        const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
        const result = await fetchJson(`${workerBase}/auth/update-profile`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({firstName: inputs.firstName.value.trim(), lastName: inputs.lastName.value.trim(), birthday: inputs.birthday.value})});
        setAuthSession(getAuthToken(), getAuthEmail(), undefined, undefined, {firstName: result.firstName, lastName: result.lastName, birthday: result.birthday});
        status.style.color = 'var(--green)'; status.textContent = 'Saved.';
      }catch(e){
        status.style.color = '#b3261e';
        status.textContent = extractErrorMessage(e);
      }
      saveBtn.disabled = false; saveBtn.textContent = 'Save Changes';
    });
    sec.appendChild(status); sec.appendChild(saveBtn);
    main.appendChild(sec);
  }

  if(activeTab === 'email'){
    const emailSec = sectionBox();
    const emailCurrent = document.createElement('div'); emailCurrent.className = 'footnote'; emailCurrent.style.marginBottom = '14px';
    emailCurrent.textContent = `Current: ${getAuthEmail()}`;
    const newEmailInput = styledInput('email', 'New email', 'email');
    const emailPwInput = styledInput('password', 'Current password (to confirm)', 'current-password');
    const emailStatus = document.createElement('div'); emailStatus.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';
    const emailBtn = document.createElement('button'); emailBtn.className = 'addbtn'; emailBtn.textContent = 'Update Email';
    emailBtn.addEventListener('click', async ()=>{
      emailStatus.style.color = '#b3261e'; emailStatus.textContent = '';
      if(!newEmailInput.value.trim() || !emailPwInput.value){ emailStatus.textContent = 'Enter a new email and your current password.'; return; }
      emailBtn.disabled = true; emailBtn.textContent = 'Updating\u2026';
      try{
        const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
        const result = await fetchJson(`${workerBase}/auth/change-email`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({newEmail: newEmailInput.value.trim(), currentPassword: emailPwInput.value})});
        setAuthSession(getAuthToken(), result.email, result.emailVerified);
        emailStatus.style.color = 'var(--green)'; emailStatus.textContent = 'Email updated.';
        emailCurrent.textContent = `Current: ${result.email}`;
        newEmailInput.value = ''; emailPwInput.value = '';
      }catch(e){
        emailStatus.style.color = '#b3261e';
        emailStatus.textContent = extractErrorMessage(e);
      }
      emailBtn.disabled = false; emailBtn.textContent = 'Update Email';
    });
    emailSec.appendChild(emailCurrent);
    emailSec.appendChild(newEmailInput); emailSec.appendChild(emailPwInput);
    emailSec.appendChild(emailStatus); emailSec.appendChild(emailBtn);
    main.appendChild(emailSec);
  }

  if(activeTab === 'password'){
    const pwSec = sectionBox();
    const pwNote = document.createElement('div'); pwNote.className = 'footnote'; pwNote.style.marginBottom = '14px';
    pwNote.textContent = 'Changing your password logs you out everywhere else \u2014 this device stays logged in.';
    const currentPwInput = styledInput('password', 'Current password', 'current-password');
    const newPwInput = styledInput('password', 'New password (min 8 characters)', 'new-password');
    const newPwConfirm = styledInput('password', 'Confirm new password', 'new-password');
    const pwStatus = document.createElement('div'); pwStatus.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';
    const pwBtn = document.createElement('button'); pwBtn.className = 'addbtn'; pwBtn.textContent = 'Update Password';
    pwBtn.addEventListener('click', async ()=>{
      pwStatus.style.color = '#b3261e'; pwStatus.textContent = '';
      if(!currentPwInput.value || !newPwInput.value){ pwStatus.textContent = 'Fill in all fields.'; return; }
      if(newPwInput.value.length < 8){ pwStatus.textContent = 'New password must be at least 8 characters.'; return; }
      if(newPwInput.value !== newPwConfirm.value){ pwStatus.textContent = 'New passwords don\u2019t match.'; return; }
      pwBtn.disabled = true; pwBtn.textContent = 'Updating\u2026';
      try{
        const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
        const result = await fetchJson(`${workerBase}/auth/change-password`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({currentPassword: currentPwInput.value, newPassword: newPwInput.value})});
        setAuthSession(result.token, getAuthEmail());
        pwStatus.style.color = 'var(--green)'; pwStatus.textContent = 'Password updated.';
        currentPwInput.value = ''; newPwInput.value = ''; newPwConfirm.value = '';
      }catch(e){
        pwStatus.style.color = '#b3261e';
        pwStatus.textContent = extractErrorMessage(e);
      }
      pwBtn.disabled = false; pwBtn.textContent = 'Update Password';
    });
    pwSec.appendChild(pwNote);
    pwSec.appendChild(currentPwInput); pwSec.appendChild(newPwInput); pwSec.appendChild(newPwConfirm);
    pwSec.appendChild(pwStatus); pwSec.appendChild(pwBtn);
    main.appendChild(pwSec);
  }
}

async function trackerAdd(bet){
  // Every path that creates a tracked bet (manual form, history import, bulk JSON import,
  // screenshot parse) funnels through here -- defaulting placedAt centrally means the Time
  // column always has a real placement timestamp, not just for bets imported with one already.
  const withPlacedAt = Object.assign({placedAt: new Date().toISOString()}, bet);
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  return fetchJson(`${workerBase}/tracker/add`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body:JSON.stringify(withPlacedAt)});
}
async function trackerList(){
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  return fetchJson(`${workerBase}/tracker/list`, {headers: authHeaders()});
}
async function trackerUpdate(id, patch){
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  return fetchJson(`${workerBase}/tracker/update`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body:JSON.stringify({id, patch})});
}
async function trackerDelete(id){
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  return fetchJson(`${workerBase}/tracker/delete`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body:JSON.stringify({id})});
}

// Paginated, same reasoning as fetchOddsHistoryCached \u2014 this list can grow by up to ~60
// entries a day (30 Standard + 30 Advanced), so it needs to page from the start rather than
// risk the same 50-subrequest ceiling that broke /history/export before it was fixed.
async function appTrackerListAll(){
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  let all = [];
  let cursor = null;
  let guard = 0;
  while(guard++ < 200){
    const url = cursor ? `${workerBase}/apptracker/list?cursor=${encodeURIComponent(cursor)}` : `${workerBase}/apptracker/list`;
    const page = await fetchJson(url);
    if(page && page.error) throw new Error(page.error);
    all = all.concat(page.records || []);
    if(page.done || !page.cursor) break;
    cursor = page.cursor;
  }
  return all;
}
async function appTrackerUpdate(id, patch){
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  return fetchJson(`${workerBase}/apptracker/update`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id, patch})});
}
async function appTrackerDelete(id){
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  return fetchJson(`${workerBase}/apptracker/delete`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id})});
}

// Current date/time in US Eastern, regardless of the viewer's own timezone \u2014 "12:00pm ET"
// needs to mean the same moment for everyone, not 12pm in whatever timezone the browser is in.
// Converts a game's commence_time (a UTC ISO timestamp) to the calendar date it actually
// falls on in US Eastern time -- the convention this app's own game data (and ESPN's) uses.
// Naively slicing the first 10 characters of a UTC timestamp gets the UTC date instead, which
// is WRONG for any game starting at 8pm ET or later: that's already past midnight UTC, landing
// on the next calendar day. That mismatch was silently storing tomorrow's date on tonight's
// late games, making findHistoricalGame() treat an already-finished game as "not played yet"
// forever, since it never matched DATA.games' actual (correct) date for that game.
function toEasternDateStr(isoString){
  if(!isoString) return '';
  const d = new Date(isoString);
  if(isNaN(d)) return '';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit',
  }).formatToParts(d);
  const get = t => parts.find(p=>p.type===t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}

function nowInEastern(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false,
  }).formatToParts(new Date());
  const get = t => parseInt(parts.find(p=>p.type===t).value, 10);
  return {
    dateStr: `${get('year')}-${String(get('month')).padStart(2,'0')}-${String(get('day')).padStart(2,'0')}`,
    hour: get('hour'), minute: get('minute'),
  };
}

// ================= Live game state (for the Bet cell's second line on the Home page) =================
// Same Worker-proxy pattern as the gap-fill feature \u2014 the Worker fetches ESPN's live
// scoreboard/box score from Cloudflare's network. These two specific routes are unauthenticated
// (public score data) since they're called directly from the browser, not from build.py.
// ================= Cached odds (backend-cached via Worker cron, not fetched live per page load) =================
// Per the architecture recommendation: a Worker Cron Trigger refreshes these in KV on a fixed
// schedule (see odds-api-proxy-worker.js's scheduled() handler), so a page load reads from
// cache instead of spending an Odds API credit every single time. The Worker still falls back
// to a live fetch+cache-write if the cache is empty/stale, so this never just breaks if the
// cron hasn't run yet.
async function fetchCachedOddsEvents(workerBaseOverride){
  const workerBase = workerBaseOverride || (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  const resp = await fetchJson(`${workerBase}/cachedodds/events`);
  if(resp && resp.error) throw new Error(resp.error);
  return resp.data || [];
}
async function fetchCachedOddsDetail(eventId, workerBaseOverride){
  const workerBase = workerBaseOverride || (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  const resp = await fetchJson(`${workerBase}/cachedodds/detail?eventId=${eventId}`);
  if(resp && resp.error) throw new Error(resp.error);
  return resp.data || null;
}

async function fetchLiveGamesToday(){
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    if(!workerBase) return [];
    const et = nowInEastern();
    const data = await fetchJson(`${workerBase}/livegames?date=${et.dateStr}`);
    if(data && data.error) throw new Error(data.error);
    return data.games || [];
  }catch(e){ console.warn('Live games fetch failed', e); return []; }
}
const _liveBoxscoreCache = {};
async function fetchLiveBoxscoreCached(eventId){
  if(_liveBoxscoreCache[eventId]) return _liveBoxscoreCache[eventId];
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    if(!workerBase) return [];
    const data = await fetchJson(`${workerBase}/liveboxscore?event=${eventId}`);
    if(data && data.error) throw new Error(data.error);
    _liveBoxscoreCache[eventId] = data.rows || [];
    return _liveBoxscoreCache[eventId];
  }catch(e){ console.warn('Live boxscore fetch failed for', eventId, e); return []; }
}
function findLiveGameForBet(liveGames, bet){
  if(!bet.team || !bet.opponent) return null;
  return liveGames.find(g =>
    (g.homeShort===bet.team && g.awayShort===bet.opponent) || (g.awayShort===bet.team && g.homeShort===bet.opponent)
  ) || null;
}
function shortPlayerName(fullName){
  if(!fullName) return '';
  const parts = fullName.trim().split(/\s+/);
  if(parts.length<2) return fullName;
  return `${parts[0][0]}. ${parts.slice(1).join(' ')}`;
}
const STAT_SHORT_LABEL = {pts:'PTS', reb:'REB', ast:'AST', tpm:'3PM', pra:'PRA'};
// Synchronous part \u2014 matchup (@ ) and start time (ET), always shown, no live fetch needed.
function buildBetSubLineBase(bet){
  const gameTeams = (bet.game||'').split(' @ ');
  const awayFull = gameTeams[0], homeFull = gameTeams[1];
  const awayShort = SHORT_TEAM_NAME[awayFull] || awayFull;
  const homeShort = SHORT_TEAM_NAME[homeFull] || homeFull;
  const startTimeET = bet.commenceTime ? new Date(bet.commenceTime).toLocaleTimeString('en-US', {timeZone:'America/New_York', hour:'numeric', minute:'2-digit'}) + ' ET' : '';
  return `${awayShort} @ ${homeShort}${startTimeET ? ' \u2014 '+startTimeET : ''}`;
}
// Async part \u2014 only does anything once the game has actually started: appends live quarter/
// clock, score, and (for player props) that player's current in-game value for the exact stat
// being bet on, e.g. "1Q 7:43 | NY 17 - IND 20 | 0 AST C. Clark". Patches the element in place
// rather than blocking the table's initial render on a live-score fetch.
async function enhanceBetSubLineIfLive(bet, liveGames, subLineEl){
  const live = findLiveGameForBet(liveGames, bet);
  if(!live || !live.started) return;
  const quarterLabel = live.completed ? 'Final' : `${live.period||'?'}Q ${live.displayClock||''}`.trim();
  const scoreLabel = `${live.awayShort} ${live.awayScore!=null?live.awayScore:'\u2014'} - ${live.homeShort} ${live.homeScore!=null?live.homeScore:'\u2014'}`;
  let extra = ` | ${quarterLabel} | ${scoreLabel}`;
  if((bet.betType==='player_prop' || bet.betType==='player_prop_alt') && bet.player && bet.statKey){
    const rows = await fetchLiveBoxscoreCached(live.espnEventId);
    const row = rows.find(r => r.athlete_display_name===bet.player);
    if(row){
      const val = bet.statKey==='pra' ? (row.points||0)+(row.rebounds||0)+(row.assists||0)
        : bet.statKey==='pts' ? row.points : bet.statKey==='reb' ? row.rebounds : bet.statKey==='ast' ? row.assists
        : bet.statKey==='tpm' ? row.three_point_field_goals_made : null;
      if(val!==null && val!==undefined){
        extra += ` | ${val} ${STAT_SHORT_LABEL[bet.statKey]||bet.statKey.toUpperCase()} ${shortPlayerName(bet.player)}`;
      }
    }
  }
  subLineEl.textContent += extra;
}

// Once per day, at the first opportunity on or after 12:00pm ET (there's no server process
// that can compute these rankings independently \u2014 see the App Tracker page for the full
// explanation of why this isn't a literal 12:00:00 capture), snapshots the current Top 30
// Standard and Top 30 Advanced Analytics lists into the App Tracker as pending picks.
let _snapshotAttemptedThisSession = false;
async function maybeSnapshotTodaysTopBets(cachedForToday){
  if(_snapshotAttemptedThisSession) return; // at most once per page session; avoids duplicate racing on fast repeated calls
  const et = nowInEastern();
  if(et.hour < 12) return; // not noon ET yet today
  _snapshotAttemptedThisSession = true;
  try{
    const existing = await appTrackerListAll();
    // Checked PER SOURCE, not just "does today have any record at all" -- if standard and
    // advanced ever end up captured at different times (a partial failure, a retry, or simply
    // this function being called more than once across the day), the old blanket check would
    // see "something exists for today" and skip entirely, permanently leaving whichever
    // category never got saved empty for that whole day with no way to backfill it.
    const haveStandardToday = existing.some(b => b.snapshotDate === et.dateStr && b.snapshotSource === 'standard');
    const haveAdvancedToday = existing.some(b => b.snapshotDate === et.dateStr && b.snapshotSource === 'advanced');
    if(haveStandardToday && haveAdvancedToday) return; // both already captured today -- nothing to do

    const snapshotTime = new Date().toISOString();
    const toSnapshot = [];

    if(!haveStandardToday){
      const std = computeStandardTopBets(cachedForToday, 30);
      std.topBets.forEach((bet, i)=>{
        toSnapshot.push(Object.assign({}, bet, {
          snapshotDate: et.dateStr, snapshotSource: 'standard', snapshotRank: i+1, snapshotAt: snapshotTime,
          result: 'pending', stake: 10, isParlay: false, trackedFrom: 'app-tracker-snapshot',
        }));
      });
    }

    if(!haveAdvancedToday){
      const todaysGamesAdv = cachedForToday.filter(({ev}) => new Date(ev.commence_time).toDateString() === new Date().toDateString() && isEligibleForTopBets(ev, new Date()));
      const advPool = buildAdvancedEdgeCandidates(todaysGamesAdv).slice(0, 30);
      advPool.forEach((bet, i)=>{
        toSnapshot.push(Object.assign({}, bet, {
          snapshotDate: et.dateStr, snapshotSource: 'advanced', snapshotRank: i+1, snapshotAt: snapshotTime,
          result: 'pending', stake: 10, isParlay: false, trackedFrom: 'app-tracker-snapshot',
        }));
      });
    }

    // Save each item independently rather than letting one failure abort everything after it
    // in the loop -- a single transient error (e.g. one network blip on one KV write) used to
    // silently discard every remaining item in the batch, not just the one that failed.
    for(const bet of toSnapshot){
      try{ await appTrackerAdd(bet); }
      catch(e){ console.warn('Snapshot save failed for one pick (continuing with the rest):', bet.label, e); }
    }
  }catch(e){
    console.warn('Daily Top 30 snapshot failed', e);
  }
}

// Quick one-click "+ Track" button, usable anywhere a structured leg object is already
// on hand (Top Bets cards, game lines, player props, alt lines). Quick-add is always a
// pregame straight bet, since that's the only kind of line this app ever displays live.
// Formats a Date into the string <input type="datetime-local"> expects (local time, no
// timezone, "YYYY-MM-DDTHH:mm") -- Date's own toISOString() is UTC, which would silently
// shift the displayed time, so this builds it from local getters instead.
function toDatetimeLocalValue(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Modal shown when Track is clicked -- lets you confirm/edit stake, odds, and placed-at time
// before anything is actually saved, rather than immediately tracking with silent defaults.
function showTrackModal(legLikeObject, defaultStake, onConfirm){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
  const card = document.createElement('div');
  card.style.cssText = 'background:var(--panel);border-radius:10px;padding:20px;max-width:380px;width:100%;position:relative;box-shadow:0 8px 30px rgba(0,0,0,0.25);';
  overlay.appendChild(card);

  const closeBtn = document.createElement('button');
  closeBtn.textContent = '\u2715';
  closeBtn.title = 'Cancel — nothing will be tracked';
  closeBtn.style.cssText = 'position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;color:var(--sub);cursor:pointer;line-height:1;padding:4px;';
  const close = ()=>{ document.body.removeChild(overlay); };
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); }); // click-outside also cancels
  card.appendChild(closeBtn);

  const title = document.createElement('div'); title.style.cssText='font-weight:800;font-size:15px;color:var(--navy2);margin-bottom:4px;padding-right:20px;';
  title.textContent = 'Track This Bet';
  card.appendChild(title);
  const label = document.createElement('div'); label.style.cssText='font-size:12.5px;color:var(--sub);margin-bottom:14px;';
  label.textContent = legLikeObject.label || '';
  card.appendChild(label);

  function field(labelText, inputEl){
    const row = document.createElement('div'); row.style.cssText='margin-bottom:12px;';
    const l = document.createElement('label'); l.style.cssText='display:block;font-size:11px;font-weight:700;color:var(--navy2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;';
    l.textContent = labelText;
    row.appendChild(l); row.appendChild(inputEl);
    return row;
  }
  const inputStyle = 'width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:var(--sans);box-sizing:border-box;';

  const stakeInput = document.createElement('input'); stakeInput.type='number'; stakeInput.step='0.01'; stakeInput.min='0';
  stakeInput.value = defaultStake || 10; stakeInput.style.cssText = inputStyle;
  card.appendChild(field('Wager Amount ($)', stakeInput));

  const priceInput = document.createElement('input'); priceInput.type='number'; priceInput.step='1';
  priceInput.value = legLikeObject.price!==undefined && legLikeObject.price!==null ? legLikeObject.price : '';
  priceInput.style.cssText = inputStyle;
  card.appendChild(field('Odds (pre-filled with the latest DraftKings price — edit if it moved)', priceInput));

  // Line only applies to bet types that actually have one -- moneyline bets don't.
  const hasLine = ['spread','total','team_total','player_prop','player_prop_alt'].includes(legLikeObject.betType) && legLikeObject.line!==undefined && legLikeObject.line!==null;
  let lineInput = null;
  if(hasLine){
    lineInput = document.createElement('input'); lineInput.type='number'; lineInput.step='0.5';
    lineInput.value = legLikeObject.line;
    lineInput.style.cssText = inputStyle;
    card.appendChild(field('Line (e.g. change +5.5 to +4.5 or +6.5 if it moved)', lineInput));
  }

  const timeInput = document.createElement('input'); timeInput.type='datetime-local';
  timeInput.value = toDatetimeLocalValue(new Date());
  timeInput.style.cssText = inputStyle;
  card.appendChild(field('Time You Placed This Bet', timeInput));

  const errDiv = document.createElement('div'); errDiv.style.cssText='color:var(--red);font-size:12px;margin-bottom:10px;display:none;white-space:pre-wrap;';
  card.appendChild(errDiv);

  const btnRow = document.createElement('div'); btnRow.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:6px;';
  const cancelBtn = document.createElement('button'); cancelBtn.textContent='Cancel';
  cancelBtn.style.cssText='padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer;font-family:var(--sans);';
  cancelBtn.addEventListener('click', close);
  const confirmBtn = document.createElement('button'); confirmBtn.textContent='Track Bet';
  confirmBtn.style.cssText='padding:8px 14px;border-radius:6px;border:1px solid var(--navy2);background:var(--navy2);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);';
  confirmBtn.addEventListener('click', async ()=>{
    const stake = parseFloat(stakeInput.value);

    if(isNaN(stake) || stake <= 0){ errDiv.textContent = 'Enter a valid wager amount.'; errDiv.style.display='block'; return; }

    }

// Shown wherever a logged-out user tries to do something that requires an account (currently
// just the "+ Track" quick-add button). Reuses renderAuthGate's own login/signup form inside a
// modal overlay, so instead of a dead-end error, logging in right here seamlessly continues
// whatever action they were trying to do -- onSuccess fires the same as if they'd been logged
// in from the start.
function showLoginRequiredModal(onSuccess){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
  const modalBox = document.createElement('div');
  modalBox.style.cssText = 'max-width:380px;width:100%;position:relative;';
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '\u2715';
  closeBtn.style.cssText = 'position:absolute;top:-36px;right:0;background:none;border:none;font-size:20px;cursor:pointer;color:#fff;';
  closeBtn.addEventListener('click', ()=>overlay.remove());
  modalBox.appendChild(closeBtn);
  renderAuthGate(modalBox, ()=>{ overlay.remove(); onSuccess(); });
  overlay.appendChild(modalBox);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function makeTrackButton(legLikeObject, defaultStake){
  const btn = document.createElement('button');
  btn.textContent = '+ Track';
  btn.style.cssText = 'padding:3px 8px;border-radius:4px;border:1px solid var(--navy2);background:var(--panel);color:var(--navy2);font-size:11px;cursor:pointer;font-family:var(--sans);margin-left:6px;';
  btn.addEventListener('click', ()=>{
    if(!isLoggedIn()){
      showLoginRequiredModal(()=>btn.click()); // re-fires this same click handler once logged in, now passing the isLoggedIn() check
      return;
    }
    showTrackModal(legLikeObject, defaultStake, async ({stake, price, placedAt, newLine})=>{
      // Timing (pregame/live) determined from the game's actual start time vs. the time you
      // said you placed it, not vs. right now -- if you're backfilling a bet from earlier,
      // this should reflect what was true AT that moment, not the moment you're filling out this form.
      let timing = 'pregame';
      if(legLikeObject.commenceTime){
        const ct = new Date(legLikeObject.commenceTime);
        if(!isNaN(ct.getTime()) && new Date(placedAt) >= ct) timing = 'live';
      }
      const bet = Object.assign({}, legLikeObject, {
        stake, price, placedAt,
        result: 'pending',
        trackedFrom: 'quick-add',
        timing,
        isParlay: false,
      });
      // If the line was edited, keep everything derived from it in sync -- thresholdToHit
      // (player props only, used for grading) and the label text itself, so what's displayed
      // always matches what was actually tracked, not the original pre-edit line.
      if(newLine !== null && newLine !== undefined && newLine !== legLikeObject.line){
        const oldLine = legLikeObject.line;
        bet.line = newLine;
        if(bet.betType === 'player_prop' || bet.betType === 'player_prop_alt'){
          bet.thresholdToHit = bet.side === 'over'
            ? (Number.isInteger(newLine) ? newLine+1 : Math.ceil(newLine))
            : newLine;
        }
        if(bet.label && oldLine!==undefined && oldLine!==null){
          const isSpread = bet.betType === 'spread';
          const oldFrag = isSpread ? `${oldLine>0?'+':''}${oldLine}` : `${oldLine}`;
          const newFrag = isSpread ? `${newLine>0?'+':''}${newLine}` : `${newLine}`;
          if(bet.label.includes(oldFrag)) bet.label = bet.label.replace(oldFrag, newFrag);
        }
      }
      let result;
      try{
        result = await trackerAdd(bet);
      }catch(e){
        throw new Error(`${e.message}\n\nMost common cause: the BET_TRACKER KV namespace hasn't been created and bound to your Worker yet, or the Worker wasn't redeployed after adding it.`);
      }
      if(result && result.error){ throw new Error(`${result.error}\n\nMost common cause: the BET_TRACKER KV namespace hasn't been created and bound to your Worker yet, or the Worker wasn't redeployed after adding it.`); }
      btn.textContent = '\u2713 Tracked';
      btn.style.background = 'var(--greenbg)'; btn.style.color = 'var(--green)'; btn.style.borderColor = 'var(--green)';
      btn.disabled = true;
    });
  });
  return btn;
}

// Extracts this specific leg's price (and point, if relevant) out of one historical snapshot's
// merged DraftKings markets. Returns null if that market/outcome wasn't captured in this snapshot.
function extractLegFromSnapshotMarkets(leg, markets, homeShort, awayShort){
  if(leg.betType === 'moneyline'){
    const m = markets['h2h']; if(!m) return null;
    const fullName = leg.team===homeShort ? FULL_TEAM_NAME[homeShort] : FULL_TEAM_NAME[awayShort];
    const o = (m.outcomes||[]).find(x=>x.name===fullName);
    return o ? {price:o.price} : null;
  }
  if(leg.betType === 'spread'){
    const m = markets['spreads']; if(!m) return null;
    const fullName = leg.team===homeShort ? FULL_TEAM_NAME[homeShort] : FULL_TEAM_NAME[awayShort];
    const o = (m.outcomes||[]).find(x=>x.name===fullName);
    return o ? {price:o.price, line:o.point} : null;
  }
  if(leg.betType === 'total'){
    const m = markets['totals']; if(!m) return null;
    const o = (m.outcomes||[]).find(x=>x.name===(leg.side==='over'?'Over':'Under'));
    return o ? {price:o.price, line:o.point} : null;
  }
  if(leg.betType === 'team_total'){
    const m = markets['team_totals']; if(!m) return null;
    const fullName = leg.team===homeShort ? FULL_TEAM_NAME[homeShort] : FULL_TEAM_NAME[awayShort];
    const o = (m.outcomes||[]).find(x=>x.name===(leg.side==='over'?'Over':'Under') && x.description===fullName);
    return o ? {price:o.price, line:o.point} : null;
  }
  if(leg.betType === 'player_prop' || leg.betType === 'player_prop_alt'){
    const mkey = Object.keys(PROP_MARKET_TO_STAT).find(k=>PROP_MARKET_TO_STAT[k]===leg.statKey && !k.endsWith('_alternate'));
    const m = markets[mkey]; if(!m) return null;
    const o = (m.outcomes||[]).find(x=>x.name===(leg.side==='over'?'Over':'Under') && x.description===leg.player);
    return o ? {price:o.price, line:o.point} : null;
  }
  return null;
}

async function renderLineHistoryPage(leg, returnTo){
  lastRender = () => renderLineHistoryPage(leg, returnTo);
  main.innerHTML = '';
  removeGameWindowStickyBar();
  const back = document.createElement('button'); back.className='backbtn'; back.textContent='\u2190 Back';
  back.addEventListener('click', ()=>{ if(returnTo) returnTo(); else renderHomePage(); });
  main.appendChild(back);

  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\ud83d\udcc8 Line History</h2><div class="meta"><b>${leg.label}</b><br>${leg.gameLabel||''}</div>`;
  main.appendChild(head);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.margin='10px 0';
  statusDiv.textContent = 'Loading historical snapshots from your Worker\u2026';
  main.appendChild(statusDiv);
  const contentDiv = document.createElement('div');
  main.appendChild(contentDiv);

  if(!leg.eventId){
    statusDiv.textContent = 'This bet doesn\u2019t have enough information to look up its history (no event id attached).';
    return;
  }

  try{
    const history = await fetchOddsHistoryCached();
    const matches = (history||[]).filter(snap => snap.eventId === leg.eventId);
    if(matches.length === 0){
      statusDiv.textContent = 'No historical snapshots found yet for this game. Snapshots are only saved automatically while the Odds/Home pages are actively fetched before tip-off \u2014 as you keep using the app day to day, history will build up here on its own. Nothing to show yet for this one.';
      return;
    }

    const homeShort = SHORT_TEAM_NAME[matches[0].homeTeam] || matches[0].homeTeam;
    const awayShort = SHORT_TEAM_NAME[matches[0].awayTeam] || matches[0].awayTeam;

    // merge markets seen at each distinct fetch timestamp (a single fetch can span two
    // requests — game lines + event-detail — that land as separate snapshot records)
    const byTime = {};
    matches.forEach(snap=>{
      const t = snap.fetchedAt;
      if(!byTime[t]) byTime[t] = {};
      const dk = (snap.data.bookmakers||[]).find(b=>b.key==='draftkings');
      if(dk) (dk.markets||[]).forEach(m=>{ byTime[t][m.key] = m; });
    });

    const points = [];
    Object.keys(byTime).sort().forEach(t=>{
      const found = extractLegFromSnapshotMarkets(leg, byTime[t], homeShort, awayShort);
      if(found) points.push({time:t, ...found});
    });

    if(points.length === 0){
      statusDiv.textContent = `Found ${matches.length} snapshot(s) for this game, but none captured this specific market yet.`;
      return;
    }

    statusDiv.textContent = `${points.length} data point(s) captured for this bet, as far back as your Worker has been collecting.`;

    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table'); table.style.width='100%';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th class="left">Captured At</th><th>Line</th><th>Price</th><th>Change</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody'); table.appendChild(tbody);
    points.forEach((p, idx)=>{
      const tr = document.createElement('tr');
      const prev = idx>0 ? points[idx-1] : null;
      let change = '\u2014';
      if(prev){
        const priceDelta = p.price - prev.price;
        change = priceDelta===0 ? 'no change' : (priceDelta>0?'+':'')+priceDelta+' price';
        if(p.line!==undefined && prev.line!==undefined && p.line!==prev.line){
          change += `, line ${prev.line}\u2192${p.line}`;
        }
      }
      const cells = [new Date(p.time).toLocaleString(), p.line!==undefined?p.line:'\u2014', fmtAmerican(p.price), change];
      cells.forEach((c,i)=>{
        const td = document.createElement('td');
        if(i===0) td.classList.add('left');
        td.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;'+(i>0?'text-align:center;':'');
        td.textContent = c;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    contentDiv.appendChild(wrap);
  }catch(e){
    statusDiv.textContent = `Couldn\u2019t load line history: ${e.message}`;
  }
}

// Just the time-of-day portion of a game's commence_time, for a compact table column

  main.appendChild(noteDiv);

  const actionsRow = document.createElement('div'); actionsRow.style.cssText='display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;';
  const refreshBtn = document.createElement('button'); refreshBtn.className='addbtn'; refreshBtn.textContent = '\ud83d\udd04 Refresh';
  const gradeBtn = document.createElement('button'); gradeBtn.className='addbtn'; gradeBtn.textContent = '\u2705 Auto-Grade Pending';
  const forceRegradeBtn = document.createElement('button'); forceRegradeBtn.className='addbtn'; forceRegradeBtn.textContent = '\u267b\ufe0f Force Re-check All Results';
  forceRegradeBtn.title = 'Re-grades every pick, including ones that already show a result \u2014 use this if a result looks wrong (a past grading bug could have assigned a result before the game had actually finished).';
  const deleteAllBtn = document.createElement('button'); deleteAllBtn.textContent = '\ud83d\uddd1\ufe0f Delete All Snapshots';
  deleteAllBtn.style.cssText = 'padding:8px 14px;border-radius:6px;border:1px solid var(--red);background:var(--panel);color:var(--red);font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:700;';
  actionsRow.appendChild(refreshBtn); actionsRow.appendChild(gradeBtn); actionsRow.appendChild(forceRegradeBtn);
  // App Tracker is shared/public data (not per-user), so wiping it affects every user, not just
  // whoever clicks the button -- admin-only, unlike Bet Tracker's own delete-all which only
  // ever touches that one user's own data.
  if(isAdminUser()) actionsRow.appendChild(deleteAllBtn);

  const tableDiv = document.createElement('div'); main.appendChild(tableDiv);

  let bets = [];
  let sourceFilter = 'all'; // 'all' | 'standard' | 'advanced'
  let hidePending = false;
  let sortKey = null; // null = default (most recent snapshot date, then best rank); otherwise a column key to sort by, click-to-sort same as League Stats/Team pages
  let sortDir = 'desc';
  // Min-threshold filters (0-100 or null = no filter) on the point-in-time L5/L10/L15/Season
  // rates, so a bet only shows if its rate AT CAPTURE TIME was at least this -- e.g. "Min L10%:
  // 70" isolates only picks that were already showing 70%+ over their last 10 games when placed.
  const rateFilters = {rate5: null, rate10: null, rate15: null, rateAll: null};

  // Figures out, for each bet, whether the SAME bet (same player/team/stat/side/line) also
  // appears under the other source on the SAME snapshot date -- powers both the "Both" column
  // and (when viewing "All Sources") not listing a shared bet twice. Filtering to a single
  // source shows that source's full list (no hiding), with "Both" still shown for reference.
  function computeDisplayRows(allBets, filterVal){
    const byDate = {};
    allBets.forEach(b=>{
      if(b.snapshotSource!=='standard' && b.snapshotSource!=='advanced') return;
      if(!byDate[b.snapshotDate]) byDate[b.snapshotDate] = {standard:[], advanced:[]};
      byDate[b.snapshotDate][b.snapshotSource].push(b);
    });
    function findMatch(bet, otherSource){
      const key = betIdentityKey(bet);
      if(!key) return null;
      const list = (byDate[bet.snapshotDate] && byDate[bet.snapshotDate][otherSource]) || [];
      return list.find(o => betIdentityKey(o)===key) || null;
    }
    let rows = allBets.map(b=>{
      const otherSource = b.snapshotSource==='standard' ? 'advanced' : (b.snapshotSource==='advanced' ? 'standard' : null);
      const both = otherSource ? !!findMatch(b, otherSource) : false;
      return Object.assign({}, b, {_both: both});
    });
    if(filterVal==='all'){
      // Don't double-list a shared bet -- keep its 'standard' row (with Both checked), drop the matching 'advanced' row.
      rows = rows.filter(b => !(b.snapshotSource==='advanced' && findMatch(b,'standard')));
    } else if(filterVal==='standard'){
      rows = rows.filter(b=>b.snapshotSource==='standard');
    } else if(filterVal==='advanced'){
      rows = rows.filter(b=>b.snapshotSource==='advanced');
    }
    return rows;
  }

  async function autoGradeAllSnapshots(){
    let gradedCount = 0;
    for(const bet of bets){
      if(bet.result && bet.result!=='pending') continue;
      const result = gradeTrackedBet(bet); // snapshot entries are single-leg-shaped (isParlay:false), same as any straight tracked bet
      if(result){
        await appTrackerUpdate(bet.id, {result});
        bet.result = result;
        gradedCount++;
      }
    }
    return gradedCount;
  }
  // Unlike autoGradeAllSnapshots, this re-checks EVERY pick regardless of its current stored
  // result and overwrites it if the freshly computed result differs \u2014 the fix for a pick that
  // got graded incorrectly before its game had actually finished (a real bug that existed
  // before findHistoricalGame was corrected to never fuzzy-match a same-day-or-future game).
  // Auto-Grade Pending alone can't fix that, since it skips anything already marked non-pending
  // \u2014 a wrong result would otherwise stay wrong forever.
  async function forceRegradeAllSnapshots(){
    let changedCount = 0;
    for(const bet of bets){
      const result = gradeTrackedBet(bet);
      const newResult = result || 'pending';
      if(newResult !== (bet.result || 'pending')){
        await appTrackerUpdate(bet.id, {result: newResult});
        bet.result = newResult;
        changedCount++;
      }
    }
    return changedCount;
  }

  // When a pick turns out to be a confirmed DNP (result === 'void', set by gradeLeg above),
  // DraftKings would have voided that line before the game -- it never should have occupied a
  // real ranked slot. This shifts every OTHER pick from the same day+source that ranked worse
  // (a higher rank number) up by one, closing the gap, so "Top 30" becomes an honest "Top 29"
  // for that day rather than having a permanent hole at the voided pick's old rank. Idempotent:
  // uses a separately-stored originalSnapshotRank (captured once, never changed) so re-running
  // this on an already-corrected day is a no-op rather than shifting things twice.
  async function applyVoidRankShifts(){
    const groups = {};
    bets.forEach(b=>{
      if(b.snapshotSource!=='standard' && b.snapshotSource!=='advanced') return;
      const key = b.snapshotDate+'|'+b.snapshotSource;
      (groups[key] = groups[key]||[]).push(b);
    });
    let shiftedCount = 0;
    for(const group of Object.values(groups)){
      for(const b of group){
        if(b.originalSnapshotRank===undefined || b.originalSnapshotRank===null){
          b.originalSnapshotRank = b.snapshotRank;
          await appTrackerUpdate(b.id, {originalSnapshotRank: b.originalSnapshotRank});
        }
      }
      const voidRanks = group.filter(b=>b.result==='void').map(b=>b.originalSnapshotRank);
      if(!voidRanks.length) continue;
      for(const b of group){
        if(b.result==='void') continue;
        const shiftCount = voidRanks.filter(vr=>vr < b.originalSnapshotRank).length;
        const newRank = b.originalSnapshotRank - shiftCount;
        if(newRank !== b.snapshotRank){
          b.snapshotRank = newRank;
          await appTrackerUpdate(b.id, {snapshotRank: newRank});
          shiftedCount++;
        }
      }
    }
    return shiftedCount;
  }

  async function refresh(){
    statusDiv.textContent = 'Loading snapshot history\u2026';
    try{

  function renderSummary(){
    summaryDiv.innerHTML = '';
    if(!bets.length) return;

    function buildStatCard(label, list){
      const w = list.filter(b=>b.result==='won').length;
      const l = list.filter(b=>b.result==='lost').length;
      const v = list.filter(b=>b.result==='void').length;

      const g = w+l; const pct = g ? Math.round((w/g)*100) : null;
      const card = document.createElement('div');

      card.appendChild(row);

    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;';
    wrap.appendChild(buildStatCard('Total', bets));
    ['standard','advanced'].forEach(src=>{
      const subset = bets.filter(b=>b.snapshotSource===src);

      wrap.appendChild(buildStatCard(src==='standard' ? 'Standard' : 'Advanced Analytics', subset));
    });

  }

  // All-time record broken down by where a pick ranked. "Both" tier uses the Standard-side
  // rank for a shared bet (matching how the table below keeps only the Standard row for a
  // shared bet) -- consistent with the Both column/dedup logic elsewhere on this page.
  function renderTierAndRankStats(){
    statsBoxDiv.innerHTML = '';
    if(!bets.length) return;

      const w = subset.filter(b=>b.result==='won').length;
      const l = subset.filter(b=>b.result==='lost').length;
      return {w, l, pct: (w+l) ? Math.round((w/(w+l))*100) : null};
    }
    function fmtRecord(r){ return r.pct!==null ? `${r.w}-${r.l} (${r.pct}%)` : `${r.w}-${r.l}`; }

    const tierBox = document.createElement('div');
    tierBox.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;';
    const tierTitle = document.createElement('div'); tierTitle.className='section-title'; tierTitle.style.margin='0 0 10px'; tierTitle.textContent = 'All-Time Records';
    tierBox.appendChild(tierTitle);
    const tierTable = document.createElement('table'); tierTable.style.cssText = 'font-size:12.5px;';
    const tierRows = [
      ['Standard', stdBets],
      ['Advanced', advBets],
      ['Both', bothBets],
    ];
    let tierHtml = '<tr><th class="left" style="padding:4px 10px 4px 0;"></th><th style="padding:4px 10px;">Top 5</th><th style="padding:4px 10px;">Top 10</th><th style="padding:4px 10px;">Top 15</th></tr>';
    tierRows.forEach(([label, list])=>{
      tierHtml += `<tr><td class="left" style="padding:4px 10px 4px 0;font-weight:700;color:var(--navy2);">${label}</td>`

        + `<td style="padding:4px 10px;text-align:center;">${fmtRecord(record(list,10))}</td>`

    tierBox.appendChild(tierTable);
    statsBoxDiv.appendChild(tierBox);

    // By-rank (1-30) breakdown, Standard and Advanced side by side, collapsed by default since
    // it's 30 rows deep in each column -- most people won't want this open every visit.
    const rankWrap = document.createElement('div');
    rankWrap.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;';
    const rankHeaderRow = document.createElement('div');
    rankHeaderRow.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;';
    const rankArrow = document.createElement('span');
    rankArrow.textContent = '\u25b8';
    rankArrow.style.cssText = 'font-size:18px;color:var(--navy2);display:inline-block;width:20px;flex-shrink:0;line-height:1;';
    const rankTitle = document.createElement('div'); rankTitle.className='section-title'; rankTitle.style.margin='0'; rankTitle.textContent = 'All-Time Record by Rank (1\u201330)';
    rankHeaderRow.appendChild(rankArrow); rankHeaderRow.appendChild(rankTitle);

    const rankContent = document.createElement('div');

    rankHeaderRow.addEventListener('click', ()=>{

    });

    function buildSourceGroup(label, list){
      const entries = [];
      for(let r=1; r<=30; r++){
        const rec = record(list.filter(b=>b.snapshotRank===r), 30);
        entries.push({r, rec}); // always all 30 -- ranks with no graded picks yet are shown greyed out, not hidden, so nothing ever looks "missing"
      }
      const group = document.createElement('div');
      const groupLabel = document.createElement('div'); groupLabel.style.cssText = 'font-weight:800;color:var(--navy2);font-size:13px;margin-bottom:6px;'; groupLabel.textContent = label;
      group.appendChild(groupLabel);
      const numCols = 5; // 5 per source x 2 sources = 10 columns total, 6 ranks per column, 30 ranks exactly every time
      const perCol = Math.ceil(entries.length / numCols); // = 6, always, since entries.length is always exactly 30
      const colsRow = document.createElement('div'); colsRow.style.cssText = 'display:flex;gap:14px;';
      for(let c=0; c<numCols; c++){
        const slice = entries.slice(c*perCol, (c+1)*perCol);
        if(!slice.length) continue;
        const colDiv = document.createElement('div'); colDiv.style.cssText = 'font-size:11.5px;line-height:1.7;min-width:64px;';
        slice.forEach(({r, rec})=>{
          const line = document.createElement('div');
          const hasData = rec.w+rec.l > 0;
          const rankSpan = document.createElement('span');
          rankSpan.style.cssText = `font-weight:800;color:${hasData ? 'var(--navy2)' : 'var(--sub)'};`;
          rankSpan.textContent = `#${r}:`;
          line.appendChild(rankSpan);
          const recSpan = document.createElement('span');
          if(!hasData) recSpan.style.color = 'var(--sub)';
          recSpan.textContent = ` ${fmtRecord(rec)}`;
          line.appendChild(recSpan);
          colDiv.appendChild(line);
        });
        colsRow.appendChild(colDiv);
      }
      group.appendChild(colsRow);
      return group;
    }
    const rankGrid = document.createElement('div');
    rankGrid.style.cssText = 'display:flex;gap:36px;flex-wrap:wrap;';
    rankGrid.appendChild(buildSourceGroup('Standard', stdBets));
    rankGrid.appendChild(buildSourceGroup('Advanced', advBets));
    rankContent.appendChild(rankGrid);
    rankWrap.appendChild(rankContent);
    statsBoxDiv.appendChild(rankWrap);
  }

  function renderTable(){
    tableDiv.innerHTML = '';
    if(!bets.length){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
      na.textContent = 'No snapshots captured yet \u2014 the first one happens the next time the Home page is opened on or after 12:00pm ET.';
      tableDiv.appendChild(na);
      return;
    }

    const filterRow = document.createElement('div');
    filterRow.style.cssText = 'display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;';
    const srcLabel = document.createElement('label'); srcLabel.style.cssText = 'display:flex;align-items:center;gap:6px;';
    srcLabel.appendChild(document.createTextNode('Source:'));
    const srcSelect = document.createElement('select');
    srcSelect.style.cssText = 'padding:4px 8px;border-radius:5px;border:1px solid var(--line);font-family:var(--sans);font-size:12.5px;';
    [['all','All Sources'],['standard','Standard'],['advanced','Advanced']].forEach(([val,label])=>{
      const opt = document.createElement('option'); opt.value=val; opt.textContent=label;
      if(val===sourceFilter) opt.selected = true;
      srcSelect.appendChild(opt);
    });
    srcSelect.addEventListener('change', ()=>{ sourceFilter = srcSelect.value; renderTable(); });
    srcLabel.appendChild(srcSelect);
    filterRow.appendChild(srcLabel);

    const pendingLabel = document.createElement('label'); pendingLabel.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;';
    const pendingCb = document.createElement('input'); pendingCb.type='checkbox'; pendingCb.checked = hidePending;
    pendingCb.addEventListener('change', ()=>{ hidePending = pendingCb.checked; renderTable(); });
    pendingLabel.appendChild(pendingCb);
    pendingLabel.appendChild(document.createTextNode('Hide pending results'));
    filterRow.appendChild(pendingLabel);

    [['rate5','Min L5%'],['rate10','Min L10%'],['rate15','Min L15%'],['rateAll','Min Season%']].forEach(([fkey, flabel])=>{
      const lbl = document.createElement('label'); lbl.style.cssText = 'display:flex;align-items:center;gap:6px;';
      lbl.appendChild(document.createTextNode(flabel+':'));
      const inp = document.createElement('input'); inp.type='number'; inp.min='0'; inp.max='100'; inp.placeholder='any';
      inp.style.cssText = 'width:56px;padding:4px 6px;border-radius:5px;border:1px solid var(--line);font-family:var(--sans);font-size:12.5px;';
      if(rateFilters[fkey]!==null) inp.value = rateFilters[fkey];
      inp.addEventListener('change', ()=>{
        const v = inp.value.trim();
        rateFilters[fkey] = v==='' ? null : Math.max(0, Math.min(100, Number(v)));
        renderTable();
      });
      lbl.appendChild(inp);
      filterRow.appendChild(lbl);
    });
    const clearBtn = document.createElement('button'); clearBtn.textContent = 'Clear rate filters';
    clearBtn.style.cssText = 'padding:4px 10px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:12px;cursor:pointer;font-family:var(--sans);';
    clearBtn.addEventListener('click', ()=>{ rateFilters.rate5=rateFilters.rate10=rateFilters.rate15=rateFilters.rateAll=null; renderTable(); });
    filterRow.appendChild(clearBtn);

    tableDiv.appendChild(filterRow);

    let displayRows = computeDisplayRows(bets, sourceFilter);
    if(hidePending) displayRows = displayRows.filter(b => b.result && b.result!=='pending');
    // A bet with no value for a filtered rate (e.g. an older snapshot with no rateAll) can't be
    // verified as meeting the threshold, so it's excluded rather than assumed to pass.
    [['rate5','gp5'],['rate10','gp10'],['rate15','gp15'],['rateAll','gpAll']].forEach(([rk, gk])=>{
      if(rateFilters[rk]===null) return;
      displayRows = displayRows.filter(b => b[rk]!==null && b[rk]!==undefined && b[gk] && (b[rk]*100) >= rateFilters[rk]);
    });

    if(!displayRows.length){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
      na.textContent = 'No snapshot picks match the current filters.';
      tableDiv.appendChild(na);
      return;
    }

    function fmtRateCell(rate, gp){
      if(rate===null || rate===undefined || gp===null || gp===undefined || gp===0) return '\u2014';
      const hits = Math.round(rate*gp);
      return `${Math.round(rate*100)}% (${hits}/${gp})`;
    }

    // Same default as before (most recent snapshot date, then best rank) unless a column
    // header has been clicked, in which case sort by that column -- same click-to-sort
    // pattern used on the League Stats and Team pages (arrow indicator, click again to
    // flip direction).
    const COLS = [
      {key:'snapshotDate', label:'Snapshot Date', left:true},
      {key:'snapshotSource', label:'Source', left:true},
      {key:'_both', label:'Both'},
      {key:'snapshotRank', label:'Rank'},
      {key:'label', label:'Bet', left:true, sortable:false},
      {key:'rate5', label:'L5%'},
      {key:'rate10', label:'L10%'},
      {key:'rate15', label:'L15%'},
      {key:'rateAll', label:'Season%'},
      {key:'gameLabel', label:'Game', left:true},
      {key:'commenceTime', label:'Game Time', left:true},
      {key:'price', label:'Price'},
      {key:'result', label:'Result'},
      {key:'final', label:'Final', left:true, sortable:false},
      {key:'actions', label:'', sortable:false},
    ];

    let sorted;
    if(sortKey){
      const col = COLS.find(c=>c.key===sortKey);
      sorted = displayRows.slice().sort((a,b)=>{
        let av = a[sortKey], bv = b[sortKey];
        if(av===null||av===undefined) av = col && col.left ? '' : -Infinity;
        if(bv===null||bv===undefined) bv = col && col.left ? '' : -Infinity;
        let d;
        if(typeof av==='string' || typeof bv==='string') d = String(av).localeCompare(String(bv));
        else d = av - bv;
        return sortDir==='asc' ? d : -d;
      });
    } else {
      sorted = displayRows.slice().sort((a,b)=> (b.snapshotDate||'').localeCompare(a.snapshotDate||'') || (a.snapshotRank||0)-(b.snapshotRank||0));
    }

    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table'); table.style.width='100%';
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    COLS.forEach(col=>{
      const th = document.createElement('th');
      if(col.left) th.classList.add('left');
      if(col.sortable===false || !col.label){
        th.textContent = col.label;
      } else {
        th.style.cursor = 'pointer'; th.style.userSelect = 'none';
        const labelSpan = document.createElement('span'); labelSpan.textContent = col.label;
        th.appendChild(labelSpan);
        const arrow = document.createElement('span'); arrow.style.marginLeft = '3px';
        arrow.textContent = sortKey===col.key ? (sortDir==='asc'?'\u25B2':'\u25BC') : '';
        th.appendChild(arrow);
        th.addEventListener('click', ()=>{
          if(sortKey===col.key){ sortDir = sortDir==='asc'?'desc':'asc'; }
          else { sortKey = col.key; sortDir = 'desc'; }
          renderTable();
        });
        if(['rate5','rate10','rate15','rateAll'].includes(col.key)){
          appendDefIcon(th, 'The hit rate over this window AS IT WAS AT THE MOMENT THIS BET WAS CAPTURED \u2014 frozen at that point, never recalculated using games played since. Older snapshots captured before this column existed will show \u2014 here.');
        }
      }
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);
    const tbody = document.createElement('tbody'); table.appendChild(tbody);
    sorted.forEach(bet=>{
      const tr = document.createElement('tr');
      const cellStyle = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;';
      const tdDate = document.createElement('td'); tdDate.className='left'; tdDate.style.cssText=cellStyle; tdDate.textContent = bet.snapshotDate || '\u2014';
      const tdSource = document.createElement('td'); tdSource.className='left'; tdSource.style.cssText=cellStyle;
      tdSource.textContent = bet.snapshotSource==='advanced' ? 'Advanced' : 'Standard';
      const tdBoth = document.createElement('td'); tdBoth.style.cssText=cellStyle+'text-align:center;';
      if(bet._both){ tdBoth.textContent = '\u2713'; tdBoth.style.color = 'var(--green)'; tdBoth.style.fontWeight = '800'; tdBoth.title = 'Also appears in the other source on this same date'; }
      const tdRank = document.createElement('td'); tdRank.style.cssText=cellStyle+'text-align:center;font-weight:700;color:var(--navy2);'; tdRank.textContent = bet.snapshotRank||'\u2014';
      const tdBet = document.createElement('td'); tdBet.className='left'; tdBet.style.cssText=cellStyle; tdBet.appendChild(buildLegLabelNode(bet));
      // L5/L10/L15/Season hit rates AS THEY WERE AT THE MOMENT THIS BET WAS CAPTURED -- these
      // come directly from fields frozen onto the bet when it was originally built (rate5,
      // rate10, rate15, rateAll), never recomputed against today's data. Snapshots captured
      // before rateAll existed won't have a Season% value -- shows as "—", not a guess.
      const tdR5 = document.createElement('td'); tdR5.style.cssText=cellStyle+'text-align:center;'; tdR5.textContent = fmtRateCell(bet.rate5, bet.gp5);
      const tdR10 = document.createElement('td'); tdR10.style.cssText=cellStyle+'text-align:center;'; tdR10.textContent = fmtRateCell(bet.rate10, bet.gp10);
      const tdR15 = document.createElement('td'); tdR15.style.cssText=cellStyle+'text-align:center;'; tdR15.textContent = fmtRateCell(bet.rate15, bet.gp15);
      const tdRAll = document.createElement('td'); tdRAll.style.cssText=cellStyle+'text-align:center;'; tdRAll.textContent = fmtRateCell(bet.rateAll, bet.gpAll);
      const tdGame = document.createElement('td'); tdGame.className='left'; tdGame.style.cssText=cellStyle+'color:var(--sub);';
      tdGame.textContent = bet.gameLabel || bet.game || '\u2014';
      const tdTime = document.createElement('td'); tdTime.className='left'; tdTime.style.cssText=cellStyle; tdTime.textContent = fmtGameTimeOnly(bet.commenceTime);
      const tdPrice = document.createElement('td'); tdPrice.style.cssText=cellStyle+'text-align:center;'; tdPrice.textContent = fmtAmerican(bet.price);
      const tdResult = document.createElement('td'); tdResult.style.cssText=cellStyle+'text-align:center;';
      const resultWrap = document.createElement('div'); resultWrap.style.cssText='display:flex;align-items:center;justify-content:center;gap:5px;';
      resultWrap.appendChild(legResultIcon(bet.result)); resultWrap.appendChild(fmtResultBadge(bet.result));
      tdResult.appendChild(resultWrap);
      const tdFinal = document.createElement('td'); tdFinal.className='left'; tdFinal.style.cssText=cellStyle+'color:var(--sub);';
      if(bet.result && bet.result!=='pending'){
        const finalLabel = computeFinalValueLabel(bet);
        tdFinal.textContent = finalLabel || '\u2014';
      } else {
        tdFinal.textContent = '\u2014';
      }
      const tdActions = document.createElement('td'); tdActions.style.cssText=cellStyle+'text-align:center;white-space:nowrap;';
      const delBtn = document.createElement('button'); delBtn.textContent='Delete';
      delBtn.style.cssText='padding:3px 8px;border-radius:4px;border:1px solid var(--red);background:var(--panel);color:var(--red);font-size:11px;cursor:pointer;font-family:var(--sans);';
      delBtn.addEventListener('click', async ()=>{ if(!confirm('Delete this snapshot pick?')) return; await appTrackerDelete(bet.id); await refresh(); });
      tdActions.appendChild(delBtn);
      [tdDate,tdSource,tdBoth,tdRank,tdBet,tdR5,tdR10,tdR15,tdRAll,tdGame,tdTime,tdPrice,tdResult,tdFinal,tdActions].forEach(td=>tr.appendChild(td));
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    tableDiv.appendChild(wrap);
  }

  await refresh();
}

  function filterField(labelText, inputEl){
