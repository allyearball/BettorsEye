<script>
// DATA is shipped gzip-compressed + base64-encoded to keep this file small enough to
// upload/host anywhere. Decompressed once at load time using the browser's native
// DecompressionStream API (supported in Safari 16.4+ / any iPhone from the last ~3 years).
let DATA = null;
const DATA_B64_GZ = "__APP_DATA_B64GZ__";

async function loadData(){
  const binary = atob(DATA_B64_GZ);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}
</script>
<script>
function cmp(a,b){
  const av=a===null||a===undefined, bv=b===null||b===undefined;
  if(av&&bv) return 0; if(av) return 1; if(bv) return -1;
  if(typeof a==='string'&&typeof b==='string') return a.localeCompare(b);
  if(a<b) return -1; if(a>b) return 1; return 0;
}
function fmtVal(v, col, row){
  if(col && col.record) return `${row.wins}-${row.losses}`;
  if(col && col.gb) return (v===null||v===undefined) ? '\u2014' : (v===0 ? '\u2014' : v.toFixed(1));
  if(v===null||v===undefined||v===''){ return '—'; }
  if(col.pct) return (v*100).toFixed(1)+'%';
  if(col.round2 && typeof v==='number') return v.toFixed(2);
  if(col.bool) return v?'Y':'N';
  return v;
}
function makeTable(container, columns, rows, opts){
  opts = opts||{};
  const state = {sortKey: opts.defaultSort||(columns[0]&&columns[0].key), sortDir: opts.defaultDir||'desc'};
  const wrap = document.createElement('div'); wrap.className='table-wrap';
  const controls = document.createElement('div'); controls.className='controls';
  const hasPlayedConcept = rows.length>0 && ('min' in rows[0] || 'gp' in rows[0]);
  let cb = null;
  if(hasPlayedConcept){
    const label = document.createElement('label');
    cb = document.createElement('input'); cb.type='checkbox';
    if(opts.defaultHideDNP) cb.checked = true;
    label.appendChild(cb); label.appendChild(document.createTextNode(opts.hideLabel || 'Hide players who didn\u2019t play (0 minutes)'));
    controls.appendChild(label);
  }
  const countSpan = document.createElement('span'); countSpan.style.cssText='font-size:12px;color:#5b6472';
  controls.appendChild(countSpan);
  const table = document.createElement('table');
  const thead = document.createElement('thead'); const trh = document.createElement('tr');
  columns.forEach(col=>{
    const th = document.createElement('th'); th.textContent = col.label;
    if(col.left) th.classList.add('left');
    const arrow = document.createElement('span'); arrow.className='arrow'; th.appendChild(arrow);
    th.addEventListener('click', ()=>{
      if(state.sortKey===col.key){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; }
      else { state.sortKey=col.key; state.sortDir = col.numeric===false?'asc':'desc'; }
      render();
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  const tbody = document.createElement('tbody');
  table.appendChild(thead); table.appendChild(tbody);
  wrap.appendChild(controls); wrap.appendChild(table);
  container.appendChild(wrap);
  function didNotPlay(r){
    if('gp' in r) return !r.gp || r.gp===0;
    if('min' in r) return r.dnp===true || r.min===null || r.min===undefined || r.min===0;
    return false;
  }
  function render(){
    let data = rows.slice();
    if(cb && cb.checked) data = data.filter(r=>!didNotPlay(r));
    data.sort((a,b)=>{ const d=cmp(a[state.sortKey],b[state.sortKey]); return state.sortDir==='asc'?d:-d; });
    tbody.innerHTML='';
    data.forEach(r=>{
      const tr = document.createElement('tr');
      if(r.starter) tr.classList.add('starter');
      columns.forEach(col=>{
        const td = document.createElement('td'); if(col.left) td.classList.add('left');
        if(col.key==='player' && opts.teamFor){
          const team = opts.teamFor(r);
          const link = document.createElement('a');
          link.href = 'javascript:void(0)';
          link.className = 'player-link';
          link.textContent = fmtVal(r[col.key], col, r);
          link.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(r.player, team); });
          td.appendChild(link);
        } else {
          td.textContent = fmtVal(r[col.key], col, r);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    countSpan.textContent = data.length+' / '+rows.length+' rows shown';
    if(opts.footerRows && opts.footerRows.length){
      opts.footerRows.forEach(fr=>{
        const tr = document.createElement('tr');
        tr.style.background = '#eef2fb'; tr.style.fontWeight = '700';
        columns.forEach((col, i)=>{
          const td = document.createElement('td'); if(col.left) td.classList.add('left');
          if(i===0){ td.textContent = fr.label; }
          else if(fr.values && Object.prototype.hasOwnProperty.call(fr.values, col.key)){
            td.textContent = fmtVal(fr.values[col.key], col);
          } else { td.textContent=''; }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
    [...trh.children].forEach((th,i)=>{
      const arrow = th.querySelector('.arrow');
      arrow.textContent = columns[i].key===state.sortKey ? (state.sortDir==='asc'?'\u25B2':'\u25BC') : '';
    });
  }
  if(cb) cb.addEventListener('change', render);
  render();
}

let TEAM_NAMES = [];
const main = document.getElementById('main');
const nav = document.getElementById('nav');
let currentPage = 'explorer';
let lastRender = null; // function that re-renders whatever page we're currently on, for "Back" support

function goToPlayer(playerName, team, windowMode){

const MONTH_NAMES = {'01':'January','02':'February','03':'March','04':'April','05':'May','06':'June',
  '07':'July','08':'August','09':'September','10':'October','11':'November','12':'December'};

function teamGameDates(team){
  return DATA.teams[team].gameIdsFull.map(gid => ({gid, date: DATA.games[String(gid)].date}));
}
function availableYears(team){
  return [...new Set(teamGameDates(team).map(d=>d.date.slice(0,4)))].sort();
}
function availableMonthsForYear(team, year){
  return [...new Set(teamGameDates(team).filter(d=>d.date.slice(0,4)===year).map(d=>d.date.slice(5,7)))].sort();
}
function filterGameIdsByYearMonth(team, year, month){
  return teamGameDates(team)
    .filter(d => d.date.slice(0,4)===year && (month==='full' || d.date.slice(5,7)===month))
    .map(d => d.gid);
}

function availableYearsForLog(log){ return [...new Set(log.map(g=>g.date.slice(0,4)))].sort(); }
function availableMonthsForYearInLog(log, year){ return [...new Set(log.filter(g=>g.date.slice(0,4)===year).map(g=>g.date.slice(5,7)))].sort(); }

// Builds the Year + Month dropdown pair used on Team Explorer and Player pages.
// onChange(year, month) fires whenever either selection changes; month always resets
// to 'full' (Full Season) when the year changes, since prior months may not apply.
function buildYearMonthSelector(yearsList, monthsForYearFn, currentYear, currentMonth, onChange){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:10px;align-items:center;';
  const selStyle = 'padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);background:#fff;';

  const yearSel = document.createElement('select'); yearSel.style.cssText = selStyle;
  yearsList.forEach(y=>{ const op=document.createElement('option'); op.value=y; op.textContent=y; yearSel.appendChild(op); });
  yearSel.value = currentYear;

  const monthSel = document.createElement('select'); monthSel.style.cssText = selStyle;
  function rebuildMonths(year, preferredMonth){
    monthSel.innerHTML = '';
    const full = document.createElement('option'); full.value='full'; full.textContent='Full Season'; monthSel.appendChild(full);
    monthsForYearFn(year).forEach(m=>{
      const op = document.createElement('option'); op.value=m; op.textContent=MONTH_NAMES[m]||m; monthSel.appendChild(op);
    });
    monthSel.value = preferredMonth;
    if(monthSel.value !== preferredMonth) monthSel.value = 'full'; // preferred month doesn't exist in this year
  }
  rebuildMonths(currentYear, currentMonth);

  yearSel.addEventListener('change', ()=>{ rebuildMonths(yearSel.value, 'full'); onChange(yearSel.value, monthSel.value); });
  monthSel.addEventListener('change', ()=>{ onChange(yearSel.value, monthSel.value); });

  wrap.appendChild(yearSel); wrap.appendChild(monthSel);
  return wrap;
}

// Computes Player Totals / Averages / Opponent Totals entirely client-side for an arbitrary
// set of game IDs — this is what makes Year/Month (or any future custom range) possible
// without needing Python to have pre-baked every possible slice server-side.
function computeTeamSummaryClientSide(team, gameIds){
  const STAT_KEYS = ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'];
  const totalsMap = {};
  gameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return;
    g.rows.forEach(r=>{
      if(r.team !== team) return;
      if(!totalsMap[r.athleteId]){
        const row = {player:r.player, athleteId:r.athleteId, gp:0, gs:0};
        STAT_KEYS.forEach(k=>{ row[k]=0; });
        totalsMap[r.athleteId] = row;
      }
      const acc = totalsMap[r.athleteId];
      if(!r.dnp){ acc.gp++; if(r.starter) acc.gs++; }
      STAT_KEYS.forEach(k=>{ const v = r[k]; if(v!==null && v!==undefined) acc[k]+=v; });
    });
  });
  const totals = Object.values(totalsMap).map(t=>{
    const bio = bioLookup(t.player, team);
    return Object.assign({}, t, bio, {
      fgPct: t.fga ? Math.round((t.fgm/t.fga)*10000)/10000 : null,
      tpPct: t.tpa ? Math.round((t.tpm/t.tpa)*10000)/10000 : null,
      ftPct: t.fta ? Math.round((t.ftm/t.fta)*10000)/10000 : null,
    });
  });
  const averages = totals.map(t=>{
    const a = Object.assign({}, t);
    STAT_KEYS.forEach(k=>{ a[k] = t.gp ? Math.round((t[k]/t.gp)*100)/100 : null; });
    return a;
  });
  const opponents = gameIds.map(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return null;
    const isHome = g.home === team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    const oppName = isHome ? g.away : g.home;
    const oppRows = g.rows.filter(r=>r.team !== team);
    const sum = key => oppRows.reduce((a,r)=> a + (r[key]||0), 0);
    const oppFgm = sum('fgm'), oppFga = sum('fga'), oppTpm = sum('tpm'), oppTpa = sum('tpa'),
          oppFtm = sum('ftm'), oppFta = sum('fta');
    return {
      date: g.date, opponent: oppName, teamPts, oppPts,
      oppFgm, oppFga, oppFgPct: oppFga ? Math.round((oppFgm/oppFga)*10000)/10000 : null,
      oppTpm, oppTpa, oppFtm, oppFta,
      oppOreb: sum('oreb'), oppDreb: sum('dreb'), oppReb: sum('reb'),
      oppAst: sum('ast'), oppStl: sum('stl'), oppBlk: sum('blk'), oppTo: sum('to'), oppPf: sum('pf'),
    };
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));

  return {totals, averages, opponents};
}

  return c;
});

function inchesToHeightStr(inches){
  if(inches===null || inches===undefined || isNaN(inches)) return null;
  const feet = Math.floor(inches/12);
  const rem = Math.round((inches - feet*12)*10)/10;
  return `${feet}' ${rem}"`;
}

// Aggregates a team's already-computed per-player totals (from computeTeamSummaryClientSide)
// into one team-level row. Shooting percentages are always computed from the team's combined
// makes/attempts (never averaged from individual players' percentages) since that's the only
// mathematically correct way to roll them up. Height is a season-long weighted average by each
// player's total minutes played, so rotation players count more than end-of-bench players.
function computeLeagueTeamRow(team, gameIds, playerTotals, mode){
  const teamGames = gameIds.length;
  const sumKey = k => playerTotals.reduce((a,p)=> a + (p[k]||0), 0);
  const fgm=sumKey('fgm'), fga=sumKey('fga'), tpm=sumKey('tpm'), tpa=sumKey('tpa'), ftm=sumKey('ftm'), fta=sumKey('fta');

  // Win-loss record \u2014 computed from actual game results, independent of the totals/averages
  // toggle (a record doesn't change shape between those two views the way counting stats do).
  let wins=0, losses=0;
  gameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g || g.homeScore===null || g.awayScore===null) return;
    const isHome = g.home===team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    if(teamPts>oppPts) wins++; else if(teamPts<oppPts) losses++;
  });

  let heightSum=0, heightWeight=0;
  playerTotals.forEach(p=>{
    if(p.heightIn!==null && p.heightIn!==undefined && p.min){ heightSum += p.heightIn*p.min; heightWeight += p.min; }
  });
  const avgHeightIn = heightWeight ? heightSum/heightWeight : null;

  const row = {
    team, gp: teamGames, wins, losses, min: sumKey('min'), pts: sumKey('pts'),
    fgm, fga, fgPct: fga ? Math.round((fgm/fga)*10000)/10000 : null,
    tpm, tpa, tpPct: tpa ? Math.round((tpm/tpa)*10000)/10000 : null,
    ftm, fta, ftPct: fta ? Math.round((ftm/fta)*10000)/10000 : null,
    oreb: sumKey('oreb'), dreb: sumKey('dreb'), reb: sumKey('reb'),
    ast: sumKey('ast'), stl: sumKey('stl'), blk: sumKey('blk'), to: sumKey('to'), pf: sumKey('pf'),
    avgHeight: inchesToHeightStr(avgHeightIn) || '\u2014',
  };
  if(mode==='averages' && teamGames){
    ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'].forEach(k=>{
      row[k] = Math.round((row[k]/teamGames)*100)/100;
    });
  }
  return row;
}

// Same idea as computeLeagueTeamRow, but summed from each game's opponent output (already
// computed per-game by computeTeamSummaryClientSide's `opponents` array) instead of the
// team's own players \u2014 i.e. what a team's opponents did against them, season-long.
function computeLeagueDefenseRow(team, teamGames, opponents, mode){
  const sumKey = k => opponents.reduce((a,o)=> a + (o[k]||0), 0);
  const oppFgm=sumKey('oppFgm'), oppFga=sumKey('oppFga'), oppTpm=sumKey('oppTpm'), oppTpa=sumKey('oppTpa'), oppFtm=sumKey('oppFtm'), oppFta=sumKey('oppFta');

  const row = {
    team, gp: teamGames, oppPts: sumKey('oppPts'),
    oppFgm, oppFga, oppFgPct: oppFga ? Math.round((oppFgm/oppFga)*10000)/10000 : null,
    oppTpm, oppTpa, oppTpPct: oppTpa ? Math.round((oppTpm/oppTpa)*10000)/10000 : null,
    oppFtm, oppFta, oppFtPct: oppFta ? Math.round((oppFtm/oppFta)*10000)/10000 : null,
    oppOreb: sumKey('oppOreb'), oppDreb: sumKey('oppDreb'), oppReb: sumKey('oppReb'),
    oppAst: sumKey('oppAst'), oppStl: sumKey('oppStl'), oppBlk: sumKey('oppBlk'), oppTo: sumKey('oppTo'), oppPf: sumKey('oppPf'),
  };
  if(mode==='averages' && teamGames){
    ['oppPts','oppFgm','oppFga','oppTpm','oppTpa','oppFtm','oppFta','oppOreb','oppDreb','oppReb','oppAst','oppStl','oppBlk','oppTo','oppPf'].forEach(k=>{
      row[k] = Math.round((row[k]/teamGames)*100)/100;
    });
  }
  return row;
}


// League-wide landing page for Team Explorer \u2014 every team's season line, plus every

  const modeLabel = document.createElement('div'); modeLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; modeLabel.textContent='Show:';
  modeWrap.appendChild(modeLabel);

    main.appendChild(na);
    return;
  }

  // Compute each team's player-level summary once, reuse for both tables below.
  const perTeam = {};
  TEAM_NAMES.forEach(team=>{

    const {gameIds, summary} = perTeam[team];

  // Games Back \u2014 standard formula relative to the league leader (best win differential):
  // GB = ((leaderWins - teamWins) + (teamLosses - leaderLosses)) / 2. Whole league, not split
  // by conference/division, since the WNBA standings table this mirrors doesn't split either.
  if(teamRows.length){
    const leader = teamRows.reduce((best,r)=> (r.wins-r.losses) > (best.wins-best.losses) ? r : best, teamRows[0]);

  main.appendChild(fn);
}

function bioLookup(player, team){
  const t = DATA.teams[team];
  if(!t) return {};
  const row = t.summaryFull.totals.find(r=>r.player===player);
  if(!row) return {};
  return { height: row.height, weight: row.weight, age: row.age, dob: row.dob, heightIn: row.heightIn };
}

const GAME_COLS_PER_TEAM = GAME_COLS.filter(c=>c.key!=='team');

function computeGameTeamTotals(rows, team){
  const teamRows = rows.filter(r=>r.team===team);
  const sum = k => teamRows.reduce((a,r)=> a + (r[k]||0), 0);
  const fgm=sum('fgm'), fga=sum('fga'), tpm=sum('tpm'), tpa=sum('tpa'), ftm=sum('ftm'), fta=sum('fta');
  return {
    min: sum('min'), pts: sum('pts'), fgm, fga, fgPct: fga? Math.round((fgm/fga)*10000)/10000 : null,
    tpm, tpa, tpPct: tpa? Math.round((tpm/tpa)*10000)/10000 : null,
    ftm, fta, ftPct: fta? Math.round((ftm/fta)*10000)/10000 : null,
    oreb: sum('oreb'), dreb: sum('dreb'), reb: sum('reb'),
    ast: sum('ast'), stl: sum('stl'), blk: sum('blk'), to: sum('to'), pf: sum('pf'),
  };
}

function median(arr){
  if(!arr.length) return null;
  const s = arr.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : Math.round(((s[mid-1]+s[mid])/2)*100)/100;
}
function mode(arr){
  if(!arr.length) return null;
  const counts = new Map(); let best=null, bestCount=0;
  arr.forEach(v=>{ const c=(counts.get(v)||0)+1; counts.set(v,c); if(c>bestCount){ bestCount=c; best=v; } });
  return best;
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');

// ================= Defense vs. Position rankings (Points/Rebounds/Assists/Threes/PRA, by G/F/C) =================
// Entirely derived from box scores already loaded client-side \u2014 no extra data source needed.
// For every stat + position bucket, ranks all 15 teams by how much of that stat they've allowed
// per game to opposing players of that position, season-long. Rank 1 = stingiest defense (fewest
// allowed); last place = most generous defense (most allowed), matching the convention requested.

// Buckets ESPN's position strings (G, F, C, and hybrids like "G-F") down to a single primary
// position by taking whichever letter appears first \u2014 the simplification broadcasts use too.
function positionBucket(pos){
  if(!pos) return null;
  const p = String(pos).toUpperCase();
  if(p.indexOf('C')===0) return 'C';
  if(p.indexOf('F')===0) return 'F';
  if(p.indexOf('G')===0) return 'G';
  return null;
}

// A player's position isn't stored on her season summary, only per-game box score rows \u2014
// so this scans every game once (cached after first call) and takes each player's most
// frequently listed position across the season as her "primary" position.
let _playerPositionCache = null;
function getPlayerPosition(playerName, team){
  if(!_playerPositionCache){
    _playerPositionCache = {};
    Object.values(DATA.games).forEach(g=>{
      g.rows.forEach(r=>{
        if(!r.pos) return;
        const key = r.player+'|'+r.team;
        if(!_playerPositionCache[key]) _playerPositionCache[key] = {};
        _playerPositionCache[key][r.pos] = (_playerPositionCache[key][r.pos]||0) + 1;
      });
    });
  }
  const counts = _playerPositionCache[playerName+'|'+team];
  if(!counts) return null;
  let best=null, bestCount=-1;
  Object.entries(counts).forEach(([pos,c])=>{ if(c>bestCount){ best=pos; bestCount=c; } });
  return best;
}

// Season-long (not tied to the Full Season/L15/L10/L5 hit-rate window \u2014 per-position splits
// need the bigger sample), cached after first computation since it scans every game once.
let _defenseVsPositionCache = null;
function computeDefenseVsPosition(){
  if(_defenseVsPositionCache) return _defenseVsPositionCache;
  const STAT_KEYS = ['pts','reb','ast','tpm','pra'];
  const BUCKETS = ['G','F','C'];
  const allowed = {};
  TEAM_NAMES.forEach(team=>{
    allowed[team] = {};
    BUCKETS.forEach(b=>{ allowed[team][b] = {pts:0,reb:0,ast:0,tpm:0,pra:0}; });
  });
  Object.values(DATA.games).forEach(g=>{
    g.rows.forEach(r=>{
      if(r.dnp) return;
      const bucket = positionBucket(r.pos);
      if(!bucket) return;
      const defTeam = r.team===g.home ? g.away : g.home;
      if(!allowed[defTeam]) return;
      const acc = allowed[defTeam][bucket];
      acc.pts += r.pts||0; acc.reb += r.reb||0; acc.ast += r.ast||0; acc.tpm += r.tpm||0;
      acc.pra += (r.pts||0)+(r.reb||0)+(r.ast||0);
    });
  });

  const perGame = {};
  TEAM_NAMES.forEach(team=>{
    const gp = DATA.teams[team] ? DATA.teams[team].gameIdsFull.length : 0;
    perGame[team] = {};
    BUCKETS.forEach(b=>{
      perGame[team][b] = {};
      STAT_KEYS.forEach(k=>{ perGame[team][b][k] = gp ? allowed[team][b][k]/gp : null; });
    });
  });

  const ranks = {};
  TEAM_NAMES.forEach(team=>{ ranks[team] = {G:{},F:{},C:{}}; });
  BUCKETS.forEach(bucket=>{
    STAT_KEYS.forEach(statKey=>{
      const withData = TEAM_NAMES.filter(t=> perGame[t][bucket][statKey]!==null);
      const sorted = withData.slice().sort((a,b)=> perGame[a][bucket][statKey]-perGame[b][bucket][statKey]);
      sorted.forEach((team,i)=>{
        ranks[team][bucket][statKey] = { rank: i+1, of: sorted.length, perGame: Math.round(perGame[team][bucket][statKey]*10)/10 };
      });
    });
  });
  _defenseVsPositionCache = ranks;
  return ranks;
}
function getDefenseRank(opponentTeam, statKey, bucket){
  if(!bucket) return null;
  const ranks = computeDefenseVsPosition();
  return (ranks[opponentTeam] && ranks[opponentTeam][bucket] && ranks[opponentTeam][bucket][statKey]) || null;
}
const POSITION_LABEL = {G:'Guards', F:'Forwards', C:'Centers'};

// Builds the small colored "rank/of" cell used in the player props tables. Green = worse
// defense for that stat+position (more favorable matchup for an Over bet); red = tougher
// defense (more favorable for an Under bet). Returns a dash if position/data isn't available.
function defRankCell(opponentTeam, statKey, pname, team, marketLabel){
  const bucket = positionBucket(getPlayerPosition(pname, team));
  const r = bucket ? getDefenseRank(opponentTeam, statKey, bucket) : null;
  if(!r) return document.createTextNode('\u2014');
  const span = document.createElement('span');
  const favorableForOver = r.rank > (r.of/2);
  span.style.cssText = `font-weight:700;font-size:12px;color:${favorableForOver?'var(--green)':'var(--red)'};cursor:help;`;
  span.textContent = `${r.rank}/${r.of}`;
  span.title = `${FULL_TEAM_NAME[opponentTeam]||opponentTeam} allows ${r.perGame} ${(marketLabel||'').toLowerCase()} per game to ${POSITION_LABEL[bucket]} this season \u2014 ranked ${r.rank} of ${r.of} (1 = stingiest defense, ${r.of} = most generous).`;
  return span;
}
// Companion to defRankCell \u2014 the raw "X per game allowed" number that's otherwise only
// visible in defRankCell's hover tooltip, shown as its own column.
function defAllowedCell(opponentTeam, statKey, pname, team){
  const bucket = positionBucket(getPlayerPosition(pname, team));
  const r = bucket ? getDefenseRank(opponentTeam, statKey, bucket) : null;
  if(!r) return document.createTextNode('\u2014');
  const span = document.createElement('span');
  span.style.cssText = 'font-size:12px;color:var(--ink);';
  span.textContent = r.perGame;
  return span;
}

// ================= Injuries =================
// Populated by the pipeline's ESPN injury-report fetch (see fetch_injuries.py), merged into
// DATA.injuries[shortTeam] = [{player, position, status, detail, date}, ...]. Missing/empty
// is handled gracefully throughout \u2014 the pipeline step is best-effort and can come up empty.

// "Key player" = averages 23+ minutes per game this season (current season only; averages
// aren't tracked per-year yet). Uses the same summaryFull.averages data already loaded for
// everything else on the Team Explorer pages.
function isKeyPlayer(playerName, team){
  const t = DATA.teams[team];
  if(!t) return false;
  const row = t.summaryFull.averages.find(r=>r.player===playerName);
  return !!(row && row.min!==null && row.min!==undefined && row.min>=23);
}

function teamInjuries(team){
  return (DATA.injuries && DATA.injuries[team]) || [];
}

// Buckets ESPN's free-text status into a rough severity so the UI can color-code it. Checks
// substrings rather than an exact match since ESPN's exact wording has changed before.
function injuryStatusSeverity(status){
  if(!status) return 'unknown';
  const s = String(status).toLowerCase();
  if(s.includes('out') || s.includes('injured reserve') || s.includes('suspension')) return 'out';
  if(s.includes('doubtful')) return 'doubtful';
  if(s.includes('questionable') || s.includes('day-to-day') || s.includes('day to day') || s.includes('game-time')) return 'questionable';
  return 'other';
}
const INJURY_SEVERITY_COLOR = {out:'var(--red)', doubtful:'var(--red)', questionable:'#b8860b', other:'var(--sub)', unknown:'var(--sub)'};

// Small always-visible banner (shown even while a game card is collapsed) listing any KEY
// player on either team with a reported injury \u2014 the full team injury report (everyone,
// not just key players) lives on each team's own page instead, to keep this one uncluttered.
function buildInjuryBanner(awayShort, homeShort){
  const relevant = [];
  [awayShort, homeShort].forEach(team=>{
    teamInjuries(team).forEach(inj=>{
      if(isKeyPlayer(inj.player, team)) relevant.push(Object.assign({}, inj, {team}));
    });
  });
  if(!relevant.length) return null;
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#fff4e5;border:1px solid #f0b83c;border-radius:6px;padding:8px 12px;margin:8px 0 4px;font-size:12.5px;color:#7a5200;';
  const parts = relevant.map(inj=>{
    const color = INJURY_SEVERITY_COLOR[injuryStatusSeverity(inj.status)] || '#7a5200';
    return `<b style="color:${color}">${inj.player}</b> (${inj.team}${inj.position?', '+inj.position:''}) \u2014 ${inj.status||'Status unclear'}`;
  });
  banner.innerHTML = `\u26a0\ufe0f <b>Key Player Injury Watch:</b> ${parts.join(' &nbsp;\u00b7&nbsp; ')}`;
  return banner;
}



// ================= Season prop-line trend charts (player + team pages) =================
// Reuses the same ODDS_HISTORY snapshot archive that already powers the per-bet "Line
// History" page. A snapshot is only ever saved pre-tipoff (see the Worker's saveSnapshots),
// so for each game we just take whichever saved snapshot is closest to that game's tip-off
// and read the line off it \u2014 that's "the pregame line" for that game.
//
// Coverage caveat (real, not hypothetical): a snapshot only exists for a game/market if the
// app was actually browsed to a page that fetched that market before that game tipped off.
// There's no background job forcing a fetch for every upcoming game \u2014 it happens as a
// byproduct of normal use. So the chart below will have gaps for games nobody happened to
// check via the Odds page before they started, and will fill in more completely for whoever
// (or whatever automation) is opening the app regularly.
const LINE_TREND_MARKETS = [
  {mkey:'player_points', statKey:'pts', label:'Points', color:'#1c4b82'},
  {mkey:'player_rebounds', statKey:'reb', label:'Rebounds', color:'#1f9d55'},
  {mkey:'player_assists', statKey:'ast', label:'Assists', color:'#b3261e'},
  {mkey:'player_threes', statKey:'tpm', label:'Threes', color:'#a5760a'},
  {mkey:'player_points_rebounds_assists', statKey:'pra', label:'Pts+Reb+Ast', color:'#6a3fa0'},
];

let _oddsHistoryCache = null;
// Pages through /history/export (see the Worker \u2014 it caps each response at ~40 records
// to stay under the Workers free-plan 50-subrequest-per-invocation limit), accumulating
// every record across as many calls as it takes. Cached after the first full fetch so
// switching between player/team pages in one session doesn't re-download it repeatedly.
// onProgress(recordsSoFar), if given, is called after each page so callers can show a
// live count instead of a static "Loading\u2026" that looks frozen on a large archive.
async function fetchOddsHistoryCached(onProgress){
  if(_oddsHistoryCache) return _oddsHistoryCache;
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  let all = [];
  let cursor = null;
  let guard = 0; // hard stop so a Worker bug can't spin this forever
  while(guard++ < 200){
    const url = cursor ? `${workerBase}/history/export?cursor=${encodeURIComponent(cursor)}` : `${workerBase}/history/export`;
    const page = await fetchJson(url);
    if(page && page.error) throw new Error(page.error);
    all = all.concat(page.records || []);
    if(onProgress) onProgress(all.length);
    if(page.done || !page.cursor) break;
    cursor = page.cursor;
  }
  all.sort((a,b)=> (a.fetchedAt||'').localeCompare(b.fetchedAt||''));
  _oddsHistoryCache = all;
  return _oddsHistoryCache;
}

// Builds {pts:[{date,value}], reb:[...], ast:[...], tpm:[...], pra:[...]} for one player,
// one point per game (the DraftKings line at her last pre-tipoff snapshot for that game).
function buildPlayerLineSeries(playerName, team, history){
  const fullName = FULL_TEAM_NAME[team];
  const relevant = (history||[]).filter(snap => snap.homeTeam===fullName || snap.awayTeam===fullName);

  const latestByEvent = {};
  relevant.forEach(snap=>{
    const existing = latestByEvent[snap.eventId];
    if(!existing || snap.fetchedAt > existing.fetchedAt) latestByEvent[snap.eventId] = snap;
  });

  const series = {};
  LINE_TREND_MARKETS.forEach(m=>{ series[m.statKey] = []; });

  Object.values(latestByEvent).forEach(snap=>{
    const dk = (snap.data.bookmakers||[]).find(b=>b.key==='draftkings');
    if(!dk) return;
    const date = (snap.commenceTime||'').slice(0,10);
    if(!date) return;
    LINE_TREND_MARKETS.forEach(m=>{
      const market = (dk.markets||[]).find(mk=>mk.key===m.mkey);
      if(!market) return;
      const outcome = (market.outcomes||[]).find(o=>o.description===playerName);
      if(!outcome || outcome.point===undefined || outcome.point===null) return;
      series[m.statKey].push({date, value: outcome.point});
    });
  });

  LINE_TREND_MARKETS.forEach(m=>{ series[m.statKey].sort((a,b)=>a.date.localeCompare(b.date)); });
  return series;
}

// Renders a toggleable multi-series line chart into `container` for the given series map
// (see buildPlayerLineSeries). Stats with zero data points are omitted from the legend
// entirely rather than shown as an empty/misleading toggle.
function renderLineTrendChart(container, series){
  container.innerHTML = '';
  const activeMarkets = LINE_TREND_MARKETS.filter(m => (series[m.statKey]||[]).length > 0);
  if(activeMarkets.length===0){
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
    na.textContent = 'No tracked prop-line history yet for this player \u2014 lines are captured automatically as the DraftKings Odds page is browsed before each game tips off, so this fills in on its own as the season goes on.';
    container.appendChild(na);
    return;
  }

  const checkboxState = {};
  activeMarkets.forEach(m=>{ checkboxState[m.statKey] = true; });

  const legend = document.createElement('div'); legend.style.cssText='display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;';
  const svgHolder = document.createElement('div');

  function buildSvg(){
    const W = 700, H = 280, padL = 40, padR = 16, padT = 16, padB = 28;
    const visibleMarkets = activeMarkets.filter(m=>checkboxState[m.statKey]);
    if(visibleMarkets.length===0) return '<div style="color:var(--sub);font-size:12px;padding:12px 0;">No stats selected.</div>';

    const allDates = Array.from(new Set(visibleMarkets.flatMap(m=>series[m.statKey].map(p=>p.date)))).sort();
    const allValues = visibleMarkets.flatMap(m=>series[m.statKey].map(p=>p.value));
    const minV = Math.min(...allValues), maxV = Math.max(...allValues);
    const vRange = (maxV - minV) || 1;
    const yFor = v => padT + (H-padT-padB) * (1 - (v-minV)/vRange);
    const xFor = d => {
      const idx = allDates.indexOf(d);
      return padL + (allDates.length<=1 ? (W-padL-padR)/2 : (W-padL-padR) * idx/(allDates.length-1));
    };

    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:inherit;">`;
    for(let i=0;i<=4;i++){
      const v = minV + (vRange*i/4);
      const y = yFor(v);
      svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`;
      svg += `<text x="${padL-6}" y="${(y+4).toFixed(1)}" font-size="10" text-anchor="end" fill="#6b7280">${Math.round(v*10)/10}</text>`;
    }
    const labelStep = Math.max(1, Math.ceil(allDates.length/6));
    allDates.forEach((d,i)=>{
      if(i%labelStep!==0 && i!==allDates.length-1) return;
      const x = xFor(d);
      svg += `<text x="${x.toFixed(1)}" y="${H-padB+16}" font-size="9" text-anchor="middle" fill="#6b7280">${d.slice(5)}</text>`;
    });

    visibleMarkets.forEach(m=>{
      const pts = series[m.statKey];
      if(pts.length===0) return;
      const path = pts.map((p,i)=> `${i===0?'M':'L'} ${xFor(p.date).toFixed(1)} ${yFor(p.value).toFixed(1)}`).join(' ');
      svg += `<path d="${path}" fill="none" stroke="${m.color}" stroke-width="2"/>`;
      pts.forEach(p=>{
        svg += `<circle cx="${xFor(p.date).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="3" fill="${m.color}"><title>${p.date}: ${p.value}</title></circle>`;
      });
    });
    svg += '</svg>';
    return svg;
  }
  function draw(){ svgHolder.innerHTML = buildSvg(); }

  activeMarkets.forEach(m=>{
    const lbl = document.createElement('label'); lbl.style.cssText=`display:flex;align-items:center;gap:5px;font-size:12px;color:${m.color};font-weight:700;cursor:pointer;`;
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.addEventListener('change', ()=>{ checkboxState[m.statKey]=cb.checked; draw(); });
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(`${m.label} (${series[m.statKey].length})`));
    legend.appendChild(lbl);
  });

  container.appendChild(legend);
  container.appendChild(svgHolder);
  draw();
}

// 'pra' isn't a stored field on a game-log entry — it's derived on the fly from pts+reb+ast.
function statValue(g, statKey){
  if(statKey==='pra'){
    if(g.pts===null||g.pts===undefined||g.reb===null||g.reb===undefined||g.ast===null||g.ast===undefined) return null;
    return g.pts + g.reb + g.ast;
  }
  return g[statKey];
}

// windowSize: 'all' | 15 | 10 | 5 — how many of the most recent games to look at
function windowSlice(arr, windowSize){
  if(windowSize==='all' || !windowSize) return arr;
  return arr.slice(Math.max(0, arr.length - windowSize));
}
// Team gameIds (from filterGameIdsByYearMonth) run most-recent-first (descending), unlike
// a player's game log which runs oldest-first \u2014 so "last N games" here means the first N
// entries, not the tail windowSlice takes for ascending-ordered arrays.
function windowSliceRecentFirst(arr, windowSize){
  if(windowSize==='all' || !windowSize) return arr;
  return arr.slice(0, windowSize);
}

function hitRateFor(playerName, team, statKey, line, windowSize){
  // line is the sportsbook point (e.g. 12.5). "Over" hits when actual >= ceil(line) for a .5 line.
  const threshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
  const key = `${playerName}|${team}`;
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  const played = windowSlice(pl.log, windowSize).filter(g=>!g.dnp);
  const gp = played.length;
  if(gp===0) return {gp:0, hits:0, rate:0, found:true};
  const hits = played.filter(g=>{ const v=statValue(g,statKey); return v!==null && v>=threshold; }).length;
  return {gp, hits, rate: hits/gp, found:true};
}

// For DraftKings "milestone" alt lines (displayed as "20+", "22+", etc.) — unlike a standard
// Over/Under line, the point value here already IS the literal minimum to hit, so no ceil/+1
// adjustment is applied (that adjustment is specifically for .5-style Over/Under lines).
function altHitRateFor(playerName, team, statKey, threshold, windowSize){
  const key = `${playerName}|${team}`;
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  const played = windowSlice(pl.log, windowSize).filter(g=>!g.dnp);
  const gp = played.length;
  if(gp===0) return {gp:0, hits:0, rate:0, found:true};
  const hits = played.filter(g=>{ const v=statValue(g,statKey); return v!==null && v>=threshold; }).length;
  return {gp, hits, rate: hits/gp, found:true};
}

// Derives a windowed view ('all' | 15 | 10 | 5) from the full-season log on the fly.
function windowedPlayerLog(key, windowSize){
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  return { player: pl.player, team: pl.team, athleteId: pl.athleteId, log: windowSlice(pl.log, windowSize) };
}

function findPlayerTeam(playerName, teamA, teamB){
  if(DATA.fullPlayerLogs[`${playerName}|${teamA}`]) return teamA;
  if(DATA.fullPlayerLogs[`${playerName}|${teamB}`]) return teamB;
  return null;
}

// ---- Team-level hit-rate calculators, based on each team's own full-season game log (final scores only), windowed ----
function teamGameLog(team, windowSize){
  const log = DATA.fullTeamGames[team] || [];
  return windowSlice(log, windowSize);
}
function teamMoneylineHitRate(team, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  const hits = log.filter(g=>g.teamPts>g.oppPts).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}
function teamSpreadHitRate(team, point, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>((g.teamPts-g.oppPts)+point) > 0).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}
function teamTotalHitRate(team, point, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>(g.teamPts+g.oppPts) > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}
function teamOwnTotalHitRate(team, point, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>g.teamPts > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}

// ---- Half-aware versions, using h1Team/h1Opp/h2Team/h2Opp fields derived from play-by-play.
// Games where that data wasn't available (rare — e.g. a missing/incomplete pbp log) are simply
// excluded from the denominator rather than treated as a miss. ----
function teamGameLogHalf(team, windowSize, half){
  const log = teamGameLog(team, windowSize);
  const teamKey = half===1 ? 'h1TeamPts' : 'h2TeamPts';
  const oppKey = half===1 ? 'h1OppPts' : 'h2OppPts';
  return log.filter(g=>g[teamKey]!==null && g[teamKey]!==undefined && g[oppKey]!==null && g[oppKey]!==undefined)
            .map(g=>({teamPts:g[teamKey], oppPts:g[oppKey]}));
}
function teamMoneylineHitRateHalf(team, half, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  const hits = log.filter(g=>g.teamPts>g.oppPts).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}
function teamSpreadHitRateHalf(team, half, point, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>((g.teamPts-g.oppPts)+point) > 0).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}
function teamTotalHitRateHalf(team, half, point, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>(g.teamPts+g.oppPts) > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}
function teamOwnTotalHitRateHalf(team, half, point, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>g.teamPts > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}

function americanToDecimal(price){
  if(price===undefined||price===null) return null;
  return price>0 ? 1+price/100 : 1+100/Math.abs(price);
}
function decimalToAmerican(dec){
  if(dec===null||dec===undefined||dec<=1) return null;
  if(dec>=2) return Math.round((dec-1)*100);
  return Math.round(-100/(dec-1));
}
function fmtAmerican(price){
  if(price===null||price===undefined) return '\u2014';
  return (price>0?'+':'')+price;
}

// Generic filterable table used on the Odds page (Player Props + Alt Lines tables).
// columns: [{key, label, type:'text'|'select'|'numRange', options?, align?}]
// dataRows: [{filterValues:{[colKey]: rawValueForFiltering}, cells:[stringOrNode, ...] }]
function buildFilterableTable(container, columns, dataRows){
  const filterState = {};
  const wrapDiv = document.createElement('div'); wrapDiv.style.marginBottom='4px';

  const filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:6px;';
  columns.forEach(col=>{
    const group = document.createElement('div');
    group.style.cssText = 'display:flex;flex-direction:column;gap:2px;';
    const lbl = document.createElement('label'); lbl.textContent = col.label;
    lbl.style.cssText='font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;';
    group.appendChild(lbl);
    const inputStyle = 'padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);';
    if(col.type==='text'){
      const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Search\u2026';
      inp.style.cssText = inputStyle + 'width:120px;';
      inp.addEventListener('input', ()=>{ filterState[col.key] = inp.value.trim(); render(); });
      group.appendChild(inp);
    } else if(col.type==='select'){
      const sel = document.createElement('select');
      sel.style.cssText = inputStyle;
      const optAll = document.createElement('option'); optAll.value=''; optAll.textContent='All'; sel.appendChild(optAll);
      (col.options||[]).forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
      sel.addEventListener('change', ()=>{ filterState[col.key] = sel.value; render(); });
      group.appendChild(sel);
    } else if(col.type==='numRange'){
      const rangeRow = document.createElement('div'); rangeRow.style.cssText='display:flex;gap:4px;';
      const minI = document.createElement('input'); minI.type='number'; minI.placeholder='Min'; minI.style.cssText = inputStyle + 'width:52px;';
      const maxI = document.createElement('input'); maxI.type='number'; maxI.placeholder='Max'; maxI.style.cssText = inputStyle + 'width:52px;';
      function upd(){ filterState[col.key] = { min: minI.value===''?null:parseFloat(minI.value), max: maxI.value===''?null:parseFloat(maxI.value) }; render(); }
      minI.addEventListener('input', upd); maxI.addEventListener('input', upd);
      rangeRow.appendChild(minI); rangeRow.appendChild(maxI);
      group.appendChild(rangeRow);
    }
    filterBar.appendChild(group);
  });
  const clearBtn = document.createElement('button'); clearBtn.textContent='Clear Filters';
  clearBtn.style.cssText = 'padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer;font-family:var(--sans);';
  clearBtn.addEventListener('click', ()=>{
    Object.keys(filterState).forEach(k=>delete filterState[k]);
    filterBar.querySelectorAll('input').forEach(i=>{ i.value=''; });
    filterBar.querySelectorAll('select').forEach(s=>{ s.value=''; });
    render();
  });
  filterBar.appendChild(clearBtn);

  const table = document.createElement('table'); table.style.width='100%';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  columns.forEach(col=>{ const th=document.createElement('th'); th.textContent=col.label; if(col.align==='left') th.classList.add('left'); trh.appendChild(th); });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody'); table.appendChild(tbody);
  const countDiv = document.createElement('div'); countDiv.style.cssText='font-size:11.5px;color:var(--sub);margin:2px 0 6px;';

  function passes(row){
    return columns.every(col=>{
      const f = filterState[col.key];
      if(f===undefined || f===null || f==='') return true;
      const val = row.filterValues[col.key];
      if(col.type==='text'){ if(val===null||val===undefined) return false; return String(val).toLowerCase().includes(String(f).toLowerCase()); }
      if(col.type==='select'){ return String(val)===String(f); }
      if(col.type==='numRange'){
        if(val===null||val===undefined) return false;
        if(f.min!==null && f.min!==undefined && val<f.min) return false;
        if(f.max!==null && f.max!==undefined && val>f.max) return false;
        return true;
      }
      return true;
    });
  }

  function render(){
    tbody.innerHTML='';
    const filtered = dataRows.filter(passes);
    filtered.forEach(row=>{
      const tr = document.createElement('tr');
      columns.forEach((col,i)=>{
        const td = document.createElement('td');
        if(col.align==='left') td.classList.add('left');
        td.style.padding='5px 8px'; td.style.borderBottom='1px solid var(--line)'; td.style.fontSize='12.5px';
        if(col.align!=='left') td.style.textAlign='center';
        const cell = row.cells[i];
        if(cell instanceof Node) td.appendChild(cell); else td.textContent = (cell===undefined||cell===null) ? '\u2014' : cell;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    countDiv.textContent = `${filtered.length} / ${dataRows.length} rows shown`;
  }

  wrapDiv.appendChild(filterBar);
  wrapDiv.appendChild(countDiv);
  wrapDiv.appendChild(table);
  container.appendChild(wrapDiv);
  render();
}

function resultBadge(hr){
  const span = document.createElement('span'); span.className='result neutral';
  span.style.display='inline-block'; span.style.padding='2px 8px'; span.style.borderRadius='4px'; span.style.fontSize='12px';
  if(!hr || !hr.found){ span.textContent='no data'; return span; }
  const pct = Math.round(hr.rate*100);
  if(hr.gp===0){ span.textContent='no games'; return span; }
  if(hr.rate >= 0.6){
    span.className = pct>=96 ? 'result gold' : 'result green';
    span.textContent = `${hr.hits}/${hr.gp} (${pct}% OVER)`;
  } else if(hr.rate <= 0.4){
    const underPct = 100-pct;
    span.className = underPct>=96 ? 'result gold' : 'result red';
    span.textContent = `${hr.hits}/${hr.gp} (${underPct}% UNDER)`;
  } else {
    span.className='result neutral'; span.textContent = `${hr.hits}/${hr.gp} (${pct}%)`;
  }
  return span;
}

function dkOutcome(market, name){
  if(!market) return null;
  const o = market.outcomes.find(x=>x.name===name);
  return o || null;
}
function dkPlayerOutcomes(market, playerName, side){
  if(!market) return null;
  return market.outcomes.find(x=>x.description===playerName && x.name===side) || null;
}

async function fetchJson(url, options){
  const resp = await fetch(url, options);
  if(!resp.ok){
    const text = await resp.text().catch(()=> '');
    throw new Error(`HTTP ${resp.status}: ${text.slice(0,200)}`);
  }
  return resp.json();
}

// ---- Shared Worker URL persistence + default, used by both the Home page and the Odds page ----
const WORKER_URL_LS_KEY = 'wnba_odds_worker_url';
// Baked-in default Worker URL — since this is just an address (not a secret; your real API
// key lives inside the Worker's environment now), it's safe to hardcode so every device
// works immediately with no per-browser setup step.
const DEFAULT_WORKER_URL = 'https://odds-api-proxy.allyearball.workers.dev';

async function saveUrl(workerUrl){
  try{
    if(window.storage && window.storage.set){ await window.storage.set('odds_worker_url', workerUrl, false); }
  }catch(e){ /* fall through to localStorage */ }
  try{ localStorage.setItem(WORKER_URL_LS_KEY, workerUrl); }catch(e){ /* ignore */ }
}
async function loadSavedUrl(){
  try{
    if(window.storage && window.storage.get){
      const res = await window.storage.get('odds_worker_url', false);
      if(res && res.value) return res.value;
    }
  }catch(e){ /* fall through */ }
  try{ return localStorage.getItem(WORKER_URL_LS_KEY); }catch(e){ return null; }
}

// ---- Home page: today's Top 10 bets, fetched fresh each visit (today's games + only the
// markets gatherCandidateLegs actually needs, so this stays a light, fast fetch) ----
async function renderHomePage(){
  lastRender = () => renderHomePage();
  main.innerHTML = '';
  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\ud83c\udfe0 Today\u2019s Top 30 Bets</h2><div class="meta">Pulled live from DraftKings via your Worker, ranked by historical hit rate over the last 10 and 15 games \u2014 same method as the DraftKings Odds page.</div>`;
  main.appendChild(head);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.marginBottom='14px';
  statusDiv.textContent = 'Loading today\u2019s games\u2026';
  main.appendChild(statusDiv);

  const refreshBtn = document.createElement('button'); refreshBtn.className='addbtn'; refreshBtn.textContent = '\u21bb Refresh';
  refreshBtn.style.marginBottom = '14px';
  refreshBtn.addEventListener('click', ()=>renderHomePage());
  main.appendChild(refreshBtn);

  const dl10Btn = document.createElement('button'); dl10Btn.className='addbtn'; dl10Btn.textContent = '\ud83d\udcf7 Download Top 10 Screenshot';
  dl10Btn.style.cssText = 'margin-bottom:14px;margin-left:8px;';
  const dl30Btn = document.createElement('button'); dl30Btn.className='addbtn'; dl30Btn.textContent = '\ud83d\udcf7 Download Top 30 Screenshot';
  dl30Btn.style.cssText = 'margin-bottom:14px;margin-left:8px;';
  main.appendChild(dl10Btn); main.appendChild(dl30Btn);

  const contentDiv = document.createElement('div');
  main.appendChild(contentDiv);

  async function downloadTableScreenshot(rowLimit, btn){
    if(typeof html2canvas === 'undefined'){ alert('Screenshot library didn\u2019t load \u2014 check your internet connection and try again.'); return; }
    const wrap = contentDiv.querySelector('.table-wrap');
    if(!wrap){ alert('Nothing to screenshot yet \u2014 wait for the table to load first.'); return; }
    const origText = btn.textContent; btn.disabled = true; btn.textContent = 'Capturing\u2026';
    try{
      const clone = wrap.cloneNode(true);
      const rows = clone.querySelectorAll('tbody tr');
      rows.forEach((tr, idx)=>{ if(idx >= rowLimit) tr.remove(); });
      clone.style.cssText = 'position:fixed;top:-99999px;left:0;background:#fff;padding:12px;width:900px;';
      document.body.appendChild(clone);
      const canvas = await html2canvas(clone, {backgroundColor:'#ffffff', scale:2});
      document.body.removeChild(clone);
      const link = document.createElement('a');
      link.download = `wnba-top-${rowLimit}-bets-${new Date().toISOString().slice(0,10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(e){
      alert('Screenshot failed: ' + e.message);
    }
    btn.disabled = false; btn.textContent = origText;
  }
  dl10Btn.addEventListener('click', ()=>downloadTableScreenshot(10, dl10Btn));
  dl30Btn.addEventListener('click', ()=>downloadTableScreenshot(30, dl30Btn));

  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;

  try{
    const events = await fetchJson(
      `${workerBase}/v4/sports/basketball_wnba/odds?regions=us&bookmakers=draftkings&markets=h2h,spreads,totals&oddsFormat=american`
    );
    if(!events || events.length===0){
      statusDiv.textContent = 'DraftKings has no WNBA games listed right now.';
      return;
    }
    const todayStr = new Date().toDateString();
    const todaysGames = events.filter(ev => new Date(ev.commence_time).toDateString() === todayStr);
    if(todaysGames.length===0){
      statusDiv.textContent = 'No games scheduled for today among what DraftKings currently has listed.';
      return;
    }

    statusDiv.textContent = `Found ${todaysGames.length} game(s) today \u2014 fetching player props and team totals\u2026`;
    const cachedForToday = [];
    for(const ev of todaysGames){
      let detail = null;
      try{
        detail = await fetchJson(
          `${workerBase}/v4/sports/basketball_wnba/events/${ev.id}/odds`
          + `?regions=us&bookmakers=draftkings&markets=team_totals,player_points,player_rebounds,player_assists,player_threes&oddsFormat=american`
        );
      }catch(e){ console.warn('Detail fetch failed for', ev.id, e); }
      cachedForToday.push({ev, detail});
    }
    renderTopBetsTable(contentDiv, cachedForToday, 30);
    statusDiv.textContent = `Showing today\u2019s top bets across ${todaysGames.length} game(s). Tap Refresh to pull the latest lines again.`;
  }catch(e){
    statusDiv.textContent = `Couldn\u2019t load today\u2019s bets: ${e.message}. Double-check your Worker URL is reachable, or visit the DraftKings Odds page directly.`;
  }
}

function renderOddsPage(){
  lastRender = () => renderOddsPage();
  main.innerHTML = '';
  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>DraftKings Odds \u2014 Live (via The Odds API)</h2><div class="meta">Pulls each team's next scheduled game through your own Cloudflare Worker proxy \u2014 your real API key lives only in your Worker's environment, never in this file or in your browser.</div>`;
  main.appendChild(head);

  const banner = document.createElement('div'); banner.className='banner';
  banner.innerHTML = `<b>Note:</b> DraftKings only posts lines a day or two before tip-off, so not every team's "next game" will have odds yet \u2014 those will just show as unavailable. Moneyline, spread, and total lines (full game, 1st half, and 2nd half) all show a hit-rate badge for each team \u2014 same 60% color rule as everywhere else, with <b style="color:var(--gold)">gold</b> instead of green whenever that rate is 96% or higher. Half hit rates are derived from this season's play-by-play data. Player prop hit rates use the same rule, windowed the same way, and both prop tables can be filtered by any column. Click a game's title to drill into just that matchup with its own window toggle. Each game also gets two auto-generated parlay sections (75%+ and 70%+ cutoffs) at the bottom. Full-game Moneyline, Spread, and Total lines also show a small "VSiN: X% handle / Y% bets" line \u2014 DraftKings betting splits pulled from VSiN Pro \u2014 showing "\u2014" wherever VSiN hasn't posted a split yet. VSiN doesn't publish splits for halves, team totals, player props, alt lines, or parlays, so those sections don't show this line at all.`;
  main.appendChild(banner);

  const controls = document.createElement('div'); controls.style.cssText='display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap;';
  const urlInput = document.createElement('input'); urlInput.type='text'; urlInput.placeholder='Paste your Worker URL (e.g. https://odds-api-proxy.yourname.workers.dev)';
  urlInput.style.cssText='padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;width:380px;font-family:var(--sans);';
  const fetchBtn = document.createElement('button'); fetchBtn.className='addbtn'; fetchBtn.textContent='Fetch Live DraftKings Odds';
  controls.appendChild(urlInput); controls.appendChild(fetchBtn);
  main.appendChild(controls);

  const rememberRow = document.createElement('div'); rememberRow.style.cssText='display:flex;align-items:center;gap:16px;margin-bottom:14px;font-size:12.5px;color:var(--sub);';
  const rememberLabel = document.createElement('label'); rememberLabel.style.cssText='display:flex;align-items:center;gap:6px;cursor:pointer;';
  const rememberCb = document.createElement('input'); rememberCb.type='checkbox'; rememberCb.checked = true;
  rememberLabel.appendChild(rememberCb); rememberLabel.appendChild(document.createTextNode('Remember my Worker URL on this device'));
  const clearLink = document.createElement('a'); clearLink.href='javascript:void(0)'; clearLink.className='player-link'; clearLink.textContent='Forget saved URL';
  rememberRow.appendChild(rememberLabel); rememberRow.appendChild(clearLink);
  main.appendChild(rememberRow);

  // ---- Push notifications: gold-tier (96%+) bets with 10+ games of history behind them ----
  const pushRow = document.createElement('div');
  pushRow.style.cssText = 'display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:10px 14px;background:var(--goldbg);border:1px solid var(--gold);border-radius:6px;flex-wrap:wrap;';
  const pushBtn = document.createElement('button'); pushBtn.className='addbtn'; pushBtn.style.background='var(--gold)';
  pushBtn.textContent = '\ud83d\udd14 Enable Gold-Tier Bet Alerts';
  const pushStatus = document.createElement('div'); pushStatus.style.cssText = 'font-size:12.5px;color:var(--ink);';
  pushStatus.textContent = 'Get a push notification the moment a bet clears 96% with at least 10 games of history behind it. Requires adding this app to your Home Screen first (Share \u2192 Add to Home Screen), then opening it from that icon.';
  pushRow.appendChild(pushBtn); pushRow.appendChild(pushStatus);
  main.appendChild(pushRow);

  pushBtn.addEventListener('click', async ()=>{
    const workerBase = urlInput.value.trim().replace(/\/$/, '') || DEFAULT_WORKER_URL;
    if(!('serviceWorker' in navigator) || !('PushManager' in window)){
      pushStatus.textContent = 'Push notifications aren\u2019t supported in this browser/view. On iPhone: add this app to your Home Screen first, then open it from that icon (not from Safari directly).';
      return;
    }
    try{
      pushStatus.textContent = 'Setting up notifications\u2026';
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      const permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        pushStatus.textContent = 'Notification permission was not granted \u2014 check your iPhone\u2019s Settings > Notifications for this app if you want to enable it later.';
        return;
      }
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      const resp = await fetch(`${workerBase}/push/subscribe`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(sub),
      });
      if(resp.ok){
        pushStatus.textContent = '\u2705 Notifications enabled! You\u2019ll get a push whenever a gold-tier (96%+) bet with 10+ games of history appears on today\u2019s slate.';
      } else {
        pushStatus.textContent = `Saved the subscription locally, but the Worker returned an error (${resp.status}) \u2014 double-check the Worker URL above and that it\u2019s been redeployed with push support.`;
      }
    }catch(e){
      pushStatus.textContent = `Couldn\u2019t enable notifications: ${e.message}. On iPhone this only works after adding the app to your Home Screen and opening it from that icon, not from a regular Safari tab.`;
    }
  });

  const WINDOW_OPTIONS = [ {label:'Full Season', value:'all'}, {label:'Last 15', value:15}, {label:'Last 10', value:10}, {label:'Last 5', value:5} ];

  function buildWindowSelector(labelText, currentValue, onSelect){
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:18px;margin-bottom:16px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 14px;';
    const lbl = document.createElement('div'); lbl.style.cssText='font-weight:700;color:var(--navy2);'; lbl.textContent = labelText;
    row.appendChild(lbl);
    const btns = [];
    WINDOW_OPTIONS.forEach(opt=>{
      const b = document.createElement('button');
      b.textContent = opt.label;
      const setActive = (active)=>{
        b.style.cssText = `padding:5px 12px;border-radius:5px;border:1px solid ${active?'var(--navy2)':'var(--line)'};background:${active?'var(--navy2)':'#fff'};color:${active?'#fff':'var(--ink)'};font-size:12.5px;cursor:pointer;font-family:var(--sans);`;
      };
      setActive(opt.value===currentValue);
      b.addEventListener('click', ()=>{
        btns.forEach(x=>x.setActive(false));
        setActive(true);
        onSelect(opt.value);
      });
      btns.push({btn:b, setActive});
      row.appendChild(b);
    });
    return row;
  }

  let currentWindow = 10; // list-view window, default matches prior behavior
  const windowRow = buildWindowSelector('Hit-rate window:', currentWindow, (val)=>{ currentWindow = val; renderResultsArea(); });
  main.appendChild(windowRow);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.marginBottom='14px';
  main.appendChild(statusDiv);
  const topBetsDiv = document.createElement('div');
  main.appendChild(topBetsDiv);
  const gameBoxesDiv = document.createElement('div');
  main.appendChild(gameBoxesDiv);
  const resultsDiv = document.createElement('div');
  main.appendChild(resultsDiv);

  let cachedFetch = []; // [{ev, detail}] — so switching the window re-renders without hitting the API again
  let viewingSingleGame = null; // {ev, detail} when drilled into one game, else null
  let singleGameWindow = 10;

  // At-a-glance boxes for every game today — team names, spread, total, moneyline, and
  // tip-off time. Click one to jump straight to that game's full bet list. (Note: The Odds
  // API doesn't provide venue/stadium/city data at all, so that's not something these boxes
  // can show — there's simply no field for it in the data this app has access to.)
  function renderGameBoxes(){
    gameBoxesDiv.innerHTML = '';
    if(!cachedFetch.length) return;
    const sec = document.createElement('div'); sec.className='section-title'; sec.style.fontSize='15px';
    sec.textContent = '\ud83c\udfc0 Today\u2019s Games';
    gameBoxesDiv.appendChild(sec);

    const grid = document.createElement('div');

      const dk = (ev.bookmakers||[]).find(b=>b.key==='draftkings');

      const h2h = gameMarkets['h2h'], spreads = gameMarkets['spreads'], totals = gameMarkets['totals'];
      const awayML = dkOutcome(h2h, ev.away_team), homeML = dkOutcome(h2h, ev.home_team);
      const awaySpread = dkOutcome(spreads, ev.away_team), homeSpread = dkOutcome(spreads, ev.home_team);
      const over = dkOutcome(totals, 'Over'), under = dkOutcome(totals, 'Under');
      const dt = new Date(ev.commence_time);

      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff;cursor:pointer;transition:box-shadow .15s;';
      card.addEventListener('mouseenter', ()=>{ card.style.boxShadow='0 2px 8px rgba(0,0,0,.1)'; });
      card.addEventListener('mouseleave', ()=>{ card.style.boxShadow='none'; });
      card.addEventListener('click', ()=>{
        viewingSingleGame = {ev, detail};
        singleGameWindow = 10;
        renderResultsArea();
      });

      const timeStr = dt.toLocaleString(undefined, {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
      const venue = (DATA.teamVenues && DATA.teamVenues[homeShort]) || {};
      const venueStr = venue.name ? `${venue.name}${venue.city ? ' \u2014 '+venue.city+(venue.state?', '+venue.state:'') : ''}` : '';
      card.innerHTML = `
        <div style="font-size:11px;color:var(--sub);margin-bottom:6px;">${timeStr}${venueStr ? ' \u00b7 '+venueStr : ''}</div>
        <div style="font-weight:800;font-size:13.5px;margin-bottom:8px;">${ev.away_team} @ ${ev.home_team}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;margin-bottom:2px;">
          <div>Spread</div><div>Total</div><div>ML</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:12px;margin-bottom:4px;">
          <div>${awaySpread ? (awaySpread.point>0?'+':'')+awaySpread.point : '\u2014'}</div>
          <div>${over ? 'O '+over.point : '\u2014'}</div>
          <div>${awayML ? fmtAmerican(awayML.price) : '\u2014'}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:12px;color:var(--sub);">
          <div>${homeSpread ? (homeSpread.point>0?'+':'')+homeSpread.point : '\u2014'}</div>
          <div>${under ? 'U '+under.point : '\u2014'}</div>

    gameBoxesDiv.appendChild(grid);

  function renderResultsArea(){
    resultsDiv.innerHTML = '';
    if(viewingSingleGame){
      windowRow.style.display = 'none';
      topBetsDiv.style.display = 'none';
      gameBoxesDiv.style.display = 'none';
      const backBtn = document.createElement('button'); backBtn.className='backbtn'; backBtn.textContent='\u2190 Back to all games';
      backBtn.addEventListener('click', ()=>{ viewingSingleGame = null; renderResultsArea(); });
      resultsDiv.appendChild(backBtn);

      const sgWindowRow = buildWindowSelector('Hit-rate window (this game):', singleGameWindow, (val)=>{ singleGameWindow = val; renderResultsArea(); });
      resultsDiv.appendChild(sgWindowRow);

      renderGameOddsBlock(resultsDiv, viewingSingleGame.ev, viewingSingleGame.detail, singleGameWindow, null, false);
    } else {
      windowRow.style.display = '';
      topBetsDiv.style.display = '';
      gameBoxesDiv.style.display = '';
      cachedFetch.forEach(({ev, detail}) => {
        renderGameOddsBlock(resultsDiv, ev, detail, currentWindow, ()=>{
          viewingSingleGame = {ev, detail};
          singleGameWindow = 10;
          renderResultsArea();
        });
      });
    }
  }

  // ---- Worker URL persistence (shared global helpers, defined once near the top of this file) ----
  async function clearSavedUrl(){
    try{ if(window.storage && window.storage.delete) await window.storage.delete('odds_worker_url', false); }catch(e){ /* ignore */ }
    try{ localStorage.removeItem(WORKER_URL_LS_KEY); }catch(e){ /* ignore */ }
    urlInput.value = '';
    statusDiv.textContent = 'Saved Worker URL cleared from this device.';
  }
  clearLink.addEventListener('click', clearSavedUrl);

  async function runFetch(){
    let workerBase = urlInput.value.trim().replace(/\/$/, '');
    if(!workerBase){ statusDiv.textContent = 'Paste your Worker URL first (see the setup instructions Claude gave you).'; return; }
    if(rememberCb.checked){ saveUrl(workerBase); }
    resultsDiv.innerHTML = ''; cachedFetch = []; viewingSingleGame = null;
    statusDiv.textContent = 'Fetching game lines from DraftKings...';
    fetchBtn.disabled = true;
    try{
      const baseUrl = `${workerBase}/v4/sports/basketball_wnba/odds`
        + `?regions=us&bookmakers=draftkings&markets=h2h,spreads,totals&oddsFormat=american`;
      const events = await fetchJson(baseUrl);

      if(!events || events.length===0){
        statusDiv.textContent = 'DraftKings has no WNBA games listed right now (nothing posted yet, or off-season).';
        fetchBtn.disabled = false;
        return;
      }

      statusDiv.textContent = `Found ${events.length} upcoming game(s) with DraftKings lines. Fetching half-lines and player props...`;

      for(let i=0;i<events.length;i++){
        const ev = events[i];
        statusDiv.textContent = `Fetching detail for game ${i+1} of ${events.length}: ${ev.away_team} @ ${ev.home_team}...`;
        let detail = null;
        try{
          const detailUrl = `${workerBase}/v4/sports/basketball_wnba/events/${ev.id}/odds`
            + `?regions=us&bookmakers=draftkings&markets=h2h_h1,h2h_h2,spreads_h1,spreads_h2,totals_h1,totals_h2,team_totals,team_totals_h1,team_totals_h2,player_points,player_rebounds,player_assists,player_threes,player_points_rebounds_assists,player_points_alternate,player_rebounds_alternate,player_assists_alternate,player_threes_alternate,player_points_rebounds_assists_alternate&oddsFormat=american`;
          detail = await fetchJson(detailUrl);
        }catch(e){
          console.warn('Detail fetch failed for', ev.id, e);
        }
        cachedFetch.push({ev, detail});
        renderResultsArea();
      }
      renderTopBets(topBetsDiv, cachedFetch);
      renderGameBoxes();
      statusDiv.textContent = `Done. Showing DraftKings lines for ${events.length} game(s). Click a game's title to drill into just that matchup, or switch the hit-rate window above anytime \u2014 neither re-fetches from the API.`;
    }catch(e){
      statusDiv.textContent = `Error fetching odds: ${e.message}. Double-check your Worker URL is correct and that you deployed it with your ODDS_API_KEY secret set.`;
    }
    fetchBtn.disabled = false;
  }

  fetchBtn.addEventListener('click', runFetch);

  // auto-load a previously saved Worker URL (falling back to the baked-in default) and fetch immediately
  loadSavedUrl().then(saved=>{
    const urlToUse = saved || DEFAULT_WORKER_URL;
    urlInput.value = urlToUse;
    statusDiv.textContent = saved ? 'Using your saved Worker URL\u2026' : 'Using the default Worker URL built into this file\u2026';
    runFetch();
  });
}

function marketsByKey(bookmaker){
  const m = {};
  if(bookmaker && bookmaker.markets) bookmaker.markets.forEach(mk=>{ m[mk.key]=mk; });
  return m;
}

// Home page version: same candidate-gathering as renderTopBets, but pivoted into a table
// where each ROW is one game and that game's qualifying bets run across the columns —
// rather than one card per bet, ranked without regard to which game it's from.
function renderTopBetsTable(container, cachedFetch, topN){
  topN = topN || 30;
  container.innerHTML = '';
  if(!cachedFetch.length) return;

  const todayStr = new Date().toDateString();
  const todaysGames = cachedFetch.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStr);
  const sec = document.createElement('div'); sec.className='section-title'; sec.style.fontSize='15px';
  sec.textContent = `\u2b50 Today\u2019s Top ${topN} Bets \u2014 Ranked`;
  container.appendChild(sec);

  if(todaysGames.length === 0){
    const msg0 = document.createElement('div'); msg0.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg0.textContent = 'None of the games currently fetched are scheduled for today \u2014 nothing to rank here yet.';
    container.appendChild(msg0);
    return;
  }

  const MIN_PRICE = -250;
  function candidatesForGame(ev, detail, QUAL){
    const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
    const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
    const dk = (ev.bookmakers||[]).find(b=>b.key==='draftkings');
    const dkDetail = detail ? (detail.bookmakers||[]).find(b=>b.key==='draftkings') : null;
    const gameMarkets = marketsByKey(dk);
    const detailMarkets = marketsByKey(dkDetail);
    const legs = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL)
      .filter(l => l.price >= MIN_PRICE);
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    return legs.map(l => Object.assign({}, l, {game: gameLabel}));
  }

  let pool = [];
  todaysGames.forEach(({ev, detail}) => { pool = pool.concat(candidatesForGame(ev, detail, 0.75)); });
  if(pool.length < topN){
    let widerPool = [];
    todaysGames.forEach(({ev, detail}) => { widerPool = widerPool.concat(candidatesForGame(ev, detail, 0.70)); });
    const seen = new Set(pool.map(c=>c.game+'|'+c.label));
    widerPool.forEach(c=>{ const key = c.game+'|'+c.label; if(!seen.has(key)){ pool.push(c); seen.add(key); } });
  }
  pool.sort((a,b)=> Math.min(b.rate10,b.rate15) - Math.min(a.rate10,a.rate15));
  const topBets = pool.slice(0, topN);

  const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
  note.textContent = 'Only includes games scheduled for today, and only bets priced -250 or better. Ranked 1 (most likely) to '+topN+' by worst-case hit rate across the last-10 and last-15-game windows. Not a guarantee \u2014 this is historical frequency, and these still reflect small samples. Click "+ Track" on any bet to log it.';
  container.appendChild(note);

  if(topBets.length === 0){
    const msg = document.createElement('div'); msg.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg.textContent = 'Nothing in today\u2019s games currently clears 70% in both the last-10 and last-15 windows at -250 or better.';
    container.appendChild(msg);
    return;
  }

  const wrap = document.createElement('div'); wrap.className='table-wrap';
  const table = document.createElement('table'); table.style.width='100%';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Rank</th><th class="left">Bet</th><th class="left">Game</th><th>Price</th><th>L10%</th><th>L15%</th><th>Opp Def Rank</th><th>Allowed/Gm</th><th></th></tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody'); table.appendChild(tbody);

  topBets.forEach((bet, idx)=>{
    const tr = document.createElement('tr');
    const cellStyle = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:center;';
    const tdRank = document.createElement('td'); tdRank.style.cssText = cellStyle + 'font-weight:800;color:var(--navy2);';
    tdRank.textContent = idx+1;

function renderTopBets(container, cachedFetch, topN){
  topN = topN || 5;
  container.innerHTML = '';
  if(!cachedFetch.length) return;

  // Only games actually being played today (compared in the browser's local timezone) —
  // DraftKings sometimes posts lines a day or two ahead, and those shouldn't count here.
  const todayStr = new Date().toDateString();
  const todaysGames = cachedFetch.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStr);
  if(todaysGames.length === 0){
    const sec0 = document.createElement('div'); sec0.className='section-title'; sec0.style.fontSize='15px';
    sec0.textContent = `\u2b50 Today\u2019s Top ${topN} Bets (across all games)`;
    container.appendChild(sec0);
    const msg0 = document.createElement('div'); msg0.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg0.textContent = 'None of the games currently fetched are scheduled for today \u2014 nothing to rank here yet.';
    container.appendChild(msg0);
    return;
  }

  const MIN_PRICE = -250; // "-250 or better" — a bet's price must be -250 or higher (less negative / more positive)
  function candidatesForGame(ev, detail, QUAL){
    const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
    const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
    const dk = (ev.bookmakers||[]).find(b=>b.key==='draftkings');
    const dkDetail = detail ? (detail.bookmakers||[]).find(b=>b.key==='draftkings') : null;
    const gameMarkets = marketsByKey(dk);
    const detailMarkets = marketsByKey(dkDetail);
    const legs = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL)
      .filter(l => l.price >= MIN_PRICE);
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    return legs.map(l => Object.assign({}, l, {game: gameLabel}));
  }

  // Try the 75% bar first (this app's existing definition of "high confidence"); if that
  // doesn't produce at least topN across today's slate, top up with the 70% pool instead
  // of showing fewer than topN — but never invent a bet that doesn't clear at least 70%/70%,
  // and never one worse than -250 regardless of how confident it is.
  let pool = [];
  todaysGames.forEach(({ev, detail}) => { pool = pool.concat(candidatesForGame(ev, detail, 0.75)); });
  if(pool.length < topN){
    let widerPool = [];
    todaysGames.forEach(({ev, detail}) => { widerPool = widerPool.concat(candidatesForGame(ev, detail, 0.70)); });
    const seen = new Set(pool.map(c=>c.game+'|'+c.label));
    widerPool.forEach(c=>{ const key = c.game+'|'+c.label; if(!seen.has(key)){ pool.push(c); seen.add(key); } });
  }

  pool.sort((a,b)=> Math.min(b.rate10,b.rate15) - Math.min(a.rate10,a.rate15));
  const topBets = pool.slice(0, topN);

  const sec = document.createElement('div'); sec.className='section-title';
  sec.style.fontSize='15px'; sec.textContent = `\u2b50 Today\u2019s Top ${topN} Bets (across all games)`;
  container.appendChild(sec);

  const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
  note.textContent = 'Only includes games scheduled for today, and only bets priced -250 or better. Ranked by worst-case hit rate across the last-10 and last-15-game windows (same 75%/70%-qualified pool used in each game\u2019s parlay sections). Not a guarantee \u2014 this is historical frequency, and these still reflect small samples.';
  container.appendChild(note);

  if(topBets.length === 0){
    const msg = document.createElement('div'); msg.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg.textContent = 'Nothing in today\u2019s games currently clears 70% in both the last-10 and last-15 windows at -250 or better.';
    container.appendChild(msg);
    return;
  }

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px;';
  topBets.forEach((c, idx)=>{
    const worstCase = Math.round(Math.min(c.rate10,c.rate15)*100);
    const isGold = worstCase>=96;
    const card = document.createElement('div');
    card.style.cssText = `border:2px solid var(${isGold?'--gold':'--green'});border-radius:8px;padding:12px;background:var(${isGold?'--goldbg':'--greenbg'});`;
    const rank = document.createElement('div');
    rank.style.cssText = `font-weight:800;font-size:12px;color:var(${isGold?'--gold':'--green'});margin-bottom:4px;`;
    rank.textContent = `#${idx+1}`;
    const label = document.createElement('div');
    label.style.cssText = 'font-weight:700;font-size:13.5px;margin-bottom:4px;';
    label.appendChild(buildLegLabelNode(c));
    const game = document.createElement('div');
    game.style.cssText = 'font-size:11.5px;color:var(--sub);margin-bottom:6px;';
    const gameTeams = c.game.split(' @ ');
    if(gameTeams.length===2){
      game.appendChild(teamLinkEl(gameTeams[0], gameTeams[0]));
      game.appendChild(document.createTextNode(' @ '));
      game.appendChild(teamLinkEl(gameTeams[1], gameTeams[1]));
    } else {
      game.textContent = c.game;
    }
    const detail = document.createElement('div');
    detail.style.cssText = 'font-size:12px;';
    detail.innerHTML = `${fmtAmerican(c.price)} \u2014 L10: ${Math.round(c.rate10*100)}%, L15: ${Math.round(c.rate15*100)}%`;
    card.appendChild(rank); card.appendChild(label); card.appendChild(game); card.appendChild(detail);
    card.appendChild(makeTrackAndHistoryButtons(c, 10));
    grid.appendChild(card);
  });
  container.appendChild(grid);
}
