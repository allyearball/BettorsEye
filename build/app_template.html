  const tbody = document.createElement('tbody'); table.appendChild(tbody);

  function passesAdvFilters(bet){
    if(advFilters.pos && getPlayerPosition(bet.player,bet.team)!==advFilters.pos) return false;
    if(advFilters.minPrice!==null && bet.price < advFilters.minPrice) return false;
    if(advFilters.maxPrice!==null && bet.price > advFilters.maxPrice) return false;
    if(advFilters.minDvp!==null && (bet.edge.dvp===null || bet.edge.dvp===undefined || bet.edge.dvp < advFilters.minDvp)) return false;
    const checks = [['minL5',5],['minL10',10],['minL15',15],['minSeason','all']];
    for(const [key, w] of checks){
      if(advFilters[key]===null) continue;
      const hc = hitCountFor(bet, w);
      if(!hc || hc.gp===0) return false;
      if(Math.round((hc.hits/hc.gp)*100) < advFilters[key]) return false;
    }
    return true;
  }

  function renderAdvTable(){
    tbody.innerHTML = '';
    const withOrigRank = topBets.map((bet, i) => ({bet, origRank: i+1}));
    const filtered = withOrigRank.filter(({bet}) => passesAdvFilters(bet));
    advCountDiv.textContent = `${filtered.length} / ${topBets.length} rows shown`;
    filtered.forEach(({bet, origRank})=>{
    const idx = origRank - 1;
    const tr = document.createElement('tr');
    const cellStyle = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:center;';

    // Same row tint as the Standard table: faint red/yellow/green by the opponent's defense
    // rank vs. her position for this stat (top-third defense = toughest matchup = red, etc.).
    if(bet.opponent){
      const bucket = positionBucket(getPlayerPosition(bet.player, bet.team));
      const r = bucket ? getDefenseRank(bet.opponent, bet.statKey, bucket) : null;
      if(r){
        tr.style.backgroundColor = r.rank<=5 ? 'rgba(220,53,69,0.07)' : r.rank<=10 ? 'rgba(255,193,7,0.10)' : 'rgba(40,167,69,0.07)';
      }
    }

    const tdStar = document.createElement('td'); tdStar.style.cssText = cellStyle;
    const key = betIdentityKey(bet);
    if(key && starredKeys.has(key)){
      tdStar.textContent = '\u2605';
      tdStar.style.color = '#D4AF37';
      tdStar.style.fontSize = '15px';
      tdStar.title = 'Also appears in the Standard table above';
    }
    const tdRank = document.createElement('td'); tdRank.style.cssText = cellStyle + 'font-weight:800;color:var(--navy2);';
    tdRank.textContent = idx+1;
    const tdPos = document.createElement('td'); tdPos.className='left'; tdPos.style.cssText = cellStyle.replace('text-align:center;','');
    tdPos.textContent = getPlayerPosition(bet.player, bet.team) || '\u2014';
    const tdLabel = document.createElement('td'); tdLabel.className='left'; tdLabel.style.cssText = cellStyle.replace('text-align:center;','');
    tdLabel.appendChild(buildLegLabelNode(bet));
    const subLine2 = document.createElement('div');
    subLine2.style.cssText = 'font-size:10.5px;color:var(--sub);margin-top:2px;';
    subLine2.textContent = buildBetSubLineBase(bet);
    tdLabel.appendChild(subLine2);
    enhanceBetSubLineIfLive(bet, liveGames, subLine2);
    const tdGame = document.createElement('td'); tdGame.className='left'; tdGame.style.cssText = cellStyle.replace('text-align:center;','') + 'color:var(--sub);';
    const gameTeams = bet.game.split(' @ ');
    if(gameTeams.length===2){
      tdGame.appendChild(teamLinkEl(gameTeams[0], gameTeams[0]));
      tdGame.appendChild(document.createTextNode(' @ '));
      tdGame.appendChild(teamLinkEl(gameTeams[1], gameTeams[1]));
    } else { tdGame.textContent = bet.game; }
    const tdVsOpp = document.createElement('td'); tdVsOpp.className='left'; tdVsOpp.style.cssText = cellStyle.replace('text-align:center;','');
    tdVsOpp.appendChild(buildVsOpponentCell(bet));
    const tdPrice = document.createElement('td'); tdPrice.style.cssText = cellStyle;
    tdPrice.textContent = fmtAmerican(bet.price);
    const tdSportsbook = document.createElement('td'); tdSportsbook.className='left'; tdSportsbook.style.cssText = cellStyle.replace('text-align:center;','');
    tdSportsbook.textContent = bet.sportsbook || '\u2014';
    const tdDef = document.createElement('td'); tdDef.className='left defcol'; tdDef.style.cssText = cellStyle.replace('text-align:center;','');
    const tdDefL5 = document.createElement('td'); tdDefL5.className='left defcol'; tdDefL5.style.cssText = cellStyle.replace('text-align:center;','');
    const tdAllowed = document.createElement('td'); tdAllowed.className='defcol'; tdAllowed.style.cssText = cellStyle;
    if(bet.opponent){
      tdDef.appendChild(defRankCell(bet.opponent, bet.statKey, bet.player, bet.team, bet.market));
      tdDefL5.appendChild(defRankL5Cell(bet.opponent, bet.statKey, bet.player, bet.team, bet.market));
      tdAllowed.appendChild(defAllowedCell(bet.opponent, bet.statKey, bet.player, bet.team));
    } else {
      tdDef.textContent = '\u2014';
      tdDefL5.textContent = '\u2014';
      tdAllowed.textContent = '\u2014';
    }
    const mk = (v, hc) => {
      const td=document.createElement('td'); td.style.cssText=cellStyle;
      const emaText = v===null||v===undefined?'\u2014':(Math.round(v*10)/10);
      td.textContent = hc ? `${emaText} (${hc.hits}/${hc.gp})` : emaText;
      return td;
    };
    const tdL5 = mk(bet.edge.l5, hitCountFor(bet,5)), tdL10 = mk(bet.edge.l10, hitCountFor(bet,10)),
          tdL15 = mk(bet.edge.l15, hitCountFor(bet,15)), tdFull = mk(bet.edge.full, hitCountFor(bet,'all'));
    const tdAgree = document.createElement('td'); tdAgree.style.cssText = cellStyle + 'font-weight:700;';
    tdAgree.textContent = `${Math.round(bet.edge.agreement*4)}/4`;
    const tdDvp = document.createElement('td'); tdDvp.style.cssText = cellStyle;
    tdDvp.textContent = bet.edge.dvp!==null ? bet.edge.dvp.toFixed(2) : '\u2014';
    if(bet.edge.dvp!==null) tdDvp.style.color = (bet.side==='over' ? bet.edge.dvp>1.05 : bet.edge.dvp<0.95) ? 'var(--green)' : (bet.edge.dvp===1?'inherit':'var(--red)');
    const tdInjury = document.createElement('td'); tdInjury.className='left'; tdInjury.style.cssText = cellStyle.replace('text-align:center;','');
    if(bet.injuryNote){ tdInjury.textContent = bet.injuryNote; tdInjury.style.color = INJURY_SEVERITY_COLOR[injuryStatusSeverity(bet.injuryNote)] || 'var(--sub)'; tdInjury.style.fontWeight='700'; }
    else tdInjury.textContent = '\u2014';
    const tdTrack = document.createElement('td'); tdTrack.style.cssText = cellStyle;
    tdTrack.appendChild(makeTrackAndHistoryButtons(bet, 10));
    [tdStar,tdRank,tdPos,tdLabel,tdGame,tdVsOpp,tdPrice,tdSportsbook,tdDef,tdDefL5,tdAllowed,tdL5,tdL10,tdL15,tdFull,tdAgree,tdDvp,tdInjury,tdTrack].forEach(td=>tr.appendChild(td));
    tbody.appendChild(tr);
    });
  }
  renderAdvTable();

  wrap.appendChild(table);
  container.appendChild(wrap);
}

function renderTopBets(container, cachedFetch, topN, selectedBook){
  topN = topN || 5;
  selectedBook = selectedBook || 'draftkings';
  container.innerHTML = '';
  if(!cachedFetch.length) return;

  // Only games actually being played today (compared in the browser's local timezone), kept
  // eligible through an estimated end of the 1st quarter. Once live, DraftKings reprices
  // based on in-game reality, but the hit rates below are computed against FULL-game
  // historical distributions \u2014 comparing a live line against full-game history is
  // apples-to-oranges, and it's what makes live-game bets climb this ranking while tending
  // not to hit. This app has no live in-game state (foul trouble, current minutes, score) to
  // adjust for, so a time-based cutoff is the fix rather than a smarter live model \u2014 see
  // isEligibleForTopBets for the real-world-elapsed-time estimate this uses.
  const todayStr = new Date().toDateString();
  const now = new Date();
  const todaysGames = cachedFetch.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStr && isEligibleForTopBets(ev, now));
  if(todaysGames.length === 0){
    const sec0 = document.createElement('div'); sec0.className='section-title'; sec0.style.fontSize='15px';
    sec0.textContent = `\u2b50 Today\u2019s Top ${topN} Bets (across all games)`;
    container.appendChild(sec0);
    const msg0 = document.createElement('div'); msg0.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg0.textContent = 'None of today\u2019s games are within their pregame-through-Q1 window right now \u2014 nothing to rank here yet. (Bets drop out after an estimated end of the 1st quarter \u2014 see the note below.)';
    container.appendChild(msg0);
    return;
  }

  const MIN_PRICE = -250; // "-250 or better" — a bet's price must be -250 or higher (less negative / more positive)
  function candidatesForGame(ev, detail, QUAL){
    const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
    const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
    const dk = getBookmakerData(ev, selectedBook);
    const dkDetail = detail ? getBookmakerData(detail, selectedBook) : null;
    const gameMarkets = marketsByKey(dk);
    const detailMarkets = marketsByKey(dkDetail);
    const legs = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL, selectedBook)
      .filter(l => l.price >= MIN_PRICE);
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    return legs.map(l => Object.assign({}, l, {game: gameLabel}));
  }

  // Try the 75% bar first (this app's existing definition of "high confidence"); if that
  // doesn't produce at least topN across today's slate, top up with the 70% pool instead
  // of showing fewer than topN — but never invent a bet that doesn't clear at least 70%/70%,
  // and never one worse than -250 regardless of how confident it is.
  let pool = [];
  todaysGames.forEach(({ev, detail}) => { pool = pool.concat(candidatesForGame(ev, detail, 0.75)); });
  if(pool.length < topN){
    let widerPool = [];
    todaysGames.forEach(({ev, detail}) => { widerPool = widerPool.concat(candidatesForGame(ev, detail, 0.70)); });
    const seen = new Set(pool.map(c=>c.game+'|'+c.label));
    widerPool.forEach(c=>{ const key = c.game+'|'+c.label; if(!seen.has(key)){ pool.push(c); seen.add(key); } });
  }

  pool.sort((a,b)=> worstCaseRate(b) - worstCaseRate(a));
  const topBets = pool.slice(0, topN);

  const sec = document.createElement('div'); sec.className='section-title';
  sec.style.fontSize='15px'; sec.textContent = `\u2b50 Today\u2019s Top ${topN} Bets (across all games)`;
  container.appendChild(sec);

  const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
  note.textContent = `Only includes games scheduled for today that haven\u2019t tipped off yet, or that tipped off within the last ~${TOP_BETS_QUARTER_GRACE_MINUTES} minutes (a real-world-elapsed-time estimate for end of the 1st quarter \u2014 this app has no live game clock) \u2014 and only bets priced -250 or better. Ranked by worst-case hit rate across the last-10 and last-15-game windows (same 75%/70%-qualified pool used in each game\u2019s parlay sections). Not a guarantee \u2014 this is historical frequency, and these still reflect small samples.`;
  container.appendChild(note);

  if(topBets.length === 0){
    const msg = document.createElement('div'); msg.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg.textContent = 'Nothing in today\u2019s games currently clears 70% in both the last-10 and last-15 windows at -250 or better.';
    container.appendChild(msg);
    return;
  }

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px;';
  topBets.forEach((c, idx)=>{
    const worstCase = Math.round(worstCaseRate(c)*100);
    const isGold = worstCase>=96;
    const card = document.createElement('div');
    card.style.cssText = `border:2px solid var(${isGold?'--gold':'--green'});border-radius:8px;padding:12px;background:var(${isGold?'--goldbg':'--greenbg'});`;
    const rank = document.createElement('div');
    rank.style.cssText = `font-weight:800;font-size:12px;color:var(${isGold?'--gold':'--green'});margin-bottom:4px;`;
    rank.textContent = `#${idx+1}`;
    const label = document.createElement('div');
    label.style.cssText = 'font-weight:700;font-size:13.5px;margin-bottom:4px;';
    label.appendChild(buildLegLabelNode(c));
    const game = document.createElement('div');
    game.style.cssText = 'font-size:11.5px;color:var(--sub);margin-bottom:6px;';
    const gameTeams = c.game.split(' @ ');
    if(gameTeams.length===2){
      game.appendChild(teamLinkEl(gameTeams[0], gameTeams[0]));
      game.appendChild(document.createTextNode(' @ '));
      game.appendChild(teamLinkEl(gameTeams[1], gameTeams[1]));
    } else {
      game.textContent = c.game;
    }
    const detail = document.createElement('div');
    detail.style.cssText = 'font-size:12px;';
    detail.innerHTML = `${fmtAmerican(c.price)} \u2014 L10: ${Math.round(c.rate10*100)}%, L15: ${Math.round(c.rate15*100)}%`;
    card.appendChild(rank); card.appendChild(label); card.appendChild(game); card.appendChild(detail);
    card.appendChild(makeTrackAndHistoryButtons(c, 10));
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

// Fetches live in-game stats for one game and populates whatever [data-live-*] placeholder
// spans (built by cell()/teamTotalsRow()/the player props table above) are present in `wrap`.
// Each value is formatted to be DIRECTLY comparable to its own line -- spread shows the
// current score MARGIN (not the raw score), since that's what's actually comparable to a
// spread number; total shows the current COMBINED score; player props show that player's
// current value for that specific stat. No-op (leaves the placeholders empty/invisible) for
// games that haven't started, have no ESPN match, or errored -- never shows a wrong or
// misleading number.
async function applyLiveAmounts(wrap, ev){
  let live;
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    live = await fetchJson(`${workerBase}/livestats?away=${encodeURIComponent(ev.away_team)}&home=${encodeURIComponent(ev.home_team)}`);
  }catch(e){ return; }
  if(!live || live.status === 'not_live' || live.awayScore===null || live.homeScore===null) return;

  const setKey = (key, text)=>{
    wrap.querySelectorAll(`[data-live-key="${key}"]`).forEach(el=>{ el.textContent = `(Now: ${text})`; });
  };
  setKey('ml-away', `${live.awayScore}-${live.homeScore}`);
  setKey('ml-home', `${live.homeScore}-${live.awayScore}`);
  setKey('spread-away', (live.awayScore-live.homeScore)>=0?`+${live.awayScore-live.homeScore}`:`${live.awayScore-live.homeScore}`);
  setKey('spread-home', (live.homeScore-live.awayScore)>=0?`+${live.homeScore-live.awayScore}`:`${live.homeScore-live.awayScore}`);
  const combined = live.awayScore + live.homeScore;
  setKey('total-over', combined); setKey('total-under', combined);
  setKey(`teamtotal-${SHORT_TEAM_NAME[ev.away_team] || ev.away_team}`, live.awayScore);
  setKey(`teamtotal-${SHORT_TEAM_NAME[ev.home_team] || ev.home_team}`, live.homeScore);

  if(live.players && live.players.length){
    wrap.querySelectorAll('[data-live-player]').forEach(el=>{
      const pname = el.getAttribute('data-live-player'), statKey = el.getAttribute('data-live-stat');
      const row = live.players.find(p => p.player.toLowerCase() === pname.toLowerCase());
      if(row && row[statKey] !== undefined){
        el.textContent = `Now: ${row[statKey]}`;
      }
    });
  }

  const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
  const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;

  // Resolves the correct away/home score pair for a verdict element's half (full game, 1st, or
  // 2nd) -- half-specific scores are best-effort (see the Worker's own comment on this) and
  // simply aren't available if ESPN's linescores didn't come through as expected, in which case
  // this returns null and the element is left showing nothing rather than a guessed number.
  function scoresFor(half){
    if(!half) return {away: live.awayScore, home: live.homeScore};
    if(String(half)==='1'){
      if(live.awayFirstHalf==null || live.homeFirstHalf==null) return null;
      return {away: live.awayFirstHalf, home: live.homeFirstHalf};
    }
    if(String(half)==='2'){
      if(live.awaySecondHalf==null || live.homeSecondHalf==null) return null;
      return {away: live.awaySecondHalf, home: live.homeSecondHalf};
    }
    return null;
  }

  wrap.querySelectorAll('.live-verdict').forEach(el=>{
    const type = el.getAttribute('data-verdict-type');
    const side = el.getAttribute('data-verdict-side');
    const point = el.hasAttribute('data-verdict-point') ? parseFloat(el.getAttribute('data-verdict-point')) : null;
    const half = el.getAttribute('data-verdict-half');
    const scores = scoresFor(half);
    if(!scores) return; // half-specific data not available -- leave blank rather than guess

    if(type==='ml'){
      const own = side==='away' ? scores.away : scores.home;
      const opp = side==='away' ? scores.home : scores.away;
      const verdict = own>opp ? 'W' : (own<opp ? 'L' : 'T');
      el.textContent = `${verdict} ${own}-${opp}`;
      el.style.color = verdict==='W' ? 'var(--green)' : (verdict==='L' ? 'var(--red)' : 'var(--sub)');
    } else if(type==='spread'){
      const own = side==='away' ? scores.away : scores.home;
      const opp = side==='away' ? scores.home : scores.away;
      const covering = (own - opp + point) > 0;
      el.textContent = `${covering?'W':'L'} ${point>0?'+':''}${point}`;
      el.style.color = covering ? 'var(--green)' : 'var(--red)';
    } else if(type==='total'){
      const combined = scores.away + scores.home;
      const hitting = side==='over' ? (combined > point) : (combined < point);
      el.textContent = String(combined);
      el.style.color = hitting ? 'var(--green)' : 'var(--red)';
    } else if(type==='teamtotal'){
      const own = (el.getAttribute('data-verdict-team')===awayShort) ? scores.away : scores.home;
      const hitting = side==='over' ? (own > point) : (own < point);
      el.textContent = String(own);
      el.style.color = hitting ? 'var(--green)' : 'var(--red)';
    }
  });
}

function renderGameOddsBlock(container, ev, detail, windowSize, onTitleClick, startCollapsed, uiState, selectedBook){
  windowSize = windowSize===undefined ? 10 : windowSize;
  selectedBook = selectedBook || 'draftkings';
  // "All Books" mode: rather than rebuilding every table to show 6 books side by side (a much
  // larger rewrite), this renders the SAME single-book view once per real book in sequence,
  // each clearly labeled -- reuses every table-building function below completely unchanged.
  if(selectedBook==='all'){
    const allWrap = document.createElement('div');
    Object.keys(BOOK_LABELS).forEach(bookKey=>{
      const hasData = (ev.bookmakers||[]).some(b=>b.key===bookKey);
      if(!hasData) return; // skip books with no odds posted for this game rather than show an empty section
      const bookHeader = document.createElement('div');
      bookHeader.style.cssText = 'font-weight:800;color:var(--navy2);font-size:14px;margin:14px 0 6px;padding-top:10px;border-top:2px solid var(--line);';
      bookHeader.textContent = BOOK_LABELS[bookKey];
      allWrap.appendChild(bookHeader);
      renderGameOddsBlock(allWrap, ev, detail, windowSize, onTitleClick, startCollapsed, uiState, bookKey);
    });
    container.appendChild(allWrap);
    return;
  }
  // uiState (if provided) is this specific game's persisted {collapsed, sections} — falls back
  // to the old hardcoded defaults only the very first time this game is ever rendered.
  const hasSaved = !!uiState;
  if(!uiState) uiState = {collapsed: undefined, sections: {}};
  startCollapsed = uiState.collapsed !== undefined ? uiState.collapsed : (startCollapsed===undefined ? true : startCollapsed);
  const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
  const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
  const wrap = document.createElement('div'); wrap.className='table-wrap'; wrap.style.padding='16px'; wrap.style.marginBottom='20px';

  const titleRow = document.createElement('div'); titleRow.style.cssText = 'display:flex;align-items:center;gap:8px;';
  const gameArrow = document.createElement('span');
  gameArrow.textContent = startCollapsed ? '\u25b8' : '\u25be';
  gameArrow.style.cssText = 'font-size:38px;color:var(--navy2);cursor:pointer;user-select:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;line-height:1;';
  titleRow.appendChild(gameArrow);

  const dt = new Date(ev.commence_time);
  const title = document.createElement('div'); title.style.cssText='font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;';
  const awayLink = teamLinkEl(awayShort, ev.away_team); awayLink.style.color='#000000';
  const homeLink = teamLinkEl(homeShort, ev.home_team); homeLink.style.color='#000000';
  title.appendChild(awayLink);
  title.appendChild(document.createTextNode(teamRecordParenText(awayShort, windowSize)));
  title.appendChild(document.createTextNode(' @ '));
  title.appendChild(homeLink);
  title.appendChild(document.createTextNode(teamRecordParenText(homeShort, windowSize)));
  title.appendChild(document.createTextNode(`\u2014 ${dt.toLocaleString()}`));
  if(dt <= new Date()){
    const stillEligible = isEligibleForTopBets(ev, new Date());
    const liveBadge = document.createElement('span');
    liveBadge.textContent = stillEligible ? '\ud83d\udd34 LIVE \u2014 IN TOP BETS WINDOW' : '\ud83d\udd34 LIVE \u2014 PAST Q1';
    liveBadge.style.cssText = 'font-size:11px;font-weight:800;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:2px 6px;cursor:pointer;';
    const liveBadgeText = stillEligible
      ? `This game has tipped off but is still within the Top Bets eligibility window (within an estimated ${TOP_BETS_QUARTER_GRACE_MINUTES} minutes of tipoff, standing in for end of the 1st quarter \u2014 this app has no live game clock to know the actual time). It'll drop out of Top Bets after that.`
      : `This game tipped off more than an estimated ${TOP_BETS_QUARTER_GRACE_MINUTES} minutes ago (standing in for past the 1st quarter) and has dropped out of the Top Bets rankings. DraftKings\u2019 lines below still reflect current in-game reality, but the hit rates here are computed against full-game historical performance \u2014 that comparison gets less meaningful the further into the game it is.`;
    liveBadge.addEventListener('click', (e)=>{ e.stopPropagation(); toggleDefPopover(liveBadge, liveBadgeText); });
    title.appendChild(liveBadge);
  }
  if(onTitleClick){
    const drillIn = document.createElement('a');
    drillIn.href = 'javascript:void(0)';
    drillIn.style.cssText='font-size:12.5px;font-weight:700;color:var(--navy2);text-decoration:none;border-bottom:1px dashed var(--navy2);cursor:pointer;';
    drillIn.textContent = 'View this matchup \u2192';
    drillIn.title = 'Click to view just this matchup';
    drillIn.addEventListener('click', onTitleClick);
    title.appendChild(drillIn);
  }
  titleRow.appendChild(title);
  wrap.appendChild(titleRow);

  const injuryBanner = buildInjuryBanner(awayShort, homeShort);
  if(injuryBanner) wrap.appendChild(injuryBanner.preview);

  const gameContentDiv = document.createElement('div'); gameContentDiv.style.marginTop = '6px';
  if(startCollapsed) gameContentDiv.style.display = 'none';
  wrap.appendChild(gameContentDiv);
  if(injuryBanner) gameContentDiv.appendChild(injuryBanner.full);
  gameArrow.addEventListener('click', ()=>{
    const isExpanded = gameContentDiv.style.display !== 'none';
    gameContentDiv.style.display = isExpanded ? 'none' : '';
    gameArrow.textContent = isExpanded ? '\u25b8' : '\u25be';
    uiState.collapsed = isExpanded; // now collapsed, since it was just expanded
  });

  const recordsDiv = document.createElement('div');
  recordsDiv.style.cssText = 'display:flex;gap:28px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line);';
  function recordText(rec){ return rec ? `${rec.w}-${rec.l}` : '\u2014'; }
  [ {short: awayShort, full: ev.away_team, isHome:false}, {short: homeShort, full: ev.home_team, isHome:true} ].forEach(t=>{
    const rec = DATA.teamRecords[t.short];
    const recBox = document.createElement('div');
    if(!rec){ recBox.appendChild(teamLinkEl(t.short, t.full)); recBox.appendChild(document.createTextNode(': record not available')); recordsDiv.appendChild(recBox); return; }
    const oppShort = t.isHome ? awayShort : homeShort;
    const oppFull = t.isHome ? ev.away_team : ev.home_team;
    const h2h = rec.vsOpponent[oppShort];
    const homeAwayLabel = t.isHome ? 'Home' : 'Away';
    const homeAwayRec = t.isHome ? rec.home : rec.away;
    const nameLink = teamLinkEl(t.short, t.full); nameLink.style.cssText = 'color:var(--ink);font-weight:700;';
    recBox.appendChild(nameLink);
    const oppLink = teamLinkEl(oppShort, oppFull); oppLink.style.fontSize='12.5px';
    recBox.appendChild(document.createTextNode(` \u2014 Overall: ${recordText(rec.overall)} \u00a0|\u00a0 ${homeAwayLabel}: ${recordText(homeAwayRec)} \u00a0|\u00a0 vs `));
    recBox.appendChild(oppLink);
    recBox.appendChild(document.createTextNode(`: ${recordText(h2h)}`));
    recordsDiv.appendChild(recBox);
  });
  gameContentDiv.appendChild(recordsDiv);

  const dk = getBookmakerData(ev, selectedBook);
  const dkDetail = detail ? getBookmakerData(detail, selectedBook) : null;
  const gameMarkets = marketsByKey(dk);
  const detailMarkets = marketsByKey(dkDetail);

  // VSiN only publishes DraftKings Handle %/Bet % splits for full-game Moneyline, Spread,
  // and Total \u2014 not for halves, team totals, player props, alt lines, or parlays. Looks
  // up DATA.vsinSplits[shortTeam][market] (populated by the pipeline's VSiN scrape, if any)
  // and returns {handle, bet} or null if unavailable.
  function vsinSplitFor(shortTeam, market){
    if(!DATA.vsinSplits || !shortTeam) return null;
    const teamSplits = DATA.vsinSplits[shortTeam];
    if(!teamSplits) return null;
    const s = teamSplits[market];
    if(!s || s.handle===undefined || s.bet===undefined) return null;
    return s;
  }
  function vsinCellHtml(split){
    if(!split) return '<span style="color:var(--sub);font-size:11px;">VSiN: \u2014</span>';
    return `<span style="color:var(--navy2);font-size:11px;">VSiN: ${split.handle}% handle / ${split.bet}% bets</span>`;
  }

  // Shared table renderer for Full Game / 1st Half / 2nd Half / Team Totals -- one row per
  // team/side (not the old side-by-side away|home grid), with a consistent column set across
  // every section so the layout reads the same regardless of which market you're looking at.
  function buildOddsTable(container, rows, opts){
    opts = opts || {};
    const includeVsin = opts.includeVsin !== false;
    const wrap = document.createElement('div'); wrap.style.cssText = 'overflow-x:auto;margin:4px 0 12px;';
    const table = document.createElement('table'); table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12.5px;';
    const thead = document.createElement('thead');
    const headers = ['Bet Type','Live Total','Team','Odds','Via','L5','L10','L15'].concat(includeVsin?['VSiN']:[]).concat(['Track','']);
    thead.innerHTML = '<tr>' + headers.map(h=>`<th style="text-align:right;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap;color:var(--sub);font-size:11px;text-transform:uppercase;">${h}</th>`).join('') + '</tr>';
    const tbody = document.createElement('tbody');
    rows.forEach(r=>{
      const tr = document.createElement('tr'); tr.style.cssText = 'border-bottom:1px solid var(--line);';

      const tdType = document.createElement('td'); tdType.style.cssText='padding:7px 8px;color:var(--sub);white-space:nowrap;'; tdType.textContent = r.betType;

      const tdLiveTotal = document.createElement('td'); tdLiveTotal.style.cssText='padding:7px 8px;white-space:nowrap;font-weight:700;';
      if(r.liveVerdict){
        const lv = document.createElement('span'); lv.className='live-verdict';
        lv.setAttribute('data-verdict-type', r.liveVerdict.type);
        lv.setAttribute('data-verdict-side', r.liveVerdict.side);
        if(r.liveVerdict.point!==undefined && r.liveVerdict.point!==null) lv.setAttribute('data-verdict-point', r.liveVerdict.point);
        if(r.liveVerdict.half) lv.setAttribute('data-verdict-half', r.liveVerdict.half);
        if(r.liveVerdict.team) lv.setAttribute('data-verdict-team', r.liveVerdict.team);
        tdLiveTotal.appendChild(lv);
      } else {
        tdLiveTotal.textContent = '\u2014'; tdLiveTotal.style.color = 'var(--sub)'; tdLiveTotal.style.fontWeight = '400';
      }

      const tdTeam = document.createElement('td'); tdTeam.style.cssText='padding:7px 8px;font-weight:700;white-space:nowrap;';
      if(r.teamShort && r.teamFull){ tdTeam.appendChild(teamLinkEl(r.teamShort, r.teamFull)); tdTeam.appendChild(document.createTextNode(r.sideSuffix||'')); }
      else { tdTeam.textContent = r.teamLabel || '\u2014'; }

      const tdOdds = document.createElement('td'); tdOdds.style.cssText='padding:7px 8px;white-space:nowrap;';
      tdOdds.appendChild(document.createTextNode(r.oddsText||'\u2014'));
      if(r.liveKey){
        const ls = document.createElement('span'); ls.className='live-amount'; ls.setAttribute('data-live-key', r.liveKey);
        ls.style.cssText = 'font-size:11px;font-weight:700;color:var(--red);margin-left:6px;';
        tdOdds.appendChild(ls);
      }

      const tdVia = document.createElement('td'); tdVia.style.cssText='padding:7px 8px;color:var(--sub);white-space:nowrap;'; tdVia.textContent = r.viaText || '\u2014';

      function hrCell(hr){
        const td = document.createElement('td'); td.style.cssText='padding:7px 8px;white-space:nowrap;';
        td.appendChild(singleWindowChip(null, hr));
        return td;
      }

      const cellsSoFar = [tdType, tdLiveTotal, tdTeam, tdOdds, tdVia, hrCell(r.hr5), hrCell(r.hr10), hrCell(r.hr15)];

      if(includeVsin){
        const tdVsin = document.createElement('td'); tdVsin.style.cssText='padding:7px 8px;white-space:nowrap;';
        tdVsin.innerHTML = r.vsinSplit ? vsinCellHtml(r.vsinSplit) : '<span style="color:var(--sub);font-size:11px;">\u2014</span>';
        cellsSoFar.push(tdVsin);
      }

      const tdTrack = document.createElement('td'); tdTrack.style.cssText='padding:7px 8px;';
      if(r.trackBtn) tdTrack.appendChild(r.trackBtn); else tdTrack.textContent = '\u2014';

      const tdHist = document.createElement('td'); tdHist.style.cssText='padding:7px 8px;';
      if(r.historyBtn) tdHist.appendChild(r.historyBtn); else tdHist.textContent = '\u2014';

      cellsSoFar.push(tdTrack, tdHist);
      cellsSoFar.forEach(td=>tr.appendChild(td));
      tbody.appendChild(tr);
    });
    table.appendChild(thead); table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
  }

  // Builds the 6-row Bet Type/Team table (ML away+home, Spread away+home, Total over+under)
  // for one section (full game, 1st half, or 2nd half) in one shot.
  function buildFullSpreadTotalTable(container, gameMarket, spreadMarket, totalMarket, withHitRate, half){
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    const gameDate = toEasternDateStr(ev.commence_time);
    const rows = [];

    // Moneyline
    {
      const away = dkOutcome(gameMarket, ev.away_team), home = dkOutcome(gameMarket, ev.home_team);
      let awayHr5=null, awayHr10=null, awayHr15=null, homeHr5=null, homeHr10=null, homeHr15=null;
      if(withHitRate){
        const awayFn = half ? ((w)=>teamMoneylineHitRateHalf(awayShort, half, w)) : ((w)=>teamMoneylineHitRate(awayShort, w));
        const homeFn = half ? ((w)=>teamMoneylineHitRateHalf(homeShort, half, w)) : ((w)=>teamMoneylineHitRate(homeShort, w));
        awayHr5=awayFn(5); awayHr10=awayFn(10); awayHr15=awayFn(15);
        homeHr5=homeFn(5); homeHr10=homeFn(10); homeHr15=homeFn(15);
      }
      const awayTrack = (!half && away) ? makeTrackButton({label:`${ev.away_team} Moneyline`, price:away.price, betType:'moneyline', team:awayShort, opponent:homeShort, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const homeTrack = (!half && home) ? makeTrackButton({label:`${ev.home_team} Moneyline`, price:home.price, betType:'moneyline', team:homeShort, opponent:awayShort, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const awayHist = (!half && away) ? makeHistoryButton({label:`${ev.away_team} Moneyline`, betType:'moneyline', team:awayShort, opponent:homeShort, gameLabel, eventId: ev.id}) : null;
      const homeHist = (!half && home) ? makeHistoryButton({label:`${ev.home_team} Moneyline`, betType:'moneyline', team:homeShort, opponent:awayShort, gameLabel, eventId: ev.id}) : null;
      rows.push({betType:'Moneyline', teamShort:awayShort, teamFull:ev.away_team, oddsText: away?`${away.price>0?'+':''}${away.price}`:null, viaText: bookSourceLabel(away, selectedBook), hr5:awayHr5, hr10:awayHr10, hr15:awayHr15, vsinSplit: half?null:vsinSplitFor(awayShort,'ml'), trackBtn:awayTrack, historyBtn:awayHist, liveKey: half?null:'ml-away', liveVerdict:{type:'ml', side:'away', half}});
      rows.push({betType:'Moneyline', teamShort:homeShort, teamFull:ev.home_team, oddsText: home?`${home.price>0?'+':''}${home.price}`:null, viaText: bookSourceLabel(home, selectedBook), hr5:homeHr5, hr10:homeHr10, hr15:homeHr15, vsinSplit: half?null:vsinSplitFor(homeShort,'ml'), trackBtn:homeTrack, historyBtn:homeHist, liveKey: half?null:'ml-home', liveVerdict:{type:'ml', side:'home', half}});
    }

    // Spread
    {
      const away = dkOutcome(spreadMarket, ev.away_team), home = dkOutcome(spreadMarket, ev.home_team);
      let awayHr5=null, awayHr10=null, awayHr15=null, homeHr5=null, homeHr10=null, homeHr15=null;
      if(withHitRate){
        const awayFn = half ? ((w)=>teamSpreadHitRateHalf(awayShort, half, away&&away.point, w)) : ((w)=>teamSpreadHitRate(awayShort, away&&away.point, w));
        const homeFn = half ? ((w)=>teamSpreadHitRateHalf(homeShort, half, home&&home.point, w)) : ((w)=>teamSpreadHitRate(homeShort, home&&home.point, w));
        awayHr5=awayFn(5); awayHr10=awayFn(10); awayHr15=awayFn(15);
        homeHr5=homeFn(5); homeHr10=homeFn(10); homeHr15=homeFn(15);
      }
      const awayTrack = (!half && away) ? makeTrackButton({label:`${ev.away_team} ${away.point>0?'+':''}${away.point}`, price:away.price, betType:'spread', team:awayShort, opponent:homeShort, side:'team', line:away.point, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const homeTrack = (!half && home) ? makeTrackButton({label:`${ev.home_team} ${home.point>0?'+':''}${home.point}`, price:home.price, betType:'spread', team:homeShort, opponent:awayShort, side:'team', line:home.point, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const awayHist = (!half && away) ? makeHistoryButton({label:`${ev.away_team} Spread`, betType:'spread', team:awayShort, opponent:homeShort, gameLabel, eventId: ev.id}) : null;
      const homeHist = (!half && home) ? makeHistoryButton({label:`${ev.home_team} Spread`, betType:'spread', team:homeShort, opponent:awayShort, gameLabel, eventId: ev.id}) : null;
      rows.push({betType:'Spread', teamShort:awayShort, teamFull:ev.away_team, oddsText: away?`${away.point>0?'+':''}${away.point} (${away.price>0?'+':''}${away.price})`:null, viaText: bookSourceLabel(away, selectedBook), hr5:awayHr5, hr10:awayHr10, hr15:awayHr15, vsinSplit: half?null:vsinSplitFor(awayShort,'spread'), trackBtn:awayTrack, historyBtn:awayHist, liveKey: half?null:'spread-away', liveVerdict: away?{type:'spread', side:'away', point:away.point, half}:null});
      rows.push({betType:'Spread', teamShort:homeShort, teamFull:ev.home_team, oddsText: home?`${home.point>0?'+':''}${home.point} (${home.price>0?'+':''}${home.price})`:null, viaText: bookSourceLabel(home, selectedBook), hr5:homeHr5, hr10:homeHr10, hr15:homeHr15, vsinSplit: half?null:vsinSplitFor(homeShort,'spread'), trackBtn:homeTrack, historyBtn:homeHist, liveKey: half?null:'spread-home', liveVerdict: home?{type:'spread', side:'home', point:home.point, half}:null});
    }

    // Total
    {
      const over = dkOutcome(totalMarket,'Over'), under = dkOutcome(totalMarket,'Under');
      const point = over ? over.point : (under ? under.point : undefined);
      const hrFn = half ? ((w)=>teamTotalHitRateHalf(awayShort, half, point, w)) : ((w)=>teamTotalHitRate(awayShort, point, w));
      const hr5 = withHitRate ? hrFn(5) : null, hr10 = withHitRate ? hrFn(10) : null, hr15 = withHitRate ? hrFn(15) : null;
      const overTrack = (!half && over) ? makeTrackButton({label:`Game Total Over ${point}`, price:over.price, betType:'total', team:awayShort, opponent:homeShort, line:point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const underTrack = (!half && under) ? makeTrackButton({label:`Game Total Under ${point}`, price:under.price, betType:'total', team:awayShort, opponent:homeShort, line:point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const overHist = (!half && over) ? makeHistoryButton({label:'Game Total Over', betType:'total', team:awayShort, opponent:homeShort, side:'over', gameLabel, eventId: ev.id}) : null;
      const underHist = (!half && under) ? makeHistoryButton({label:'Game Total Under', betType:'total', team:awayShort, opponent:homeShort, side:'under', gameLabel, eventId: ev.id}) : null;
      rows.push({betType:'Total', teamLabel: over?`Over ${over.point}`:'Over', oddsText: over?`${over.price>0?'+':''}${over.price}`:null, viaText: bookSourceLabel(over, selectedBook), hr5, hr10, hr15, vsinSplit: half?null:vsinSplitFor(awayShort,'total'), trackBtn:overTrack, historyBtn:overHist, liveKey: half?null:'total-over', liveVerdict: over?{type:'total', side:'over', point:over.point, half}:null});
      rows.push({betType:'Total', teamLabel: under?`Under ${under.point}`:'Under', oddsText: under?`${under.price>0?'+':''}${under.price}`:null, viaText: bookSourceLabel(under, selectedBook), hr5, hr10, hr15, vsinSplit: half?null:vsinSplitFor(homeShort,'total'), trackBtn:underTrack, historyBtn:underHist, liveKey: half?null:'total-under', liveVerdict: under?{type:'total', side:'under', point:under.point, half}:null});
    }

    buildOddsTable(container, rows, {includeVsin: !half});
  }

  function buildTeamTotalsTable(container, market, withHitRate, half){
    if(!market){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);padding:6px 0;';
      na.textContent = 'Not offered by ' + (BOOK_LABELS[selectedBook] || 'this book') + (selectedBook==='best' ? ' (no book has this line)' : '');
      container.appendChild(na);
      return;
    }
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    const gameDate = toEasternDateStr(ev.commence_time);
    const rows = [];
    [ev.away_team, ev.home_team].forEach((teamFullName, idx)=>{
      const shortName = idx===0 ? awayShort : homeShort;
      const oppShort = idx===0 ? homeShort : awayShort;
      const over = market.outcomes.find(o=>o.name==='Over' && o.description===teamFullName);
      const under = market.outcomes.find(o=>o.name==='Under' && o.description===teamFullName);

      let overHr5=null, overHr10=null, overHr15=null, underHr5=null, underHr10=null, underHr15=null;
      if(withHitRate && over){
        const hrFn = half ? ((w)=>teamOwnTotalHitRateHalf(shortName, half, over.point, w)) : ((w)=>teamOwnTotalHitRate(shortName, over.point, w));
        overHr5=hrFn(5); overHr10=hrFn(10); overHr15=hrFn(15);
        // Under is the exact complement of Over -- team total lines are always half-point, so
        // there's no push case to worry about; "didn't hit the Over" and "hit the Under" are
        // the same event.
        const invert = hr => (hr && hr.found) ? {found:true, rate:1-hr.rate, hits:hr.gp-hr.hits, gp:hr.gp} : hr;
        underHr5=invert(overHr5); underHr10=invert(overHr10); underHr15=invert(overHr15);
      }
      const overTrack = (!half && over) ? makeTrackButton({label:`${teamFullName} Team Total Over ${over.point}`, price:over.price, betType:'team_total', team:shortName, opponent:oppShort, line:over.point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const underTrack = (!half && under) ? makeTrackButton({label:`${teamFullName} Team Total Under ${under.point}`, price:under.price, betType:'team_total', team:shortName, opponent:oppShort, line:under.point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const overHist = (!half && over) ? makeHistoryButton({label:`${teamFullName} Team Total Over`, betType:'team_total', team:shortName, opponent:oppShort, side:'over', gameLabel, eventId: ev.id}) : null;
      const underHist = (!half && under) ? makeHistoryButton({label:`${teamFullName} Team Total Under`, betType:'team_total', team:shortName, opponent:oppShort, side:'under', gameLabel, eventId: ev.id}) : null;

      rows.push({betType:'Team Total', teamShort:shortName, teamFull:teamFullName, sideSuffix:' Over', oddsText: over?`${over.point} (${over.price>0?'+':''}${over.price})`:null, viaText: bookSourceLabel(over, selectedBook), hr5:overHr5, hr10:overHr10, hr15:overHr15, vsinSplit:null, trackBtn:overTrack, historyBtn:overHist, liveKey: half?null:`teamtotal-${shortName}`, liveVerdict: over?{type:'teamtotal', side:'over', team:shortName, point:over.point, half}:null});
      rows.push({betType:'Team Total', teamShort:shortName, teamFull:teamFullName, sideSuffix:' Under', oddsText: under?`${under.point} (${under.price>0?'+':''}${under.price})`:null, viaText: bookSourceLabel(under, selectedBook), hr5:underHr5, hr10:underHr10, hr15:underHr15, vsinSplit:null, trackBtn:underTrack, historyBtn:underHist, liveVerdict: under?{type:'teamtotal', side:'under', team:shortName, point:under.point, half}:null});
    });
    buildOddsTable(container, rows, {includeVsin: false});
  }

  const windowLabelText = windowSize==='all' ? 'Full Season' : `Last ${windowSize}`;

  // Small helper: a clickable ▶/▼ header that shows/hides a content block below it.
  function makeCollapsibleSection(parentEl, titleText, startExpanded, sectionKey){
    if(sectionKey && uiState.sections[sectionKey] !== undefined) startExpanded = uiState.sections[sectionKey];
    const headerRow = document.createElement('div');
    headerRow.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;margin-top:4px;';
    const arrow = document.createElement('span');
    arrow.textContent = startExpanded ? '\u25be' : '\u25b8';
    arrow.style.cssText = 'font-size:22px;color:var(--navy2);display:inline-block;width:24px;flex-shrink:0;line-height:1;';
    const titleEl = document.createElement('div'); titleEl.className='section-title'; titleEl.style.margin='0';
    titleEl.textContent = titleText;
    headerRow.appendChild(arrow); headerRow.appendChild(titleEl);
    parentEl.appendChild(headerRow);
    const content = document.createElement('div');
    content.style.display = startExpanded ? '' : 'none';
    parentEl.appendChild(content);
    headerRow.addEventListener('click', ()=>{
      const isExpanded = content.style.display !== 'none';
      content.style.display = isExpanded ? 'none' : '';
      arrow.textContent = isExpanded ? '\u25b8' : '\u25be';
      if(sectionKey) uiState.sections[sectionKey] = !isExpanded;
    });
    return content;
  }

  const sec1Content = makeCollapsibleSection(gameContentDiv, `Full Game \u2014 ${windowLabelText} Hit Rate`, true, 'fullGame');
  buildFullSpreadTotalTable(sec1Content, gameMarkets['h2h'], gameMarkets['spreads'], gameMarkets['totals'], true);

  const secTTContent = makeCollapsibleSection(gameContentDiv, `Team Totals (Full Game) \u2014 ${windowLabelText} Hit Rate`, true, 'teamTotals');
  buildTeamTotalsTable(secTTContent, detailMarkets['team_totals'], true);

  const halfNote = document.createElement('div'); halfNote.className='footnote'; halfNote.style.margin='4px 0 10px';
  halfNote.textContent = 'Half hit rates are derived from this season\u2019s play-by-play data (score at the end of Q2 = 1st half; final minus that = 2nd half). A small number of games can be missing this if their play-by-play log was incomplete \u2014 those are simply excluded from the count rather than treated as a miss, so the games-played figure in the badge may be slightly lower than the full-game one above.';

  const sec2Content = makeCollapsibleSection(gameContentDiv, '1st Half', false, 'half1');
  sec2Content.appendChild(halfNote.cloneNode(true));
  buildFullSpreadTotalTable(sec2Content, detailMarkets['h2h_h1'], detailMarkets['spreads_h1'], detailMarkets['totals_h1'], true, 1);
  buildTeamTotalsTable(sec2Content, detailMarkets['team_totals_h1'], true, 1);

  const sec3Content = makeCollapsibleSection(gameContentDiv, '2nd Half', false, 'half2');
  buildFullSpreadTotalTable(sec3Content, detailMarkets['h2h_h2'], detailMarkets['spreads_h2'], detailMarkets['totals_h2'], true, 2);
  buildTeamTotalsTable(sec3Content, detailMarkets['team_totals_h2'], true, 2);

  const sec4Content = makeCollapsibleSection(gameContentDiv, `Player Props (Points / Rebounds / Assists / Threes / Pts+Reb+Ast) \u2014 ${windowLabelText} Hit Rate`, true, 'playerProps');

  const propDataRows = [];
  const propMarketsSeen = new Set();
  ['player_points','player_rebounds','player_assists','player_threes','player_points_rebounds_assists'].forEach(mkey=>{
    const market = detailMarkets[mkey];
    if(!market) return;
    const statKey = PROP_MARKET_TO_STAT[mkey];
    const marketLabel = PROP_MARKET_LABEL[mkey];
    propMarketsSeen.add(marketLabel);
    // group outcomes by player description
    const players = [...new Set(market.outcomes.map(o=>o.description))];
    players.forEach(pname=>{
      const overO = market.outcomes.find(o=>o.description===pname && o.name==='Over');
      const underO = market.outcomes.find(o=>o.description===pname && o.name==='Under');
      if(!overO && !underO) return;
      const line = (overO||underO).point;
      const team = findPlayerTeam(pname, homeShort, awayShort);
      const hr = team ? hitRateFor(pname, team, statKey, line, windowSize) : null; // still powers the Hit Rate % filter/sort column below, tied to the sticky bar's selected window
      const hr5 = team ? hitRateFor(pname, team, statKey, line, 5) : null;
      const hr10 = team ? hitRateFor(pname, team, statKey, line, 10) : null;
      const hr15 = team ? hitRateFor(pname, team, statKey, line, 15) : null;

      let nameCell;
      if(team){
        const abbr = TEAM_CITY_ABBR[team];
        const link = document.createElement('a'); link.href='javascript:void(0)'; link.className='player-link';
        link.textContent = pname;
        link.addEventListener('click', ()=>{ goToPlayer(pname, team); });
        if(abbr){
          const wrap = document.createElement('span');
          wrap.appendChild(document.createTextNode(abbr + ' '));
          wrap.appendChild(link);
          nameCell = wrap;
        } else {
          nameCell = link;
        }
      } else { nameCell = pname; }

      const overThreshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
      const trackCell = document.createElement('div'); trackCell.style.cssText='display:flex;gap:4px;justify-content:center;';
      if(overO && team){
        const overBtn = makeTrackAndHistoryButtons({

// Extracts which book(s) an outcome's price actually came from -- populated by
// getBookmakerData's 'best' synthesis (_bestBooks). Falls back to DraftKings' label if this
// candidate wasn't built from Best-mode data (shouldn't normally happen once wired in, but
// keeps this safe rather than showing "undefined" if called on non-synthesized data).
function bookSourceLabel(outcome, fallbackBook){
  if(!outcome) return null;
  if(outcome._bestBooks && outcome._bestBooks.length) return bestBooksLabel(outcome._bestBooks);
  return BOOK_LABELS[fallbackBook] || null;
}
// Combines Over/Under sportsbook sourcing into one cell -- in Best mode, the over and under
// sides can legitimately come from different books, so this shows both distinctly rather than
// picking one arbitrarily.
function propSportsbookText(overO, underO, selectedBook){
  const o = overO ? bookSourceLabel(overO, selectedBook) : null;
  const u = underO ? bookSourceLabel(underO, selectedBook) : null;
  if(o && u && o!==u) return `O: ${o} / U: ${u}`;
  return o || u || '\u2014';
}

function gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL, bookForFallback){
  // Qualification bar: a specific side of a bet (Over/Under, team ML, team spread) must clear
  // QUAL hit rate in BOTH the last-10-game window and the last-15-game window (fixed windows,
  // independent of the page-level hit-rate selector above) to be eligible.
  const candidates = []; // {label, price, rate10, rate15, ...structured fields for the bet tracker}
  const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
  const gameDate = toEasternDateStr(ev.commence_time);

  // Moneyline (own-side only; the opposing team's high win rate already shows up as their own ML leg)
  [{short:awayShort, full:ev.away_team, opp:homeShort, outcome:dkOutcome(gameMarkets['h2h'], ev.away_team)},
   {short:homeShort, full:ev.home_team, opp:awayShort, outcome:dkOutcome(gameMarkets['h2h'], ev.home_team)}].forEach(side=>{
    if(!side.outcome) return;
    const r5 = teamMoneylineHitRate(side.short, 5), r10 = teamMoneylineHitRate(side.short, 10), r15 = teamMoneylineHitRate(side.short, 15), rAll = teamMoneylineHitRate(side.short, 'all');
    if(r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
      candidates.push({label:`${side.full} Moneyline`, price:side.outcome.price, sportsbook:bookSourceLabel(side.outcome, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'moneyline', team:side.short, opponent:side.opp, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
  });

  // Spread (own-side only, same reasoning as moneyline)
  [{short:awayShort, full:ev.away_team, opp:homeShort, outcome:dkOutcome(gameMarkets['spreads'], ev.away_team)},
   {short:homeShort, full:ev.home_team, opp:awayShort, outcome:dkOutcome(gameMarkets['spreads'], ev.home_team)}].forEach(side=>{
    if(!side.outcome) return;
    const pt = side.outcome.point;
    const r5 = teamSpreadHitRate(side.short, pt, 5), r10 = teamSpreadHitRate(side.short, pt, 10), r15 = teamSpreadHitRate(side.short, pt, 15), rAll = teamSpreadHitRate(side.short, pt, 'all');
    if(r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
      candidates.push({label:`${side.full} ${pt>0?'+':''}${pt}`, price:side.outcome.price, sportsbook:bookSourceLabel(side.outcome, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'spread', team:side.short, opponent:side.opp, line:pt, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
  });

  // Full-game Total, both sides
  (()=>{
    const market = gameMarkets['totals']; if(!market) return;
    const over = dkOutcome(market,'Over'), under = dkOutcome(market,'Under');
    const point = over ? over.point : (under ? under.point : undefined);
    if(point===undefined) return;
    const r10 = teamTotalHitRate(awayShort, point, 10), r15 = teamTotalHitRate(awayShort, point, 15);
    const r5 = teamTotalHitRate(awayShort, point, 5); const rAll = teamTotalHitRate(awayShort, point, 'all');
    if(over && r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
      candidates.push({label:`Game Total Over ${point}`, price:over.price, sportsbook:bookSourceLabel(over, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'total', team:awayShort, opponent:homeShort, line:point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
    if(under && r10.gp>0 && r15.gp>0 && (1-r10.rate)>=QUAL && (1-r15.rate)>=QUAL){
      candidates.push({label:`Game Total Under ${point}`, price:under.price, sportsbook:bookSourceLabel(under, bookForFallback), rate5:1-r5.rate, rate10:1-r10.rate, rate15:1-r15.rate, rateAll:1-rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'total', team:awayShort, opponent:homeShort, line:point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
  })();

  // Team Totals (full game), both sides, both teams
  (()=>{
    const market = detailMarkets['team_totals']; if(!market) return;
    [{short:awayShort, full:ev.away_team, opp:homeShort},{short:homeShort, full:ev.home_team, opp:awayShort}].forEach(side=>{
      const over = market.outcomes.find(o=>o.name==='Over' && o.description===side.full);
      const under = market.outcomes.find(o=>o.name==='Under' && o.description===side.full);
      const point = over ? over.point : (under ? under.point : undefined);
      if(point===undefined) return;
      const r10 = teamOwnTotalHitRate(side.short, point, 10), r15 = teamOwnTotalHitRate(side.short, point, 15);
      const r5 = teamOwnTotalHitRate(side.short, point, 5); const rAll = teamOwnTotalHitRate(side.short, point, 'all');
      if(over && r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
        candidates.push({label:`${side.full} Team Total Over ${point}`, price:over.price, sportsbook:bookSourceLabel(over, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
          betType:'team_total', team:side.short, opponent:side.opp, line:point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
      if(under && r10.gp>0 && r15.gp>0 && (1-r10.rate)>=QUAL && (1-r15.rate)>=QUAL){
        candidates.push({label:`${side.full} Team Total Under ${point}`, price:under.price, sportsbook:bookSourceLabel(under, bookForFallback), rate5:1-r5.rate, rate10:1-r10.rate, rate15:1-r15.rate, rateAll:1-rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
          betType:'team_total', team:side.short, opponent:side.opp, line:point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
    });
  })();

  // Player props, both sides, all four base markets
  const MIN_GP_10 = 6;  // 60% of a 10-game window
  const MIN_GP_15 = 9;  // 60% of a 15-game window
  ['player_points','player_rebounds','player_assists','player_threes'].forEach(mkey=>{
    const market = detailMarkets[mkey]; if(!market) return;
    const statKey = PROP_MARKET_TO_STAT[mkey];
    const players = [...new Set(market.outcomes.map(o=>o.description))];
    players.forEach(pname=>{
      const overO = market.outcomes.find(o=>o.description===pname && o.name==='Over');
      const underO = market.outcomes.find(o=>o.description===pname && o.name==='Under');
      const line = (overO||underO||{}).point;
      if(line===undefined) return;
      const team = findPlayerTeam(pname, homeShort, awayShort);
      if(!team) return;
      const opponent = team===homeShort ? awayShort : homeShort;
      const overThreshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
      const r5 = hitRateFor(pname, team, statKey, line, 5), r10 = hitRateFor(pname, team, statKey, line, 10), r15 = hitRateFor(pname, team, statKey, line, 15), rAll = hitRateFor(pname, team, statKey, line, 'all');
      if(!r10 || !r15) return;
      // require she actually played at least 60% of the games in BOTH windows (6-of-10, 9-of-15) —
      // otherwise a small-sample player (e.g. 2 games played all year) can slip through on a fluke rate
      if(r10.gp < MIN_GP_10 || r15.gp < MIN_GP_15) return;
      if(overO && r10.rate>=QUAL && r15.rate>=QUAL){
        candidates.push({label:`${pname} Over ${line} ${PROP_MARKET_LABEL[mkey]}`, price:overO.price, sportsbook:bookSourceLabel(overO, bookForFallback), rate5:r5?r5.rate:null, rate10:r10.rate, rate15:r15.rate, rateAll:rAll?rAll.rate:null, gp5:r5?r5.gp:0, gp10:r10.gp, gp15:r15.gp, gpAll:rAll?rAll.gp:0,
          betType:'player_prop', team, opponent, player:pname, statKey, market:PROP_MARKET_LABEL[mkey], line, side:'over', thresholdToHit:overThreshold, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
      if(underO && (1-r10.rate)>=QUAL && (1-r15.rate)>=QUAL){
        candidates.push({label:`${pname} Under ${line} ${PROP_MARKET_LABEL[mkey]}`, price:underO.price, sportsbook:bookSourceLabel(underO, bookForFallback), rate5:r5?1-r5.rate:null, rate10:1-r10.rate, rate15:1-r15.rate, rateAll:rAll?1-rAll.rate:null, gp5:r5?r5.gp:0, gp10:r10.gp, gp15:r15.gp, gpAll:rAll?rAll.gp:0,
          betType:'player_prop', team, opponent, player:pname, statKey, market:PROP_MARKET_LABEL[mkey], line, side:'under', thresholdToHit:overThreshold, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
    });
  });

  // sort by worst-case confidence (min of the two windows) descending, so the safest legs lead
  candidates.sort((a,b)=> worstCaseRate(b) - worstCaseRate(a));
  return candidates;
}

// ================= Mock Bet Tracker =================

// Derives opponent, a proper "Away @ Home" label, and venue/location from just a team name
// and a date -- used to backfill bets that are missing this info (e.g. imported from a
// spreadsheet that only recorded the player and line, not who they were playing). Returns null
// if no game is found for that team on that date.
function deriveGameInfo(team, gameDate){
  if(!team || !gameDate || !DATA || !DATA.games) return null;
  const g = Object.values(DATA.games).find(gm => gm.date===gameDate && (gm.home===team || gm.away===team));
  if(!g) return null;
  const opponent = g.home===team ? g.away : g.home;
  const gameLabel = `${g.away} @ ${g.home}`;
  const venue = (DATA.teamVenues && DATA.teamVenues[g.home]) || null;
  const location = venue ? [venue.name, [venue.city, venue.state].filter(Boolean).join(', ')].filter(Boolean).join(' \u2014 ') : null;
  return { opponent, gameLabel, location, homeTeam: g.home, awayTeam: g.away };
}

function findHistoricalGame(team, opponent, gameDate){
  const candidates = Object.values(DATA.games).filter(g=>
    (g.home===team||g.away===team) && (opponent ? (g.home===opponent||g.away===opponent) : true)
  );
  if(candidates.length===0) return null;
  if(gameDate){
    const exact = candidates.find(g=>g.date===gameDate);
    if(exact) return exact;
  }
  // Never fuzzy-match a game that's today or in the future relative to the requested date —
  // there's no historical result to "guess" yet. Without this check, a bet on today's game
  // (no exact match yet, since it hasn't been played/ingested) would silently fall back to the
  // closest PAST meeting between the same two teams (they play each other multiple times a
  // season) and get incorrectly graded against that old game instead of staying pending.
  const todayStr = new Date().toISOString().slice(0,10);
  if(gameDate && gameDate >= todayStr) return null;
  if(gameDate){
    candidates.sort((a,b)=> Math.abs(new Date(a.date)-new Date(gameDate)) - Math.abs(new Date(b.date)-new Date(gameDate)));
  }
  return candidates[0];
}

// Grades a single leg (works the same whether it's a standalone straight bet or one leg
// of a parlay). Returns 'won' | 'lost' | 'push' | null (null = can't grade yet).
function gradeLeg(leg){
  // Prefer recomputing the game date fresh from the raw commenceTime timestamp (now using the
  // correct Eastern-time conversion) over trusting leg.gameDate as stored -- picks snapshotted
  // before that fix was in place have a gameDate that's wrong by exactly one day for any late
  // (8pm ET or later) game, which silently blocked them from ever matching. Recomputing here
  // heals every already-stored pick automatically, with no need to touch what's in KV.
  const gameDate = leg.commenceTime ? toEasternDateStr(leg.commenceTime) : leg.gameDate;
  const g = findHistoricalGame(leg.team, leg.opponent, gameDate);
  if(!g) return null;
  const isHome = g.home === leg.team;
  const teamPts = isHome ? g.homeScore : g.awayScore;
  const oppPts = isHome ? g.awayScore : g.homeScore;

  if(leg.betType === 'moneyline'){
    return teamPts>oppPts ? 'won' : (teamPts===oppPts ? 'push' : 'lost');
  }
  if(leg.betType === 'spread'){
    const margin = (teamPts - oppPts) + leg.line;
    return margin>0 ? 'won' : (margin===0 ? 'push' : 'lost');
  }
  if(leg.betType === 'total'){
    const combined = teamPts + oppPts;
    if(leg.side==='over') return combined>leg.line ? 'won' : (combined===leg.line?'push':'lost');
    return combined<leg.line ? 'won' : (combined===leg.line?'push':'lost');
  }
  if(leg.betType === 'team_total'){
    if(leg.side==='over') return teamPts>leg.line ? 'won' : (teamPts===leg.line?'push':'lost');
    return teamPts<leg.line ? 'won' : (teamPts===leg.line?'push':'lost');
  }
  if(leg.betType === 'player_prop' || leg.betType === 'player_prop_alt'){
    const row = g.rows.find(r=>r.player===leg.player && r.team===leg.team);
    // The game itself WAS found at this point (checked above) -- so if this specific player
    // isn't in its box score at all, or is explicitly marked DNP, that's a CONFIRMED outcome
    // (she didn't play, DraftKings would have voided this line), not "still waiting on data."
    // Sportsbooks void player props on a DNP rather than counting them as a loss -- 'void' is
    // a distinct result from 'pending' so it doesn't sit unresolved forever.
    if(!row || row.dnp) return 'void';
    const val = statValue(row, leg.statKey);
    if(val===null || val===undefined) return 'void'; // game found, player found, but this specific stat is missing -- same treatment as DNP, not a guess
    const threshold = leg.thresholdToHit!==undefined ? leg.thresholdToHit : leg.line;
    if(leg.side==='under') return val<threshold ? 'won' : 'lost';
    return val>=threshold ? 'won' : 'lost';
  }
  return null;
}

// Companion to gradeLeg: given a bet that's already resolved (or resolvable), returns a
// human-readable string of the actual final value that determined the outcome \u2014 the final
// score for game-level bets, her actual final stat line for player props. Returns null if the
// game can't be found (still not played, or genuinely no data) rather than guessing.
function computeFinalValueLabel(bet){
  // Same fix as gradeLeg: recompute the date fresh from commenceTime rather than trusting a
  // possibly-stale stored gameDate (wrong by a day for any 8pm-ET-or-later game, pre-fix).
  const gameDate = bet.commenceTime ? toEasternDateStr(bet.commenceTime) : bet.gameDate;
  const g = findHistoricalGame(bet.team, bet.opponent, gameDate);
  if(!g) return null;
  const isHome = g.home === bet.team;
  const teamPts = isHome ? g.homeScore : g.awayScore;
  const oppPts = isHome ? g.awayScore : g.homeScore;

  if(bet.betType === 'moneyline'){
    return `Final: ${bet.team} ${teamPts} \u2013 ${bet.opponent} ${oppPts}`;
  }
  if(bet.betType === 'spread'){
    const margin = teamPts - oppPts;
    return `Final: ${bet.team} ${teamPts} \u2013 ${bet.opponent} ${oppPts} (margin ${margin>0?'+':''}${margin})`;
  }
  if(bet.betType === 'total'){
    return `Final total: ${teamPts + oppPts}`;
  }
  if(bet.betType === 'team_total'){
    return `Final: ${bet.team} scored ${teamPts}`;
  }
  if(bet.betType === 'player_prop' || bet.betType === 'player_prop_alt'){
    const row = g.rows.find(r=>r.player===bet.player && r.team===bet.team);
    if(!row) return null;
    if(row.dnp) return 'DNP';
    const val = statValue(row, bet.statKey);
    if(val===null || val===undefined) return null;
    return `Final: ${val} ${STAT_SHORT_LABEL[bet.statKey] || bet.statKey.toUpperCase()}`;
  }
  return null;
}

// Grades a tracked entry — a straight bet (single implicit leg, using the bet's own
// top-level fields) or a parlay (bet.legs array; wins only if every leg wins, pushes
// are treated as removed/neutral per standard parlay rules, still pending if any leg
// hasn't resolved yet). Returns 'won' | 'lost' | 'push' | 'void' | null.
function gradeTrackedBet(bet){
  if(bet.isParlay && Array.isArray(bet.legs)){
    const results = bet.legs.map(gradeLeg);
    if(results.some(r=>r==='lost')) return 'lost';
    // A voided leg in a real sportsbook parlay gets stripped out and the parlay recalculates
    // with what's left -- that logic isn't built yet, so a voided leg is conservatively
    // treated the same as "still waiting" for now rather than silently mis-grading the parlay.
    if(results.some(r=>r===null || r==='void')) return null;
    if(results.every(r=>r==='push')) return 'push';
    return 'won'; // rest are won/push, none lost, none pending
  }
  return gradeLeg(bet);
}

function americanPayoutProfit(price, stake){
  const dec = americanToDecimal(price);
  if(!dec) return 0;
  return stake * (dec - 1);
}

    const err = document.createElement('div'); err.style.cssText = errorDiv.style.cssText;

    btn.addEventListener('click', async ()=>{

  const forgotSub = document.createElement('div'); forgotSub.className = 'footnote'; forgotSub.style.marginBottom = '10px';
