    startInput.addEventListener('change', customRangeChanged);
    endInput.addEventListener('change', customRangeChanged);
    rangeRow.appendChild(document.createTextNode('to'));
    rangeRow.appendChild(startInput);
    rangeRow.appendChild(document.createTextNode('\u2192'));
    rangeRow.appendChild(endInput);
    analysisDiv.appendChild(rangeRow);

    const breakdownsDiv = document.createElement('div');
    analysisDiv.appendChild(breakdownsDiv);

    function renderBreakdowns(){
      breakdownsDiv.innerHTML = '';
      const inRange = bets.filter(b=>{
        const d = b.gameDate;
        if(!d) return true;
        if(analysisRangeStart && d < analysisRangeStart) return false;
        if(analysisRangeEnd && d > analysisRangeEnd) return false;
        return true;
      });
      if(inRange.length===0){
        const na = document.createElement('div'); na.style.cssText='font-size:13px;color:var(--sub);'; na.textContent='No tracked bets in this date range.';
        breakdownsDiv.appendChild(na);
        return;
      }

      // Single-dimension helpers for the two SELECTOR tables specifically: each one respects
      // the OTHER dimension's filter (so, e.g., checking "Live" implicitly isn't a thing here,
      // but checking a stat type still narrows the By Bet Type table) without self-filtering
      // on its own dimension -- otherwise checking "Moneyline" would make every other bet-type
      // row vanish (0 total, unchecked) and you'd have no way to see or pick a different one.
      // Each respects the OTHER two dimensions (including structure) so all three filters stay
      // consistent with each other everywhere on the page.
      function legMatchesStatFilterOnly(leg){
        if(!matchesStructureFilter(leg)) return false;
        if(!selectedStatTypes.size) return true;
        if(leg.betType!=='player_prop' && leg.betType!=='player_prop_alt') return false;
        return selectedStatTypes.has(leg.statKey);
      }
      function legMatchesBetTypeFilterOnly(leg){
        if(!matchesStructureFilter(leg)) return false;
        if(!selectedBetTypes.size) return true;
        return selectedBetTypes.has(leg.betType);
      }
      function betMatchesTypeFiltersOnly(bet){
        // Used by the Pregame-vs-Live/Structure table itself: respects bet-type/stat-type
        // (the other dimensions) without self-filtering on structure. Ticket-level, same shape
        // as betMatchesTypeFilters minus the structure check.
        if(!selectedBetTypes.size && !selectedStatTypes.size) return true;
        if(bet.isParlay && Array.isArray(bet.legs)) return bet.legs.some(legMatchesTypeFilters);
        return legMatchesTypeFilters(bet);
      }

      const BET_TYPE_LABELS_GLOBAL = BET_TYPE_LABELS; // module-level map, shared with the App Tracker's breakdown
      // MUST be keyed by the stat keys legs actually carry -- pts/reb/ast/tpm/pra. This used to be
      // its own map keyed by points/rebounds/assists/threes, which matched nothing: every prop leg
      // fell through, and 'pra' was the only row that ever appeared because it's the one key spelled
      // the same in both. It also silently broke the stat-type checkbox filter, since
      // selectedStatTypes was being populated with keys no leg could ever equal. Now the shared
      // module-level map, so it can't drift from what the rest of the app writes.
      const STAT_LABELS_GLOBAL = STAT_KEY_LABEL;
      const STRUCTURE_LABELS_GLOBAL = {'pregame-straight':'Pregame Straight', 'live-straight':'Live Straight', 'pregame-parlay':'Pregame Parlay', 'live-parlay':'Live Parlay', 'pregame':'Pregame', 'live':'Live', 'straight':'Straight Bets', 'parlay':'Parlays'};

      const typeFilterActive = selectedBetTypes.size>0 || selectedStatTypes.size>0 || selectedStructures.size>0;
      if(typeFilterActive){
        const filterBar = document.createElement('div');
        filterBar.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;padding:8px 12px;background:var(--greenbg);border:1px solid var(--green);border-radius:6px;font-size:12.5px;';
        const parts = [...selectedBetTypes].map(k=>BET_TYPE_LABELS_GLOBAL[k]||k)
          .concat([...selectedStatTypes].map(k=>STAT_LABELS_GLOBAL[k]||k))
          .concat([...selectedStructures].map(k=>STRUCTURE_LABELS_GLOBAL[k]||k));
        const label = document.createElement('span'); label.innerHTML = `<b>Filtered to:</b> ${parts.join(', ')}`;
        filterBar.appendChild(label);
        const clearBtn = document.createElement('button'); clearBtn.textContent = 'Clear Filters';
        clearBtn.style.cssText = 'padding:4px 10px;border-radius:5px;border:1px solid var(--green);background:var(--panel);color:var(--green);font-size:11.5px;cursor:pointer;font-family:var(--sans);font-weight:700;';
        clearBtn.addEventListener('click', ()=>{ selectedBetTypes.clear(); selectedStatTypes.clear(); selectedStructures.clear(); renderBreakdowns(); renderTable(); });
        filterBar.appendChild(clearBtn);
        breakdownsDiv.appendChild(filterBar);
      }

      const onCheckboxChange = ()=>{ renderBreakdowns(); renderTable(); };
      const structureBase = inRange.filter(betMatchesTypeFiltersOnly);
      renderStatsTable(breakdownsDiv, 'Overall / Pregame vs Live / Straight vs Parlay', [
        {label:'Overall', stats: ticketStats(structureBase)},
        {key:'pregame', label:'Pregame', stats: ticketStats(structureBase.filter(b=>b.timing!=='live'))},
        {key:'live', label:'Live / In-Game', stats: ticketStats(structureBase.filter(b=>b.timing==='live'))},
        {key:'straight', label:'Straight Bets', stats: ticketStats(structureBase.filter(b=>!b.isParlay))},
        {key:'parlay', label:'Parlays', stats: ticketStats(structureBase.filter(b=>b.isParlay))},
      ], true, {selectedSet: selectedStructures, onChange: onCheckboxChange});

      renderStatsTable(breakdownsDiv, 'Pregame vs Live, by Structure', [
        {key:'pregame-straight', label:'Pregame Straight', stats: ticketStats(structureBase.filter(b=>!b.isParlay && b.timing!=='live'))},
        {key:'live-straight', label:'Live Straight', stats: ticketStats(structureBase.filter(b=>!b.isParlay && b.timing==='live'))},
        {key:'pregame-parlay', label:'Pregame Parlay', stats: ticketStats(structureBase.filter(b=>b.isParlay && b.timing!=='live'))},
        {key:'live-parlay', label:'Live Parlay', stats: ticketStats(structureBase.filter(b=>b.isParlay && b.timing==='live'))},
      ], true, {selectedSet: selectedStructures, onChange: onCheckboxChange});

      const legs = flattenLegs(inRange);
      renderStatsTable(breakdownsDiv, 'What You Tend To Do Well On \u2014 By Bet Type (leg-level)',
        Object.entries(BET_TYPE_LABELS_GLOBAL).map(([k,l])=>({key:k, label:l, stats: legStats(legs.filter(g=>g.betType===k).filter(legMatchesStatFilterOnly))})), false,
        {selectedSet: selectedBetTypes, onChange: onCheckboxChange});

      const propLegs = legs.filter(g=>g.betType==='player_prop'||g.betType==='player_prop_alt');
      renderStatsTable(breakdownsDiv, 'Player Props \u2014 By Stat Type (leg-level)',
        Object.entries(STAT_LABELS_GLOBAL).map(([k,l])=>({key:k, label:l, stats: legStats(propLegs.filter(g=>g.statKey===k).filter(legMatchesBetTypeFilterOnly))})), false,
        {selectedSet: selectedStatTypes, onChange: onCheckboxChange});
    }
    renderBreakdowns();
  }

  function renderTable(){
    tableDiv.innerHTML = '';
    if(bets.length===0){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-top:16px;';
      na.textContent = 'No tracked bets yet. Add one manually below, import from your odds history, or use the "+ Track" buttons on the Home/Odds pages going forward.';
      tableDiv.appendChild(na);
      return;
    }
    const sorted = applyFilters(bets).sort((a,b)=> (betGameDate(b)||'').localeCompare(betGameDate(a)||''));
    if(sorted.length===0){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-top:16px;';
      na.textContent = 'No tracked bets match the current filters.';
      tableDiv.appendChild(na);
      return;
    }
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table'); table.style.width='100%';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th class="left">Date</th><th>Time</th><th class="left">Game</th><th>Price</th><th>Stake</th><th>P/L</th><th>Result</th><th class="left">Bet</th><th>Actions</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody'); table.appendChild(tbody);

    // "away @ home" for a bet -- for a parlay, this must only show a game when EVERY leg is
    // actually from that same game. A parlay spanning multiple games (very common -- picking
    // props across 3 different matchups) has no single "the game" to show, and showing the
    // first leg's game as if it applied to the whole ticket was actively wrong, not just
    // incomplete -- shows a dash instead when legs don't all agree.
    //
    // Also derives opponent/venue live via deriveGameInfo() whenever a leg has a team and date
    // but is missing its opponent -- this backfills bets that were imported without complete
    // game info (e.g. from a spreadsheet that only recorded the player and line) instead of
    // just showing a dash for something that's actually knowable from the season's own data.
    function legGameInfo(leg){
      if(leg.opponent && leg.team) return { opponent: leg.opponent, gameLabel: leg.gameLabel || null, team: leg.team };
      if(leg.team && leg.gameDate){
        const derived = deriveGameInfo(leg.team, leg.gameDate);
        if(derived) return { opponent: derived.opponent, gameLabel: derived.gameLabel, location: derived.location, team: leg.team };
      }
      return null;
    }
    function legGameKey(info){
      if(!info) return null;
      return [info.team, info.opponent].sort().join('|'); // order-independent: "A vs B" and "B vs A" are the same game
    }
    function gameMatchupText(bet){
      if(!bet.isParlay){
        const info = legGameInfo(bet);
        if(!info) return { text: '\u2014', location: null };
        const text = info.gameLabel || `${info.team} vs ${info.opponent}`;
        return { text, location: info.location || null };
      }
      if(!Array.isArray(bet.legs) || !bet.legs.length) return { text: '\u2014', location: null };
      const infos = bet.legs.map(legGameInfo);
      if(infos.some(info=>!info)) return { text: '\u2014', location: null }; // at least one leg's game isn't known -- can't confirm they all match, so don't guess
      const keys = infos.map(legGameKey);
      const allSame = keys.every(k=>k===keys[0]);
      if(!allSame) return { text: '\u2014', location: null };
      const refInfo = infos[0];
      const text = refInfo.gameLabel || `${refInfo.team} vs ${refInfo.opponent}`;
      return { text, location: refInfo.location || null };
    }
    // Same live-derivation fallback for the Date column specifically -- a parlay imported
    // without a top-level gameDate (only per-leg) used to show a blank date and sort to the
    // very bottom of the table (empty string sorts first in a descending compare). Falls back
    // to the first leg's date, then to when the bet was actually placed.
    function betGameDate(bet){
      if(bet.gameDate) return bet.gameDate;
      if(bet.isParlay && Array.isArray(bet.legs) && bet.legs[0] && bet.legs[0].gameDate) return bet.legs[0].gameDate;
      if(bet.placedAt) return bet.placedAt.slice(0,10);
      return null;
    }

    sorted.forEach(bet=>{
      const tr = document.createElement('tr');
      const stake = bet.stake || 10;
      let pl = 0;
      if(bet.result==='won') pl = americanPayoutProfit(bet.price, stake);
      else if(bet.result==='lost') pl = -stake;

      // "Time" should reflect when the bet was actually PLACED, not the game's tip-off time --
      // bet.placedAt is the real placement timestamp (set on manual add, or carried over from
      // an import like a sportsbook history export). Only falls back to game time for older
      // entries that predate placedAt existing, so something still shows rather than a blank.
      const refTime = bet.placedAt || bet.commenceTime || (bet.isParlay && bet.legs && bet.legs[0] ? bet.legs[0].commenceTime : null);

      const gameInfo = gameMatchupText(bet);
      const cells = [
        betGameDate(bet) || '\u2014',
        fmtGameTimeOnly(refTime),
        gameInfo.text,
        fmtAmerican(bet.price),
        '$'+stake.toFixed(2),
        (bet.result==='won'||bet.result==='lost') ? (pl>=0?'+':'')+'$'+pl.toFixed(2) : '\u2014',
      ];
      cells.forEach((c,i)=>{
        const td = document.createElement('td');
        if(i===0 || i===2) td.classList.add('left');
        td.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;'+(i!==0 && i!==2 ?'text-align:center;':'');
        if(i===2 && gameInfo.location){
          const main = document.createElement('div'); main.textContent = c;
          const loc = document.createElement('div'); loc.style.cssText = 'font-size:10.5px;color:var(--sub);'; loc.textContent = gameInfo.location;
          td.appendChild(main); td.appendChild(loc);
        } else {
          td.textContent = c;
        }
        tr.appendChild(td);
      });

      const tdResult = document.createElement('td'); tdResult.style.cssText='padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;';
      // The circle here is authoritative for the WHOLE bet, driven directly by the stored
      // bet.result \u2014 guaranteed to show red/green for every closed bet regardless of
      // whether individual parlay legs can be resolved from box scores (see below).
      const resultWrap = document.createElement('div'); resultWrap.style.cssText='display:flex;align-items:center;justify-content:center;gap:5px;';
      resultWrap.appendChild(legResultIcon(bet.result));
      resultWrap.appendChild(fmtResultBadge(bet.result));
      tdResult.appendChild(resultWrap);
      tr.appendChild(tdResult);

      // Bet column \u2014 moved to the far right. A straight bet shows one result circle
      // next to its label; a parlay shows every leg on its own line, each with its own
      // circle so you can see at a glance which legs already won/lost vs. are still pending.
      const tdBet = document.createElement('td'); tdBet.classList.add('left');
      tdBet.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;';
      if(bet.isParlay && Array.isArray(bet.legs)){
        bet.legs.forEach((leg, idx)=>{
          const legRow = document.createElement('div');
          legRow.style.cssText = 'display:flex;align-items:center;'+(idx>0?'margin-top:3px;':'');
          // If the whole parlay is a confirmed WIN, every leg must have won too (a parlay
          // only wins if all legs do) \u2014 safe to show green even for legs the live box-score
          // matcher can't individually resolve (e.g. "Live" in-game-adjusted props that don't
          // map cleanly onto a pregame-style threshold). If the parlay LOST, we genuinely don't
          // know which specific leg(s) lost from a settled bet slip alone, so an unresolvable
          // leg here stays a neutral marker rather than guessing red or green.
          // Trust an explicitly stored leg result first (e.g. imported from a settled bet
          // slip where every leg's outcome is already known) -- only fall back to live
          // grading when a leg genuinely has no stored result yet.
          let legResult = (leg.result && leg.result!=='pending') ? leg.result : gradeLeg(leg);
          if(!legResult && bet.result==='won') legResult = 'won';
          const icon = legResult ? legResultIcon(legResult) : legResultIcon(null);
          if(!legResult && bet.result==='lost'){
            icon.title = 'This specific leg couldn\u2019t be individually verified from this app\u2019s box score data (common for in-game/live-adjusted props) \u2014 the parlay as a whole is confirmed Lost, shown in the Result column, but which leg(s) caused it isn\u2019t knowable from a settled bet slip alone. Click to set it manually.';
          } else {
            icon.title = 'Click to manually set this leg\u2019s result';
          }
          icon.style.cursor = 'pointer';
          icon.addEventListener('click', async ()=>{
            // Cycles pending -> won -> lost -> push -> pending. Overrides whatever this leg
            // was showing (live-graded or previously stored) with an explicit, persisted value.
            const cycle = ['won','lost','push','pending'];
            const current = leg.result && cycle.includes(leg.result) ? leg.result : 'pending';
            const next = cycle[(cycle.indexOf(current)+1) % cycle.length];
            leg.result = next;
            icon.style.opacity = '0.5';
            try{
              await trackerUpdate(bet.id, {legs: bet.legs});
            }catch(e){
              alert('Failed to save: ' + e.message);
            }
            await refresh();
          });
          legRow.appendChild(icon);
          legRow.appendChild(buildLegLabelNode(leg));
          tdBet.appendChild(legRow);
        });
      } else {
        const legRow = document.createElement('div'); legRow.style.cssText = 'display:flex;align-items:center;';
        legRow.appendChild(legResultIcon(bet.result));
        legRow.appendChild(buildLegLabelNode(bet));
        tdBet.appendChild(legRow);
      }
      tr.appendChild(tdBet);

      const tdActions = document.createElement('td'); tdActions.style.cssText='padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;';
      const editBtn = document.createElement('button'); editBtn.textContent='Edit';
      editBtn.style.cssText='padding:3px 8px;margin-right:4px;border-radius:4px;border:1px solid var(--line);background:var(--panel);font-size:11px;cursor:pointer;font-family:var(--sans);';
      editBtn.addEventListener('click', ()=>openEditForm(bet));
      const delBtn = document.createElement('button'); delBtn.textContent='Delete';
      delBtn.style.cssText='padding:3px 8px;border-radius:4px;border:1px solid var(--red);background:var(--panel);color:var(--red);font-size:11px;cursor:pointer;font-family:var(--sans);';
      delBtn.addEventListener('click', async ()=>{
        if(!confirm('Delete this tracked bet?')) return;
        await trackerDelete(bet.id);
        await refresh();
      });
      tdActions.appendChild(editBtn); tdActions.appendChild(delBtn);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    tableDiv.appendChild(wrap);
  }

  async function autoGradeAll(){
    let gradedCount = 0;
    for(const bet of bets){
      if(bet.result && bet.result!=='pending') continue;
      const result = gradeTrackedBet(bet);
      if(result){
        await trackerUpdate(bet.id, {result});
        bet.result = result; // keep the in-memory copy in sync so the render right after doesn't need a re-fetch
        gradedCount++;
      }
    }
    return gradedCount;
  }

  async function refresh(){
    statusDiv.textContent = 'Loading your tracked bets\u2026';
    try{
      bets = await trackerList();
      statusDiv.textContent = `${bets.length} tracked bet(s) loaded.`;
    }catch(e){
      statusDiv.textContent = `Couldn\u2019t load tracked bets: ${e.message}`;
      bets = [];
    }
    // Auto-grade on every load, not just when the button is clicked \u2014 otherwise bets from
    // finished games sit as "Pending" until someone happens to press the button.
    if(bets.length){
      const gradedCount = await autoGradeAll();
      if(gradedCount) statusDiv.textContent = `${bets.length} tracked bet(s) loaded (auto-graded ${gradedCount}).`;
    }
    renderSummary();
    renderAnalysis();
    renderTable();
  }

  gradeBtn.addEventListener('click', async ()=>{
    gradeBtn.disabled = true; gradeBtn.textContent = 'Grading\u2026';
    const gradedCount = await autoGradeAll();
    gradeBtn.disabled = false; gradeBtn.textContent = '\u2705 Auto-Grade Pending Bets';
    statusDiv.textContent = `Graded ${gradedCount} bet(s). Refreshing\u2026`;
    await refresh();
  });

  // Backfills opponent/gameLabel (and, for parlays, a top-level gameDate) on any bet that's
  // missing them but has enough info to derive them (team + gameDate) -- fixes bets imported
  // without complete game info, e.g. from a spreadsheet that only recorded the player and line.
  // Safe to run repeatedly: skips anything that's already complete.
  async function repairMissingGameInfo(){
    let repairedCount = 0, uncertainCount = 0;
    for(const bet of bets){
      let needsUpdate = false;
      const patch = {};

      if(bet.isParlay && Array.isArray(bet.legs)){
        let legsChanged = false;
        const newLegs = bet.legs.map(leg=>{
          if(leg.opponent && leg.gameLabel) return leg;
          if(!leg.team || !leg.gameDate) return leg;
          const derived = deriveGameInfo(leg.team, leg.gameDate);
          if(!derived) return leg;
          legsChanged = true;
          return Object.assign({}, leg, {opponent: derived.opponent, gameLabel: derived.gameLabel});
        });
        if(legsChanged){ patch.legs = newLegs; needsUpdate = true; }
        if(!bet.gameDate && bet.legs[0] && bet.legs[0].gameDate){ patch.gameDate = bet.legs[0].gameDate; needsUpdate = true; }
      } else {
        if((!bet.opponent || !bet.gameLabel) && bet.team && bet.gameDate){
          const derived = deriveGameInfo(bet.team, bet.gameDate);
          if(derived){ patch.opponent = derived.opponent; patch.gameLabel = derived.gameLabel; needsUpdate = true; }
        }
      }

      if(needsUpdate){
        try{ await trackerUpdate(bet.id, patch); repairedCount++; }
        catch(e){ console.warn('Repair failed for one bet (continuing):', bet.label, e); }
      } else if((bet.isParlay ? !bet.gameDate : (!bet.opponent || !bet.gameLabel)) && !(bet.team||(bet.legs&&bet.legs[0]&&bet.legs[0].team))){
        uncertainCount++; // genuinely nothing to derive from (no team on any leg) -- can't fix these
      }
    }
    return {repairedCount, uncertainCount};
  }
  repairBtn.addEventListener('click', async ()=>{
    repairBtn.disabled = true; repairBtn.textContent = 'Repairing\u2026';
    const {repairedCount, uncertainCount} = await repairMissingGameInfo();
    repairBtn.disabled = false; repairBtn.textContent = '\ud83e\uddf9 Repair Missing Game Info';
    statusDiv.textContent = `Repaired ${repairedCount} bet(s).` + (uncertainCount ? ` ${uncertainCount} couldn't be fixed (no team info to work from).` : '') + ' Refreshing\u2026';
    await refresh();
  });

    function updateVisibility(){
      const t = typeSel.value;
      teamWrap.style.display = (t==='moneyline'||t==='spread'||t==='total'||t==='team_total') ? 'flex' : 'none';
      playerWrap.style.display = (t==='player_prop') ? 'flex' : 'none';
      statWrap.style.display = (t==='player_prop') ? 'flex' : 'none';
      sideSel.parentElement.style.display = (t==='moneyline') ? 'none' : 'flex';
      lineInput.parentElement.style.display = (t==='moneyline') ? 'none' : 'flex';
    }
    function updateStructureVisibility(){
      const isParlay = structSel.value === 'parlay';
      addLegRow.style.display = isParlay ? 'block' : 'none';
      legsListDiv.style.display = isParlay ? 'block' : 'none';
      priceLabel.querySelector('label').textContent = isParlay ? 'Combined Price' : 'Your Price';
      renderLegsList();
    }
    gameSel.addEventListener('change', populateTeams);
    teamSel.addEventListener('change', populatePlayers);
    typeSel.addEventListener('change', updateVisibility);
    structSel.addEventListener('change', updateStructureVisibility);
    populateTeams();
    updateVisibility();
    updateStructureVisibility();

    function buildLegFromFields(){
      const g = DATA.games[gameSel.value];
      const team = teamSel.value;
      const opponent = team===g.home ? g.away : g.home;
      const line = lineInput.value!=='' ? parseFloat(lineInput.value) : undefined;
      const betType = typeSel.value;
      let label, thresholdToHit, statKey, player, side;
      if(betType==='moneyline'){
        label = `${team} Moneyline`; side='team';
      } else if(betType==='spread'){
        label = `${team} ${line>0?'+':''}${line}`; side='team';
      } else if(betType==='total'){
        side = sideSel.value; label = `Game Total ${side==='over'?'Over':'Under'} ${line}`;
      } else if(betType==='team_total'){
        side = sideSel.value; label = `${team} Team Total ${side==='over'?'Over':'Under'} ${line}`;
      } else {
        side = sideSel.value; player = playerSel.value; statKey = statSel.value;
        const marketLabel = STAT_KEY_LABEL[statKey] || statKey;
        label = `${player} ${side==='over'?'Over':'Under'} ${line} ${marketLabel}`;
        thresholdToHit = Number.isInteger(line) ? line+1 : Math.ceil(line);
      }
      return { gameLabel: g.label, gameDate: g.date, betType, team, opponent, player, statKey, line, side, thresholdToHit, label };
    }

    addLegBtn.addEventListener('click', ()=>{
      parlayLegs.push(buildLegFromFields());
      renderLegsList();
    });

    if(existingBet){
      const gid = Object.keys(DATA.games).find(gid => {
        const refBet = existingBet.isParlay ? existingBet.legs[0] : existingBet;
        const refGameDate = refBet.commenceTime ? toEasternDateStr(refBet.commenceTime) : refBet.gameDate;
        return DATA.games[gid] === findHistoricalGame(refBet.team, refBet.opponent, refGameDate);
      });
      if(gid) gameSel.value = gid;
      const refForFields = existingBet.isParlay ? (existingBet.legs[0]||{}) : existingBet;
      typeSel.value = refForFields.betType || 'moneyline'; updateVisibility();
      populateTeams();
      if(refForFields.team) teamSel.value = refForFields.team;
      populatePlayers();
      if(refForFields.player) playerSel.value = refForFields.player;
      if(refForFields.statKey) statSel.value = refForFields.statKey;
      if(refForFields.side) sideSel.value = refForFields.side;
      if(refForFields.line!==undefined) lineInput.value = refForFields.line;
      if(existingBet.price!==undefined) priceInput.value = existingBet.price;
      if(existingBet.stake!==undefined) stakeInput.value = existingBet.stake;
      if(existingBet.notes) notesInput.value = existingBet.notes;
      if(existingBet.timing) timingSel.value = existingBet.timing;
    }

    const btnRow = document.createElement('div'); btnRow.style.cssText='display:flex;gap:10px;';
    const saveBtn = document.createElement('button'); saveBtn.className='addbtn';
    saveBtn.textContent = existingBet ? 'Save Changes' : 'Add Bet';
    const cancelBtn = document.createElement('button'); cancelBtn.textContent='Cancel';
    cancelBtn.style.cssText='padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer;font-family:var(--sans);';
    cancelBtn.addEventListener('click', ()=>{ formDiv.style.display='none'; formDiv.innerHTML=''; });
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
    card.appendChild(btnRow);
    formDiv.appendChild(card);

    saveBtn.addEventListener('click', async ()=>{
      const price = parseFloat(priceInput.value);
      if(isNaN(price)){ alert('Enter the price (combined price for a parlay, or the single price for a straight bet).'); return; }
      const isParlay = structSel.value === 'parlay';

      let bet;
      if(isParlay){
        if(parlayLegs.length < 2){ alert('Add at least 2 legs to make this a parlay (or switch to Straight Bet).'); return; }
        bet = {
          isParlay: true, legs: parlayLegs,
          gameLabel: `${parlayLegs.length}-Leg Parlay`, gameDate: parlayLegs[0].gameDate,
          label: `${parlayLegs.length}-Leg Parlay: ` + parlayLegs.map(l=>l.label).join(' + '),
          price, stake: parseFloat(stakeInput.value)||10, notes: notesInput.value || '',
          result: existingBet ? existingBet.result : 'pending',
          timing: timingSel.value, trackedFrom: 'manual',
        };
      } else {
        const leg = buildLegFromFields();
        bet = Object.assign({}, leg, {
          isParlay: false,
          price, stake: parseFloat(stakeInput.value)||10, notes: notesInput.value || '',
          result: existingBet ? existingBet.result : 'pending',
          timing: timingSel.value, trackedFrom: 'manual',
        });
      }

      saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026';
      try{
        if(existingBet){ await trackerUpdate(existingBet.id, bet); }
        else { await trackerAdd(bet); }
        formDiv.style.display='none'; formDiv.innerHTML='';
        await refresh();
      }catch(e){
        alert('Failed to save: '+e.message);
        saveBtn.disabled = false; saveBtn.textContent = existingBet ? 'Save Changes' : 'Add Bet';
      }
    });
  }
  function labeled(labelText, el){
    const w = document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:2px;';
    const l = document.createElement('label'); l.textContent = labelText; l.style.cssText='font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;';
    w.appendChild(l); w.appendChild(el);
    return w;
  }
  function openEditForm(bet){ importDiv.style.display='none'; buildAddForm(bet); }
  addFormBtn.addEventListener('click', ()=>{ importDiv.style.display='none'; screenshotDiv.style.display='none'; bulkJsonDiv.style.display='none'; buildAddForm(null); });

  // ---- Import from Odds History ----
  importBtn.addEventListener('click', async ()=>{
    formDiv.style.display='none'; formDiv.innerHTML='';
    screenshotDiv.style.display='none'; bulkJsonDiv.style.display='none';
    importDiv.style.display = 'block';
    importDiv.innerHTML = '<div class="footnote">Loading captured odds history from your Worker\u2026</div>';
    let history;
    try{
      history = await fetchOddsHistoryCached();
    }catch(e){
      importDiv.innerHTML = `<div class="footnote">Couldn\u2019t load odds history: ${e.message}</div>`;
      return;
    }
    if(!Array.isArray(history) || history.length===0){
      importDiv.innerHTML = '<div class="footnote">No odds snapshots found yet. Snapshots are only saved automatically while the Odds/Home pages are actually being used and fetched pre-tip-off \u2014 if you weren\u2019t actively using the app during those games, there\u2019s nothing captured to import. Use "+ Add Bet Manually" instead.</div>';
      return;
    }
    // merge all snapshots per event, keeping the union of markets seen (latest wins per market key)
    const byEvent = {};
    history.forEach(snap=>{
      if(!byEvent[snap.eventId]) byEvent[snap.eventId] = { meta: snap, markets: {} };
      byEvent[snap.eventId].meta = snap;
      const dk = (snap.data.bookmakers||[]).find(b=>b.key==='draftkings');
      if(dk){ (dk.markets||[]).forEach(m=>{ byEvent[snap.eventId].markets[m.key] = m; }); }
    });

    importDiv.innerHTML = '';
    const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
    note.textContent = `Found ${Object.keys(byEvent).length} game(s) with captured lines. Check the ones you actually bet, adjust price/stake if needed, then add them.`;
    importDiv.appendChild(note);

    Object.values(byEvent).forEach(entry=>{
      const ev = entry.meta.data;
      const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
      const gameDate = toEasternDateStr(ev.commence_time);
      const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
      const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
      const card = document.createElement('div'); card.className='table-wrap'; card.style.cssText='padding:12px;margin-bottom:12px;';
      const title = document.createElement('div'); title.style.cssText='font-weight:800;font-size:13.5px;margin-bottom:4px;'; title.textContent = `${gameLabel} \u2014 ${gameDate}`;
      card.appendChild(title);
      const timingRow = document.createElement('div'); timingRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--sub);';
      const timingLbl = document.createElement('span'); timingLbl.textContent = 'These were placed:';
      const timingSel = document.createElement('select'); timingSel.style.cssText='padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;';
      [['pregame','Pregame'],['live','Live/In-Game']].forEach(([v,l])=>{ const op=document.createElement('option'); op.value=v; op.textContent=l; timingSel.appendChild(op); });
      timingRow.appendChild(timingLbl); timingRow.appendChild(timingSel);
      card.appendChild(timingRow);

      const legs = gatherAllCapturedLegs(entry.markets, ev, homeShort, awayShort, gameLabel, gameDate);
      if(legs.length===0){
        const na = document.createElement('div'); na.style.cssText='font-size:12px;color:var(--sub);'; na.textContent='No usable market data captured for this game.';
        card.appendChild(na);
      } else {
        legs.forEach(leg=>{
          const row = document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;';
          const cb = document.createElement('input'); cb.type='checkbox';
          const lbl = document.createElement('span'); lbl.style.flex='1'; lbl.textContent = leg.label;
          const priceIn = document.createElement('input'); priceIn.type='number'; priceIn.value=leg.price;
          priceIn.style.cssText='width:80px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;';
          row.appendChild(cb); row.appendChild(lbl); row.appendChild(document.createTextNode('@')); row.appendChild(priceIn);
          card.appendChild(row);
          row._leg = leg; row._cb = cb; row._priceIn = priceIn;
        });
        const addBtn = document.createElement('button'); addBtn.className='addbtn'; addBtn.style.marginTop='8px';
        addBtn.textContent = 'Add Checked Bets';
        addBtn.addEventListener('click', async ()=>{
          addBtn.disabled = true; addBtn.textContent='Saving\u2026';
          const rows = [...card.querySelectorAll('div')].filter(r=>r._leg);
          let count = 0;
          for(const row of rows){
            if(!row._cb.checked) continue;
            const leg = Object.assign({}, row._leg, {price: parseFloat(row._priceIn.value), stake:10, result:'pending', trackedFrom:'history-import', timing:timingSel.value, isParlay:false});
            await trackerAdd(leg);
            count++;
          }
          addBtn.disabled = false; addBtn.textContent = `Added ${count}`;
          await refresh();
        });
        card.appendChild(addBtn);
      }
      importDiv.appendChild(card);
    });
  });

  // ---- Shared helper: POST a list of bet objects to the tracker, one by one ----
  async function addBetsToTracker(betList, statusEl){
    let ok = 0, fail = 0, firstError = null;
    for(const bet of betList){
      try{
        const cleaned = Object.assign({result:'pending', stake: bet.stake||10}, bet);
        const res = await trackerAdd(cleaned);
        if(res && res.error) throw new Error(res.error);
        ok++;
      }catch(e){
        fail++;
        if(!firstError) firstError = e.message;
        console.warn('Bulk add failed for', bet, e);
      }
      if(statusEl) statusEl.textContent = `Adding\u2026 ${ok+fail}/${betList.length} (${ok} ok, ${fail} failed)`;
    }
    return {ok, fail, firstError};
  }

  // ---- Upload Bet Screenshot(s): sends the image to Claude directly (in-artifact API call,
  // your key is never exposed) and asks it to extract structured bet data, matching this
  // app's own schema, ready to review before adding. ----
  screenshotBtn.addEventListener('click', ()=>{
    formDiv.style.display='none'; importDiv.style.display='none'; bulkJsonDiv.style.display='none';
    screenshotDiv.style.display = 'block';
    screenshotDiv.innerHTML = '';
    const card = document.createElement('div'); card.className='table-wrap'; card.style.padding='16px';
    const title = document.createElement('div'); title.className='section-title'; title.textContent = 'Upload Bet Slip Screenshot(s)';
    card.appendChild(title);
    const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
    note.textContent = 'Upload one or more DraftKings bet-slip screenshots. Claude reads them directly and extracts structured bet data \u2014 review the results below before anything is added to your tracker.';
    card.appendChild(note);

    const fileInput = document.createElement('input'); fileInput.type='file'; fileInput.accept='image/*'; fileInput.multiple = true;
    card.appendChild(fileInput);
    const goBtn = document.createElement('button'); goBtn.className='addbtn'; goBtn.textContent='Parse Screenshot(s)'; goBtn.style.marginLeft='10px';
    card.appendChild(goBtn);
    const parseStatus = document.createElement('div'); parseStatus.className='footnote'; parseStatus.style.margin='10px 0';
    card.appendChild(parseStatus);
    const reviewDiv = document.createElement('div');
    card.appendChild(reviewDiv);
    screenshotDiv.appendChild(card);

    function fileToBase64(file){
      return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onload = ()=> resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    goBtn.addEventListener('click', async ()=>{
      if(!fileInput.files.length){ parseStatus.textContent = 'Choose at least one image first.'; return; }
      goBtn.disabled = true; parseStatus.textContent = 'Reading images\u2026';
      const teamList = Object.entries(FULL_TEAM_NAME).map(([short,full])=>`${short} = ${full}`).join(', ');
      // Eastern, not UTC: this is what Claude uses to date a bet slip that only shows a
      // weekday or "Today", and a wrong date here feeds straight into grading.
      const todayIso = toEasternDateStr(new Date().toISOString());
      const promptText = `You are extracting structured sports-bet data from DraftKings bet-slip screenshot(s). `
        + `For EACH bet slip shown (there may be several in one image, or one per image), return one JSON object. `
        + `Return ONLY a JSON array, no markdown fences, no commentary.\n\n`
        + `Each object shape:\n`
        + `{"isParlay": bool, "gameLabel": "Away @ Home", "gameDate": "YYYY-MM-DD", "timing": "pregame"|"live", `
        + `"price": americanOddsNumber, "stake": dollarNumberOrNull, "result": "won"|"lost"|"push"|"pending", `
        + `"label": "short human description", `
        + `"legs": [ {"betType":"moneyline"|"spread"|"total"|"team_total"|"player_prop", "team":"SHORT_CODE", `
        + `"opponent":"SHORT_CODE_OR_NULL", "player":"Full Player Name or null", `
        + `"statKey":"pts"|"reb"|"ast"|"tpm"|"pra"|null, "line": numberOrNull, "side":"over"|"under"|"team", `
        + `"thresholdToHit": number, "label":"short description"} ] }\n\n`
        + `If it's a single (non-parlay) bet, still put exactly one entry in "legs" and set isParlay:false. `
        + `Use these EXACT team short codes (never full names) for "team"/"opponent": ${teamList}. `
        + `For player props: statKey pts=Points, reb=Rebounds, ast=Assists, tpm=Threes, pra=Pts+Reb+Ast. `
        + `thresholdToHit is the actual minimum stat value needed to win: for a standard Over/Under X.5 line, `
        + `thresholdToHit = ceil(X.5); for a milestone "X+" line, thresholdToHit = X exactly (no rounding). `
        + `If a bet slip shows "Won"/"Lost"/"Cashed Out", map to result won/lost/push. If it shows no settled `
        + `result, use "pending". Infer gameDate from any date shown; if truly unknown, use ${todayIso}. `
        + `If you cannot confidently determine a field, use null rather than guessing.`;

      const content = [{type:'text', text: promptText}];
      try{
        for(const file of fileInput.files){
          const b64 = await fileToBase64(file);
          content.push({type:'image', source:{type:'base64', media_type: file.type || 'image/png', data: b64}});
        }
        parseStatus.textContent = 'Asking Claude to read the screenshot(s)\u2026';
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 4000,
            messages: [{role:'user', content}],
          }),
        });
        const data = await resp.json();
        const text = (data.content||[]).map(b=>b.text||'').join('\n');
        const cleaned = text.replace(/```json|```/g,'').trim();
        let parsedBets;
        try{ parsedBets = JSON.parse(cleaned); }
        catch(e){ throw new Error('Claude\u2019s response wasn\u2019t valid JSON \u2014 raw response: ' + text.slice(0,300)); }
        if(!Array.isArray(parsedBets) || parsedBets.length===0){ throw new Error('No bets recognized in the image(s).'); }

        parseStatus.textContent = `Found ${parsedBets.length} bet(s). Review below, then confirm.`;
        reviewDiv.innerHTML = '';
        parsedBets.forEach(b=>{
          const row = document.createElement('div'); row.style.cssText='display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px;';
          const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = true; cb.style.marginTop='3px';
          const txt = document.createElement('div'); txt.style.flex = '1';
          const legsTxt = (b.legs||[]).map(l=>l.label).join(' + ');
          txt.innerHTML = `<b>${b.label||legsTxt||'(unnamed bet)'}</b><br><span style="color:var(--sub);">${b.gameLabel||''} \u2014 ${b.gameDate||''} \u2014 ${b.timing||'pregame'} \u2014 ${fmtAmerican(b.price)} \u2014 ${b.result||'pending'}</span>`;
          row.appendChild(cb); row.appendChild(txt);
          row._bet = b; row._cb = cb;
          reviewDiv.appendChild(row);
        });
        const confirmBtn = document.createElement('button'); confirmBtn.className='addbtn'; confirmBtn.style.marginTop='10px';
        confirmBtn.textContent = 'Add Checked Bets to Tracker';
        confirmBtn.addEventListener('click', async ()=>{
          confirmBtn.disabled = true;
          const toAdd = [...reviewDiv.querySelectorAll('div')].filter(r=>r._bet && r._cb && r._cb.checked).map(r=>r._bet);
          const result = await addBetsToTracker(toAdd, parseStatus);
          parseStatus.textContent = `Added ${result.ok}, failed ${result.fail}.` + (result.fail ? ` First error: ${result.firstError}` : '');
          await refresh();
        });
        reviewDiv.appendChild(confirmBtn);
      }catch(e){
        parseStatus.textContent = `Couldn\u2019t parse screenshot(s): ${e.message}`;
      }
      goBtn.disabled = false;
    });
  });

  // ---- Bulk Import JSON: paste an array of bet objects (e.g. exported from your own
  // spreadsheet) matching the same schema, and add them all in one go. ----
  bulkJsonBtn.addEventListener('click', ()=>{
    formDiv.style.display='none'; importDiv.style.display='none'; screenshotDiv.style.display='none';
    bulkJsonDiv.style.display = 'block';
    bulkJsonDiv.innerHTML = '';
    const card = document.createElement('div'); card.className='table-wrap'; card.style.padding='16px';
    const title = document.createElement('div'); title.className='section-title'; title.textContent = 'Bulk Import JSON';
    card.appendChild(title);
    const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
    note.textContent = 'Paste a JSON array of bet objects (same schema the tracker already uses) and add them all at once \u2014 useful for importing a batch that was prepared outside the app.';
    card.appendChild(note);
    const ta = document.createElement('textarea'); ta.placeholder = '[ { "isParlay": false, "legs": [...], "price": -115, ... }, ... ]';
    ta.style.cssText = 'width:100%;min-height:160px;padding:8px;border:1px solid var(--line);border-radius:5px;font-size:12px;font-family:monospace;margin-bottom:10px;';
    card.appendChild(ta);
    const goBtn = document.createElement('button'); goBtn.className='addbtn'; goBtn.textContent='Import';
    card.appendChild(goBtn);
    const status = document.createElement('div'); status.className='footnote'; status.style.marginTop='10px';
    card.appendChild(status);
    bulkJsonDiv.appendChild(card);

    goBtn.addEventListener('click', async ()=>{
      let parsed;
      try{ parsed = JSON.parse(ta.value); }
      catch(e){ status.textContent = 'Invalid JSON: ' + e.message; return; }
      if(!Array.isArray(parsed)){ status.textContent = 'Expected a JSON array of bet objects.'; return; }
      goBtn.disabled = true;
      const result = await addBetsToTracker(parsed, status);
      status.textContent = `Added ${result.ok}, failed ${result.fail}.` + (result.fail ? ` First error: ${result.firstError}` : '');
      goBtn.disabled = false;
      await refresh();
    });
  });

  await refresh();
}

// Extracts every priced outcome from a merged captured-market set (used only for History Import,
// where we want ALL available lines, not just ones clearing a confidence bar).
function gatherAllCapturedLegs(markets, ev, homeShort, awayShort, gameLabel, gameDate){
  const legs = [];
  const h2h = markets['h2h'];
  if(h2h){
    [{short:awayShort,full:ev.away_team,opp:homeShort},{short:homeShort,full:ev.home_team,opp:awayShort}].forEach(side=>{
      const o = dkOutcome(h2h, side.full);
      if(o) legs.push({label:`${side.full} Moneyline`, price:o.price, betType:'moneyline', team:side.short, opponent:side.opp, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    });
  }
  const spreads = markets['spreads'];
  if(spreads){
    [{short:awayShort,full:ev.away_team,opp:homeShort},{short:homeShort,full:ev.home_team,opp:awayShort}].forEach(side=>{
      const o = dkOutcome(spreads, side.full);
      if(o) legs.push({label:`${side.full} ${o.point>0?'+':''}${o.point}`, price:o.price, betType:'spread', team:side.short, opponent:side.opp, line:o.point, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    });
  }
  const totals = markets['totals'];
  if(totals){
    const over = dkOutcome(totals,'Over'), under = dkOutcome(totals,'Under');
    if(over) legs.push({label:`Game Total Over ${over.point}`, price:over.price, betType:'total', team:awayShort, opponent:homeShort, line:over.point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    if(under) legs.push({label:`Game Total Under ${under.point}`, price:under.price, betType:'total', team:awayShort, opponent:homeShort, line:under.point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
  }
  const teamTotals = markets['team_totals'];
  if(teamTotals){
    [{short:awayShort,full:ev.away_team,opp:homeShort},{short:homeShort,full:ev.home_team,opp:awayShort}].forEach(side=>{
      const over = teamTotals.outcomes.find(o=>o.name==='Over'&&o.description===side.full);
      const under = teamTotals.outcomes.find(o=>o.name==='Under'&&o.description===side.full);
      if(over) legs.push({label:`${side.full} Team Total Over ${over.point}`, price:over.price, betType:'team_total', team:side.short, opponent:side.opp, line:over.point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      if(under) legs.push({label:`${side.full} Team Total Under ${under.point}`, price:under.price, betType:'team_total', team:side.short, opponent:side.opp, line:under.point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    });
  }
  // P+R+A included: everything downstream already understood the 'pra' stat key -- statValue(),
  // hitRateFor(), multiWindowStats() for the EMA tiebreak, the DvP indices, defence ranks, live
  // in-game scoring and grading all handle it. The ONLY reason the app never recommended a
  // Pts+Reb+Ast bet was that this market list didn't ask the book for one.
  ['player_points','player_rebounds','player_assists','player_threes','player_points_rebounds_assists','player_points_rebounds','player_points_assists','player_rebounds_assists'].forEach(mkey=>{
    const market = markets[mkey]; if(!market) return;
    const statKey = PROP_MARKET_TO_STAT[mkey];
    const players = [...new Set(market.outcomes.map(o=>o.description))];
    players.forEach(pname=>{
      const over = market.outcomes.find(o=>o.description===pname&&o.name==='Over');
      const under = market.outcomes.find(o=>o.description===pname&&o.name==='Under');
      const line = (over||under||{}).point;
      if(line===undefined) return;
      const team = findPlayerTeam(pname, homeShort, awayShort);
      const threshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
      if(over) legs.push({label:`${pname} Over ${line} ${PROP_MARKET_LABEL[mkey]}`, price:over.price, betType:'player_prop', team, player:pname, statKey, line, side:'over', thresholdToHit:threshold, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      if(under) legs.push({label:`${pname} Under ${line} ${PROP_MARKET_LABEL[mkey]}`, price:under.price, betType:'player_prop', team, player:pname, statKey, line, side:'under', thresholdToHit:threshold, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    });
  });
  return legs;
}

// A leg's label (e.g. "New York Liberty Moneyline" or "Caitlin Clark Over 21.5 Points")
// always starts with either a team's full name or a player's name, depending on betType \u2014
// this splits that prefix out into a clickable link and returns the rest as plain text.
function buildLegLabelNode(l){
  const frag = document.createDocumentFragment();
  if((l.betType==='moneyline' || l.betType==='spread' || l.betType==='team_total') && l.team){
    const fullName = FULL_TEAM_NAME[l.team] || l.team;
    if(l.label.indexOf(fullName)===0){
      frag.appendChild(teamLinkEl(l.team, fullName));
      frag.appendChild(document.createTextNode(l.label.slice(fullName.length)));
      return frag;
    }
  }
  if((l.betType==='player_prop' || l.betType==='player_prop_alt') && l.player && l.team){
    if(l.label.indexOf(l.player)===0){
      const abbr = TEAM_CITY_ABBR[l.team];
      if(abbr) frag.appendChild(document.createTextNode(abbr + ' '));
      const a = document.createElement('a'); a.href='javascript:void(0)'; a.className='player-link';
      a.textContent = l.player;
      a.addEventListener('click', (e)=>{ if(e.stopPropagation) e.stopPropagation(); goToPlayer(l.player, l.team); });
      frag.appendChild(a);
      frag.appendChild(document.createTextNode(l.label.slice(l.player.length)));
      return frag;
    }
  }
  frag.appendChild(document.createTextNode(l.label));
  return frag;
}

function buildParlaySection(wrap, ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL, selectedBook){
  const qualPct = Math.round(QUAL*100);
  const candidates = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL, selectedBook);

  const secParlay = document.createElement('div'); secParlay.className='section-title';
  secParlay.textContent = `Auto-Generated Parlays \u2014 ${qualPct}%+ Cutoff (both Last 10 AND Last 15 games)`;
  wrap.appendChild(secParlay);
  appendDefIcon(secParlay, `These are built purely from historical hit-rate frequency, independent of the window selector above (always checked against last-10 and last-15 specifically). The same bet can appear in more than one parlay below, and can also appear in both the 75% and 70% sections. Player props additionally require she actually played in at least 60% of the games in both windows (6-of-10, 9-of-15) so a small-sample fluke can\u2019t sneak in. Small samples still mean these aren\u2019t true probabilities \u2014 treat as a research shortlist, not a guarantee.`);

  if(candidates.length < 3){
    const msg = document.createElement('div'); msg.style.cssText='font-size:13px;color:var(--sub);margin-bottom:16px;';
    if(candidates.length === 0){
      msg.textContent = `No individual bets on this game currently clear ${qualPct}% in both the last-10 and last-15 windows (after requiring players to have actually played at least 60% of the games in each window).`;
    } else {
      msg.textContent = `Only ${candidates.length} bet(s) currently clear the bar \u2014 not enough for a 3-leg parlay yet: ` +
        candidates.map(c=>`${c.label} (${Math.round(c.rate10*100)}%/${Math.round(c.rate15*100)}%)`).join(', ');
    }
    wrap.appendChild(msg);
  } else {
    // Legs CAN repeat across parlays. To still give three genuinely different combinations rather than
    // three copies of the same top-N list, each parlay draws from a different confidence tier of the
    // qualifying pool (top / middle / lower-but-still-qualifying), sized at 3-4 legs each.
    const n = candidates.length;
    const size = Math.min(4, n);
    let starts;
    if(n <= 4){
      starts = [0]; // pool too small for distinct tiers — just show the one parlay
    } else {
      starts = [0, Math.floor(n/3), Math.floor(2*n/3)].map(s=>Math.min(s, n-size));
      starts = [...new Set(starts)]; // de-duplicate identical starting points (can happen with small pools)
    }
    const groups = starts.map(s => candidates.slice(s, s+size));

    if(groups.length < 3){
      const shortNote = document.createElement('div'); shortNote.style.cssText='font-size:12.5px;color:var(--sub);margin-bottom:8px;';
      shortNote.textContent = n <= 4
        ? `Only ${n} qualifying legs right now \u2014 showing them as a single parlay rather than manufacturing duplicate 3-leg versions.`
        : `Only enough distinct qualifying legs for ${groups.length} differentiated parlay(s) right now.`;
      wrap.appendChild(shortNote);
    }

    const TIER_LABEL = ['Highest Confidence', 'Balanced', 'Deeper Value'];
    const parlayGrid = document.createElement('div'); parlayGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:8px;';
    groups.forEach((legs, idx)=>{
      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid var(--line);border-radius:6px;padding:12px;background:#fafbfd;';
      const decOdds = legs.reduce((acc,l)=> acc * (americanToDecimal(l.price)||1), 1);
      const americanParlay = decimalToAmerican(decOdds);
      const cardTitle = document.createElement('div');
      cardTitle.style.cssText = 'font-weight:800;font-size:13px;margin-bottom:2px;color:var(--navy2);';
      const tierName = groups.length>1 ? (TIER_LABEL[idx]||`Parlay ${idx+1}`) : 'All Qualifying Legs';
      cardTitle.textContent = `${tierName} \u2014 ${legs.length} legs`;
      card.appendChild(cardTitle);
      const oddsLine = document.createElement('div');
      oddsLine.style.cssText = 'font-size:11.5px;color:var(--sub);margin-bottom:8px;';
      oddsLine.innerHTML = `Est. combined odds (independent math): <b style="color:var(--ink)">${fmtAmerican(americanParlay)}</b> \u2014 <i>not DraftKings' real same-game price; tap the \u24d8 below for details</i>`;
      card.appendChild(oddsLine);
      const ul = document.createElement('ul'); ul.style.cssText='margin:0;padding-left:18px;font-size:12.5px;';
      legs.forEach(l=>{
        const li = document.createElement('li'); li.style.marginBottom='4px';
        li.appendChild(buildLegLabelNode(l));
        const meta = document.createElement('span'); meta.style.color='var(--sub)';
        meta.textContent = ` (${fmtAmerican(l.price)} \u2014 L10: ${Math.round(l.rate10*100)}%, L15: ${Math.round(l.rate15*100)}%)`;
        li.appendChild(meta);
        ul.appendChild(li);
      });
      card.appendChild(ul);
      parlayGrid.appendChild(card);
    });
    wrap.appendChild(parlayGrid);
    const oddsCaveatWrap = document.createElement('div'); oddsCaveatWrap.style.cssText = 'margin-bottom:16px;';
    const oddsCaveatIcon = document.createElement('span'); oddsCaveatIcon.textContent = 'About the combined odds shown above'; oddsCaveatIcon.style.cssText = 'font-size:12px;color:var(--navy2);cursor:pointer;opacity:.85;';
    oddsCaveatWrap.appendChild(oddsCaveatIcon);
    wrap.appendChild(oddsCaveatWrap);
    appendDefIcon(oddsCaveatWrap, '<b>On the combined odds above:</b> these legs are all from the same game, so they\u2019re correlated with each other (e.g. one player scoring big and an opposing player scoring low often move together). The odds shown are a naive independent-multiplication estimate \u2014 mathematically valid only for uncorrelated legs \u2014 and will <b>not</b> match DraftKings\u2019 actual same-game-parlay price, which uses a correlation-aware model this app doesn\u2019t have access to (The Odds API doesn\u2019t expose SGP pricing). Always check the real combined price in the DraftKings app before betting \u2014 don\u2019t rely on the number above.');
  }
}

</script>
