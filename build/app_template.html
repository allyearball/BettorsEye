<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bettor&#39;s Eye</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bettor&#39;s Eye">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root{
    --navy:#0d7a3e; --navy2:#0d7a3e; --bg:#f4f5f7; --panel:#ffffff; --line:#dfe3ea; --ink:#000000; --sub:#5b6472;
    --green:#0d7a3e; --greenbg:#e6f6ec; --red:#b3261e; --redbg:#fdecea;
    --gold:#8a6d00; --goldbg:#fff3c4;
    --sans: 'Inter','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;}
  header{background:#000000;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  header h1{font-size:18px;margin:0;font-weight:800;text-transform:lowercase;}
  header h1 .brand-bettors{color:#ffffff;}
  header h1 .brand-eye{color:var(--green);}
  header .tag{font-size:12px;color:#b9c4d9;}
  .toplinks{display:flex;gap:6px;margin-left:auto;}
  .toplinks button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:var(--sans);}
  .toplinks button.active{background:#fff;color:var(--navy2);font-weight:700;}
  .layout{display:flex;min-height:calc(100vh - 58px);}
  nav{width:230px;flex:0 0 230px;background:#fff;border-right:1px solid var(--line);padding:14px 0;overflow-y:auto;max-height:calc(100vh - 58px);position:sticky;top:0;}
  nav .group-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);font-weight:700;padding:12px 16px 6px;}
  nav button.navbtn{display:block;width:100%;text-align:left;background:none;border:none;padding:7px 16px;font-size:13px;color:var(--ink);cursor:pointer;border-left:3px solid transparent;font-family:var(--sans);}
  nav button.navbtn:hover{background:#f0f2f6;}
  nav button.navbtn.active{background:#eef2fb;border-left-color:var(--navy2);font-weight:700;color:var(--navy2);}
  nav button.navgroup-btn{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:#f7f8fa;border:none;border-bottom:1px solid var(--line);padding:12px 16px;font-size:13px;font-weight:800;color:var(--navy2);cursor:pointer;font-family:var(--sans);text-transform:uppercase;letter-spacing:.04em;}
  nav button.navgroup-btn:hover{background:#eef2fb;}
  nav button.navgroup-btn::after{content:'\25be';font-size:11px;}
  nav button.navgroup-btn.active::after{content:'\25b4';}
  nav .navgroup-content{padding:4px 0 8px;}
  main{flex:1;padding:22px 26px;min-width:0;}
  .pagehead h2{margin:0 0 4px;font-size:19px;}
  .pagehead .meta{color:var(--sub);font-size:13px;}
  .controls{display:flex;align-items:center;gap:14px;margin:12px 0;flex-wrap:wrap;}
  .controls label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;}
  .controls select, .controls input{font-family:var(--sans);font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink);}
  .section-title{font-size:13px;font-weight:800;margin:22px 0 8px;color:var(--navy2);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--line);padding-bottom:6px;}
  .table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;}
  /* Control rows living inside a table-wrap: hairline-separated from the table itself rather
     than floating on a bare margin, and pinned to the left edge with position:sticky so the
     hide-DNP checkbox and row count stay reachable on a wide table that's scrolled sideways
     (these tables routinely run 25+ columns). */
  .table-wrap > .controls{margin:0;padding:10px 12px;position:sticky;left:0;}
  .table-wrap > .controls-top{border-bottom:1px solid var(--line);}
  .table-wrap > .controls-bottom{border-top:1px solid var(--line);}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;}
  th,td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;font-size:12.5px;color:var(--ink);}
  th:first-child, td:first-child, th.left, td.left{text-align:left;}
  /* The header ROW needs the background too, not just the cells: a frozen header cell paints with
     background-color:inherit, and inheriting from a transparent <tr> would let the columns
     scrolling underneath show straight through it. */
  thead tr{background:#eef1f6;}
  thead th{position:sticky;top:0;background:#eef1f6;color:var(--navy2);font-size:11px;text-transform:uppercase;cursor:pointer;user-select:none;border-bottom:2px solid var(--line);}
  /* Persistent emphasis on the four columns most bets are written against (PTS/3PM/REB/AST,
     plus the P+R+A total). Deliberately declared BEFORE the .col-highlighted rules below and at
     matching specificity, so click-to-highlight a column still visibly wins on top of it. Green
     family rather than the selection blue, so the two never read as the same state. */
  thead th.key-stat{background:#dbeee4;color:#0b5c30;}
  td.key-stat{background:#f0f8f3;}
  tbody tr:nth-child(even) td.key-stat{background:#e8f3ed;}
  tbody tr:hover td.key-stat{background:#e0f0e7;}
  td.key-stat:not(.left){font-weight:700;}
  thead th.col-highlighted{background:#cfe0fc;}
  td.col-highlighted{background:#eaf1fd;}
  tbody tr:nth-child(even) td.col-highlighted{background:#e0ebfb;}
  tbody tr:hover td.col-highlighted{background:#d5e5fa;}
  thead th:hover{background:#e2e7f0;}
  thead th .arrow{font-size:9px;margin-left:3px;color:var(--sub);}
  /* Odd rows need an EXPLICIT background (not just the wrapper's) so the frozen identity
     columns below can use background-color:inherit and still be opaque -- a transparent sticky
     cell lets the scrolled-under columns show straight through it. */
  tbody tr{background:var(--panel);}
  tbody tr:nth-child(even){background:#fafbfd;}
  tbody tr:hover{background:#eef4ff;}

  /* ===== Frozen identity columns =====
     On a table too wide for the screen, the leading identity columns (Date + Opponent, or
     Player, etc.) stay pinned to the left edge while the stats scroll underneath, so a row of
     numbers never loses the name attached to it. Which columns get pinned, their left offsets,
     and whether the table overflows at all are all decided at runtime by
     applyStickyIdentityColumns() -- the CSS here only describes what a pinned cell looks like.
     background-color (not the `background` shorthand) so nothing else about the cell's
     background is clobbered. */
  td.sticky-col, th.sticky-col{position:sticky;z-index:2;background-color:inherit;}
  /* Above the pinned body cells, and above the already-sticky header, respectively. */
  thead th{z-index:3;}
  thead th.sticky-col{z-index:4;}
  /* Column highlighting has to keep winning over the inherited row background on pinned cells,
     which it otherwise wouldn't -- these mirror the three .col-highlighted rules above. */
  td.sticky-col.col-highlighted{background-color:#eaf1fd;}
  tbody tr:nth-child(even) td.sticky-col.col-highlighted{background-color:#e0ebfb;}
  tbody tr:hover td.sticky-col.col-highlighted{background-color:#d5e5fa;}
  /* The seam is only drawn once there's actually something scrolled underneath it, so a table
     sitting at scrollLeft 0 looks exactly as it did before. Drawn as an ::after gradient rather
     than a box-shadow: these tables are border-collapse:collapse, where shadows on cells paint
     unreliably. position:sticky already makes the cell a containing block, so the strip anchors
     to it and rides along as the table scrolls. */
  .table-wrap.is-scrolled-x td.sticky-col-last::after,
  .table-wrap.is-scrolled-x th.sticky-col-last::after{
    content:'';position:absolute;top:0;bottom:0;right:0;width:9px;transform:translateX(100%);
    background:linear-gradient(to right, rgba(16,24,40,.19), rgba(16,24,40,0));
    pointer-events:none;
  }
  tbody tr.starter td.left{font-weight:700;}
  tbody tr.starter td.left.no-starter-bold{font-weight:400;}
  td.col-highlighted:not(.left){font-weight:700;}
  .footnote{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.5;}
  .gamelist{display:flex;flex-direction:column;gap:6px;}
  .gamechip{text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);}
  /* Toggled by the "Show Opp Def Rank / Allowed columns" checkbox present on any table that has
     them \u2014 default state is hidden (checkbox unchecked shows them; see each table's wiring). */
  .hide-defcols .defcol{display:none;}
  .sim-def-game-row{display:flex;}
  .sim-def-collapsible{display:none;}
  .show-simdef-extra .sim-def-collapsible{display:flex;}
  .gamechip:hover{background:#eef4ff;}
  .gamechip .d{color:var(--sub);font-size:11px;}
  .result.green{color:var(--green);background:var(--greenbg);}
  .result.red{color:var(--red);background:var(--redbg);}
  .result.gold{color:var(--gold);background:var(--goldbg);font-weight:800;}
  .result.neutral{color:var(--sub);background:#f0f2f6;}
  .rmbtn{background:none;border:none;color:#b3261e;font-size:18px;cursor:pointer;}
  .addbtn{margin-top:6px;background:var(--navy2);color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:var(--sans);}
  .sparkline{font-size:11px;color:var(--sub);display:flex;gap:3px;}
  .spark-cell{width:20px;text-align:center;border-radius:3px;padding:1px 0;}
  .spark-hit{background:var(--greenbg);color:var(--green);}
  .spark-miss{background:#f4f5f7;color:var(--sub);}
  .banner{background:#fff8e6;border:1px solid #f0d98c;color:#7a5c00;border-radius:6px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.5;}
  a.player-link{color:#000000;font-weight:700;text-decoration:none;border-bottom:1px dashed #000000;cursor:pointer;}
  a.player-link:hover{color:var(--green);border-bottom-color:var(--green);}
  .player-header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .player-header h2{margin:0;}
  .player-bio{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-bottom:14px;}
  .player-bio b{color:var(--ink);}
  .backbtn{background:none;border:1px solid var(--line);color:var(--navy2);padding:6px 14px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:var(--sans);margin-bottom:14px;}
  .backbtn:hover{background:#eef2fb;}

  /* ============ Layout modes: Full (today's dense layout, unchanged) vs Compact ============
     Compact is the default for anyone who hasn't chosen yet. This is a persistent user
     preference (localStorage), not a screen-width breakpoint -- someone can pick Compact on a
     desktop or Full on a phone. Color scheme is untouched everywhere below; this only ever
     changes spacing, sizing, and what's visible by default vs behind a tap. */

  /* -- Compact: touch targets, spacing, typography -- genuinely phone-scale, not just "desktop
     but slightly bigger". Designed to be usable without any pinch-zooming at all. -- */
  body.compact-mode{font-size:18px;}
  body.compact-mode header{padding:14px 16px;gap:8px;}
  body.compact-mode header h1{font-size:20px;}
  body.compact-mode header .tag{font-size:13px;}
  body.compact-mode .layout{flex-direction:column;min-height:0;padding-bottom:88px;} /* room for the fixed bottom tab bar */
  body.compact-mode nav{position:static;width:100%;flex:0 0 auto;max-height:none;border-right:none;border-bottom:1px solid var(--line);padding:6px 0;}
  body.compact-mode nav .group-label{padding:12px 16px 6px;font-size:13px;}
  body.compact-mode nav button.navbtn{padding:16px;font-size:17px;min-height:56px;}
  body.compact-mode nav button.navgroup-btn{padding:18px 16px;font-size:17px;min-height:60px;}
  body.compact-mode main{padding:16px 14px;}
  body.compact-mode .pagehead h2{font-size:22px;}
  body.compact-mode .pagehead .meta{font-size:15px;}
  body.compact-mode .section-title{font-size:14.5px;margin:20px 0 10px;}
  body.compact-mode th,body.compact-mode td{padding:14px 12px;font-size:16px;}
  body.compact-mode thead th{font-size:12.5px;}
  body.compact-mode button{min-height:52px;font-size:17px;}
  body.compact-mode a.player-link{font-size:inherit;}
  body.compact-mode input[type=checkbox],body.compact-mode input[type=radio]{width:26px;height:26px;}
  body.compact-mode .addbtn{padding:15px 20px;font-size:17px;min-height:52px;width:100%;display:block;}
  body.compact-mode .backbtn{padding:14px 18px;font-size:16px;min-height:52px;}
  /* Small utility buttons (Refresh, Screenshot, etc) -- deliberately excluded from the
     full-width .addbtn treatment above. These are secondary/occasional actions, not primary
     calls to action, so they stay compact and inline even in Compact mode. */
  .util-btn{padding:7px 14px;font-size:13px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-family:var(--sans);font-weight:600;}
  body.compact-mode .util-btn{padding:10px 16px;font-size:14px;min-height:40px;width:auto;display:inline-block;}
  body.compact-mode .controls{gap:12px;}
  body.compact-mode .controls select,body.compact-mode .controls input{padding:13px 12px;font-size:17px;min-height:52px;}
  body.compact-mode label{font-size:16px;}
  body.compact-mode .footnote{font-size:13.5px;}

  /* -- Compact: hide secondary content by default, expandable per-page via .compact-expand-btn -- */
  body.compact-mode .compact-hide{display:none !important;}
  body.full-mode .compact-only{display:none !important;}
  .compact-expand-btn{display:none;}
  body.compact-mode .compact-expand-row .compact-expand-btn{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:48px;background:none;border:1px solid var(--line);border-radius:6px;font-size:18px;cursor:pointer;color:var(--navy2);}

  /* -- Layout mode toggle button itself, styled like the other header account controls -- */
  #layoutModeBtn{white-space:nowrap;}

  /* ============ Compact-mode top header: logo + single Menu button, everything else moves
     into the slide-down panel or the bottom tab bar. The old row of Home/Stats/Live Lines/etc
     text buttons and the old row of Settings/Mode/Login buttons both disappear entirely in
     Compact -- replaced by #compactMenuBtn (top) and #bottomTabBar (bottom). ============ */
  body.compact-mode .toplinks > button{display:none;} /* the 5 page-nav buttons (Home/Stats/Live Lines/Bet Tracker/App Tracker) -- replaced by the bottom tab bar */
  body.compact-mode #accountControls > *{display:none;} /* Mode/Settings/Login/Admin (buttons + the Mode dropdown wrapper div) -- replaced by the hamburger panel */
  body.compact-mode #accountControls{border-left:none;padding-left:0;margin-left:auto;}
  body.full-mode #compactMenuBtn, body.full-mode #compactMenuPanel, body.full-mode #bottomTabBar{display:none !important;}

  #compactMenuBtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.3);color:#fff;padding:12px 18px;border-radius:8px;font-size:22px;cursor:pointer;min-height:52px;min-width:60px;}
  #compactMenuPanel{display:none;position:fixed;top:0;right:0;bottom:0;width:82%;max-width:340px;background:#fff;z-index:2000;box-shadow:-4px 0 24px rgba(0,0,0,.3);overflow-y:auto;padding:18px;}
  #compactMenuPanel.open{display:block;}
  #compactMenuOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1999;}
  #compactMenuOverlay.open{display:block;}
  #compactMenuPanel .panel-close{width:100%;text-align:right;background:none;border:none;font-size:28px;color:var(--sub);cursor:pointer;padding:6px;margin-bottom:10px;}
  #compactMenuPanel button.panel-item{display:block;width:100%;text-align:left;background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:10px;min-height:56px;}
  #compactMenuPanel button.panel-item:active{background:#eef2fb;}

  /* ============ Bottom tab bar: primary navigation, fixed, always visible in Compact mode.
     The single most-used navigation pattern on a phone, and the reason for the layout padding
     added to .compact-mode .layout above (so the last bit of real content is never hidden
     behind this). ============ */
  #bottomTabBar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:flex;background:#000000;border-top:1px solid rgba(255,255,255,.15);padding:6px 2px calc(6px + env(safe-area-inset-bottom, 0px));}
  #bottomTabBar button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:#b9c4d9;padding:8px 2px;font-size:11px;font-family:var(--sans);cursor:pointer;min-height:56px;border-radius:8px;}
  #bottomTabBar button .tab-icon{font-size:22px;line-height:1;}
  #bottomTabBar button.active{color:#ffffff;background:rgba(255,255,255,.1);}
  /* Compact-mode-only "Show All Details" toggle for wide tables that use compact-hide -- reveals
     the hidden columns back to table-cell display (not just block, since these are td/th). */
  body.compact-mode .compact-show-all .compact-hide{display:table-cell !important;}
  /* While collapsed (the default -- only a handful of key columns visible), force the table to
     fit within the screen width instead of overflowing into horizontal scroll: table-layout:fixed
     makes every column's width fully determined by the header row rather than by its content, and
     tighter padding/font-size than the rest of Compact mode uses, since a 5-6 column data table at
     the same size used for e.g. Season Record boxes genuinely doesn't fit a phone screen. The
     moment "Show All Details" is checked, all of this reverts to the normal wider Compact-mode
     sizing with horizontal scroll, so every column is still fully readable, just not all at once. */
  body.compact-mode .table-wrap.has-compact-hide:not(.compact-show-all) table{table-layout:fixed;width:100%;}
  body.compact-mode .table-wrap.has-compact-hide:not(.compact-show-all) th,
  body.compact-mode .table-wrap.has-compact-hide:not(.compact-show-all) td{padding:9px 4px;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  body.compact-mode .table-wrap.has-compact-hide:not(.compact-show-all) th.left,
  body.compact-mode .table-wrap.has-compact-hide:not(.compact-show-all) td.left{width:32%;}
</style>
</head>
<body class="compact-mode">
<header>
  <h1 id="logoHome" style="cursor:pointer;"><span class="brand-bettors">bettors</span><span class="brand-eye">eye</span></h1>
  <div class="tag">Data through <span id="asOf"></span></div>
  <div class="toplinks" id="toplinks"></div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script>
// DATA is shipped gzip-compressed + base64-encoded to keep this file small enough to
// upload/host anywhere. Decompressed once at load time using the browser's native
// DecompressionStream API (supported in Safari 16.4+ / any iPhone from the last ~3 years).
let DATA = null;
const DATA_B64_GZ = "__APP_DATA_B64GZ__";

async function loadData(){
  const binary = atob(DATA_B64_GZ);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}
</script>
<script>
function cmp(a,b){
  const av=a===null||a===undefined, bv=b===null||b===undefined;
  if(av&&bv) return 0; if(av) return 1; if(bv) return -1;
  if(typeof a==='string'&&typeof b==='string') return a.localeCompare(b);
  if(a<b) return -1; if(a>b) return 1; return 0;
}
function fmtVal(v, col, row){
  if(col && col.record) return `${row.wins}-${row.losses}`;
  if(col && col.gb) return (v===null||v===undefined) ? '\u2014' : (v===0 ? '\u2014' : v.toFixed(1));
  if(v===null||v===undefined||v===''){ return '—'; }
  if(col.pct) return (v*100).toFixed(1)+'%';
  if(col.round2 && typeof v==='number') return v.toFixed(2);
  if(col.round1 && typeof v==='number') return v.toFixed(1); // per-game averages: nearest 0.1
  if(col.bool) return v?'Y':'N';
  // Everything else numeric and unflagged is treated as a season total (or a similarly whole
  // count like games played, jersey number, etc.): round to the nearest whole number and add
  // thousands separators once it's 1000+ (team season MINUTES totals routinely cross that).
  if(typeof v==='number' && !col.left){
    return Math.round(v).toLocaleString('en-US');
  }
  return v;
}
// ================= Tap-to-define system (for stat column headers) =================
// Hover tooltips (title="...") don't work at all on iPhone/touch devices \u2014 there's no
// hover state. This gives every advanced-stat column header a small \u24d8 icon that toggles
// a definition popover on tap (works identically with mouse click on desktop). One popover
// open at a time; tapping elsewhere on the page closes it.
let _activeDefIcon = null, _activeDefPopover = null;
function hideDefPopover(){
  if(_activeDefPopover){ _activeDefPopover.remove(); _activeDefPopover = null; }
  _activeDefIcon = null;
}
function showDefPopover(anchorEl, text){
  const pop = document.createElement('div');
  pop.style.cssText = 'position:fixed;z-index:9999;max-width:320px;background:var(--panel);color:var(--ink);font-size:12px;line-height:1.45;padding:10px 12px;border-radius:6px;border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.6);';
  pop.innerHTML = text;
  document.body.appendChild(pop);
  const rect = anchorEl.getBoundingClientRect();
  let left = rect.left;
  const maxLeft = window.innerWidth - 336;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  let top = rect.bottom + 6;
  // flip above the icon if there isn't room below (common near the bottom of a long table on
  // mobile, and now also relevant for longer tooltip text that wraps into a taller popover)
  const estimatedHeight = 300;
  if(top + estimatedHeight > window.innerHeight) top = Math.max(8, rect.top - estimatedHeight - 10);
  pop.style.left = left+'px'; pop.style.top = top+'px';
  _activeDefPopover = pop;
}
function toggleDefPopover(icon, text){
  if(_activeDefIcon === icon){ hideDefPopover(); return; }
  hideDefPopover();
  showDefPopover(icon, text);
  _activeDefIcon = icon;
}
document.addEventListener('click', (e)=>{
  if(_activeDefPopover && !_activeDefPopover.contains(e.target)) hideDefPopover();
}, true);
// Appends a tappable \u24d8 definition icon to a header element if defText is provided.
// stopPropagation keeps it from also triggering the column's sort-on-click handler.
function appendDefIcon(th, defText){
  if(!defText) return;
  const icon = document.createElement('span');
  icon.textContent = '\u24d8';
  icon.style.cssText = 'font-size:12px;color:var(--navy2);cursor:pointer;margin-left:4px;opacity:.75;';
  icon.addEventListener('click', (e)=>{ e.stopPropagation(); e.preventDefault(); toggleDefPopover(icon, defText); });
  th.appendChild(icon);
}

// ============ Header/body alignment sync ============
// Every table built through makeTable() gets its alignment from the global
// `th,td{text-align:right}` + `.left{text-align:left}` rules, so its headers and its data always
// agree. The hand-rolled tables elsewhere in this file don't: several set an inline
// `text-align:center` on their <td>s while their <th>s fall through to the global right-align,
// which leaves the header visually offset from the numbers sitting underneath it.
//
// Fixing that per-table would mean editing a dozen separate innerHTML strings and would just
// come back the next time someone hand-rolls a table. Instead this runs after each render and
// copies each column's BODY alignment onto its HEADER -- and only where the two actually differ,
// so columns that already agree are left completely untouched.
//
// Deliberately conservative: it skips any table whose header row and body rows don't have a
// 1:1 cell mapping (grouped/colspan headers), and skips any individual column whose own body
// cells disagree with each other, rather than guessing which one is "right".
let _alignSyncScheduled = false, _alignSyncRunning = false;

// Chromium reports the initial value as "start"/"end" rather than "left"/"right"; normalize so
// a header at "left" and a body at "start" aren't treated as a mismatch (they render identically).
function _normalizedAlign(el){
  const a = getComputedStyle(el).textAlign;
  if(a === 'start') return 'left';
  if(a === 'end') return 'right';
  return a;
}

// The header row of a table, wherever it actually lives. Normally that's the last row of
// <thead>, but innerHTML on a <table> quietly drops loose <tr>s into an auto-created <tbody> --
// leaving tHead null and the header row sitting in the body. Both passes below used to skip
// such a table completely, so its headers never got aligned to its data.
function _tableHeaderCells(table){
  if(table.tHead && table.tHead.rows.length){
    return [...table.tHead.rows[table.tHead.rows.length - 1].cells];
  }
  const first = table.tBodies[0] && table.tBodies[0].rows[0];
  if(first && first.cells.length && [...first.cells].every(c=>c.tagName === 'TH')){
    return [...first.cells];
  }
  return null;
}

function syncTableHeaderAlignment(root){
  (root || document).querySelectorAll('table').forEach(table=>{
    const ths = _tableHeaderCells(table);
    if(!ths) return;
    if(!ths.length || ths.some(th=>th.colSpan > 1)) return;
    // Body rows that map 1:1 onto the columns -- colspan'd footer/summary rows can't.
    const bodyRows = [];
    for(const tbody of table.tBodies){
      for(const tr of tbody.rows){
        const cells = [...tr.cells];
        if(!cells.length || cells[0] === ths[0]) continue; // that IS the header row, sitting in the tbody
        if(cells.length === ths.length && !cells.some(td=>td.colSpan > 1)) bodyRows.push(tr);
      }
    }
    if(!bodyRows.length) return;
    // First and last qualifying row: enough to catch a column whose cells disagree, without
    // reading computed style for every cell of a 30-row table.
    const sampleRows = bodyRows.length > 1 ? [bodyRows[0], bodyRows[bodyRows.length-1]] : [bodyRows[0]];
    ths.forEach((th, i)=>{
      const aligns = sampleRows.map(tr=>_normalizedAlign(tr.cells[i]));
      if(aligns.some(a=>a !== aligns[0])) return; // body disagrees with itself -- don't guess
      if(_normalizedAlign(th) !== aligns[0]) th.style.textAlign = aligns[0];
    });
  });
}

// ============ Frozen identity columns ============
// On a table wider than its container, pins the leading identity columns to the left edge so a
// row of numbers never scrolls away from the name attached to it. Which columns those are is
// read off the HEADER LABELS rather than any column config, so the hand-rolled tables in this
// file get the same treatment as everything built through makeTable, with no per-table wiring.
//
// "Identity" is the thing the row IS (Date, Opponent, Player, Season, Team). "Connectors" are the
// narrow columns that can sit BETWEEN two identity columns -- on the Team Totals by Game table
// the order is Date, W/L, H/A, Opponent, so pinning Date and Opponent means pinning what's
// between them too. A run of connectors trailing off the end is trimmed back off, so a table
// that reads Player, #, Pos, Start, MIN... pins Player alone.
// Matched against the column's KEY where one is available (makeTable stamps data-col-key on
// every header, so wording changes like "Position Allowed To" can't break the match), falling
// back to the header text for the hand-rolled tables that have no column config.
const STICKY_IDENTITY_LABELS = new Set(['date','opponent','opp','player','season','team','game','position']);
const STICKY_CONNECTOR_LABELS = new Set(['w/l','h/a','wl','homeaway','start','starter','dnp','#','jersey','pos']);
// A leading control column (the tier detail table's checkbox) has a blank header and rides along
// with whatever identity columns follow it.
const STICKY_CONTROL_LABELS = new Set(['']);
// Identity columns that describe the GROUP a row belongs to rather than the row itself. On the
// league-wide player tables the leading run is Team, Player -- if the screen is too narrow to pin
// both, pinning Team alone would be worse than pinning nothing, because the column that actually
// names the row is the one that scrolled away. Date is deliberately NOT in here: on a game log,
// one row per date, the date alone identifies the row perfectly well on its own.
const STICKY_GROUP_LABELS = new Set(['team','season']);
// Two independent ceilings, both of which have to hold. The fraction stops the frozen block from
// swallowing a narrow screen; the absolute minimum guarantees there's still a usable amount of
// table left to scroll through on any screen.
const STICKY_MAX_WIDTH_FRACTION = 0.6;
const STICKY_MIN_SCROLLABLE_PX = 140;

function _stickyLabel(th){
  // A column key stamped by makeTable wins over the visible label; '' is a real value there and
  // means a control column, so it's checked for explicitly rather than treated as absent.
  const key = th.dataset ? th.dataset.colKey : undefined;
  if(key !== undefined) return String(key).toLowerCase();
  return th.textContent.replace(/[ⓘ▲▼]/g, '').trim().toLowerCase();
}

// classList.add()/toggle() re-serialize and re-set the class attribute even when the token set
// doesn't actually change, and a re-set attribute still queues a MutationRecord. Since this whole
// pass is *driven* by a MutationObserver, writing unconditionally means every pass schedules
// another one and the loop never settles. These only touch the DOM on a genuine change.
function _setClass(el, cls, on){
  if(el.classList.contains(cls) !== !!on) el.classList.toggle(cls, !!on);
}
function _setStyleProp(el, prop, value){
  if(el.style[prop] !== value) el.style[prop] = value;
}

function applyStickyIdentityColumns(root){
  (root || document).querySelectorAll('.table-wrap').forEach(wrap=>{
    const table = wrap.querySelector('table');
    if(!table) return;
    const ths = _tableHeaderCells(table);
    if(!ths) return;
    const headRow = ths[0].parentElement;
    const clear = ()=>{
      table.querySelectorAll('.sticky-col').forEach(c=>{
        _setClass(c, 'sticky-col', false); _setClass(c, 'sticky-col-last', false);
        _setStyleProp(c, 'left', '');
      });
      _setClass(wrap, 'is-scrolled-x', false);
    };
    // A hidden tab's wrap measures 0 wide; leave whatever it already has rather than tearing the
    // pinning off and having to rebuild it the moment the tab is shown.
    if(!wrap.clientWidth) return;
    // Only tables that genuinely don't fit. +1 absorbs sub-pixel rounding.
    if(table.scrollWidth <= wrap.clientWidth + 1 || ths.some(th=>th.colSpan > 1)){ clear(); return; }

    // Leading run of identity/connector/control columns...
    let end = 0;
    while(end < ths.length){
      const l = _stickyLabel(ths[end]);
      if(STICKY_IDENTITY_LABELS.has(l) || STICKY_CONNECTOR_LABELS.has(l) || (end === 0 && STICKY_CONTROL_LABELS.has(l))) end++;
      else break;
    }
    // ...trimmed back so it never ends on a connector, and never pins a column past the width cap.
    const trimTrailing = ()=>{
      while(end > 0 && !STICKY_IDENTITY_LABELS.has(_stickyLabel(ths[end-1]))) end--;
    };
    trimTrailing();
    const runEnd = end; // the full identity run, before any width-driven trimming
    const widthOf = n => ths.slice(0, n).reduce((a, th)=>a + th.offsetWidth, 0);
    const fits = n => widthOf(n) <= wrap.clientWidth * STICKY_MAX_WIDTH_FRACTION
                   && wrap.clientWidth - widthOf(n) >= STICKY_MIN_SCROLLABLE_PX;
    while(end > 1 && !fits(end)){ end--; trimTrailing(); }
    // A single column that still doesn't fit is left unpinned -- pinning it would leave no usable
    // scrolling area at all.
    if(end === 1 && !fits(1)) end = 0;
    // If the screen forced us to drop identity columns and what survived only names the GROUP
    // (Team/Season) rather than the row, pin nothing: a frozen "Indiana Fever" next to a Player
    // column that scrolled out of sight is worse than leaving the table alone.
    if(end > 0 && end < runEnd && STICKY_GROUP_LABELS.has(_stickyLabel(ths[end-1]))) end = 0;
    if(end === 0){ clear(); return; }

    const frozen = new Set();
    for(let i = 0; i < end; i++) frozen.add(i);
    let offset = 0;
    const offsets = ths.slice(0, end).map(th=>{ const o = offset; offset += th.offsetWidth; return o; });

    // Set, not array: when the header row lives in the tbody (see _tableHeaderCells) it would
    // otherwise appear twice and get its offsets written twice.
    [...new Set([headRow, ...[...table.tBodies].flatMap(tb=>[...tb.rows])])].forEach(tr=>{
      const cells = [...tr.cells];
      // Colspan'd footer rows don't map onto columns; their label cell is already at the left
      // edge, so skip them rather than mispositioning anything.
      if(cells.length !== ths.length || cells.some(c=>c.colSpan > 1)){
        cells.forEach(c=>{ if(c.classList.contains('sticky-col')){ _setClass(c,'sticky-col',false); _setClass(c,'sticky-col-last',false); _setStyleProp(c,'left',''); } });
        return;
      }
      cells.forEach((c, i)=>{
        if(frozen.has(i)){
          _setClass(c, 'sticky-col', true);
          _setClass(c, 'sticky-col-last', i === end - 1);
          _setStyleProp(c, 'left', offsets[i] + 'px');
        } else if(c.classList.contains('sticky-col')){
          _setClass(c, 'sticky-col', false); _setClass(c, 'sticky-col-last', false);
          _setStyleProp(c, 'left', '');
        }
      });
    });

    // One scroll listener per wrap, ever -- toggles the seam shadow so an unscrolled table looks
    // untouched.
    if(!wrap._stickyScrollBound){
      wrap._stickyScrollBound = true;
      wrap.addEventListener('scroll', ()=>{ _setClass(wrap, 'is-scrolled-x', wrap.scrollLeft > 0); }, {passive:true});
    }
    _setClass(wrap, 'is-scrolled-x', wrap.scrollLeft > 0);
  });
}

// Debounced to one pass per frame: a single page render appends many tables, and there's no
// value in re-walking the DOM for each one.
function scheduleHeaderAlignmentSync(){
  if(_alignSyncScheduled || _alignSyncRunning) return;
  _alignSyncScheduled = true;
  requestAnimationFrame(()=>{
    _alignSyncScheduled = false;
    _alignSyncRunning = true;   // our own style writes must not re-trigger the observer
    try {
      syncTableHeaderAlignment(document);
      applyStickyIdentityColumns(document);
    } finally { _alignSyncRunning = false; }
  });
}

function startHeaderAlignmentSync(){
  if(window._alignObserver) return;
  window._alignObserver = new MutationObserver(()=>scheduleHeaderAlignmentSync());
  // document.body rather than #main so modals and anything else appended outside the main
  // column are covered too. Attributes are watched as well as children because showing a tab
  // (a style change, not a DOM insertion) is what finally gives its tables a measurable width.
  window._alignObserver.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['style','class']});
  // Column widths -- and whether a table overflows at all -- change with the viewport.
  window.addEventListener('resize', ()=>scheduleHeaderAlignmentSync(), {passive:true});
  scheduleHeaderAlignmentSync();
}

// Formats a value in a TOTAL / MIN / MAX / AVERAGE / MEDIAN / MODE summary row. Those rows opt
// in with `oneDecimal:true` and render every number to the nearest tenth ("21.0"), so a column
// of summary figures lines up as one decimal place regardless of whether the underlying stat is
// a whole count (points), a two-decimal advanced metric (USG%), or a per-game average.
// Percentages keep their % form -- they're already shown to one decimal. Footer rows WITHOUT the
// flag (a box score's TEAM TOTAL, the Season tab's Career line) are untouched and keep using
// their column's own formatting, since "1,234.0 minutes" reads worse there, not better.
function fmtFooterVal(v, col, fr){
  if(!fr || !fr.oneDecimal) return fmtVal(v, col);
  if(v===null || v===undefined || v==='') return '—';
  if(col.pct) return (v*100).toFixed(1)+'%';
  if(col.bool) return v ? 'Y' : 'N';
  if(typeof v === 'number' && !Number.isNaN(v)) return v.toFixed(1);
  return fmtVal(v, col);
}

function makeTable(container, columns, rows, opts){
  opts = opts||{};
  const state = {sortKey: opts.defaultSort||(columns[0]&&columns[0].key), sortDir: opts.defaultDir||'desc', highlightKey: null};
  const wrap = document.createElement('div'); wrap.className='table-wrap';
  // Two separate control rows rather than one. "Show All Details" stays ABOVE the table --
  // it changes the table's shape (how many columns are visible), so it has to be reachable
  // before you start reading. The hide-DNP filter and the row count sit BELOW the table:
  // the count is a summary of what you just scrolled through, and putting the filter next to
  // it keeps the table header itself as the first thing under each section title.
  const topControls = document.createElement('div'); topControls.className='controls controls-top';
  const bottomControls = document.createElement('div'); bottomControls.className='controls controls-bottom';
  const hasPlayedConcept = !opts.noHideDNP && rows.length>0 && ('min' in rows[0] || 'gp' in rows[0]);
  let cb = null;
  if(hasPlayedConcept){
    const label = document.createElement('label');
    cb = document.createElement('input'); cb.type='checkbox';
    if(opts.defaultHideDNP) cb.checked = true;
    label.appendChild(cb); label.appendChild(document.createTextNode(opts.hideLabel || 'Hide players who didn\u2019t play (0 minutes)'));
    bottomControls.appendChild(label);
  }
  const countSpan = document.createElement('span'); countSpan.style.cssText='font-size:12px;color:#5b6472';
  bottomControls.appendChild(countSpan);
  // Generic Compact-mode "Show All Details" reveal, only added when this table actually has
  // compactHide columns to reveal -- same escape hatch pattern as the Standard Top 30 table,
  // now available to every table built through makeTable without needing per-table wiring.
  if(columns.some(c=>c.compactHide)){
    if(opts.showAllColumns){
      // Permanently expanded: every compactHide column is visible from the start and there's no
      // toggle at all. Deliberately does NOT add has-compact-hide -- that class exists only to
      // opt a table into the collapsed table-layout:fixed squeeze, which a table that never
      // collapses has no use for. Same pattern as the Top Bets table, which has always shipped
      // this way. (Horizontal scroll carries the extra width, as it does whenever the toggle
      // is switched on manually.)
      wrap.classList.add('compact-show-all');
    } else {
      wrap.classList.add('has-compact-hide'); // marks this table as one that legitimately has a collapsed/expanded state -- the table-layout:fixed squeeze in the CSS only applies when this class is present, so tables with no compactHide columns at all (e.g. the Admin Users table) are never forced into it and just use their natural width/scroll
      const compactLabel = document.createElement('label'); compactLabel.className='compact-only';
      const compactCb = document.createElement('input'); compactCb.type='checkbox';
      compactCb.addEventListener('change', ()=>{ wrap.classList.toggle('compact-show-all', compactCb.checked); });
      compactLabel.appendChild(compactCb); compactLabel.appendChild(document.createTextNode('Show All Details'));
      topControls.appendChild(compactLabel);
    }
  }
  const table = document.createElement('table');
  const thead = document.createElement('thead'); const trh = document.createElement('tr');
  columns.forEach(col=>{
    const th = document.createElement('th'); th.textContent = col.label;
    th.dataset.colKey = col.key || ''; // read by the frozen-column logic, which prefers a real key over the visible label
    if(col.left) th.classList.add('left');
    if(col.compactHide) th.classList.add('compact-hide');
    if(col.keyStat) th.classList.add('key-stat');
    appendDefIcon(th, col.def || STAT_DEFINITIONS[col.key]);
    const arrow = document.createElement('span'); arrow.className='arrow'; th.appendChild(arrow);
    th.addEventListener('click', ()=>{
      if(state.sortKey===col.key){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; }
      else { state.sortKey=col.key; state.sortDir = col.numeric===false?'asc':'desc'; }
      render();
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  const tbody = document.createElement('tbody');
  table.appendChild(thead); table.appendChild(tbody);
  if(topControls.children.length) wrap.appendChild(topControls);
  wrap.appendChild(table);
  wrap.appendChild(bottomControls);
  container.appendChild(wrap);
  // Which season a given row's stat was recorded in, used to send team links to the right
  // season rather than always the latest. Rows that carry a date (game logs) answer this
  // themselves; season-level tables pass opts.seasonFor; everything else is undefined, which
  // teamLinkEl treats as "latest season", i.e. exactly the old behavior.
  function rowSeason(r){
    if(opts.seasonFor) return opts.seasonFor(r);
    if(typeof r.season === 'string' || typeof r.season === 'number') return String(r.season);
    if(typeof r.date === 'string' && /^\d{4}-/.test(r.date)) return r.date.slice(0,4);
    return undefined;
  }
  // Resolves a row to a DATA.games key, for date-cell links. Prefers an explicit
  // opts.gameIdFor, then a gameId already sitting on the row, then a (team, date) lookup.
  function resolveGameId(r){
    if(opts.gameIdFor){ const gid = opts.gameIdFor(r); if(gid) return String(gid); }
    if(r.gameId) return String(r.gameId);
    if(typeof r.date === 'string' && opts.teamFor){
      const t = opts.teamFor(r);
      if(t) return findGameIdForTeamDate(t, r.date);
    }
    return null;
  }
  function didNotPlay(r){
    if('gp' in r) return !r.gp || r.gp===0;
    if('min' in r) return r.dnp===true || r.min===null || r.min===undefined || r.min===0;
    return false;
  }
  function applyHighlightClasses(){
    const ths = trh.querySelectorAll('th');
    columns.forEach((col, i)=>{
      ths[i].classList.toggle('col-highlighted', state.highlightKey===col.key);
    });
    tbody.querySelectorAll('tr').forEach(tr=>{
      const tds = tr.querySelectorAll('td');
      columns.forEach((col, i)=>{
        if(tds[i]) tds[i].classList.toggle('col-highlighted', state.highlightKey===col.key);
      });
    });
  }
  function render(){
    let data = rows.slice();
    if(cb && cb.checked) data = data.filter(r=>!didNotPlay(r));
    // Team columns sort by the name actually shown (the full city + nickname), not by the
    // short code stored on the row -- otherwise "Las Vegas Aces" would sort under A and
    // "Atlanta Dream" under D, and an alphabetical sort would read as no sort at all.
    const sortedCol = columns.find(c=>c.key===state.sortKey);
    // col.sortBy names a companion field to sort on instead of the displayed one -- e.g. the
    // W-L record columns display "10-5" but sort on win percentage, since "10-5" would otherwise
    // land below "9-6" alphabetically.
    const sortVal = r => {
      if(sortedCol && sortedCol.sortBy) return r[sortedCol.sortBy];
      return (sortedCol && sortedCol.teamLink && r[state.sortKey])
        ? (FULL_TEAM_NAME[r[state.sortKey]] || r[state.sortKey])
        : r[state.sortKey];
    };
    data.sort((a,b)=>{ const d=cmp(sortVal(a),sortVal(b)); return state.sortDir==='asc'?d:-d; });
    tbody.innerHTML='';
    data.forEach(r=>{
      const tr = document.createElement('tr');
      if(r.starter) tr.classList.add('starter');
      columns.forEach(col=>{
        const td = document.createElement('td'); if(col.left) td.classList.add('left');
        if(col.compactHide) td.classList.add('compact-hide');
        if(col.keyStat) td.classList.add('key-stat');
        if(col.noBoldStarter) td.classList.add('no-starter-bold');
        td.style.cursor = 'pointer';
        td.addEventListener('click', ()=>{
          state.highlightKey = state.highlightKey===col.key ? null : col.key;
          applyHighlightClasses();
        });
        if(col.key==='player' && opts.teamFor){
          const team = opts.teamFor(r);
          const link = document.createElement('a');
          link.href = 'javascript:void(0)';
          link.className = 'player-link';
          link.textContent = fmtVal(r[col.key], col, r);
          link.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(r.player, team); });
          td.appendChild(link);
        } else if(col.gameLink && r[col.key] && resolveGameId(r)){
          // Date cell that navigates to that game's own full box score page. The game id is
          // resolved through opts.gameIdFor (or, failing that, opts.teamFor + the row's date),
          // so a table whose rows can't be tied back to a specific game just renders the date
          // as plain text instead of a dead link -- hence the resolveGameId(r) guard above
          // being part of the branch condition rather than checked inside it.
          const gid = resolveGameId(r);
          const link = document.createElement('a');
          link.href = 'javascript:void(0)';
          link.className = 'player-link';
          link.textContent = fmtVal(r[col.key], col, r);
          link.addEventListener('click', (e)=>{ e.stopPropagation(); goToGameBox(gid, lastRender); });
          td.appendChild(link);
        } else if(col.teamLink && r[col.key]){
          // Renders as a clickable team link without touching the underlying string value, so
          // teamFor callbacks elsewhere (e.g. the Player column's goToPlayer lookup, keyed by
          // short code) keep working unchanged. Only the DISPLAY text is upgraded to the full
          // city+nickname name -- and the sort comparator above maps through FULL_TEAM_NAME to
          // match, so the order agrees with what's on screen. teamLinkEl already stops click
          // propagation internally, so this correctly doesn't also trigger the column-highlight
          // click handler on td.
          td.appendChild(teamLinkEl(r[col.key], FULL_TEAM_NAME[r[col.key]] || fmtVal(r[col.key], col, r), rowSeason(r)));
        } else {
          td.textContent = fmtVal(r[col.key], col, r);
        }
        // col.tone(row) -> a CSS colour-var name ('green'/'red') or null. Text colour only, not a
        // background: these cells can be frozen, and a sticky cell paints over the row tint it
        // would otherwise inherit.
        if(col.tone){
          const tone = col.tone(r);
          if(tone){ td.style.color = 'var(--' + tone + ')'; td.style.fontWeight = '700'; }
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    countSpan.textContent = data.length+' / '+rows.length+' rows shown';
    if(opts.footerRows && opts.footerRows.length){
      opts.footerRows.forEach(fr=>{
        const tr = document.createElement('tr');
        tr.style.background = '#eef2fb'; tr.style.fontWeight = '700';
        columns.forEach((col, i)=>{
          const td = document.createElement('td'); if(col.left) td.classList.add('left');
          if(col.compactHide) td.classList.add('compact-hide');
          if(col.keyStat) td.classList.add('key-stat');
          if(i===0){ td.textContent = fr.label; }
          else if(fr.values && Object.prototype.hasOwnProperty.call(fr.values, col.key)){
            td.textContent = fmtFooterVal(fr.values[col.key], col, fr);
          } else { td.textContent=''; }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
    [...trh.children].forEach((th,i)=>{
      const arrow = th.querySelector('.arrow');
      arrow.textContent = columns[i].key===state.sortKey ? (state.sortDir==='asc'?'\u25B2':'\u25BC') : '';
    });
    applyHighlightClasses();
  }
  if(cb) cb.addEventListener('change', render);
  render();
}

/* ================= Combination prop stats =================
   A combo stat key is the sum of other stat keys. Everything downstream is driven off these two
   constants -- statValue(), the hit rates, the Defense-vs-Position tables, the EMA tiebreak, the
   summary footer maths and every column list -- so adding a new combination here is nearly all it
   takes to make it work across the whole app.
   Order matters: PROP_STAT_KEYS is the display order every "for each prop stat" loop follows. */
const COMBO_STAT_PARTS = {
  pra: ['pts', 'reb', 'ast'],
  pr:  ['pts', 'reb'],
  pa:  ['pts', 'ast'],
  ra:  ['reb', 'ast'],
};
const PROP_STAT_KEYS = ['pts', 'reb', 'ast', 'tpm', 'pra', 'pr', 'pa', 'ra'];
// [key, shortLabel] for every prop stat, in display order. Anything that used to hardcode
// [['pts','PTS'],...,['pra','PRA']] reads this instead -- that literal existed in four places
// and each one silently omitted the new combos when they were added.
function propStatPairs(){ return PROP_STAT_KEYS.map(k=>[k, STAT_SHORT_LABEL[k]]); }
function propStatPairsLong(){ return PROP_STAT_KEYS.map(k=>[k, STAT_KEY_LABEL[k]]); }
// Sums a combo from a row of raw counting stats. Null if ANY component is missing, so a partial
// row never reads as a genuine low total.
function comboFrom(src, statKey){
  const parts = COMBO_STAT_PARTS[statKey];
  if(!parts) return undefined;
  let total = 0;
  for(const p of parts){
    const v = src ? src[p] : null;
    if(v === null || v === undefined) return null;
    total += v;
  }
  return total;
}

// Builds the Year + Month dropdown pair used on Team Explorer and Player pages.
// onChange(year, month) fires whenever either selection changes; month always resets
// to 'full' (Full Season) when the year changes, since prior months may not apply.
function buildYearMonthSelector(yearsList, monthsForYearFn, currentYear, currentMonth, onChange){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:10px;align-items:center;';
  const selStyle = 'padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);background:var(--panel);';

  const yearSel = document.createElement('select'); yearSel.style.cssText = selStyle;
  yearsList.forEach(y=>{ const op=document.createElement('option'); op.value=y; op.textContent=y; yearSel.appendChild(op); });
  yearSel.value = currentYear;

  const monthSel = document.createElement('select'); monthSel.style.cssText = selStyle;
  function rebuildMonths(year, preferredMonth){
    monthSel.innerHTML = '';
    const full = document.createElement('option'); full.value='full'; full.textContent='Full Season'; monthSel.appendChild(full);
    monthsForYearFn(year).forEach(m=>{
      const op = document.createElement('option'); op.value=m; op.textContent=MONTH_NAMES[m]||m; monthSel.appendChild(op);
    });
    monthSel.value = preferredMonth;
    if(monthSel.value !== preferredMonth) monthSel.value = 'full'; // preferred month doesn't exist in this year
  }
  rebuildMonths(currentYear, currentMonth);

  yearSel.addEventListener('change', ()=>{ rebuildMonths(yearSel.value, 'full'); onChange(yearSel.value, monthSel.value); });
  monthSel.addEventListener('change', ()=>{ onChange(yearSel.value, monthSel.value); });

  wrap.appendChild(yearSel); wrap.appendChild(monthSel);
  return wrap;
}

// Computes Player Totals / Averages / Opponent Totals entirely client-side for an arbitrary
// set of game IDs — this is what makes Year/Month (or any future custom range) possible
// without needing Python to have pre-baked every possible slice server-side.
function computeTeamSummaryClientSide(team, gameIds){
  const STAT_KEYS = ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'];
  const totalsMap = {};
  gameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return;
    g.rows.forEach(r=>{
      if(r.team !== team) return;
      if(!totalsMap[r.athleteId]){
        const row = {player:r.player, athleteId:r.athleteId, gp:0, gs:0};
        STAT_KEYS.forEach(k=>{ row[k]=0; });
        totalsMap[r.athleteId] = row;
      }
      const acc = totalsMap[r.athleteId];
      if(!r.dnp){ acc.gp++; if(r.starter) acc.gs++; }
      STAT_KEYS.forEach(k=>{ const v = r[k]; if(v!==null && v!==undefined) acc[k]+=v; });
    });
  });
  const totals = Object.values(totalsMap).map(t=>{
    const bio = bioLookup(t.player, team);
    return Object.assign({}, t, bio, {
      fgPct: t.fga ? Math.round((t.fgm/t.fga)*10000)/10000 : null,
      tpPct: t.tpa ? Math.round((t.tpm/t.tpa)*10000)/10000 : null,
      ftPct: t.fta ? Math.round((t.ftm/t.fta)*10000)/10000 : null,
    });
  });
  const averages = totals.map(t=>{
    const a = Object.assign({}, t);
    STAT_KEYS.forEach(k=>{ a[k] = t.gp ? Math.round((t[k]/t.gp)*100)/100 : null; });
    return a;
  });
  const opponents = gameIds.map(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return null;
    const isHome = g.home === team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    const oppName = isHome ? g.away : g.home;
    const oppRows = g.rows.filter(r=>r.team !== team);
    const sum = key => oppRows.reduce((a,r)=> a + (r[key]||0), 0);
    const oppFgm = sum('fgm'), oppFga = sum('fga'), oppTpm = sum('tpm'), oppTpa = sum('tpa'),
          oppFtm = sum('ftm'), oppFta = sum('fta');
    return {
      // gameId is carried on the row purely so the Date cell can link straight to this game's
      // own box score page without a second (team, date) scan over DATA.games per row.
      gameId: String(gid),
      date: g.date, homeAway: isHome ? 'vs' : '@', opponent: oppName, wl: teamPts>oppPts?'W':(teamPts<oppPts?'L':'\u2014'), teamPts, oppPts,
      oppFgm, oppFga, oppFgPct: oppFga ? Math.round((oppFgm/oppFga)*10000)/10000 : null,
      oppTpm, oppTpa, oppFtm, oppFta,
      oppOreb: sum('oreb'), oppDreb: sum('dreb'), oppReb: sum('reb'),
      oppAst: sum('ast'), oppStl: sum('stl'), oppBlk: sum('blk'), oppTo: sum('to'), oppPf: sum('pf'),
    };
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));

  // The team's own combined stat line per game \u2014 same shape/approach as `opponents` above,
  // just summed from this team's own box score rows instead of the other team's.
  const teamGames = gameIds.map(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return null;
    const isHome = g.home === team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    const oppName = isHome ? g.away : g.home;
    const ownRows = g.rows.filter(r=>r.team === team);
    const sum = key => ownRows.reduce((a,r)=> a + (r[key]||0), 0);
    const fgm = sum('fgm'), fga = sum('fga'), tpm = sum('tpm'), tpa = sum('tpa'), ftm = sum('ftm'), fta = sum('fta');
    return {
      gameId: String(gid), // see the note on `opponents` above
      date: g.date, homeAway: isHome ? 'vs' : '@', opponent: oppName, wl: teamPts>oppPts?'W':(teamPts<oppPts?'L':'\u2014'), teamPts, oppPts, min: sum('min'),
      fgm, fga, fgPct: fga ? Math.round((fgm/fga)*10000)/10000 : null,
      tpm, tpa, tpPct: tpa ? Math.round((tpm/tpa)*10000)/10000 : null,
      ftm, fta, ftPct: fta ? Math.round((ftm/fta)*10000)/10000 : null,
      oreb: sum('oreb'), dreb: sum('dreb'), reb: sum('reb'),
      ast: sum('ast'), stl: sum('stl'), blk: sum('blk'), to: sum('to'), pf: sum('pf'),
    };
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));

  return {totals, averages, opponents, teamGames};
}

function inchesToHeightStr(inches){
  if(inches===null || inches===undefined || isNaN(inches)) return null;
  const totalIn = Math.round(inches); // round to nearest whole inch FIRST, so a value like 71.6 correctly becomes 6'0" (with carry-over), not 5'11.6"
  const feet = Math.floor(totalIn/12);
  const rem = totalIn - feet*12;
  return `${feet}' ${rem}"`;
}

// Aggregates a team's already-computed per-player totals (from computeTeamSummaryClientSide)
// into one team-level row. Shooting percentages are always computed from the team's combined
// makes/attempts (never averaged from individual players' percentages) since that's the only
// mathematically correct way to roll them up. Height is a season-long weighted average by each
// player's total minutes played, so rotation players count more than end-of-bench players.
function computeLeagueTeamRow(team, gameIds, playerTotals, mode){
  const teamGames = gameIds.length;
  const sumKey = k => playerTotals.reduce((a,p)=> a + (p[k]||0), 0);
  const fgm=sumKey('fgm'), fga=sumKey('fga'), tpm=sumKey('tpm'), tpa=sumKey('tpa'), ftm=sumKey('ftm'), fta=sumKey('fta');

  // Win-loss record \u2014 computed from actual game results, independent of the totals/averages
  // toggle (a record doesn't change shape between those two views the way counting stats do).
  let wins=0, losses=0;
  gameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g || g.homeScore===null || g.awayScore===null) return;
    const isHome = g.home===team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    if(teamPts>oppPts) wins++; else if(teamPts<oppPts) losses++;
  });

  let heightSum=0, heightWeight=0;
  playerTotals.forEach(p=>{
    if(p.heightIn!==null && p.heightIn!==undefined && p.min){ heightSum += p.heightIn*p.min; heightWeight += p.min; }
  });
  const avgHeightIn = heightWeight ? heightSum/heightWeight : null;

  const row = {
    team, gp: teamGames, wins, losses, min: sumKey('min'), pts: sumKey('pts'),
    fgm, fga, fgPct: fga ? Math.round((fgm/fga)*10000)/10000 : null,
    tpm, tpa, tpPct: tpa ? Math.round((tpm/tpa)*10000)/10000 : null,
    ftm, fta, ftPct: fta ? Math.round((ftm/fta)*10000)/10000 : null,
    oreb: sumKey('oreb'), dreb: sumKey('dreb'), reb: sumKey('reb'),
    ast: sumKey('ast'), stl: sumKey('stl'), blk: sumKey('blk'), to: sumKey('to'), pf: sumKey('pf'),
    avgHeight: inchesToHeightStr(avgHeightIn) || '\u2014',
  };
  if(mode==='averages' && teamGames){
    ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'].forEach(k=>{
      row[k] = Math.round((row[k]/teamGames)*100)/100;
    });
  }
  return row;
}

// Same idea as computeLeagueTeamRow, but summed from each game's opponent output (already
// computed per-game by computeTeamSummaryClientSide's `opponents` array) instead of the
// team's own players \u2014 i.e. what a team's opponents did against them, season-long.
function computeLeagueDefenseRow(team, teamGames, opponents, mode){
  const sumKey = k => opponents.reduce((a,o)=> a + (o[k]||0), 0);
  const oppFgm=sumKey('oppFgm'), oppFga=sumKey('oppFga'), oppTpm=sumKey('oppTpm'), oppTpa=sumKey('oppTpa'), oppFtm=sumKey('oppFtm'), oppFta=sumKey('oppFta');

  const row = {
    team, gp: teamGames, oppPts: sumKey('oppPts'),
    oppFgm, oppFga, oppFgPct: oppFga ? Math.round((oppFgm/oppFga)*10000)/10000 : null,
    oppTpm, oppTpa, oppTpPct: oppTpa ? Math.round((oppTpm/oppTpa)*10000)/10000 : null,
    oppFtm, oppFta, oppFtPct: oppFta ? Math.round((oppFtm/oppFta)*10000)/10000 : null,
    oppOreb: sumKey('oppOreb'), oppDreb: sumKey('oppDreb'), oppReb: sumKey('oppReb'),
    oppAst: sumKey('oppAst'), oppStl: sumKey('oppStl'), oppBlk: sumKey('oppBlk'), oppTo: sumKey('oppTo'), oppPf: sumKey('oppPf'),
  };
  if(mode==='averages' && teamGames){
    ['oppPts','oppFgm','oppFga','oppTpm','oppTpa','oppFtm','oppFta','oppOreb','oppDreb','oppReb','oppAst','oppStl','oppBlk','oppTo','oppPf'].forEach(k=>{
      row[k] = Math.round((row[k]/teamGames)*100)/100;
    });
  }
  return row;
}


// League-wide landing page for Team Explorer \u2014 every team's season line, plus every
// individual player's season line, side by side. Currently only the season(s) already loaded
// client-side are selectable in the Season dropdown (that's whatever the pipeline has pulled in);
// a full 2015-2025 historical backfill is a separate, larger pipeline project.
// ================= Generic sticky-bottom button-row pattern =================
// Shared by the "period" selector (Last 5/Last 10/Last 15/Full Season) and any other same-style
// tab switcher (e.g. Standard/Advanced on the Home page) -- only one is ever meant to be active
// on a given page at a time, so they intentionally share one element id/cleanup function rather
// than needing separate ones.
function removeGameWindowStickyBar(){
  const existing = document.getElementById('gameWindowStickyBar');
  if(existing) existing.remove();
  document.body.style.paddingBottom = '';
  const layoutEl = document.querySelector('.layout');
  if(layoutEl) layoutEl.style.paddingBottom = ''; // let the CSS default (bottom-nav-only) padding apply again
}
function renderStickyBottomBar(options, currentValue, onSelect){
  const isCompact = getLayoutMode()==='compact';
  const bar = document.createElement('div');
  bar.id = 'gameWindowStickyBar';
  if(isCompact){
    // Same height formula as #bottomTabBar itself (padding:6px top + 56px min button height +
    // 6px bottom + safe-area-inset), so this sits flush above it on every device regardless of
    // notch/home-indicator size, without needing to measure the actual rendered bar via JS.
    bar.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px 8px 0 0;padding:8px 12px;position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom, 0px));z-index:850;box-shadow:0 -2px 10px rgba(0,0,0,.1);';
  } else {
    bar.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:16px;';
  }
  // Always one row of equal-width buttons, never wrapping regardless of screen size --
  // flex:1 on each with min-width:0 (so long labels can't force overflow) rather than the old
  // radio+label pairs, which could wrap awkwardly on narrow screens.
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;flex-direction:row;gap:4px;width:100%;';
  const buttons = [];
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    function paint(){
      const isActive = String(opt.value) === String(currentValue);
      btn.style.cssText = `flex:1 1 0;min-width:0;padding:10px 1px;border-radius:6px;border:1px solid ${isActive?'var(--navy2)':'var(--line)'};background:${isActive?'var(--navy2)':'var(--panel)'};color:${isActive?'#fff':'var(--ink)'};font-size:10.5px;font-weight:700;cursor:pointer;font-family:var(--sans);white-space:nowrap;`;
    }
    paint();
    btn.addEventListener('click', ()=>{
      currentValue = opt.value;
      buttons.forEach(b=>b.paint());
      onSelect(opt.value);
    });
    buttons.push({paint});
    btnRow.appendChild(btn);
  });
  bar.appendChild(btnRow);

  if(!isCompact) return bar;

  // Compact mode: the bar itself is fixed (out of normal flow), so a same-height spacer is
  // returned in its place -- this is what the caller actually appendChild()s, keeping their
  // layout code completely unchanged (still just one element to insert) while reserving the
  // right amount of vertical space where the bar would otherwise have pushed content down.
  // The real bar is appended straight to <body> instead, positioned fixed independent of
  // whatever scrollable container the caller's own content lives in. This function re-runs on
  // every period change/tab switch/etc, so any previously-appended bar is removed first --
  // otherwise these would silently stack up in the DOM rather than being replaced.
  removeGameWindowStickyBar();
  const spacer = document.createElement('div');
  spacer.style.cssText = `height:68px;`;
  document.body.appendChild(bar);
  // .layout's own CSS only reserves room for the bottom tab bar (88px) -- with this sticky bar
  // also fixed above it, that's not enough room and the last row of whatever page content is
  // showing ends up hidden underneath this bar. Extends that reservation for as long as this
  // bar is showing; removeGameWindowStickyBar() (called at the top of every page's render
  // function) puts it back to the CSS default the moment this bar goes away.
  const layoutEl = document.querySelector('.layout');
  if(layoutEl) layoutEl.style.paddingBottom = '156px';
  return spacer;
}
// ================= "Game window" period selector bar =================
// In Compact mode, fixed just above the bottom tab bar so it travels with you regardless of
// scroll position -- per request, so the period can be changed from anywhere within a page
// without scrolling back up. In Full mode (no bottom tab bar to sit above), stays a normal
// in-flow element at the top of the caller's content, same as before.
const GAME_WINDOW_OPTIONS = [ {label:'Last 5', value:5}, {label:'Last 10', value:10}, {label:'Last 15', value:15}, {label:'Full Season', value:'all'} ];
function renderGameWindowStickyBar(currentWindowMode, onSelect, labelText){
  // labelText intentionally unused now -- just the buttons, per request. Parameter still
  // accepted since every existing caller still passes it.
  return renderStickyBottomBar(GAME_WINDOW_OPTIONS, currentWindowMode, onSelect);
}

// Minutes-weighted average height across the league, over each player's last 5 games played.
// See computeTeamWeightedHeight()'s own comment for the exact formula and why the accounted-for
// minutes won't land exactly on 200 for every team.
// Shared top-of-page toggle between the two Stats pages -- replaces the old "League" nav
// sidebar group, now that Team pages are reached directly by clicking a team name in the
// League Stats tables instead of a separate "Teams" nav group.
function statsPageSwitcher(activeKey){
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:8px;margin-bottom:16px;';
  const defs = [ {key:'league', label:'League Stats', fn: ()=>renderLeagueStatsPage()}, {key:'height', label:'Team Height', fn: ()=>renderTeamHeightPage()} ];
  defs.forEach(d=>{
    const btn = document.createElement('button');

    const isActive = d.key===activeKey;
    btn.style.cssText = `padding:8px 16px;border-radius:6px;border:1px solid ${isActive?'var(--navy2)':'var(--line)'};background:${isActive?'var(--navy2)':'var(--panel)'};color:${isActive?'#fff':'var(--ink)'};font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);`;
    btn.addEventListener('click', d.fn);
    row.appendChild(btn);
  });
  return row;
}
// ============ Team height, broken out by position group ============
// Same minutes-weighted idea as computeTeamWeightedHeight (and the same last-5-games basis), but
// computed per position group and for every team at once, so a single team's group can be ranked
// against the other 14. The window is deliberately FIXED at last-5 rather than following the
// team page's own period selector: the whole point is a league ranking, and that's only
// meaningful if every team is measured over the same span.
const TEAM_HEIGHT_BUCKETS = ['G', 'F', 'C'];
let _teamHeightByPosCache = null;
function computeTeamHeightByPosition(){
  if(_teamHeightByPosCache) return _teamHeightByPosCache;
  const acc = {};
  TEAM_NAMES.forEach(t=>{ acc[t] = {}; TEAM_HEIGHT_BUCKETS.forEach(b=>{ acc[t][b] = {sumWeighted:0, sumMinutes:0, players:[]}; }); });

  Object.keys(DATA.fullPlayerLogs).forEach(key=>{
    const sep = key.lastIndexOf('|');
    const playerName = key.slice(0, sep), team = key.slice(sep+1);
    if(!acc[team]) return;
    const bucket = positionBucket(getPlayerPosition(playerName, team));
    if(!bucket || !acc[team][bucket]) return;
    // The TEAM's last 5 games, not the player's own last 5 appearances -- see the long note on
    // computeTeamWeightedHeight. This one matters twice over: it also drives the position-group
    // tier rankings behind the Matchup Group column and the Specials qualifier, so a traded
    // player left in her old team's group was quietly skewing those too.
    const window = teamHeightWindow(team);
    if(!window.size) return;
    const recentGames = DATA.fullPlayerLogs[key].log.filter(g=>!g.dnp && window.has(g.date));
    if(!recentGames.length) return;
    const avgMin = recentGames.reduce((a,g)=>a+(g.min||0),0) / window.size;
    if(avgMin <= 0) return;                                   // garbage-time-only, would dilute the average
    const bio = bioLookup(playerName, team);
    if(bio.heightIn===undefined || bio.heightIn===null) return; // no height on file -- skip rather than guess
    const d = acc[team][bucket];
    d.sumWeighted += avgMin * bio.heightIn;
    d.sumMinutes += avgMin;
    d.players.push({player: playerName, avgMin: Math.round(avgMin*10)/10, heightIn: bio.heightIn, height: bio.height});
  });

  // Rank + tier within each bucket separately -- a team can be the tallest guard group in the
  // league and the shortest front line.
  const byBucket = {};
  TEAM_HEIGHT_BUCKETS.forEach(b=>{
    const rows = TEAM_NAMES.map(t=>{
      const d = acc[t][b];
      if(d.sumMinutes <= 0) return null;
      return { team: t, bucket: b,
        heightIn: Math.round((d.sumWeighted/d.sumMinutes)*100)/100,
        minutes: Math.round(d.sumMinutes*10)/10,
        players: d.players.sort((x,y)=>y.avgMin-x.avgMin) };
    }).filter(Boolean);
    rows.sort((x,y)=>y.heightIn-x.heightIn); // rank 1 = tallest, matching the league Team Height page
    const of = rows.length;
    rows.forEach((r,i)=>{
      r.rank = i+1; r.of = of;
      // Terciles by rank, so the three labels always split the league into roughly equal thirds
      // no matter how many teams have data for this bucket.
      r.tier = r.rank <= of/3 ? 'Tallest' : (r.rank <= (2*of)/3 ? 'Middle' : 'Shortest');
    });
    byBucket[b] = rows;
  });
  _teamHeightByPosCache = byBucket;
  return byBucket;
}

const TEAM_HEIGHT_COLS = [
  {key:'position', label:'Position Group', left:true, numeric:false},

function buildTeamHeightSection(container, team){
  const title = document.createElement('div'); title.className='section-title'; title.textContent = '📏 Height';
  container.appendChild(title);
  appendDefIcon(title, `Each position group's minutes-weighted average height: every player's minutes per game across <b>this team's last five games</b> multiplied by her height, summed within the group and divided by the group's total minutes — "how tall is the average guard/forward/center this team actually has on the floor." <b>League Rank</b> is this team's place among all ${TEAM_NAMES.length} teams for that position group specifically (1 = tallest), and <b>Tier</b> splits the league into thirds — so a team can genuinely be a Tallest front line and a Shortest backcourt at the same time. Always the team's last 5 games, regardless of the Season/Game Window selected above: a league ranking only means something if every team is measured over the same span. Players with no height on file, and players who didn't appear in those five games (traded away, or out injured), are left out rather than guessed at.`);

  const byBucket = computeTeamHeightByPosition();
  const rows = [];
  TEAM_HEIGHT_BUCKETS.forEach(b=>{

    rows.push({
      position: POSITION_LABEL[b] || b,

    na.textContent = 'No height data on file for this team’s rotation yet.';
    container.appendChild(na);
    return;
  }
  makeTable(container, TEAM_HEIGHT_COLS, rows, {defaultSort:'heightIn', defaultDir:'desc', noHideDNP:true, showAllColumns:true});
}
