    const rangeLabel = document.createElement('div'); rangeLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; rangeLabel.textContent='Range:';
    rangeRow.appendChild(rangeLabel);

    const PRESETS = [
      ['7d','Last 7 Days'], ['30d','Last 30 Days'], ['month','This Month'], ['year','This Year'], ['all','All Time'],
    ];
    let activePreset = 'all';
    const presetBtns = [];
    PRESETS.forEach(([key,lbl])=>{
      const b = document.createElement('button'); b.textContent = lbl;
      function setActive(){
        const isActive = key===activePreset;
        b.style.cssText = `padding:5px 12px;border-radius:5px;border:1px solid ${isActive?'var(--navy2)':'var(--line)'};background:${isActive?'var(--navy2)':'#fff'};color:${isActive?'#fff':'var(--ink)'};font-size:12px;cursor:pointer;font-family:var(--sans);`;
      }
      b.addEventListener('click', ()=>{
        activePreset = key;
        const now = new Date();
        if(key==='7d'){ const d=new Date(now); d.setDate(d.getDate()-7); analysisRangeStart=d.toISOString().slice(0,10); analysisRangeEnd=null; }
        else if(key==='30d'){ const d=new Date(now); d.setDate(d.getDate()-30); analysisRangeStart=d.toISOString().slice(0,10); analysisRangeEnd=null; }
        else if(key==='month'){ analysisRangeStart = now.toISOString().slice(0,8)+'01'; analysisRangeEnd=null; }
        else if(key==='year'){ analysisRangeStart = now.toISOString().slice(0,4)+'-01-01'; analysisRangeEnd=null; }
        else { analysisRangeStart=null; analysisRangeEnd=null; }
        startInput.value = analysisRangeStart || '';
        endInput.value = analysisRangeEnd || '';
        presetBtns.forEach(pb=>pb.update());
        renderBreakdowns();
      });
      b.update = setActive;
      setActive();
      presetBtns.push(b);
      rangeRow.appendChild(b);
    });

    const startInput = document.createElement('input'); startInput.type='date';
    startInput.style.cssText='padding:5px;border:1px solid var(--line);border-radius:5px;font-size:12px;';
    const endInput = document.createElement('input'); endInput.type='date';
    endInput.style.cssText='padding:5px;border:1px solid var(--line);border-radius:5px;font-size:12px;';
    function customRangeChanged(){
      activePreset = null;
      presetBtns.forEach(pb=>pb.update());
      analysisRangeStart = startInput.value || null;
      analysisRangeEnd = endInput.value || null;
      renderBreakdowns();
    }
    startInput.addEventListener('change', customRangeChanged);
    endInput.addEventListener('change', customRangeChanged);
    rangeRow.appendChild(document.createTextNode('to'));
    rangeRow.appendChild(startInput);
    rangeRow.appendChild(document.createTextNode('\u2192'));
    rangeRow.appendChild(endInput);
    analysisDiv.appendChild(rangeRow);

    const breakdownsDiv = document.createElement('div');
    analysisDiv.appendChild(breakdownsDiv);

    function renderBreakdowns(){
      breakdownsDiv.innerHTML = '';
      const inRange = bets.filter(b=>{
        const d = b.gameDate;
        if(!d) return true;
        if(analysisRangeStart && d < analysisRangeStart) return false;
        if(analysisRangeEnd && d > analysisRangeEnd) return false;
        return true;
      });
      if(inRange.length===0){
        const na = document.createElement('div'); na.style.cssText='font-size:13px;color:var(--sub);'; na.textContent='No tracked bets in this date range.';
        breakdownsDiv.appendChild(na);
        return;
      }

      renderStatsTable(breakdownsDiv, 'Overall / Pregame vs Live / Straight vs Parlay', [
        {label:'Overall', stats: ticketStats(inRange)},
        {label:'Pregame', stats: ticketStats(inRange.filter(b=>b.timing!=='live'))},
        {label:'Live / In-Game', stats: ticketStats(inRange.filter(b=>b.timing==='live'))},
        {label:'Straight Bets', stats: ticketStats(inRange.filter(b=>!b.isParlay))},
        {label:'Parlays', stats: ticketStats(inRange.filter(b=>b.isParlay))},
      ], true);

      renderStatsTable(breakdownsDiv, 'Pregame vs Live, by Structure', [
        {label:'Pregame Straight', stats: ticketStats(inRange.filter(b=>!b.isParlay && b.timing!=='live'))},
        {label:'Live Straight', stats: ticketStats(inRange.filter(b=>!b.isParlay && b.timing==='live'))},
        {label:'Pregame Parlay', stats: ticketStats(inRange.filter(b=>b.isParlay && b.timing!=='live'))},
        {label:'Live Parlay', stats: ticketStats(inRange.filter(b=>b.isParlay && b.timing==='live'))},
      ], true);

      const legs = flattenLegs(inRange);
      const BET_TYPE_LABELS = {moneyline:'Moneyline', spread:'Spread', total:'Game Total', team_total:'Team Total', player_prop:'Player Prop', player_prop_alt:'Player Prop (Alt Line)'};
      renderStatsTable(breakdownsDiv, 'What You Tend To Do Well On \u2014 By Bet Type (leg-level)', 
        Object.entries(BET_TYPE_LABELS).map(([k,l])=>({label:l, stats: legStats(legs.filter(g=>g.betType===k))})), false);

      const STAT_LABELS = {pts:'Points', reb:'Rebounds', ast:'Assists', tpm:'Threes', pra:'Pts+Reb+Ast'};
      const propLegs = legs.filter(g=>g.betType==='player_prop'||g.betType==='player_prop_alt');
      renderStatsTable(breakdownsDiv, 'Player Props \u2014 By Stat Type (leg-level)',
        Object.entries(STAT_LABELS).map(([k,l])=>({label:l, stats: legStats(propLegs.filter(g=>g.statKey===k))})), false);
    }
    renderBreakdowns();
  }

  function renderTable(){
    tableDiv.innerHTML = '';
    if(bets.length===0){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-top:16px;';
      na.textContent = 'No tracked bets yet. Add one manually below, import from your odds history, or use the "+ Track" buttons on the Home/Odds pages going forward.';
      tableDiv.appendChild(na);
      return;
    }
    const sorted = bets.slice().sort((a,b)=> (b.gameDate||'').localeCompare(a.gameDate||''));
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table'); table.style.width='100%';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th class="left">Date</th><th class="left">Game</th><th class="left">Bet</th><th>Price</th><th>Stake</th><th>P/L</th><th>Result</th><th>Actions</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody'); table.appendChild(tbody);

    sorted.forEach(bet=>{
      const tr = document.createElement('tr');
      const stake = bet.stake || 10;
      let pl = 0;
      if(bet.result==='won') pl = americanPayoutProfit(bet.price, stake);
      else if(bet.result==='lost') pl = -stake;

      const cells = [
        bet.gameDate || '\u2014',
        bet.gameLabel || '\u2014',
        bet.label || '\u2014',
        fmtAmerican(bet.price),
        '$'+stake.toFixed(2),
        (bet.result==='won'||bet.result==='lost') ? (pl>=0?'+':'')+'$'+pl.toFixed(2) : '\u2014',
      ];
      cells.forEach((c,i)=>{
        const td = document.createElement('td');
        if(i<=2) td.classList.add('left');
        td.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;'+(i>2?'text-align:center;':'');
        td.textContent = c;
        tr.appendChild(td);
      });

      const tdResult = document.createElement('td'); tdResult.style.cssText='padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;';
      tdResult.appendChild(fmtResultBadge(bet.result));
      tr.appendChild(tdResult);

      const tdActions = document.createElement('td'); tdActions.style.cssText='padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;';
      const editBtn = document.createElement('button'); editBtn.textContent='Edit';
      editBtn.style.cssText='padding:3px 8px;margin-right:4px;border-radius:4px;border:1px solid var(--line);background:#fff;font-size:11px;cursor:pointer;font-family:var(--sans);';
      editBtn.addEventListener('click', ()=>openEditForm(bet));
      const delBtn = document.createElement('button'); delBtn.textContent='Delete';
      delBtn.style.cssText='padding:3px 8px;border-radius:4px;border:1px solid var(--red);background:#fff;color:var(--red);font-size:11px;cursor:pointer;font-family:var(--sans);';
      delBtn.addEventListener('click', async ()=>{
        if(!confirm('Delete this tracked bet?')) return;
        await trackerDelete(bet.id);
        await refresh();
      });
      tdActions.appendChild(editBtn); tdActions.appendChild(delBtn);
      tr.appendChild(tdActions);

      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    tableDiv.appendChild(wrap);
  }

  async function refresh(){
    statusDiv.textContent = 'Loading your tracked bets\u2026';
    try{
      bets = await trackerList();
      statusDiv.textContent = `${bets.length} tracked bet(s) loaded.`;
    }catch(e){
      statusDiv.textContent = `Couldn\u2019t load tracked bets: ${e.message}`;
      bets = [];
    }
    renderSummary();
    renderAnalysis();
    renderTable();
  }

  gradeBtn.addEventListener('click', async ()=>{
    gradeBtn.disabled = true; gradeBtn.textContent = 'Grading\u2026';
    let gradedCount = 0;
    for(const bet of bets){
      if(bet.result && bet.result!=='pending') continue;
      const result = gradeTrackedBet(bet);
      if(result){
        await trackerUpdate(bet.id, {result});
        gradedCount++;
      }
    }
    gradeBtn.disabled = false; gradeBtn.textContent = '\u2705 Auto-Grade Pending Bets';
    statusDiv.textContent = `Graded ${gradedCount} bet(s). Refreshing\u2026`;
    await refresh();
  });

  // ---- Manual Add Bet form ----
  function buildAddForm(existingBet){
    formDiv.innerHTML = '';
    formDiv.style.display = 'block';
    const card = document.createElement('div'); card.className='table-wrap'; card.style.padding='16px';
    const title = document.createElement('div'); title.className='section-title';
    title.textContent = existingBet ? 'Edit Tracked Bet' : 'Add a Bet Manually';
    card.appendChild(title);

    const allGames = Object.values(DATA.games).sort((a,b)=>b.date.localeCompare(a.date));
    let parlayLegs = (existingBet && existingBet.isParlay) ? existingBet.legs.slice() : [];

    const structRow = document.createElement('div'); structRow.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;';
    const structSel = document.createElement('select'); structSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;';
    [['straight','Straight Bet'],['parlay','Parlay']].forEach(([v,l])=>{ const op=document.createElement('option'); op.value=v; op.textContent=l; structSel.appendChild(op); });
    structSel.value = existingBet && existingBet.isParlay ? 'parlay' : 'straight';
    structRow.appendChild(labeled('Bet Structure', structSel));
    card.appendChild(structRow);

    const row1 = document.createElement('div'); row1.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;';
    const gameSel = document.createElement('select'); gameSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;min-width:260px;';
    allGames.forEach(g=>{ const op=document.createElement('option'); op.value=g.id; op.textContent=g.label; gameSel.appendChild(op); });
    row1.appendChild(labeled('Game', gameSel));

    const typeSel = document.createElement('select'); typeSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;';
    [['moneyline','Moneyline'],['spread','Spread'],['total','Game Total'],['team_total','Team Total'],['player_prop','Player Prop']].forEach(([v,l])=>{
      const op=document.createElement('option'); op.value=v; op.textContent=l; typeSel.appendChild(op);
    });
    row1.appendChild(labeled('Bet Type', typeSel));
    card.appendChild(row1);

    const row2 = document.createElement('div'); row2.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;';
    const teamSel = document.createElement('select'); teamSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;';
    const playerSel = document.createElement('select'); playerSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;min-width:180px;';
    const statSel = document.createElement('select'); statSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;';
    [['pts','Points'],['reb','Rebounds'],['ast','Assists'],['tpm','Threes'],['pra','Pts+Reb+Ast']].forEach(([v,l])=>{
      const op=document.createElement('option'); op.value=v; op.textContent=l; statSel.appendChild(op);
    });
    const teamWrap = labeled('Team', teamSel);
    const playerWrap = labeled('Player', playerSel);
    const statWrap = labeled('Stat', statSel);
    row2.appendChild(teamWrap); row2.appendChild(playerWrap); row2.appendChild(statWrap);
    card.appendChild(row2);

    const row3 = document.createElement('div'); row3.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;';
    const sideSel = document.createElement('select'); sideSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;';
    [['over','Over'],['under','Under']].forEach(([v,l])=>{ const op=document.createElement('option'); op.value=v; op.textContent=l; sideSel.appendChild(op); });
    const lineInput = document.createElement('input'); lineInput.type='number'; lineInput.step='0.5'; lineInput.placeholder='e.g. 17.5';
    lineInput.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;width:90px;';
    row3.appendChild(labeled('Side', sideSel));
    row3.appendChild(labeled('Line', lineInput));
    card.appendChild(row3);

    // Only shown in Parlay mode — builds up the legs list one at a time from the fields above.
    const addLegRow = document.createElement('div'); addLegRow.style.cssText='display:none;margin-bottom:10px;';
    const addLegBtn = document.createElement('button'); addLegBtn.textContent = '+ Add This Leg to Parlay';
    addLegBtn.style.cssText = 'padding:7px 14px;border-radius:6px;border:1px solid var(--navy2);background:#fff;color:var(--navy2);font-size:12.5px;cursor:pointer;font-family:var(--sans);';
    addLegRow.appendChild(addLegBtn);
    card.appendChild(addLegRow);

    const legsListDiv = document.createElement('div'); legsListDiv.style.cssText='display:none;margin-bottom:10px;';
    card.appendChild(legsListDiv);

    function renderLegsList(){
      legsListDiv.innerHTML = '';
      if(parlayLegs.length===0) return;
      const l = document.createElement('div'); l.style.cssText='font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;margin-bottom:4px;';
      l.textContent = `Legs in this parlay (${parlayLegs.length})`;
      legsListDiv.appendChild(l);
      parlayLegs.forEach((leg, idx)=>{
        const row = document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;border-bottom:1px solid var(--line);';
        const txt = document.createElement('span'); txt.style.flex='1'; txt.textContent = `${leg.label} (${leg.gameLabel})`;
        const rm = document.createElement('button'); rm.textContent='Remove';
        rm.style.cssText='padding:2px 8px;border-radius:4px;border:1px solid var(--red);background:#fff;color:var(--red);font-size:11px;cursor:pointer;font-family:var(--sans);';
        rm.addEventListener('click', ()=>{ parlayLegs.splice(idx,1); renderLegsList(); });
        row.appendChild(txt); row.appendChild(rm);
        legsListDiv.appendChild(row);
      });
    }

    const row4 = document.createElement('div'); row4.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;';
    const priceInput = document.createElement('input'); priceInput.type='number'; priceInput.placeholder='e.g. -115 or 120';
    priceInput.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;width:110px;';
    const priceLabel = labeled('Your Price', priceInput);
    const stakeInput = document.createElement('input'); stakeInput.type='number'; stakeInput.value='10'; stakeInput.step='1';
    stakeInput.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;width:80px;';
    const timingSel = document.createElement('select'); timingSel.style.cssText='padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;';
    [['pregame','Pregame'],['live','Live/In-Game']].forEach(([v,l])=>{ const op=document.createElement('option'); op.value=v; op.textContent=l; timingSel.appendChild(op); });
    row4.appendChild(priceLabel);
    row4.appendChild(labeled('Stake ($)', stakeInput));
    row4.appendChild(labeled('Timing', timingSel));
    card.appendChild(row4);

    const notesInput = document.createElement('textarea'); notesInput.placeholder='Notes (optional)';
    notesInput.style.cssText='width:100%;padding:6px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;margin-bottom:10px;min-height:50px;';
    card.appendChild(notesInput);

    function populateTeams(){
      const g = DATA.games[gameSel.value];
      teamSel.innerHTML='';
      [{v:g.away,l:g.away+' (Away)'},{v:g.home,l:g.home+' (Home)'}].forEach(t=>{
        const op=document.createElement('option'); op.value=t.v; op.textContent=t.l; teamSel.appendChild(op);
      });
      populatePlayers();
    }
    function populatePlayers(){
      const g = DATA.games[gameSel.value];
      const teamRows = g.rows.filter(r=>r.team===teamSel.value);
      playerSel.innerHTML='';
      teamRows.forEach(r=>{
        const op=document.createElement('option'); op.value=r.player; op.textContent=r.player+(r.dnp?' (DNP)':''); playerSel.appendChild(op);
      });
    }
    function updateVisibility(){
      const t = typeSel.value;
      teamWrap.style.display = (t==='moneyline'||t==='spread'||t==='total'||t==='team_total') ? 'flex' : 'none';
      playerWrap.style.display = (t==='player_prop') ? 'flex' : 'none';
      statWrap.style.display = (t==='player_prop') ? 'flex' : 'none';
      sideSel.parentElement.style.display = (t==='moneyline') ? 'none' : 'flex';
      lineInput.parentElement.style.display = (t==='moneyline') ? 'none' : 'flex';
    }
    function updateStructureVisibility(){
      const isParlay = structSel.value === 'parlay';
      addLegRow.style.display = isParlay ? 'block' : 'none';
      legsListDiv.style.display = isParlay ? 'block' : 'none';
      priceLabel.querySelector('label').textContent = isParlay ? 'Combined Price' : 'Your Price';
      renderLegsList();
    }
    gameSel.addEventListener('change', populateTeams);
    teamSel.addEventListener('change', populatePlayers);
    typeSel.addEventListener('change', updateVisibility);
    structSel.addEventListener('change', updateStructureVisibility);
    populateTeams();
    updateVisibility();
    updateStructureVisibility();

    function buildLegFromFields(){
      const g = DATA.games[gameSel.value];
      const team = teamSel.value;
      const opponent = team===g.home ? g.away : g.home;
      const line = lineInput.value!=='' ? parseFloat(lineInput.value) : undefined;
      const betType = typeSel.value;
      let label, thresholdToHit, statKey, player, side;
      if(betType==='moneyline'){
        label = `${team} Moneyline`; side='team';
      } else if(betType==='spread'){
        label = `${team} ${line>0?'+':''}${line}`; side='team';
      } else if(betType==='total'){
        side = sideSel.value; label = `Game Total ${side==='over'?'Over':'Under'} ${line}`;
      } else if(betType==='team_total'){
        side = sideSel.value; label = `${team} Team Total ${side==='over'?'Over':'Under'} ${line}`;
      } else {
        side = sideSel.value; player = playerSel.value; statKey = statSel.value;
        const marketLabel = {pts:'Points',reb:'Rebounds',ast:'Assists',tpm:'Threes',pra:'Pts+Reb+Ast'}[statKey];
        label = `${player} ${side==='over'?'Over':'Under'} ${line} ${marketLabel}`;
        thresholdToHit = Number.isInteger(line) ? line+1 : Math.ceil(line);
      }
      return { gameLabel: g.label, gameDate: g.date, betType, team, opponent, player, statKey, line, side, thresholdToHit, label };
    }

    addLegBtn.addEventListener('click', ()=>{
      parlayLegs.push(buildLegFromFields());
      renderLegsList();
    });

    if(existingBet){
      const gid = Object.keys(DATA.games).find(gid => {
        const refBet = existingBet.isParlay ? existingBet.legs[0] : existingBet;
        return DATA.games[gid] === findHistoricalGame(refBet.team, refBet.opponent, refBet.gameDate);
      });
      if(gid) gameSel.value = gid;
      const refForFields = existingBet.isParlay ? (existingBet.legs[0]||{}) : existingBet;
      typeSel.value = refForFields.betType || 'moneyline'; updateVisibility();
      populateTeams();
      if(refForFields.team) teamSel.value = refForFields.team;
      populatePlayers();
      if(refForFields.player) playerSel.value = refForFields.player;
      if(refForFields.statKey) statSel.value = refForFields.statKey;
      if(refForFields.side) sideSel.value = refForFields.side;
      if(refForFields.line!==undefined) lineInput.value = refForFields.line;
      if(existingBet.price!==undefined) priceInput.value = existingBet.price;
      if(existingBet.stake!==undefined) stakeInput.value = existingBet.stake;
      if(existingBet.notes) notesInput.value = existingBet.notes;
      if(existingBet.timing) timingSel.value = existingBet.timing;
    }

    const btnRow = document.createElement('div'); btnRow.style.cssText='display:flex;gap:10px;';
    const saveBtn = document.createElement('button'); saveBtn.className='addbtn';
    saveBtn.textContent = existingBet ? 'Save Changes' : 'Add Bet';
    const cancelBtn = document.createElement('button'); cancelBtn.textContent='Cancel';
    cancelBtn.style.cssText='padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;font-family:var(--sans);';
    cancelBtn.addEventListener('click', ()=>{ formDiv.style.display='none'; formDiv.innerHTML=''; });
    btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
    card.appendChild(btnRow);
    formDiv.appendChild(card);

    saveBtn.addEventListener('click', async ()=>{
      const price = parseFloat(priceInput.value);
      if(isNaN(price)){ alert('Enter the price (combined price for a parlay, or the single price for a straight bet).'); return; }
      const isParlay = structSel.value === 'parlay';

      let bet;
      if(isParlay){
        if(parlayLegs.length < 2){ alert('Add at least 2 legs to make this a parlay (or switch to Straight Bet).'); return; }
        bet = {
          isParlay: true, legs: parlayLegs,
          gameLabel: `${parlayLegs.length}-Leg Parlay`, gameDate: parlayLegs[0].gameDate,
          label: `${parlayLegs.length}-Leg Parlay: ` + parlayLegs.map(l=>l.label).join(' + '),
          price, stake: parseFloat(stakeInput.value)||10, notes: notesInput.value || '',
          result: existingBet ? existingBet.result : 'pending',
          timing: timingSel.value, trackedFrom: 'manual',
        };
      } else {
        const leg = buildLegFromFields();
        bet = Object.assign({}, leg, {
          isParlay: false,
          price, stake: parseFloat(stakeInput.value)||10, notes: notesInput.value || '',
          result: existingBet ? existingBet.result : 'pending',
          timing: timingSel.value, trackedFrom: 'manual',
        });
      }

      saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026';
      try{
        if(existingBet){ await trackerUpdate(existingBet.id, bet); }
        else { await trackerAdd(bet); }
        formDiv.style.display='none'; formDiv.innerHTML='';
        await refresh();
      }catch(e){
        alert('Failed to save: '+e.message);
        saveBtn.disabled = false; saveBtn.textContent = existingBet ? 'Save Changes' : 'Add Bet';
      }
    });
  }
  function labeled(labelText, el){
    const w = document.createElement('div'); w.style.cssText='display:flex;flex-direction:column;gap:2px;';
    const l = document.createElement('label'); l.textContent = labelText; l.style.cssText='font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;';
    w.appendChild(l); w.appendChild(el);
    return w;
  }
  function openEditForm(bet){ importDiv.style.display='none'; buildAddForm(bet); }
  addFormBtn.addEventListener('click', ()=>{ importDiv.style.display='none'; buildAddForm(null); });

  // ---- Import from Odds History ----
  importBtn.addEventListener('click', async ()=>{
    formDiv.style.display='none'; formDiv.innerHTML='';
    importDiv.style.display = 'block';
    importDiv.innerHTML = '<div class="footnote">Loading captured odds history from your Worker\u2026</div>';
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    let history;
    try{
      history = await fetchJson(`${workerBase}/history/export`);
    }catch(e){
      importDiv.innerHTML = `<div class="footnote">Couldn\u2019t load odds history: ${e.message}</div>`;
      return;
    }
    if(!Array.isArray(history) || history.length===0){
      importDiv.innerHTML = '<div class="footnote">No odds snapshots found yet. Snapshots are only saved automatically while the Odds/Home pages are actually being used and fetched pre-tip-off \u2014 if you weren\u2019t actively using the app during those games, there\u2019s nothing captured to import. Use "+ Add Bet Manually" instead.</div>';
      return;
    }
    // merge all snapshots per event, keeping the union of markets seen (latest wins per market key)
    const byEvent = {};
    history.forEach(snap=>{
      if(!byEvent[snap.eventId]) byEvent[snap.eventId] = { meta: snap, markets: {} };
      byEvent[snap.eventId].meta = snap;
      const dk = (snap.data.bookmakers||[]).find(b=>b.key==='draftkings');
      if(dk){ (dk.markets||[]).forEach(m=>{ byEvent[snap.eventId].markets[m.key] = m; }); }
    });

    importDiv.innerHTML = '';
    const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
    note.textContent = `Found ${Object.keys(byEvent).length} game(s) with captured lines. Check the ones you actually bet, adjust price/stake if needed, then add them.`;
    importDiv.appendChild(note);

    Object.values(byEvent).forEach(entry=>{
      const ev = entry.meta.data;
      const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
      const gameDate = (ev.commence_time||'').slice(0,10);
      const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
      const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
      const card = document.createElement('div'); card.className='table-wrap'; card.style.cssText='padding:12px;margin-bottom:12px;';
      const title = document.createElement('div'); title.style.cssText='font-weight:800;font-size:13.5px;margin-bottom:4px;'; title.textContent = `${gameLabel} \u2014 ${gameDate}`;
      card.appendChild(title);
      const timingRow = document.createElement('div'); timingRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--sub);';
      const timingLbl = document.createElement('span'); timingLbl.textContent = 'These were placed:';
      const timingSel = document.createElement('select'); timingSel.style.cssText='padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;';
      [['pregame','Pregame'],['live','Live/In-Game']].forEach(([v,l])=>{ const op=document.createElement('option'); op.value=v; op.textContent=l; timingSel.appendChild(op); });
      timingRow.appendChild(timingLbl); timingRow.appendChild(timingSel);
      card.appendChild(timingRow);

      const legs = gatherAllCapturedLegs(entry.markets, ev, homeShort, awayShort, gameLabel, gameDate);
      if(legs.length===0){
        const na = document.createElement('div'); na.style.cssText='font-size:12px;color:var(--sub);'; na.textContent='No usable market data captured for this game.';
        card.appendChild(na);
      } else {
        legs.forEach(leg=>{
          const row = document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;';
          const cb = document.createElement('input'); cb.type='checkbox';
          const lbl = document.createElement('span'); lbl.style.flex='1'; lbl.textContent = leg.label;
          const priceIn = document.createElement('input'); priceIn.type='number'; priceIn.value=leg.price;
          priceIn.style.cssText='width:80px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;';
          row.appendChild(cb); row.appendChild(lbl); row.appendChild(document.createTextNode('@')); row.appendChild(priceIn);
          card.appendChild(row);
          row._leg = leg; row._cb = cb; row._priceIn = priceIn;
        });
        const addBtn = document.createElement('button'); addBtn.className='addbtn'; addBtn.style.marginTop='8px';
        addBtn.textContent = 'Add Checked Bets';
        addBtn.addEventListener('click', async ()=>{
          addBtn.disabled = true; addBtn.textContent='Saving\u2026';
          const rows = [...card.querySelectorAll('div')].filter(r=>r._leg);
          let count = 0;
          for(const row of rows){
            if(!row._cb.checked) continue;
            const leg = Object.assign({}, row._leg, {price: parseFloat(row._priceIn.value), stake:10, result:'pending', trackedFrom:'history-import', timing:timingSel.value, isParlay:false});
            await trackerAdd(leg);
            count++;
          }
          addBtn.disabled = false; addBtn.textContent = `Added ${count}`;
          await refresh();
        });
        card.appendChild(addBtn);
      }
      importDiv.appendChild(card);
    });
  });

  await refresh();
}

// Extracts every priced outcome from a merged captured-market set (used only for History Import,
// where we want ALL available lines, not just ones clearing a confidence bar).
function gatherAllCapturedLegs(markets, ev, homeShort, awayShort, gameLabel, gameDate){
  const legs = [];
  const h2h = markets['h2h'];
  if(h2h){
    [{short:awayShort,full:ev.away_team,opp:homeShort},{short:homeShort,full:ev.home_team,opp:awayShort}].forEach(side=>{
      const o = dkOutcome(h2h, side.full);
      if(o) legs.push({label:`${side.full} Moneyline`, price:o.price, betType:'moneyline', team:side.short, opponent:side.opp, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time});
    });
  }
  const spreads = markets['spreads'];
  if(spreads){
    [{short:awayShort,full:ev.away_team,opp:homeShort},{short:homeShort,full:ev.home_team,opp:awayShort}].forEach(side=>{
      const o = dkOutcome(spreads, side.full);
      if(o) legs.push({label:`${side.full} ${o.point>0?'+':''}${o.point}`, price:o.price, betType:'spread', team:side.short, opponent:side.opp, line:o.point, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time});
    });
  }
  const totals = markets['totals'];
  if(totals){
    const over = dkOutcome(totals,'Over'), under = dkOutcome(totals,'Under');
    if(over) legs.push({label:`Game Total Over ${over.point}`, price:over.price, betType:'total', team:awayShort, opponent:homeShort, line:over.point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time});
    if(under) legs.push({label:`Game Total Under ${under.point}`, price:under.price, betType:'total', team:awayShort, opponent:homeShort, line:under.point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time});
  }
  const teamTotals = markets['team_totals'];
  if(teamTotals){
    [{short:awayShort,full:ev.away_team,opp:homeShort},{short:homeShort,full:ev.home_team,opp:awayShort}].forEach(side=>{
      const over = teamTotals.outcomes.find(o=>o.name==='Over'&&o.description===side.full);
      const under = teamTotals.outcomes.find(o=>o.name==='Under'&&o.description===side.full);
      if(over) legs.push({label:`${side.full} Team Total Over ${over.point}`, price:over.price, betType:'team_total', team:side.short, opponent:side.opp, line:over.point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time});
      if(under) legs.push({label:`${side.full} Team Total Under ${under.point}`, price:under.price, betType:'team_total', team:side.short, opponent:side.opp, line:under.point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time});
    });
  }
  ['player_points','player_rebounds','player_assists','player_threes'].forEach(mkey=>{
    const market = markets[mkey]; if(!market) return;
    const statKey = PROP_MARKET_TO_STAT[mkey];
    const players = [...new Set(market.outcomes.map(o=>o.description))];
    players.forEach(pname=>{
      const over = market.outcomes.find(o=>o.description===pname&&o.name==='Over');
      const under = market.outcomes.find(o=>o.description===pname&&o.name==='Under');
      const line = (over||under||{}).point;
      if(line===undefined) return;
      const team = findPlayerTeam(pname, homeShort, awayShort);
      const threshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
      if(over) legs.push({label:`${pname} Over ${line} ${PROP_MARKET_LABEL[mkey]}`, price:over.price, betType:'player_prop', team, player:pname, statKey, line, side:'over', thresholdToHit:threshold, gameLabel, gameDate, commenceTime:ev.commence_time});
      if(under) legs.push({label:`${pname} Under ${line} ${PROP_MARKET_LABEL[mkey]}`, price:under.price, betType:'player_prop', team, player:pname, statKey, line, side:'under', thresholdToHit:threshold, gameLabel, gameDate, commenceTime:ev.commence_time});
    });
  });
  return legs;
}

function buildParlaySection(wrap, ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL){
  const qualPct = Math.round(QUAL*100);
  const candidates = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL);

  const secParlay = document.createElement('div'); secParlay.className='section-title';
  secParlay.textContent = `Auto-Generated Parlays \u2014 ${qualPct}%+ Cutoff (both Last 10 AND Last 15 games)`;
  wrap.appendChild(secParlay);

  const parlayNote = document.createElement('div'); parlayNote.className='footnote'; parlayNote.style.marginBottom='10px';
  parlayNote.textContent = `These are built purely from historical hit-rate frequency, independent of the window selector above (always checked against last-10 and last-15 specifically). The same bet can appear in more than one parlay below, and can also appear in both the 75% and 70% sections. Player props additionally require she actually played in at least 60% of the games in both windows (6-of-10, 9-of-15) so a small-sample fluke can\u2019t sneak in. Small samples still mean these aren\u2019t true probabilities \u2014 treat as a research shortlist, not a guarantee.`;
  wrap.appendChild(parlayNote);

  if(candidates.length < 3){
    const msg = document.createElement('div'); msg.style.cssText='font-size:13px;color:var(--sub);margin-bottom:16px;';
    if(candidates.length === 0){
      msg.textContent = `No individual bets on this game currently clear ${qualPct}% in both the last-10 and last-15 windows (after requiring players to have actually played at least 60% of the games in each window).`;
    } else {
      msg.textContent = `Only ${candidates.length} bet(s) currently clear the bar \u2014 not enough for a 3-leg parlay yet: ` +
        candidates.map(c=>`${c.label} (${Math.round(c.rate10*100)}%/${Math.round(c.rate15*100)}%)`).join(', ');
    }
    wrap.appendChild(msg);
  } else {
    // Legs CAN repeat across parlays. To still give three genuinely different combinations rather than
    // three copies of the same top-N list, each parlay draws from a different confidence tier of the
    // qualifying pool (top / middle / lower-but-still-qualifying), sized at 3-4 legs each.
    const n = candidates.length;
    const size = Math.min(4, n);
    let starts;
    if(n <= 4){
      starts = [0]; // pool too small for distinct tiers — just show the one parlay
    } else {
      starts = [0, Math.floor(n/3), Math.floor(2*n/3)].map(s=>Math.min(s, n-size));
      starts = [...new Set(starts)]; // de-duplicate identical starting points (can happen with small pools)
    }
    const groups = starts.map(s => candidates.slice(s, s+size));

    if(groups.length < 3){
      const shortNote = document.createElement('div'); shortNote.style.cssText='font-size:12.5px;color:var(--sub);margin-bottom:8px;';
      shortNote.textContent = n <= 4
        ? `Only ${n} qualifying legs right now \u2014 showing them as a single parlay rather than manufacturing duplicate 3-leg versions.`
        : `Only enough distinct qualifying legs for ${groups.length} differentiated parlay(s) right now.`;
      wrap.appendChild(shortNote);
    }

    const TIER_LABEL = ['Highest Confidence', 'Balanced', 'Deeper Value'];
    const parlayGrid = document.createElement('div'); parlayGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:8px;';
    groups.forEach((legs, idx)=>{
      const card = document.createElement('div');
      card.style.cssText = 'border:1px solid var(--line);border-radius:6px;padding:12px;background:#fafbfd;';
      const decOdds = legs.reduce((acc,l)=> acc * (americanToDecimal(l.price)||1), 1);
      const americanParlay = decimalToAmerican(decOdds);
      const cardTitle = document.createElement('div');
      cardTitle.style.cssText = 'font-weight:800;font-size:13px;margin-bottom:2px;color:var(--navy2);';
      const tierName = groups.length>1 ? (TIER_LABEL[idx]||`Parlay ${idx+1}`) : 'All Qualifying Legs';
      cardTitle.textContent = `${tierName} \u2014 ${legs.length} legs`;
      card.appendChild(cardTitle);
      const oddsLine = document.createElement('div');
      oddsLine.style.cssText = 'font-size:11.5px;color:var(--sub);margin-bottom:8px;';
      oddsLine.innerHTML = `Est. combined odds (independent math): <b style="color:var(--ink)">${fmtAmerican(americanParlay)}</b> \u2014 <i>not DraftKings' real same-game price; see note above</i>`;
      card.appendChild(oddsLine);
      const ul = document.createElement('ul'); ul.style.cssText='margin:0;padding-left:18px;font-size:12.5px;';
      legs.forEach(l=>{
        const li = document.createElement('li'); li.style.marginBottom='4px';
        li.innerHTML = `${l.label} <span style="color:var(--sub)">(${fmtAmerican(l.price)} \u2014 L10: ${Math.round(l.rate10*100)}%, L15: ${Math.round(l.rate15*100)}%)</span>`;
        ul.appendChild(li);
      });
      card.appendChild(ul);
      parlayGrid.appendChild(card);
    });
    wrap.appendChild(parlayGrid);
    const oddsCaveat = document.createElement('div'); oddsCaveat.className='footnote'; oddsCaveat.style.marginBottom='16px';
    oddsCaveat.innerHTML = '<b>On the combined odds above:</b> these legs are all from the same game, so they\u2019re correlated with each other (e.g. one player scoring big and an opposing player scoring low often move together). The odds shown are a naive independent-multiplication estimate \u2014 mathematically valid only for uncorrelated legs \u2014 and will <b>not</b> match DraftKings\u2019 actual same-game-parlay price, which uses a correlation-aware model this app doesn\u2019t have access to (The Odds API doesn\u2019t expose SGP pricing). Always check the real combined price in the DraftKings app before betting \u2014 don\u2019t rely on the number above.';
    wrap.appendChild(oddsCaveat);
  }
}
