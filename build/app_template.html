// Best-effort live lookup of a team's next scheduled opponent, via the same Odds API this
// app already proxies through your Worker for the Odds page \u2014 there's no schedule/fixtures
// data baked into the season dataset itself, only completed box scores, so this is the only
// way to know "who's next" at all. Returns null (not an error) if it can't be determined \u2014
// no Worker URL configured, no upcoming odds posted yet, network hiccup, etc.
async function fetchNextOpponent(teamShort){
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    if(!workerBase) return null;
    const events = await fetchJson(`${workerBase}/v4/sports/basketball_wnba/odds?regions=us&markets=h2h`);
    const fullName = FULL_TEAM_NAME[teamShort];
    const now = new Date();
    const upcoming = (events||[]).filter(ev => (ev.home_team===fullName || ev.away_team===fullName) && new Date(ev.commence_time) > now);
    upcoming.sort((a,b)=> new Date(a.commence_time)-new Date(b.commence_time));
    if(!upcoming.length) return null;
    const ev = upcoming[0];
    const oppFull = ev.home_team===fullName ? ev.away_team : ev.home_team;
    return SHORT_TEAM_NAME[oppFull] || oppFull;
  }catch(e){ return null; }
}

// ================= Click tracking (admin-visible usage analytics) =================
// Batches clicks in memory and flushes periodically rather than one network request per click
// -- with as many interactive elements as this app has (filters, sortable headers, track
// buttons), per-click requests would be wasteful and could realistically overwhelm the Worker.
// Only active while logged in -- there's no user to associate anonymous activity with, and no
// point tracking the login screen itself.
const CLICK_BATCH_FLUSH_INTERVAL_MS = 15000;
let _clickEventBuffer = [];
function currentPageLabel(){
  const activeNav = document.querySelector('.toplinks button.active');
  if(activeNav) return activeNav.textContent.trim();
  const h2 = document.querySelector('#main h2');
  if(h2) return h2.textContent.trim().slice(0,60);
  return document.title || 'unknown';
}
// Walks up a few levels from the actual clicked element to find the nearest meaningful
// clickable ancestor (a raw click often lands on an icon or text span inside a real button) --
// data-track-label lets any specific button opt into a clean, deliberate description instead of
// relying on this generic fallback.
function describeClickTarget(el){
  let node = el;
  for(let i=0; i<4 && node; i++){
    if(node.hasAttribute && node.hasAttribute('data-track-label')) return node.getAttribute('data-track-label');
    if(node.tagName === 'BUTTON' || node.tagName === 'A'){
      const text = (node.textContent||'').trim().replace(/\s+/g,' ').slice(0,80);
      const cls = node.className ? '.'+String(node.className).split(' ')[0] : '';
      return `${node.tagName.toLowerCase()}${cls}: ${text||'(no text)'}`;
    }
    if(node.tagName === 'INPUT'){
      return `input[${node.type||'text'}]${node.placeholder?': '+node.placeholder:''}`;
    }
    node = node.parentElement;
  }
  const tag = (el.tagName||'').toLowerCase();
  const cls = el.className ? '.'+String(el.className).split(' ')[0] : '';
  return `${tag}${cls}`;
}
async function flushClickEvents(){
  if(!_clickEventBuffer.length || !isLoggedIn()) return;
  const events = _clickEventBuffer.splice(0, _clickEventBuffer.length);
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    await fetch(`${workerBase}/track/click`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({events}), keepalive:true});
  }catch(e){ /* best-effort -- a lost batch of clicks isn't worth retrying or blocking on */ }
}
function initClickTracking(){
  document.addEventListener('click', (e)=>{
    if(!isLoggedIn()) return;
    _clickEventBuffer.push({page: currentPageLabel(), element: describeClickTarget(e.target), ts: new Date().toISOString()});
    if(_clickEventBuffer.length >= 50) flushClickEvents(); // flush early on a burst rather than waiting for the timer
  }, true); // capture phase -- still captures the click even if some handler later calls stopPropagation
  setInterval(flushClickEvents, CLICK_BATCH_FLUSH_INTERVAL_MS);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushClickEvents(); });
  window.addEventListener('beforeunload', flushClickEvents);
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;

// ================= Defense vs. Position rankings (Points/Rebounds/Assists/Threes/PRA, by G/F/C) =================
// Entirely derived from box scores already loaded client-side \u2014 no extra data source needed.
// For every stat + position bucket, ranks all 15 teams by how much of that stat they've allowed
// per game to opposing players of that position, season-long. Rank 1 = stingiest defense (fewest
// allowed); last place = most generous defense (most allowed), matching the convention requested.

// Buckets ESPN's position strings (G, F, C, and hybrids like "G-F") down to a single primary
// position by taking whichever letter appears first \u2014 the simplification broadcasts use too.
function positionBucket(pos){
  if(!pos) return null;
  const p = String(pos).toUpperCase();
  if(p.indexOf('C')===0) return 'C';
  if(p.indexOf('F')===0) return 'F';
  if(p.indexOf('G')===0) return 'G';
  return null;
}

// A player's position isn't stored on her season summary, only per-game box score rows \u2014
// so this scans every game once (cached after first call) and takes each player's most
// frequently listed position across the season as her "primary" position.
let _playerPositionCache = null;
function getPlayerPosition(playerName, team){
  if(!_playerPositionCache){
    _playerPositionCache = {};
    Object.values(DATA.games).forEach(g=>{
      g.rows.forEach(r=>{
        if(!r.pos) return;
        const key = r.player+'|'+r.team;
        if(!_playerPositionCache[key]) _playerPositionCache[key] = {};
        _playerPositionCache[key][r.pos] = (_playerPositionCache[key][r.pos]||0) + 1;
      });
    });
  }
  const counts = _playerPositionCache[playerName+'|'+team];
  if(!counts) return null;
  let best=null, bestCount=-1;
  Object.entries(counts).forEach(([pos,c])=>{ if(c>bestCount){ best=pos; bestCount=c; } });
  return best;
}

// Season-long (not tied to the Full Season/L15/L10/L5 hit-rate window \u2014 per-position splits
// need the bigger sample), cached after first computation since it scans every game once.
let _defenseVsPositionCache = null;
function computeDefenseVsPosition(){
  if(_defenseVsPositionCache) return _defenseVsPositionCache;
  const STAT_KEYS = ['pts','reb','ast','tpm','pra'];
  const BUCKETS = ['G','F','C'];
  const allowed = {};
  TEAM_NAMES.forEach(team=>{
    allowed[team] = {};
    BUCKETS.forEach(b=>{ allowed[team][b] = {pts:0,reb:0,ast:0,tpm:0,pra:0}; });
  });
  Object.values(DATA.games).forEach(g=>{
    g.rows.forEach(r=>{
      if(r.dnp) return;
      const bucket = positionBucket(r.pos);
      if(!bucket) return;
      const defTeam = r.team===g.home ? g.away : g.home;
      if(!allowed[defTeam]) return;
      const acc = allowed[defTeam][bucket];
      acc.pts += r.pts||0; acc.reb += r.reb||0; acc.ast += r.ast||0; acc.tpm += r.tpm||0;
      acc.pra += (r.pts||0)+(r.reb||0)+(r.ast||0);
    });
  });

  const perGame = {};
  TEAM_NAMES.forEach(team=>{
    const gp = DATA.teams[team] ? DATA.teams[team].gameIdsFull.length : 0;
    perGame[team] = {};
    BUCKETS.forEach(b=>{
      perGame[team][b] = {};
      STAT_KEYS.forEach(k=>{ perGame[team][b][k] = gp ? allowed[team][b][k]/gp : null; });
    });
  });

  const ranks = {};
  TEAM_NAMES.forEach(team=>{ ranks[team] = {G:{},F:{},C:{}}; });
  BUCKETS.forEach(bucket=>{
    STAT_KEYS.forEach(statKey=>{
      const withData = TEAM_NAMES.filter(t=> perGame[t][bucket][statKey]!==null);
      const sorted = withData.slice().sort((a,b)=> perGame[a][bucket][statKey]-perGame[b][bucket][statKey]);
      sorted.forEach((team,i)=>{
        ranks[team][bucket][statKey] = { rank: i+1, of: sorted.length, perGame: Math.round(perGame[team][bucket][statKey]*10)/10 };
      });
    });
  });
  _defenseVsPositionCache = ranks;
  return ranks;
}
function getDefenseRank(opponentTeam, statKey, bucket){
  if(!bucket) return null;
  const ranks = computeDefenseVsPosition();
  return (ranks[opponentTeam] && ranks[opponentTeam][bucket] && ranks[opponentTeam][bucket][statKey]) || null;
}

// Same idea as computeDefenseVsPosition, but each team's "games played" is its own last N
// games specifically (not the full season) -- catches teams whose defense has gotten notably
// better or worse recently, which a season-long average would smooth over. A team with fewer
// than N games played uses however many it has. cutoffDate (optional) restricts to that team's
// N most recent games strictly BEFORE that date -- for showing what a defense's rank actually
// was right before some specific past game, not leaking in games that happened after.
const _defenseVsPositionWindowCache = {};
function computeDefenseVsPositionWindow(windowSize, cutoffDate){
  const cacheKey = `${windowSize}|${cutoffDate || '__current__'}`;
  if(_defenseVsPositionWindowCache[cacheKey]) return _defenseVsPositionWindowCache[cacheKey];
  const STAT_KEYS = ['pts','reb','ast','tpm','pra'];
  const BUCKETS = ['G','F','C'];

  const teamGames = {};
  TEAM_NAMES.forEach(t=>{ teamGames[t] = []; });
  Object.values(DATA.games).forEach(g=>{
    if(cutoffDate && g.date >= cutoffDate) return; // point-in-time: strictly before the cutoff
    if(teamGames[g.home]) teamGames[g.home].push(g);
    if(teamGames[g.away]) teamGames[g.away].push(g);
  });
  TEAM_NAMES.forEach(t=>{ teamGames[t].sort((a,b)=> b.date.localeCompare(a.date)); });

  const allowed = {};
  const gpUsed = {};
  TEAM_NAMES.forEach(team=>{
    allowed[team] = {};
    BUCKETS.forEach(b=>{ allowed[team][b] = {pts:0,reb:0,ast:0,tpm:0,pra:0}; });
    const lastN = teamGames[team].slice(0,windowSize);
    gpUsed[team] = lastN.length;
    lastN.forEach(g=>{
      g.rows.forEach(r=>{
        if(r.dnp) return;
        const bucket = positionBucket(r.pos);
        if(!bucket) return;
        const defTeam = r.team===g.home ? g.away : g.home;
        if(defTeam !== team) return; // only stats scored AGAINST this team, in this team's own last-N window
        const acc = allowed[team][bucket];
        acc.pts += r.pts||0; acc.reb += r.reb||0; acc.ast += r.ast||0; acc.tpm += r.tpm||0;
        acc.pra += (r.pts||0)+(r.reb||0)+(r.ast||0);
      });
    });
  });

  const perGame = {};
  TEAM_NAMES.forEach(team=>{
    perGame[team] = {};
    BUCKETS.forEach(b=>{
      perGame[team][b] = {};
      STAT_KEYS.forEach(k=>{ perGame[team][b][k] = gpUsed[team] ? allowed[team][b][k]/gpUsed[team] : null; });
    });
  });

  const ranks = {};
  TEAM_NAMES.forEach(team=>{ ranks[team] = {G:{},F:{},C:{}}; });
  BUCKETS.forEach(bucket=>{
    STAT_KEYS.forEach(statKey=>{
      const withData = TEAM_NAMES.filter(t=> perGame[t][bucket][statKey]!==null);
      const sorted = withData.slice().sort((a,b)=> perGame[a][bucket][statKey]-perGame[b][bucket][statKey]);
      sorted.forEach((team,i)=>{
        ranks[team][bucket][statKey] = { rank: i+1, of: sorted.length, perGame: Math.round(perGame[team][bucket][statKey]*10)/10, gp: gpUsed[team] };
      });
    });
  });
  _defenseVsPositionWindowCache[cacheKey] = ranks;
  return ranks;
}
function computeDefenseVsPositionL5(cutoffDate){ return computeDefenseVsPositionWindow(5, cutoffDate); }
function computeDefenseVsPositionL10(cutoffDate){ return computeDefenseVsPositionWindow(10, cutoffDate); }
function computeDefenseVsPositionL15(cutoffDate){ return computeDefenseVsPositionWindow(15, cutoffDate); }
function getDefenseRankWindow(opponentTeam, statKey, bucket, windowSize, cutoffDate){
  if(!bucket) return null;
  const ranks = computeDefenseVsPositionWindow(windowSize, cutoffDate);
  return (ranks[opponentTeam] && ranks[opponentTeam][bucket] && ranks[opponentTeam][bucket][statKey]) || null;
}
function getDefenseRankL5(opponentTeam, statKey, bucket, cutoffDate){ return getDefenseRankWindow(opponentTeam, statKey, bucket, 5, cutoffDate); }
function getDefenseRankL10(opponentTeam, statKey, bucket, cutoffDate){ return getDefenseRankWindow(opponentTeam, statKey, bucket, 10, cutoffDate); }
function getDefenseRankL15(opponentTeam, statKey, bucket, cutoffDate){ return getDefenseRankWindow(opponentTeam, statKey, bucket, 15, cutoffDate); }
const POSITION_LABEL = {G:'Guards', F:'Forwards', C:'Centers'};

// Point-in-time variants of the DvP system above, used in player gamelogs so a historical
// game's DvP reflects what the opponent's defense actually looked like BEFORE that game tipped
// off \u2014 not the final, full-season DvP (which would leak in games that happened afterward).
// Cached per cutoff date since a given date can recur across many players/rows in one session.
const _dvpAsOfCache = {};
function computeDefenseVsPositionAsOf(cutoffDate){
  if(_dvpAsOfCache[cutoffDate]) return _dvpAsOfCache[cutoffDate];
  const STAT_KEYS = ['pts','reb','ast','tpm','pra'];
  const BUCKETS = ['G','F','C'];
  const allowed = {}; const gamesPlayed = {};
  TEAM_NAMES.forEach(team=>{
    allowed[team] = {}; BUCKETS.forEach(b=>{ allowed[team][b] = {pts:0,reb:0,ast:0,tpm:0,pra:0}; });
    gamesPlayed[team] = 0;
  });
  Object.values(DATA.games).forEach(g=>{
    if(g.date >= cutoffDate) return; // strictly before \u2014 this game itself doesn't count toward its own pre-game DvP
    if(gamesPlayed[g.home]!==undefined) gamesPlayed[g.home]++;
    if(gamesPlayed[g.away]!==undefined) gamesPlayed[g.away]++;
    g.rows.forEach(r=>{
      if(r.dnp) return;
      const bucket = positionBucket(r.pos);
      if(!bucket) return;
      const defTeam = r.team===g.home ? g.away : g.home;
      if(!allowed[defTeam]) return;
      const acc = allowed[defTeam][bucket];
      acc.pts += r.pts||0; acc.reb += r.reb||0; acc.ast += r.ast||0; acc.tpm += r.tpm||0;
      acc.pra += (r.pts||0)+(r.reb||0)+(r.ast||0);
    });
  });
  const perGame = {};
  TEAM_NAMES.forEach(team=>{
    const gp = gamesPlayed[team];
    perGame[team] = {};
    BUCKETS.forEach(b=>{ perGame[team][b] = {}; STAT_KEYS.forEach(k=>{ perGame[team][b][k] = gp ? allowed[team][b][k]/gp : null; }); });
  });
  const ranks = {};
  TEAM_NAMES.forEach(team=>{ ranks[team] = {G:{},F:{},C:{}}; });
  BUCKETS.forEach(bucket=>{
    STAT_KEYS.forEach(statKey=>{
      const withData = TEAM_NAMES.filter(t=> perGame[t][bucket][statKey]!==null);
      const sorted = withData.slice().sort((a,b)=> perGame[a][bucket][statKey]-perGame[b][bucket][statKey]);
      sorted.forEach((team,i)=>{ ranks[team][bucket][statKey] = { rank:i+1, of:sorted.length, perGame: Math.round(perGame[team][bucket][statKey]*10)/10 }; });
    });
  });
  _dvpAsOfCache[cutoffDate] = ranks;
  return ranks;
}
function getDefenseRankAsOf(opponentTeam, statKey, bucket, cutoffDate){
  if(!bucket) return null;
  const ranks = computeDefenseVsPositionAsOf(cutoffDate);
  return (ranks[opponentTeam] && ranks[opponentTeam][bucket] && ranks[opponentTeam][bucket][statKey]) || null;
}
const _dvpBaselineAsOfCache = {};
function computeDvpBaselineAsOf(cutoffDate){
  if(_dvpBaselineAsOfCache[cutoffDate]) return _dvpBaselineAsOfCache[cutoffDate];
  const ranks = computeDefenseVsPositionAsOf(cutoffDate);
  const baseline = {};
  ['G','F','C'].forEach(b=>{
    baseline[b] = {};
    ['pts','reb','ast','tpm','pra'].forEach(k=>{
      const vals = TEAM_NAMES.map(t=> ranks[t] && ranks[t][b] && ranks[t][b][k] ? ranks[t][b][k].perGame : null).filter(v=>v!==null);
      baseline[b][k] = vals.length ? vals.reduce((a,b2)=>a+b2,0)/vals.length : null;
    });
  });
  _dvpBaselineAsOfCache[cutoffDate] = baseline;
  return baseline;
}
// The date-aware equivalent of dvpIndex() \u2014 same >1.05/<0.95 read, just computed only from
// games that had already been played before this specific game's tip-off.
function dvpIndexAsOf(opponentTeam, statKey, bucket, cutoffDate){
  if(!bucket) return null;
  const r = getDefenseRankAsOf(opponentTeam, statKey, bucket, cutoffDate);
  if(!r) return null;
  const baseline = computeDvpBaselineAsOf(cutoffDate);
  const base = baseline[bucket] && baseline[bucket][statKey];
  if(!base) return null;
  return Math.round((r.perGame / base) * 1000) / 1000;
}

// ================= Injuries =================
// Populated by the pipeline's ESPN injury-report fetch (see fetch_injuries.py), merged into
// DATA.injuries[shortTeam] = [{player, position, status, detail, date}, ...]. Missing/empty
// is handled gracefully throughout \u2014 the pipeline step is best-effort and can come up empty.

// "Key player" = averages 23+ minutes per game this season (current season only; averages
// aren't tracked per-year yet). Uses the same summaryFull.averages data already loaded for
// everything else on the Team Explorer pages.
function isKeyPlayer(playerName, team){
  const t = DATA.teams[team];
  if(!t) return false;
  const row = t.summaryFull.averages.find(r=>r.player===playerName);
  return !!(row && row.min!==null && row.min!==undefined && row.min>=23);
}

function teamInjuries(team){
  return (DATA.injuries && DATA.injuries[team]) || [];
}

// Buckets ESPN's free-text status into a rough severity so the UI can color-code it. Checks
// substrings rather than an exact match since ESPN's exact wording has changed before.
function injuryStatusSeverity(status){
  if(!status) return 'unknown';
  const s = String(status).toLowerCase();
  if(s.includes('out') || s.includes('injured reserve') || s.includes('suspension')) return 'out';
  if(s.includes('doubtful')) return 'doubtful';
  if(s.includes('questionable') || s.includes('day-to-day') || s.includes('day to day') || s.includes('game-time')) return 'questionable';
  return 'other';
}
const INJURY_SEVERITY_COLOR = {out:'var(--red)', doubtful:'var(--red)', questionable:'#b8860b', other:'var(--sub)', unknown:'var(--sub)'};

// How this player's per-game production has differed, historically, in games her teammate
// missed vs played -- for every teammate CURRENTLY listed as officially out. Cross-references
// by date (both players are on the same team, so at most one game per date), not by any shared
// game id, since player logs don't store one directly.
const TEAMMATE_OUT_INSIGNIFICANT_THRESHOLD = {pts:1.0, reb:1.0, ast:1.0, pra:2.0}; // PRA gets double the bar since it's a sum of the other three -- the same-size swing in each individual stat would otherwise look artificially bigger once combined
function computeTeammateOutImpact(playerName, team){
  const rec = DATA.fullPlayerLogs[playerName+'|'+team];
  if(!rec) return [];
  const ownGames = rec.log.filter(g=>!g.dnp);
  if(ownGames.length < 4) return []; // too small a sample to split meaningfully at all

  const outTeammates = teamInjuries(team).filter(inj => injuryStatusSeverity(inj.status)==='out' && inj.player !== playerName);
  const results = [];
  outTeammates.forEach(inj=>{
    const tmRec = DATA.fullPlayerLogs[inj.player+'|'+team];
    if(!tmRec) return; // no log data for the teammate on file -- can't compute a split
    const playedDates = new Set(tmRec.log.filter(g=>!g.dnp).map(g=>g.date));
    const gamesWith = ownGames.filter(g=>playedDates.has(g.date));
    const gamesWithout = ownGames.filter(g=>!playedDates.has(g.date));
    if(gamesWithout.length < 2){
      results.push({teammate: inj.player, status: inj.status, insufficientSample:true, gamesWith: gamesWith.length, gamesWithout: gamesWithout.length});
      return;
    }
    function avgStat(games, statKey){
      const vals = games.map(g => statKey==='pra' ? (g.pts||0)+(g.reb||0)+(g.ast||0) : (g[statKey]||0));
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    }
    const stats = ['pts','reb','ast','pra'].map(statKey=>{
      const withAvg = avgStat(gamesWith, statKey);
      const withoutAvg = avgStat(gamesWithout, statKey);
      return { statKey, withAvg, withoutAvg, delta: (withAvg!==null && withoutAvg!==null) ? withoutAvg-withAvg : null };
    });
    results.push({teammate: inj.player, status: inj.status, gamesWith: gamesWith.length, gamesWithout: gamesWithout.length, stats, insufficientSample:false});
  });
  return results;
}
function formatTeammateOutDelta(statKey, delta){
  if(delta===null || delta===undefined) return '\u2014';
  const rounded = Math.round(delta*10)/10;
  const sign = rounded>=0 ? '+' : '';
  if(Math.abs(rounded) < TEAMMATE_OUT_INSIGNIFICANT_THRESHOLD[statKey]) return `Insignificant (${sign}${rounded})`;
  return `${sign}${rounded}`;
}

// Distinct from injuryStatusSeverity (used elsewhere for general color-coding of any status) --
// this specifically identifies the two statuses that should make the injury indicator show up
// at all: officially ruled OUT for the game, or day-to-day. A merely "probable"/"questionable"
// note doesn't surface the indicator, per how this is meant to be used (a heads-up worth
// interrupting a bet decision for, not every minor note).
function noteworthyInjuryStatus(status){
  if(!status) return null;
  const s = String(status).toLowerCase();
  if(s.includes('out') || s.includes('injured reserve') || s.includes('suspension')) return 'out';
  if(s.includes('day-to-day') || s.includes('day to day')) return 'dayToDay';
  return null;
}

// Returns {preview, full} or null. `preview` is a minimal, always-visible indicator (no player
// names or status text -- just enough to flag "check this before betting it") meant to sit next
// to the game header without competing for tap space with the expand triangle. `full` is the
// complete detail (same content as before) meant to only show once the card is expanded. Every
// text-bearing element gets an explicit font-size rather than relying on inheritance, since iOS
// Safari does not always scale emoji glyphs to match surrounding text size the way it scales
// regular characters, which was making the emoji render visibly larger than the rest of the line.
function buildInjuryBanner(awayShort, homeShort){
  const relevant = [];
  [awayShort, homeShort].forEach(team=>{
    teamInjuries(team).forEach(inj=>{
      if(isKeyPlayer(inj.player, team)) relevant.push(Object.assign({}, inj, {team}));
    });
  });
  const noteworthy = relevant.filter(inj => noteworthyInjuryStatus(inj.status));
  if(!noteworthy.length) return null;
  const hasOut = noteworthy.some(inj => noteworthyInjuryStatus(inj.status)==='out');

  const preview = document.createElement('div');
  preview.style.cssText = 'background:var(--panel)4e5;border:1px solid #f0b83c;border-radius:6px;padding:6px 12px;margin:8px 0 4px;';
  const previewLabel = document.createElement('span');
  previewLabel.style.cssText = 'font-size:12.5px;font-weight:700;color:#7a5200;';
  previewLabel.textContent = 'Watch:';
  const previewIcon = document.createElement('span');
  previewIcon.style.cssText = 'font-size:12.5px;margin-left:6px;';
  previewIcon.textContent = hasOut ? '\u26a0\ufe0f \ud83d\uded1' : '\u26a0\ufe0f';
  preview.appendChild(previewLabel); preview.appendChild(previewIcon);

  const full = document.createElement('div');
  full.style.cssText = 'background:var(--panel)4e5;border:1px solid #f0b83c;border-radius:6px;padding:8px 12px;margin:0 0 12px;';
  const fullLabel = document.createElement('span');
  fullLabel.style.cssText = 'font-size:12.5px;font-weight:700;color:#7a5200;';
  fullLabel.textContent = 'Key Player Injury Watch:';
  full.appendChild(fullLabel);
  relevant.forEach((inj, i)=>{
    const sep = document.createElement('span');
    sep.style.cssText = 'font-size:12.5px;color:#7a5200;';
    sep.innerHTML = i>0 ? '&nbsp;&middot;&nbsp;' : '&nbsp;';
    full.appendChild(sep);
    const color = INJURY_SEVERITY_COLOR[injuryStatusSeverity(inj.status)] || '#7a5200';
    const nameSpan = document.createElement('b');
    nameSpan.style.cssText = `font-size:12.5px;color:${color};`;
    nameSpan.textContent = inj.player;
    full.appendChild(nameSpan);
    const restSpan = document.createElement('span');
    restSpan.style.cssText = 'font-size:12.5px;color:#7a5200;';
    restSpan.textContent = ` (${inj.team}${inj.position?', '+inj.position:''}) \u2014 ${inj.status||'Status unclear'}`;
    full.appendChild(restSpan);
  });

  return {preview, full};
}



// ================= Season prop-line trend charts (player + team pages) =================
// Reuses the same ODDS_HISTORY snapshot archive that already powers the per-bet "Line
// History" page. A snapshot is only ever saved pre-tipoff (see the Worker's saveSnapshots),
// so for each game we just take whichever saved snapshot is closest to that game's tip-off
// and read the line off it \u2014 that's "the pregame line" for that game.
//
// Coverage caveat (real, not hypothetical): a snapshot only exists for a game/market if the
// app was actually browsed to a page that fetched that market before that game tipped off.
// There's no background job forcing a fetch for every upcoming game \u2014 it happens as a
// byproduct of normal use. So the chart below will have gaps for games nobody happened to
// check via the Odds page before they started, and will fill in more completely for whoever
// (or whatever automation) is opening the app regularly.
const LINE_TREND_MARKETS = [
  {mkey:'player_points', statKey:'pts', label:'Points', color:'#1c4b82'},
  {mkey:'player_rebounds', statKey:'reb', label:'Rebounds', color:'#1f9d55'},
  {mkey:'player_assists', statKey:'ast', label:'Assists', color:'#b3261e'},
  {mkey:'player_threes', statKey:'tpm', label:'Threes', color:'#a5760a'},
  {mkey:'player_points_rebounds_assists', statKey:'pra', label:'Pts+Reb+Ast', color:'#6a3fa0'},
];

let _oddsHistoryCache = null;
// Pages through /history/export (see the Worker \u2014 it caps each response at ~40 records
// to stay under the Workers free-plan 50-subrequest-per-invocation limit), accumulating
// every record across as many calls as it takes. Cached after the first full fetch so
// switching between player/team pages in one session doesn't re-download it repeatedly.
// onProgress(recordsSoFar), if given, is called after each page so callers can show a
// live count instead of a static "Loading\u2026" that looks frozen on a large archive.
async function fetchOddsHistoryCached(onProgress){
  if(_oddsHistoryCache) return _oddsHistoryCache;
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  let all = [];
  let cursor = null;
  let guard = 0; // hard stop so a Worker bug can't spin this forever
  while(guard++ < 200){
    const url = cursor ? `${workerBase}/history/export?cursor=${encodeURIComponent(cursor)}` : `${workerBase}/history/export`;
    const page = await fetchJson(url);
    if(page && page.error) throw new Error(page.error);
    all = all.concat(page.records || []);
    if(onProgress) onProgress(all.length);
    if(page.done || !page.cursor) break;
    cursor = page.cursor;
  }
  all.sort((a,b)=> (a.fetchedAt||'').localeCompare(b.fetchedAt||''));
  _oddsHistoryCache = all;
  return _oddsHistoryCache;
}

// Builds {pts:[{date,value}], reb:[...], ast:[...], tpm:[...], pra:[...]} for one player,
// one point per game (the DraftKings line at her last pre-tipoff snapshot for that game).
function buildPlayerLineSeries(playerName, team, history){
  const fullName = FULL_TEAM_NAME[team];
  const relevant = (history||[]).filter(snap => snap.homeTeam===fullName || snap.awayTeam===fullName);

  const latestByEvent = {};
  relevant.forEach(snap=>{
    const existing = latestByEvent[snap.eventId];
    if(!existing || snap.fetchedAt > existing.fetchedAt) latestByEvent[snap.eventId] = snap;
  });

  const series = {};
  LINE_TREND_MARKETS.forEach(m=>{ series[m.statKey] = []; });

  Object.values(latestByEvent).forEach(snap=>{
    const dk = (snap.data.bookmakers||[]).find(b=>b.key==='draftkings');
    if(!dk) return;
    const date = (snap.commenceTime||'').slice(0,10);
    if(!date) return;
    LINE_TREND_MARKETS.forEach(m=>{
      const market = (dk.markets||[]).find(mk=>mk.key===m.mkey);
      if(!market) return;
      const outcome = (market.outcomes||[]).find(o=>o.description===playerName);
      if(!outcome || outcome.point===undefined || outcome.point===null) return;
      series[m.statKey].push({date, value: outcome.point});
    });
  });

  LINE_TREND_MARKETS.forEach(m=>{ series[m.statKey].sort((a,b)=>a.date.localeCompare(b.date)); });
  return series;
}

// Renders a toggleable multi-series line chart into `container` for the given series map
// (see buildPlayerLineSeries). Stats with zero data points are omitted from the legend
// entirely rather than shown as an empty/misleading toggle.
function renderLineTrendChart(container, series){
  container.innerHTML = '';
  const activeMarkets = LINE_TREND_MARKETS.filter(m => (series[m.statKey]||[]).length > 0);
  if(activeMarkets.length===0){
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
    na.textContent = 'No tracked prop-line history yet for this player \u2014 lines are captured automatically as the Live Lines page is browsed before each game tips off, so this fills in on its own as the season goes on.';
    container.appendChild(na);
    return;
  }

  const checkboxState = {};
  activeMarkets.forEach(m=>{ checkboxState[m.statKey] = true; });

  const legend = document.createElement('div'); legend.style.cssText='display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;';
  const svgHolder = document.createElement('div');

  function buildSvg(){
    const W = 700, H = 280, padL = 40, padR = 16, padT = 16, padB = 28;
    const visibleMarkets = activeMarkets.filter(m=>checkboxState[m.statKey]);
    if(visibleMarkets.length===0) return '<div style="color:var(--sub);font-size:12px;padding:12px 0;">No stats selected.</div>';

    const allDates = Array.from(new Set(visibleMarkets.flatMap(m=>series[m.statKey].map(p=>p.date)))).sort();
    const allValues = visibleMarkets.flatMap(m=>series[m.statKey].map(p=>p.value));
    const minV = Math.min(...allValues), maxV = Math.max(...allValues);
    const vRange = (maxV - minV) || 1;
    const yFor = v => padT + (H-padT-padB) * (1 - (v-minV)/vRange);
    const xFor = d => {
      const idx = allDates.indexOf(d);
      return padL + (allDates.length<=1 ? (W-padL-padR)/2 : (W-padL-padR) * idx/(allDates.length-1));
    };

    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:inherit;">`;
    for(let i=0;i<=4;i++){
      const v = minV + (vRange*i/4);
      const y = yFor(v);
      svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`;
      svg += `<text x="${padL-6}" y="${(y+4).toFixed(1)}" font-size="10" text-anchor="end" fill="#5b6472">${Math.round(v*10)/10}</text>`;
    }
    const labelStep = Math.max(1, Math.ceil(allDates.length/6));
    allDates.forEach((d,i)=>{
      if(i%labelStep!==0 && i!==allDates.length-1) return;
      const x = xFor(d);
      svg += `<text x="${x.toFixed(1)}" y="${H-padB+16}" font-size="9" text-anchor="middle" fill="#5b6472">${d.slice(5)}</text>`;
    });

    visibleMarkets.forEach(m=>{
      const pts = series[m.statKey];
      if(pts.length===0) return;
      const path = pts.map((p,i)=> `${i===0?'M':'L'} ${xFor(p.date).toFixed(1)} ${yFor(p.value).toFixed(1)}`).join(' ');
      svg += `<path d="${path}" fill="none" stroke="${m.color}" stroke-width="2"/>`;
      pts.forEach(p=>{
        svg += `<circle cx="${xFor(p.date).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="3" fill="${m.color}"><title>${p.date}: ${p.value}</title></circle>`;
      });
    });
    svg += '</svg>';
    return svg;
  }
  function draw(){ svgHolder.innerHTML = buildSvg(); }

  activeMarkets.forEach(m=>{
    const lbl = document.createElement('label'); lbl.style.cssText=`display:flex;align-items:center;gap:5px;font-size:12px;color:${m.color};font-weight:700;cursor:pointer;`;
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.addEventListener('change', ()=>{ checkboxState[m.statKey]=cb.checked; draw(); });
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(`${m.label} (${series[m.statKey].length})`));
    legend.appendChild(lbl);
  });

  container.appendChild(legend);
  container.appendChild(svgHolder);
  draw();
}

// 'pra' isn't a stored field on a game-log entry — it's derived on the fly from pts+reb+ast.
function statValue(g, statKey){
  if(statKey==='pra'){
    if(g.pts===null||g.pts===undefined||g.reb===null||g.reb===undefined||g.ast===null||g.ast===undefined) return null;
    return g.pts + g.reb + g.ast;
  }
  return g[statKey];
}

// windowSize: 'all' | 15 | 10 | 5 — how many of the most recent games to look at
function windowSlice(arr, windowSize){
  if(windowSize==='all' || !windowSize) return arr;
  return arr.slice(Math.max(0, arr.length - windowSize));
}
// Team gameIds (from filterGameIdsByYearMonth) run most-recent-first (descending), unlike
// a player's game log which runs oldest-first \u2014 so "last N games" here means the first N
// entries, not the tail windowSlice takes for ascending-ordered arrays.
function windowSliceRecentFirst(arr, windowSize){
  if(windowSize==='all' || !windowSize) return arr;
  return arr.slice(0, windowSize);
}

function hitRateFor(playerName, team, statKey, line, windowSize){
  // line is the sportsbook point (e.g. 12.5). "Over" hits when actual >= ceil(line) for a .5 line.
  const threshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
  const key = `${playerName}|${team}`;
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  const played = windowSlice(pl.log, windowSize).filter(g=>!g.dnp);
  const gp = played.length;
  if(gp===0) return {gp:0, hits:0, rate:0, found:true};
  const hits = played.filter(g=>{ const v=statValue(g,statKey); return v!==null && v>=threshold; }).length;
  return {gp, hits, rate: hits/gp, found:true};
}

// For DraftKings "milestone" alt lines (displayed as "20+", "22+", etc.) — unlike a standard
// Over/Under line, the point value here already IS the literal minimum to hit, so no ceil/+1
// adjustment is applied (that adjustment is specifically for .5-style Over/Under lines).
function altHitRateFor(playerName, team, statKey, threshold, windowSize){
  const key = `${playerName}|${team}`;
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  const played = windowSlice(pl.log, windowSize).filter(g=>!g.dnp);
  const gp = played.length;
  if(gp===0) return {gp:0, hits:0, rate:0, found:true};
  const hits = played.filter(g=>{ const v=statValue(g,statKey); return v!==null && v>=threshold; }).length;
  return {gp, hits, rate: hits/gp, found:true};
}

// Derives a windowed view ('all' | 15 | 10 | 5) from the full-season log on the fly.
function windowedPlayerLog(key, windowSize){
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  return { player: pl.player, team: pl.team, athleteId: pl.athleteId, log: windowSlice(pl.log, windowSize) };
}

function findPlayerTeam(playerName, teamA, teamB){
  if(DATA.fullPlayerLogs[`${playerName}|${teamA}`]) return teamA;
  if(DATA.fullPlayerLogs[`${playerName}|${teamB}`]) return teamB;
  return null;
}

// ---- Team-level hit-rate calculators, based on each team's own full-season game log (final scores only), windowed ----
function teamGameLog(team, windowSize){
  const log = DATA.fullTeamGames[team] || [];
  return windowSlice(log, windowSize);
}
// Season record always included; windowed record (matching whatever L5/L10/L15/Full Season is
// currently selected) appended alongside it, unless Full Season is selected -- in which case
// it'd just duplicate the season record already shown. Used anywhere a team name appears on
// the Live Lines page so every matchup shows both records next to each team.
function teamRecordParenText(team, windowSize){
  const seasonRec = DATA.teamRecords[team] && DATA.teamRecords[team].overall;
  if(!seasonRec) return '';
  let text = `${seasonRec.w}-${seasonRec.l}`;
  if(windowSize !== 'all'){
    const log = teamGameLog(team, windowSize);
    const w = log.filter(g=>g.teamPts>g.oppPts).length;
    const l = log.filter(g=>g.teamPts<g.oppPts).length;
    text += `, ${w}-${l} L${windowSize}`;
  }
  return ` (${text})`;
}
function teamMoneylineHitRate(team, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  const hits = log.filter(g=>g.teamPts>g.oppPts).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}
function teamSpreadHitRate(team, point, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>((g.teamPts-g.oppPts)+point) > 0).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}
function teamTotalHitRate(team, point, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>(g.teamPts+g.oppPts) > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}
function teamOwnTotalHitRate(team, point, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>g.teamPts > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}

// ---- Half-aware versions, using h1Team/h1Opp/h2Team/h2Opp fields derived from play-by-play.
// Games where that data wasn't available (rare — e.g. a missing/incomplete pbp log) are simply
// excluded from the denominator rather than treated as a miss. ----
function teamGameLogHalf(team, windowSize, half){
  const log = teamGameLog(team, windowSize);
  const teamKey = half===1 ? 'h1TeamPts' : 'h2TeamPts';
  const oppKey = half===1 ? 'h1OppPts' : 'h2OppPts';
  return log.filter(g=>g[teamKey]!==null && g[teamKey]!==undefined && g[oppKey]!==null && g[oppKey]!==undefined)
            .map(g=>({teamPts:g[teamKey], oppPts:g[oppKey]}));
}
function teamMoneylineHitRateHalf(team, half, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  const hits = log.filter(g=>g.teamPts>g.oppPts).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}
function teamSpreadHitRateHalf(team, half, point, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>((g.teamPts-g.oppPts)+point) > 0).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}
function teamTotalHitRateHalf(team, half, point, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>(g.teamPts+g.oppPts) > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}
function teamOwnTotalHitRateHalf(team, half, point, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>g.teamPts > point).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}

function americanToDecimal(price){
  if(price===undefined||price===null) return null;
  return price>0 ? 1+price/100 : 1+100/Math.abs(price);
}
function decimalToAmerican(dec){
  if(dec===null||dec===undefined||dec<=1) return null;
  if(dec>=2) return Math.round((dec-1)*100);
  return Math.round(-100/(dec-1));
}
// Top Bets ranking cutoff: a game stays eligible from before tipoff through this many real-
// world minutes after its scheduled commence_time, then drops out. This app has no live
// in-game clock feed (only final box scores, refreshed every ~10 min after games end), so
// this is a wall-clock approximation of "the first 5 minutes" \u2014 not the actual game clock.
// Worth knowing: a WNBA quarter is 10 minutes of game clock but commonly takes 25-30+ real
// minutes to play out once fouls/timeouts/reviews are included, so this grace window ends
// well before 5:00 actually shows on the in-arena clock \u2014 it's deliberately conservative.
const TOP_BETS_GRACE_MS = 5 * 60 * 1000;
function withinTopBetsWindow(commenceTime, now){
  const elapsedMs = now - new Date(commenceTime);
  return elapsedMs <= TOP_BETS_GRACE_MS; // true if not yet started, or started within the last 5 min
}

function fmtAmerican(price){
  if(price===null||price===undefined) return '\u2014';
  return (price>0?'+':'')+price;
}

// Generic filterable table used on the Odds page (Player Props + Alt Lines tables).
// columns: [{key, label, type:'text'|'select'|'numRange', options?, align?}]
// dataRows: [{filterValues:{[colKey]: rawValueForFiltering}, cells:[stringOrNode, ...] }]
function buildFilterableTable(container, columns, dataRows){
  const filterState = {};
  const wrapDiv = document.createElement('div'); wrapDiv.style.marginBottom='4px';
  // Opp Def Rank / Allowed-Gm columns shown by default (not auto-hidden) -- the checkbox below still lets the user hide them.
  const DEF_COL_KEYS = ['defRank','defAllowed'];
  const hasDefCols = columns.some(c=>DEF_COL_KEYS.includes(c.key));
  if(hasDefCols){
    const toggleLabel = document.createElement('label'); toggleLabel.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;width:fit-content;margin-bottom:8px;';
    const toggleCb = document.createElement('input'); toggleCb.type='checkbox'; toggleCb.checked = false;
    toggleLabel.appendChild(toggleCb);
    toggleLabel.appendChild(document.createTextNode('Hide Opp Def Rank / Allowed-Gm columns'));
    toggleCb.addEventListener('change', ()=>{ wrapDiv.classList.toggle('hide-defcols', toggleCb.checked); });
    wrapDiv.appendChild(toggleLabel);
  }

  const filterBar = document.createElement('div');
  filterBar.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;';
  columns.forEach(col=>{
    const group = document.createElement('div');
    group.style.cssText = 'display:flex;flex-direction:column;gap:2px;';
    const lbl = document.createElement('label'); lbl.textContent = col.label;
    lbl.style.cssText='font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;';
    group.appendChild(lbl);
    const inputStyle = 'padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);';
    if(col.type==='text'){
      const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Search\u2026';
      inp.style.cssText = inputStyle + 'width:120px;';
      inp.addEventListener('input', ()=>{ filterState[col.key] = inp.value.trim(); render(); });
      group.appendChild(inp);
    } else if(col.type==='select'){
      const sel = document.createElement('select');
      sel.style.cssText = inputStyle;
      const optAll = document.createElement('option'); optAll.value=''; optAll.textContent='All'; sel.appendChild(optAll);
      (col.options||[]).forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
      sel.addEventListener('change', ()=>{ filterState[col.key] = sel.value; render(); });
      group.appendChild(sel);
    } else if(col.type==='numRange'){
      const rangeRow = document.createElement('div'); rangeRow.style.cssText='display:flex;gap:4px;';
      const minI = document.createElement('input'); minI.type='number'; minI.placeholder='Min'; minI.style.cssText = inputStyle + 'width:52px;';
      const maxI = document.createElement('input'); maxI.type='number'; maxI.placeholder='Max'; maxI.style.cssText = inputStyle + 'width:52px;';
      function upd(){ filterState[col.key] = { min: minI.value===''?null:parseFloat(minI.value), max: maxI.value===''?null:parseFloat(maxI.value) }; render(); }
      minI.addEventListener('input', upd); maxI.addEventListener('input', upd);
      rangeRow.appendChild(minI); rangeRow.appendChild(maxI);
      group.appendChild(rangeRow);
    }
    filterBar.appendChild(group);
  });
  const clearBtn = document.createElement('button'); clearBtn.textContent='Clear Filters';
  clearBtn.style.cssText = 'padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:12px;cursor:pointer;font-family:var(--sans);';
  clearBtn.addEventListener('click', ()=>{
    Object.keys(filterState).forEach(k=>delete filterState[k]);
    filterBar.querySelectorAll('input').forEach(i=>{ i.value=''; });
    filterBar.querySelectorAll('select').forEach(s=>{ s.value=''; });
    render();
  });
  filterBar.appendChild(clearBtn);

  const table = document.createElement('table'); table.style.width='100%';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  columns.forEach(col=>{ const th=document.createElement('th'); th.textContent=col.label; if(col.align==='left') th.classList.add('left'); if(DEF_COL_KEYS.includes(col.key)) th.classList.add('defcol'); appendDefIcon(th, col.def || STAT_DEFINITIONS[col.key]); trh.appendChild(th); });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody'); table.appendChild(tbody);
  const countDiv = document.createElement('div'); countDiv.style.cssText='font-size:11.5px;color:var(--sub);margin:2px 0 6px;';

  function passes(row){
    return columns.every(col=>{
      const f = filterState[col.key];
      if(f===undefined || f===null || f==='') return true;
      const val = row.filterValues[col.key];
      if(col.type==='text'){ if(val===null||val===undefined) return false; return String(val).toLowerCase().includes(String(f).toLowerCase()); }
      if(col.type==='select'){ return String(val)===String(f); }
      if(col.type==='numRange'){
        if(val===null||val===undefined) return false;
        if(f.min!==null && f.min!==undefined && val<f.min) return false;
        if(f.max!==null && f.max!==undefined && val>f.max) return false;
        return true;
      }
      return true;
    });
  }

  function render(){
    tbody.innerHTML='';
    const filtered = dataRows.filter(passes);
    filtered.forEach(row=>{
      const tr = document.createElement('tr');
      columns.forEach((col,i)=>{
        const td = document.createElement('td');
        if(col.align==='left') td.classList.add('left');
        if(DEF_COL_KEYS.includes(col.key)) td.classList.add('defcol');
        td.style.padding='5px 8px'; td.style.borderBottom='1px solid var(--line)'; td.style.fontSize='12.5px';
        if(col.align!=='left') td.style.textAlign='center';
        const cell = row.cells[i];
        if(cell instanceof Node) td.appendChild(cell); else td.textContent = (cell===undefined||cell===null) ? '\u2014' : cell;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    countDiv.textContent = `${filtered.length} / ${dataRows.length} rows shown`;
  }

  wrapDiv.appendChild(filterBar);
  wrapDiv.appendChild(countDiv);
  wrapDiv.appendChild(table);
  container.appendChild(wrapDiv);
  render();
}

function resultBadge(hr){
  const span = document.createElement('span'); span.className='result neutral';
  span.style.display='inline-block'; span.style.padding='2px 8px'; span.style.borderRadius='4px'; span.style.fontSize='12px';
  if(!hr || !hr.found){ span.textContent='no data'; return span; }
  const pct = Math.round(hr.rate*100);
  if(hr.gp===0){ span.textContent='no games'; return span; }
  if(hr.rate >= 0.6){
    span.className = pct>=96 ? 'result gold' : 'result green';
    span.textContent = `${hr.hits}/${hr.gp} (${pct}% OVER)`;
  } else if(hr.rate <= 0.4){
    const underPct = 100-pct;
    span.className = underPct>=96 ? 'result gold' : 'result red';
    span.textContent = `${hr.hits}/${hr.gp} (${underPct}% UNDER)`;
  } else {
    span.className='result neutral'; span.textContent = `${hr.hits}/${hr.gp} (${pct}%)`;
  }
  return span;
}

// Shows L5/L10/L15 hit rates side by side (not just whichever window is currently selected via
// the sticky bar) -- every bet on the Odds page shows all three, each with its record in
// parentheses, so you can see at a glance whether a bet is consistent across windows or only

function singleWindowChip(lbl, hr){
  const chip = document.createElement('span'); chip.style.cssText = 'font-size:10.5px;white-space:nowrap;padding:1px 5px;border-radius:3px;display:inline-block;';
  if(!hr || !hr.found || hr.gp===0){
    chip.style.color = 'var(--sub)'; chip.style.background = '#f0f2f6';
    chip.textContent = lbl ? `${lbl}: \u2014` : '\u2014';
  } else {
    const pct = Math.round(hr.rate*100);
    chip.textContent = lbl ? `${lbl}: ${pct}% (${hr.hits}/${hr.gp})` : `${pct}% (${hr.hits}/${hr.gp})`;
    if(hr.rate>=0.6){ chip.style.color = 'var(--green)'; chip.style.background = 'var(--greenbg)'; }
    else if(hr.rate<=0.4){ chip.style.color = 'var(--red)'; chip.style.background = 'var(--redbg)'; }

async function fetchJson(url, options){
  const resp = await fetch(url, options);
  if(!resp.ok){

  }
  return resp.json();
}

// ---- Shared Worker URL persistence + default, used by both the Home page and the Odds page ----
const WORKER_URL_LS_KEY = 'wnba_odds_worker_url';
// Baked-in default Worker URL — since this is just an address (not a secret; your real API
// key lives inside the Worker's environment now), it's safe to hardcode so every device

// ---- Auth token persistence, used by Bet Tracker's login/signup gate ----
// Unlike the Worker URL above, this genuinely is sensitive (it's what proves who you are to
// the Worker) -- it lives only in this browser's localStorage, is never baked into the app,
// and is sent only to your own Worker over HTTPS, never anywhere else.
const AUTH_TOKEN_LS_KEY = 'wnba_auth_token';
const AUTH_EMAIL_LS_KEY = 'wnba_auth_email';
const AUTH_VERIFIED_LS_KEY = 'wnba_auth_verified';
const AUTH_ADMIN_LS_KEY = 'wnba_auth_admin';
const AUTH_USERNAME_LS_KEY = 'wnba_auth_username';
const AUTH_FIRSTNAME_LS_KEY = 'wnba_auth_firstname';
const AUTH_LASTNAME_LS_KEY = 'wnba_auth_lastname';
const AUTH_BIRTHDAY_LS_KEY = 'wnba_auth_birthday';
function getAuthToken(){ return localStorage.getItem(AUTH_TOKEN_LS_KEY); }
function getAuthEmail(){ return localStorage.getItem(AUTH_EMAIL_LS_KEY); }
function isEmailVerified(){ return localStorage.getItem(AUTH_VERIFIED_LS_KEY) === '1'; }
function isAdminUser(){ return localStorage.getItem(AUTH_ADMIN_LS_KEY) === '1'; }
function getAuthUsername(){ return localStorage.getItem(AUTH_USERNAME_LS_KEY); }
function getAuthFirstName(){ return localStorage.getItem(AUTH_FIRSTNAME_LS_KEY); }
function getAuthLastName(){ return localStorage.getItem(AUTH_LASTNAME_LS_KEY); }
function getAuthBirthday(){ return localStorage.getItem(AUTH_BIRTHDAY_LS_KEY); }
function setAuthSession(token, email, emailVerified, isAdmin, profile){
  localStorage.setItem(AUTH_TOKEN_LS_KEY, token);
  localStorage.setItem(AUTH_EMAIL_LS_KEY, email);
  // emailVerified/isAdmin/profile are optional (some callers, like changePassword, don't know/
  // change them) -- when omitted, leave whatever was already stored alone rather than silently
  // resetting it.
  if(emailVerified !== undefined){
    localStorage.setItem(AUTH_VERIFIED_LS_KEY, emailVerified ? '1' : '0');
  }
  if(isAdmin !== undefined){
    localStorage.setItem(AUTH_ADMIN_LS_KEY, isAdmin ? '1' : '0');
  }
  if(profile){
    if(profile.username !== undefined) localStorage.setItem(AUTH_USERNAME_LS_KEY, profile.username || '');
    if(profile.firstName !== undefined) localStorage.setItem(AUTH_FIRSTNAME_LS_KEY, profile.firstName || '');
    if(profile.lastName !== undefined) localStorage.setItem(AUTH_LASTNAME_LS_KEY, profile.lastName || '');
    if(profile.birthday !== undefined) localStorage.setItem(AUTH_BIRTHDAY_LS_KEY, profile.birthday || '');
  }
}
function clearAuthSession(){
  localStorage.removeItem(AUTH_TOKEN_LS_KEY);
  localStorage.removeItem(AUTH_EMAIL_LS_KEY);
  localStorage.removeItem(AUTH_VERIFIED_LS_KEY);
  localStorage.removeItem(AUTH_ADMIN_LS_KEY);
  localStorage.removeItem(AUTH_USERNAME_LS_KEY);
  localStorage.removeItem(AUTH_FIRSTNAME_LS_KEY);
  localStorage.removeItem(AUTH_LASTNAME_LS_KEY);
  localStorage.removeItem(AUTH_BIRTHDAY_LS_KEY);
}
function isLoggedIn(){ return !!getAuthToken(); }
// Merges an Authorization header onto whatever headers a call already wants to send --
// spread this INTO the headers object of any fetchJson() call that hits an auth-gated route.
function authHeaders(){
  const token = getAuthToken();
  return token ? {'Authorization': `Bearer ${token}`} : {};
}

  // Captures the WHOLE table -- every row and every column, including ones off-screen or
  // requiring horizontal scroll to see live -- not just what's currently visible in the
  // viewport. Works by cloning the table off-screen at its natural full content width
  // (width:max-content, overflow:visible -- overriding .table-wrap's own overflow-x:auto,
  // which would otherwise clip the capture to whatever width happens to be on screen).
  async function downloadFullTableScreenshot(container, filenamePrefix, btn){
    if(typeof html2canvas === 'undefined'){ alert('Screenshot library didn\u2019t load \u2014 check your internet connection and try again.'); return; }
    const wrap = container.querySelector('.table-wrap');
    if(!wrap){ alert('Nothing to screenshot yet \u2014 wait for the table to load first.'); return; }
    const origText = btn.textContent; btn.disabled = true; btn.textContent = 'Capturing\u2026';
    try{
      const clone = wrap.cloneNode(true);
      clone.style.cssText = 'position:fixed;top:-99999px;left:0;background:var(--panel);padding:12px;width:max-content;max-width:none;overflow:visible;';
      // html2canvas can't reliably render position:sticky (it doesn't do a full browser
      // layout/scroll simulation) -- the header cells were coming out at the bottom of the
      // capture instead of the top. Sticky-while-scrolling serves no purpose in a static
      // screenshot anyway, so force every header cell in the CLONE ONLY to its normal
      // top-of-table position before capturing.
      clone.querySelectorAll('thead th').forEach(th=>{ th.style.position = 'static'; th.style.top = 'auto'; });
      document.body.appendChild(clone);
      const canvas = await html2canvas(clone, {backgroundColor:'#ffffff', scale:2});
      document.body.removeChild(clone);
      const link = document.createElement('a');
      link.download = `wnba-${filenamePrefix}-bets-${new Date().toISOString().slice(0,10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(e){
      alert('Screenshot failed: ' + e.message);
    }
    btn.disabled = false; btn.textContent = origText;
  }
  stdBtn.addEventListener('click', ()=>downloadFullTableScreenshot(contentDiv, 'standard', stdBtn));
  advBtn.addEventListener('click', ()=>downloadFullTableScreenshot(contentDiv2, 'advanced', advBtn));

  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;

  try{
    const events = await fetchCachedOddsEvents();
    if(!events || events.length===0){
      statusDiv.textContent = 'DraftKings has no WNBA games listed right now.';
      return;
    }
    const todayStr = new Date().toDateString();
    const todaysGames = events.filter(ev => new Date(ev.commence_time).toDateString() === todayStr);
    if(todaysGames.length===0){
      statusDiv.textContent = 'No games scheduled for today among what DraftKings currently has listed.';
      return;
    }

    statusDiv.textContent = `Found ${todaysGames.length} game(s) today \u2014 fetching player props and team totals\u2026`;
    const cachedForToday = [];
    for(const ev of todaysGames){
      let detail = null;
      try{
        detail = await fetchCachedOddsDetail(ev.id);
      }catch(e){ console.warn('Detail fetch failed for', ev.id, e); }
      cachedForToday.push({ev, detail});
    }
    const liveGames = await fetchLiveGamesToday();

    // Recomputes and re-renders both tables for whichever book is currently selected, using
    // the SAME cached fetch (which already has all 6 books in it) -- no new API call needed
    // just to switch books, only for the Refresh button.
    recompute = function(){
      const todayStrForStars = new Date().toDateString();
      const nowForStars = new Date();
      const todaysGamesForStars = cachedForToday.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStrForStars && isEligibleForTopBets(ev, nowForStars));
      const stdKeysSet = new Set(computeStandardTopBets(cachedForToday, 30, selectedBook).topBets.map(betIdentityKey).filter(Boolean));
      const advKeysSet = new Set(buildAdvancedEdgeCandidates(todaysGamesForStars, selectedBook).slice(0, 30).map(betIdentityKey).filter(Boolean));
      const sharedKeys = new Set([...stdKeysSet].filter(k => advKeysSet.has(k)));
      renderTopBetsTable(contentDiv, cachedForToday, 30, liveGames, sharedKeys, selectedBook);
      renderAdvancedTopBetsTable(contentDiv2, cachedForToday, 30, liveGames, sharedKeys, selectedBook);
    };
    recompute();
    maybeSnapshotTodaysTopBets(cachedForToday); // fire-and-forget; see its own comment for the noon-ET logic
    statusDiv.textContent = `Showing today\u2019s top bets across ${todaysGames.length} game(s). Tap Refresh to pull the latest lines again.`;
  }catch(e){
    statusDiv.textContent = `Couldn\u2019t load today\u2019s bets: ${e.message}. Double-check your Worker URL is reachable, or visit the Live Lines page directly.`;
  }
}
