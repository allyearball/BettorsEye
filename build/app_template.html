// Extracts which book(s) an outcome's price actually came from -- populated by
// getBookmakerData's 'best' synthesis (_bestBooks). Falls back to DraftKings' label if this
// candidate wasn't built from Best-mode data (shouldn't normally happen once wired in, but
// keeps this safe rather than showing "undefined" if called on non-synthesized data).
function bookSourceLabel(outcome, fallbackBook){
  if(!outcome) return null;
  if(outcome._bestBooks && outcome._bestBooks.length) return bestBooksLabel(outcome._bestBooks);
  return BOOK_LABELS[fallbackBook] || null;
}
// Combines Over/Under sportsbook sourcing into one cell -- in Best mode, the over and under
// sides can legitimately come from different books, so this shows both distinctly rather than
// picking one arbitrarily.
function propSportsbookText(overO, underO, selectedBook){
  const o = overO ? bookSourceLabel(overO, selectedBook) : null;
  const u = underO ? bookSourceLabel(underO, selectedBook) : null;
  if(o && u && o!==u) return `O: ${o} / U: ${u}`;
  return o || u || '\u2014';
}

function gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL, bookForFallback){
  // Qualification bar: a specific side of a bet (Over/Under, team ML, team spread) must clear
  // QUAL hit rate in BOTH the last-10-game window and the last-15-game window (fixed windows,
  // independent of the page-level hit-rate selector above) to be eligible.
  const candidates = []; // {label, price, rate10, rate15, ...structured fields for the bet tracker}
  const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
  const gameDate = toEasternDateStr(ev.commence_time);

  // Moneyline (own-side only; the opposing team's high win rate already shows up as their own ML leg)
  [{short:awayShort, full:ev.away_team, opp:homeShort, outcome:dkOutcome(gameMarkets['h2h'], ev.away_team)},
   {short:homeShort, full:ev.home_team, opp:awayShort, outcome:dkOutcome(gameMarkets['h2h'], ev.home_team)}].forEach(side=>{
    if(!side.outcome) return;
    const r5 = teamMoneylineHitRate(side.short, 5), r10 = teamMoneylineHitRate(side.short, 10), r15 = teamMoneylineHitRate(side.short, 15), rAll = teamMoneylineHitRate(side.short, 'all');
    if(r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
      candidates.push({label:`${side.full} Moneyline`, price:side.outcome.price, sportsbook:bookSourceLabel(side.outcome, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'moneyline', team:side.short, opponent:side.opp, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
  });

  // Spread (own-side only, same reasoning as moneyline)
  [{short:awayShort, full:ev.away_team, opp:homeShort, outcome:dkOutcome(gameMarkets['spreads'], ev.away_team)},
   {short:homeShort, full:ev.home_team, opp:awayShort, outcome:dkOutcome(gameMarkets['spreads'], ev.home_team)}].forEach(side=>{
    if(!side.outcome) return;
    const pt = side.outcome.point;
    const r5 = teamSpreadHitRate(side.short, pt, 5), r10 = teamSpreadHitRate(side.short, pt, 10), r15 = teamSpreadHitRate(side.short, pt, 15), rAll = teamSpreadHitRate(side.short, pt, 'all');
    if(r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
      candidates.push({label:`${side.full} ${pt>0?'+':''}${pt}`, price:side.outcome.price, sportsbook:bookSourceLabel(side.outcome, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'spread', team:side.short, opponent:side.opp, line:pt, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
  });

  // Full-game Total, both sides -- TEMPORARILY DISABLED (not just in Standard, but everywhere
  // this function is used: Standard Top 30, Advanced Top 30, Parlay Recommendations) pending a
  // fix to the underlying hit-rate methodology, which currently uses only one team's own game
  // log as a proxy for a bet that's actually about both teams' combined score. Team Totals
  // (a single team's own points, betType 'team_total') are a completely different code path
  // below and are unaffected. Re-enable by un-commenting this block once that's fixed.
  /*
  (()=>{
    const market = gameMarkets['totals']; if(!market) return;
    const over = dkOutcome(market,'Over'), under = dkOutcome(market,'Under');
    const point = over ? over.point : (under ? under.point : undefined);
    if(point===undefined) return;
    const r10 = teamTotalHitRate(awayShort, point, 10), r15 = teamTotalHitRate(awayShort, point, 15);
    const r5 = teamTotalHitRate(awayShort, point, 5); const rAll = teamTotalHitRate(awayShort, point, 'all');
    if(over && r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
      candidates.push({label:`Game Total Over ${point}`, price:over.price, sportsbook:bookSourceLabel(over, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'total', team:awayShort, opponent:homeShort, line:point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
    if(under && r10.gp>0 && r15.gp>0 && (1-r10.rate)>=QUAL && (1-r15.rate)>=QUAL){
      candidates.push({label:`Game Total Under ${point}`, price:under.price, sportsbook:bookSourceLabel(under, bookForFallback), rate5:1-r5.rate, rate10:1-r10.rate, rate15:1-r15.rate, rateAll:1-rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
        betType:'total', team:awayShort, opponent:homeShort, line:point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
    }
  })();
  */


  // Team Totals (full game), both sides, both teams
  (()=>{
    const market = detailMarkets['team_totals']; if(!market) return;
    [{short:awayShort, full:ev.away_team, opp:homeShort},{short:homeShort, full:ev.home_team, opp:awayShort}].forEach(side=>{
      const over = market.outcomes.find(o=>o.name==='Over' && o.description===side.full);
      const under = market.outcomes.find(o=>o.name==='Under' && o.description===side.full);
      const point = over ? over.point : (under ? under.point : undefined);
      if(point===undefined) return;
      const r10 = teamOwnTotalHitRate(side.short, point, 10), r15 = teamOwnTotalHitRate(side.short, point, 15);
      const r5 = teamOwnTotalHitRate(side.short, point, 5); const rAll = teamOwnTotalHitRate(side.short, point, 'all');
      if(over && r10.gp>0 && r15.gp>0 && r10.rate>=QUAL && r15.rate>=QUAL){
        candidates.push({label:`${side.full} Team Total Over ${point}`, price:over.price, sportsbook:bookSourceLabel(over, bookForFallback), rate5:r5.rate, rate10:r10.rate, rate15:r15.rate, rateAll:rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
          betType:'team_total', team:side.short, opponent:side.opp, line:point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
      if(under && r10.gp>0 && r15.gp>0 && (1-r10.rate)>=QUAL && (1-r15.rate)>=QUAL){
        candidates.push({label:`${side.full} Team Total Under ${point}`, price:under.price, sportsbook:bookSourceLabel(under, bookForFallback), rate5:1-r5.rate, rate10:1-r10.rate, rate15:1-r15.rate, rateAll:1-rAll.rate, gp5:r5.gp, gp10:r10.gp, gp15:r15.gp, gpAll:rAll.gp,
          betType:'team_total', team:side.short, opponent:side.opp, line:point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
    });
  })();

  // Player props, both sides, all four base markets
  const MIN_GP_10 = 6;  // 60% of a 10-game window
  const MIN_GP_15 = 9;  // 60% of a 15-game window
  // P+R+A included: everything downstream already understood the 'pra' stat key -- statValue(),
  // hitRateFor(), multiWindowStats() for the EMA tiebreak, the DvP indices, defence ranks, live
  // in-game scoring and grading all handle it. The ONLY reason the app never recommended a
  // Pts+Reb+Ast bet was that this market list didn't ask the book for one.
  ['player_points','player_rebounds','player_assists','player_threes','player_points_rebounds_assists','player_points_rebounds','player_points_assists','player_rebounds_assists'].forEach(mkey=>{
    const market = detailMarkets[mkey]; if(!market) return;
    const statKey = PROP_MARKET_TO_STAT[mkey];
    const players = [...new Set(market.outcomes.map(o=>o.description))];
    players.forEach(pname=>{
      const overO = market.outcomes.find(o=>o.description===pname && o.name==='Over');
      const underO = market.outcomes.find(o=>o.description===pname && o.name==='Under');
      const line = (overO||underO||{}).point;
      if(line===undefined) return;
      const team = findPlayerTeam(pname, homeShort, awayShort);
      if(!team) return;
      const opponent = team===homeShort ? awayShort : homeShort;
      const overThreshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
      const r5 = hitRateFor(pname, team, statKey, line, 5), r10 = hitRateFor(pname, team, statKey, line, 10), r15 = hitRateFor(pname, team, statKey, line, 15), rAll = hitRateFor(pname, team, statKey, line, 'all');
      if(!r10 || !r15) return;
      // require she actually played at least 60% of the games in BOTH windows (6-of-10, 9-of-15) —
      // otherwise a small-sample player (e.g. 2 games played all year) can slip through on a fluke rate
      if(r10.gp < MIN_GP_10 || r15.gp < MIN_GP_15) return;
      if(overO && r10.rate>=QUAL && r15.rate>=QUAL){
        candidates.push({label:`${pname} Over ${line} ${PROP_MARKET_LABEL[mkey]}`, price:overO.price, sportsbook:bookSourceLabel(overO, bookForFallback), rate5:r5?r5.rate:null, rate10:r10.rate, rate15:r15.rate, rateAll:rAll?rAll.rate:null, gp5:r5?r5.gp:0, gp10:r10.gp, gp15:r15.gp, gpAll:rAll?rAll.gp:0,
          betType:'player_prop', team, opponent, player:pname, statKey, market:PROP_MARKET_LABEL[mkey], line, side:'over', thresholdToHit:overThreshold, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
      if(underO && (1-r10.rate)>=QUAL && (1-r15.rate)>=QUAL){
        candidates.push({label:`${pname} Under ${line} ${PROP_MARKET_LABEL[mkey]}`, price:underO.price, sportsbook:bookSourceLabel(underO, bookForFallback), rate5:r5?1-r5.rate:null, rate10:1-r10.rate, rate15:1-r15.rate, rateAll:rAll?1-rAll.rate:null, gp5:r5?r5.gp:0, gp10:r10.gp, gp15:r15.gp, gpAll:rAll?rAll.gp:0,
          betType:'player_prop', team, opponent, player:pname, statKey, market:PROP_MARKET_LABEL[mkey], line, side:'under', thresholdToHit:overThreshold, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id});
      }
    });
  });

  // sort by worst-case confidence (min of the two windows) descending, so the safest legs lead
  candidates.sort((a,b)=> worstCaseRate(b) - worstCaseRate(a));
  return candidates;
}

// ================= Mock Bet Tracker =================

// Derives opponent, a proper "Away @ Home" label, and venue/location from just a team name
// and a date -- used to backfill bets that are missing this info (e.g. imported from a
// spreadsheet that only recorded the player and line, not who they were playing). Returns null
// if no game is found for that team on that date.
function deriveGameInfo(team, gameDate){
  if(!team || !gameDate || !DATA || !DATA.games) return null;
  const g = Object.values(DATA.games).find(gm => gm.date===gameDate && (gm.home===team || gm.away===team));
  if(!g) return null;
  const opponent = g.home===team ? g.away : g.home;
  const gameLabel = `${g.away} @ ${g.home}`;
  const venue = (DATA.teamVenues && DATA.teamVenues[g.home]) || null;
  const location = venue ? [venue.name, [venue.city, venue.state].filter(Boolean).join(', ')].filter(Boolean).join(' \u2014 ') : null;
  return { opponent, gameLabel, location, homeTeam: g.home, awayTeam: g.away };
}

function findHistoricalGame(team, opponent, gameDate){
  const candidates = Object.values(DATA.games).filter(g=>
    (g.home===team||g.away===team) && (opponent ? (g.home===opponent||g.away===opponent) : true)
  );
  if(candidates.length===0) return null;
  if(gameDate){
    const exact = candidates.find(g=>g.date===gameDate);
    if(exact) return exact;
  }
  // Never fuzzy-match a game that's today or in the future relative to the requested date —
  // there's no historical result to "guess" yet. Without this check, a bet on today's game
  // (no exact match yet, since it hasn't been played/ingested) would silently fall back to the
  // closest PAST meeting between the same two teams (they play each other multiple times a
  // season) and get incorrectly graded against that old game instead of staying pending.
  //
  // "Today" MUST be computed in Eastern, not UTC. WNBA games are date-tagged in US Eastern and
  // tip at 7-10pm ET, which is already the NEXT day in UTC. Using UTC here meant that from 8pm
  // ET onwards every same-day pick saw todayStr roll forward to tomorrow, so `gameDate >=
  // todayStr` went false, the guard stopped firing, and tonight's picks were silently graded
  // against an earlier meeting between the same two teams -- producing real-looking but wrong
  // finals, and a bogus VOID (DNP) for anyone who hadn't played in that older game. Same
  // Eastern-vs-UTC boundary bug the pipeline hit in build.py.
  const todayStr = toEasternDateStr(new Date().toISOString());
  if(gameDate && gameDate >= todayStr) return null;
  if(gameDate){
    candidates.sort((a,b)=> Math.abs(new Date(a.date)-new Date(gameDate)) - Math.abs(new Date(b.date)-new Date(gameDate)));
    // Belt and braces: the fuzzy fallback exists only to heal a gameDate that's off by a day
    // (older stored picks predating the Eastern-time fix). Matching a game further away than
    // that is never "healing" anything -- it's grading against a different fixture, which is
    // exactly the failure above. Anything beyond +/-1 day stays ungraded instead.
    const best = candidates[0];
    const daysApart = Math.abs(new Date(best.date) - new Date(gameDate)) / 86400000;
    if(daysApart > 1) return null;
  }
  return candidates[0];
}

// Grades a single leg (works the same whether it's a standalone straight bet or one leg
// of a parlay). Returns 'won' | 'lost' | 'push' | null (null = can't grade yet).
function gradeLeg(leg){
  // Prefer recomputing the game date fresh from the raw commenceTime timestamp (now using the
  // correct Eastern-time conversion) over trusting leg.gameDate as stored -- picks snapshotted
  // before that fix was in place have a gameDate that's wrong by exactly one day for any late
  // (8pm ET or later) game, which silently blocked them from ever matching. Recomputing here
  // heals every already-stored pick automatically, with no need to touch what's in KV.
  const gameDate = leg.commenceTime ? toEasternDateStr(leg.commenceTime) : leg.gameDate;
  const g = findHistoricalGame(leg.team, leg.opponent, gameDate);
  if(!g) return null;
  const isHome = g.home === leg.team;
  const teamPts = isHome ? g.homeScore : g.awayScore;
  const oppPts = isHome ? g.awayScore : g.homeScore;

  if(leg.betType === 'moneyline'){
    return teamPts>oppPts ? 'won' : (teamPts===oppPts ? 'push' : 'lost');
  }
  if(leg.betType === 'spread'){
    const margin = (teamPts - oppPts) + leg.line;
    return margin>0 ? 'won' : (margin===0 ? 'push' : 'lost');
  }
  if(leg.betType === 'total'){
    const combined = teamPts + oppPts;
    if(leg.side==='over') return combined>leg.line ? 'won' : (combined===leg.line?'push':'lost');
    return combined<leg.line ? 'won' : (combined===leg.line?'push':'lost');
  }
  if(leg.betType === 'team_total'){
    if(leg.side==='over') return teamPts>leg.line ? 'won' : (teamPts===leg.line?'push':'lost');
    return teamPts<leg.line ? 'won' : (teamPts===leg.line?'push':'lost');
  }
  if(leg.betType === 'player_prop' || leg.betType === 'player_prop_alt'){
    const row = g.rows.find(r=>r.player===leg.player && r.team===leg.team);
    // The game itself WAS found at this point (checked above) -- so if this specific player
    // isn't in its box score at all, or is explicitly marked DNP, that's a CONFIRMED outcome
    // (she didn't play, DraftKings would have voided this line), not "still waiting on data."
    // Sportsbooks void player props on a DNP rather than counting them as a loss -- 'void' is
    // a distinct result from 'pending' so it doesn't sit unresolved forever.
    if(!row || row.dnp) return 'void';
    const val = statValue(row, leg.statKey);
    if(val===null || val===undefined) return 'void'; // game found, player found, but this specific stat is missing -- same treatment as DNP, not a guess
    const threshold = leg.thresholdToHit!==undefined ? leg.thresholdToHit : leg.line;
    if(leg.side==='under') return val<threshold ? 'won' : 'lost';
    return val>=threshold ? 'won' : 'lost';
  }
  return null;
}

// Companion to gradeLeg: given a bet that's already resolved (or resolvable), returns a
// human-readable string of the actual final value that determined the outcome \u2014 the final
// score for game-level bets, her actual final stat line for player props. Returns null if the
// game can't be found (still not played, or genuinely no data) rather than guessing.
function computeFinalValueLabel(bet){
  // Same fix as gradeLeg: recompute the date fresh from commenceTime rather than trusting a
  // possibly-stale stored gameDate (wrong by a day for any 8pm-ET-or-later game, pre-fix).
  const gameDate = bet.commenceTime ? toEasternDateStr(bet.commenceTime) : bet.gameDate;
  const g = findHistoricalGame(bet.team, bet.opponent, gameDate);
  if(!g) return null;
  const isHome = g.home === bet.team;
  const teamPts = isHome ? g.homeScore : g.awayScore;
  const oppPts = isHome ? g.awayScore : g.homeScore;

  if(bet.betType === 'moneyline'){
    return `Final: ${bet.team} ${teamPts} \u2013 ${bet.opponent} ${oppPts}`;
  }
  if(bet.betType === 'spread'){
    const margin = teamPts - oppPts;
    return `Final: ${bet.team} ${teamPts} \u2013 ${bet.opponent} ${oppPts} (margin ${margin>0?'+':''}${margin})`;
  }
  if(bet.betType === 'total'){
    return `Final total: ${teamPts + oppPts}`;
  }
  if(bet.betType === 'team_total'){
    return `Final: ${bet.team} scored ${teamPts}`;
  }
  if(bet.betType === 'player_prop' || bet.betType === 'player_prop_alt'){
    const row = g.rows.find(r=>r.player===bet.player && r.team===bet.team);
    if(!row) return null;
    if(row.dnp) return 'DNP';
    const val = statValue(row, bet.statKey);
    if(val===null || val===undefined) return null;
    return `Final: ${val} ${STAT_SHORT_LABEL[bet.statKey] || bet.statKey.toUpperCase()}`;
  }
  return null;
}

// Grades a tracked entry — a straight bet (single implicit leg, using the bet's own
// top-level fields) or a parlay (bet.legs array; wins only if every leg wins, pushes
// are treated as removed/neutral per standard parlay rules, still pending if any leg
// hasn't resolved yet). Returns 'won' | 'lost' | 'push' | 'void' | null.
function gradeTrackedBet(bet){
  if(bet.isParlay && Array.isArray(bet.legs)){
    const results = bet.legs.map(gradeLeg);
    if(results.some(r=>r==='lost')) return 'lost';
    // A voided leg in a real sportsbook parlay gets stripped out and the parlay recalculates
    // with what's left -- that logic isn't built yet, so a voided leg is conservatively
    // treated the same as "still waiting" for now rather than silently mis-grading the parlay.
    if(results.some(r=>r===null || r==='void')) return null;
    if(results.every(r=>r==='push')) return 'push';
    return 'won'; // rest are won/push, none lost, none pending
  }
  return gradeLeg(bet);
}

function americanPayoutProfit(price, stake){
  const dec = americanToDecimal(price);
  if(!dec) return 0;
  return stake * (dec - 1);
}

      if(pw1.value.length < 8){ err.textContent = 'Password must be at least 8 characters.'; return; }
      if(pw1.value !== pw2.value){ err.textContent = 'Passwords don\u2019t match.'; return; }
      btn.disabled = true; btn.textContent = 'Please wait\u2026';
      try{
        const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
        const result = await fetchJson(`${workerBase}/auth/set-initial-password`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, newPassword: pw1.value})});
        setAuthSession(result.token, result.email);
        onSuccess();
      }catch(e){
        err.textContent = extractErrorMessage(e);
        btn.disabled = false; btn.textContent = 'Set Password';
      }
    });
    wrap.appendChild(t); wrap.appendChild(s); wrap.appendChild(pw1); wrap.appendChild(pw2); wrap.appendChild(err); wrap.appendChild(btn);
  }

  async function attempt(){
    errorDiv.textContent = '';
    const email = emailInput.value.trim();
    const password = pwInput.value;
    if(!email || !password){ errorDiv.textContent = 'Enter an email and password.'; return; }
    primaryBtn.disabled = true; const origText = primaryBtn.textContent; primaryBtn.textContent = 'Please wait\u2026';
    try{
      const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
      if(mode==='signup'){
        const body = {
          email, password,
          username: usernameInput.value.trim(), firstName: firstNameInput.value.trim(),
          lastName: lastNameInput.value.trim(), birthday: birthdayInput.value,
        };
        const result = await fetchJson(`${workerBase}/auth/signup`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        setAuthSession(result.token, result.email, result.emailVerified, result.isAdmin, {username: result.username, firstName: result.firstName, lastName: result.lastName, birthday: result.birthday});
        onSuccess();
        return;
      } else {
        const result = await fetchJson(`${workerBase}/auth/login`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password})});
        if(result.needsPasswordSetup){
          showPasswordSetupPrompt(result.email);
          return;
        }
        setAuthSession(result.token, result.email, result.emailVerified, result.isAdmin, {username: result.username, firstName: result.firstName, lastName: result.lastName, birthday: result.birthday});
        onSuccess();
        return;
      }
    }catch(e){
      errorDiv.textContent = extractErrorMessage(e);
    }
    primaryBtn.disabled = false; primaryBtn.textContent = origText;
  }

  primaryBtn.addEventListener('click', attempt);
  pwInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') attempt(); });

  const forgotLink = document.createElement('a');
  forgotLink.href = 'javascript:void(0)'; forgotLink.className = 'player-link';
  forgotLink.textContent = 'Forgot password?';
  forgotLink.style.cssText = 'display:inline-block;margin-top:12px;font-size:12.5px;';

  const forgotWrap = document.createElement('div');
  forgotWrap.style.cssText = 'display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);';
  const forgotSub = document.createElement('div'); forgotSub.className = 'footnote'; forgotSub.style.marginBottom = '10px';
  forgotSub.textContent = 'Enter your account email and we\u2019ll send a link to reset your password.';
  const forgotEmailInput = document.createElement('input');
  forgotEmailInput.type = 'email'; forgotEmailInput.placeholder = 'Email'; forgotEmailInput.autocomplete = 'email';
  forgotEmailInput.style.cssText = emailInput.style.cssText;
  const forgotStatus = document.createElement('div');
  forgotStatus.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';
  const forgotBtn = document.createElement('button'); forgotBtn.className = 'addbtn'; forgotBtn.textContent = 'Send Reset Link';

  forgotLink.addEventListener('click', ()=>{
    forgotWrap.style.display = forgotWrap.style.display === 'none' ? 'block' : 'none';
  });
  forgotBtn.addEventListener('click', async ()=>{
    forgotStatus.style.color = 'var(--sub)';
    const email = forgotEmailInput.value.trim();
    if(!email){ forgotStatus.style.color = '#b3261e'; forgotStatus.textContent = 'Enter your email.'; return; }
    forgotBtn.disabled = true; forgotBtn.textContent = 'Sending\u2026';
    try{
      const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
      const result = await fetchJson(`${workerBase}/auth/forgot-password`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email})});
      forgotStatus.style.color = 'var(--green)';
      forgotStatus.textContent = result.message || 'If an account exists with that email, a reset link has been sent.';
    }catch(e){
      forgotStatus.style.color = '#b3261e';
      forgotStatus.textContent = extractErrorMessage(e);
    }
    forgotBtn.disabled = false; forgotBtn.textContent = 'Send Reset Link';
  });

  forgotWrap.appendChild(forgotSub);
  forgotWrap.appendChild(forgotEmailInput);
  forgotWrap.appendChild(forgotStatus);
  forgotWrap.appendChild(forgotBtn);

  wrap.appendChild(emailInput);
  wrap.appendChild(pwInput);
  wrap.appendChild(signupFieldsWrap);
  wrap.appendChild(errorDiv);
  wrap.appendChild(btnRow);
  // toggleLink (switches to Sign Up mode) intentionally not appended -- self-signup is hidden
  // for now, per request. The form stays permanently in 'login' mode (its default), which also
  // still correctly handles the "set your password" prompt for admin-created accounts. The
  // signup backend endpoint itself is untouched, just unreachable from this UI.
  wrap.appendChild(document.createElement('br'));
  wrap.appendChild(forgotLink);
  wrap.appendChild(forgotWrap);
  container.appendChild(wrap);
}

function renderAdminPage(){

  removeGameWindowStickyBar();

    renderAuthGate(main, ()=>renderAdminPage());

  }

  main.appendChild(head);

  const backLink = document.createElement('a'); backLink.href='javascript:void(0)'; backLink.className='backbtn';
  backLink.textContent = '\u2190 Back to Bet Tracker';
  backLink.addEventListener('click', ()=>renderBetTrackerPage());
  main.appendChild(backLink);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.marginBottom='14px';
  statusDiv.textContent = 'Loading users\u2026';
  main.appendChild(statusDiv);

  createTitle.textContent = 'Create User';
  const createNote = document.createElement('div'); createNote.className = 'footnote'; createNote.style.marginBottom = '14px';
  createNote.textContent = 'No password needed here \u2014 they set their own the first time they log in with this email (any password value on that first attempt triggers a "create your password" prompt).';
  function styledInput(placeholder, type){
    const inp = document.createElement('input');
    inp.type = type || 'text'; inp.placeholder = placeholder;
    inp.style.cssText = 'width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--sans);box-sizing:border-box;display:block;';
    return inp;
  }
  const cEmail = styledInput('Email', 'email');
  const cUsername = styledInput('Username (3-20 chars, letters/numbers/underscore)');
  const cFirst = styledInput('First Name');
  const cLast = styledInput('Last Name (optional)');
  const cBirthdayLabel = document.createElement('div'); cBirthdayLabel.className='footnote'; cBirthdayLabel.style.cssText='margin:-4px 0 4px;';
  cBirthdayLabel.textContent = 'Birthday';
  const cBirthday = styledInput('', 'date');
  const createStatus = document.createElement('div'); createStatus.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';
  const createBtn = document.createElement('button'); createBtn.className = 'addbtn'; createBtn.textContent = 'Create User';
  createBtn.addEventListener('click', async ()=>{
    createStatus.style.color = '#b3261e'; createStatus.textContent = '';
    if(!cEmail.value.trim() || !cUsername.value.trim() || !cFirst.value.trim() || !cBirthday.value){
      createStatus.textContent = 'Email, username, first name, and birthday are all required.'; return;
    }
    createBtn.disabled = true; createBtn.textContent = 'Creating\u2026';
    try{
      const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
      const result = await fetchJson(`${workerBase}/admin/create-user`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({
        email: cEmail.value.trim(), username: cUsername.value.trim(), firstName: cFirst.value.trim(), lastName: cLast.value.trim(), birthday: cBirthday.value,
      })});
      if(result.error) throw new Error(result.error);
      if(result.emailSent){
        createStatus.style.color = 'var(--green)';
        createStatus.textContent = `Created and invite email sent to ${result.email}.`;
      } else if(result.setupUrl){
        createStatus.style.color = '#b3261e';
        createStatus.textContent = `Account created for ${result.email}, but the invite email failed to send (${result.emailError || 'unknown error'}). Copy the link below and send it to them yourself instead:`;
        const linkRow = document.createElement('div'); linkRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin-top:8px;';
        const linkInput = document.createElement('input'); linkInput.type='text'; linkInput.readOnly = true; linkInput.value = result.setupUrl;
        linkInput.style.cssText = 'flex:1;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:monospace;background:#f4f5f7;';
        const copyBtn = document.createElement('button'); copyBtn.textContent = 'Copy'; copyBtn.className = 'addbtn';
        copyBtn.addEventListener('click', async ()=>{
          try{ await navigator.clipboard.writeText(result.setupUrl); copyBtn.textContent = 'Copied!'; setTimeout(()=>{ copyBtn.textContent = 'Copy'; }, 1500); }
          catch(e){ linkInput.select(); }
        });
        linkRow.appendChild(linkInput); linkRow.appendChild(copyBtn);
        createStatus.appendChild(document.createElement('br'));
        createStatus.appendChild(linkRow);
      } else {
        createStatus.style.color = '#b3261e';
        createStatus.textContent = `Account created for ${result.email}, but the invite email failed to send: ${result.emailError || 'unknown error'}. They can still get in \u2014 have them go to the site, click Login/Sign-Up, enter that email and any password, and they\u2019ll be prompted to set their real one.`;
      }
      cEmail.value=''; cUsername.value=''; cFirst.value=''; cLast.value=''; cBirthday.value='';
      await refresh();
    }catch(e){
      createStatus.style.color = '#b3261e';
      createStatus.textContent = extractErrorMessage(e);
    }
    createBtn.disabled = false; createBtn.textContent = 'Create User';
  });
  [createTitle, createNote, cEmail, cUsername, cFirst, cLast, cBirthdayLabel, cBirthday, createStatus, createBtn].forEach(el=>createSec.appendChild(el));
  main.appendChild(createSec);

  const tableDiv = document.createElement('div');
  main.appendChild(tableDiv);

  function extractErrorMessage(err){
    const match = String(err.message||'').match(/\{.*\}/);
    if(match){ try{ const parsed = JSON.parse(match[0]); if(parsed.error) return parsed.error; }catch(_){} }
    return err.message || 'Something went wrong.';
  }

  async function refresh(){
    statusDiv.textContent = 'Loading users\u2026';
    let users;
    try{
      const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
      const result = await fetchJson(`${workerBase}/admin/users`, {headers: authHeaders()});
      users = result.users || [];
    }catch(e){
      statusDiv.textContent = `Couldn\u2019t load users: ${extractErrorMessage(e)}`;
      return;
    }
    statusDiv.textContent = `${users.length} user(s).`;

    tableDiv.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th class="left">Email</th><th class="left">Username</th><th class="left">Name</th><th class="left">Created</th><th>Verified</th><th>Admin</th><th class="left">Locked?</th><th></th></tr>';
    const tbody = document.createElement('tbody');
    table.appendChild(thead); table.appendChild(tbody);
    wrap.appendChild(table); tableDiv.appendChild(wrap);

    const myEmail = getAuthEmail();
    users.forEach(u=>{
      const tr = document.createElement('tr');
      const tdEmail = document.createElement('td'); tdEmail.className='left'; tdEmail.textContent = u.email + (u.email===myEmail ? ' (you)' : '');
      const tdUsername = document.createElement('td'); tdUsername.className='left'; tdUsername.textContent = u.username || '\u2014';
      const tdName = document.createElement('td'); tdName.className='left'; tdName.textContent = [u.first_name, u.last_name].filter(Boolean).join(' ') || '\u2014';
      const tdCreated = document.createElement('td'); tdCreated.className='left'; tdCreated.textContent = (u.created_at||'').slice(0,10);
      const tdVerified = document.createElement('td'); tdVerified.textContent = u.email_verified ? '\u2705' : '\u2014';
      const tdAdmin = document.createElement('td'); tdAdmin.textContent = u.is_admin ? '\ud83d\udee1\ufe0f' : '\u2014';
      const tdLocked = document.createElement('td'); tdLocked.className='left';
      tdLocked.textContent = (u.locked_until && new Date(u.locked_until) > new Date()) ? `Locked until ${new Date(u.locked_until).toLocaleTimeString()}` : '\u2014';

      const tdActions = document.createElement('td'); tdActions.style.cssText='display:flex;gap:8px;';
      const isSelf = u.email === myEmail;

      const adminToggleBtn = document.createElement('button');
      adminToggleBtn.textContent = u.is_admin ? 'Remove Admin' : 'Make Admin';
      adminToggleBtn.style.cssText = 'padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11px;cursor:pointer;font-family:var(--sans);';
      if(isSelf && u.is_admin){ adminToggleBtn.disabled = true; adminToggleBtn.title = 'You can\u2019t remove your own admin status.'; }
      adminToggleBtn.addEventListener('click', async ()=>{
        const makeAdmin = !u.is_admin;
        if(!confirm(`${makeAdmin ? 'Grant' : 'Remove'} admin access ${makeAdmin?'to':'from'} ${u.email}?`)) return;
        try{
          const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
          const result = await fetchJson(`${workerBase}/admin/set-admin`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({userId: u.id, makeAdmin})});
          if(result.error) throw new Error(result.error);
          await refresh();
        }catch(e){ alert(extractErrorMessage(e)); }
      });

      const deleteBtn = document.createElement('button'); deleteBtn.className='rmbtn'; deleteBtn.textContent = '\ud83d\uddd1\ufe0f';
      deleteBtn.title = 'Delete this user and all their data';
      if(isSelf){ deleteBtn.disabled = true; deleteBtn.title = 'You can\u2019t delete your own account here.'; }
      deleteBtn.addEventListener('click', async ()=>{
        if(!confirm(`Permanently delete ${u.email}? This removes their account, sessions, and all tracked bets. This can\u2019t be undone.`)) return;
        try{
          const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
          const result = await fetchJson(`${workerBase}/admin/delete-user`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({userId: u.id})});
          if(result.error) throw new Error(result.error);
          await refresh();
        }catch(e){ alert(extractErrorMessage(e)); }
      });

      const viewBtn = document.createElement('button');
      viewBtn.textContent = '\ud83d\udc41\ufe0f View Data';
      viewBtn.style.cssText = 'padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:11px;cursor:pointer;font-family:var(--sans);';
      viewBtn.addEventListener('click', ()=>showAdminUserBetTrackerModal(u.id, u.email));

      const activityBtn = document.createElement('button');
      activityBtn.textContent = '\ud83d\udcca Activity';
      activityBtn.style.cssText = viewBtn.style.cssText;
      activityBtn.addEventListener('click', ()=>showAdminClickEventsModal(u.id, u.email));

      tdActions.appendChild(adminToggleBtn); tdActions.appendChild(viewBtn); tdActions.appendChild(activityBtn); tdActions.appendChild(deleteBtn);
      [tdEmail, tdUsername, tdName, tdCreated, tdVerified, tdAdmin, tdLocked, tdActions].forEach(td=>tr.appendChild(td));
      tbody.appendChild(tr);
    });
  }

  refresh();
}

function renderSettingsPage(activeTab){
  activeTab = activeTab || 'account';
  lastRender = () => renderSettingsPage(activeTab);
  main.innerHTML = '';
  removeGameWindowStickyBar();

  if(!isLoggedIn()){
    renderAuthGate(main, ()=>renderSettingsPage(activeTab));
    return;
  }

  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\u2699\ufe0f Settings</h2><div class="meta">Manage your account.</div>`;
  main.appendChild(head);
  renderVerifyEmailBanner(main);

  // ---- Tab menu ----
  const tabBar = document.createElement('div');
  tabBar.style.cssText = 'display:flex;gap:8px;margin:14px 0 20px;border-bottom:1px solid var(--line);';
  const tabs = [
    {key:'account', label:'Account Info'},
    {key:'email', label:'Change Email'},
    {key:'password', label:'Change Password'},

  tabs.forEach(t=>{
    const btn = document.createElement('button');
    btn.textContent = t.label;
    const isActive = t.key === activeTab;
    btn.style.cssText = `padding:9px 16px;border:none;border-bottom:3px solid ${isActive?'var(--navy2)':'transparent'};background:none;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:${isActive?'700':'500'};color:${isActive?'var(--navy2)':'var(--sub)'};`;

  function extractErrorMessage(err){
    const match = String(err.message||'').match(/\{.*\}/);
    if(match){ try{ const parsed = JSON.parse(match[0]); if(parsed.error) return parsed.error; }catch(_){} }
    return err.message || 'Something went wrong.';
  }
  function styledInput(type, placeholder, autocomplete){

    inp.type = type; if(placeholder) inp.placeholder = placeholder; if(autocomplete) inp.autocomplete = autocomplete;

  function sectionBox(){

    el.style.cssText = 'max-width:400px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:20px;';
    return el;
  }

  if(activeTab === 'account'){
    const sec = sectionBox();

      {label:'Username', locked:true, value: getAuthUsername() || ''},
      {label:'First Name', key:'firstName', value: getAuthFirstName() || ''},
      {label:'Last Name', key:'lastName', value: getAuthLastName() || '', optional:true},

        setAuthSession(getAuthToken(), getAuthEmail(), undefined, undefined, {firstName: result.firstName, lastName: result.lastName, birthday: result.birthday});

      }

  if(activeTab === 'email'){

    const emailBtn = document.createElement('button'); emailBtn.className = 'addbtn'; emailBtn.textContent = 'Update Email';

      emailStatus.style.color = '#b3261e'; emailStatus.textContent = '';
      if(!newEmailInput.value.trim() || !emailPwInput.value){ emailStatus.textContent = 'Enter a new email and your current password.'; return; }

      try{
        const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
        const result = await fetchJson(`${workerBase}/auth/change-email`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({newEmail: newEmailInput.value.trim(), currentPassword: emailPwInput.value})});
        setAuthSession(getAuthToken(), result.email, result.emailVerified);
        emailStatus.style.color = 'var(--green)'; emailStatus.textContent = 'Email updated.';
        emailCurrent.textContent = `Current: ${result.email}`;

        emailStatus.style.color = '#b3261e';
        emailStatus.textContent = extractErrorMessage(e);
      }
      emailBtn.disabled = false; emailBtn.textContent = 'Update Email';
    });
    emailSec.appendChild(emailCurrent);
    emailSec.appendChild(newEmailInput); emailSec.appendChild(emailPwInput);
    emailSec.appendChild(emailStatus); emailSec.appendChild(emailBtn);
    main.appendChild(emailSec);
  }

    const pwNote = document.createElement('div'); pwNote.className = 'footnote'; pwNote.style.marginBottom = '14px';
    pwNote.textContent = 'Changing your password logs you out everywhere else \u2014 this device stays logged in.';
    const currentPwInput = styledInput('password', 'Current password', 'current-password');
    const newPwInput = styledInput('password', 'New password (min 8 characters)', 'new-password');
    const newPwConfirm = styledInput('password', 'Confirm new password', 'new-password');
    const pwStatus = document.createElement('div'); pwStatus.style.cssText = 'font-size:12.5px;margin-bottom:10px;min-height:16px;';

      pwStatus.style.color = '#b3261e'; pwStatus.textContent = '';
      if(!currentPwInput.value || !newPwInput.value){ pwStatus.textContent = 'Fill in all fields.'; return; }
      if(newPwInput.value.length < 8){ pwStatus.textContent = 'New password must be at least 8 characters.'; return; }
      if(newPwInput.value !== newPwConfirm.value){ pwStatus.textContent = 'New passwords don\u2019t match.'; return; }
      pwBtn.disabled = true; pwBtn.textContent = 'Updating\u2026';
      try{
        const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
        const result = await fetchJson(`${workerBase}/auth/change-password`, {method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({currentPassword: currentPwInput.value, newPassword: newPwInput.value})});
        setAuthSession(result.token, getAuthEmail());
        pwStatus.style.color = 'var(--green)'; pwStatus.textContent = 'Password updated.';
        currentPwInput.value = ''; newPwInput.value = ''; newPwConfirm.value = '';
      }catch(e){
        pwStatus.style.color = '#b3261e';
        pwStatus.textContent = extractErrorMessage(e);
      }
      pwBtn.disabled = false; pwBtn.textContent = 'Update Password';
    });
    pwSec.appendChild(pwNote);
    pwSec.appendChild(currentPwInput); pwSec.appendChild(newPwInput); pwSec.appendChild(newPwConfirm);
    pwSec.appendChild(pwStatus); pwSec.appendChild(pwBtn);
    main.appendChild(pwSec);
  }
}

// Paginated, same reasoning as fetchOddsHistoryCached \u2014 this list can grow by up to ~60
// entries a day (30 Standard + 30 Advanced), so it needs to page from the start rather than
// risk the same 50-subrequest ceiling that broke /history/export before it was fixed.
async function appTrackerListAll(){
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  let all = [];
  let cursor = null;
  let guard = 0;
  while(guard++ < 200){
    const url = cursor ? `${workerBase}/apptracker/list?cursor=${encodeURIComponent(cursor)}` : `${workerBase}/apptracker/list`;
    const page = await fetchJson(url);
    if(page && page.error) throw new Error(page.error);
    all = all.concat(page.records || []);
    if(page.done || !page.cursor) break;
    cursor = page.cursor;
  }
  return all;
}

// Current date/time in US Eastern, regardless of the viewer's own timezone \u2014 "12:00pm ET"
// needs to mean the same moment for everyone, not 12pm in whatever timezone the browser is in.
// Converts a game's commence_time (a UTC ISO timestamp) to the calendar date it actually
// falls on in US Eastern time -- the convention this app's own game data (and ESPN's) uses.
// Naively slicing the first 10 characters of a UTC timestamp gets the UTC date instead, which
// is WRONG for any game starting at 8pm ET or later: that's already past midnight UTC, landing
// on the next calendar day. That mismatch was silently storing tomorrow's date on tonight's
// late games, making findHistoricalGame() treat an already-finished game as "not played yet"
// forever, since it never matched DATA.games' actual (correct) date for that game.
function toEasternDateStr(isoString){
  if(!isoString) return '';
  const d = new Date(isoString);
  if(isNaN(d)) return '';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit',
  }).formatToParts(d);
  const get = t => parts.find(p=>p.type===t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}

function nowInEastern(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false,
  }).formatToParts(new Date());
  const get = t => parseInt(parts.find(p=>p.type===t).value, 10);
  return {
    dateStr: `${get('year')}-${String(get('month')).padStart(2,'0')}-${String(get('day')).padStart(2,'0')}`,
    hour: get('hour'), minute: get('minute'),
  };
}

// ================= Cached odds (backend-cached via Worker cron, not fetched live per page load) =================
// Per the architecture recommendation: a Worker Cron Trigger refreshes these in KV on a fixed

// cache instead of spending an Odds API credit every single time. The Worker still falls back

const _liveBoxscoreCache = {};
async function fetchLiveBoxscoreCached(eventId){
  if(_liveBoxscoreCache[eventId]) return _liveBoxscoreCache[eventId];
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    if(!workerBase) return [];

  }catch(e){ console.warn('Live boxscore fetch failed for', eventId, e); return []; }

function findLiveGameForBet(liveGames, bet){
  if(!bet.team || !bet.opponent) return null;
  return liveGames.find(g =>
    (g.homeShort===bet.team && g.awayShort===bet.opponent) || (g.awayShort===bet.team && g.homeShort===bet.opponent)
  ) || null;
}
function shortPlayerName(fullName){
  if(!fullName) return '';
  const parts = fullName.trim().split(/\s+/);
  if(parts.length<2) return fullName;
  return `${parts[0][0]}. ${parts.slice(1).join(' ')}`;
}
const STAT_SHORT_LABEL = {pts:'PTS', reb:'REB', ast:'AST', tpm:'3PM', pra:'PRA', pr:'P+R', pa:'P+A', ra:'R+A'};
// Synchronous part \u2014 matchup (@ ) and start time (ET), always shown, no live fetch needed.
function buildBetSubLineBase(bet){
  const gameTeams = (bet.game||'').split(' @ ');
  const awayFull = gameTeams[0], homeFull = gameTeams[1];
  const awayShort = SHORT_TEAM_NAME[awayFull] || awayFull;
  const homeShort = SHORT_TEAM_NAME[homeFull] || homeFull;
  const startTimeET = bet.commenceTime ? new Date(bet.commenceTime).toLocaleTimeString('en-US', {timeZone:'America/New_York', hour:'numeric', minute:'2-digit'}) + ' ET' : '';
  return `${awayShort} @ ${homeShort}${startTimeET ? ' \u2014 '+startTimeET : ''}`;
}
// Async part \u2014 only does anything once the game has actually started: appends live quarter/
// clock, score, and (for player props) that player's current in-game value for the exact stat
// being bet on, e.g. "1Q 7:43 | NY 17 - IND 20 | 0 AST C. Clark". Patches the element in place
// rather than blocking the table's initial render on a live-score fetch.
async function enhanceBetSubLineIfLive(bet, liveGames, subLineEl){
  const live = findLiveGameForBet(liveGames, bet);
  if(!live || !live.started) return;
  const quarterLabel = live.completed ? 'Final' : `${live.period||'?'}Q ${live.displayClock||''}`.trim();
  const scoreLabel = `${live.awayShort} ${live.awayScore!=null?live.awayScore:'\u2014'} - ${live.homeShort} ${live.homeScore!=null?live.homeScore:'\u2014'}`;
  let extra = ` | ${quarterLabel} | ${scoreLabel}`;
  if((bet.betType==='player_prop' || bet.betType==='player_prop_alt') && bet.player && bet.statKey){
    const rows = await fetchLiveBoxscoreCached(live.espnEventId);
    const row = rows.find(r => r.athlete_display_name===bet.player);
    if(row){
      // ESPN's live box score uses long field names; map them onto our stat keys first, then let
      // comboFrom build any combination out of the mapped row.
      const mapped = {pts: row.points, reb: row.rebounds, ast: row.assists, tpm: row.three_point_field_goals_made};
      const val = COMBO_STAT_PARTS[bet.statKey] ? comboFrom(mapped, bet.statKey)
        : (mapped[bet.statKey] !== undefined ? mapped[bet.statKey] : null);
      if(val!==null && val!==undefined){
        extra += ` | ${val} ${STAT_SHORT_LABEL[bet.statKey]||bet.statKey.toUpperCase()} ${shortPlayerName(bet.player)}`;
      }
    }
  }
  subLineEl.textContent += extra;
}

// Once per day, at the first opportunity on or after 12:00pm ET (there's no server process
// that can compute these rankings independently \u2014 see the App Tracker page for the full
// explanation of why this isn't a literal 12:00:00 capture), snapshots the current Top 30
// Standard and Top 30 Advanced Analytics lists into the App Tracker as pending picks.
let _snapshotAttemptedThisSession = false;
// The App Tracker's snapshot sources, in the order they appear in its filter and stat cards.
// Kept as one list so adding a source means adding it here, not hunting down every place that
// spelled out 'standard' and 'advanced' by hand.
const APP_TRACKER_SOURCES = ['standard', 'advanced', 'specials'];
const APP_TRACKER_SOURCE_LABEL = {standard: 'Standard', advanced: 'Advanced', specials: 'Specials'};

async function maybeSnapshotTodaysTopBets(cachedForToday){
  if(_snapshotAttemptedThisSession) return; // at most once per page session; avoids duplicate racing on fast repeated calls
  const et = nowInEastern();
  if(et.hour < 12) return; // not noon ET yet today
  _snapshotAttemptedThisSession = true;
  try{
    const existing = await appTrackerListAll();
    // Checked PER SOURCE, not just "does today have any record at all" -- if standard and
    // advanced ever end up captured at different times (a partial failure, a retry, or simply
    // this function being called more than once across the day), the old blanket check would
    // see "something exists for today" and skip entirely, permanently leaving whichever
    // category never got saved empty for that whole day with no way to backfill it.
    const haveStandardToday = existing.some(b => b.snapshotDate === et.dateStr && b.snapshotSource === 'standard');
    const haveAdvancedToday = existing.some(b => b.snapshotDate === et.dateStr && b.snapshotSource === 'advanced');
    const haveSpecialsToday = existing.some(b => b.snapshotDate === et.dateStr && b.snapshotSource === 'specials');
    if(haveStandardToday && haveAdvancedToday && haveSpecialsToday) return; // all three already captured today

    const snapshotTime = new Date().toISOString();
    const toSnapshot = [];

    if(!haveStandardToday){
      const std = computeStandardTopBets(cachedForToday, 30);
      std.topBets.forEach((bet, i)=>{
        toSnapshot.push(Object.assign({}, bet, {
          snapshotDate: et.dateStr, snapshotSource: 'standard', snapshotRank: i+1, snapshotAt: snapshotTime,
          result: 'pending', stake: 10, isParlay: false, trackedFrom: 'app-tracker-snapshot',
        }));
      });
    }

    if(!haveAdvancedToday){
      const todaysGamesAdv = cachedForToday.filter(({ev}) => new Date(ev.commence_time).toDateString() === new Date().toDateString() && isEligibleForTopBets(ev, new Date()));
      const advPool = buildAdvancedEdgeCandidates(todaysGamesAdv).slice(0, 30);
      advPool.forEach((bet, i)=>{
        toSnapshot.push(Object.assign({}, bet, {
          snapshotDate: et.dateStr, snapshotSource: 'advanced', snapshotRank: i+1, snapshotAt: snapshotTime,
          result: 'pending', stake: 10, isParlay: false, trackedFrom: 'app-tracker-snapshot',
        }));
      });
    }

    if(!haveSpecialsToday){
      // Specials is a bar-clearing shortlist, not a top-N ranking -- some days it's empty, and
      // that's a legitimate result, not a failure. It still gets snapshotRank so the tracker's
      // rank-based views work; the rank is just its position in the same tier-then-window order
      // the Specials tab itself displays.
      const specials = computeSpecialsBets(cachedForToday).bets;
      specials.forEach((bet, i)=>{
        toSnapshot.push(Object.assign({}, bet, {
          snapshotDate: et.dateStr, snapshotSource: 'specials', snapshotRank: i+1, snapshotAt: snapshotTime,
          result: 'pending', stake: 10, isParlay: false, trackedFrom: 'app-tracker-snapshot',
        }));
      });
    }

    // Save each item independently rather than letting one failure abort everything after it
    // in the loop -- a single transient error (e.g. one network blip on one KV write) used to
    // silently discard every remaining item in the batch, not just the one that failed.
    for(const bet of toSnapshot){
      try{ await appTrackerAdd(bet); }
      catch(e){ console.warn('Snapshot save failed for one pick (continuing with the rest):', bet.label, e); }
    }
  }catch(e){
    console.warn('Daily Top 30 snapshot failed', e);
  }
}

// Quick one-click "+ Track" button, usable anywhere a structured leg object is already
// on hand (Top Bets cards, game lines, player props, alt lines). Quick-add is always a
// pregame straight bet, since that's the only kind of line this app ever displays live.
// Formats a Date into the string <input type="datetime-local"> expects (local time, no
// timezone, "YYYY-MM-DDTHH:mm") -- Date's own toISOString() is UTC, which would silently
// shift the displayed time, so this builds it from local getters instead.
function toDatetimeLocalValue(d){
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  closeBtn.title = 'Cancel — nothing will be tracked';
  closeBtn.style.cssText = 'position:absolute;top:10px;right:12px;background:none;border:none;font-size:18px;color:var(--sub);cursor:pointer;line-height:1;padding:4px;';
  const close = ()=>{ document.body.removeChild(overlay); };

  const title = document.createElement('div'); title.style.cssText='font-weight:800;font-size:15px;color:var(--navy2);margin-bottom:4px;padding-right:20px;';

  function field(labelText, inputEl){
    const row = document.createElement('div'); row.style.cssText='margin-bottom:12px;';
    const l = document.createElement('label'); l.style.cssText='display:block;font-size:11px;font-weight:700;color:var(--navy2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;';
    l.textContent = labelText;
    row.appendChild(l); row.appendChild(inputEl);
    return row;
  }
  const inputStyle = 'width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13.5px;font-family:var(--sans);box-sizing:border-box;';

  const stakeInput = document.createElement('input'); stakeInput.type='number'; stakeInput.step='0.01'; stakeInput.min='0';
  stakeInput.value = defaultStake || 10; stakeInput.style.cssText = inputStyle;
  card.appendChild(field('Wager Amount ($)', stakeInput));

  const priceInput = document.createElement('input'); priceInput.type='number'; priceInput.step='1';
  priceInput.value = legLikeObject.price!==undefined && legLikeObject.price!==null ? legLikeObject.price : '';
  priceInput.style.cssText = inputStyle;
  card.appendChild(field('Odds (pre-filled with the latest DraftKings price — edit if it moved)', priceInput));

  // Line only applies to bet types that actually have one -- moneyline bets don't.
  const hasLine = ['spread','total','team_total','player_prop','player_prop_alt'].includes(legLikeObject.betType) && legLikeObject.line!==undefined && legLikeObject.line!==null;
  let lineInput = null;
  if(hasLine){
    lineInput = document.createElement('input'); lineInput.type='number'; lineInput.step='0.5';
    lineInput.value = legLikeObject.line;
    lineInput.style.cssText = inputStyle;
    card.appendChild(field('Line (e.g. change +5.5 to +4.5 or +6.5 if it moved)', lineInput));
  }

  const timeInput = document.createElement('input'); timeInput.type='datetime-local';
  timeInput.value = toDatetimeLocalValue(new Date());
  timeInput.style.cssText = inputStyle;
  card.appendChild(field('Time You Placed This Bet', timeInput));

  const errDiv = document.createElement('div'); errDiv.style.cssText='color:var(--red);font-size:12px;margin-bottom:10px;display:none;white-space:pre-wrap;';
  card.appendChild(errDiv);

  const btnRow = document.createElement('div'); btnRow.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:6px;';
  const cancelBtn = document.createElement('button'); cancelBtn.textContent='Cancel';
  cancelBtn.style.cssText='padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer;font-family:var(--sans);';
  cancelBtn.addEventListener('click', close);
  const confirmBtn = document.createElement('button'); confirmBtn.textContent='Track Bet';
  confirmBtn.style.cssText='padding:8px 14px;border-radius:6px;border:1px solid var(--navy2);background:var(--navy2);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);';

function showLoginRequiredModal(onSuccess){

function makeTrackButton(legLikeObject, defaultStake){
  const btn = document.createElement('button');
  btn.textContent = '+ Track';
  btn.style.cssText = 'padding:3px 8px;border-radius:4px;border:1px solid var(--navy2);background:var(--panel);color:var(--navy2);font-size:11px;cursor:pointer;font-family:var(--sans);margin-left:6px;';
  btn.addEventListener('click', ()=>{
    if(!isLoggedIn()){
      showLoginRequiredModal(()=>btn.click()); // re-fires this same click handler once logged in, now passing the isLoggedIn() check
      return;
    }
    showTrackModal(legLikeObject, defaultStake, async ({stake, price, placedAt, newLine})=>{
      // Timing (pregame/live) determined from the game's actual start time vs. the time you
      // said you placed it, not vs. right now -- if you're backfilling a bet from earlier,
      // this should reflect what was true AT that moment, not the moment you're filling out this form.
      let timing = 'pregame';
      if(legLikeObject.commenceTime){
        const ct = new Date(legLikeObject.commenceTime);
        if(!isNaN(ct.getTime()) && new Date(placedAt) >= ct) timing = 'live';
      }
      const bet = Object.assign({}, legLikeObject, {
        stake, price, placedAt,
        result: 'pending',
        trackedFrom: 'quick-add',
        timing,
        isParlay: false,
      });
      // If the line was edited, keep everything derived from it in sync -- thresholdToHit
      // (player props only, used for grading) and the label text itself, so what's displayed
      // always matches what was actually tracked, not the original pre-edit line.
      if(newLine !== null && newLine !== undefined && newLine !== legLikeObject.line){
        const oldLine = legLikeObject.line;
        bet.line = newLine;
        if(bet.betType === 'player_prop' || bet.betType === 'player_prop_alt'){
          bet.thresholdToHit = bet.side === 'over'
            ? (Number.isInteger(newLine) ? newLine+1 : Math.ceil(newLine))
            : newLine;
        }
        if(bet.label && oldLine!==undefined && oldLine!==null){
          const isSpread = bet.betType === 'spread';
          const oldFrag = isSpread ? `${oldLine>0?'+':''}${oldLine}` : `${oldLine}`;
          const newFrag = isSpread ? `${newLine>0?'+':''}${newLine}` : `${newLine}`;
          if(bet.label.includes(oldFrag)) bet.label = bet.label.replace(oldFrag, newFrag);
        }
      }
      let result;
      try{
        result = await trackerAdd(bet);
      }catch(e){
        throw new Error(`${e.message}\n\nMost common cause: the BET_TRACKER KV namespace hasn't been created and bound to your Worker yet, or the Worker wasn't redeployed after adding it.`);
      }
      if(result && result.error){ throw new Error(`${result.error}\n\nMost common cause: the BET_TRACKER KV namespace hasn't been created and bound to your Worker yet, or the Worker wasn't redeployed after adding it.`); }
      btn.textContent = '\u2713 Tracked';
      btn.style.background = 'var(--greenbg)'; btn.style.color = 'var(--green)'; btn.style.borderColor = 'var(--green)';
      btn.disabled = true;
    });
  });
  return btn;
}

// Extracts this specific leg's price (and point, if relevant) out of one historical snapshot's
// merged DraftKings markets. Returns null if that market/outcome wasn't captured in this snapshot.
function extractLegFromSnapshotMarkets(leg, markets, homeShort, awayShort){
  if(leg.betType === 'moneyline'){
    const m = markets['h2h']; if(!m) return null;
    const fullName = leg.team===homeShort ? FULL_TEAM_NAME[homeShort] : FULL_TEAM_NAME[awayShort];
    const o = (m.outcomes||[]).find(x=>x.name===fullName);
    return o ? {price:o.price} : null;
  }
  if(leg.betType === 'spread'){
    const m = markets['spreads']; if(!m) return null;
    const fullName = leg.team===homeShort ? FULL_TEAM_NAME[homeShort] : FULL_TEAM_NAME[awayShort];
    const o = (m.outcomes||[]).find(x=>x.name===fullName);
    return o ? {price:o.price, line:o.point} : null;
  }
  if(leg.betType === 'total'){
    const m = markets['totals']; if(!m) return null;
    const o = (m.outcomes||[]).find(x=>x.name===(leg.side==='over'?'Over':'Under'));
    return o ? {price:o.price, line:o.point} : null;
  }
  if(leg.betType === 'team_total'){
    const m = markets['team_totals']; if(!m) return null;
    const fullName = leg.team===homeShort ? FULL_TEAM_NAME[homeShort] : FULL_TEAM_NAME[awayShort];
    const o = (m.outcomes||[]).find(x=>x.name===(leg.side==='over'?'Over':'Under') && x.description===fullName);
    return o ? {price:o.price, line:o.point} : null;
  }
  if(leg.betType === 'player_prop' || leg.betType === 'player_prop_alt'){
    const mkey = Object.keys(PROP_MARKET_TO_STAT).find(k=>PROP_MARKET_TO_STAT[k]===leg.statKey && !k.endsWith('_alternate'));
    const m = markets[mkey]; if(!m) return null;
    const o = (m.outcomes||[]).find(x=>x.name===(leg.side==='over'?'Over':'Under') && x.description===leg.player);
    return o ? {price:o.price, line:o.point} : null;
  }
  return null;
}

async function renderLineHistoryPage(leg, returnTo){
  lastRender = () => renderLineHistoryPage(leg, returnTo);
  main.innerHTML = '';
  removeGameWindowStickyBar();
  const back = document.createElement('button'); back.className='backbtn'; back.textContent='\u2190 Back';
  back.addEventListener('click', ()=>navBack(()=>{ if(returnTo) returnTo(); else renderHomePage(); }));
  main.appendChild(back);

  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\ud83d\udcc8 Line History</h2><div class="meta"><b>${leg.label}</b><br>${leg.gameLabel||''}</div>`;
  main.appendChild(head);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.margin='10px 0';
  statusDiv.textContent = 'Loading historical snapshots from your Worker\u2026';
  main.appendChild(statusDiv);
  const contentDiv = document.createElement('div');
  main.appendChild(contentDiv);

  if(!leg.eventId){
    statusDiv.textContent = 'This bet doesn\u2019t have enough information to look up its history (no event id attached).';
    return;
  }

  try{
    const history = await fetchOddsHistoryCached();
    const matches = (history||[]).filter(snap => snap.eventId === leg.eventId);
    if(matches.length === 0){
      statusDiv.textContent = 'No historical snapshots found yet for this game. Snapshots are only saved automatically while the Odds/Home pages are actively fetched before tip-off \u2014 as you keep using the app day to day, history will build up here on its own. Nothing to show yet for this one.';
      return;
    }

    const homeShort = SHORT_TEAM_NAME[matches[0].homeTeam] || matches[0].homeTeam;
    const awayShort = SHORT_TEAM_NAME[matches[0].awayTeam] || matches[0].awayTeam;

    // merge markets seen at each distinct fetch timestamp (a single fetch can span two
    // requests — game lines + event-detail — that land as separate snapshot records)
    const byTime = {};
    matches.forEach(snap=>{
      const t = snap.fetchedAt;
      if(!byTime[t]) byTime[t] = {};
      const dk = (snap.data.bookmakers||[]).find(b=>b.key==='draftkings');
      if(dk) (dk.markets||[]).forEach(m=>{ byTime[t][m.key] = m; });
    });

    const points = [];
    Object.keys(byTime).sort().forEach(t=>{
      const found = extractLegFromSnapshotMarkets(leg, byTime[t], homeShort, awayShort);
      if(found) points.push({time:t, ...found});
    });

    if(points.length === 0){
      statusDiv.textContent = `Found ${matches.length} snapshot(s) for this game, but none captured this specific market yet.`;
      return;
    }

    statusDiv.textContent = `${points.length} data point(s) captured for this bet, as far back as your Worker has been collecting.`;

    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table'); table.style.width='100%';
    const thead = document.createElement('thead');
    thead.innerHTML = '<tr><th class="left">Captured At</th><th>Line</th><th>Price</th><th>Change</th></tr>';
    table.appendChild(thead);
    const tbody = document.createElement('tbody'); table.appendChild(tbody);
    points.forEach((p, idx)=>{
      const tr = document.createElement('tr');
      const prev = idx>0 ? points[idx-1] : null;
      let change = '\u2014';
      if(prev){
        const priceDelta = p.price - prev.price;
        change = priceDelta===0 ? 'no change' : (priceDelta>0?'+':'')+priceDelta+' price';
        if(p.line!==undefined && prev.line!==undefined && p.line!==prev.line){
          change += `, line ${prev.line}\u2192${p.line}`;
        }
      }
      const cells = [new Date(p.time).toLocaleString(), p.line!==undefined?p.line:'\u2014', fmtAmerican(p.price), change];
      cells.forEach((c,i)=>{
        const td = document.createElement('td');
        if(i===0) td.classList.add('left');
        td.style.cssText = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;'+(i>0?'text-align:center;':'');
        td.textContent = c;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    contentDiv.appendChild(wrap);
  }catch(e){
    statusDiv.textContent = `Couldn\u2019t load line history: ${e.message}`;
  }
}

// Just the time-of-day portion of a game's commence_time, for a compact table column
// (the Date column already carries the calendar date).
function fmtGameTimeOnly(commenceTime){
  if(!commenceTime) return '\u2014';
  const dt = new Date(commenceTime);
  if(isNaN(dt.getTime())) return '\u2014';
  return dt.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
}

function fmtResultBadge(result){
  const span = document.createElement('span');
  span.style.cssText = 'display:inline-block;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:700;';
