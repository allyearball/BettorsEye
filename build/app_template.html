// Returns a bookmaker-shaped object ({key, title, markets:[{key, outcomes:[...]}]}) for a
// given event, regardless of whether selectedBook is one specific real book or 'best'. This
// lets every existing render function (which already calls marketsByKey()/dkOutcome() on
// "the bookmaker") keep working unchanged -- 'best' just returns a SYNTHESIZED bookmaker
// built by picking, for each identical outcome (same market + name + point + description)
// across all 6 real books, whichever price is actually best for the bettor. American odds
// have the convenient property that "numerically higher = better" holds uniformly on both
// sides of zero (-105 beats -110, +150 beats +120), so this is a plain max() by price. Ties
// keep every tied book's key in outcome._bestBooks so the UI can show "DK, FanDuel" rather
// than picking one arbitrarily.
function getBookmakerData(ev, selectedBook){
  const allBooks = ev.bookmakers || [];
  if(selectedBook !== 'best'){
    return allBooks.find(b=>b.key===selectedBook) || null;
  }
  const marketsSynth = {};
  allBooks.forEach(book=>{
    (book.markets||[]).forEach(mk=>{
      if(!marketsSynth[mk.key]) marketsSynth[mk.key] = {key: mk.key, outcomes: []};
      (mk.outcomes||[]).forEach(oc=>{
        const existing = marketsSynth[mk.key].outcomes.find(o=>
          o.name===oc.name && o.point===oc.point && o.description===oc.description);
        if(!existing){
          marketsSynth[mk.key].outcomes.push(Object.assign({}, oc, {_bestBooks:[book.key]}));
        } else if(oc.price > existing.price){
          Object.assign(existing, oc, {_bestBooks:[book.key]});
        } else if(oc.price === existing.price){
          existing._bestBooks.push(book.key);
        }
      });
    });
  });
  if(!Object.keys(marketsSynth).length) return null;
  return {key: 'best', title: 'Best Odds', markets: Object.values(marketsSynth)};
}
const BOOK_LABELS = {
  draftkings: 'DraftKings', fanduel: 'FanDuel', betmgm: 'BetMGM',
  williamhill_us: 'Caesars', betrivers: 'BetRivers', fanatics: 'Fanatics',
};
function bestBooksLabel(bestBooks){
  if(!bestBooks || !bestBooks.length) return '';
  return bestBooks.map(k=>BOOK_LABELS[k]||k).join(', ');
}

// Formats a price, appending "via BookName" when this outcome came from the Best-Odds
// synthesis and we're actually in Best mode (so the user knows where to actually place the
// bet, not just what the number is). No-op outside Best mode or for real single-book outcomes.
function priceWithBookLabel(outcome, selectedBook){
  if(!outcome) return '';
  const base = `${outcome.price>0?'+':''}${outcome.price}`;
  if(selectedBook==='best' && outcome._bestBooks && outcome._bestBooks.length){
    return `${base} (${bestBooksLabel(outcome._bestBooks)})`;
  }
  return base;
}

function marketsByKey(bookmaker){
  const m = {};
  if(bookmaker && bookmaker.markets) bookmaker.markets.forEach(mk=>{ m[mk.key]=mk; });
  return m;
}

// Home page version: same candidate-gathering as renderTopBets, but pivoted into a table
// where each ROW is one game and that game's qualifying bets run across the columns —
// rather than one card per bet, ranked without regard to which game it's from.
// Real-world elapsed-time estimate for "one quarter has passed" since tipoff. This app has no
// live game-clock/play-by-play feed (only final box scores, refreshed every ~10 min after a
// game ends) \u2014 so there's no way to know the actual, current in-game clock. This is a
// heuristic based on typical WNBA pace: a 10-minute game-clock quarter including timeouts,
// fouls, replay reviews, and the between-quarter break commonly runs ~20-30 minutes of real
// time; 25 is the midpoint estimate. Tune this constant if it's letting bets sit too long or
// dropping them too early relative to what you're actually seeing.
const TOP_BETS_QUARTER_GRACE_MINUTES = 25;
function isEligibleForTopBets(ev, now){
  const commence = new Date(ev.commence_time);
  const minutesSinceTipoff = (now - commence) / 60000;
  return minutesSinceTipoff < TOP_BETS_QUARTER_GRACE_MINUTES; // covers not-yet-started (negative) through end of an estimated Q1
}

// ================= Advanced Analytics Top Bets (second ranking, separate methodology) =================
// Unlike the main Top Bets table (which ranks by simple historical hit rate), this ranks
// player props by a composite "edge score" built from the advanced-stats system added earlier:
// multi-window EMA consensus (L5/L10/L15/full season), volatility (IQR), Defense-vs-Position
// Index, and injury status. Scoped to player props only \u2014 EMA/DvP don't have a built
// equivalent for game lines (moneyline/spread/total) in this app yet.

// A player's own game log, sliced into the 4 windows Gemini's framework calls out, each
// reduced to an EMA (not a plain average \u2014 see the Team/Player Advanced Metrics tables for
// why). Returns null if she has no log at all (e.g. name mismatch) rather than guessing.
function multiWindowStats(playerName, team, statKey){
  const rec = DATA.fullPlayerLogs[playerName+'|'+team];
  if(!rec) return null;
  const played = rec.log.filter(g=>!g.dnp).map(g => statValue(g, statKey) || 0);
  if(played.length===0) return null;
  function windowStat(n){
    const arr = n==='full' ? played : played.slice(-n);
    if(arr.length===0) return {ema:null, n:0};
    return {ema: emaOf(arr, Math.max(1, Math.min(10, arr.length))), n: arr.length};
  }
  const l10arr = played.slice(-10);
  return {
    l5: windowStat(5), l10: windowStat(10), l15: windowStat(15), full: windowStat('full'),
    stdL10: stdDevOf(l10arr), iqrL10: iqrOf(l10arr),
  };
}

function playerInjuryStatus(playerName, team){
  return teamInjuries(team).find(inj => inj.player === playerName) || null;
}
// Heuristic, not a measured effect: if a DIFFERENT key teammate (23+ min/game) is Out, usage
// tends to redistribute toward the remaining rotation \u2014 a modest bonus for Over picks only,
// since there's no way to quantify exactly how much volume shifts to THIS player specifically.
function teammateKeyInjuryBoost(playerName, team, wantOver){
  if(!wantOver) return 1.0;
  const outs = teamInjuries(team).filter(inj => inj.player!==playerName && isKeyPlayer(inj.player, team) && injuryStatusSeverity(inj.status)==='out');
  return outs.length ? 1.1 : 1.0;
}

// Core signal computation, direction-agnostic: given a player/stat/line, figures out which
// side (Over/Under) the multi-window EMA consensus actually favors and scores it. Requires at
// least 3 of the 4 windows to agree with each other before returning anything \u2014 windows that
// disagree with each other isn't a real signal, however good any single window looks alone.
// Shared by both the leg-based Top 30 ranking and the per-row Edge badge on the Odds page.
// USG% trend: is she getting MORE or LESS involved recently than her season norm? Rising usage
// supports an Over case (more offensive involvement/opportunity); falling usage supports an
// Under case. Deliberately a secondary, capped signal (\u00b115% max) \u2014 EMA + DvP still drive
// the bulk of the score; this just nudges it based on whether her role is trending the same way.
function usgTrendMultiplier(pname, team, direction){
  const rec = DATA.fullPlayerLogs[pname+'|'+team];
  if(!rec) return 1.0;
  const usgValues = [];
  rec.log.filter(g=>!g.dnp).forEach(g=>{
    const gameRecord = findGameByTeamDate(team, g.date);
    if(!gameRecord) return;
    const teamRows = gameRecord.rows.filter(r=>r.team===team && !r.dnp);
    const playerRow = teamRows.find(r=>r.player===pname);
    if(playerRow){
      const u = usgPctForGame(playerRow, teamGameAggFromRows(teamRows));
      if(u!==null) usgValues.push(u);
    }
  });
  if(usgValues.length < 3) return 1.0;
  const recent = usgValues.slice(-5);
  const recentUsg = recent.reduce((a,b)=>a+b,0)/recent.length;
  const seasonUsg = usgValues.reduce((a,b)=>a+b,0)/usgValues.length;
  if(!seasonUsg) return 1.0;
  const trendPct = (recentUsg - seasonUsg) / seasonUsg;
  const capped = Math.max(-0.15, Math.min(0.15, trendPct));
  return direction==='over' ? 1 + capped : 1 - capped;
}

function computeRowSignal(pname, team, opponent, statKey, line){
  const mw = multiWindowStats(pname, team, statKey);
  if(!mw) return null;
  const windows = [mw.l5, mw.l10, mw.l15, mw.full].filter(w => w.ema!==null && w.n>=2);
  if(windows.length < 3) return null;

  const avgEma = windows.reduce((a,w)=>a+w.ema,0)/windows.length;
  if(avgEma === line) return null; // dead even, no direction to call
  const direction = avgEma > line ? 'over' : 'under';
  const agreement = windows.filter(w => direction==='over' ? w.ema>line : w.ema<line).length / windows.length;
  if(agreement < 0.75) return null;

  const edgeMagnitude = Math.abs(avgEma - line) / Math.max(line, 1); // kept for the "why" tooltip display -- see note below on why it's excluded from score
  const volatilityDamp = mw.iqrL10!==null ? 1/(1 + mw.iqrL10/Math.max(line,1)) : 0.85; // same -- displayed, not scored

  const bucket = positionBucket(getPlayerPosition(pname, team));
  const dvp = bucket ? dvpIndex(opponent, statKey, bucket) : null;
  // DvP is now a hard veto at the extremes (a matchup this lopsided contradicts the form signal
  // enough that no EMA edge should overrule it), and a severity-SCALED penalty/bonus in between —
  // previously this was a flat 0.65x regardless of whether DvP was 0.94 or 0.79, which let a big
  // enough EMA edge paper over even a lopsided matchup. Fixed to scale with how bad it actually is.
  let dvpMultiplier = 1.0;
  if(dvp!==null){
    if(direction==='over'){
      if(dvp < 0.85) return null; // hard veto: opponent's D flatly contradicts the Over case
      if(dvp > 1.05) dvpMultiplier = 1 + Math.min(dvp-1, 0.4);
      else if(dvp < 0.95) dvpMultiplier = Math.max(0.35, 1 - (0.95-dvp)*3);
    } else {
      if(dvp > 1.15) return null; // hard veto: opponent's D flatly contradicts the Under case
      if(dvp < 0.95) dvpMultiplier = 1 + Math.min(1-dvp, 0.4);
      else if(dvp > 1.05) dvpMultiplier = Math.max(0.35, 1 - (dvp-1.05)*3);
    }
  }

  // Backtest (111 graded Advanced picks, snapshotted daily then graded against actual results):
  // isolating each factor and ranking picks by it ALONE showed DvP as by far the strongest
  // standalone signal (63.3% top-30 win rate vs 43.3% bottom-30 -- a 20pt spread), while
  // edgeMagnitude and volatilityDamp both tested NEGATIVE standalone, and stayed net-harmful
  // even capped/included at reduced weight -- removing them from the score (not just dialing
  // them down) is what actually unlocked the best result tested: 66.7% top-30 vs 43.3%
  // bottom-30, a 23.4pt spread, vs the original formula's -3.3pt spread (its top picks were
  // performing WORSE than its bottom picks). Squaring dvpMultiplier reflects it now carrying
  // most of the real signal. Both factors are still computed and shown in the "why" tooltip --
  // they're informative to look at, they just don't reliably predict outcomes in this sample,
  // so they no longer drive the ranking. This isn't a promise of any specific future hit rate --
  // 111 picks is a small sample -- but the DIRECTION (trust DvP heavily, trust the EMA-gap-size
  // and volatility machinery much less) is what the backtest actually supports.
  const dvpWeighted = Math.pow(dvpMultiplier, 2);

  const usgMultiplierRaw = usgTrendMultiplier(pname, team, direction);
  // Severely dampened, not removed or inverted: the backtest showed this factor's effect on
  // actual outcomes running backwards from what it assumes (chasing a recent usage uptick
  // underperformed, consistent with usage trends mean-reverting rather than persisting) -- but
  // 111 picks isn't enough to confidently bet on the exact INVERSE being reliable either, so
  // this shrinks its pull toward 1.0 (neutral) by 80% rather than flipping its sign outright.
  const usgMultiplier = 1 + (usgMultiplierRaw - 1) * 0.2;

  return {
    direction, score: agreement * dvpWeighted * usgMultiplier,
    agreement, avgEma, dvp, edgeMagnitude, volatilityDamp,
    l5: mw.l5.ema, l10: mw.l10.ema, l15: mw.l15.ema, full: mw.full.ema, iqrL10: mw.iqrL10,
  };
}
// Leg-based wrapper for the Top 30 ranking: only keep the signal if it points the same
// direction as this specific leg's posted side (Over legs and Under legs are separate
// candidates from gatherCandidateLegs, so a leg pointing the "wrong" way per our own
// consensus is correctly dropped rather than scored).
function computeAdvancedEdgeForLeg(leg){
  if(leg.betType !== 'player_prop') return null;
  const sig = computeRowSignal(leg.player, leg.team, leg.opponent, leg.statKey, leg.line);
  if(!sig) return null;
  if((leg.side==='over') !== (sig.direction==='over')) return null;
  return sig;
}

// Collapses a signal into one plain-language verdict \u2014 the point of this is being readable
// in under a second, not precise. RECALIBRATED for the current score formula (score = agreement
// x dvpWeighted x usgMultiplier, dvpWeighted alone ranging roughly 0.12 to 1.96 with 1.0 being
// a neutral matchup) -- the old thresholds (0.15/0.05) were calibrated for the PREVIOUS 5-factor
// formula, whose score sat in a much smaller range; left in place after the formula changed
// earlier today, they would have called almost every row "Strong" regardless of actual quality.
// These aren't independently re-backtested against the new formula yet -- a reasonable starting
// recalibration based on the new score's actual range, not a validated final calibration.
const STRONG_EDGE_THRESHOLD = 1.3, LEAN_EDGE_THRESHOLD = 1.05;
function edgeVerdict(sig){
  if(!sig) return {text:'Mixed / No Signal', color:'var(--sub)'};
  const dirWord = sig.direction==='over' ? 'Over' : 'Under';
  const dirColor = sig.direction==='over' ? 'var(--green)' : 'var(--red)';
  if(sig.score >= STRONG_EDGE_THRESHOLD) return {text:`Strong ${dirWord}`, color: dirColor};
  if(sig.score >= LEAN_EDGE_THRESHOLD) return {text:`Lean ${dirWord}`, color: dirColor};
  return {text:'Mixed', color:'var(--sub)'};
}
function fmtEma(v){ return v===null||v===undefined ? 'n/a' : (Math.round(v*10)/10); }
function edgeWhyText(pname, sig, line, marketLabel){
  if(!sig){
    return `${pname} \u2014 ${marketLabel} line ${line}: not enough agreement across the L5/L10/L15/season EMA windows to call a direction here (need at least 3 of 4 pointing the same way), or the matchup (DvP Index) flatly contradicts the direction the numbers point \u2014 in that case this is deliberately excluded rather than shown with a discount.`;
  }
  const dirWord = sig.direction==='over' ? 'Over' : 'Under';
  return `${pname} \u2014 ${marketLabel} line ${line}. EMA: L5 ${fmtEma(sig.l5)}, L10 ${fmtEma(sig.l10)}, L15 ${fmtEma(sig.l15)}, Season ${fmtEma(sig.full)} \u2014 ${Math.round(sig.agreement*4)}/4 windows favor the ${dirWord}. DvP Index for her position: ${sig.dvp!==null?sig.dvp.toFixed(2):'n/a'} (>1.05 favors Over, <0.95 favors Under \u2014 a mismatch beyond 0.85/1.15 against the pick's direction excludes it entirely rather than just discounting it) \u2014 this is now the dominant factor in the ranking, based on a backtest against 111 graded picks showing it as by far the strongest real predictor. L10 volatility (IQR): ${sig.iqrL10!==null?sig.iqrL10.toFixed(1):'n/a'} and the EMA-vs-line gap size are shown for reference but no longer drive the ranking \u2014 that same backtest showed both were net-negative predictors here, not just weak ones. Usage Rate (USG%) trend nudges the score only slightly (\u00b13% max, down from \u00b115%), since rising usage tested as backwards from what you'd expect (consistent with usage upticks tending to mean-revert rather than persist).`;
}

// The reusable Edge cell for the Player Props / Alt Lines tables: a tap-for-why verdict badge,
// plus an inline injury flag right underneath it if she's on the injury report \u2014 so you don't
// have to scroll back up to the game-card banner to notice she's questionable while you're
// deep in the props table.
function buildEdgeCell(pname, team, opponent, statKey, line, marketLabel){
  const wrap = document.createElement('div');
  const sig = computeRowSignal(pname, team, opponent, statKey, line);
  const verdict = edgeVerdict(sig);
  const badge = document.createElement('span');
  badge.textContent = verdict.text;
  badge.style.cssText = `font-weight:700;font-size:11px;color:${verdict.color};cursor:pointer;border:1px solid ${verdict.color};border-radius:4px;padding:2px 6px;display:inline-block;white-space:nowrap;`;
  badge.addEventListener('click', (e)=>{ e.stopPropagation(); toggleDefPopover(badge, edgeWhyText(pname, sig, line, marketLabel)); });
  wrap.appendChild(badge);

  const inj = playerInjuryStatus(pname, team);
  if(inj){
    const injLine = document.createElement('div');
    const sev = injuryStatusSeverity(inj.status);
    injLine.style.cssText = `font-size:10px;font-weight:700;color:${INJURY_SEVERITY_COLOR[sev]||'var(--sub)'};margin-top:2px;`;
    injLine.textContent = `\u26a0 ${inj.status}`;
    wrap.appendChild(injLine);
  }
  return wrap;
}

// Builds the ranked pool across every still-eligible game today (reuses gatherCandidateLegs
// with QUAL=0 \u2014 no hit-rate floor, since this ranking uses its own scoring instead).
// Actual hit count for a leg's specific side within a window, e.g. "4/5" \u2014 reuses the same
// hitRateFor already powering the rest of the app, just formatted as counts instead of a rate.
// The actual ranking metric: worst-case (minimum) hit rate across whichever of L5/L10/L15
// are available for this bet \u2014 a bet only ranks as high as its weakest window, so one great
// window can't hide a mediocre one. Used consistently everywhere a Top Bets list is sorted.
function worstCaseRate(bet){
  const rates = [bet.rate5, bet.rate10, bet.rate15].filter(r => r!==null && r!==undefined);
  if(!rates.length) return 0;
  return Math.min(...rates);
}

// ================= "Strong signal" confidence highlight =================
// A stricter bar than the baseline Top 30 ranking already requires -- both tables already only
// show bets that cleared a qualification threshold; this flags the subset that clears a
// meaningfully higher one. Computed fresh from whatever bets are actually showing at any given
// time (not a fixed, one-time pick), so it stays accurate as odds and games change day to day.
// Standard: requires ALL FOUR windows (L5/L10/L15/Season) at 75%+, not just the worst-case
// three the base ranking uses -- and a real season sample behind it, so a 3-game hot streak
// with a thin Season count can't qualify.
function computeStdConfidence(bet){
  const windows = [
    {label:'L5', rate:bet.rate5, gp:bet.gp5},
    {label:'L10', rate:bet.rate10, gp:bet.gp10},
    {label:'L15', rate:bet.rate15, gp:bet.gp15},
    {label:'Season', rate:bet.rateAll, gp:bet.gpAll},
  ];
  if(windows.some(w => w.rate===null || w.rate===undefined)) return null;
  if(windows.some(w => w.rate < 0.75)) return null;
  if(!windows[3].gp || windows[3].gp < 8) return null;
  return { windows, minRate: Math.min(...windows.map(w=>w.rate)), avgRate: windows.reduce((a,w)=>a+w.rate,0)/4 };
}
function stdConfidenceExplanation(bet, conf){
  const pctStr = w => `${w.label} ${Math.round(w.rate*100)}%${w.gp?` (${Math.round(w.rate*w.gp)}/${w.gp})`:''}`;
  return `All four windows agree, not just a recent hot stretch: ${conf.windows.map(pctStr).join(', ')} \u2014 every one at 75% or higher, including a real season-long sample (${conf.windows[3].gp} games). Still historical frequency, not a guarantee \u2014 worth checking the matchup (Opp Def Rank) before betting it.`;
}
// Advanced: requires all 4 EMA windows to agree with the side (the base ranking only needs
// 3-of-4), a genuinely favorable matchup (DvP Index materially past the base 0.85/1.15 cutoff,
// not just past it), and no current injury concern flagged for the player.
function computeAdvConfidence(bet){
  if(!bet.edge || bet.edge.agreement < 1 || bet.edge.dvp===null || bet.edge.dvp===undefined) return null;
  const dvpFavorable = bet.side==='over' ? bet.edge.dvp > 1.10 : bet.edge.dvp < 0.90;
  if(!dvpFavorable) return null;
  if(bet.injuryNote){
    const sev = injuryStatusSeverity(bet.injuryNote);
    if(sev==='out' || sev==='doubtful') return null;
  }
  return { agreement: bet.edge.agreement, dvp: bet.edge.dvp };
}
function advConfidenceExplanation(bet, conf){
  const dvpDir = bet.side==='over' ? 'favors the Over (opponent allows more than average to this position)' : 'favors the Under (opponent allows less than average to this position)';
  const injuryPart = bet.injuryNote ? ` Currently listed ${bet.injuryNote}, but not Out/Doubtful.` : '';
  return `All 4 EMA windows (L5/L10/L15/Season) agree with the ${bet.side==='over'?'Over':'Under'} \u2014 not just the 3-of-4 minimum this table already requires \u2014 and the matchup (DvP Index ${conf.dvp.toFixed(2)}) clearly ${dvpDir}, well past the baseline cutoff.${injuryPart} Still a composite score from historical data, not a guarantee.`;
}
// Shared visual: gold left-accent + background tint on the row, plus a tappable info icon
// (reusing the same appendDefIcon component used for every other info tooltip in this app)
// showing the specific numbers behind why this particular bet qualified.
function applyConfidenceHighlight(tr, iconAnchorTd, explanation){
  tr.style.backgroundColor = 'rgba(212,175,55,0.14)';
  tr.style.boxShadow = 'inset 4px 0 0 0 #D4AF37';
  const icon = document.createElement('span');
  icon.style.cssText = 'margin-left:4px;';
  iconAnchorTd.appendChild(icon);
  appendDefIcon(icon, explanation);
}

// L10 EMA tiebreaker -- only meaningful for player props (team-level bets like moneyline/
// spread/total have no individual player to compute this from, so this returns null for those,
// same as it always has for any per-player metric on a team bet).
function betTiebreakEma(bet){
  if(bet.betType!=='player_prop' && bet.betType!=='player_prop_alt') return null;
  const mw = multiWindowStats(bet.player, bet.team, bet.statKey);
  if(!mw || mw.l10.ema===null) return null;
  return mw.l10.ema;
}
// Directional distance of the L10 EMA from the actual line, in THIS bet's favorable direction
// -- e.g. an Over bet on a 15.5 line with an 18 EMA is +2.5 "ahead" of the number, an Under bet
// on the same numbers would be -2.5 (already unfavorable). Using this signed edge rather than
// the raw EMA value is what makes it consistently orderable (bigger = more room to spare)
// across a mix of Over and Under bets, which a raw EMA number by itself isn't.
function betTiebreakEdge(bet){
  const ema = betTiebreakEma(bet);
  if(ema===null || bet.line===undefined || bet.line===null) return null;
  return bet.side==='over' ? (ema - bet.line) : (bet.line - ema);
}

function hitCountFor(leg, windowSize){
  const r = hitRateFor(leg.player, leg.team, leg.statKey, leg.line, windowSize);
  if(!r || r.gp===0) return null;
  const hits = leg.side==='over' ? r.hits : (r.gp - r.hits);
  return {hits, gp:r.gp};
}

// Every game she's actually played against this specific opponent already THIS season, with
// her value for this exact stat and her minutes in each \u2014 plus the average. Returns null if
// they haven't met yet this season (most common case early in a season/for new matchups).
// Population variance of a set of values -- these are always small, complete samples (every
// game that happened to qualify for a given cell), not a sample drawn from a larger population,
// so population variance (divide by n) is the more natural fit here than sample variance.
// Sidebar color for a row based on OPP DEF RANK (L5): rank 1-5 (the stingiest, toughest
// defenses) = red (bad matchup for the offense), 6-10 = yellow, 11-15 (the most generous,
// easiest defenses) = green (good matchup). Returns null (no coloring) if the rank isn't
// available for this row -- never guesses.
function defRankTierColor(rank, of){
  if(rank===null || rank===undefined || !of) return null;
  const third = of/3;
  if(rank <= third) return '#c0392b';       // red -- top third, toughest defenses
  if(rank <= third*2) return '#d4a017';     // yellow -- middle third
  return '#1e8449';                          // green -- bottom third, easiest defenses
}
function applyDefRankSidebar(tr, rank, of){
  const color = defRankTierColor(rank, of);
  if(!color) return;
  tr.style.borderLeft = `5px solid ${color}`;
  tr.style.borderRight = `5px solid ${color}`;
}

// ================= Team-level defense metrics (for ML/Spread/Total/Team Total) =================
// Everything above (defense-vs-position, DvP Index) is inherently a player-prop concept --
// there's no "position" for a moneyline or game total. This is the team-level equivalent:
// overall points allowed per game, not broken out by position, so ML/Spread/Total/Team Total
// bets can get an analogous Opp Def Rank / DvP Index / Vs Similar Defenses / L10 EMA instead of
// showing blank, which is what they did before this.
const _teamDefenseRankCache = {};
function computeTeamDefenseRank(windowSize, cutoffDate){
  const cacheKey = `${windowSize||'season'}|${cutoffDate||'__current__'}`;
  if(_teamDefenseRankCache[cacheKey]) return _teamDefenseRankCache[cacheKey];
  const teamGames = {};
  TEAM_NAMES.forEach(t=>{ teamGames[t] = []; });
  Object.values(DATA.games).forEach(g=>{
    if(g.homeScore==null || g.awayScore==null) return;
    if(cutoffDate && g.date >= cutoffDate) return;
    if(teamGames[g.home]) teamGames[g.home].push(g);
    if(teamGames[g.away]) teamGames[g.away].push(g);
  });
  TEAM_NAMES.forEach(t=>{ teamGames[t].sort((a,b)=> b.date.localeCompare(a.date)); });

  const perGame = {}; const gpUsed = {};
  TEAM_NAMES.forEach(team=>{
    const games = windowSize ? teamGames[team].slice(0,windowSize) : teamGames[team];
    gpUsed[team] = games.length;
    const allowedSum = games.reduce((sum,g)=> sum + (g.home===team ? g.awayScore : g.homeScore), 0);
    perGame[team] = games.length ? allowedSum/games.length : null;
  });

  const withData = TEAM_NAMES.filter(t=>perGame[t]!==null);
  const sorted = withData.slice().sort((a,b)=>perGame[a]-perGame[b]); // ascending: fewest allowed = rank 1 = stingiest
  const ranks = {};
  sorted.forEach((team,i)=>{
    ranks[team] = { rank: i+1, of: sorted.length, perGame: Math.round(perGame[team]*10)/10, gp: gpUsed[team] };
  });
  _teamDefenseRankCache[cacheKey] = ranks;
  return ranks;
}
function getTeamDefenseRank(team, windowSize, cutoffDate){
  const ranks = computeTeamDefenseRank(windowSize, cutoffDate);
  return ranks[team] || null;
}
const _teamDvpBaselineCache = {};
function computeTeamDvpBaseline(windowSize){
  const key = windowSize||'season';
  if(_teamDvpBaselineCache[key]!==undefined) return _teamDvpBaselineCache[key];
  const ranks = computeTeamDefenseRank(windowSize);
  const vals = TEAM_NAMES.map(t=>ranks[t]?ranks[t].perGame:null).filter(v=>v!==null);
  const base = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  _teamDvpBaselineCache[key] = base;
  return base;
}
function teamDvpIndex(team, windowSize){
  const r = getTeamDefenseRank(team, windowSize);
  if(!r) return null;
  const base = computeTeamDvpBaseline(windowSize);
  if(!base) return null;
  return Math.round((r.perGame/base)*1000)/1000;
}
// Similar-defense window reuses similarDefenseWindow() (same +/-3, min-5 rule) -- the algorithm
// doesn't care whether the rank came from a position bucket or team-level.
function teamSimilarDefenseTeams(oppRank, windowSize){
  const {lo,hi} = similarDefenseWindow(oppRank.rank, oppRank.of);
  const ranks = computeTeamDefenseRank(windowSize);
  return { lo, hi, teams: TEAM_NAMES.filter(t=>{ const r=ranks[t]; return r && r.rank>=lo && r.rank<=hi; }) };
}
// Team-level EMA (recent games weighted more heavily) of a per-game metric -- 'margin' (point
// differential, for ML/Spread), 'scored' (own points, for Team Total), or 'combined' (both
// teams' total, for Total). Same halflife/weighting shape as the player EMA elsewhere, just
// computed from DATA.games directly instead of a player log.
function teamEma(team, metric, windowSize, cutoffDate){
  const games = [];
  Object.values(DATA.games).forEach(g=>{
    if(g.homeScore==null || g.awayScore==null) return;
    if(cutoffDate && g.date >= cutoffDate) return;
    if(g.home!==team && g.away!==team) return;
    games.push(g);
  });
  games.sort((a,b)=> a.date.localeCompare(b.date)); // oldest first, so the EMA weights the most recent game heaviest
  const windowed = windowSize ? games.slice(-windowSize) : games;
  if(!windowed.length) return null;
  const alpha = 2/(windowed.length+1);
  let ema = null;
  windowed.forEach(g=>{
    const own = g.home===team ? g.homeScore : g.awayScore;
    const opp = g.home===team ? g.awayScore : g.homeScore;
    const val = metric==='margin' ? (own-opp) : (metric==='scored' ? own : own+opp);
    ema = ema===null ? val : (val*alpha + ema*(1-alpha));
  });
  return Math.round(ema*10)/10;
}

function computeVariance(values){
  if(!values || values.length < 2) return null; // variance of a single point isn't meaningful
  const mean = values.reduce((a,b)=>a+b,0)/values.length;
  const sq = values.reduce((a,b)=>a+(b-mean)*(b-mean),0)/values.length;
  return Math.round(sq*100)/100;
}

// One clickable line: "16 pts (33 mins) @ #10 (New York Liberty) - 2026-05-10" -- bold value,
// bold rank, everything else plain, whole line links to that game's box score. `g` needs value,
// min, isHome, oppRank ({rank,of} or null), oppFull, date, gameId.
function buildStatLine(g, statLabel){
  const a = document.createElement('a'); a.href = 'javascript:void(0)'; a.className = 'player-link';
  a.style.cssText = 'display:block;font-size:11px;color:inherit;text-decoration:none;';
  const bVal = document.createElement('b'); bVal.textContent = String(g.value);
  a.appendChild(bVal);
  a.appendChild(document.createTextNode(` ${statLabel} (${g.min!==null&&g.min!==undefined?g.min:'\u2014'} mins) ${g.isHome?'vs':'@'} `));
  const bRank = document.createElement('b'); bRank.textContent = g.oppRank ? `#${g.oppRank.rank}` : '#\u2014';
  a.appendChild(bRank);
  a.appendChild(document.createTextNode(` (${g.oppFull}) - ${g.date}`));
  if(g.gameId){
    a.addEventListener('click', ()=>goToGameBox(g.gameId));
  } else {
    a.style.cursor = 'default';
  }
  return a;
}

function vsOpponentStatsForLeg(leg){
  if(leg.betType!=='player_prop' && leg.betType!=='player_prop_alt') return null;
  const rec = DATA.fullPlayerLogs[leg.player+'|'+leg.team];
  if(!rec) return null;
  const oppFull = FULL_TEAM_NAME[leg.opponent] || leg.opponent;
  const games = rec.log.filter(g => !g.dnp && (g.opp===leg.opponent || g.opp===oppFull));
  if(!games.length) return null;
  const bucket = positionBucket(getPlayerPosition(leg.player, leg.team));
  // statValue(), not g[key]: these are RAW game-log rows straight off DATA.fullPlayerLogs,
  // which store only the base stats. Every combined stat (pra/pr/pa/ra) has to be derived
  // here. The old code special-cased 'pra' by hand and fell through to g[key] for anything
  // else, so the three two-stat combos silently read undefined -> 0, which also poisoned
  // the hit/miss dot, the Avg and the Var on those rows.
  const values = games.map(g => statValue(g, leg.statKey) || 0);
  const avg = Math.round((values.reduce((a,b)=>a+b,0)/values.length)*10)/10;
  const variance = computeVariance(values);
  return { n: games.length, avg, variance, games: games.map((g,i)=>{
    const gameId = findGameIdForTeamDate(leg.team, g.date);
    const gameRec = gameId ? DATA.games[gameId] : null;
    const isHome = gameRec ? gameRec.home===leg.team : null;
    const oppRank = bucket ? getDefenseRankAsOf(leg.opponent, leg.statKey, bucket, g.date) : null;
    return {date:g.date, value:values[i], min:g.min, gameId, isHome, oppRank, oppFull};
  }) };
}
// Small green-circle/red-\u2715 marker, same visual language as the Bet Tracker's win/loss
// circles \u2014 indicates whether THIS specific historical game would have hit the bet currently
// being recommended (same line, same side), not just shows the raw stat line.
function vsOpponentHitIcon(hit){
  const span = document.createElement('span');
  if(hit){
    span.style.cssText = 'display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;';
  } else {
    span.style.cssText = 'display:inline-block;color:var(--red);font-weight:800;font-size:10px;flex-shrink:0;line-height:8px;';
    span.textContent = '\u2715';
  }
  return span;
}
// Team-level equivalent of vsOpponentStatsForLeg, for bets that aren't about one player
// (moneyline/spread/total/team_total) — every meeting between these exact two teams already
// played this season, with whether that specific historical game would have hit THIS bet's
// current line/side (same logic per bet type as gradeLeg, just applied to past meetings
// instead of the specific game this bet is on).
// Player logs (fullPlayerLogs) only carry date/opponent, not the game's own ID -- this finds
// it by matching team+date against DATA.games, so "Vs Opponent This Season" entries can link
// to the actual box score.
// Indexed on first use rather than scanning every game every call -- this is now hit once per
// row of every game-log table (each Date cell resolves its own game link), which turned an
// incidental lookup into an O(rows x games) scan on the biggest tables in the app.
let _gameIdByTeamDate = null;
function findGameIdForTeamDate(team, dateStr){
  if(!_gameIdByTeamDate){
    _gameIdByTeamDate = new Map();
    for(const [gid, g] of Object.entries(DATA.games)){
      if(!g || !g.date) continue;
      // first writer wins, matching the old loop's "return the first match" behavior
      if(!_gameIdByTeamDate.has(g.home+'|'+g.date)) _gameIdByTeamDate.set(g.home+'|'+g.date, gid);
      if(!_gameIdByTeamDate.has(g.away+'|'+g.date)) _gameIdByTeamDate.set(g.away+'|'+g.date, gid);
    }
  }
  return _gameIdByTeamDate.get(team+'|'+dateStr) || null;
}
// Navigates to a specific game's full box score page. gid is a string key from DATA.games.
// returnTo, when given, is what the box score's Back button will call -- so clicking a date in
// a player's game log returns you to that player's page rather than dumping you on the home
// team's Team Explorer page, which is all renderGamePage can guess at on its own.
function goToGameBox(gid, returnTo){
  const game = DATA.games[gid];
  if(!game) return;
  renderGamePage(game, returnTo);
}

// Given a team's defensive rank (1=stingiest, of=most generous) for some stat+position bucket,
// returns the [lo,hi] rank window of "similarly-ranked" defenses: +/-3 normally, but widened on
// whichever side has room whenever clamping at rank 1 or `of` would otherwise shrink the window
// below 5 teams. Verified against every case the request specified: rank 1 and rank `of` both
// need one extra team pulled in from the far side to reach 5; ranks 2 and (of-1) already land on
// exactly 5 from plain clamping with no extension needed; everything else in the middle uses the
// full, unclamped 7-team window.
function similarDefenseWindow(rank, of){
  let lo = Math.max(1, rank-3);
  let hi = Math.min(of, rank+3);
  const MIN_WINDOW = 5;
  while((hi-lo+1) < MIN_WINDOW){
    if(lo > 1) lo--;
    else if(hi < of) hi++;
    else break; // `of` itself is smaller than MIN_WINDOW -- can't extend further, window is everyone
  }
  return {lo, hi};
}

// Full stat line for "how has this player done against defenses ranked similarly to today's
// opponent" -- same underlying idea as vsOpponentStatsForLeg (one specific opponent) but pooled
// across every team whose defensive rank for this exact stat+position bucket falls in the
// similarDefenseWindow() around today's opponent's own rank.
function similarDefenseStatsForLeg(leg, useL5){
  if(leg.betType!=='player_prop' && leg.betType!=='player_prop_alt') return null;
  const bucket = positionBucket(getPlayerPosition(leg.player, leg.team));
  if(!bucket) return null;
  const oppRank = useL5 ? getDefenseRankL5(leg.opponent, leg.statKey, bucket) : getDefenseRank(leg.opponent, leg.statKey, bucket);
  if(!oppRank) return null;
  const {lo, hi} = similarDefenseWindow(oppRank.rank, oppRank.of);

  const ranks = useL5 ? computeDefenseVsPositionL5() : computeDefenseVsPosition();
  const similarTeams = TEAM_NAMES.filter(t=>{
    const r = ranks[t] && ranks[t][bucket] && ranks[t][bucket][leg.statKey];
    return r && r.rank>=lo && r.rank<=hi;
  });
  const similarTeamsFull = similarTeams.map(t=>FULL_TEAM_NAME[t]||t);

  const rec = DATA.fullPlayerLogs[leg.player+'|'+leg.team];
  if(!rec) return {oppRank, lo, hi, n:0, avg:null, variance:null, games:[]};
  const games = rec.log.filter(g => !g.dnp && (similarTeams.includes(g.opp) || similarTeamsFull.includes(g.opp)));
  if(!games.length) return {oppRank, lo, hi, n:0, avg:null, variance:null, games:[]};

  // statValue(), not g[key]: these are RAW game-log rows straight off DATA.fullPlayerLogs,
  // which store only the base stats. Every combined stat (pra/pr/pa/ra) has to be derived
  // here. The old code special-cased 'pra' by hand and fell through to g[key] for anything
  // else, so the three two-stat combos silently read undefined -> 0, which also poisoned
  // the hit/miss dot, the Avg and the Var on those rows.
  const values = games.map(g => statValue(g, leg.statKey) || 0);
  const avg = Math.round((values.reduce((a,b)=>a+b,0)/values.length)*10)/10;
  const variance = computeVariance(values);
  const gamesOut = games.map((g,i)=>{
    const oppShort = TEAM_NAMES.includes(g.opp) ? g.opp : (SHORT_TEAM_NAME[g.opp]||g.opp);
    const oppFull = FULL_TEAM_NAME[oppShort] || oppShort;
    const gameId = findGameIdForTeamDate(leg.team, g.date);
    const gameRec = gameId ? DATA.games[gameId] : null;
    const isHome = gameRec ? gameRec.home===leg.team : null;
    // Point-in-time rank for THIS specific historical game -- what the matchup actually looked
    // like right before it tipped off, not today's (or today's L5) snapshot rank.
    const oppRankOfGame = useL5 ? getDefenseRankL5(oppShort, leg.statKey, bucket, g.date) : getDefenseRankAsOf(oppShort, leg.statKey, bucket, g.date);
    return {date:g.date, value:values[i], min:g.min, opp:oppShort, oppFull, oppRank: oppRankOfGame, isHome, gameId};
  });
  return {oppRank, lo, hi, n: games.length, avg, variance, games: gamesOut};
}

// Same visual language as buildVsOpponentCell (hit/miss dot, one clickable line per game, Avg
// summary) -- plus a header line naming the rank window itself. useL5 switches the ranking
// basis (and thus which teams count as "similar") to each defense's last-5-games rank instead
// of season-long.
function buildSimilarDefenseCell(leg, useL5){
  if(leg.betType!=='player_prop' && leg.betType!=='player_prop_alt'){
    return buildTeamSimilarDefenseCell(leg, useL5); // ML/Spread/Total/Team Total -- team-level version
  }
  const stats = similarDefenseStatsForLeg(leg, useL5);
  if(!stats) return document.createTextNode('\u2014 (position unavailable)');
  const wrap = document.createElement('div');
  const header = document.createElement('div'); header.style.cssText = 'font-size:10.5px;color:var(--sub);margin-bottom:2px;';
  header.textContent = `Vs Def Rank ${stats.lo}-${stats.hi}/${stats.oppRank.of}${useL5?' (L5)':''} (today\u2019s opp: ${stats.oppRank.rank}/${stats.oppRank.of})`;
  wrap.appendChild(header);
  if(!stats.games.length){
    const none = document.createElement('div'); none.style.cssText = 'font-size:11px;color:var(--sub);';
    none.textContent = 'No meetings yet vs these defenses';
    wrap.appendChild(none);
    return wrap;
  }
  const threshold = leg.thresholdToHit!==undefined && leg.thresholdToHit!==null ? leg.thresholdToHit : leg.line;
  const hasLine = threshold!==undefined && threshold!==null;
  const statLabel = (STAT_SHORT_LABEL[leg.statKey]||leg.statKey).toLowerCase();
  stats.games.forEach((g,i)=>{
    const row = document.createElement('div'); row.className = 'sim-def-game-row';
    row.style.cssText = 'align-items:center;gap:4px;';
    if(i>0) row.classList.add('sim-def-collapsible'); // collapsed by default -- only the first game shows until "Expand Table" is checked
    if(hasLine){
      const hit = leg.side==='under' ? g.value < threshold : g.value >= threshold;
      row.appendChild(vsOpponentHitIcon(hit));
    }
    row.appendChild(buildStatLine(g, statLabel));
    wrap.appendChild(row);
  });
  const avgRow = document.createElement('div'); avgRow.style.cssText = 'font-size:11px;font-weight:700;margin-top:2px;';
  avgRow.textContent = `Avg: ${stats.avg} (${stats.n} GP)` + (stats.variance!==null ? `, Var: ${stats.variance}` : '');
  wrap.appendChild(avgRow);
  return wrap;
}
// Thin wrapper -- same cell, using each defense's last-5-games rank as the similarity basis.
function buildSimilarDefenseCellL5(leg){
  return buildSimilarDefenseCell(leg, true);
}

function computeTeamVsOpponentGames(leg){
  if(!leg.team || !leg.opponent) return null;
  const games = Object.entries(DATA.games).filter(([gid,g]) =>
    (g.home===leg.team && g.away===leg.opponent) || (g.away===leg.team && g.home===leg.opponent)
  );
  if(!games.length) return null;
  const rows = games.map(([gid,g])=>{
    const isHome = g.home===leg.team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    let label, hit;
    if(leg.betType==='moneyline'){
      label = `${teamPts}-${oppPts} (${teamPts>oppPts?'W':teamPts===oppPts?'T':'L'})`;
      hit = teamPts>oppPts;
    } else if(leg.betType==='spread'){
      label = `${teamPts}-${oppPts}`;
      hit = ((teamPts-oppPts)+leg.line) > 0;
    } else if(leg.betType==='total'){
      const combined = teamPts+oppPts;
      label = `${combined} total (${teamPts}-${oppPts})`;
      hit = leg.side==='under' ? combined<leg.line : combined>leg.line;
    } else if(leg.betType==='team_total'){
      label = `${teamPts} pts`;
      hit = leg.side==='under' ? teamPts<leg.line : teamPts>leg.line;
    } else {
      return null;
    }
    return {date: g.date, label, hit, gameId: gid};
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));
  return rows.length ? rows : null;
}
function buildVsOpponentCell(leg){

    stats.games.forEach(g=>{

      if(hasLine){

        row.appendChild(vsOpponentHitIcon(hit));
      }

      wrap.appendChild(row);

    avgRow.textContent = `Avg: ${stats.avg} (${stats.n} GP)` + (stats.variance!==null ? `, Var: ${stats.variance}` : '');

    row.appendChild(vsOpponentHitIcon(r.hit));

    if(r.gameId){
      const a = document.createElement('a'); a.href='javascript:void(0)'; a.className='player-link';
      a.textContent = txtContent;
      a.title = 'View full box score';
      a.addEventListener('click', ()=>goToGameBox(r.gameId));
      row.appendChild(a);
    } else {
      const txt = document.createElement('span'); txt.textContent = txtContent;
      row.appendChild(txt);

    wrap.appendChild(row);
  });
  return wrap;

function buildAdvancedEdgeCandidates(todaysGames, selectedBook){
  selectedBook = selectedBook || 'best';
  const MIN_PRICE = -165;
  let pool = [];
  todaysGames.forEach(({ev, detail})=>{
    const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
    const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
    const dk = getBookmakerData(ev, selectedBook);
    const dkDetail = detail ? getBookmakerData(detail, selectedBook) : null;
    const gameMarkets = marketsByKey(dk);
    const detailMarkets = marketsByKey(dkDetail);
    const legs = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, 0, selectedBook)
      .filter(l => l.betType==='player_prop' && l.price >= MIN_PRICE);
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    legs.forEach(leg=>{
      const inj = playerInjuryStatus(leg.player, leg.team);
      // Out/Doubtful: exclude entirely \u2014 a great stat-driven pick is moot if she may not play.
      if(inj && (injuryStatusSeverity(inj.status)==='out' || injuryStatusSeverity(inj.status)==='doubtful')) return;
      const edge = computeAdvancedEdgeForLeg(leg);
      if(!edge) return;
      let finalScore = edge.score;
      if(inj) finalScore *= 0.8; // Questionable/Day-to-Day: keep, but discount and flag rather than hide
      finalScore *= teammateKeyInjuryBoost(leg.player, leg.team, leg.side==='over');
      pool.push(Object.assign({}, leg, {game: gameLabel, edge, finalScore, injuryNote: inj ? inj.status : null}));
    });
  });
  pool.sort((a,b)=> b.finalScore - a.finalScore);
  return pool;
}

// The Standard table's ranking order, shared by the Top 30 list and the per-matchup list so the
// two can never drift apart. Ranked primarily by worst-case (min of L5/L10/L15) hit rate. When
// that ties -- which it regularly does, since hit rates are quantized to whole game counts --
// falls back to season rate, and if THAT also ties, to the L10 EMA's directional distance from
// the line (player props only; team-level bets have no per-player EMA, so they stay tied at that
// level and just keep whatever order they were gathered in). Previously ties fell through to
// array insertion order with nothing deliberate deciding between them.
function compareStandardBets(a, b){
  const wcDiff = worstCaseRate(b) - worstCaseRate(a);
  if(wcDiff !== 0) return wcDiff;
  const seasonDiff = (b.rateAll||0) - (a.rateAll||0);
  if(seasonDiff !== 0) return seasonDiff;
  const edgeA = betTiebreakEdge(a), edgeB = betTiebreakEdge(b);
  if(edgeA===null && edgeB===null) return 0;
  if(edgeA===null) return 1;
  if(edgeB===null) return -1;
  return edgeB - edgeA;
}

// TEMPORARY, at Jon's request (2026-08-24): the Standard Top Bets list is player-props-only --
// moneyline, spread and over/under (both Game Total and Team Total) picks are held back. Empty
// this Set to restore them; nothing else needs changing.
// Applied inside computeStandardTopBets rather than in gatherCandidateLegs on purpose: the
// matchup board, the Advanced table and each game's parlay sections all share that gatherer and
// are unaffected. Putting it here also means the App Tracker's daily snapshot records exactly
// the list the table shows, instead of drifting from it.
const STANDARD_EXCLUDED_BET_TYPES = new Set(['moneyline', 'spread', 'total', 'team_total']);

// Standalone extraction of the Standard Top 30 list-building logic (previously inline only
// inside renderTopBetsTable) \u2014 also used by the daily App Tracker snapshot feature, so the
// snapshot captures exactly what this table would show, not a re-implementation of it.
function computeStandardTopBets(cachedFetch, topN, selectedBook){
  topN = topN || 30;
  selectedBook = selectedBook || 'best';
  const todayStr = new Date().toDateString();
  const now = new Date();
  const todaysGames = cachedFetch.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStr && isEligibleForTopBets(ev, now));
  if(todaysGames.length === 0) return { todaysGames, topBets: [] };

  const MIN_PRICE = -165;
  function candidatesForGame(ev, detail, QUAL){
    const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
    const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
    const dk = getBookmakerData(ev, selectedBook);
    const dkDetail = detail ? getBookmakerData(detail, selectedBook) : null;
    const gameMarkets = marketsByKey(dk);
    const detailMarkets = marketsByKey(dkDetail);
    // Game Total exclusion (see the conversation this came from) lives at the source now, inside
    // gatherCandidateLegs itself -- applies uniformly to every feature using it, not just here.
    const legs = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL, selectedBook)
      .filter(l => l.price >= MIN_PRICE && !STANDARD_EXCLUDED_BET_TYPES.has(l.betType));
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    return legs.map(l => Object.assign({}, l, {game: gameLabel}));
  }

  let pool = [];
  todaysGames.forEach(({ev, detail}) => { pool = pool.concat(candidatesForGame(ev, detail, 0.75)); });
  if(pool.length < topN){
    let widerPool = [];
    todaysGames.forEach(({ev, detail}) => { widerPool = widerPool.concat(candidatesForGame(ev, detail, 0.70)); });
    const seen = new Set(pool.map(c=>c.game+'|'+c.label));
    widerPool.forEach(c=>{ const key = c.game+'|'+c.label; if(!seen.has(key)){ pool.push(c); seen.add(key); } });
  }
  pool.sort(compareStandardBets);
  return { todaysGames, topBets: pool.slice(0, topN) };
}

// Every leg the book is offering on ONE matchup, ranked by the same probability chain the
// Standard Top 30 uses -- but with NO hit-rate qualifier (QUAL 0), no price floor, and no cap,
// because the point of the matchup view is to see the whole board for that game rather than a
// pre-trimmed shortlist. The price floor comes back as a *default filter value* in the UI
// instead, where it can be lowered or cleared. Also skips the today/Q1-grace eligibility gate
// that computeStandardTopBets applies: you got here by deliberately drilling into this game, and
// Live Lines lists each team's NEXT game, which is frequently not today.
function computeMatchupTopBets(ev, detail, selectedBook){
  selectedBook = selectedBook || 'best';
  const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
  const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
  const gameMarkets = marketsByKey(getBookmakerData(ev, selectedBook));
  const detailMarkets = marketsByKey(detail ? getBookmakerData(detail, selectedBook) : null);
  const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
  const legs = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, 0, selectedBook)
    .map(l => Object.assign({}, l, {game: gameLabel}));
  legs.sort(compareStandardBets);
  return legs;
}

/* ================= Click-to-sort for the Top Bets tables =================
   Standard, Advanced, Specials and the per-matchup board don't go through makeTable -- their cells
   are bespoke (hit-rate chips, team links, two-line sub-labels, click-through rank cells), so this
   bolts sorting onto a <thead> that already exists. `specs` is one entry per column, index-parallel
   with the header cells; an entry of null, or one without a .value function, leaves that header
   inert -- which is how the composite "Vs Opponent" / "Vs Similar Defenses" cells opt out, since
   there's no single number they could sensibly sort on.

   Nulls always sort LAST in both directions, so an empty cell never floats to the top looking like
   the best (or worst) value. Text columns default to A-Z and numeric ones to high-first, because
   that's the useful first click in each case. */
function attachTableSort(thead, specs, onChange){
  const ths = [...thead.querySelectorAll('th')];
  if(ths.length !== specs.length){
    console.warn(`attachTableSort: ${specs.length} specs for ${ths.length} header cells -- sorting may be wired to the wrong columns.`);
  }
  const state = {index: null, dir: 'desc'};
  specs.forEach((spec, i)=>{
    const th = ths[i];
    if(!th || !spec || typeof spec.value !== 'function') return;
    th.style.cursor = 'pointer';
    th.title = 'Click to sort by this column';
    const arrow = document.createElement('span');
    arrow.className = 'tbl-sort-arrow';
    arrow.style.cssText = 'font-size:9px;margin-left:3px;color:var(--sub);';
    th.appendChild(arrow);
    th.addEventListener('click', ()=>{
      if(state.index === i){ state.dir = state.dir === 'asc' ? 'desc' : 'asc'; }
      else { state.index = i; state.dir = spec.dir || 'desc'; }
      onChange();
    });
  });
  state.updateArrows = ()=>{
    ths.forEach((th, i)=>{
      const arrow = th && th.querySelector('.tbl-sort-arrow');
      if(arrow) arrow.textContent = state.index === i ? (state.dir === 'asc' ? '\u25B2' : '\u25BC') : '';
    });
  };
  // Returns a sorted COPY, leaving the caller's array (and therefore the original rank order) alone.
  // `unwrap` pulls the bet out of whatever the caller is iterating -- the Standard and Advanced
  // tables iterate {bet, origRank} wrappers, Specials iterates bets directly.
  state.apply = (rows, unwrap)=>{
    if(state.index === null) return rows;
    const spec = specs[state.index];
    if(!spec || typeof spec.value !== 'function') return rows;
    const dir = state.dir === 'asc' ? 1 : -1;
    const isBlank = v => v === null || v === undefined || (typeof v === 'number' && isNaN(v)) || v === '';
    return rows.slice().sort((a, b)=>{
      const va = spec.value(unwrap ? unwrap(a) : a, a);
      const vb = spec.value(unwrap ? unwrap(b) : b, b);
      if(isBlank(va) && isBlank(vb)) return 0;
      if(isBlank(va)) return 1;
      if(isBlank(vb)) return -1;
      if(typeof va === 'string' || typeof vb === 'string') return String(va).localeCompare(String(vb)) * dir;
      return (va - vb) * dir;
    });
  };
  return state;
}

// Scalar accessors behind the composite cells, so a header sorts by the same number the cell
// shows. Each dispatches on whether the bet is a player prop (position-specific defense metrics)
// or team-level, exactly as the cell builders do, and returns null when the value isn't available.
function betIsProp(bet){ return bet.betType === 'player_prop' || bet.betType === 'player_prop_alt'; }
function betPositionBucket(bet){ return positionBucket(getPlayerPosition(bet.player, bet.team)); }
function betDefRankValue(bet, windowSize){
  if(!bet.opponent) return null;
  if(betIsProp(bet)){
    const bucket = betPositionBucket(bet);
    if(!bucket) return null;
    const r = windowSize === 5 ? getDefenseRankL5(bet.opponent, bet.statKey, bucket)
                               : getDefenseRank(bet.opponent, bet.statKey, bucket);
    return r ? r.rank : null;
  }
  const r = getTeamDefenseRank(bet.opponent, windowSize === 5 ? 5 : null);
  return r ? r.rank : null;
}
function betDefAllowedValue(bet){
  if(!bet.opponent) return null;
  let r;
  if(betIsProp(bet)){
    const bucket = betPositionBucket(bet);
    r = bucket ? getDefenseRank(bet.opponent, bet.statKey, bucket) : null;
  } else {
    r = getTeamDefenseRank(bet.opponent, null);
  }
  if(!r || r.perGame === null || r.perGame === undefined) return null;
  const n = Number(r.perGame);
  return isNaN(n) ? null : n;
}
function betDvpValue(bet, windowSize){
  if(!bet.opponent) return null;
  if(betIsProp(bet)){
    const bucket = betPositionBucket(bet);
    return bucket ? dvpIndexWindow(bet.opponent, bet.statKey, bucket, windowSize) : null;
  }
  return teamDvpIndex(bet.opponent, windowSize);
}
function betEmaValue(bet){
  if(betIsProp(bet)) return betTiebreakEma(bet);
  const metric = teamBetMetricType(bet.betType);
  return (metric && bet.team) ? teamEma(bet.team, metric, 10) : null;
}
function betPosValue(bet){ return betIsProp(bet) ? (getPlayerPosition(bet.player, bet.team) || null) : null; }
// The opposing position group's height tier for a specific bet, and her season record against
// that tier. Both lean on the Specials caches, so repeated calls across a table's rows are cheap.
function betGroupTierInfo(bet){
  if(!betIsProp(bet) || !bet.player || !bet.team || !bet.opponent) return null;
  const tierData = cachedHeightTierData(bet.player, bet.team);
  if(!tierData) return null;
  return cachedOpponentGroupTier(bet.player, bet.team, bet.opponent, tierData);
}
function betTierHitRate(bet){
  const g = betGroupTierInfo(bet);
  if(!g || !g.groupTier) return null;
  const tierData = cachedHeightTierData(bet.player, bet.team);
  return tierData ? tierHitRateForLeg(bet, g.groupTier, tierData) : null;
}

// Identifies "the same specific bet" across the Standard and Advanced tables, so a shared row
// can be gold-starred. Only meaningful for player props (the only bet type Advanced covers) --
// team-level bets (moneyline/spread/total) can never appear in Advanced, so they never match.
function betIdentityKey(bet){
  if(bet.betType!=='player_prop' && bet.betType!=='player_prop_alt') return null;
  return [bet.player, bet.team, bet.statKey, bet.side, bet.line].join('|');
}

// opts (all optional) lets a caller reuse this exact table -- same columns, same filter bar,
// same row rendering -- for a different list of bets. The per-matchup "Top Matchup Bets" view on
// Live Lines passes a precomputed, uncapped list plus a default Min Price; everything else about
// the table is identical, which is the point: one implementation, no second copy to keep in sync.
//   bets            precomputed list; skips computeStandardTopBets and the today/Q1 gate entirely
//   title           section heading text
//   titleDef        the \u24d8 tooltip on that heading
//   emptyMessage    shown instead of the table when `bets` comes back empty
//   defaultFilters  seed values for the filter bar, e.g. {minPrice: -165}; the inputs render
//                   pre-filled so it's visible that a filter is active, and Clear Filters still
//                   clears to nothing rather than snapping back to these
function renderTopBetsTable(container, cachedFetch, topN, liveGames, starredKeys, selectedBook, opts){
  opts = opts || {};
  // The opposing height-tier pair, opt-in per caller. Declared up here, not down by the table
  // markup, because the section-title tooltip below reads it -- a `const` referenced above its own
  // declaration throws (TDZ), and that only bites the callers who DON'T pass their own titleDef.
  const showTierCols = !!opts.showTierColumns;
  const tierColsNote = ' <b>Matchup Group</b> is the height tier of the opposing players at her position tonight (minutes-weighted, counting only those not ruled Out); <b>Vs That Tier</b> is her season record against that same tier across every team she\u2019s faced.';
  liveGames = liveGames || [];
  starredKeys = starredKeys || new Set();
  topN = topN || 30;
  container.innerHTML = '';
  const usingOverride = Array.isArray(opts.bets);
  if(!usingOverride && !cachedFetch.length) return;

  const computed = usingOverride ? null : computeStandardTopBets(cachedFetch, topN, selectedBook);
  const todaysGames = usingOverride ? null : computed.todaysGames;
  const topBets = usingOverride ? opts.bets : computed.topBets;
  const sec = document.createElement('div'); sec.className='section-title'; sec.style.fontSize='15px';
  sec.textContent = opts.title || `\u2b50 Today\u2019s Top ${topN} Bets \u2014 Standard`;
  container.appendChild(sec);

  appendDefIcon(thead.querySelector('.th-dvpseason'), 'Opponent\u2019s season-long DvP Index \u2014 how much more (or less) than league-average this defense yields to her position for this stat. Above 1.05 favors the Over, 0.95 or below favors the Under. Click to sort the table by this column.');

  function passesStdFilters(bet){
    if(stdFilters.pos && (bet.betType==='player_prop'||bet.betType==='player_prop_alt') && getPlayerPosition(bet.player,bet.team)!==stdFilters.pos) return false;

    if(stdFilters.minOverall!==null && Math.round(worstCaseRate(bet)*100) < stdFilters.minOverall) return false;
    if(stdFilters.minL5!==null && (bet.rate5===null||bet.rate5===undefined||Math.round(bet.rate5*100)<stdFilters.minL5)) return false;
    if(stdFilters.minL10!==null && (bet.rate10===null||bet.rate10===undefined||Math.round(bet.rate10*100)<stdFilters.minL10)) return false;
    if(stdFilters.minL15!==null && (bet.rate15===null||bet.rate15===undefined||Math.round(bet.rate15*100)<stdFilters.minL15)) return false;
    if(stdFilters.minSeason!==null && (bet.rateAll===null||bet.rateAll===undefined||Math.round(bet.rateAll*100)<stdFilters.minSeason)) return false;

      // gp===0 means "no games against that tier yet", which the cell renders as an em dash.
      // tierHitRateForLeg reports rate 0 in that case, so without the gp guard a bet with NO
      // history would read as a genuine 0% and slip through a Max filter.
      const pct = (hr && hr.gp) ? Math.round(hr.rate*100) : null;
      if(pct===null) return false; // unknown can't be verified against either bound
      if(stdFilters.minTier!==null && pct < stdFilters.minTier) return false;
      if(stdFilters.maxTier!==null && pct > stdFilters.maxTier) return false;
    }
    if(stdFilters.minPrice!==null && bet.price < stdFilters.minPrice) return false;
    if(stdFilters.maxPrice!==null && bet.price > stdFilters.maxPrice) return false;
    return true;

      // ML/Spread/Total/Team Total -- team-level (non-position) defense metrics.
      tdDef.appendChild(teamDefRankCell(bet.opponent, null));

// Second Top Bets table, ranked by the advanced-analytics edge score instead of simple hit
// rate (see buildAdvancedEdgeCandidates above). Same today + Q1-grace eligibility window as
// the main table, same -250 price floor, but player props only.
function renderAdvancedTopBetsTable(container, cachedFetch, topN, liveGames, starredKeys, selectedBook){
  liveGames = liveGames || [];
  starredKeys = starredKeys || new Set();
  topN = topN || 30;
  container.innerHTML = '';
  if(!cachedFetch.length) return;

  const todayStr = new Date().toDateString();
  const now = new Date();
  const todaysGames = cachedFetch.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStr && isEligibleForTopBets(ev, now));

  const sec = document.createElement('div'); sec.className='section-title'; sec.style.fontSize='15px';
  sec.textContent = `\ud83e\udde0 Today\u2019s Top ${topN} Bets \u2014 Advanced Analytics`;
  container.appendChild(sec);
  appendDefIcon(sec, `Player props only, ranked by a composite edge score \u2014 not the same ranking as the hit-rate table above. A leg only qualifies if at least 3 of its 4 EMA windows (L5/L10/L15/full season) agree with the side DraftKings' line implies, AND the opponent's Defense-vs-Position Index doesn't flatly contradict that direction (beyond 0.85/1.15 the wrong way excludes it outright, not just a discount). What's left is scored by how big the edge is, how volatile she's been (IQR over her last 10 games \u2014 high volatility discounts the score), the DvP Index itself (scaled bonus/penalty short of the hard cutoff above), and a Usage Rate (USG%) trend \u2014 whether her last 5 games show rising or falling involvement versus her season norm, nudging the score up to \u00b115%. Players listed Out or Doubtful are excluded outright; Questionable/Day-to-Day players are kept but flagged and discounted. Same pregame-through-Q1 window and -165 price floor as the table above. This is a second opinion from a different methodology, not a replacement \u2014 worth comparing where the two tables agree and where they don't.`);

  if(todaysGames.length === 0){
    const msg0 = document.createElement('div'); msg0.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg0.textContent = 'None of today\u2019s games are within their pregame-through-Q1 window right now \u2014 nothing to rank here yet.';
    container.appendChild(msg0);
    return;
  }

  const pool = buildAdvancedEdgeCandidates(todaysGames, selectedBook);
  const topBets = pool.slice(0, topN);
  if(topBets.length === 0){
    const msg = document.createElement('div'); msg.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg.textContent = 'Nothing in today\u2019s eligible games currently has at least 3 of 4 EMA windows agreeing with DraftKings\u2019 posted line at -165 or better.';
    container.appendChild(msg);
    return;
  }

  const advFilters = { pos:'', minL5:null, minL10:null, minL15:null, minSeason:null, minPrice:null, maxPrice:null, minDvp:null };
  const advFilterBar = document.createElement('div');
  advFilterBar.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;';
  function afGroup(label){
    const g = document.createElement('div'); g.style.cssText = 'display:flex;flex-direction:column;gap:2px;';
    const l = document.createElement('label'); l.textContent = label; l.style.cssText='font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;';
    g.appendChild(l);
    return g;
  }
  const advPosOptions = [...new Set(topBets.map(b => getPlayerPosition(b.player,b.team)).filter(Boolean))];
  const advPosGroup = afGroup('Pos');
  const advPosSel = document.createElement('select'); advPosSel.style.cssText = 'padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);';
  const advOptAll = document.createElement('option'); advOptAll.value=''; advOptAll.textContent='All'; advPosSel.appendChild(advOptAll);
  advPosOptions.forEach(p=>{ const o=document.createElement('option'); o.value=p; o.textContent=p; advPosSel.appendChild(o); });
  advPosSel.addEventListener('change', ()=>{ advFilters.pos = advPosSel.value; renderAdvTable(); });
  advPosGroup.appendChild(advPosSel); advFilterBar.appendChild(advPosGroup);

  [['Min L5%','minL5'],['Min L10%','minL10'],['Min L15%','minL15'],['Min Season%','minSeason'],['Min DvP Idx','minDvp']].forEach(([lbl,key])=>{

    inp.style.cssText = 'width:58px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);';
    inp.addEventListener('change', ()=>{ advFilters[key] = inp.value===''?null:Number(inp.value); renderAdvTable(); });
    g.appendChild(inp); advFilterBar.appendChild(g);
  });
  [['Min Price','minPrice'],['Max Price','maxPrice']].forEach(([lbl,key])=>{
    const g = afGroup(lbl);
    const inp = document.createElement('input'); inp.type='number'; inp.placeholder='any';
    inp.style.cssText = 'width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);';
    inp.addEventListener('change', ()=>{ advFilters[key] = inp.value===''?null:Number(inp.value); renderAdvTable(); });

  const advClearBtn = document.createElement('button'); advClearBtn.textContent='Clear Filters';
  advClearBtn.style.cssText = 'padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:12px;cursor:pointer;font-family:var(--sans);';
  advClearBtn.addEventListener('click', ()=>{

  const advCountDiv = document.createElement('div'); advCountDiv.style.cssText='font-size:11.5px;color:var(--sub);margin:2px 0 6px;';

  const wrap = document.createElement('div'); wrap.className='table-wrap';
  const table = document.createElement('table'); table.style.width='100%';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th class="th-star"></th><th>Rank</th><th class="left">Pos</th><th class="left">Bet</th><th class="left">Game</th><th class="left">Vs Opponent This Season</th><th>Price</th><th class="left">Sportsbook</th>'
    +'<th class="left defcol th-defrank">Opp Def Rank</th><th class="left defcol th-defrankl5">Opp Def Rank L5</th><th class="defcol th-defallowed">Allowed/Gm</th>'
    +'<th class="th-l5">L5</th><th class="th-l10b">L10</th><th class="th-l15b">L15</th><th class="th-full">Season</th>'
    +'<th class="th-agree">Agree</th><th class="th-dvp">DvP Idx</th><th class="left">Injury</th><th></th></tr>';
  appendDefIcon(thead.querySelector('.th-defrank'), STAT_DEFINITIONS.defRank);
  appendDefIcon(thead.querySelector('.th-defrankl5'), 'Same idea as Opp Def Rank, but using only the opponent\u2019s last 5 games instead of the full season -- catches a defense that\u2019s recently gotten notably better or worse. Click either rank number to see the full league ranking.');
  appendDefIcon(thead.querySelector('.th-defallowed'), STAT_DEFINITIONS.defAllowed);
  appendDefIcon(thead.querySelector('.th-l5'), 'EMA (exponential moving average) of this stat over her last 5 games played, plus how many of those 5 games actually cleared this specific line on this specific side (Over/Under) \u2014 e.g. "21.4 (4/5)" means an EMA of 21.4 and she hit this side in 4 of her last 5 games.');
  appendDefIcon(thead.querySelector('.th-l10b'), 'EMA over her last 10 games played, plus how many of those 10 actually cleared this line on this side.');
  appendDefIcon(thead.querySelector('.th-l15b'), 'EMA over her last 15 games played, plus how many of those 15 actually cleared this line on this side.');
  appendDefIcon(thead.querySelector('.th-full'), 'EMA over her full season, plus how many games this season actually cleared this line on this side.');
  appendDefIcon(thead.querySelector('.th-agree'), 'How many of the 4 EMA windows (L5/L10/L15/season) agree with the direction (Over/Under) the line implies. Only legs with 3/4 or 4/4 agreement are shown \u2014 anything less isn\u2019t a real signal.');
  appendDefIcon(thead.querySelector('.th-dvp'), STAT_DEFINITIONS.dvpPts.replace('Points', 'this stat'));
  table.appendChild(thead);
  const tbody = document.createElement('tbody'); table.appendChild(tbody);

  function passesAdvFilters(bet){
    if(advFilters.pos && getPlayerPosition(bet.player,bet.team)!==advFilters.pos) return false;
    if(advFilters.minPrice!==null && bet.price < advFilters.minPrice) return false;
    if(advFilters.maxPrice!==null && bet.price > advFilters.maxPrice) return false;
    if(advFilters.minDvp!==null && (bet.edge.dvp===null || bet.edge.dvp===undefined || bet.edge.dvp < advFilters.minDvp)) return false;
    const checks = [['minL5',5],['minL10',10],['minL15',15],['minSeason','all']];
    for(const [key, w] of checks){
      if(advFilters[key]===null) continue;
      const hc = hitCountFor(bet, w);
      if(!hc || hc.gp===0) return false;
      if(Math.round((hc.hits/hc.gp)*100) < advFilters[key]) return false;
    }
    return true;
  }

  // Header order: star, Rank, Pos, Bet, Game, Vs Opponent, Price, Sportsbook, Opp Def Rank,
  // Opp Def Rank L5, Allowed/Gm, L5, L10, L15, Season, Agree, DvP Idx, Injury, Track.
  const advSortSpecs = [
    {value: bet => { const k = betIdentityKey(bet); return k && starredKeys.has(k) ? 1 : 0; }},
    {value: (bet, row) => row.origRank, dir: 'asc'},
    {value: betPosValue, dir: 'asc'},

    {value: bet => bet.sportsbook, dir: 'asc'},
    {value: bet => betDefRankValue(bet, null), dir: 'asc'},
    {value: bet => betDefRankValue(bet, 5), dir: 'asc'},
    {value: betDefAllowedValue},
    {value: bet => bet.edge && bet.edge.l5},                     // these four are EMAs, not hit rates
    {value: bet => bet.edge && bet.edge.l10},
    {value: bet => bet.edge && bet.edge.l15},
    {value: bet => bet.edge && bet.edge.full},
    {value: bet => bet.edge && bet.edge.agreement},
    {value: bet => bet.edge && bet.edge.dvp},
    {value: bet => bet.injuryNote || null, dir: 'asc'},
    null,                                                        // Track

  const advSort = attachTableSort(thead, advSortSpecs, ()=>renderAdvTable());

    if(key && starredKeys.has(key)){
      tdStar.textContent = '\u2605';
      tdStar.style.color = '#D4AF37';
      tdStar.style.fontSize = '15px';
      tdStar.title = 'Also appears in the Standard table above';
    }
    const tdRank = document.createElement('td'); tdRank.style.cssText = cellStyle + 'font-weight:800;color:var(--navy2);';
    tdRank.textContent = idx+1;
    const advConf = computeAdvConfidence(bet);
    if(advConf) applyConfidenceHighlight(tr, tdRank, advConfidenceExplanation(bet, advConf));
    const tdPos = document.createElement('td'); tdPos.className='left'; tdPos.style.cssText = cellStyle.replace('text-align:center;','');
    tdPos.textContent = getPlayerPosition(bet.player, bet.team) || '\u2014';
    const tdLabel = document.createElement('td'); tdLabel.className='left'; tdLabel.style.cssText = cellStyle.replace('text-align:center;','');
    tdLabel.appendChild(buildLegLabelNode(bet));
    const subLine2 = document.createElement('div');
    subLine2.style.cssText = 'font-size:10.5px;color:var(--sub);margin-top:2px;';
    subLine2.textContent = buildBetSubLineBase(bet);
    tdLabel.appendChild(subLine2);
    enhanceBetSubLineIfLive(bet, liveGames, subLine2);
    const tdGame = document.createElement('td'); tdGame.className='left'; tdGame.style.cssText = cellStyle.replace('text-align:center;','') + 'color:var(--sub);';
    const gameTeams = bet.game.split(' @ ');
    if(gameTeams.length===2){
      tdGame.appendChild(teamLinkEl(gameTeams[0], gameTeams[0]));
      tdGame.appendChild(document.createTextNode(' @ '));
      tdGame.appendChild(teamLinkEl(gameTeams[1], gameTeams[1]));
    } else { tdGame.textContent = bet.game; }
    const tdVsOpp = document.createElement('td'); tdVsOpp.className='left'; tdVsOpp.style.cssText = cellStyle.replace('text-align:center;','') + 'min-width:220px;white-space:nowrap;';
    tdVsOpp.appendChild(buildVsOpponentCell(bet));
    const tdPrice = document.createElement('td'); tdPrice.style.cssText = cellStyle;
    tdPrice.textContent = fmtAmerican(bet.price);
    const tdSportsbook = document.createElement('td'); tdSportsbook.className='left'; tdSportsbook.style.cssText = cellStyle.replace('text-align:center;','');
    tdSportsbook.textContent = bet.sportsbook || '\u2014';
    const tdDef = document.createElement('td'); tdDef.className='left defcol'; tdDef.style.cssText = cellStyle.replace('text-align:center;','');
    const tdDefL5 = document.createElement('td'); tdDefL5.className='left defcol'; tdDefL5.style.cssText = cellStyle.replace('text-align:center;','');
    const tdAllowed = document.createElement('td'); tdAllowed.className='defcol'; tdAllowed.style.cssText = cellStyle;
    if(bet.opponent){

      tdDefL5.appendChild(defRankL5Cell(bet.opponent, bet.statKey, bet.player, bet.team, bet.market));
      tdAllowed.appendChild(defAllowedCell(bet.opponent, bet.statKey, bet.player, bet.team));
    } else {
      tdDef.textContent = '\u2014';
      tdDefL5.textContent = '\u2014';
      tdAllowed.textContent = '\u2014';
    }
    const mk = (v, hc) => {
      const td=document.createElement('td'); td.style.cssText=cellStyle;
      const emaText = v===null||v===undefined?'\u2014':(Math.round(v*10)/10);
      td.textContent = hc ? `${emaText} (${hc.hits}/${hc.gp})` : emaText;
      return td;
    };
    const tdL5 = mk(bet.edge.l5, hitCountFor(bet,5)), tdL10 = mk(bet.edge.l10, hitCountFor(bet,10)),
          tdL15 = mk(bet.edge.l15, hitCountFor(bet,15)), tdFull = mk(bet.edge.full, hitCountFor(bet,'all'));
    const tdAgree = document.createElement('td'); tdAgree.style.cssText = cellStyle + 'font-weight:700;';
    tdAgree.textContent = `${Math.round(bet.edge.agreement*4)}/4`;
    const tdDvp = document.createElement('td'); tdDvp.style.cssText = cellStyle;
    tdDvp.textContent = bet.edge.dvp!==null ? bet.edge.dvp.toFixed(2) : '\u2014';
    if(bet.edge.dvp!==null) tdDvp.style.color = (bet.side==='over' ? bet.edge.dvp>1.05 : bet.edge.dvp<0.95) ? 'var(--green)' : (bet.edge.dvp===1?'inherit':'var(--red)');
