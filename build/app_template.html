    if(bet.injuryNote){ tdInjury.textContent = bet.injuryNote; tdInjury.style.color = INJURY_SEVERITY_COLOR[injuryStatusSeverity(bet.injuryNote)] || 'var(--sub)'; tdInjury.style.fontWeight='700'; }
    else tdInjury.textContent = '\u2014';
    const tdTrack = document.createElement('td'); tdTrack.style.cssText = cellStyle;
    tdTrack.appendChild(makeTrackAndHistoryButtons(bet, 10));
    [tdStar,tdRank,tdPos,tdLabel,tdGame,tdVsOpp,tdPrice,tdSportsbook,tdDef,tdDefL5,tdAllowed,tdL5,tdL10,tdL15,tdFull,tdAgree,tdDvp,tdInjury,tdTrack].forEach(td=>tr.appendChild(td));
    tbody.appendChild(tr);
    });
  }
  renderAdvTable();

  wrap.appendChild(table);
  container.appendChild(wrap);
}

// ==================== "Specials" (third Top Bets tab) ====================
// A deliberately narrow list. A bet only appears if it clears ALL FOUR of:
//   1. hit at least 50% of her last 10 games
//   2. hit at least 50% of her last 15 games
//   3. hit at least 80% of her games THIS SEASON against opposing position groups in the same
//      height tier (shortest / middle / tallest) as the group she's facing tonight -- the same
//      minutes-weighted "Group" classification the player page's Next Opponent section shows
//   4. priced -135 or better (i.e. -135, -120, +140 all qualify; -140 does not)
// Player props only: qualifier 3 is defined in terms of the defender's height tier, which has no
// meaning for a moneyline, spread or total.
// defRankCell/defRankL5Cell take a human market label for their tooltip and for the league
// modal's title. The Standard/Advanced pools get it as bet.market from gatherCandidateLegs;
// gatherAllCapturedLegs doesn't set it, so it's mapped from statKey here using the same wording
// PROP_MARKET_LABEL uses.
const SPECIALS_MARKET_LABEL = STAT_KEY_LABEL; // same prop-stat keys; kept as a name for readability at the call sites
const SPECIALS_MIN_PRICE = -135;
const SPECIALS_RECENT_BAR = 0.50;   // qualifiers 1 and 2
const SPECIALS_TIER_BAR = 0.80;     // qualifier 3

// computeHeightTierData walks her whole log and every one of those games' box scores, so it is
// far too expensive to call once per candidate leg. Memoised for the life of the page; DATA never
// changes after load.
const _specialsTierDataCache = {};
function cachedHeightTierData(playerName, team){
  const key = playerName+'|'+team;
  if(!(key in _specialsTierDataCache)){
    let d = null;
    try{ d = computeHeightTierData(playerName, team, CURRENT_SEASON); }catch(e){ d = null; }
    _specialsTierDataCache[key] = (d && d.allGames) ? d : null;
  }
  return _specialsTierDataCache[key];
}
const _specialsGroupTierCache = {};
function cachedOpponentGroupTier(playerName, team, opp, heightTierData){
  const key = playerName+'|'+team+'|'+opp;
  if(!(key in _specialsGroupTierCache)){
    const bucket = positionBucket(getPlayerPosition(playerName, team));
    let res = null;
    if(bucket && opp){
      try{ res = computePositionGroupTierVsOpponent(bucket, opp, heightTierData); }catch(e){ res = null; }
    }
    _specialsGroupTierCache[key] = res;
  }
  return _specialsGroupTierCache[key];
}

// Side-aware, unlike hitRateFor(), which only ever counts OVERs. An Under hit is computed
// directly rather than as (gp - overHits), so a game with a missing value for that stat is
// excluded from both the numerator and the denominator instead of silently counting as a hit.
function propHitRateSided(playerName, team, statKey, line, side, windowSize){
  const pl = DATA.fullPlayerLogs[playerName+'|'+team];
  if(!pl) return null;
  const threshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
  const played = windowSlice(pl.log, windowSize).filter(g=>!g.dnp);
  const vals = played.map(g=>statValue(g, statKey)).filter(v=>v!==null && v!==undefined);
  if(!vals.length) return {gp:0, hits:0, rate:0, found:true};
  const hits = vals.filter(v => side==='under' ? v < threshold : v >= threshold).length;
  return {gp: vals.length, hits, rate: hits/vals.length, found:true};
}

// Qualifier 3: the same bet, measured over only her season games against this height tier.
function tierHitRateForLeg(leg, tier, heightTierData){
  if(!heightTierData || !tier) return null;
  const games = heightTierData.allGames.filter(g=>g.tier===tier);
  if(!games.length) return {gp:0, hits:0, rate:0, found:true, tier};
  const threshold = Number.isInteger(leg.line) ? leg.line+1 : Math.ceil(leg.line);
  const vals = games.map(g => statValue(g, leg.statKey)).filter(v=>v!==null && v!==undefined);
  if(!vals.length) return {gp:0, hits:0, rate:0, found:true, tier};
  const hits = vals.filter(v => leg.side==='under' ? v < threshold : v >= threshold).length;
  return {gp: vals.length, hits, rate: hits/vals.length, found:true, tier};
}

function computeSpecialsBets(cachedFetch, selectedBook){
  selectedBook = selectedBook || 'draftkings';
  const todayStr = new Date().toDateString();
  const now = new Date();
  const todaysGames = cachedFetch.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStr && isEligibleForTopBets(ev, now));
  if(!todaysGames.length) return {todaysGames, bets: []};

  const out = [];
  todaysGames.forEach(({ev, detail})=>{
    const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
    const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
    const dk = getBookmakerData(ev, selectedBook);
    const dkDetail = detail ? getBookmakerData(detail, selectedBook) : null;
    // gatherAllCapturedLegs (not gatherCandidateLegs) on purpose: it returns EVERY priced
    // outcome with no hit-rate bar of its own, so the only filters applied are the four above.
    const markets = Object.assign({}, marketsByKey(dk), marketsByKey(dkDetail));
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    const gameDate = toEasternDateStr(ev.commence_time);
    let legs = [];
    try{ legs = gatherAllCapturedLegs(markets, ev, homeShort, awayShort, gameLabel, gameDate); }catch(e){ legs = []; }
    legs.forEach(leg=>{
      if(leg.betType!=='player_prop' && leg.betType!=='player_prop_alt') return;
      if(!leg.player || !leg.team || leg.line===undefined || leg.line===null) return;
      if(!(leg.price >= SPECIALS_MIN_PRICE)) return;                       // qualifier 4

      // L5 is shown for context only -- it is NOT one of the four qualifying bars, so it's
      // computed after the cheap price check but never gates anything.
      const hr5 = propHitRateSided(leg.player, leg.team, leg.statKey, leg.line, leg.side, 5);
      const hr10 = propHitRateSided(leg.player, leg.team, leg.statKey, leg.line, leg.side, 10);
      if(!hr10 || !hr10.gp || hr10.rate < SPECIALS_RECENT_BAR) return;     // qualifier 1
      const hr15 = propHitRateSided(leg.player, leg.team, leg.statKey, leg.line, leg.side, 15);
      if(!hr15 || !hr15.gp || hr15.rate < SPECIALS_RECENT_BAR) return;     // qualifier 2

      const tierData = cachedHeightTierData(leg.player, leg.team);
      if(!tierData) return;
      const opp = leg.team === homeShort ? awayShort : homeShort;
      const groupInfo = cachedOpponentGroupTier(leg.player, leg.team, opp, tierData);
      if(!groupInfo || !groupInfo.groupTier) return;
      const hrTier = tierHitRateForLeg(leg, groupInfo.groupTier, tierData);
      if(!hrTier || !hrTier.gp || hrTier.rate < SPECIALS_TIER_BAR) return; // qualifier 3

      // The App Tracker's L5%/L10%/L15%/Season% columns read rate5/rate10/rate15/rateAll (with
      // matching gp counts) frozen onto the bet at capture time. gatherCandidateLegs attaches
      // those for the Standard/Advanced pools; gatherAllCapturedLegs doesn't, so they're built
      // here from the same side-aware helper the Specials bars already use.
      const hrAll = propHitRateSided(leg.player, leg.team, leg.statKey, leg.line, leg.side, 'all');
      out.push(Object.assign({}, leg, {
        rate5: hr5.rate, rate10: hr10.rate, rate15: hr15.rate, rateAll: hrAll ? hrAll.rate : null,
        gp5: hr5.gp, gp10: hr10.gp, gp15: hr15.gp, gpAll: hrAll ? hrAll.gp : 0,
        sportsbook: bookSourceLabel({price: leg.price, book: leg.book}, selectedBook),
        market: SPECIALS_MARKET_LABEL[leg.statKey] || leg.statKey,
        game: gameLabel, opponent: opp, hr5, hr10, hr15, hrAll, hrTier,
        groupTier: groupInfo.groupTier, groupHeightIn: groupInfo.weightedHeight,
        // Carried so the rendered Game cell can link BOTH teams, rather than re-deriving
        // shorts from the display string.
        awayShort, homeShort, awayFull: ev.away_team, homeFull: ev.home_team,
      }));
    });
  });

  // Strongest tier record first (that's the distinguishing qualifier), then the weaker of the
  // two recent windows, then price as a final tiebreak.
  out.sort((a,b)=> (b.hrTier.rate - a.hrTier.rate)
    || (Math.min(b.hr10.rate, b.hr15.rate) - Math.min(a.hr10.rate, a.hr15.rate))
    || (b.price - a.price));
  return {todaysGames, bets: out};
}

function renderTopBets(container, cachedFetch, topN, selectedBook){
  topN = topN || 5;
  selectedBook = selectedBook || 'draftkings';
  container.innerHTML = '';
  if(!cachedFetch.length) return;

  // Only games actually being played today (compared in the browser's local timezone), kept
  // eligible through an estimated end of the 1st quarter. Once live, DraftKings reprices
  // based on in-game reality, but the hit rates below are computed against FULL-game
  // historical distributions \u2014 comparing a live line against full-game history is
  // apples-to-oranges, and it's what makes live-game bets climb this ranking while tending
  // not to hit. This app has no live in-game state (foul trouble, current minutes, score) to
  // adjust for, so a time-based cutoff is the fix rather than a smarter live model \u2014 see
  // isEligibleForTopBets for the real-world-elapsed-time estimate this uses.
  const todayStr = new Date().toDateString();
  const now = new Date();
  const todaysGames = cachedFetch.filter(({ev}) => new Date(ev.commence_time).toDateString() === todayStr && isEligibleForTopBets(ev, now));
  if(todaysGames.length === 0){
    const sec0 = document.createElement('div'); sec0.className='section-title'; sec0.style.fontSize='15px';
    sec0.textContent = `\u2b50 Today\u2019s Top ${topN} Bets (across all games)`;
    container.appendChild(sec0);
    const msg0 = document.createElement('div'); msg0.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg0.textContent = 'None of today\u2019s games are within their pregame-through-Q1 window right now \u2014 nothing to rank here yet. (Bets drop out after an estimated end of the 1st quarter \u2014 tap the \u24d8 above for details.)';
    container.appendChild(msg0);
    return;
  }

  const MIN_PRICE = -250; // "-250 or better" — a bet's price must be -250 or higher (less negative / more positive)
  function candidatesForGame(ev, detail, QUAL){
    const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
    const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
    const dk = getBookmakerData(ev, selectedBook);
    const dkDetail = detail ? getBookmakerData(detail, selectedBook) : null;
    const gameMarkets = marketsByKey(dk);
    const detailMarkets = marketsByKey(dkDetail);
    const legs = gatherCandidateLegs(ev, homeShort, awayShort, gameMarkets, detailMarkets, QUAL, selectedBook)
      .filter(l => l.price >= MIN_PRICE);
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    return legs.map(l => Object.assign({}, l, {game: gameLabel}));
  }

  // Try the 75% bar first (this app's existing definition of "high confidence"); if that
  // doesn't produce at least topN across today's slate, top up with the 70% pool instead
  // of showing fewer than topN — but never invent a bet that doesn't clear at least 70%/70%,
  // and never one worse than -250 regardless of how confident it is.
  let pool = [];
  todaysGames.forEach(({ev, detail}) => { pool = pool.concat(candidatesForGame(ev, detail, 0.75)); });
  if(pool.length < topN){
    let widerPool = [];
    todaysGames.forEach(({ev, detail}) => { widerPool = widerPool.concat(candidatesForGame(ev, detail, 0.70)); });
    const seen = new Set(pool.map(c=>c.game+'|'+c.label));
    widerPool.forEach(c=>{ const key = c.game+'|'+c.label; if(!seen.has(key)){ pool.push(c); seen.add(key); } });
  }

  pool.sort((a,b)=> worstCaseRate(b) - worstCaseRate(a));
  const topBets = pool.slice(0, topN);

  const sec = document.createElement('div'); sec.className='section-title';
  sec.style.fontSize='15px'; sec.textContent = `\u2b50 Today\u2019s Top ${topN} Bets (across all games)`;
  container.appendChild(sec);

  const note = document.createElement('div'); note.className='footnote'; note.style.marginBottom='10px';
  note.textContent = `Only includes games scheduled for today that haven\u2019t tipped off yet, or that tipped off within the last ~${TOP_BETS_QUARTER_GRACE_MINUTES} minutes (a real-world-elapsed-time estimate for end of the 1st quarter \u2014 this app has no live game clock) \u2014 and only bets priced -250 or better. Ranked by worst-case hit rate across the last-10 and last-15-game windows (same 75%/70%-qualified pool used in each game\u2019s parlay sections). Not a guarantee \u2014 this is historical frequency, and these still reflect small samples.`;
  container.appendChild(note);

  if(topBets.length === 0){
    const msg = document.createElement('div'); msg.style.cssText='font-size:13px;color:var(--sub);margin-bottom:20px;';
    msg.textContent = 'Nothing in today\u2019s games currently clears 70% in both the last-10 and last-15 windows at -250 or better.';
    container.appendChild(msg);
    return;
  }

  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:22px;';
  topBets.forEach((c, idx)=>{
    const worstCase = Math.round(worstCaseRate(c)*100);
    const isGold = worstCase>=96;
    const card = document.createElement('div');
    card.style.cssText = `border:2px solid var(${isGold?'--gold':'--green'});border-radius:8px;padding:12px;background:var(${isGold?'--goldbg':'--greenbg'});`;
    const rank = document.createElement('div');
    rank.style.cssText = `font-weight:800;font-size:12px;color:var(${isGold?'--gold':'--green'});margin-bottom:4px;`;
    rank.textContent = `#${idx+1}`;
    const label = document.createElement('div');
    label.style.cssText = 'font-weight:700;font-size:13.5px;margin-bottom:4px;';
    label.appendChild(buildLegLabelNode(c));
    const game = document.createElement('div');
    game.style.cssText = 'font-size:11.5px;color:var(--sub);margin-bottom:6px;';
    const gameTeams = c.game.split(' @ ');
    if(gameTeams.length===2){
      game.appendChild(teamLinkEl(gameTeams[0], gameTeams[0]));
      game.appendChild(document.createTextNode(' @ '));
      game.appendChild(teamLinkEl(gameTeams[1], gameTeams[1]));
    } else {
      game.textContent = c.game;
    }
    const detail = document.createElement('div');
    detail.style.cssText = 'font-size:12px;';
    detail.innerHTML = `${fmtAmerican(c.price)} \u2014 L10: ${Math.round(c.rate10*100)}%, L15: ${Math.round(c.rate15*100)}%`;
    card.appendChild(rank); card.appendChild(label); card.appendChild(game); card.appendChild(detail);
    card.appendChild(makeTrackAndHistoryButtons(c, 10));
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

// Fetches live in-game stats for one game and populates whatever [data-live-*] placeholder
// spans (built by cell()/teamTotalsRow()/the player props table above) are present in `wrap`.
// Each value is formatted to be DIRECTLY comparable to its own line -- spread shows the
// current score MARGIN (not the raw score), since that's what's actually comparable to a
// spread number; total shows the current COMBINED score; player props show that player's
// current value for that specific stat. No-op (leaves the placeholders empty/invisible) for
// games that haven't started, have no ESPN match, or errored -- never shows a wrong or
// misleading number.
async function applyLiveAmounts(wrap, ev){
  let live;
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    live = await fetchJson(`${workerBase}/livestats?away=${encodeURIComponent(ev.away_team)}&home=${encodeURIComponent(ev.home_team)}`);
  }catch(e){ return; }
  if(!live || live.status === 'not_live' || live.awayScore===null || live.homeScore===null) return;

  const setKey = (key, text)=>{
    wrap.querySelectorAll(`[data-live-key="${key}"]`).forEach(el=>{ el.textContent = `(Now: ${text})`; });
  };
  setKey('ml-away', `${live.awayScore}-${live.homeScore}`);
  setKey('ml-home', `${live.homeScore}-${live.awayScore}`);
  setKey('spread-away', (live.awayScore-live.homeScore)>=0?`+${live.awayScore-live.homeScore}`:`${live.awayScore-live.homeScore}`);
  setKey('spread-home', (live.homeScore-live.awayScore)>=0?`+${live.homeScore-live.awayScore}`:`${live.homeScore-live.awayScore}`);
  const combined = live.awayScore + live.homeScore;
  setKey('total-over', combined); setKey('total-under', combined);
  setKey(`teamtotal-${SHORT_TEAM_NAME[ev.away_team] || ev.away_team}`, live.awayScore);
  setKey(`teamtotal-${SHORT_TEAM_NAME[ev.home_team] || ev.home_team}`, live.homeScore);

  if(live.players && live.players.length){
    wrap.querySelectorAll('[data-live-player]').forEach(el=>{
      const pname = el.getAttribute('data-live-player'), statKey = el.getAttribute('data-live-stat');
      const row = live.players.find(p => p.player.toLowerCase() === pname.toLowerCase());
      // Same derivation problem as above: a live box-score row has pts/reb/ast/tpm, never a
      // precomputed combo, so a P+R chip would have shown nothing at all here.
      const v = row ? statValue(row, statKey) : undefined;
      if(v !== undefined && v !== null){
        el.textContent = `Now: ${v}`;
      }
    });
  }

  const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
  const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;

  // Resolves the correct away/home score pair for a verdict element's half (full game, 1st, or
  // 2nd) -- half-specific scores are best-effort (see the Worker's own comment on this) and
  // simply aren't available if ESPN's linescores didn't come through as expected, in which case
  // this returns null and the element is left showing nothing rather than a guessed number.
  function scoresFor(half){
    if(!half) return {away: live.awayScore, home: live.homeScore};
    if(String(half)==='1'){
      if(live.awayFirstHalf==null || live.homeFirstHalf==null) return null;
      return {away: live.awayFirstHalf, home: live.homeFirstHalf};
    }
    if(String(half)==='2'){
      if(live.awaySecondHalf==null || live.homeSecondHalf==null) return null;
      return {away: live.awaySecondHalf, home: live.homeSecondHalf};
    }
    return null;
  }

  wrap.querySelectorAll('.live-verdict').forEach(el=>{
    const type = el.getAttribute('data-verdict-type');
    const side = el.getAttribute('data-verdict-side');
    const point = el.hasAttribute('data-verdict-point') ? parseFloat(el.getAttribute('data-verdict-point')) : null;
    const half = el.getAttribute('data-verdict-half');
    const scores = scoresFor(half);
    if(!scores) return; // half-specific data not available -- leave blank rather than guess

    if(type==='ml'){
      const own = side==='away' ? scores.away : scores.home;
      const opp = side==='away' ? scores.home : scores.away;
      const verdict = own>opp ? 'W' : (own<opp ? 'L' : 'T');
      el.textContent = `${verdict} ${own}-${opp}`;
      el.style.color = verdict==='W' ? 'var(--green)' : (verdict==='L' ? 'var(--red)' : 'var(--sub)');
    } else if(type==='spread'){
      const own = side==='away' ? scores.away : scores.home;
      const opp = side==='away' ? scores.home : scores.away;
      const covering = (own - opp + point) > 0;
      el.textContent = `${covering?'W':'L'} ${point>0?'+':''}${point}`;
      el.style.color = covering ? 'var(--green)' : 'var(--red)';
    } else if(type==='total'){
      const combined = scores.away + scores.home;
      const hitting = side==='over' ? (combined > point) : (combined < point);
      el.textContent = String(combined);
      el.style.color = hitting ? 'var(--green)' : 'var(--red)';
    } else if(type==='teamtotal'){
      const own = (el.getAttribute('data-verdict-team')===awayShort) ? scores.away : scores.home;
      const hitting = side==='over' ? (own > point) : (own < point);
      el.textContent = String(own);
      el.style.color = hitting ? 'var(--green)' : 'var(--red)';
    }
  });
}

function renderGameOddsBlock(container, ev, detail, windowSize, onTitleClick, startCollapsed, uiState, selectedBook){
  windowSize = windowSize===undefined ? 10 : windowSize;
  selectedBook = selectedBook || 'draftkings';
  // "All Books" mode: rather than rebuilding every table to show 6 books side by side (a much
  // larger rewrite), this renders the SAME single-book view once per real book in sequence,
  // each clearly labeled -- reuses every table-building function below completely unchanged.
  if(selectedBook==='all'){
    const allWrap = document.createElement('div');
    Object.keys(BOOK_LABELS).forEach(bookKey=>{
      const hasData = (ev.bookmakers||[]).some(b=>b.key===bookKey);
      if(!hasData) return; // skip books with no odds posted for this game rather than show an empty section
      const bookHeader = document.createElement('div');
      bookHeader.style.cssText = 'font-weight:800;color:var(--navy2);font-size:14px;margin:14px 0 6px;padding-top:10px;border-top:2px solid var(--line);';
      bookHeader.textContent = BOOK_LABELS[bookKey];
      allWrap.appendChild(bookHeader);
      renderGameOddsBlock(allWrap, ev, detail, windowSize, onTitleClick, startCollapsed, uiState, bookKey);
    });
    container.appendChild(allWrap);
    return;
  }
  // uiState (if provided) is this specific game's persisted {sections} from before -- kept for
  // section-level state elsewhere on this page, though the whole-card collapse/expand concept
  // itself no longer applies now that every game is reached by clicking into it directly (no
  // more list of many collapsed games to scan through).
  if(!uiState) uiState = {sections: {}};
  const homeShort = SHORT_TEAM_NAME[ev.home_team] || ev.home_team;
  const awayShort = SHORT_TEAM_NAME[ev.away_team] || ev.away_team;
  const wrap = document.createElement('div'); wrap.className='table-wrap'; wrap.style.padding='16px'; wrap.style.marginBottom='20px';

  const dt = new Date(ev.commence_time);
  const MONTH_ABBR3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${MONTH_ABBR3[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
  const timeStr = dt.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  const titleWrap = document.createElement('div');
  titleWrap.style.cssText = 'background:#000000;border-radius:8px;padding:12px 14px;margin-bottom:14px;';
  const title = document.createElement('div'); title.style.cssText='font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:#ffffff;';
  const awayLink = teamLinkEl(awayShort, ev.away_team); awayLink.style.color='#ffffff';
  const homeLink = teamLinkEl(homeShort, ev.home_team); homeLink.style.color='#ffffff';
  title.appendChild(awayLink);
  title.appendChild(document.createTextNode(' @ '));
  title.appendChild(homeLink);
  title.appendChild(document.createTextNode(`\u2014 ${dateStr} \u2014 ${timeStr}`));
  if(dt <= new Date()){
    const stillEligible = isEligibleForTopBets(ev, new Date());
    const liveBadge = document.createElement('span');
    liveBadge.textContent = stillEligible ? '\ud83d\udd34 LIVE \u2014 IN TOP BETS WINDOW' : '\ud83d\udd34 LIVE \u2014 PAST Q1';
    liveBadge.style.cssText = 'font-size:11px;font-weight:800;color:#ff6b6b;border:1px solid #ff6b6b;border-radius:4px;padding:2px 6px;cursor:pointer;';
    const liveBadgeText = stillEligible
      ? `This game has tipped off but is still within the Top Bets eligibility window (within an estimated ${TOP_BETS_QUARTER_GRACE_MINUTES} minutes of tipoff, standing in for end of the 1st quarter \u2014 this app has no live game clock to know the actual time). It'll drop out of Top Bets after that.`
      : `This game tipped off more than an estimated ${TOP_BETS_QUARTER_GRACE_MINUTES} minutes ago (standing in for past the 1st quarter) and has dropped out of the Top Bets rankings. DraftKings\u2019 lines below still reflect current in-game reality, but the hit rates here are computed against full-game historical performance \u2014 that comparison gets less meaningful the further into the game it is.`;
    liveBadge.addEventListener('click', (e)=>{ e.stopPropagation(); toggleDefPopover(liveBadge, liveBadgeText); });
    title.appendChild(liveBadge);
  }
  if(onTitleClick){
    const drillIn = document.createElement('a');
    drillIn.href = 'javascript:void(0)';
    drillIn.style.cssText='font-size:12.5px;font-weight:700;color:#ffffff;text-decoration:none;border-bottom:1px dashed #ffffff;cursor:pointer;';
    drillIn.textContent = 'View this matchup \u2192';
    drillIn.title = 'Click to view just this matchup';
    drillIn.addEventListener('click', onTitleClick);
    title.appendChild(drillIn);
  }
  titleWrap.appendChild(title);
  const venue = (DATA.teamVenues && DATA.teamVenues[homeShort]) || {};
  if(venue.name){
    const venueLine = document.createElement('div');
    venueLine.style.cssText = 'font-size:12px;color:#ffffff;opacity:.75;margin-top:4px;';
    venueLine.textContent = `${venue.name}${venue.city ? ' \u2014 '+venue.city+(venue.state?', '+venue.state:'') : ''}`;
    titleWrap.appendChild(venueLine);
  }
  wrap.appendChild(titleWrap);

  const injuryBanner = buildInjuryBanner(awayShort, homeShort);

  const gameContentDiv = document.createElement('div'); gameContentDiv.style.marginTop = '6px';
  wrap.appendChild(gameContentDiv);

  const recordsDiv = document.createElement('div');
  recordsDiv.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);';
  function recordText(rec){ return rec ? `${rec.w}-${rec.l}` : '\u2014'; }
  function statPill(label, value){
    const pill = document.createElement('div');
    pill.style.cssText = 'background:var(--bg);border-radius:5px;padding:4px 8px;';
    const lbl = document.createElement('span'); lbl.style.cssText = 'font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;'; lbl.textContent = label;
    const val = document.createElement('span'); val.style.cssText = 'font-size:12.5px;font-weight:700;color:var(--ink);margin-left:5px;'; val.appendChild(value instanceof Node ? value : document.createTextNode(value));
    pill.appendChild(lbl); pill.appendChild(val);
    return pill;
  }
  [ {short: awayShort, full: ev.away_team, isHome:false}, {short: homeShort, full: ev.home_team, isHome:true} ].forEach(t=>{
    const rec = DATA.teamRecords[t.short];
    const card = document.createElement('div');
    card.style.cssText = 'flex:1;min-width:220px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;';
    const nameLink = teamLinkEl(t.short, t.full); nameLink.style.cssText = 'color:var(--ink);font-weight:800;font-size:13px;display:block;margin-bottom:6px;';
    card.appendChild(nameLink);
    if(!rec){
      const na = document.createElement('div'); na.style.cssText = 'font-size:12px;color:var(--sub);'; na.textContent = 'Record not available';
      card.appendChild(na);
      recordsDiv.appendChild(card);
      return;
    }
    const oppShort = t.isHome ? awayShort : homeShort;
    const oppFull = t.isHome ? ev.away_team : ev.home_team;
    // Defensive: vsOpponent/home/away come from the pipeline, and a record object missing any
    // of them would otherwise take down the whole Live Lines block rather than one pill.
    const h2h = (rec.vsOpponent || {})[oppShort];
    const homeAwayLabel = t.isHome ? 'Home' : 'Away';
    const homeAwayRec = t.isHome ? rec.home : rec.away; // recordText() already renders null as an em dash
    const pillRow = document.createElement('div'); pillRow.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;';
    pillRow.appendChild(statPill('Overall', recordText(rec.overall)));
    pillRow.appendChild(statPill(homeAwayLabel, recordText(homeAwayRec)));
    const oppLink = teamLinkEl(oppShort, oppFull); oppLink.style.cssText = 'font-size:12.5px;font-weight:700;';
    const vsPill = document.createElement('div');
    vsPill.style.cssText = 'background:var(--bg);border-radius:5px;padding:4px 8px;';
    const vsLbl = document.createElement('span'); vsLbl.style.cssText = 'font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;'; vsLbl.textContent = 'Vs ';
    const vsVal = document.createElement('span'); vsVal.style.cssText = 'font-size:12.5px;font-weight:700;color:var(--ink);';
    vsVal.appendChild(oppLink); vsVal.appendChild(document.createTextNode(`: ${recordText(h2h)}`));
    vsPill.appendChild(vsLbl); vsPill.appendChild(vsVal);
    pillRow.appendChild(vsPill);
    card.appendChild(pillRow);
    recordsDiv.appendChild(card);
  });
  gameContentDiv.appendChild(recordsDiv);
  if(injuryBanner) gameContentDiv.appendChild(injuryBanner);

  const dk = getBookmakerData(ev, selectedBook);
  const dkDetail = detail ? getBookmakerData(detail, selectedBook) : null;
  const gameMarkets = marketsByKey(dk);
  const detailMarkets = marketsByKey(dkDetail);

  // VSiN only publishes DraftKings Handle %/Bet % splits for full-game Moneyline, Spread,
  // and Total \u2014 not for halves, team totals, player props, alt lines, or parlays. Looks
  // up DATA.vsinSplits[shortTeam][market] (populated by the pipeline's VSiN scrape, if any)
  // and returns {handle, bet} or null if unavailable.
  function vsinSplitFor(shortTeam, market){
    if(!DATA.vsinSplits || !shortTeam) return null;
    const teamSplits = DATA.vsinSplits[shortTeam];
    if(!teamSplits) return null;
    const s = teamSplits[market];
    if(!s || s.handle===undefined || s.bet===undefined) return null;
    return s;
  }
  function vsinCellHtml(split){
    if(!split) return '<span style="color:var(--sub);font-size:11px;">VSiN: \u2014</span>';
    return `<span style="color:var(--navy2);font-size:11px;">VSiN: ${split.handle}% handle / ${split.bet}% bets</span>`;
  }

  // Shared table renderer for Full Game / 1st Half / 2nd Half / Team Totals -- one row per
  // team/side (not the old side-by-side away|home grid), with a consistent column set across
  // every section so the layout reads the same regardless of which market you're looking at.
  function buildOddsTable(container, rows, opts){
    opts = opts || {};
    const includeVsin = opts.includeVsin !== false;
    const wrap = document.createElement('div'); wrap.style.cssText = 'overflow-x:auto;margin:4px 0 12px;';
    const table = document.createElement('table'); table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12.5px;';
    const thead = document.createElement('thead');
    const headers = ['Bet Type','Live Total','Team','Odds','Via','L5','L10','L15'].concat(includeVsin?['VSiN']:[]).concat(['Track','']);
    thead.innerHTML = '<tr>' + headers.map(h=>`<th style="text-align:right;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap;color:var(--sub);font-size:11px;text-transform:uppercase;">${h}</th>`).join('') + '</tr>';
    const tbody = document.createElement('tbody');
    rows.forEach(r=>{
      const tr = document.createElement('tr'); tr.style.cssText = 'border-bottom:1px solid var(--line);';

      const tdType = document.createElement('td'); tdType.style.cssText='padding:7px 8px;color:var(--sub);white-space:nowrap;'; tdType.textContent = r.betType;

      const tdLiveTotal = document.createElement('td'); tdLiveTotal.style.cssText='padding:7px 8px;white-space:nowrap;font-weight:700;';
      if(r.liveVerdict){
        const lv = document.createElement('span'); lv.className='live-verdict';
        lv.setAttribute('data-verdict-type', r.liveVerdict.type);
        lv.setAttribute('data-verdict-side', r.liveVerdict.side);
        if(r.liveVerdict.point!==undefined && r.liveVerdict.point!==null) lv.setAttribute('data-verdict-point', r.liveVerdict.point);
        if(r.liveVerdict.half) lv.setAttribute('data-verdict-half', r.liveVerdict.half);
        if(r.liveVerdict.team) lv.setAttribute('data-verdict-team', r.liveVerdict.team);
        tdLiveTotal.appendChild(lv);
      } else {
        tdLiveTotal.textContent = '\u2014'; tdLiveTotal.style.color = 'var(--sub)'; tdLiveTotal.style.fontWeight = '400';
      }

      const tdTeam = document.createElement('td'); tdTeam.style.cssText='padding:7px 8px;font-weight:700;white-space:nowrap;';
      if(r.teamShort && r.teamFull){ tdTeam.appendChild(teamLinkEl(r.teamShort, r.teamFull)); tdTeam.appendChild(document.createTextNode(r.sideSuffix||'')); }
      else { tdTeam.textContent = r.teamLabel || '\u2014'; }

      const tdOdds = document.createElement('td'); tdOdds.style.cssText='padding:7px 8px;white-space:nowrap;';
      tdOdds.appendChild(document.createTextNode(r.oddsText||'\u2014'));
      if(r.liveKey){
        const ls = document.createElement('span'); ls.className='live-amount'; ls.setAttribute('data-live-key', r.liveKey);
        ls.style.cssText = 'font-size:11px;font-weight:700;color:var(--red);margin-left:6px;';
        tdOdds.appendChild(ls);
      }

      const tdVia = document.createElement('td'); tdVia.style.cssText='padding:7px 8px;color:var(--sub);white-space:nowrap;'; tdVia.textContent = r.viaText || '\u2014';

      function hrCell(hr){
        const td = document.createElement('td'); td.style.cssText='padding:7px 8px;white-space:nowrap;';
        td.appendChild(singleWindowChip(null, hr));
        return td;
      }

      const cellsSoFar = [tdType, tdLiveTotal, tdTeam, tdOdds, tdVia, hrCell(r.hr5), hrCell(r.hr10), hrCell(r.hr15)];

      if(includeVsin){
        const tdVsin = document.createElement('td'); tdVsin.style.cssText='padding:7px 8px;white-space:nowrap;';
        tdVsin.innerHTML = r.vsinSplit ? vsinCellHtml(r.vsinSplit) : '<span style="color:var(--sub);font-size:11px;">\u2014</span>';
        cellsSoFar.push(tdVsin);
      }

      const tdTrack = document.createElement('td'); tdTrack.style.cssText='padding:7px 8px;';
      if(r.trackBtn) tdTrack.appendChild(r.trackBtn); else tdTrack.textContent = '\u2014';

      const tdHist = document.createElement('td'); tdHist.style.cssText='padding:7px 8px;';
      if(r.historyBtn) tdHist.appendChild(r.historyBtn); else tdHist.textContent = '\u2014';

      cellsSoFar.push(tdTrack, tdHist);
      cellsSoFar.forEach(td=>tr.appendChild(td));
      tbody.appendChild(tr);
    });
    table.appendChild(thead); table.appendChild(tbody);
    wrap.appendChild(table);
    container.appendChild(wrap);
  }

  // Builds the 6-row Bet Type/Team table (ML away+home, Spread away+home, Total over+under)
  // for one section (full game, 1st half, or 2nd half) in one shot.
  function buildFullSpreadTotalTable(container, gameMarket, spreadMarket, totalMarket, withHitRate, half){
    const gameLabel = `${ev.away_team} @ ${ev.home_team}`;
    const gameDate = toEasternDateStr(ev.commence_time);
    const rows = [];

    // Moneyline
    {
      const away = dkOutcome(gameMarket, ev.away_team), home = dkOutcome(gameMarket, ev.home_team);
      let awayHr5=null, awayHr10=null, awayHr15=null, homeHr5=null, homeHr10=null, homeHr15=null;
      if(withHitRate){
        const awayFn = half ? ((w)=>teamMoneylineHitRateHalf(awayShort, half, w)) : ((w)=>teamMoneylineHitRate(awayShort, w));
        const homeFn = half ? ((w)=>teamMoneylineHitRateHalf(homeShort, half, w)) : ((w)=>teamMoneylineHitRate(homeShort, w));
        awayHr5=awayFn(5); awayHr10=awayFn(10); awayHr15=awayFn(15);
        homeHr5=homeFn(5); homeHr10=homeFn(10); homeHr15=homeFn(15);
      }
      const awayTrack = (!half && away) ? makeTrackButton({label:`${ev.away_team} Moneyline`, price:away.price, betType:'moneyline', team:awayShort, opponent:homeShort, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const homeTrack = (!half && home) ? makeTrackButton({label:`${ev.home_team} Moneyline`, price:home.price, betType:'moneyline', team:homeShort, opponent:awayShort, side:'team', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const awayHist = (!half && away) ? makeHistoryButton({label:`${ev.away_team} Moneyline`, betType:'moneyline', team:awayShort, opponent:homeShort, gameLabel, eventId: ev.id}) : null;
      const homeHist = (!half && home) ? makeHistoryButton({label:`${ev.home_team} Moneyline`, betType:'moneyline', team:homeShort, opponent:awayShort, gameLabel, eventId: ev.id}) : null;
      rows.push({betType:'Moneyline', teamShort:awayShort, teamFull:ev.away_team, oddsText: away?`${away.price>0?'+':''}${away.price}`:null, viaText: bookSourceLabel(away, selectedBook), hr5:awayHr5, hr10:awayHr10, hr15:awayHr15, vsinSplit: half?null:vsinSplitFor(awayShort,'ml'), trackBtn:awayTrack, historyBtn:awayHist, liveKey: half?null:'ml-away', liveVerdict:{type:'ml', side:'away', half}});
      rows.push({betType:'Moneyline', teamShort:homeShort, teamFull:ev.home_team, oddsText: home?`${home.price>0?'+':''}${home.price}`:null, viaText: bookSourceLabel(home, selectedBook), hr5:homeHr5, hr10:homeHr10, hr15:homeHr15, vsinSplit: half?null:vsinSplitFor(homeShort,'ml'), trackBtn:homeTrack, historyBtn:homeHist, liveKey: half?null:'ml-home', liveVerdict:{type:'ml', side:'home', half}});
    }

    // Spread
    {
      const away = dkOutcome(spreadMarket, ev.away_team), home = dkOutcome(spreadMarket, ev.home_team);
      let awayHr5=null, awayHr10=null, awayHr15=null, homeHr5=null, homeHr10=null, homeHr15=null;
      if(withHitRate){
        const awayFn = half ? ((w)=>teamSpreadHitRateHalf(awayShort, half, away&&away.point, w)) : ((w)=>teamSpreadHitRate(awayShort, away&&away.point, w));
        const homeFn = half ? ((w)=>teamSpreadHitRateHalf(homeShort, half, home&&home.point, w)) : ((w)=>teamSpreadHitRate(homeShort, home&&home.point, w));
        awayHr5=awayFn(5); awayHr10=awayFn(10); awayHr15=awayFn(15);
        homeHr5=homeFn(5); homeHr10=homeFn(10); homeHr15=homeFn(15);
      }
      const awayTrack = (!half && away) ? makeTrackButton({label:`${ev.away_team} ${away.point>0?'+':''}${away.point}`, price:away.price, betType:'spread', team:awayShort, opponent:homeShort, side:'team', line:away.point, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const homeTrack = (!half && home) ? makeTrackButton({label:`${ev.home_team} ${home.point>0?'+':''}${home.point}`, price:home.price, betType:'spread', team:homeShort, opponent:awayShort, side:'team', line:home.point, gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const awayHist = (!half && away) ? makeHistoryButton({label:`${ev.away_team} Spread`, betType:'spread', team:awayShort, opponent:homeShort, gameLabel, eventId: ev.id}) : null;
      const homeHist = (!half && home) ? makeHistoryButton({label:`${ev.home_team} Spread`, betType:'spread', team:homeShort, opponent:awayShort, gameLabel, eventId: ev.id}) : null;
      rows.push({betType:'Spread', teamShort:awayShort, teamFull:ev.away_team, oddsText: away?`${away.point>0?'+':''}${away.point} (${away.price>0?'+':''}${away.price})`:null, viaText: bookSourceLabel(away, selectedBook), hr5:awayHr5, hr10:awayHr10, hr15:awayHr15, vsinSplit: half?null:vsinSplitFor(awayShort,'spread'), trackBtn:awayTrack, historyBtn:awayHist, liveKey: half?null:'spread-away', liveVerdict: away?{type:'spread', side:'away', point:away.point, half}:null});
      rows.push({betType:'Spread', teamShort:homeShort, teamFull:ev.home_team, oddsText: home?`${home.point>0?'+':''}${home.point} (${home.price>0?'+':''}${home.price})`:null, viaText: bookSourceLabel(home, selectedBook), hr5:homeHr5, hr10:homeHr10, hr15:homeHr15, vsinSplit: half?null:vsinSplitFor(homeShort,'spread'), trackBtn:homeTrack, historyBtn:homeHist, liveKey: half?null:'spread-home', liveVerdict: home?{type:'spread', side:'home', point:home.point, half}:null});
    }

    // Total
    {
      const over = dkOutcome(totalMarket,'Over'), under = dkOutcome(totalMarket,'Under');
      const point = over ? over.point : (under ? under.point : undefined);
      const hrFn = half ? ((w)=>teamTotalHitRateHalf(awayShort, half, point, w)) : ((w)=>teamTotalHitRate(awayShort, point, w));
      const hr5 = withHitRate ? hrFn(5) : null, hr10 = withHitRate ? hrFn(10) : null, hr15 = withHitRate ? hrFn(15) : null;
      const overTrack = (!half && over) ? makeTrackButton({label:`Game Total Over ${point}`, price:over.price, betType:'total', team:awayShort, opponent:homeShort, line:point, side:'over', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const underTrack = (!half && under) ? makeTrackButton({label:`Game Total Under ${point}`, price:under.price, betType:'total', team:awayShort, opponent:homeShort, line:point, side:'under', gameLabel, gameDate, commenceTime:ev.commence_time, eventId: ev.id}, 10) : null;
      const overHist = (!half && over) ? makeHistoryButton({label:'Game Total Over', betType:'total', team:awayShort, opponent:homeShort, side:'over', gameLabel, eventId: ev.id}) : null;
      const underHist = (!half && under) ? makeHistoryButton({label:'Game Total Under', betType:'total', team:awayShort, opponent:homeShort, side:'under', gameLabel, eventId: ev.id}) : null;
      rows.push({betType:'Total', teamLabel: over?`Over ${over.point}`:'Over', oddsText: over?`${over.price>0?'+':''}${over.price}`:null, viaText: bookSourceLabel(over, selectedBook), hr5, hr10, hr15, vsinSplit: half?null:vsinSplitFor(awayShort,'total'), trackBtn:overTrack, historyBtn:overHist, liveKey: half?null:'total-over', liveVerdict: over?{type:'total', side:'over', point:over.point, half}:null});

  function buildTeamTotalsTable(container, market, withHitRate, half){

        overHr5=hrFn(5); overHr10=hrFn(10); overHr15=hrFn(15);
        // Under is the exact complement of Over -- team total lines are always half-point, so
        // there's no push case to worry about; "didn't hit the Over" and "hit the Under" are
        // the same event.
        const invert = hr => (hr && hr.found) ? {found:true, rate:1-hr.rate, hits:hr.gp-hr.hits, gp:hr.gp} : hr;
        underHr5=invert(overHr5); underHr10=invert(overHr10); underHr15=invert(overHr15);

      rows.push({betType:'Team Total', teamShort:shortName, teamFull:teamFullName, sideSuffix:' Over', oddsText: over?`${over.point} (${over.price>0?'+':''}${over.price})`:null, viaText: bookSourceLabel(over, selectedBook), hr5:overHr5, hr10:overHr10, hr15:overHr15, vsinSplit:null, trackBtn:overTrack, historyBtn:overHist, liveKey: half?null:`teamtotal-${shortName}`, liveVerdict: over?{type:'teamtotal', side:'over', team:shortName, point:over.point, half}:null});
      rows.push({betType:'Team Total', teamShort:shortName, teamFull:teamFullName, sideSuffix:' Under', oddsText: under?`${under.point} (${under.price>0?'+':''}${under.price})`:null, viaText: bookSourceLabel(under, selectedBook), hr5:underHr5, hr10:underHr10, hr15:underHr15, vsinSplit:null, trackBtn:underTrack, historyBtn:underHist, liveVerdict: under?{type:'teamtotal', side:'under', team:shortName, point:under.point, half}:null});
    });
    buildOddsTable(container, rows, {includeVsin: false});

  const windowLabelText = windowSize==='all' ? 'Full Season' : `Last ${windowSize}`;

  // Builds a labeled, color-coded chip (green/red/grey background, matching every other hit-rate

  // singleWindowChip exactly rather than a separate plain-text format, so this looks and behaves
  // identically to every other hit-rate badge in the app (same 60%/40% thresholds, same colors).
  function buildLabeledChip(labelText, hr){
    const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;align-items:center;gap:5px;';
    const lbl = document.createElement('b'); lbl.textContent = labelText+':'; lbl.style.fontSize='12px';

  // Adds one min/max numeric-range filter control to filterBar, wired to call onChange whenever
  // either value changes. Returns a matches(value) function the caller uses per-row -- null/
  // undefined values never match a set range (consistent with how the rest of the app treats
  // missing data under an active filter).
  function addRangeFilter(filterBar, labelText, onChange){
    const group = document.createElement('div'); group.style.cssText = 'display:flex;flex-direction:column;gap:2px;';
    const lbl = document.createElement('label'); lbl.textContent = labelText;
    lbl.style.cssText = 'font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;';
    group.appendChild(lbl);
    const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:4px;';
    const minI = document.createElement('input'); minI.type='number'; minI.placeholder='Min';
    const maxI = document.createElement('input'); maxI.type='number'; maxI.placeholder='Max';
    const inputStyle = 'padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);width:52px;';
    minI.style.cssText = inputStyle; maxI.style.cssText = inputStyle;
    let min = null, max = null;
    minI.addEventListener('input', ()=>{ min = minI.value===''?null:parseFloat(minI.value); onChange(); });
    maxI.addEventListener('input', ()=>{ max = maxI.value===''?null:parseFloat(maxI.value); onChange(); });
    row.appendChild(minI); row.appendChild(maxI);
    group.appendChild(row);
    filterBar.appendChild(group);
    return function matches(value){
      if(min===null && max===null) return true;
      if(value===null || value===undefined) return false;
      if(min!==null && value<min) return false;
      if(max!==null && value>max) return false;
      return true;
    };
  }

  const TAB_DEFS = [

    {key:'threes', label:'3PM'}, {key:'pra', label:'P+R+A'}, {key:'pr', label:'P+R'}, {key:'pa', label:'P+A'}, {key:'ra', label:'R+A'}, {key:'parlays', label:'Parlay Recommendations'},

  // ================= Game Lines / 1st Half / 2nd Half tabs =================

  const halfInfoWrap1 = document.createElement('div'); halfInfoWrap1.style.cssText = 'margin-bottom:8px;';

  halfInfoWrap2.appendChild(halfInfoIcon2);

  buildFullSpreadTotalTable(tabContents.half2, detailMarkets['h2h_h2'], detailMarkets['spreads_h2'], detailMarkets['totals_h2'], true, 2);
  buildTeamTotalsTable(tabContents.half2, detailMarkets['team_totals_h2'], true, 2);

  // ================= O/U table for one stat -- highlights whichever side (Over/Under) has hit
  // more often over the page's selected window, with a click-to-expand detail row per player
  // (L5/L10/L15/Season %+record, Opp Def Rank, Allowed/Gm). Filter dims non-matching rows rather
  // than removing them, and is scoped to this table only -- separate from the Alt Lines filter
  // below it, per the request that the two stay independent. =================
  function buildOUTable(container, rows, showMarketColumn){
    if(!rows.length){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-bottom:16px;'; na.textContent = `No O/U lines posted by DraftKings for this game yet.`;
      container.appendChild(na);
      return;
    }
    const filterState = {player:''};
    const filterBar = document.createElement('div');
    filterBar.style.cssText = 'display:flex;gap:12px;margin-bottom:10px;align-items:flex-end;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;';
    const playerGroup = document.createElement('div'); playerGroup.style.cssText = 'display:flex;flex-direction:column;gap:2px;';
    const playerLbl = document.createElement('label'); playerLbl.textContent = 'Player'; playerLbl.style.cssText = 'font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;';
    const playerInput = document.createElement('input'); playerInput.type='text'; playerInput.placeholder='Search\u2026';
    playerInput.style.cssText = 'padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);width:120px;';
    playerInput.addEventListener('input', ()=>{ filterState.player = playerInput.value.trim().toLowerCase(); applyFilter(); });
    playerGroup.appendChild(playerLbl); playerGroup.appendChild(playerInput);
    filterBar.appendChild(playerGroup);
    const matchesOverPrice = addRangeFilter(filterBar, 'Over Odds', ()=>applyFilter());
    const matchesUnderPrice = addRangeFilter(filterBar, 'Under Odds', ()=>applyFilter());
    const matchesL5 = addRangeFilter(filterBar, 'L5%', ()=>applyFilter());
    const matchesL10 = addRangeFilter(filterBar, 'L10%', ()=>applyFilter());
    const matchesL15 = addRangeFilter(filterBar, 'L15%', ()=>applyFilter());
    const matchesSeason = addRangeFilter(filterBar, 'Season%', ()=>applyFilter());
    const clearBtn = document.createElement('button'); clearBtn.textContent = 'Clear Filters';
    clearBtn.style.cssText = 'padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:12px;cursor:pointer;font-family:var(--sans);';
    clearBtn.addEventListener('click', ()=>{
      filterState.player = ''; playerInput.value = '';
      filterBar.querySelectorAll('input[type=number]').forEach(i=>{ i.value=''; i.dispatchEvent(new Event('input')); });
      applyFilter();
    });
    filterBar.appendChild(clearBtn);
    const expandAllGroup = document.createElement('div'); expandAllGroup.style.cssText = 'display:flex;flex-direction:column;gap:2px;';
    const expandAllLbl = document.createElement('label'); expandAllLbl.style.cssText = 'font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.03em;'; expandAllLbl.textContent = 'Show Details';
    const expandAllRow = document.createElement('label'); expandAllRow.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;padding-top:2px;';
    const expandAllCb = document.createElement('input'); expandAllCb.type = 'checkbox'; expandAllCb.checked = true;
    expandAllRow.appendChild(expandAllCb); expandAllRow.appendChild(document.createTextNode('Expand all'));
    expandAllGroup.appendChild(expandAllLbl); expandAllGroup.appendChild(expandAllRow);
    filterBar.appendChild(expandAllGroup);
    container.appendChild(filterBar);

    const marketTh = showMarketColumn ? '<th class="left" style="padding:4px 3px;border-bottom:2px solid var(--line);width:16%;">Mkt</th>' : '';
    const nameWidth = showMarketColumn ? '26%' : '30%';
    const table = document.createElement('table'); table.style.cssText = 'width:100%;border-collapse:collapse;margin-bottom:20px;table-layout:fixed;font-size:11px;';
    table.innerHTML = `<thead><tr><th class="left" style="padding:4px 3px;border-bottom:2px solid var(--line);width:${nameWidth};">Player</th>${marketTh}<th style="padding:4px 3px;border-bottom:2px solid var(--line);width:27%;">Over</th><th style="padding:4px 3px;border-bottom:2px solid var(--line);width:27%;">Under</th><th style="padding:4px 3px;border-bottom:2px solid var(--line);width:20%;">Track</th></tr></thead>`;
    const tbody = document.createElement('tbody'); table.appendChild(tbody);
    container.appendChild(table);
    const colCount = showMarketColumn ? 5 : 4;

    const filterableRows = [];
    rows.forEach(r=>{
      const statKey = r.statKey, marketLabel = r.marketLabel;
      const overRate = (r.hr && r.hr.found) ? r.hr.rate : null;
      const underRate = overRate!==null ? 1-overRate : null;
      const overIsBetter = overRate!==null && overRate > underRate;
      const underIsBetter = underRate!==null && underRate > overRate;

      const tr = document.createElement('tr'); tr.style.cssText = 'border-bottom:1px solid var(--line);cursor:pointer;';
      const tdName = document.createElement('td'); tdName.className='left'; tdName.style.cssText='padding:4px 3px;font-size:11px;overflow-wrap:break-word;';
      const link = document.createElement('a'); link.href='javascript:void(0)'; link.className='player-link'; link.style.fontSize='11px'; link.textContent = r.pname;
      link.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(r.pname, r.team); });
      tdName.appendChild(link);
      const tdMarket = document.createElement('td'); tdMarket.className='left'; tdMarket.style.cssText='padding:4px 3px;color:var(--sub);font-size:10px;'; tdMarket.textContent = marketLabel;

      const tdOver = document.createElement('td'); tdOver.style.cssText='padding:4px 3px;text-align:center;';
      if(r.overO){
        const box = document.createElement('span'); box.textContent = `O ${r.line} (${fmtAmerican(r.overO.price)})`;
        box.style.cssText = `display:inline-block;padding:2px 4px;border-radius:5px;font-size:10.5px;white-space:nowrap;${overIsBetter?'border:2px solid var(--green);font-weight:800;':'border:2px solid transparent;'}`;
        tdOver.appendChild(box);
      } else tdOver.textContent = '\u2014';

      const tdUnder = document.createElement('td'); tdUnder.style.cssText='padding:4px 3px;text-align:center;';
      if(r.underO){
        const box = document.createElement('span'); box.textContent = `U ${r.line} (${fmtAmerican(r.underO.price)})`;
        box.style.cssText = `display:inline-block;padding:2px 4px;border-radius:5px;font-size:10.5px;white-space:nowrap;${underIsBetter?'border:2px solid var(--green);font-weight:800;':'border:2px solid transparent;'}`;
        tdUnder.appendChild(box);
      } else tdUnder.textContent = '\u2014';

      const tdTrack = document.createElement('td'); tdTrack.style.cssText='padding:4px 2px;text-align:center;';
      tdTrack.addEventListener('click', e=>e.stopPropagation());
      const overThreshold = Number.isInteger(r.line) ? r.line+1 : Math.ceil(r.line);
      // Stacked vertically (Over's pair on top, Under's below) rather than side by side --
      // side-by-side would need 4 small buttons in a row, which doesn't fit a phone screen
      // without horizontal scrolling. Both makeTrackButton/makeHistoryButton stay their normal
      // shared size (used all over the app); scaled down with CSS specifically in this cell only.
      if(r.overO){
        const btn = makeTrackAndHistoryButtons({label:`${r.pname} Over ${r.line} ${marketLabel}`, price:r.overO.price, betType:'player_prop', team:r.team, opponent: r.team===homeShort?awayShort:homeShort, player:r.pname, statKey, line:r.line, side:'over', thresholdToHit:overThreshold, gameLabel:`${ev.away_team} @ ${ev.home_team}`, gameDate:toEasternDateStr(ev.commence_time), eventId: ev.id}, 10);
        btn.children[0].textContent = '+O'; btn.children[0].title = 'Track the Over';
        btn.style.cssText = 'display:flex;justify-content:center;transform:scale(0.78);transform-origin:center;margin:0 auto;';
        tdTrack.appendChild(btn);
      }
      if(r.underO){
        const btn = makeTrackAndHistoryButtons({label:`${r.pname} Under ${r.line} ${marketLabel}`, price:r.underO.price, betType:'player_prop', team:r.team, opponent: r.team===homeShort?awayShort:homeShort, player:r.pname, statKey, line:r.line, side:'under', thresholdToHit:overThreshold, gameLabel:`${ev.away_team} @ ${ev.home_team}`, gameDate:toEasternDateStr(ev.commence_time), eventId: ev.id}, 10);
        btn.children[0].textContent = '+U'; btn.children[0].title = 'Track the Under';
        btn.style.cssText = 'display:flex;justify-content:center;transform:scale(0.78);transform-origin:center;margin:0 auto;';
        tdTrack.appendChild(btn);
      }

      (showMarketColumn ? [tdName, tdMarket, tdOver, tdUnder, tdTrack] : [tdName, tdOver, tdUnder, tdTrack]).forEach(td=>tr.appendChild(td));
      tbody.appendChild(tr);

      const detailTr = document.createElement('tr');
      const detailTd = document.createElement('td'); detailTd.colSpan = colCount; detailTd.style.cssText = 'padding:10px 14px;background:#f7f8fa;border-bottom:2px solid var(--line);font-size:12px;';
      detailTr.appendChild(detailTd);
      tbody.appendChild(detailTr);

      function buildDetailContent(){
        if(detailTd.dataset.built) return;
        detailTd.dataset.built = '1';
        detailTd.style.fontSize = '11px';
        const oppTeam = r.team===homeShort?awayShort:homeShort;
        const statsRow = document.createElement('div'); statsRow.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
        statsRow.appendChild(buildLabeledChip('L5', r.hr5));
        statsRow.appendChild(buildLabeledChip('L10', r.hr10));
        statsRow.appendChild(buildLabeledChip('L15', r.hr15));
        statsRow.appendChild(buildLabeledChip('Season', r.hrAll));
        detailTd.appendChild(statsRow);
        const extraRow = document.createElement('div'); extraRow.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center;';
        const defWrap = document.createElement('span'); defWrap.innerHTML = '<b>Opp Def Rank: </b>'; defWrap.appendChild(defRankCell(oppTeam, statKey, r.pname, r.team, marketLabel));
        const allowedWrap = document.createElement('span'); allowedWrap.innerHTML = '<b>Allowed/Gm: </b>'; allowedWrap.appendChild(defAllowedCell(oppTeam, statKey, r.pname, r.team));
        extraRow.appendChild(defWrap); extraRow.appendChild(allowedWrap);
        detailTd.appendChild(extraRow);
      }
      // Expand All defaults to checked, so every row's detail starts built and visible,
      // matching the reference screenshot -- individual rows can still be toggled by hand on
      // top of whatever the checkbox's bulk state is.
      buildDetailContent();

      tr.addEventListener('click', ()=>{
        const isOpen = detailTr.style.display !== 'none';
        detailTr.style.display = isOpen ? 'none' : '';
        buildDetailContent();
      });

      filterableRows.push({tr, pname: r.pname, r, detailTr});
    });

    expandAllCb.addEventListener('change', ()=>{
      filterableRows.forEach(({detailTr})=>{ detailTr.style.display = expandAllCb.checked ? '' : 'none'; });
    });

    function applyFilter(){
      filterableRows.forEach(({tr, pname, r})=>{
        const playerOk = !filterState.player || pname.toLowerCase().includes(filterState.player);
        const overPriceOk = matchesOverPrice(r.overO ? r.overO.price : null);
        const underPriceOk = matchesUnderPrice(r.underO ? r.underO.price : null);
        const l5Ok = matchesL5((r.hr5 && r.hr5.found) ? Math.round(r.hr5.rate*100) : null);
        const l10Ok = matchesL10((r.hr10 && r.hr10.found) ? Math.round(r.hr10.rate*100) : null);
        const l15Ok = matchesL15((r.hr15 && r.hr15.found) ? Math.round(r.hr15.rate*100) : null);
        const seasonOk = matchesSeason((r.hrAll && r.hrAll.found) ? Math.round(r.hrAll.rate*100) : null);
        const matches = playerOk && overPriceOk && underPriceOk && l5Ok && l10Ok && l15Ok && seasonOk;
        tr.style.opacity = matches ? '1' : '0.32';

  // ================= Alt Lines horizontal-scroll grid for one stat -- smallest to largest
  // threshold, odds shown beneath each number, click a cell to expand the same detail stats as
  // the O/U table above. Own filter, separate from the O/U table's. =================
  function buildAltLinesGrid(container, altPlayers, showMarketLabel){
    const playerKeys = Object.keys(altPlayers);
    if(!playerKeys.length){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-bottom:16px;'; na.textContent = `No alternate lines posted by DraftKings for this game yet.`;
      container.appendChild(na);
      return;
    }

  // ================= All tab -- every player prop bet across all 5 stats combined, with one

  allTabContainer.appendChild(allGameLinesTitle);

  const allOuTitle = document.createElement('div'); allOuTitle.className='section-title'; allOuTitle.style.marginTop='16px'; allOuTitle.textContent = `All Player Props O/U \u2014 ${windowLabelText} Hit Rate`;

  if(dt <= new Date()){
