function renderLeagueStatsPage(year, mode, windowMode){
  mode = mode || 'totals';
  windowMode = windowMode===undefined ? 'all' : windowMode; // default matches the Team page's default
  const allYears = [...new Set(TEAM_NAMES.flatMap(t=>availableYears(t)))].sort();
  year = year || allYears[allYears.length-1];
  lastRender = () => renderLeagueStatsPage(year, mode, windowMode);
  main.innerHTML = '';
  nav.innerHTML = ''; nav.style.display = 'none';
  main.appendChild(statsPageSwitcher('league'));

  const windowLabelText = windowMode==='all' ? 'Full Season' : `Last ${windowMode}`;
  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\ud83c\udfc0 League Stats \u2014 ${year}, ${windowLabelText} <span id="leagueStatsInfoIcon"></span></h2>`;
  main.appendChild(head);
  appendDefIcon(head.querySelector('#leagueStatsInfoIcon'), `Every team's and every player's line, side by side. Click a column header to sort, click a player's name to see her full game log.`);

  main.appendChild(renderGameWindowStickyBar(windowMode, (val)=>{ if(val!==windowMode) renderLeagueStatsPage(year, mode, val); }));

  const controlsRow = document.createElement('div');
  controlsRow.style.cssText = 'display:flex;align-items:center;gap:24px;margin-bottom:16px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;';

  const yearLabel = document.createElement('div'); yearLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; yearLabel.textContent='Season:';
  const yearSel = document.createElement('select'); yearSel.style.cssText = 'padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);background:var(--panel);';
  allYears.forEach(y=>{ const op=document.createElement('option'); op.value=y; op.textContent=y; yearSel.appendChild(op); });
  yearSel.value = year;
  yearSel.addEventListener('change', ()=>renderLeagueStatsPage(yearSel.value, mode, windowMode));
  const yearWrap = document.createElement('div'); yearWrap.style.cssText='display:flex;align-items:center;gap:8px;';
  yearWrap.appendChild(yearLabel); yearWrap.appendChild(yearSel);

  const modeWrap = document.createElement('div'); modeWrap.style.cssText='display:flex;align-items:center;gap:14px;';
  const modeLabel = document.createElement('div'); modeLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; modeLabel.textContent='Show:';
  modeWrap.appendChild(modeLabel);
  [['totals','Season Totals'],['averages','Per-Game Averages']].forEach(([val,txt])=>{
    const lbl = document.createElement('label'); lbl.style.cssText='display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;';
    const rb = document.createElement('input'); rb.type='radio'; rb.name='leagueStatsMode'; rb.value=val; rb.checked = mode===val;
    rb.addEventListener('change', ()=>{ if(rb.checked) renderLeagueStatsPage(year, val, windowMode); });
    lbl.appendChild(rb); lbl.appendChild(document.createTextNode(txt));
    modeWrap.appendChild(lbl);
  });

  controlsRow.appendChild(yearWrap); controlsRow.appendChild(modeWrap);
  main.appendChild(controlsRow);

  if(allYears.length===0 || !allYears.includes(year)){
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
    na.textContent = `No data loaded for ${year}.`;
    main.appendChild(na);
    return;
  }

  // Compute each team's player-level summary once, reuse for both tables below. Windowed to
  // the selected Game Window, same per-team "most recent N of HER OWN games" logic the Team
  // page itself uses -- teams don't all play on the same days, so "last 10" is last 10 for
  // that specific team, not a shared calendar cutoff.
  const perTeam = {};
  TEAM_NAMES.forEach(team=>{
    const gameIdsInRange = filterGameIdsByYearMonth(team, year, 'full');
    const gameIds = windowSliceRecentFirst(gameIdsInRange, windowMode);
    perTeam[team] = { gameIds, summary: computeTeamSummaryClientSide(team, gameIds) };
  });

  const t1 = document.createElement('div'); t1.className='section-title';
  t1.textContent = `Team ${mode==='totals'?'Totals':'Averages'} \u2014 ${windowLabelText}`;
  main.appendChild(t1);
  const teamRows = TEAM_NAMES.map(team=>{
    const {gameIds, summary} = perTeam[team];
    return computeLeagueTeamRow(team, gameIds, summary.totals, mode);
  });
  // Games Back \u2014 standard formula relative to the league leader (best win differential):
  // GB = ((leaderWins - teamWins) + (teamLosses - leaderLosses)) / 2. Whole league, not split
  // by conference/division, since the WNBA standings table this mirrors doesn't split either.
  if(teamRows.length){
    const leader = teamRows.reduce((best,r)=> (r.wins-r.losses) > (best.wins-best.losses) ? r : best, teamRows[0]);
    teamRows.forEach(r=>{ r.gbNum = ((leader.wins-r.wins)+(r.losses-leader.losses))/2; });
  }
  // Default sort: Games Back (best standing first), with ties broken using the WNBA's own
  // official tiebreaker order (per wnba.com/standings): 1) head-to-head record, 2) win% against
  // teams at .500-or-better, 3) head-to-head point differential, 4) overall point differential.
  // Computed from the SAME game window currently selected above (not always full season) so
  // this stays consistent with whatever GB values are actually showing -- e.g. if "Last 10" is
  // selected, both GB and this tiebreaker reflect that same 10-game slice, not the full season.
  function teamPointDiff(team, opponentFilter){
    let diff = 0;
    perTeam[team].gameIds.forEach(gid=>{
      const g = DATA.games[String(gid)];
      if(!g || g.homeScore===null || g.awayScore===null) return;
      const isHome = g.home===team;
      const opp = isHome ? g.away : g.home;
      if(opponentFilter && opp!==opponentFilter) return;
      const own = isHome ? g.homeScore : g.awayScore;
      const oppScore = isHome ? g.awayScore : g.homeScore;
      diff += (own - oppScore);
    });
    return diff;
  }
  function h2hRecord(teamA, teamB){
    let w=0, l=0;
    perTeam[teamA].gameIds.forEach(gid=>{
      const g = DATA.games[String(gid)];
      if(!g || g.homeScore===null || g.awayScore===null) return;
      const isHome = g.home===teamA;
      const opp = isHome ? g.away : g.home;
      if(opp!==teamB) return;
      const own = isHome ? g.homeScore : g.awayScore;
      const oppScore = isHome ? g.awayScore : g.homeScore;
      if(own>oppScore) w++; else if(own<oppScore) l++;
    });
    return {w, l};
  }
  const rowByTeam = {}; teamRows.forEach(r=>{ rowByTeam[r.team] = r; });
  function winPctVsQualifiers(team){
    let w=0, l=0;
    perTeam[team].gameIds.forEach(gid=>{
      const g = DATA.games[String(gid)];
      if(!g || g.homeScore===null || g.awayScore===null) return;
      const isHome = g.home===team;
      const opp = isHome ? g.away : g.home;
      const oppRow = rowByTeam[opp];
      if(!oppRow || (oppRow.wins+oppRow.losses)===0) return;
      if(oppRow.wins/(oppRow.wins+oppRow.losses) < 0.5) return; // opponent currently under .500 -- excluded from this step
      const own = isHome ? g.homeScore : g.awayScore;
      const oppScore = isHome ? g.awayScore : g.homeScore;
      if(own>oppScore) w++; else if(own<oppScore) l++;
    });
    return (w+l) ? w/(w+l) : null;
  }
  teamRows.sort((a,b)=>{
    if(a.gbNum !== b.gbNum) return a.gbNum - b.gbNum; // fewer games back = better standing = sorts first
    // Tied on GB -- apply the WNBA's own tiebreaker order.
    const h2h = h2hRecord(a.team, b.team);
    if(h2h.w+h2h.l>0 && h2h.w!==h2h.l) return h2h.w>h2h.l ? -1 : 1;
    const aQual = winPctVsQualifiers(a.team), bQual = winPctVsQualifiers(b.team);
    if(aQual!==null && bQual!==null && aQual!==bQual) return bQual - aQual;
    const h2hDiff = teamPointDiff(a.team, b.team) - teamPointDiff(b.team, a.team);
    if(h2hDiff!==0) return h2hDiff>0 ? -1 : 1;
    const overallDiff = teamPointDiff(a.team, null) - teamPointDiff(b.team, null);
    if(overallDiff!==0) return overallDiff>0 ? -1 : 1;
    return a.team.localeCompare(b.team); // fully tied through every official step -- alphabetical as a final, stable fallback
  });
  teamRows.forEach((r,i)=>{ r.standingsRank = i; });
  makeTable(main, LEAGUE_TEAM_COLS, teamRows, {defaultSort:'standingsRank', defaultDir:'asc', noHideDNP:true});

  makeTable(main, LEAGUE_DEF_COLS, defRows, {defaultSort:'oppPts', defaultDir:'asc', noHideDNP:true});

  const t2 = document.createElement('div'); t2.className='section-title';

  const t3 = document.createElement('div'); t3.className='section-title'; t3.style.display='flex'; t3.style.alignItems='center';
  const t3Text = document.createElement('span'); t3Text.textContent = `Individual Player Advanced Metrics \u2014 ${year}`;
  t3.appendChild(t3Text);
  main.appendChild(t3);
  appendDefIcon(t3, `Same advanced-metrics engine as each player\u2019s own page, applied league-wide. EMA/StdDev/IQR reflect her most recent played game (current rolling form, same number her own player page shows right now, independent of the Game Window selector above); USG% and DvP Faced are season averages instead, since a single game\u2019s usage or single game\u2019s matchup wouldn\u2019t represent a season the way a trailing average does. Tap any column header\u2019s \u24d8 for the full definition.<br><br>Team shooting percentages (FG%/3P%/FT%) are computed from the team\u2019s combined makes/attempts across the selected games, not averaged from individual players\u2019 percentages \u2014 that\u2019s the only mathematically correct way to roll them up. "Avg Height (Wtd)" weights each player\u2019s height by her total minutes played in the selected games, so rotation players count more than bench players who barely played.`);
  const leagueAdvRows = computeLeagueAdvancedRows(year);
  makeTable(main, LEAGUE_ADV_COLS, leagueAdvRows, {defaultSort:'ptsEma', defaultDir:'desc', teamFor:r=>r.team, defaultHideDNP:true});

  // ---- Minutes Trend: flags players whose recent minutes have moved sharply vs. their own
  // prior stretch -- independent of the year/window controls above, since it's inherently a
  // "recent games" comparison against the season-long log, not a single-season snapshot. ----
  const trendTitle = document.createElement('div'); trendTitle.className='section-title';
  trendTitle.textContent = '\ud83d\udcc8 Minutes Trend \u2014 Role Changes';
  main.appendChild(trendTitle);
  appendDefIcon(trendTitle, 'Compares each player\u2019s average minutes over her last N games to the N games right before that. Non-injury DNPs (coach\u2019s decision, rest, etc.) count as 0 minutes, so a genuine role change still shows up as a real decrease. Injury-related DNPs are excluded from the comparison entirely, since a health absence isn\u2019t a role change \u2014 note this depends on injury-reason data that isn\u2019t in the current dataset yet, so until a fresh data pull backfills it, all DNPs are treated as non-injury by default. Needs at least 2\u00d7N games of history to make a fair same-size comparison.');

  const trendControls = document.createElement('div');
  trendControls.style.cssText = 'display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;';
  const nGroup = document.createElement('div'); nGroup.style.cssText='display:flex;align-items:center;gap:8px;';
  const nLabel = document.createElement('label'); nLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; nLabel.textContent='Compare last N games:';
  const nInput = document.createElement('input'); nInput.type='number'; nInput.min='2'; nInput.max='30'; nInput.value='10';
  nInput.style.cssText = 'width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);';
  nGroup.appendChild(nLabel); nGroup.appendChild(nInput);
  const threshGroup = document.createElement('div'); threshGroup.style.cssText='display:flex;align-items:center;gap:8px;';
  const threshLabel = document.createElement('label'); threshLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; threshLabel.textContent='Min % change:';
  const threshInput = document.createElement('input'); threshInput.type='number'; threshInput.min='1'; threshInput.max='200'; threshInput.value='20';
  threshInput.style.cssText = 'width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);';
  threshGroup.appendChild(threshLabel); threshGroup.appendChild(threshInput);
  threshGroup.appendChild(document.createTextNode('%'));
  trendControls.appendChild(nGroup); trendControls.appendChild(threshGroup);
  main.appendChild(trendControls);

  const trendResultsDiv = document.createElement('div');
  main.appendChild(trendResultsDiv);

  const TREND_COLS = [
    {key:'player', label:'Player', left:true},
    {key:'recentAvg', label:'Recent Avg Min', round1:true},
    {key:'priorAvg', label:'Prior Avg Min', round1:true},
    {key:'pctChangeDisplay', label:'% Change', left:true},
  ];
  function fmtPctChange(r){ return r.pctChange===null ? 'New (from 0 min)' : `${r.pctChange>=0?'+':''}${Math.round(r.pctChange*100)}%`; }

  function renderTrendTables(){
    trendResultsDiv.innerHTML = '';
    const n = Math.max(2, parseInt(nInput.value)||10);
    const threshold = Math.max(1, parseFloat(threshInput.value)||20) / 100;
    const {increasing, decreasing} = computeMinutesTrend(n, threshold);

    const incTitle = document.createElement('div'); incTitle.style.cssText='font-weight:800;color:var(--green);font-size:14px;margin:10px 0 6px;';
    incTitle.textContent = `\u2191 Minutes Increasing (${increasing.length})`;
    trendResultsDiv.appendChild(incTitle);
    if(increasing.length){
      makeTable(trendResultsDiv, TREND_COLS, increasing.map(r=>Object.assign({}, r, {pctChangeDisplay: fmtPctChange(r)})), {defaultSort:'recentAvg', defaultDir:'desc', teamFor:r=>r.team});
    } else {
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-bottom:14px;'; na.textContent = 'No players currently qualify.';
      trendResultsDiv.appendChild(na);

    decTitle.textContent = `\u2193 Minutes Decreasing (${decreasing.length})`;
    trendResultsDiv.appendChild(decTitle);
    if(decreasing.length){
      makeTable(trendResultsDiv, TREND_COLS, decreasing.map(r=>Object.assign({}, r, {pctChangeDisplay: fmtPctChange(r)})), {defaultSort:'recentAvg', defaultDir:'desc', teamFor:r=>r.team});
    } else {
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;'; na.textContent = 'No players currently qualify.';
      trendResultsDiv.appendChild(na);
    }
  }
  nInput.addEventListener('change', renderTrendTables);
  threshInput.addEventListener('change', renderTrendTables);
  renderTrendTables();
}

    chipWrap.appendChild(chip); chipWrap.appendChild(expandDiv);
    list.appendChild(chipWrap);
  });
  boxScoresTabContent.appendChild(list);
}

function bioLookup(player, team){
  const t = DATA.teams[team];
  if(!t) return {};
  const row = t.summaryFull.totals.find(r=>r.player===player);
  if(!row) return {};
  return { height: row.height, weight: row.weight, age: row.age, dob: row.dob, heightIn: row.heightIn };
}

const GAME_COLS_PER_TEAM = GAME_COLS.filter(c=>c.key!=='team');

function computeGameTeamTotals(rows, team){
  const teamRows = rows.filter(r=>r.team===team);
  const sum = k => teamRows.reduce((a,r)=> a + (r[k]||0), 0);
  const fgm=sum('fgm'), fga=sum('fga'), tpm=sum('tpm'), tpa=sum('tpa'), ftm=sum('ftm'), fta=sum('fta');
  return {
    min: sum('min'), pts: sum('pts'), fgm, fga, fgPct: fga? Math.round((fgm/fga)*10000)/10000 : null,
    tpm, tpa, tpPct: tpa? Math.round((tpm/tpa)*10000)/10000 : null,
    ftm, fta, ftPct: fta? Math.round((ftm/fta)*10000)/10000 : null,
    oreb: sum('oreb'), dreb: sum('dreb'), reb: sum('reb'),
    ast: sum('ast'), stl: sum('stl'), blk: sum('blk'), to: sum('to'), pf: sum('pf'),
    pra: sum('pts') + sum('reb') + sum('ast'),
  };
}

// Builds the two-team box score tables (each with its own footer TEAM TOTAL row) into any
// container \u2014 shared by the full-page renderGamePage and the inline expand-in-place version
// used on the Team Explorer page's Individual Games list.
// Quarter-by-quarter scoring table at the top of a game's box score, same shape as a
// standard broadcast line score, plus a bolded total column. Degrades to a total-only score
// box for games whose feed carried no period breakdown (see inside).
function buildLineScoreTable(container, game){
  const hasPeriods = !!(game.periods && game.periods.home && game.periods.away
    && game.periods.home.length && game.periods.away.length);
  // Falls back to a total-only score box rather than rendering nothing when a game has no
  // period breakdown -- either an older game captured before period scoring was collected, or
  // a feed that didn't supply it. The final score is always known (it's what W/L is computed
  // from everywhere else in the app), so there's no reason for the box score to open with no
  // score on it at all.
  const numPeriods = hasPeriods ? Math.max(game.periods.home.length, game.periods.away.length) : 0;
  const title = document.createElement('div'); title.className='section-title';
  title.textContent = hasPeriods ? 'Line Score' : 'Final Score';
  container.appendChild(title);
  // One tooltip, not two -- appendDefIcon adds an icon per call, and a heading with two of them
  // looks like a bug.
  appendDefIcon(title, hasPeriods
    ? 'Points by quarter, then the final score, the result (W/L), and that team’s season record as of the end of this game — this game included, matching the Team Rec column on the gamelogs.'
    : 'Quarter-by-quarter scoring isn’t available for this game — the data feed didn’t include a period breakdown for it, so only the final score is shown, alongside the result (W/L) and each team’s season record as of the end of this game. Running <code>backfill_periods.py</code> in the pipeline fills the quarters in for older games.');
  const wrap = document.createElement('div'); wrap.className='table-wrap'; wrap.style.cssText='margin-bottom:16px;display:inline-block;';
  const table = document.createElement('table'); table.style.width='auto';
  const thead = document.createElement('thead');
  let headerHtml = '<tr><th class="left"></th>';
  for(let i=1; i<=numPeriods; i++){
    headerHtml += `<th>${i<=4 ? i : (i===5?'OT':'OT'+(i-4))}</th>`;
  }
  headerHtml += `<th>${hasPeriods ? 'T' : 'Final'}</th><th>Result</th><th>Record</th></tr>`;
  thead.innerHTML = headerHtml;
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  const season = game.date ? game.date.slice(0,4) : undefined;
  const won = (a,b) => (typeof a==='number' && typeof b==='number' && a>b);
  [
    {team:game.away, score:game.awayScore, oppScore:game.homeScore, periods:(hasPeriods ? game.periods.away : []), isWinner: won(game.awayScore, game.homeScore), venue:'Away'},
    {team:game.home, score:game.homeScore, oppScore:game.awayScore, periods:(hasPeriods ? game.periods.home : []), isWinner: won(game.homeScore, game.awayScore), venue:'Home'},
  ].forEach(side=>{
    const tr = document.createElement('tr');
    const tdTeam = document.createElement('td'); tdTeam.className='left'; tdTeam.style.fontWeight='700';
    tdTeam.appendChild(teamLinkEl(side.team, FULL_TEAM_NAME[side.team]||side.team, season));
    const venueTag = document.createElement('span');
    venueTag.style.cssText = 'color:var(--sub);font-weight:400;font-size:11px;margin-left:6px;';
    venueTag.textContent = side.venue;
    tdTeam.appendChild(venueTag);
    tr.appendChild(tdTeam);
    for(let i=0; i<numPeriods; i++){
      const td = document.createElement('td');
      td.textContent = side.periods[i]!==undefined ? side.periods[i] : '\u2014';
      tr.appendChild(td);
    }
    const tdTotal = document.createElement('td'); tdTotal.style.fontWeight='800';
    if(side.isWinner) tdTotal.style.color = 'var(--green)';
    tdTotal.textContent = (side.score===null||side.score===undefined) ? '\u2014' : side.score;
    tr.appendChild(tdTotal);

    // Result and standing, in that order. `isWinner` alone can't distinguish a loss from a game
    // with no final score at all, so the result is derived from both scores here rather than
    // treating "not the winner" as a loss.
    const tdResult = document.createElement('td'); tdResult.style.fontWeight='800';
    const bothScored = typeof side.score==='number' && typeof side.oppScore==='number';
    if(!bothScored){ tdResult.textContent = '\u2014'; tdResult.style.color = 'var(--sub)'; }
    else if(side.score > side.oppScore){ tdResult.textContent = 'W'; tdResult.style.color = 'var(--green)'; }
    else if(side.score < side.oppScore){ tdResult.textContent = 'L'; tdResult.style.color = 'var(--red)'; }
    else { tdResult.textContent = 'T'; tdResult.style.color = 'var(--sub)'; }
    tr.appendChild(tdResult);

    // Season record INCLUDING this game -- same convention as the gamelogs' Team Rec column, so
    // a box score opened from a gamelog row shows the identical number.
    const tdRecord = document.createElement('td'); tdRecord.style.color = 'var(--sub)';
    const rec = game.date ? teamRecordAsOf(side.team, game.date) : null;
    tdRecord.textContent = rec ? rec.text : '\u2014';
    tr.appendChild(tdRecord);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  container.appendChild(wrap);
}

function median(arr){
  if(!arr.length) return null;
  const s = arr.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : Math.round(((s[mid-1]+s[mid])/2)*100)/100;
}
function mode(arr){
  if(!arr.length) return null;
  const counts = new Map(); let best=null, bestCount=0;
  arr.forEach(v=>{ const c=(counts.get(v)||0)+1; counts.set(v,c); if(c>bestCount){ bestCount=c; best=v; } });
  return best;
}
function statValues(log, key){ return log.filter(g=>!g.dnp).map(g=>g[key]).filter(v=>v!==null && v!==undefined); }

// PTS+REB+AST, the combined prop line. Stamped onto the row objects rather than derived inside
// the column definition, because sorting reads r[key] directly and the TOTAL/MIN/MAX/AVERAGE/
// MEDIAN/MODE footer rows run over real row values -- a display-only column would sort as
// undefined and leave every summary cell blank. Null if any component is missing (a DNP), so it
// never reads as a genuine zero.
function attachPra(rows){
  (rows || []).forEach(r=>{
    Object.keys(COMBO_STAT_PARTS).forEach(k=>{
      const v = comboFrom(r, k);
      r[k] = (v === undefined) ? null : v;
    });
  });
  return rows;
}

// ================= Advanced analytics (rolling-window forecasting metrics) =================
// Standard deviation, IQR, EMA, Usage Rate, and Defense-vs-Position Index, computed entirely
// from box scores already loaded client-side. NOTE on scope: "Potential Assists" (passes
// leading to a teammate's shot, made or missed) genuinely can't be built from this pipeline's
// data \u2014 ESPN's free box scores/play-by-play don't carry passer-to-shooter event linkage,
// only the final made-assist count. That one specifically would need a source like Her Hoop
// Stats' paid API. Everything below is left out of that limitation.

function stdDevOf(arr){
  if(!arr || arr.length===0) return null;
  const mean = arr.reduce((a,b)=>a+b,0)/arr.length;
  const variance = arr.reduce((a,b)=>a+(b-mean)*(b-mean),0)/arr.length;
  return Math.sqrt(variance);
}
function percentileOf(sortedArr, p){
  if(!sortedArr || sortedArr.length===0) return null;
  const idx = (p/100)*(sortedArr.length-1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if(lo===hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi]-sortedArr[lo])*(idx-lo);
}
function iqrOf(arr){
  if(!arr || arr.length===0) return null;
  const sorted = arr.slice().sort((a,b)=>a-b);
  const q75 = percentileOf(sorted,75), q25 = percentileOf(sorted,25);
  return (q75===null||q25===null) ? null : q75-q25;
}
// arr must be chronological, oldest first. Standard EMA recurrence with smoothing factor
// 2/(span+1) \u2014 seeded with the first value (equivalent to pandas' ewm(adjust=False)).
function emaOf(arr, span){
  if(!arr || arr.length===0) return null;
  const alpha = 2/(span+1);
  let e = arr[0];
  for(let i=1;i<arr.length;i++){ e = arr[i]*alpha + e*(1-alpha); }
  return Math.round(e*100)/100;
}

// Standard (Basketball-Reference) Usage Rate formula:
//   USG% = 100 * ((FGA + 0.44*FTA + TOV) * (Team_MP/5)) / (MP * (Team_FGA + 0.44*Team_FTA + Team_TOV))
// playerRow needs {min, fga, fta, to}; teamAgg needs {mp, fga, fta, to} (team totals for that
// same game, all 5-on-court players combined).
function usgPctForGame(playerRow, teamAgg){
  if(!playerRow || !playerRow.min || !teamAgg || !teamAgg.mp) return null;
  const playerNum = (playerRow.fga||0) + 0.44*(playerRow.fta||0) + (playerRow.to||0);
  const teamDenom = (teamAgg.fga||0) + 0.44*(teamAgg.fta||0) + (teamAgg.to||0);
  if(!teamDenom) return null;
  return Math.round((100 * (playerNum * (teamAgg.mp/5)) / (playerRow.min * teamDenom)) * 10) / 10;
}
// Sums a team's box score rows for one game into the {mp, fga, fta, to} shape usgPctForGame needs.
function teamGameAggFromRows(rows){
  return {
    mp: rows.reduce((a,r)=>a+(r.min||0),0),
    fga: rows.reduce((a,r)=>a+(r.fga||0),0),
    fta: rows.reduce((a,r)=>a+(r.fta||0),0),
    to: rows.reduce((a,r)=>a+(r.to||0),0),
  };
}

// League-average "allowed per game to position X" for each stat \u2014 the baseline DvP Index
// is measured against. Reuses computeDefenseVsPosition()'s per-team numbers (see the
// Defense-vs-Position system added earlier in this file).
let _dvpBaselineCache = null;
function computeDvpBaseline(){
  if(_dvpBaselineCache) return _dvpBaselineCache;
  const ranks = computeDefenseVsPosition();
  const baseline = {};
  ['G','F','C'].forEach(b=>{
    baseline[b] = {};
    PROP_STAT_KEYS.forEach(k=>{
      const vals = TEAM_NAMES.map(t => ranks[t] && ranks[t][b] && ranks[t][b][k] ? ranks[t][b][k].perGame : null).filter(v=>v!==null);
      baseline[b][k] = vals.length ? vals.reduce((a,b2)=>a+b2,0)/vals.length : null;
    });
  });
  _dvpBaselineCache = baseline;
  return baseline;
}
// DvP Index > 1.05 = plus matchup (opponent yields notably more than average to this position;
// lean Over). < 0.95 = tougher matchup (lean Under/away). Returns null if data's unavailable.
function dvpIndex(opponentTeam, statKey, bucket){
  if(!bucket) return null;
  const r = getDefenseRank(opponentTeam, statKey, bucket);
  if(!r) return null;
  const baseline = computeDvpBaseline();
  const base = baseline[bucket] && baseline[bucket][statKey];
  if(!base) return null;
  return Math.round((r.perGame / base) * 1000) / 1000;
}
// Same as dvpIndex, but built on each team's last-N-games defensive numbers instead of the
// full season -- catches a defense that's recently tightened up or fallen off.
const _dvpBaselineWindowCache = {};
function computeDvpBaselineWindow(windowSize){
  if(_dvpBaselineWindowCache[windowSize]) return _dvpBaselineWindowCache[windowSize];
  const ranks = computeDefenseVsPositionWindow(windowSize);
  const baseline = {};
  ['G','F','C'].forEach(b=>{
    baseline[b] = {};
    PROP_STAT_KEYS.forEach(k=>{
      const vals = TEAM_NAMES.map(t => ranks[t] && ranks[t][b] && ranks[t][b][k] ? ranks[t][b][k].perGame : null).filter(v=>v!==null);
      baseline[b][k] = vals.length ? vals.reduce((a,b2)=>a+b2,0)/vals.length : null;
    });
  });
  _dvpBaselineWindowCache[windowSize] = baseline;
  return baseline;
}
function dvpIndexWindow(opponentTeam, statKey, bucket, windowSize){
  if(!bucket) return null;
  const r = getDefenseRankWindow(opponentTeam, statKey, bucket, windowSize);
  if(!r) return null;
  const baseline = computeDvpBaselineWindow(windowSize);
  const base = baseline[bucket] && baseline[bucket][statKey];
  if(!base) return null;
  return Math.round((r.perGame / base) * 1000) / 1000;
}
function dvpIndexL5(opponentTeam, statKey, bucket){ return dvpIndexWindow(opponentTeam, statKey, bucket, 5); }
function dvpIndexL10(opponentTeam, statKey, bucket){ return dvpIndexWindow(opponentTeam, statKey, bucket, 10); }
function dvpIndexL15(opponentTeam, statKey, bucket){ return dvpIndexWindow(opponentTeam, statKey, bucket, 15); }

// Shows all four DvP Index windows (season, L15, L10, L5) stacked in one compact cell.
function buildMultiWindowDvpCell(opponentTeam, statKey, bucket){
  const wrap = document.createElement('div'); wrap.style.cssText = 'font-size:11px;line-height:1.5;';
  const rows = [
    ['Season', dvpIndex(opponentTeam, statKey, bucket)],
    ['L15', dvpIndexL15(opponentTeam, statKey, bucket)],
    ['L10', dvpIndexL10(opponentTeam, statKey, bucket)],
    ['L5', dvpIndexL5(opponentTeam, statKey, bucket)],
  ];
  rows.forEach(([label,val])=>{
    const row = document.createElement('div');
    row.textContent = `${label}: ${val!==null ? val.toFixed(3) : '\u2014'}`;
    wrap.appendChild(row);
  });
  return wrap;
}

function teamBetMetricType(betType){
  if(betType==='moneyline' || betType==='spread') return 'margin';
  if(betType==='team_total') return 'scored';
  if(betType==='total') return 'combined';
  return null;
}
function teamStatsForBet(bet, useL5){
  const metric = teamBetMetricType(bet.betType);
  if(!metric || !bet.team || !bet.opponent) return null;
  const windowSize = useL5 ? 5 : null;
  const oppRank = getTeamDefenseRank(bet.opponent, windowSize);
  if(!oppRank) return null;
  const {lo, hi, teams: similarTeams} = teamSimilarDefenseTeams(oppRank, windowSize);

  const games = [];
  Object.values(DATA.games).forEach(g=>{
    if(g.homeScore==null || g.awayScore==null) return;
    if(g.home!==bet.team && g.away!==bet.team) return;
    const opp = g.home===bet.team ? g.away : g.home;
    if(!similarTeams.includes(opp)) return;
    games.push(g);
  });
  games.sort((a,b)=> b.date.localeCompare(a.date));
  if(!games.length) return {oppRank, lo, hi, n:0, avg:null, variance:null, games:[]};

  const values = games.map(g=>{
    const own = g.home===bet.team ? g.homeScore : g.awayScore;
    const opp = g.home===bet.team ? g.awayScore : g.homeScore;
    return metric==='margin' ? (own-opp) : (metric==='scored' ? own : own+opp);
  });
  const avg = Math.round((values.reduce((a,b)=>a+b,0)/values.length)*10)/10;
  const variance = computeVariance(values);
  const gamesOut = games.map((g,i)=>{
    const isHome = g.home===bet.team;
    const oppTeam = isHome ? g.away : g.home;
    const oppRankOfGame = getTeamDefenseRank(oppTeam, windowSize, g.date);
    return {date:g.date, value:values[i], isHome, oppFull: FULL_TEAM_NAME[oppTeam]||oppTeam, oppRank:oppRankOfGame, gameId: g.id};
  });
  return {oppRank, lo, hi, n:games.length, avg, variance, games:gamesOut};
}
// Team-level equivalent of buildStatLine -- no player/minutes concept, so the value label and
// direction (margin vs. own points vs. combined) come from the metric instead.
function buildTeamStatLine(g, metric){
  const a = document.createElement('a'); a.href = 'javascript:void(0)'; a.className = 'player-link';
  a.style.cssText = 'display:block;font-size:11px;color:inherit;text-decoration:none;';
  const label = metric==='margin' ? 'margin' : (metric==='scored' ? 'pts' : 'combined pts');
  const displayVal = metric==='margin' ? (g.value>=0?'+'+g.value:String(g.value)) : String(g.value);
  const bVal = document.createElement('b'); bVal.textContent = displayVal;
  a.appendChild(bVal);
  a.appendChild(document.createTextNode(` ${label} ${g.isHome?'vs':'@'} `));
  const bRank = document.createElement('b'); bRank.textContent = g.oppRank ? `#${g.oppRank.rank}` : '#\u2014';
  a.appendChild(bRank);
  a.appendChild(document.createTextNode(` (${g.oppFull}) - ${g.date}`));
  if(g.gameId){ a.addEventListener('click', ()=>goToGameBox(g.gameId)); } else { a.style.cursor = 'default'; }
  return a;
}
// Team-level equivalent of buildSimilarDefenseCell -- same collapse/expand behavior, same
// header format, same Avg/Var summary, just built from team game results instead of a player
// log. Hit/miss uses TODAY's line against historical values (no historical betting lines exist
// for past games), same convention player props already use.
function buildTeamSimilarDefenseCell(bet, useL5){
  const stats = teamStatsForBet(bet, useL5);
  if(!stats) return document.createTextNode('\u2014');
  const wrap = document.createElement('div');
  const header = document.createElement('div'); header.style.cssText = 'font-size:10.5px;color:var(--sub);margin-bottom:2px;';
  header.textContent = `Vs Def Rank ${stats.lo}-${stats.hi}/${stats.oppRank.of}${useL5?' (L5)':''} (today\u2019s opp: ${stats.oppRank.rank}/${stats.oppRank.of})`;
  wrap.appendChild(header);
  if(!stats.games.length){
    const none = document.createElement('div'); none.style.cssText = 'font-size:11px;color:var(--sub);';
    none.textContent = 'No meetings yet vs these defenses';
    wrap.appendChild(none);
    return wrap;
  }
  const metric = teamBetMetricType(bet.betType);
  const threshold = bet.line;
  // A moneyline has no line to clear, which is why it used to render with no hit/miss icon at
  // all -- but it does have a perfectly well-defined outcome: the margin for that game. A
  // positive margin means this team won it, so the same green-dot / red-X treatment every other
  // bet type gets applies cleanly here too.
  const isMoneyline = bet.betType==='moneyline';
  const hasLine = threshold!==undefined && threshold!==null && !isMoneyline;
  stats.games.forEach((g,i)=>{
    const row = document.createElement('div'); row.className = 'sim-def-game-row';
    row.style.cssText = 'align-items:center;gap:4px;';
    if(i>0) row.classList.add('sim-def-collapsible');
    if(isMoneyline){
      row.appendChild(vsOpponentHitIcon(g.value > 0)); // g.value is this team's margin in that game
    } else if(hasLine){
      const hit = bet.side==='under' ? g.value < threshold : g.value >= threshold;
      row.appendChild(vsOpponentHitIcon(hit));
    }
    row.appendChild(buildTeamStatLine(g, metric));
    wrap.appendChild(row);
  });
  const avgRow = document.createElement('div'); avgRow.style.cssText = 'font-size:11px;font-weight:700;margin-top:2px;';
  avgRow.textContent = `Avg: ${stats.avg} (${stats.n} GP)` + (stats.variance!==null ? `, Var: ${stats.variance}` : '');
  wrap.appendChild(avgRow);
  return wrap;
}
// Multi-window (season/L15/L10/L5) DvP display, team-level version.
function buildMultiWindowTeamDvpCell(opponentTeam){
  const wrap = document.createElement('div'); wrap.style.cssText = 'font-size:11px;line-height:1.5;';
  [['Season',null],['L15',15],['L10',10],['L5',5]].forEach(([label,windowSize])=>{
    const val = teamDvpIndex(opponentTeam, windowSize);
    const row = document.createElement('div');
    row.textContent = `${label}: ${val!==null ? val.toFixed(3) : '\u2014'}`;
    wrap.appendChild(row);
  });
  return wrap;
}

const TEAM_ADV_COLS = [
  {key:'player', label:'Player', left:true}, {key:'gp', label:'GP'},
  {key:'usgPct', label:'USG%', round2:true},
  {key:'ptsEma', label:'PTS EMA', round2:true}, {key:'ptsStd', label:'PTS StdDev', round2:true, compactHide:true}, {key:'ptsIqr', label:'PTS IQR', round2:true, compactHide:true},
  {key:'rebEma', label:'REB EMA', round2:true, compactHide:true}, {key:'rebStd', label:'REB StdDev', round2:true, compactHide:true}, {key:'rebIqr', label:'REB IQR', round2:true, compactHide:true},
  {key:'astEma', label:'AST EMA', round2:true, compactHide:true}, {key:'astStd', label:'AST StdDev', round2:true, compactHide:true}, {key:'astIqr', label:'AST IQR', round2:true, compactHide:true},
];

// Builds one row per player (within whatever gameIds are currently in view \u2014 respects the
// page's Season + Game Window filters, same as every other table on this page) plus a
// TEAM TOTAL footer row using the team's own per-game combined stats.
function computeAdvancedStatsForTeam(team, gameIds, teamGamesChrono){
  const sortedGameIds = gameIds.slice().sort((a,b)=> DATA.games[String(a)].date.localeCompare(DATA.games[String(b)].date));
  const playerLogs = {};
  sortedGameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return;
    const teamRows = g.rows.filter(r=>r.team===team && !r.dnp);
    const teamAgg = teamGameAggFromRows(teamRows);
    teamRows.forEach(r=>{
      if(!playerLogs[r.athleteId]) playerLogs[r.athleteId] = {player:r.player, games:[]};
      playerLogs[r.athleteId].games.push({pts:r.pts||0, reb:r.reb||0, ast:r.ast||0, usg:usgPctForGame(r, teamAgg)});
    });
  });

  const rows = Object.values(playerLogs).map(p=>{
    const ptsArr = p.games.map(x=>x.pts), rebArr = p.games.map(x=>x.reb), astArr = p.games.map(x=>x.ast);
    const usgArr = p.games.map(x=>x.usg).filter(v=>v!==null);
    const span = Math.max(1, Math.min(10, ptsArr.length));
    return {
      player: p.player, gp: p.games.length,
      usgPct: usgArr.length ? usgArr.reduce((a,b)=>a+b,0)/usgArr.length : null,
      ptsEma: emaOf(ptsArr, span), ptsStd: stdDevOf(ptsArr), ptsIqr: iqrOf(ptsArr),
      rebEma: emaOf(rebArr, span), rebStd: stdDevOf(rebArr), rebIqr: iqrOf(rebArr),
      astEma: emaOf(astArr, span), astStd: stdDevOf(astArr), astIqr: iqrOf(astArr),
    };
  });

  let teamFooter = null;
  if(teamGamesChrono && teamGamesChrono.length){
    const ptsArr = teamGamesChrono.map(g=>g.teamPts), rebArr = teamGamesChrono.map(g=>g.reb), astArr = teamGamesChrono.map(g=>g.ast);
    const span = Math.max(1, Math.min(10, ptsArr.length));
    teamFooter = {
      ptsEma: emaOf(ptsArr, span), ptsStd: stdDevOf(ptsArr), ptsIqr: iqrOf(ptsArr),
      rebEma: emaOf(rebArr, span), rebStd: stdDevOf(rebArr), rebIqr: iqrOf(rebArr),
      astEma: emaOf(astArr, span), astStd: stdDevOf(astArr), astIqr: iqrOf(astArr),
    };
  }
  return {rows, teamFooter};
}

// Defensive counterpart to the teamFooter above \u2014 EMA/StdDev/IQR of what OPPONENTS have

/* ---- Running W-L records, for the Opp Rec / Team Rec gamelog columns ----
   Built from DATA.games rather than DATA.teamRecords, because teamRecords only carries the FINAL
   season record -- a gamelog needs the standing as it stood on each row's own date, so a 28-point
   night against a team that was 2-9 at the time reads differently from one against a 9-2 team.
   Bucketed by season so a multi-season log never mixes years. The record INCLUDES the game on
   that row (the Basketball-Reference convention), which is why the lookup below is the last entry
   with date <= d rather than < d. */
let _teamRecordRunning = null;
function runningTeamRecords(){
  if(_teamRecordRunning) return _teamRecordRunning;
  const bucket = new Map();
  Object.values(DATA.games || {}).forEach(g=>{
    if(!g || typeof g.date !== 'string' || g.homeScore === null || g.homeScore === undefined
       || g.awayScore === null || g.awayScore === undefined) return;
    [[g.home, g.homeScore, g.awayScore], [g.away, g.awayScore, g.homeScore]].forEach(pair=>{
      const t = pair[0]; if(!t) return;
      const k = t + '|' + g.date.slice(0,4);
      if(!bucket.has(k)) bucket.set(k, []);
      bucket.get(k).push({date: g.date, won: pair[1] > pair[2], lost: pair[1] < pair[2]});
    });
  });
  const out = new Map();
  bucket.forEach((arr, k)=>{
    arr.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    let w = 0, l = 0;
    out.set(k, arr.map(e=>{ if(e.won) w++; else if(e.lost) l++; return {date: e.date, w, l}; }));
  });
  _teamRecordRunning = out;
  return out;
}
// {text:'8-6', pct:0.571} for `team` as of the end of play on `dateStr`, or null if that team has
// no completed games on or before it (which is what a scheduled-but-unplayed row would hit).
function teamRecordAsOf(team, dateStr){
  if(!team || typeof dateStr !== 'string') return null;
  const arr = runningTeamRecords().get(team + '|' + dateStr.slice(0,4));
  if(!arr || !arr.length) return null;
  let hit = null;
  for(let i = 0; i < arr.length; i++){ if(arr[i].date <= dateStr) hit = arr[i]; else break; }
  if(!hit) return null;
  const gp = hit.w + hit.l;
  return {text: hit.w + '-' + hit.l, pct: gp ? hit.w / gp : 0};
}
// Stamps teamRec/oppRec (what's displayed) plus teamRecSort/oppRecSort (win pct, so the columns
// sort by strength of opponent instead of lexicographically -- "10-5" would otherwise sort below
// "9-6"). Rows must carry `date` and `opp`. Every call site passes freshly-built row objects.
function attachGameRecords(rows, team){
  (rows || []).forEach(r=>{
    const mine = teamRecordAsOf(team, r.date);
    const theirs = teamRecordAsOf(r.opp, r.date);
    r.teamRec = mine ? mine.text : null;
    r.teamRecSort = mine ? mine.pct : null;
    r.oppRec = theirs ? theirs.text : null;
    r.oppRecSort = theirs ? theirs.pct : null;
    // Result + final score, from the row's own game rather than the record index -- the index
    // only knows win/loss counts, and this column shows the actual scoreline.
    const gid = r.gameId || findGameIdForTeamDate(team, r.date);
    const g = gid ? DATA.games[String(gid)] : null;
    r.wl = null; r.wlSort = null; r.wlWon = null;
    if(g && g.homeScore !== null && g.homeScore !== undefined
       && g.awayScore !== null && g.awayScore !== undefined){
      const isHome = g.home === team;
      const us = isHome ? g.homeScore : g.awayScore;
      const them = isHome ? g.awayScore : g.homeScore;
      r.wlWon = us > them ? true : (us < them ? false : null);
      r.wl = (r.wlWon === true ? 'W' : r.wlWon === false ? 'L' : 'T') + ' ' + us + '-' + them;
      r.wlSort = us - them; // point margin: sorts blowout wins above narrow ones, and W above L
    }
  });
  return rows;
}

// own player page would show right now); USG% and DvP use the SEASON AVERAGE instead, since
// unlike EMA those aren't themselves rolling values \u2014 a single game's USG% or a single game's
// matchup difficulty wouldn't represent her season the way a trailing average does.
const LEAGUE_ADV_COLS = [
  {key:'team', label:'Team', left:true, teamLink:true}, {key:'player', label:'Player', left:true},

// Flags players whose average minutes over their most recent N games differ from their
// average over the N games immediately before that by at least the given threshold (0.20 =
// 20%). DNP games count as 0 minutes rather than being skipped -- a player who's fallen out
// of the rotation entirely is exactly the kind of decrease this should catch, not silently
// pass over. Requires at least 2*windowSize total games in a player's log so both windows are
// real, same-size comparisons; players without enough history yet are left out rather than
// compared on an uneven basis.
// Keyword match against whatever raw DNP reason text Sportradar provides (field/wording not
// yet confirmed against a real WNBA response -- see fetch_sportradar_wnba.py) -- deliberately
// a loose substring match rather than an exact enum check, since guessing the wrong exact
// value would silently fail to catch real injury DNPs.
function isInjuryDnp(g){
  if(!g.dnp || !g.notPlayingReason) return false;
  const s = String(g.notPlayingReason).toLowerCase();
  return s.includes('injur') || s.includes('illness') || s.includes('health') || s.includes('sick');
}
// The set of dates in a team's last-5-games window, memoised -- both height computations walk
// every player log and would otherwise rebuild it hundreds of times.
let _teamHeightWindowCache = null;
function teamHeightWindow(team){
  if(!_teamHeightWindowCache){
    _teamHeightWindowCache = {};
    TEAM_NAMES.forEach(t=>{ _teamHeightWindowCache[t] = new Set(teamRecentGameDates(t, 5)); });
  }
  return _teamHeightWindowCache[team] || new Set();
}

// The dates of a team's last N completed games, newest last. The rotation window has to be the
// TEAM's games, not each player's own last N appearances -- see computeTeamWeightedHeight.
function teamRecentGameDates(team, n){
  const rec = DATA.teams[team];
  if(!rec || !rec.gameIdsFull) return [];
  const dates = rec.gameIdsFull
    .map(gid => (DATA.games[String(gid)] || {}).date)
    .filter(Boolean)
    .sort();
  return dates.slice(-n);
}

// Minutes-weighted average height, per team, over that TEAM'S last 5 games -- roughly "how tall
// is the average player on the floor for this team right now". sum(avgMin_i * height_i) /
// sum(avgMin_i), where avgMin_i is a player's total minutes across those five games divided by
// five. sum(avgMin_i) lands close to 200 (5 players x 40 minutes); overtime nudges it up.
//
// WHY THE WINDOW IS THE TEAM'S GAMES, NOT THE PLAYER'S: this used to take each player's own last
// five games PLAYED (`log.filter(g=>!g.dnp).slice(-5)`), which silently kept traded players in
// their old team's rotation forever -- their last five games for that team are still the newest
// five rows in that log key, however long ago they happened. Kelsey Plum was still shown leading
// the Sparks a month after being dealt to Phoenix. Anchoring to the team's own game dates means a
// player who hasn't appeared in that window contributes nothing and drops off the list, which is
// also the correct treatment for a long-term injury absence.
//
// Dividing by 5 rather than by games-she-played is deliberate too: it makes avgMin literally
// "minutes per team game", so a player who missed two of the five is down-weighted against one
// who played all five, and the column sums to something close to a real rotation's minutes.
function computeTeamWeightedHeight(){
  const teamData = {};
  TEAM_NAMES.forEach(t=>{ teamData[t] = {sumWeighted:0, sumMinutes:0, players:[]}; });

  Object.keys(DATA.fullPlayerLogs).forEach(key=>{
    const sep = key.lastIndexOf('|');
    const playerName = key.slice(0, sep), team = key.slice(sep+1);
    if(!teamData[team]) return;
    const window = teamHeightWindow(team);
    if(!window.size) return;
    const log = DATA.fullPlayerLogs[key].log;
    const inWindow = log.filter(g=>!g.dnp && window.has(g.date));
    if(!inWindow.length) return;  // didn't appear for this team in its last 5 -- traded, injured, or waived
    const avgMin = inWindow.reduce((a,g)=>a+(g.min||0),0) / window.size;
    if(avgMin <= 0) return; // no meaningful recent playing time -- skip rather than dilute with a garbage-time-only player
    const bio = bioLookup(playerName, team);
    if(bio.heightIn===undefined || bio.heightIn===null) return; // no height on file -- skip rather than guess
    teamData[team].sumWeighted += avgMin * bio.heightIn;
    teamData[team].sumMinutes += avgMin;
    teamData[team].players.push({player: playerName, avgMin: Math.round(avgMin*10)/10, heightIn: bio.heightIn, height: bio.height, gamesInWindow: inWindow.length});
  });

  const results = TEAM_NAMES.map(t=>{
    const d = teamData[t];
    const weightedHeightIn = d.sumMinutes > 0 ? d.sumWeighted / d.sumMinutes : null;
    return {
      team: t,
      weightedHeightIn: weightedHeightIn!==null ? Math.round(weightedHeightIn*100)/100 : null,
      totalMinutesAccountedFor: Math.round(d.sumMinutes*10)/10,
      players: d.players.sort((a,b)=>b.avgMin-a.avgMin),
    };
  }).filter(r=>r.weightedHeightIn!==null);
  results.sort((a,b)=>b.weightedHeightIn-a.weightedHeightIn);
  results.forEach((r,i)=>{ r.rank = i+1; r.of = results.length; });
  return results;
}

function computeMinutesTrend(windowSize, thresholdPct){
  const rows = [];
  Object.keys(DATA.fullPlayerLogs).forEach(key=>{
    const sep = key.lastIndexOf('|');
    const playerName = key.slice(0, sep), team = key.slice(sep+1);
    const log = DATA.fullPlayerLogs[key].log;
    if(log.length < windowSize*2) return;
    // Injury DNPs are excluded entirely (not counted as a 0-minute game, not counted as a
    // game at all) rather than treated as a real decrease -- a health absence isn't a role
    // change. Non-injury DNPs (coach's decision, rest, etc.) still count as 0, since those
    // genuinely do reflect a role/usage change. Data without a reason recorded (most of the
    // current dataset, until a fresh Sportradar pull backfills it) falls back to counting
    // every DNP as 0, same as before this distinction existed.
    const recentGames = log.slice(-windowSize).filter(g=>!isInjuryDnp(g));
    const priorGames = log.slice(-windowSize*2, -windowSize).filter(g=>!isInjuryDnp(g));
    if(!recentGames.length || !priorGames.length) return; // window was entirely injury DNPs -- no real basis for a comparison
    const avgMin = games => games.reduce((sum,g)=> sum + (g.dnp || g.min===null || g.min===undefined ? 0 : g.min), 0) / games.length;
    const recentAvg = avgMin(recentGames), priorAvg = avgMin(priorGames);
    let pctChange;
    if(priorAvg === 0){
      if(recentAvg === 0) return; // no minutes in either window -- nothing to report
      pctChange = null; // "new to the rotation" -- a real jump, but no meaningful percent (would be infinite off a zero base)
    } else {
      pctChange = (recentAvg - priorAvg) / priorAvg;
    }
    const qualifies = pctChange === null ? recentAvg >= 5 : Math.abs(pctChange) >= thresholdPct; // the null case still needs a real minutes floor so garbage-time noise doesn't flag
    if(!qualifies) return;
    rows.push({
      player: playerName, team,
      recentAvg: Math.round(recentAvg*10)/10,
      priorAvg: Math.round(priorAvg*10)/10,
      pctChange, // null means "from zero" -- rendered specially, not as a percent
    });
  });
  const increasing = rows.filter(r => r.pctChange === null || r.pctChange > 0).sort((a,b)=>{
    if(a.pctChange===null && b.pctChange===null) return b.recentAvg - a.recentAvg;
    if(a.pctChange===null) return -1;
    if(b.pctChange===null) return 1;
    return b.pctChange - a.pctChange;
  });
  const decreasing = rows.filter(r => r.pctChange !== null && r.pctChange < 0).sort((a,b)=> a.pctChange - b.pctChange);
  return {increasing, decreasing};
}

function computeLeagueAdvancedRows(year){
  const rows = [];
  Object.keys(DATA.fullPlayerLogs).forEach(key=>{
    const sep = key.lastIndexOf('|');
    const playerName = key.slice(0, sep), team = key.slice(sep+1);
    const rec = DATA.fullPlayerLogs[key];
    const yearLog = rec.log.filter(g => g.date && g.date.startsWith(String(year)));
    if(!yearLog.some(g=>!g.dnp)) return;
    const advLog = computePlayerAdvancedLog({player: playerName, log: yearLog}, team).filter(r=>!r.dnp);
    if(!advLog.length) return;
    const last = advLog[advLog.length-1];
    const avg = arr => { arr = arr.filter(v=>v!==null && v!==undefined); return arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*1000)/1000 : null; };
    rows.push({
      team, player: playerName,
      usgPct: avg(advLog.map(r=>r.usgPct)),
      ptsEma: last.ptsEma, ptsStd: last.ptsStd, ptsIqr: last.ptsIqr,
      rebEma: last.rebEma, rebStd: last.rebStd, rebIqr: last.rebIqr,
      astEma: last.astEma, astStd: last.astStd, astIqr: last.astIqr,
      avgDvpPts: avg(advLog.map(r=>r.dvpPts)), avgDvpReb: avg(advLog.map(r=>r.dvpReb)), avgDvpAst: avg(advLog.map(r=>r.dvpAst)),
    });
  });
  return rows;
}

function findGameByTeamDate(team, date){
  return Object.values(DATA.games).find(g => (g.home===team || g.away===team) && g.date===date);
}

// One row per game in pl.log (same window as the box score table directly above it, and in
// the same chronological order), building EMA/StdDev/IQR progressively game-by-game \u2014 each
// row only ever uses that game and earlier ones, never future data, so this reflects what
// would actually have been knowable going into that game.
function computePlayerAdvancedLog(pl, team){
  const rows = [];
  const cumPts = [], cumReb = [], cumAst = [];
  pl.log.forEach(g=>{
    if(g.dnp){
      rows.push({date:g.date, opp:g.opp, homeAway:g.homeAway, dnp:true, min:null, usgPct:null,
        ptsEma:null, ptsStd:null, ptsIqr:null, rebEma:null, rebStd:null, rebIqr:null,
        astEma:null, astStd:null, astIqr:null, dvpPts:null, dvpReb:null, dvpAst:null});
      return;
    }
    cumPts.push(g.pts||0); cumReb.push(g.reb||0); cumAst.push(g.ast||0);
    const trailPts = cumPts.slice(-10), trailReb = cumReb.slice(-10), trailAst = cumAst.slice(-10);

    let usg = null;
    const gameRecord = findGameByTeamDate(team, g.date);
    if(gameRecord){
      const teamRows = gameRecord.rows.filter(r=>r.team===team && !r.dnp);
      const playerRow = teamRows.find(r=>r.player===pl.player);
      if(playerRow) usg = usgPctForGame(playerRow, teamGameAggFromRows(teamRows));
    }

    const oppShort = SHORT_TEAM_NAME[g.opp] || g.opp;
    const bucket = positionBucket(getPlayerPosition(pl.player, team));

    rows.push({
      date:g.date, opp:g.opp, homeAway:g.homeAway, dnp:false, min:g.min, usgPct: usg,
      ptsEma: emaOf(cumPts, Math.min(10,cumPts.length)), ptsStd: stdDevOf(trailPts), ptsIqr: iqrOf(trailPts),
      rebEma: emaOf(cumReb, Math.min(10,cumReb.length)), rebStd: stdDevOf(trailReb), rebIqr: iqrOf(trailReb),
      astEma: emaOf(cumAst, Math.min(10,cumAst.length)), astStd: stdDevOf(trailAst), astIqr: iqrOf(trailAst),
      dvpPts: dvpIndexAsOf(oppShort, 'pts', bucket, g.date), dvpReb: dvpIndexAsOf(oppShort, 'reb', bucket, g.date), dvpAst: dvpIndexAsOf(oppShort, 'ast', bucket, g.date),
    });
  });
  return rows;
}

// Same Total/Min/Max/Average/Median/Mode footer pattern used by the main box score table,
// factored out so the Vs Opponent table (and its advanced-metrics counterpart) can reuse it
// exactly rather than re-implementing it.
function buildStandardFooterRows(rows, statKeys){
  const footerRows = [];
  const n = rows.filter(g=>!g.dnp).length; // matches statValues' own DNP filtering below, not the raw row count (which includes DNPs)
  const gpLabel = `${n} game${n===1?'':'s'} played`;
  const labels = [
    {label:`TOTAL (${gpLabel})`, fn: arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)*100)/100 : null},
    {label:`MIN (${gpLabel})`, fn: arr => arr.length ? Math.min(...arr) : null},
    {label:`MAX (${gpLabel})`, fn: arr => arr.length ? Math.max(...arr) : null},
    {label:`AVERAGE (${gpLabel})`, fn: arr => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100)/100 : null},
    {label:`MEDIAN (${gpLabel})`, fn: median},
    {label:`MODE (${gpLabel})`, fn: mode},
  ];
  labels.forEach(({label, fn})=>{
    const values = {};
    statKeys.forEach(k=>{ values[k] = fn(statValues(rows, k)); });
    footerRows.push({label, values, oneDecimal:true});
  });
  return footerRows;
}
// Reuses computePlayerAdvancedLog exactly (same EMA/StdDev/IQR/USG%/DvP math), just fed a
// pseudo player-log restricted to games against one specific opponent \u2014 so "her advanced
// metrics vs this team" is the identical calculation as the main table, over a smaller series.
function computePlayerAdvancedLogVsOpponent(playerName, team, opponentShort){
  const rec = DATA.fullPlayerLogs[playerName+'|'+team];
  if(!rec) return [];
  const oppFull = FULL_TEAM_NAME[opponentShort] || opponentShort;
  const subLog = rec.log.filter(g => g.opp===opponentShort || g.opp===oppFull);
  return computePlayerAdvancedLog({player: playerName, log: subLog}, team);
}
// Best-effort live lookup of a team's next scheduled opponent, via the same Odds API this
// app already proxies through your Worker for the Odds page \u2014 there's no schedule/fixtures
// data baked into the season dataset itself, only completed box scores, so this is the only
// way to know "who's next" at all. Returns null (not an error) if it can't be determined \u2014
// no Worker URL configured, no upcoming odds posted yet, network hiccup, etc.
async function fetchNextOpponent(teamShort){
  try{
    const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
    if(!workerBase) return null;
    const events = await fetchJson(`${workerBase}/v4/sports/basketball_wnba/odds?regions=us&markets=h2h`);
    const fullName = FULL_TEAM_NAME[teamShort];
    const now = new Date();
    const upcoming = (events||[]).filter(ev => (ev.home_team===fullName || ev.away_team===fullName) && new Date(ev.commence_time) > now);
    upcoming.sort((a,b)=> new Date(a.commence_time)-new Date(b.commence_time));
    if(!upcoming.length) return null;
    const ev = upcoming[0];
    const oppFull = ev.home_team===fullName ? ev.away_team : ev.home_team;
    return SHORT_TEAM_NAME[oppFull] || oppFull;
  }catch(e){ return null; }
}

function bettingLineCacheKey(playerName, team){ return `bettingline_${playerName}|${team}`; }
// Bumped whenever the SHAPE of a cached line entry changes. Without this, entries written before
// the multi-book lookup existed -- which have assists and PRA missing, because only DraftKings was
// consulted -- would keep being served until each game completed, so the fix wouldn't show up for
// a day. A mismatched version is treated as no cache at all and refetched.
const BETTING_LINE_CACHE_VERSION = 2;
function getCachedBettingLine(playerName, team){
  try{
    const v = JSON.parse(localStorage.getItem(bettingLineCacheKey(playerName, team))||'null');
    if(!v || v.v !== BETTING_LINE_CACHE_VERSION) return null;
    return v;
  }catch(e){ return null; }
}
function setCachedBettingLine(playerName, team, data){
  try{ localStorage.setItem(bettingLineCacheKey(playerName, team), JSON.stringify(Object.assign({v: BETTING_LINE_CACHE_VERSION}, data))); }catch(e){}
}
// Whether a game between `team` and `opponent` on `date` is now in the completed-games archive
// -- used to know when to stop showing a held-over line and look for the next game's instead.
function isGameConfirmedComplete(team, opponent, date){
  const gid = findGameIdForTeamDate(team, date);
  if(!gid) return false;
  const g = DATA.games[gid];
  if(!g) return false;
  const oppFull = FULL_TEAM_NAME[opponent] || opponent;
  return (g.home===team && (g.away===opponent || g.away===oppFull)) || (g.away===team && (g.home===opponent || g.home===oppFull));
}
// Her PTS/REB/AST/PRA lines for her next (or currently in-progress) game. Once a game starts,
// sportsbooks commonly pull player props from the odds feed entirely -- re-fetching at that
// point could come back empty even though "the line from right before tip-off" is still the
// conceptually correct thing to keep showing while the game is in progress. So: cache whatever
// was last fetched, and only look for a genuinely NEW game once the cached one is confirmed
// complete in the completed-games archive -- not just because a re-fetch happened to come back
// empty.
async function fetchHerNextGameLines(playerName, team){
  const cached = getCachedBettingLine(playerName, team);
  if(cached && !isGameConfirmedComplete(team, cached.opponent, cached.date)) return cached;

  try{
    const events = await fetchCachedOddsEvents();
    const fullName = FULL_TEAM_NAME[team];
    const relevant = (events||[])
      .filter(ev => ev.home_team===fullName || ev.away_team===fullName)
      .sort((a,b)=> new Date(a.commence_time)-new Date(b.commence_time))
      .find(ev => {
        const oppFull = ev.home_team===fullName ? ev.away_team : ev.home_team;
        const oppShort = SHORT_TEAM_NAME[oppFull] || oppFull;
        return !isGameConfirmedComplete(team, oppShort, toEasternDateStr(ev.commence_time));
      });
    if(!relevant) return null;

    const oppFull = relevant.home_team===fullName ? relevant.away_team : relevant.home_team;
    const oppShort = SHORT_TEAM_NAME[oppFull] || oppFull;
    const dateStr = toEasternDateStr(relevant.commence_time);

    let detail = null;
    try{ detail = await fetchCachedOddsDetail(relevant.id); }catch(e){}
    // 'best' rather than 'draftkings'. This was hardcoded to DK, which meant any market DK didn't
    // post came back as a dash even when another book had it -- and DK is patchy on assists and
    // especially Pts+Reb+Ast, so those two lines were missing for most players and their columns
    // never tinted. getBookmakerData's 'best' synthesiser merges every book's markets and walks
    // them in book order, so DK still wins wherever it does post the market.
    const dk = detail ? getBookmakerData(detail, 'best') : null;
    const markets = dk ? marketsByKey(dk) : {};
    const lineBooks = {};
    function lineFor(statKey, marketKey){
      const m = markets[marketKey];
      if(!m) return null;
      const o = dkPlayerOutcomes(m, playerName, 'Over') || dkPlayerOutcomes(m, playerName, 'Under');
      if(!o || o.point===undefined) return null;
      // _bestBooks is stamped by the synthesiser -- keep it so the row can say where a line came
      // from rather than implying every number is DraftKings'.
      if(o._bestBooks && o._bestBooks.length) lineBooks[statKey] = o._bestBooks[0];
      return o.point;
    }
    const lines = {
      pts: lineFor('pts', 'player_points'),
      reb: lineFor('reb', 'player_rebounds'),
      ast: lineFor('ast', 'player_assists'),
      tpm: lineFor('tpm', 'player_threes'),
      pra: lineFor('pra', 'player_points_rebounds_assists'),
      pr: lineFor('pr', 'player_points_rebounds'),
      pa: lineFor('pa', 'player_points_assists'),
      ra: lineFor('ra', 'player_rebounds_assists'),
    };
    const result = { eventId: relevant.id, opponent: oppShort, date: dateStr, lines, lineBooks };
    if(Object.values(lines).some(v=>v!==null)){
      setCachedBettingLine(playerName, team, result);
      return result;
    }
    return cached || result; // fetch found the right game but no real lines yet -- fall back to any prior cache rather than show all dashes if we had something before
  }catch(e){
    return cached || null;
  }
}

// ==================== Season / Career splits (player page "Season" tab) ====================
// One row per season she actually played (and, if she was ever traded mid-season, one row per
// team within that season -- the Basketball-Reference convention), with a Career row appended
// as a footer row on every table. Seasons come from the same getSeasonData/
// availableSeasonsForDropdown abstraction the height-tier page uses, so the moment historical
// years land in DATA.historicalSeasons these tables pick them up with no further changes; today
// that resolves to CURRENT_SEASON alone.

// Per-season index of games keyed by "team|date", so the USG% roll-up below doesn't rescan
// every game in a season once per game she played.
const _seasonGameIndexCache = {};
function seasonGameIndex(season, seasonData){
  if(_seasonGameIndexCache[season]) return _seasonGameIndexCache[season];
  const idx = new Map();
  Object.values(seasonData.games || {}).forEach(g=>{
    if(!g || !g.date) return;
    if(!idx.has(g.home+'|'+g.date)) idx.set(g.home+'|'+g.date, g);
    if(!idx.has(g.away+'|'+g.date)) idx.set(g.away+'|'+g.date, g);
  });
  _seasonGameIndexCache[season] = idx;
  return idx;
}

// Raw accumulations for one (player, team, season). Everything derived (percentages, USG%,
// per-36, volatility) is computed later in seasonDerivedRow, so the Career row can be built by
// summing these and running the SAME derivation -- never by averaging season-level percentages,
// which would be wrong whenever games played differ between seasons.
function seasonRawSums(log, playerName, team, season, seasonData){
  const SUM_KEYS = ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf','plusMinus'];
  const s = {gp:0, gs:0, dd:0, td:0, teamMin:0, teamFga:0, teamFta:0, teamTo:0, ptsArr:[], rebArr:[], astArr:[], dvpPtsArr:[], dvpRebArr:[], dvpAstArr:[]};
  SUM_KEYS.forEach(k=>{ s[k]=0; });
  const idx = seasonGameIndex(season, seasonData);
  // Point-in-time DvP is only computable for the season whose games are actually loaded into
  // the top-level DATA (that's what dvpIndexAsOf reads); historical seasons report it as blank
  // rather than silently scoring old games against this season's defenses.
  const canComputeDvp = (season === CURRENT_SEASON);
  const bucket = canComputeDvp ? positionBucket(getPlayerPosition(playerName, team)) : null;
  log.forEach(g=>{
    if(g.dnp) return;
    s.gp++; if(g.starter) s.gs++;
    SUM_KEYS.forEach(k=>{ const v = g[k]; if(typeof v === 'number') s[k] += v; });
    s.ptsArr.push(g.pts||0); s.rebArr.push(g.reb||0); s.astArr.push(g.ast||0);
    const bigCats = [g.pts||0, g.reb||0, g.ast||0, g.stl||0, g.blk||0].filter(v=>v>=10).length;
    if(bigCats>=2) s.dd++;
    if(bigCats>=3) s.td++;
    const gameRec = idx.get(team+'|'+g.date);
    if(gameRec && gameRec.rows){
      const teamRows = gameRec.rows.filter(r=>r.team===team && !r.dnp);
      s.teamMin += teamRows.reduce((a,r)=>a+(r.min||0),0);
      s.teamFga += teamRows.reduce((a,r)=>a+(r.fga||0),0);
      s.teamFta += teamRows.reduce((a,r)=>a+(r.fta||0),0);
      s.teamTo  += teamRows.reduce((a,r)=>a+(r.to||0),0);
    }
    if(canComputeDvp && bucket){
      const oppShort = SHORT_TEAM_NAME[g.opp] || g.opp;
      const dp = dvpIndexAsOf(oppShort, 'pts', bucket, g.date);
      const dr = dvpIndexAsOf(oppShort, 'reb', bucket, g.date);
      const da = dvpIndexAsOf(oppShort, 'ast', bucket, g.date);
      if(dp!==null && dp!==undefined) s.dvpPtsArr.push(dp);
      if(dr!==null && dr!==undefined) s.dvpRebArr.push(dr);
      if(da!==null && da!==undefined) s.dvpAstArr.push(da);
    }
  });
  return s;
}

function addSeasonSums(a, b){
  const out = {};
  Object.keys(a).forEach(k=>{
    if(Array.isArray(a[k])) out[k] = a[k].concat(b[k]||[]);
    else out[k] = (a[k]||0) + (b[k]||0);
  });
  return out;
}

// Turns raw sums into the four flavors of row the Season tab renders. `label` is what shows in
// the Season column ("2026", or "Career" for the footer row).
function seasonDerivedRow(sums, label, team){
  const gp = sums.gp, min = sums.min;
  const per = v => gp ? Math.round((v/gp)*100)/100 : null;
  const per36 = v => min ? Math.round((v*36/min)*100)/100 : null;
  const avgOf = arr => arr.length ? Math.round((arr.reduce((x,y)=>x+y,0)/arr.length)*1000)/1000 : null;
  const tsa = sums.fga + 0.44*sums.fta;
  const usgNum = sums.fga + 0.44*sums.fta + sums.to;
  const usgDen = sums.teamFga + 0.44*sums.teamFta + sums.teamTo;
  const usgPct = (min && usgDen && sums.teamMin)
    ? Math.round((100 * (usgNum * (sums.teamMin/5)) / (min * usgDen)) * 10)/10
    : null;

  const base = {season: label, team, gp, gs: sums.gs};
  const STD = ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf','plusMinus'];

  const stdTotals = Object.assign({}, base);
  STD.forEach(k=>{ stdTotals[k] = Math.round(sums[k]*100)/100; });
  // The four combined prop lines, summed from the season's component totals rather than re-
  // derived per game, so they stay consistent with the PTS/REB/AST cells sitting beside them.
  Object.keys(COMBO_STAT_PARTS).forEach(k=>{
    stdTotals[k] = Math.round(COMBO_STAT_PARTS[k].reduce((a,p)=>a+(sums[p]||0),0)*100)/100;
  });
  stdTotals.fgPct = sums.fga ? Math.round((sums.fgm/sums.fga)*10000)/10000 : null;
  stdTotals.tpPct = sums.tpa ? Math.round((sums.tpm/sums.tpa)*10000)/10000 : null;
  stdTotals.ftPct = sums.fta ? Math.round((sums.ftm/sums.fta)*10000)/10000 : null;

  const stdAverages = Object.assign({}, base);
  STD.forEach(k=>{ stdAverages[k] = per(sums[k]); });
  Object.keys(COMBO_STAT_PARTS).forEach(k=>{
    stdAverages[k] = per(COMBO_STAT_PARTS[k].reduce((a,p)=>a+(sums[p]||0),0));
  });
  // Shooting percentages are recomputed from combined makes/attempts, NOT divided by games --
  // a per-game FG% is meaningless.
  stdAverages.fgPct = stdTotals.fgPct; stdAverages.tpPct = stdTotals.tpPct; stdAverages.ftPct = stdTotals.ftPct;

  const rates = {
    tsPct: tsa ? Math.round((sums.pts/(2*tsa))*10000)/10000 : null,
    efgPct: sums.fga ? Math.round(((sums.fgm + 0.5*sums.tpm)/sums.fga)*10000)/10000 : null,
    threeAr: sums.fga ? Math.round((sums.tpa/sums.fga)*10000)/10000 : null,
    ftr: sums.fga ? Math.round((sums.fta/sums.fga)*10000)/10000 : null,
    astToRatio: sums.to ? Math.round((sums.ast/sums.to)*100)/100 : null,
    usgPct,
  };

  const advTotals = Object.assign({}, base, rates, {
    min: Math.round(sums.min*100)/100,
    pra: Math.round((sums.pts + sums.reb + sums.ast)*100)/100,
    pr: Math.round((sums.pts + sums.reb)*100)/100,
    pa: Math.round((sums.pts + sums.ast)*100)/100,
    ra: Math.round((sums.reb + sums.ast)*100)/100,
    tsa: Math.round(tsa*100)/100,
    fgMiss: sums.fga - sums.fgm,
    ftMiss: sums.fta - sums.ftm,
    dd: sums.dd, td: sums.td,
  });

  const advAverages = Object.assign({}, base, rates, {
    min: per(sums.min),
    pra: per(sums.pts + sums.reb + sums.ast),
    pr: per(sums.pts + sums.reb), pa: per(sums.pts + sums.ast), ra: per(sums.reb + sums.ast),
    pts36: per36(sums.pts), reb36: per36(sums.reb), ast36: per36(sums.ast),
    ptsStd: stdDevOf(sums.ptsArr), ptsIqr: iqrOf(sums.ptsArr),
    rebStd: stdDevOf(sums.rebArr), rebIqr: iqrOf(sums.rebArr),
    astStd: stdDevOf(sums.astArr), astIqr: iqrOf(sums.astArr),
    avgDvpPts: avgOf(sums.dvpPtsArr), avgDvpReb: avgOf(sums.dvpRebArr), avgDvpAst: avgOf(sums.dvpAstArr),
  });

  return {stdTotals, stdAverages, advTotals, advAverages};
}

// Returns {seasons: [derivedRow, ...] (oldest first), career: derivedRow|null}
function computePlayerSeasonSplits(playerName){
  const seasons = availableSeasonsForDropdown().slice().sort(); // oldest first, career reads chronologically
  const derived = [];
  let careerSums = null;
  seasons.forEach(yr=>{
    const sd = getSeasonData(yr);
    if(!sd || !sd.fullPlayerLogs) return;
    Object.keys(sd.fullPlayerLogs)
      .filter(k => k.slice(0, k.lastIndexOf('|')) === playerName)
      .forEach(k=>{
        const teamShort = k.slice(k.lastIndexOf('|')+1);
        const rec = sd.fullPlayerLogs[k];
        const log = (rec && rec.log) || [];
        const sums = seasonRawSums(log, playerName, teamShort, yr, sd);
        if(!sums.gp) return;
        derived.push(seasonDerivedRow(sums, yr, teamShort));
        careerSums = careerSums ? addSeasonSums(careerSums, sums) : sums;
      });
  });
  // Career team label: her team when there's only ever been one, otherwise a count, since a
  // single team link would be actively misleading across a multi-team career.
  const teams = [...new Set(derived.map(d=>d.stdTotals.team))];
  // Spelled out here rather than left as a short code, because footer rows render as plain
  // text (no team link), so FULL_TEAM_NAME never gets applied to them the way it does to a
  // normal row's linked team cell.
  const careerTeam = teams.length===1 ? (FULL_TEAM_NAME[teams[0]] || teams[0]) : `${teams.length} teams`;
  return {
    seasons: derived,
    career: careerSums ? seasonDerivedRow(careerSums, 'Career', careerTeam) : null,
  };
}

const SEASON_STD_TOTALS_COLS = [
  {key:'season', label:'Season', left:true, numeric:false},
  {key:'team', label:'Team', left:true, teamLink:true},
  {key:'gp', label:'GP'}, {key:'gs', label:'GS'},
  {key:'min', label:'MIN'}, {key:'pts', label:'PTS'},
  {key:'fgm', label:'FGM', compactHide:true}, {key:'fga', label:'FGA', compactHide:true}, {key:'fgPct', label:'FG%', pct:true, compactHide:true},
  {key:'tpm', label:'3PM', compactHide:true}, {key:'tpa', label:'3PA', compactHide:true}, {key:'tpPct', label:'3P%', pct:true, compactHide:true},
  {key:'ftm', label:'FTM', compactHide:true}, {key:'fta', label:'FTA', compactHide:true}, {key:'ftPct', label:'FT%', pct:true, compactHide:true},
  {key:'oreb', label:'OREB', compactHide:true}, {key:'dreb', label:'DREB', compactHide:true}, {key:'reb', label:'REB'},
  {key:'ast', label:'AST'}, {key:'stl', label:'STL', compactHide:true}, {key:'blk', label:'BLK', compactHide:true},
  {key:'to', label:'TO', compactHide:true}, {key:'pf', label:'PF', compactHide:true},
  {key:'pra', label:'P+R+A', def:PRA_COL_DEF}, {key:'pr', label:'P+R', def:PR_COL_DEF},
  {key:'pa', label:'P+A', def:PA_COL_DEF}, {key:'ra', label:'R+A', def:RA_COL_DEF},
  {key:'plusMinus', label:'+/-', compactHide:true},
];
// Same columns, but every counting stat rendered to one decimal as a per-game figure. GP/GS
