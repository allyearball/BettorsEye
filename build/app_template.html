<style>

  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;}
  header{background:#000000;color:#fff;padding:16px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}

  thead th:hover{background:#e2e7f0;}

  tbody tr:nth-child(even){background:#fafbfd;}

  .footnote{font-size:11.5px;color:var(--sub);margin-top:10px;line-height:1.5;}
  .gamelist{display:flex;flex-direction:column;gap:6px;}
  .gamechip{text-align:left;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12.5px;cursor:pointer;color:var(--ink);}

  .hide-defcols .defcol{display:none;}
  .sim-def-game-row{display:flex;}
  .sim-def-collapsible{display:none;}
  .show-simdef-extra .sim-def-collapsible{display:flex;}
  .gamechip:hover{background:#eef4ff;}
  .gamechip .d{color:var(--sub);font-size:11px;}
  .result.green{color:var(--green);background:var(--greenbg);}
  .result.red{color:var(--red);background:var(--redbg);}
  .result.gold{color:var(--gold);background:var(--goldbg);font-weight:800;}
  .result.neutral{color:var(--sub);background:#f0f2f6;}
  .rmbtn{background:none;border:none;color:#b3261e;font-size:18px;cursor:pointer;}
  .addbtn{margin-top:6px;background:var(--navy2);color:#fff;border:none;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:var(--sans);}

  .banner{background:#fff8e6;border:1px solid #f0d98c;color:#7a5c00;border-radius:6px;padding:10px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.5;}

<script>
// DATA is shipped gzip-compressed + base64-encoded to keep this file small enough to
// upload/host anywhere. Decompressed once at load time using the browser's native
// DecompressionStream API (supported in Safari 16.4+ / any iPhone from the last ~3 years).
let DATA = null;
const DATA_B64_GZ = "__APP_DATA_B64GZ__";

async function loadData(){
  const binary = atob(DATA_B64_GZ);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const text = await new Response(stream).text();
  return JSON.parse(text);
}
</script>
<script>
function cmp(a,b){
  const av=a===null||a===undefined, bv=b===null||b===undefined;
  if(av&&bv) return 0; if(av) return 1; if(bv) return -1;
  if(typeof a==='string'&&typeof b==='string') return a.localeCompare(b);
  if(a<b) return -1; if(a>b) return 1; return 0;
}
function fmtVal(v, col, row){
  if(col && col.record) return `${row.wins}-${row.losses}`;
  if(col && col.gb) return (v===null||v===undefined) ? '\u2014' : (v===0 ? '\u2014' : v.toFixed(1));
  if(v===null||v===undefined||v===''){ return '—'; }
  if(col.pct) return (v*100).toFixed(1)+'%';
  if(col.round2 && typeof v==='number') return v.toFixed(2);
  if(col.round1 && typeof v==='number') return v.toFixed(1); // per-game averages: nearest 0.1
  if(col.bool) return v?'Y':'N';
  // Everything else numeric and unflagged is treated as a season total (or a similarly whole
  // count like games played, jersey number, etc.): round to the nearest whole number and add
  // thousands separators once it's 1000+ (team season MINUTES totals routinely cross that).
  if(typeof v==='number' && !col.left){
    return Math.round(v).toLocaleString('en-US');
  }
  return v;
}
// ================= Tap-to-define system (for stat column headers) =================
// Hover tooltips (title="...") don't work at all on iPhone/touch devices \u2014 there's no
// hover state. This gives every advanced-stat column header a small \u24d8 icon that toggles
// a definition popover on tap (works identically with mouse click on desktop). One popover
// open at a time; tapping elsewhere on the page closes it.
let _activeDefIcon = null, _activeDefPopover = null;
function hideDefPopover(){
  if(_activeDefPopover){ _activeDefPopover.remove(); _activeDefPopover = null; }
  _activeDefIcon = null;
}
function showDefPopover(anchorEl, text){
  const pop = document.createElement('div');
  pop.style.cssText = 'position:fixed;z-index:9999;max-width:320px;background:var(--panel);color:var(--ink);font-size:12px;line-height:1.45;padding:10px 12px;border-radius:6px;border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.6);';
  pop.innerHTML = text;
  document.body.appendChild(pop);
  const rect = anchorEl.getBoundingClientRect();
  let left = rect.left;
  const maxLeft = window.innerWidth - 336;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  let top = rect.bottom + 6;
  // flip above the icon if there isn't room below (common near the bottom of a long table on
  // mobile, and now also relevant for longer tooltip text that wraps into a taller popover)
  const estimatedHeight = 300;
  if(top + estimatedHeight > window.innerHeight) top = Math.max(8, rect.top - estimatedHeight - 10);
  pop.style.left = left+'px'; pop.style.top = top+'px';
  _activeDefPopover = pop;
}
function toggleDefPopover(icon, text){
  if(_activeDefIcon === icon){ hideDefPopover(); return; }
  hideDefPopover();
  showDefPopover(icon, text);
  _activeDefIcon = icon;
}
document.addEventListener('click', (e)=>{
  if(_activeDefPopover && !_activeDefPopover.contains(e.target)) hideDefPopover();
}, true);
// Appends a tappable \u24d8 definition icon to a header element if defText is provided.
// stopPropagation keeps it from also triggering the column's sort-on-click handler.
function appendDefIcon(th, defText){
  if(!defText) return;
  const icon = document.createElement('span');
  icon.textContent = '\u24d8';
  icon.style.cssText = 'font-size:12px;color:var(--navy2);cursor:pointer;margin-left:4px;opacity:.75;';
  icon.addEventListener('click', (e)=>{ e.stopPropagation(); e.preventDefault(); toggleDefPopover(icon, defText); });
  th.appendChild(icon);
}

const STAT_DEFINITIONS = {
  usgPct: 'Usage Rate (USG%) \u2014 the standard Basketball-Reference formula. Estimated share of her team\u2019s offensive possessions (shot attempts, free throw trips, turnovers) she was directly involved in while on the floor.',
  ptsEma: 'Points EMA \u2014 exponential moving average of points scored, weighting recent games more heavily than older ones (span of up to 10 games). Reacts faster to a role/rotation change than a plain average.',
  ptsStd: 'Points StdDev (L10) \u2014 standard deviation of points over her last 10 games played. Higher = more game-to-game volatility, meaning the average is a less reliable predictor of any single game.',
  ptsIqr: 'Points IQR (L10) \u2014 interquartile range (75th percentile minus 25th) of points over her last 10 games. Strips out single-game outliers (blowouts, OT games) better than standard deviation does.',
  rebEma: 'Rebounds EMA \u2014 exponential moving average of rebounds, weighting recent games more heavily (span up to 10 games).',
  rebStd: 'Rebounds StdDev (L10) \u2014 standard deviation of rebounds over her last 10 games. Higher = less consistent.',
  rebIqr: 'Rebounds IQR (L10) \u2014 interquartile range of rebounds over her last 10 games, with outlier games stripped out.',
  astEma: 'Assists EMA \u2014 exponential moving average of assists, weighting recent games more heavily (span up to 10 games).',
  astStd: 'Assists StdDev (L10) \u2014 standard deviation of assists over her last 10 games. Higher = less consistent.',
  astIqr: 'Assists IQR (L10) \u2014 interquartile range of assists over her last 10 games, with outlier games stripped out.',
  dvpPts: 'DvP Index (Points) \u2014 this opponent\u2019s points allowed per game to her position, divided by the league-average points allowed to that position. Above 1.05 = plus matchup (favors the Over); below 0.95 = tougher matchup.',
  dvpReb: 'DvP Index (Rebounds) \u2014 same idea as DvP-PTS, for rebounds allowed to her position.',
  dvpAst: 'DvP Index (Assists) \u2014 same idea as DvP-PTS, for assists allowed to her position.',
  ptsAllowed: 'Points allowed per game to this position, season-long.',
  ptsDvp: 'DvP Index (Points) \u2014 this team\u2019s points allowed to this position vs. the league average. Above 1.05 = generous defense against this position; below 0.95 = stingy.',
  rebAllowed: 'Rebounds allowed per game to this position, season-long.',
  rebDvp: 'DvP Index (Rebounds) \u2014 this team\u2019s rebounds allowed to this position vs. the league average.',
  astAllowed: 'Assists allowed per game to this position, season-long.',
  astDvp: 'DvP Index (Assists) \u2014 this team\u2019s assists allowed to this position vs. the league average.',
  tpmAllowed: '3-pointers made allowed per game to this position, season-long.',
  tpmDvp: 'DvP Index (Threes) \u2014 this team\u2019s 3PM allowed to this position vs. the league average.',
  praAllowed: 'Points+Rebounds+Assists allowed per game to this position, season-long.',
  praDvp: 'DvP Index (PRA) \u2014 this team\u2019s Pts+Reb+Ast allowed to this position vs. the league average.',
  defRank: 'Opponent Defense Rank \u2014 where this opponent ranks among all WNBA teams in [stat] allowed per game to her position, season-long. 1 = stingiest defense (fewest allowed); last place = most generous (most allowed).',
  defAllowed: 'The raw "[stat] allowed per game to her position, season-long" number behind the Opp Def Rank column.',
};

function makeTable(container, columns, rows, opts){
  opts = opts||{};
  const state = {sortKey: opts.defaultSort||(columns[0]&&columns[0].key), sortDir: opts.defaultDir||'desc', highlightKey: null};
  const wrap = document.createElement('div'); wrap.className='table-wrap';
  const controls = document.createElement('div'); controls.className='controls';
  const hasPlayedConcept = rows.length>0 && ('min' in rows[0] || 'gp' in rows[0]);
  let cb = null;
  if(hasPlayedConcept){
    const label = document.createElement('label');
    cb = document.createElement('input'); cb.type='checkbox';
    if(opts.defaultHideDNP) cb.checked = true;
    label.appendChild(cb); label.appendChild(document.createTextNode(opts.hideLabel || 'Hide players who didn\u2019t play (0 minutes)'));
    controls.appendChild(label);
  }
  const countSpan = document.createElement('span'); countSpan.style.cssText='font-size:12px;color:#5b6472';
  controls.appendChild(countSpan);
  const table = document.createElement('table');
  const thead = document.createElement('thead'); const trh = document.createElement('tr');
  columns.forEach(col=>{
    const th = document.createElement('th'); th.textContent = col.label;
    if(col.left) th.classList.add('left');
    appendDefIcon(th, col.def || STAT_DEFINITIONS[col.key]);
    const arrow = document.createElement('span'); arrow.className='arrow'; th.appendChild(arrow);
    th.addEventListener('click', ()=>{
      if(state.sortKey===col.key){ state.sortDir = state.sortDir==='asc'?'desc':'asc'; }
      else { state.sortKey=col.key; state.sortDir = col.numeric===false?'asc':'desc'; }
      render();
    });
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  const tbody = document.createElement('tbody');
  table.appendChild(thead); table.appendChild(tbody);
  wrap.appendChild(controls); wrap.appendChild(table);
  container.appendChild(wrap);
  function didNotPlay(r){
    if('gp' in r) return !r.gp || r.gp===0;
    if('min' in r) return r.dnp===true || r.min===null || r.min===undefined || r.min===0;
    return false;
  }
  function applyHighlightClasses(){
    const ths = trh.querySelectorAll('th');
    columns.forEach((col, i)=>{
      ths[i].classList.toggle('col-highlighted', state.highlightKey===col.key);
    });
    tbody.querySelectorAll('tr').forEach(tr=>{
      const tds = tr.querySelectorAll('td');
      columns.forEach((col, i)=>{
        if(tds[i]) tds[i].classList.toggle('col-highlighted', state.highlightKey===col.key);
      });
    });
  }
  function render(){
    let data = rows.slice();
    if(cb && cb.checked) data = data.filter(r=>!didNotPlay(r));
    data.sort((a,b)=>{ const d=cmp(a[state.sortKey],b[state.sortKey]); return state.sortDir==='asc'?d:-d; });
    tbody.innerHTML='';
    data.forEach(r=>{
      const tr = document.createElement('tr');
      if(r.starter) tr.classList.add('starter');
      columns.forEach(col=>{
        const td = document.createElement('td'); if(col.left) td.classList.add('left');
        if(col.noBoldStarter) td.classList.add('no-starter-bold');
        td.style.cursor = 'pointer';
        td.addEventListener('click', ()=>{
          state.highlightKey = state.highlightKey===col.key ? null : col.key;
          applyHighlightClasses();
        });
        if(col.key==='player' && opts.teamFor){
          const team = opts.teamFor(r);
          const link = document.createElement('a');
          link.href = 'javascript:void(0)';
          link.className = 'player-link';
          link.textContent = fmtVal(r[col.key], col, r);
          link.addEventListener('click', (e)=>{ e.stopPropagation(); goToPlayer(r.player, team); });
          td.appendChild(link);
        } else {
          td.textContent = fmtVal(r[col.key], col, r);
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    countSpan.textContent = data.length+' / '+rows.length+' rows shown';
    if(opts.footerRows && opts.footerRows.length){
      opts.footerRows.forEach(fr=>{
        const tr = document.createElement('tr');
        tr.style.background = '#eef2fb'; tr.style.fontWeight = '700';
        columns.forEach((col, i)=>{
          const td = document.createElement('td'); if(col.left) td.classList.add('left');
          if(i===0){ td.textContent = fr.label; }
          else if(fr.values && Object.prototype.hasOwnProperty.call(fr.values, col.key)){
            td.textContent = fmtVal(fr.values[col.key], col);
          } else { td.textContent=''; }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }
    [...trh.children].forEach((th,i)=>{
      const arrow = th.querySelector('.arrow');
      arrow.textContent = columns[i].key===state.sortKey ? (state.sortDir==='asc'?'\u25B2':'\u25BC') : '';
    });
    applyHighlightClasses();
  }
  if(cb) cb.addEventListener('change', render);
  render();
}

  if(['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'].includes(c.key)) return Object.assign({},c,{round1:true});

  {key:'oppTo', label:'Opp TO'}, {key:'oppPf', label:'Opp PF'},

const TEAM_GAME_COLS = [
  {key:'date', label:'Date', left:true}, {key:'homeAway', label:'H/A', left:true}, {key:'opponent', label:'Opponent', left:true},
  {key:'teamPts', label:'Team PTS'}, {key:'oppPts', label:'Opp PTS'}, {key:'min', label:'MIN'},

function teamGameDates(team){

// Builds the Year + Month dropdown pair used on Team Explorer and Player pages.
// onChange(year, month) fires whenever either selection changes; month always resets
// to 'full' (Full Season) when the year changes, since prior months may not apply.
function buildYearMonthSelector(yearsList, monthsForYearFn, currentYear, currentMonth, onChange){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;gap:10px;align-items:center;';
  const selStyle = 'padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);background:var(--panel);';

  const yearSel = document.createElement('select'); yearSel.style.cssText = selStyle;
  yearsList.forEach(y=>{ const op=document.createElement('option'); op.value=y; op.textContent=y; yearSel.appendChild(op); });
  yearSel.value = currentYear;

  const monthSel = document.createElement('select'); monthSel.style.cssText = selStyle;
  function rebuildMonths(year, preferredMonth){
    monthSel.innerHTML = '';
    const full = document.createElement('option'); full.value='full'; full.textContent='Full Season'; monthSel.appendChild(full);
    monthsForYearFn(year).forEach(m=>{
      const op = document.createElement('option'); op.value=m; op.textContent=MONTH_NAMES[m]||m; monthSel.appendChild(op);
    });
    monthSel.value = preferredMonth;
    if(monthSel.value !== preferredMonth) monthSel.value = 'full'; // preferred month doesn't exist in this year
  }
  rebuildMonths(currentYear, currentMonth);

  yearSel.addEventListener('change', ()=>{ rebuildMonths(yearSel.value, 'full'); onChange(yearSel.value, monthSel.value); });
  monthSel.addEventListener('change', ()=>{ onChange(yearSel.value, monthSel.value); });

  wrap.appendChild(yearSel); wrap.appendChild(monthSel);
  return wrap;
}

// Computes Player Totals / Averages / Opponent Totals entirely client-side for an arbitrary
// set of game IDs — this is what makes Year/Month (or any future custom range) possible
// without needing Python to have pre-baked every possible slice server-side.
function computeTeamSummaryClientSide(team, gameIds){
  const STAT_KEYS = ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'];
  const totalsMap = {};
  gameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return;
    g.rows.forEach(r=>{
      if(r.team !== team) return;
      if(!totalsMap[r.athleteId]){
        const row = {player:r.player, athleteId:r.athleteId, gp:0, gs:0};
        STAT_KEYS.forEach(k=>{ row[k]=0; });
        totalsMap[r.athleteId] = row;
      }
      const acc = totalsMap[r.athleteId];
      if(!r.dnp){ acc.gp++; if(r.starter) acc.gs++; }
      STAT_KEYS.forEach(k=>{ const v = r[k]; if(v!==null && v!==undefined) acc[k]+=v; });
    });
  });
  const totals = Object.values(totalsMap).map(t=>{
    const bio = bioLookup(t.player, team);
    return Object.assign({}, t, bio, {
      fgPct: t.fga ? Math.round((t.fgm/t.fga)*10000)/10000 : null,
      tpPct: t.tpa ? Math.round((t.tpm/t.tpa)*10000)/10000 : null,
      ftPct: t.fta ? Math.round((t.ftm/t.fta)*10000)/10000 : null,
    });
  });
  const averages = totals.map(t=>{
    const a = Object.assign({}, t);
    STAT_KEYS.forEach(k=>{ a[k] = t.gp ? Math.round((t[k]/t.gp)*100)/100 : null; });
    return a;
  });
  const opponents = gameIds.map(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return null;
    const isHome = g.home === team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    const oppName = isHome ? g.away : g.home;
    const oppRows = g.rows.filter(r=>r.team !== team);
    const sum = key => oppRows.reduce((a,r)=> a + (r[key]||0), 0);
    const oppFgm = sum('fgm'), oppFga = sum('fga'), oppTpm = sum('tpm'), oppTpa = sum('tpa'),
          oppFtm = sum('ftm'), oppFta = sum('fta');
    return {
      date: g.date, homeAway: isHome ? 'vs' : '@', opponent: oppName, teamPts, oppPts,
      oppFgm, oppFga, oppFgPct: oppFga ? Math.round((oppFgm/oppFga)*10000)/10000 : null,
      oppTpm, oppTpa, oppFtm, oppFta,
      oppOreb: sum('oreb'), oppDreb: sum('dreb'), oppReb: sum('reb'),
      oppAst: sum('ast'), oppStl: sum('stl'), oppBlk: sum('blk'), oppTo: sum('to'), oppPf: sum('pf'),
    };
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));

  // The team's own combined stat line per game \u2014 same shape/approach as `opponents` above,
  // just summed from this team's own box score rows instead of the other team's.
  const teamGames = gameIds.map(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return null;
    const isHome = g.home === team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    const oppName = isHome ? g.away : g.home;
    const ownRows = g.rows.filter(r=>r.team === team);
    const sum = key => ownRows.reduce((a,r)=> a + (r[key]||0), 0);
    const fgm = sum('fgm'), fga = sum('fga'), tpm = sum('tpm'), tpa = sum('tpa'), ftm = sum('ftm'), fta = sum('fta');
    return {
      date: g.date, homeAway: isHome ? 'vs' : '@', opponent: oppName, teamPts, oppPts, min: sum('min'),
      fgm, fga, fgPct: fga ? Math.round((fgm/fga)*10000)/10000 : null,
      tpm, tpa, tpPct: tpa ? Math.round((tpm/tpa)*10000)/10000 : null,
      ftm, fta, ftPct: fta ? Math.round((ftm/fta)*10000)/10000 : null,
      oreb: sum('oreb'), dreb: sum('dreb'), reb: sum('reb'),
      ast: sum('ast'), stl: sum('stl'), blk: sum('blk'), to: sum('to'), pf: sum('pf'),
    };
  }).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));

  return {totals, averages, opponents, teamGames};
}

function inchesToHeightStr(inches){
  if(inches===null || inches===undefined || isNaN(inches)) return null;
  const totalIn = Math.round(inches); // round to nearest whole inch FIRST, so a value like 71.6 correctly becomes 6'0" (with carry-over), not 5'11.6"
  const feet = Math.floor(totalIn/12);
  const rem = totalIn - feet*12;
  return `${feet}' ${rem}"`;
}

// Aggregates a team's already-computed per-player totals (from computeTeamSummaryClientSide)
// into one team-level row. Shooting percentages are always computed from the team's combined
// makes/attempts (never averaged from individual players' percentages) since that's the only
// mathematically correct way to roll them up. Height is a season-long weighted average by each
// player's total minutes played, so rotation players count more than end-of-bench players.
function computeLeagueTeamRow(team, gameIds, playerTotals, mode){
  const teamGames = gameIds.length;
  const sumKey = k => playerTotals.reduce((a,p)=> a + (p[k]||0), 0);
  const fgm=sumKey('fgm'), fga=sumKey('fga'), tpm=sumKey('tpm'), tpa=sumKey('tpa'), ftm=sumKey('ftm'), fta=sumKey('fta');

  // Win-loss record \u2014 computed from actual game results, independent of the totals/averages
  // toggle (a record doesn't change shape between those two views the way counting stats do).
  let wins=0, losses=0;
  gameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g || g.homeScore===null || g.awayScore===null) return;
    const isHome = g.home===team;
    const teamPts = isHome ? g.homeScore : g.awayScore;
    const oppPts = isHome ? g.awayScore : g.homeScore;
    if(teamPts>oppPts) wins++; else if(teamPts<oppPts) losses++;
  });

  let heightSum=0, heightWeight=0;
  playerTotals.forEach(p=>{
    if(p.heightIn!==null && p.heightIn!==undefined && p.min){ heightSum += p.heightIn*p.min; heightWeight += p.min; }
  });
  const avgHeightIn = heightWeight ? heightSum/heightWeight : null;

  const row = {
    team, gp: teamGames, wins, losses, min: sumKey('min'), pts: sumKey('pts'),
    fgm, fga, fgPct: fga ? Math.round((fgm/fga)*10000)/10000 : null,
    tpm, tpa, tpPct: tpa ? Math.round((tpm/tpa)*10000)/10000 : null,
    ftm, fta, ftPct: fta ? Math.round((ftm/fta)*10000)/10000 : null,
    oreb: sumKey('oreb'), dreb: sumKey('dreb'), reb: sumKey('reb'),
    ast: sumKey('ast'), stl: sumKey('stl'), blk: sumKey('blk'), to: sumKey('to'), pf: sumKey('pf'),
    avgHeight: inchesToHeightStr(avgHeightIn) || '\u2014',
  };
  if(mode==='averages' && teamGames){
    ['min','pts','fgm','fga','tpm','tpa','ftm','fta','oreb','dreb','reb','ast','stl','blk','to','pf'].forEach(k=>{
      row[k] = Math.round((row[k]/teamGames)*100)/100;
    });
  }
  return row;
}

// Same idea as computeLeagueTeamRow, but summed from each game's opponent output (already
// computed per-game by computeTeamSummaryClientSide's `opponents` array) instead of the
// team's own players \u2014 i.e. what a team's opponents did against them, season-long.
function computeLeagueDefenseRow(team, teamGames, opponents, mode){
  const sumKey = k => opponents.reduce((a,o)=> a + (o[k]||0), 0);
  const oppFgm=sumKey('oppFgm'), oppFga=sumKey('oppFga'), oppTpm=sumKey('oppTpm'), oppTpa=sumKey('oppTpa'), oppFtm=sumKey('oppFtm'), oppFta=sumKey('oppFta');

  const row = {
    team, gp: teamGames, oppPts: sumKey('oppPts'),
    oppFgm, oppFga, oppFgPct: oppFga ? Math.round((oppFgm/oppFga)*10000)/10000 : null,
    oppTpm, oppTpa, oppTpPct: oppTpa ? Math.round((oppTpm/oppTpa)*10000)/10000 : null,
    oppFtm, oppFta, oppFtPct: oppFta ? Math.round((oppFtm/oppFta)*10000)/10000 : null,
    oppOreb: sumKey('oppOreb'), oppDreb: sumKey('oppDreb'), oppReb: sumKey('oppReb'),
    oppAst: sumKey('oppAst'), oppStl: sumKey('oppStl'), oppBlk: sumKey('oppBlk'), oppTo: sumKey('oppTo'), oppPf: sumKey('oppPf'),
  };
  if(mode==='averages' && teamGames){
    ['oppPts','oppFgm','oppFga','oppTpm','oppTpa','oppFtm','oppFta','oppOreb','oppDreb','oppReb','oppAst','oppStl','oppBlk','oppTo','oppPf'].forEach(k=>{
      row[k] = Math.round((row[k]/teamGames)*100)/100;
    });
  }
  return row;
}

  modeWrap.appendChild(modeLabel);

    const lbl = document.createElement('label'); lbl.style.cssText='display:flex;align-items:center;gap:5px;font-size:12.5px;cursor:pointer;';
    const rb = document.createElement('input'); rb.type='radio'; rb.name='leagueStatsMode'; rb.value=val; rb.checked = mode===val;
    rb.addEventListener('change', ()=>{ if(rb.checked) renderLeagueStatsPage(year, val, windowMode); });
    lbl.appendChild(rb); lbl.appendChild(document.createTextNode(txt));
    modeWrap.appendChild(lbl);
  });

  controlsRow.appendChild(yearWrap); controlsRow.appendChild(modeWrap);
  main.appendChild(controlsRow);

  if(allYears.length===0 || !allYears.includes(year)){
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
    na.textContent = `No data loaded for ${year}.`;
    main.appendChild(na);
    return;
  }

  // Compute each team's player-level summary once, reuse for both tables below. Windowed to
  // the selected Game Window, same per-team "most recent N of HER OWN games" logic the Team
  // page itself uses -- teams don't all play on the same days, so "last 10" is last 10 for
  // that specific team, not a shared calendar cutoff.
  const perTeam = {};
  TEAM_NAMES.forEach(team=>{
    const gameIdsInRange = filterGameIdsByYearMonth(team, year, 'full');
    const gameIds = windowSliceRecentFirst(gameIdsInRange, windowMode);
    perTeam[team] = { gameIds, summary: computeTeamSummaryClientSide(team, gameIds) };
  });

  const t1 = document.createElement('div'); t1.className='section-title';
  t1.textContent = `Team ${mode==='totals'?'Totals':'Averages'} \u2014 ${windowLabelText}`;
  main.appendChild(t1);
  const teamRows = TEAM_NAMES.map(team=>{
    const {gameIds, summary} = perTeam[team];
    return computeLeagueTeamRow(team, gameIds, summary.totals, mode);
  });
  // Games Back \u2014 standard formula relative to the league leader (best win differential):
  // GB = ((leaderWins - teamWins) + (teamLosses - leaderLosses)) / 2. Whole league, not split
  // by conference/division, since the WNBA standings table this mirrors doesn't split either.
  if(teamRows.length){
    const leader = teamRows.reduce((best,r)=> (r.wins-r.losses) > (best.wins-best.losses) ? r : best, teamRows[0]);
    teamRows.forEach(r=>{ r.gbNum = ((leader.wins-r.wins)+(r.losses-leader.losses))/2; });
  }
  makeTable(main, LEAGUE_TEAM_COLS, teamRows, {defaultSort:'pts', defaultDir:'desc'});

  const t1b = document.createElement('div'); t1b.className='section-title';
  t1b.textContent = `Defensive Team ${mode==='totals'?'Totals':'Averages'} (Opponent Output) \u2014 ${windowLabelText}`;
  main.appendChild(t1b);
  const defRows = TEAM_NAMES.map(team=>{
    const {gameIds, summary} = perTeam[team];
    return computeLeagueDefenseRow(team, gameIds.length, summary.opponents, mode);
  });
  makeTable(main, LEAGUE_DEF_COLS, defRows, {defaultSort:'oppPts', defaultDir:'asc'});

  const t2 = document.createElement('div'); t2.className='section-title';
  t2.textContent = `Individual Player ${mode==='totals'?'Totals':'Averages'} \u2014 ${windowLabelText}`;
  main.appendChild(t2);
  const playerRows = [];
  TEAM_NAMES.forEach(team=>{
    const {summary} = perTeam[team];
    const rows = mode==='totals' ? summary.totals : summary.averages;
    rows.forEach(r=> playerRows.push(Object.assign({}, r, {team})));
  });
  const playerCols = mode==='totals' ? LEAGUE_PLAYER_COLS : LEAGUE_PLAYER_AVG_COLS;
  makeTable(main, playerCols, playerRows, {defaultSort:'pts', defaultDir:'desc', teamFor:r=>r.team, defaultHideDNP:true, hideLabel:'Hide players who didn\u2019t play any minutes this season'});

  const t3 = document.createElement('div'); t3.className='section-title';
  t3.textContent = `Individual Player Advanced Metrics \u2014 ${year}`;
  main.appendChild(t3);
  const advFn = document.createElement('div'); advFn.className='footnote'; advFn.style.marginBottom='8px';
  advFn.textContent = 'Same advanced-metrics engine as each player\u2019s own page, applied league-wide. EMA/StdDev/IQR reflect her most recent played game (current rolling form, same number her own player page shows right now, independent of the Game Window selector above); USG% and DvP Faced are season averages instead, since a single game\u2019s usage or single game\u2019s matchup wouldn\u2019t represent a season the way a trailing average does. Tap any column header\u2019s \u24d8 for the full definition.';
  main.appendChild(advFn);
  const leagueAdvRows = computeLeagueAdvancedRows(year);
  makeTable(main, LEAGUE_ADV_COLS, leagueAdvRows, {defaultSort:'ptsEma', defaultDir:'desc', teamFor:r=>r.team});

  const fn = document.createElement('div'); fn.className='footnote';
  fn.textContent = 'Team shooting percentages (FG%/3P%/FT%) are computed from the team\u2019s combined makes/attempts across the selected games, not averaged from individual players\u2019 percentages \u2014 that\u2019s the only mathematically correct way to roll them up. "Avg Height (Wtd)" weights each player\u2019s height by her total minutes played in the selected games, so rotation players count more than bench players who barely played.';
  main.appendChild(fn);

  // ---- Minutes Trend: flags players whose recent minutes have moved sharply vs. their own
  // prior stretch -- independent of the year/window controls above, since it's inherently a
  // "recent games" comparison against the season-long log, not a single-season snapshot. ----
  const trendTitle = document.createElement('div'); trendTitle.className='section-title';
  trendTitle.textContent = '\ud83d\udcc8 Minutes Trend \u2014 Role Changes';
  main.appendChild(trendTitle);
  const trendNote = document.createElement('div'); trendNote.className='footnote'; trendNote.style.marginBottom='8px';
  trendNote.textContent = 'Compares each player\u2019s average minutes over her last N games to the N games right before that. Non-injury DNPs (coach\u2019s decision, rest, etc.) count as 0 minutes, so a genuine role change still shows up as a real decrease. Injury-related DNPs are excluded from the comparison entirely, since a health absence isn\u2019t a role change \u2014 note this depends on injury-reason data that isn\u2019t in the current dataset yet, so until a fresh data pull backfills it, all DNPs are treated as non-injury by default. Needs at least 2\u00d7N games of history to make a fair same-size comparison.';
  main.appendChild(trendNote);

  const trendControls = document.createElement('div');
  trendControls.style.cssText = 'display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;';
  const nGroup = document.createElement('div'); nGroup.style.cssText='display:flex;align-items:center;gap:8px;';
  const nLabel = document.createElement('label'); nLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; nLabel.textContent='Compare last N games:';
  const nInput = document.createElement('input'); nInput.type='number'; nInput.min='2'; nInput.max='30'; nInput.value='10';
  nInput.style.cssText = 'width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);';
  nGroup.appendChild(nLabel); nGroup.appendChild(nInput);
  const threshGroup = document.createElement('div'); threshGroup.style.cssText='display:flex;align-items:center;gap:8px;';
  const threshLabel = document.createElement('label'); threshLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; threshLabel.textContent='Min % change:';
  const threshInput = document.createElement('input'); threshInput.type='number'; threshInput.min='1'; threshInput.max='200'; threshInput.value='20';
  threshInput.style.cssText = 'width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:var(--sans);';
  threshGroup.appendChild(threshLabel); threshGroup.appendChild(threshInput);
  threshGroup.appendChild(document.createTextNode('%'));
  trendControls.appendChild(nGroup); trendControls.appendChild(threshGroup);
  main.appendChild(trendControls);

  const trendResultsDiv = document.createElement('div');
  main.appendChild(trendResultsDiv);

  const TREND_COLS = [
    {key:'player', label:'Player', left:true},
    {key:'recentAvg', label:'Recent Avg Min', round1:true},
    {key:'priorAvg', label:'Prior Avg Min', round1:true},
    {key:'pctChangeDisplay', label:'% Change', left:true},
  ];
  function fmtPctChange(r){ return r.pctChange===null ? 'New (from 0 min)' : `${r.pctChange>=0?'+':''}${Math.round(r.pctChange*100)}%`; }

  function renderTrendTables(){
    trendResultsDiv.innerHTML = '';
    const n = Math.max(2, parseInt(nInput.value)||10);
    const threshold = Math.max(1, parseFloat(threshInput.value)||20) / 100;
    const {increasing, decreasing} = computeMinutesTrend(n, threshold);

    const incTitle = document.createElement('div'); incTitle.style.cssText='font-weight:800;color:var(--green);font-size:14px;margin:10px 0 6px;';
    incTitle.textContent = `\u2191 Minutes Increasing (${increasing.length})`;
    trendResultsDiv.appendChild(incTitle);
    if(increasing.length){
      makeTable(trendResultsDiv, TREND_COLS, increasing.map(r=>Object.assign({}, r, {pctChangeDisplay: fmtPctChange(r)})), {defaultSort:'recentAvg', defaultDir:'desc', teamFor:r=>r.team});
    } else {
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-bottom:14px;'; na.textContent = 'No players currently qualify.';
      trendResultsDiv.appendChild(na);
    }

    const decTitle = document.createElement('div'); decTitle.style.cssText='font-weight:800;color:var(--red);font-size:14px;margin:10px 0 6px;';
    decTitle.textContent = `\u2193 Minutes Decreasing (${decreasing.length})`;
    trendResultsDiv.appendChild(decTitle);
    if(decreasing.length){
      makeTable(trendResultsDiv, TREND_COLS, decreasing.map(r=>Object.assign({}, r, {pctChangeDisplay: fmtPctChange(r)})), {defaultSort:'recentAvg', defaultDir:'desc', teamFor:r=>r.team});
    } else {
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;'; na.textContent = 'No players currently qualify.';
      trendResultsDiv.appendChild(na);
    }
  }
  nInput.addEventListener('change', renderTrendTables);
  threshInput.addEventListener('change', renderTrendTables);
  renderTrendTables();
}

function renderTeamPage(team, year, month, windowMode){
  const years = availableYears(team);
  year = year || years[years.length-1];
  month = month || 'full';
  windowMode = windowMode===undefined ? 10 : windowMode; // default matches the player page's default
  lastRender = () => renderTeamPage(team, year, month, windowMode);

  const gameIdsInRange = filterGameIdsByYearMonth(team, year, month); // most-recent-first
  const gameIds = windowSliceRecentFirst(gameIdsInRange, windowMode);
  const summary = computeTeamSummaryClientSide(team, gameIds);
  const monthLabel = month==='full' ? 'Full Season' : (MONTH_NAMES[month]||month);
  const windowLabelText = windowMode==='all' ? 'Full Season' : `Last ${windowMode}`;

  main.innerHTML = '';
  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>${team} \u2014 ${year}, ${monthLabel}, ${windowLabelText} (${gameIds.length} Games)</h2><div class="meta">Player totals, per-game averages, opponent output, and individual game box scores. Click any player's name to see her full recent game log.</div>`;
  main.appendChild(head);

  const teamInjuryList = teamInjuries(team);

  // Full-season record is always the TRUE season record (DATA.teamRecords), independent of
  // whatever year/month/window is currently selected. The second record reflects the actual
  // games currently in view (gameIds, which already respects month/year AND the window) --
  // computed fresh here since gameIds is an arbitrary filtered slice, not necessarily a
  // "last N" window in the recordkeeping sense DATA.teamRecords tracks.
  function winLossFor(gameIdList){
    let w = 0, l = 0;
    gameIdList.forEach(gid=>{
      const g = DATA.games[gid];
      if(!g) return;
      const isHome = g.home === team;
      const teamScore = isHome ? g.homeScore : g.awayScore;
      const oppScore = isHome ? g.awayScore : g.homeScore;
      if(teamScore > oppScore) w++; else if(teamScore < oppScore) l++;
    });
    return {w, l};
  }
  const recordBox = document.createElement('div');
  recordBox.style.cssText = 'display:flex;gap:24px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;';
  const seasonRec = (DATA.teamRecords[team] && DATA.teamRecords[team].overall) || null;
  const seasonBox = document.createElement('div');
  seasonBox.innerHTML = `<span style="color:var(--sub);">Season Record:</span> <b style="color:var(--navy2);">${seasonRec ? `${seasonRec.w}-${seasonRec.l}` : '\u2014'}</b>`;
  recordBox.appendChild(seasonBox);
  if(windowMode !== 'all'){
    const windowRec = winLossFor(gameIds);
    const windowBox = document.createElement('div');
    windowBox.innerHTML = `<span style="color:var(--sub);">${windowLabelText}:</span> <b style="color:var(--navy2);">${windowRec.w}-${windowRec.l}</b>`;
    recordBox.appendChild(windowBox);
  }
  main.appendChild(recordBox);

  if(teamInjuryList.length){
    const injBox = document.createElement('div');
    injBox.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:16px;';
    const injTitle = document.createElement('div'); injTitle.style.cssText='font-weight:800;color:var(--navy2);font-size:13px;margin-bottom:6px;'; injTitle.textContent = '\ud83c\udfe5 Injury Report';
    injBox.appendChild(injTitle);
    teamInjuryList.slice().sort((a,b)=> (isKeyPlayer(b.player,team)?1:0) - (isKeyPlayer(a.player,team)?1:0)).forEach(inj=>{
      const key = isKeyPlayer(inj.player, team);
      const row = document.createElement('div');
      row.style.cssText = `font-size:12.5px;padding:4px 0;${key?'':'color:var(--sub);'}`;
      const color = INJURY_SEVERITY_COLOR[injuryStatusSeverity(inj.status)] || 'var(--sub)';
      row.innerHTML = `<b style="color:${key?color:'var(--ink)'};">${inj.player}</b>${key?' <span style="font-size:10px;background:var(--navy2);color:#fff;padding:1px 5px;border-radius:3px;">KEY</span>':''}${inj.position?' ('+inj.position+')':''} \u2014 <span style="color:${color};font-weight:700;">${inj.status||'Status unclear'}</span>${inj.detail?': '+inj.detail:''}${inj.date?' <span style="color:var(--sub);">('+inj.date+')</span>':''}`;
      injBox.appendChild(row);
    });
    main.appendChild(injBox);
  }

  const selectorRow = document.createElement('div');
  selectorRow.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:16px;';
  const selectorLabel = document.createElement('div'); selectorLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;';
  selectorLabel.textContent = 'Season:';
  selectorRow.appendChild(selectorLabel);
  selectorRow.appendChild(buildYearMonthSelector(availableYears(team), (y)=>availableMonthsForYear(team,y), year, month, (y,m)=>renderTeamPage(team, y, m, windowMode)));
  main.appendChild(selectorRow);

  renderGameWindowStickyBar(windowMode, (val)=>{ if(val!==windowMode) renderTeamPage(team, year, month, val); });

  const t1 = document.createElement('div'); t1.className='section-title'; t1.textContent='Player Totals'; main.appendChild(t1);
  makeTable(main, TOTALS_COLS, summary.totals, {defaultSort:'pts', teamFor:()=>team});

  // ---- Tracked prop-line history, per player (points/rebounds/assists/threes/PRA are
  // player stats, so this is a player-select + chart rather than one team-wide graph) ----
  const lineTrendTitle = document.createElement('div'); lineTrendTitle.className='section-title';
  lineTrendTitle.textContent = 'Tracked DraftKings Prop Line History (Season)';
  main.appendChild(lineTrendTitle);
  const rosterSorted = summary.totals.slice().sort((a,b)=> b.gp - a.gp);
  if(rosterSorted.length){
    const lineTrendControls = document.createElement('div'); lineTrendControls.style.cssText='display:flex;align-items:center;gap:10px;margin-bottom:8px;';
    const playerSelectLabel = document.createElement('div'); playerSelectLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; playerSelectLabel.textContent='Player:';
    const playerSelect = document.createElement('select'); playerSelect.style.cssText='padding:5px 8px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;font-family:var(--sans);';
    rosterSorted.forEach(p=>{
      const opt = document.createElement('option'); opt.value = p.player; opt.textContent = `${p.player} (${p.gp} GP)`;
      playerSelect.appendChild(opt);
    });
    lineTrendControls.appendChild(playerSelectLabel); lineTrendControls.appendChild(playerSelect);
    main.appendChild(lineTrendControls);

    const lineTrendContainer = document.createElement('div');
    lineTrendContainer.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;';
    lineTrendContainer.textContent = 'Loading tracked line history\u2026';
    main.appendChild(lineTrendContainer);

    async function loadTeamPlayerTrend(pname){
      lineTrendContainer.textContent = 'Loading tracked line history\u2026';
      try{
        const history = await fetchOddsHistoryCached(n => { lineTrendContainer.textContent = `Loading tracked line history\u2026 (${n} snapshots so far)`; });
        renderLineTrendChart(lineTrendContainer, buildPlayerLineSeries(pname, team, history));
      }catch(e){
        lineTrendContainer.textContent = `Couldn\u2019t load line history: ${e.message}`;
      }
    }
    playerSelect.addEventListener('change', ()=>loadTeamPlayerTrend(playerSelect.value));
    loadTeamPlayerTrend(rosterSorted[0].player);
  } else {
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;margin-bottom:16px;';
    na.textContent = 'No players found for this team/range.';
    main.appendChild(na);
  }

  const t2 = document.createElement('div'); t2.className='section-title'; t2.textContent='Player Averages (Per Game Played)'; main.appendChild(t2);
  makeTable(main, AVG_COLS, summary.averages, {defaultSort:'pts', teamFor:()=>team});

  const t2b = document.createElement('div'); t2b.className='section-title'; t2b.textContent='Advanced Metrics \u2014 Offense vs. Defense (Usage Rate, Volatility, Trend)'; main.appendChild(t2b);
  const advFootnote = document.createElement('div'); advFootnote.className='footnote'; advFootnote.style.marginBottom='8px';
  advFootnote.textContent = `Computed from the same ${gameIds.length}-game range selected above. USG% is the standard Basketball-Reference formula (share of team possessions used while on the floor). EMA is an exponential moving average (recent games weighted more heavily than older ones) using a span of up to 10 games. StdDev/IQR measure game-to-game volatility \u2014 a high value means the mean/average is a less reliable predictor of any single game than it looks. The two footer rows are directly comparable: "TEAM TOTAL" is this team's own scoring trend, "TEAM DEFENSE" is what opponents have scored against them, using the same PTS/REB/AST EMA-StdDev-IQR columns either way. Not shown: "Potential Assists" genuinely isn't computable from this app's data source (ESPN's free box scores don't log passer-to-shooter events, only completed assists) \u2014 that one would need a paid feed like Her Hoop Stats.`;
  main.appendChild(advFootnote);
  const advResult = computeAdvancedStatsForTeam(team, gameIds, summary.teamGames);
  const defenseTrend = computeTeamDefenseTrend(summary.opponents);
  const advFooterRows = [];
  if(advResult.teamFooter) advFooterRows.push({label:'TEAM TOTAL (own scoring per game)', values: advResult.teamFooter});
  if(defenseTrend) advFooterRows.push({label:'TEAM DEFENSE (opponent scoring per game)', values: defenseTrend});
  makeTable(main, TEAM_ADV_COLS, advResult.rows, {defaultSort:'usgPct', teamFor:()=>team, footerRows: advFooterRows});

  const t2c = document.createElement('div'); t2c.className='section-title'; t2c.textContent='Team Defense by Position (Season, Full-Season DvP)'; main.appendChild(t2c);
  const defPosFootnote = document.createElement('div'); defPosFootnote.className='footnote'; defPosFootnote.style.marginBottom='8px';
  defPosFootnote.textContent = 'Always season-long regardless of the Season/Game Window selected above \u2014 position splits need the bigger sample to mean anything. Same DvP Index used on the Odds page and player pages: above 1.05 means this team allows notably more than league average to that position (plus matchup for the Over); below 0.95 means notably less (tougher matchup). Directly comparable to any player\u2019s own PTS/REB/AST EMA above \u2014 e.g. a high-EMA guard facing a team with a high PTS DvP Index against guards is a stacked signal, not just one data point.';
  main.appendChild(defPosFootnote);
  makeTable(main, TEAM_DEF_BY_POS_COLS, computeTeamDefenseByPosition(team), {defaultSort:'ptsAllowed', defaultDir:'desc', footerRows: [{label:'TEAM TOTAL (all positions)', values: computeTeamDefenseTotalRow(team)}]});

  const t3a = document.createElement('div'); t3a.className='section-title'; t3a.textContent='Team Totals by Game'; main.appendChild(t3a);
  const TEAM_GAME_NUMERIC_KEYS = TEAM_GAME_COLS.filter(c=>!c.left).map(c=>c.key);
  const teamGameFooterRows = [];
  const teamGameLabels = [
    {label:'TOTAL', fn: arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)*100)/100 : null},
    {label:'MIN', fn: arr => arr.length ? Math.min(...arr) : null},
    {label:'MAX', fn: arr => arr.length ? Math.max(...arr) : null},
    {label:'AVERAGE', fn: arr => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100)/100 : null},
    {label:'MEDIAN', fn: median},
    {label:'MODE', fn: mode},
  ];
  teamGameLabels.forEach(({label, fn})=>{
    const values = {};
    TEAM_GAME_NUMERIC_KEYS.forEach(k=>{ values[k] = fn(summary.teamGames.map(r=>r[k]).filter(v=>v!==null && v!==undefined)); });
    teamGameFooterRows.push({label, values});
  });
  makeTable(main, TEAM_GAME_COLS, summary.teamGames, {defaultSort:'date', defaultDir:'asc', footerRows: teamGameFooterRows});

  const t3 = document.createElement('div'); t3.className='section-title'; t3.textContent='Opponent Totals by Game'; main.appendChild(t3);
  const OPP_NUMERIC_KEYS = OPP_COLS.filter(c=>!c.left).map(c=>c.key);
  const oppFooterRows = [];
  const oppLabels = [
    {label:'TOTAL', fn: arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)*100)/100 : null},
    {label:'MIN', fn: arr => arr.length ? Math.min(...arr) : null},
    {label:'MAX', fn: arr => arr.length ? Math.max(...arr) : null},
    {label:'AVERAGE', fn: arr => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100)/100 : null},
    {label:'MEDIAN', fn: median},
    {label:'MODE', fn: mode},
  ];
  oppLabels.forEach(({label, fn})=>{
    const values = {};
    OPP_NUMERIC_KEYS.forEach(k=>{ values[k] = fn(summary.opponents.map(r=>r[k]).filter(v=>v!==null && v!==undefined)); });
    oppFooterRows.push({label, values});
  });
  makeTable(main, OPP_COLS, summary.opponents, {defaultSort:'date', defaultDir:'asc', footerRows: oppFooterRows});

  const t4 = document.createElement('div'); t4.className='section-title'; t4.textContent='Individual Games (click to expand box score)'; main.appendChild(t4);
  const list = document.createElement('div'); list.className='gamelist';
  if(gameIds.length===0){
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;'; na.textContent='No games in this range.';
    list.appendChild(na);
  }
  gameIds.slice().reverse().forEach(gid=>{
    const g = DATA.games[String(gid)];
    const chipWrap = document.createElement('div'); chipWrap.style.marginBottom='6px';
    const chip = document.createElement('button'); chip.className='gamechip';
    chip.style.cssText = 'width:100%;box-sizing:border-box;';
    chip.innerHTML = `${g.label} <span style="float:right;color:var(--sub);">\u25b8</span>`;
    const expandDiv = document.createElement('div');
    expandDiv.style.cssText = 'display:none;padding:12px 0 4px 0;';
    let built = false;
    chip.addEventListener('click', ()=>{
      const isOpen = expandDiv.style.display !== 'none';
      if(isOpen){
        expandDiv.style.display = 'none';
        chip.querySelector('span').textContent = '\u25b8';
      } else {
        if(!built){ buildBoxScoreContent(expandDiv, g); built = true; }
        expandDiv.style.display = '';
        chip.querySelector('span').textContent = '\u25be';
      }
    });
    chipWrap.appendChild(chip); chipWrap.appendChild(expandDiv);
    list.appendChild(chipWrap);
  });
  main.appendChild(list);
}

function bioLookup(player, team){
  const t = DATA.teams[team];
  if(!t) return {};
  const row = t.summaryFull.totals.find(r=>r.player===player);
  if(!row) return {};
  return { height: row.height, weight: row.weight, age: row.age, dob: row.dob, heightIn: row.heightIn };
}

function computeGameTeamTotals(rows, team){
  const teamRows = rows.filter(r=>r.team===team);
  const sum = k => teamRows.reduce((a,r)=> a + (r[k]||0), 0);
  const fgm=sum('fgm'), fga=sum('fga'), tpm=sum('tpm'), tpa=sum('tpa'), ftm=sum('ftm'), fta=sum('fta');
  return {
    min: sum('min'), pts: sum('pts'), fgm, fga, fgPct: fga? Math.round((fgm/fga)*10000)/10000 : null,
    tpm, tpa, tpPct: tpa? Math.round((tpm/tpa)*10000)/10000 : null,
    ftm, fta, ftPct: fta? Math.round((ftm/fta)*10000)/10000 : null,
    oreb: sum('oreb'), dreb: sum('dreb'), reb: sum('reb'),
    ast: sum('ast'), stl: sum('stl'), blk: sum('blk'), to: sum('to'), pf: sum('pf'),
  };
}

function median(arr){
  if(!arr.length) return null;
  const s = arr.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length%2 ? s[mid] : Math.round(((s[mid-1]+s[mid])/2)*100)/100;
}
function mode(arr){
  if(!arr.length) return null;
  const counts = new Map(); let best=null, bestCount=0;
  arr.forEach(v=>{ const c=(counts.get(v)||0)+1; counts.set(v,c); if(c>bestCount){ bestCount=c; best=v; } });
  return best;
}
function statValues(log, key){ return log.filter(g=>!g.dnp).map(g=>g[key]).filter(v=>v!==null && v!==undefined); }

// ================= Advanced analytics (rolling-window forecasting metrics) =================
// Standard deviation, IQR, EMA, Usage Rate, and Defense-vs-Position Index, computed entirely
// from box scores already loaded client-side. NOTE on scope: "Potential Assists" (passes
// leading to a teammate's shot, made or missed) genuinely can't be built from this pipeline's
// data \u2014 ESPN's free box scores/play-by-play don't carry passer-to-shooter event linkage,
// only the final made-assist count. That one specifically would need a source like Her Hoop
// Stats' paid API. Everything below is left out of that limitation.

function stdDevOf(arr){
  if(!arr || arr.length===0) return null;
  const mean = arr.reduce((a,b)=>a+b,0)/arr.length;
  const variance = arr.reduce((a,b)=>a+(b-mean)*(b-mean),0)/arr.length;
  return Math.sqrt(variance);
}
function percentileOf(sortedArr, p){
  if(!sortedArr || sortedArr.length===0) return null;
  const idx = (p/100)*(sortedArr.length-1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if(lo===hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi]-sortedArr[lo])*(idx-lo);
}
function iqrOf(arr){
  if(!arr || arr.length===0) return null;
  const sorted = arr.slice().sort((a,b)=>a-b);
  const q75 = percentileOf(sorted,75), q25 = percentileOf(sorted,25);
  return (q75===null||q25===null) ? null : q75-q25;
}
// arr must be chronological, oldest first. Standard EMA recurrence with smoothing factor
// 2/(span+1) \u2014 seeded with the first value (equivalent to pandas' ewm(adjust=False)).
function emaOf(arr, span){
  if(!arr || arr.length===0) return null;
  const alpha = 2/(span+1);
  let e = arr[0];
  for(let i=1;i<arr.length;i++){ e = arr[i]*alpha + e*(1-alpha); }
  return Math.round(e*100)/100;
}

// Standard (Basketball-Reference) Usage Rate formula:
//   USG% = 100 * ((FGA + 0.44*FTA + TOV) * (Team_MP/5)) / (MP * (Team_FGA + 0.44*Team_FTA + Team_TOV))
// playerRow needs {min, fga, fta, to}; teamAgg needs {mp, fga, fta, to} (team totals for that
// same game, all 5-on-court players combined).
function usgPctForGame(playerRow, teamAgg){
  if(!playerRow || !playerRow.min || !teamAgg || !teamAgg.mp) return null;
  const playerNum = (playerRow.fga||0) + 0.44*(playerRow.fta||0) + (playerRow.to||0);
  const teamDenom = (teamAgg.fga||0) + 0.44*(teamAgg.fta||0) + (teamAgg.to||0);
  if(!teamDenom) return null;
  return Math.round((100 * (playerNum * (teamAgg.mp/5)) / (playerRow.min * teamDenom)) * 10) / 10;
}
// Sums a team's box score rows for one game into the {mp, fga, fta, to} shape usgPctForGame needs.
function teamGameAggFromRows(rows){
  return {
    mp: rows.reduce((a,r)=>a+(r.min||0),0),
    fga: rows.reduce((a,r)=>a+(r.fga||0),0),
    fta: rows.reduce((a,r)=>a+(r.fta||0),0),
    to: rows.reduce((a,r)=>a+(r.to||0),0),
  };
}

// League-average "allowed per game to position X" for each stat \u2014 the baseline DvP Index
// is measured against. Reuses computeDefenseVsPosition()'s per-team numbers (see the
// Defense-vs-Position system added earlier in this file).
let _dvpBaselineCache = null;
function computeDvpBaseline(){
  if(_dvpBaselineCache) return _dvpBaselineCache;
  const ranks = computeDefenseVsPosition();
  const baseline = {};
  ['G','F','C'].forEach(b=>{
    baseline[b] = {};
    ['pts','reb','ast','tpm','pra'].forEach(k=>{
      const vals = TEAM_NAMES.map(t => ranks[t] && ranks[t][b] && ranks[t][b][k] ? ranks[t][b][k].perGame : null).filter(v=>v!==null);
      baseline[b][k] = vals.length ? vals.reduce((a,b2)=>a+b2,0)/vals.length : null;
    });
  });
  _dvpBaselineCache = baseline;
  return baseline;
}
// DvP Index > 1.05 = plus matchup (opponent yields notably more than average to this position;
// lean Over). < 0.95 = tougher matchup (lean Under/away). Returns null if data's unavailable.
function dvpIndex(opponentTeam, statKey, bucket){
  if(!bucket) return null;
  const r = getDefenseRank(opponentTeam, statKey, bucket);
  if(!r) return null;
  const baseline = computeDvpBaseline();
  const base = baseline[bucket] && baseline[bucket][statKey];
  if(!base) return null;
  return Math.round((r.perGame / base) * 1000) / 1000;
}
// Same as dvpIndex, but built on each team's last-N-games defensive numbers instead of the
// full season -- catches a defense that's recently tightened up or fallen off.
const _dvpBaselineWindowCache = {};
function computeDvpBaselineWindow(windowSize){
  if(_dvpBaselineWindowCache[windowSize]) return _dvpBaselineWindowCache[windowSize];
  const ranks = computeDefenseVsPositionWindow(windowSize);
  const baseline = {};
  ['G','F','C'].forEach(b=>{
    baseline[b] = {};
    ['pts','reb','ast','tpm','pra'].forEach(k=>{
      const vals = TEAM_NAMES.map(t => ranks[t] && ranks[t][b] && ranks[t][b][k] ? ranks[t][b][k].perGame : null).filter(v=>v!==null);
      baseline[b][k] = vals.length ? vals.reduce((a,b2)=>a+b2,0)/vals.length : null;
    });
  });
  _dvpBaselineWindowCache[windowSize] = baseline;
  return baseline;
}
function dvpIndexWindow(opponentTeam, statKey, bucket, windowSize){
  if(!bucket) return null;
  const r = getDefenseRankWindow(opponentTeam, statKey, bucket, windowSize);
  if(!r) return null;
  const baseline = computeDvpBaselineWindow(windowSize);
  const base = baseline[bucket] && baseline[bucket][statKey];
  if(!base) return null;
  return Math.round((r.perGame / base) * 1000) / 1000;
}
function dvpIndexL5(opponentTeam, statKey, bucket){ return dvpIndexWindow(opponentTeam, statKey, bucket, 5); }
function dvpIndexL10(opponentTeam, statKey, bucket){ return dvpIndexWindow(opponentTeam, statKey, bucket, 10); }
function dvpIndexL15(opponentTeam, statKey, bucket){ return dvpIndexWindow(opponentTeam, statKey, bucket, 15); }

// Shows all four DvP Index windows (season, L15, L10, L5) stacked in one compact cell.
function buildMultiWindowDvpCell(opponentTeam, statKey, bucket){
  const wrap = document.createElement('div'); wrap.style.cssText = 'font-size:11px;line-height:1.5;';
  const rows = [
    ['Season', dvpIndex(opponentTeam, statKey, bucket)],

    ['L10', dvpIndexL10(opponentTeam, statKey, bucket)],
    ['L5', dvpIndexL5(opponentTeam, statKey, bucket)],
  ];
  rows.forEach(([label,val])=>{
    const row = document.createElement('div');
    row.textContent = `${label}: ${val!==null ? val.toFixed(3) : '\u2014'}`;
    wrap.appendChild(row);
  });
  return wrap;
}

function teamBetMetricType(betType){
  if(betType==='moneyline' || betType==='spread') return 'margin';
  if(betType==='team_total') return 'scored';
  if(betType==='total') return 'combined';
  return null;
}
function teamStatsForBet(bet, useL5){
  const metric = teamBetMetricType(bet.betType);
  if(!metric || !bet.team || !bet.opponent) return null;
  const windowSize = useL5 ? 5 : null;
  const oppRank = getTeamDefenseRank(bet.opponent, windowSize);
  if(!oppRank) return null;
  const {lo, hi, teams: similarTeams} = teamSimilarDefenseTeams(oppRank, windowSize);

  const games = [];
  Object.values(DATA.games).forEach(g=>{
    if(g.homeScore==null || g.awayScore==null) return;
    if(g.home!==bet.team && g.away!==bet.team) return;
    const opp = g.home===bet.team ? g.away : g.home;
    if(!similarTeams.includes(opp)) return;
    games.push(g);
  });
  games.sort((a,b)=> b.date.localeCompare(a.date));
  if(!games.length) return {oppRank, lo, hi, n:0, avg:null, variance:null, games:[]};

  const values = games.map(g=>{
    const own = g.home===bet.team ? g.homeScore : g.awayScore;
    const opp = g.home===bet.team ? g.awayScore : g.homeScore;
    return metric==='margin' ? (own-opp) : (metric==='scored' ? own : own+opp);
  });
  const avg = Math.round((values.reduce((a,b)=>a+b,0)/values.length)*10)/10;
  const variance = computeVariance(values);
  const gamesOut = games.map((g,i)=>{
    const isHome = g.home===bet.team;
    const oppTeam = isHome ? g.away : g.home;
    const oppRankOfGame = getTeamDefenseRank(oppTeam, windowSize, g.date);
    return {date:g.date, value:values[i], isHome, oppFull: FULL_TEAM_NAME[oppTeam]||oppTeam, oppRank:oppRankOfGame, gameId: g.id};
  });
  return {oppRank, lo, hi, n:games.length, avg, variance, games:gamesOut};
}
// Team-level equivalent of buildStatLine -- no player/minutes concept, so the value label and
// direction (margin vs. own points vs. combined) come from the metric instead.
function buildTeamStatLine(g, metric){
  const a = document.createElement('a'); a.href = 'javascript:void(0)'; a.className = 'player-link';
  a.style.cssText = 'display:block;font-size:11px;color:inherit;text-decoration:none;';
  const label = metric==='margin' ? 'margin' : (metric==='scored' ? 'pts' : 'combined pts');
  const displayVal = metric==='margin' ? (g.value>=0?'+'+g.value:String(g.value)) : String(g.value);
  const bVal = document.createElement('b'); bVal.textContent = displayVal;
  a.appendChild(bVal);
  a.appendChild(document.createTextNode(` ${label} ${g.isHome?'vs':'@'} `));
  const bRank = document.createElement('b'); bRank.textContent = g.oppRank ? `#${g.oppRank.rank}` : '#\u2014';
  a.appendChild(bRank);
  a.appendChild(document.createTextNode(` (${g.oppFull}) - ${g.date}`));
  if(g.gameId){ a.addEventListener('click', ()=>goToGameBox(g.gameId)); } else { a.style.cursor = 'default'; }
  return a;
}
// Team-level equivalent of buildSimilarDefenseCell -- same collapse/expand behavior, same
// header format, same Avg/Var summary, just built from team game results instead of a player
// log. Hit/miss uses TODAY's line against historical values (no historical betting lines exist
// for past games), same convention player props already use.
function buildTeamSimilarDefenseCell(bet, useL5){
  const stats = teamStatsForBet(bet, useL5);
  if(!stats) return document.createTextNode('\u2014');
  const wrap = document.createElement('div');
  const header = document.createElement('div'); header.style.cssText = 'font-size:10.5px;color:var(--sub);margin-bottom:2px;';
  header.textContent = `Vs Def Rank ${stats.lo}-${stats.hi}/${stats.oppRank.of}${useL5?' (L5)':''} (today\u2019s opp: ${stats.oppRank.rank}/${stats.oppRank.of})`;
  wrap.appendChild(header);
  if(!stats.games.length){
    const none = document.createElement('div'); none.style.cssText = 'font-size:11px;color:var(--sub);';
    none.textContent = 'No meetings yet vs these defenses';
    wrap.appendChild(none);
    return wrap;
  }
  const metric = teamBetMetricType(bet.betType);
  const threshold = bet.line;
  const hasLine = threshold!==undefined && threshold!==null && bet.betType!=='moneyline';
  stats.games.forEach((g,i)=>{
    const row = document.createElement('div'); row.className = 'sim-def-game-row';
    row.style.cssText = 'align-items:center;gap:4px;';
    if(i>0) row.classList.add('sim-def-collapsible');
    if(hasLine){
      const hit = bet.side==='under' ? g.value < threshold : g.value >= threshold;
      row.appendChild(vsOpponentHitIcon(hit));
    }
    row.appendChild(buildTeamStatLine(g, metric));
    wrap.appendChild(row);
  });
  const avgRow = document.createElement('div'); avgRow.style.cssText = 'font-size:11px;font-weight:700;margin-top:2px;';
  avgRow.textContent = `Avg: ${stats.avg} (${stats.n} GP)` + (stats.variance!==null ? `, Var: ${stats.variance}` : '');
  wrap.appendChild(avgRow);
  return wrap;
}
// Multi-window (season/L15/L10/L5) DvP display, team-level version.
function buildMultiWindowTeamDvpCell(opponentTeam){
  const wrap = document.createElement('div'); wrap.style.cssText = 'font-size:11px;line-height:1.5;';
  [['Season',null],['L15',15],['L10',10],['L5',5]].forEach(([label,windowSize])=>{

const TEAM_ADV_COLS = [
  {key:'player', label:'Player', left:true}, {key:'gp', label:'GP'},
  {key:'usgPct', label:'USG%', round2:true},
  {key:'ptsEma', label:'PTS EMA', round2:true}, {key:'ptsStd', label:'PTS StdDev', round2:true}, {key:'ptsIqr', label:'PTS IQR', round2:true},
  {key:'rebEma', label:'REB EMA', round2:true}, {key:'rebStd', label:'REB StdDev', round2:true}, {key:'rebIqr', label:'REB IQR', round2:true},
  {key:'astEma', label:'AST EMA', round2:true}, {key:'astStd', label:'AST StdDev', round2:true}, {key:'astIqr', label:'AST IQR', round2:true},
];

// Builds one row per player (within whatever gameIds are currently in view \u2014 respects the
// page's Season + Game Window filters, same as every other table on this page) plus a
// TEAM TOTAL footer row using the team's own per-game combined stats.
function computeAdvancedStatsForTeam(team, gameIds, teamGamesChrono){
  const sortedGameIds = gameIds.slice().sort((a,b)=> DATA.games[String(a)].date.localeCompare(DATA.games[String(b)].date));
  const playerLogs = {};
  sortedGameIds.forEach(gid=>{
    const g = DATA.games[String(gid)];
    if(!g) return;
    const teamRows = g.rows.filter(r=>r.team===team && !r.dnp);
    const teamAgg = teamGameAggFromRows(teamRows);
    teamRows.forEach(r=>{
      if(!playerLogs[r.athleteId]) playerLogs[r.athleteId] = {player:r.player, games:[]};
      playerLogs[r.athleteId].games.push({pts:r.pts||0, reb:r.reb||0, ast:r.ast||0, usg:usgPctForGame(r, teamAgg)});
    });
  });

  const rows = Object.values(playerLogs).map(p=>{
    const ptsArr = p.games.map(x=>x.pts), rebArr = p.games.map(x=>x.reb), astArr = p.games.map(x=>x.ast);
    const usgArr = p.games.map(x=>x.usg).filter(v=>v!==null);
    const span = Math.max(1, Math.min(10, ptsArr.length));
    return {
      player: p.player, gp: p.games.length,
      usgPct: usgArr.length ? usgArr.reduce((a,b)=>a+b,0)/usgArr.length : null,
      ptsEma: emaOf(ptsArr, span), ptsStd: stdDevOf(ptsArr), ptsIqr: iqrOf(ptsArr),
      rebEma: emaOf(rebArr, span), rebStd: stdDevOf(rebArr), rebIqr: iqrOf(rebArr),
      astEma: emaOf(astArr, span), astStd: stdDevOf(astArr), astIqr: iqrOf(astArr),
    };
  });

  let teamFooter = null;
  if(teamGamesChrono && teamGamesChrono.length){
    const ptsArr = teamGamesChrono.map(g=>g.teamPts), rebArr = teamGamesChrono.map(g=>g.reb), astArr = teamGamesChrono.map(g=>g.ast);
    const span = Math.max(1, Math.min(10, ptsArr.length));
    teamFooter = {
      ptsEma: emaOf(ptsArr, span), ptsStd: stdDevOf(ptsArr), ptsIqr: iqrOf(ptsArr),
      rebEma: emaOf(rebArr, span), rebStd: stdDevOf(rebArr), rebIqr: iqrOf(rebArr),
      astEma: emaOf(astArr, span), astStd: stdDevOf(astArr), astIqr: iqrOf(astArr),
    };
  }
  return {rows, teamFooter};
}

// Defensive counterpart to the teamFooter above \u2014 EMA/StdDev/IQR of what OPPONENTS have
// scored against this team, per game (from summary.opponents, already chronological). Same
// column shape as the offense side so the two rows sit directly comparable in one table.
function computeTeamDefenseTrend(opponentGamesChrono){
  if(!opponentGamesChrono || !opponentGamesChrono.length) return null;
  const ptsArr = opponentGamesChrono.map(g=>g.oppPts), rebArr = opponentGamesChrono.map(g=>g.oppReb), astArr = opponentGamesChrono.map(g=>g.oppAst);
  const span = Math.max(1, Math.min(10, ptsArr.length));
  return {
    ptsEma: emaOf(ptsArr, span), ptsStd: stdDevOf(ptsArr), ptsIqr: iqrOf(ptsArr),
    rebEma: emaOf(rebArr, span), rebStd: stdDevOf(rebArr), rebIqr: iqrOf(rebArr),
    astEma: emaOf(astArr, span), astStd: stdDevOf(astArr), astIqr: iqrOf(astArr),
  };
}

// Position-by-position defensive breakdown \u2014 season-long (see the Defense-vs-Position
// system earlier in this file), covering the same stat set as the player table above.
const TEAM_DEF_BY_POS_COLS = [
  {key:'position', label:'Position Allowed To', left:true},
  {key:'ptsAllowed', label:'PTS/Gm'}, {key:'ptsDvp', label:'PTS DvP Idx', round2:true},
  {key:'rebAllowed', label:'REB/Gm'}, {key:'rebDvp', label:'REB DvP Idx', round2:true},
  {key:'astAllowed', label:'AST/Gm'}, {key:'astDvp', label:'AST DvP Idx', round2:true},
  {key:'tpmAllowed', label:'3PM/Gm'}, {key:'tpmDvp', label:'3PM DvP Idx', round2:true},
  {key:'praAllowed', label:'PRA/Gm'}, {key:'praDvp', label:'PRA DvP Idx', round2:true},
];
function computeTeamDefenseByPosition(team){
  return ['G','F','C'].map(bucket=>{
    const row = {position: POSITION_LABEL[bucket]};
    ['pts','reb','ast','tpm','pra'].forEach(statKey=>{
      const r = getDefenseRank(team, statKey, bucket);
      row[statKey+'Allowed'] = r ? r.perGame : null;
      row[statKey+'Dvp'] = dvpIndex(team, statKey, bucket);
    });
    return row;
  });
}
// Team-wide row summing the three position rows above \u2014 approximates this team's actual
// total stats allowed per game (every player falls into one of G/F/C), with a matching
// team-wide DvP Index: this team's summed allowed vs. the league-average summed allowed
// across positions for that stat, same >1.05/<0.95 read as the position-level DvP above.
function computeTeamDefenseTotalRow(team){
  const posRows = computeTeamDefenseByPosition(team);
  const baseline = computeDvpBaseline();
  const row = {position: 'TEAM TOTAL (all positions)'};
  ['pts','reb','ast','tpm','pra'].forEach(statKey=>{
    const allowedSum = posRows.reduce((a,r)=> a + (r[statKey+'Allowed']||0), 0);
    row[statKey+'Allowed'] = Math.round(allowedSum*10)/10;
    const baseSum = ['G','F','C'].reduce((a,b)=> a + ((baseline[b] && baseline[b][statKey]) || 0), 0);
    row[statKey+'Dvp'] = baseSum ? Math.round((allowedSum/baseSum)*1000)/1000 : null;
  });
  return row;
}

// Flags players whose average minutes over their most recent N games differ from their
// average over the N games immediately before that by at least the given threshold (0.20 =
// 20%). DNP games count as 0 minutes rather than being skipped -- a player who's fallen out
// of the rotation entirely is exactly the kind of decrease this should catch, not silently
// pass over. Requires at least 2*windowSize total games in a player's log so both windows are
// real, same-size comparisons; players without enough history yet are left out rather than
// compared on an uneven basis.
// Keyword match against whatever raw DNP reason text Sportradar provides (field/wording not
// yet confirmed against a real WNBA response -- see fetch_sportradar_wnba.py) -- deliberately
// a loose substring match rather than an exact enum check, since guessing the wrong exact
// value would silently fail to catch real injury DNPs.
function isInjuryDnp(g){
  if(!g.dnp || !g.notPlayingReason) return false;
  const s = String(g.notPlayingReason).toLowerCase();
  return s.includes('injur') || s.includes('illness') || s.includes('health') || s.includes('sick');
}
// Minutes-weighted average height, per team, over the last 5 games each player actually
// played. This is a real basketball concept -- roughly "how tall is the average player on the
// floor for this team at any given moment" -- computed as sum(avgMin_i * height_i) /
// sum(avgMin_i) across every player who's gotten minutes recently. sum(avgMin_i) should land
// close to 200 (5 players x 40 minutes) per team, though not exactly, since it's built from a
// 5-game average per player rather than one single game (overtime, rotation changes, and
// players who only picked up minutes partway through the window all nudge it slightly off 200
// -- that's expected, not a bug, and is exactly why totalMinutesAccountedFor is surfaced
// alongside the result rather than assumed to always be 200).
function computeTeamWeightedHeight(){
  const teamData = {};
  TEAM_NAMES.forEach(t=>{ teamData[t] = {sumWeighted:0, sumMinutes:0, players:[]}; });

  Object.keys(DATA.fullPlayerLogs).forEach(key=>{
    const sep = key.lastIndexOf('|');
    const playerName = key.slice(0, sep), team = key.slice(sep+1);
    if(!teamData[team]) return;
    const log = DATA.fullPlayerLogs[key].log;
    const recentGames = log.filter(g=>!g.dnp).slice(-5);
    if(!recentGames.length) return;
    const avgMin = recentGames.reduce((a,g)=>a+(g.min||0),0) / recentGames.length;
    if(avgMin <= 0) return; // no meaningful recent playing time -- skip rather than dilute with a garbage-time-only player
    const bio = bioLookup(playerName, team);
    if(bio.heightIn===undefined || bio.heightIn===null) return; // no height on file -- skip rather than guess
    teamData[team].sumWeighted += avgMin * bio.heightIn;
    teamData[team].sumMinutes += avgMin;
    teamData[team].players.push({player: playerName, avgMin: Math.round(avgMin*10)/10, heightIn: bio.heightIn, height: bio.height});
  });

  const results = TEAM_NAMES.map(t=>{
    const d = teamData[t];
    const weightedHeightIn = d.sumMinutes > 0 ? d.sumWeighted / d.sumMinutes : null;
    return {
      team: t,
      weightedHeightIn: weightedHeightIn!==null ? Math.round(weightedHeightIn*100)/100 : null,
      totalMinutesAccountedFor: Math.round(d.sumMinutes*10)/10,
      players: d.players.sort((a,b)=>b.avgMin-a.avgMin),
    };
  }).filter(r=>r.weightedHeightIn!==null);
  results.sort((a,b)=>b.weightedHeightIn-a.weightedHeightIn);
  results.forEach((r,i)=>{ r.rank = i+1; r.of = results.length; });
  return results;
}

function computeMinutesTrend(windowSize, thresholdPct){
  const rows = [];
  Object.keys(DATA.fullPlayerLogs).forEach(key=>{
    const sep = key.lastIndexOf('|');
    const playerName = key.slice(0, sep), team = key.slice(sep+1);
    const log = DATA.fullPlayerLogs[key].log;
    if(log.length < windowSize*2) return;
    // Injury DNPs are excluded entirely (not counted as a 0-minute game, not counted as a
    // game at all) rather than treated as a real decrease -- a health absence isn't a role
    // change. Non-injury DNPs (coach's decision, rest, etc.) still count as 0, since those
    // genuinely do reflect a role/usage change. Data without a reason recorded (most of the
    // current dataset, until a fresh Sportradar pull backfills it) falls back to counting
    // every DNP as 0, same as before this distinction existed.
    const recentGames = log.slice(-windowSize).filter(g=>!isInjuryDnp(g));
    const priorGames = log.slice(-windowSize*2, -windowSize).filter(g=>!isInjuryDnp(g));
    if(!recentGames.length || !priorGames.length) return; // window was entirely injury DNPs -- no real basis for a comparison
    const avgMin = games => games.reduce((sum,g)=> sum + (g.dnp || g.min===null || g.min===undefined ? 0 : g.min), 0) / games.length;
    const recentAvg = avgMin(recentGames), priorAvg = avgMin(priorGames);
    let pctChange;
    if(priorAvg === 0){
      if(recentAvg === 0) return; // no minutes in either window -- nothing to report
      pctChange = null; // "new to the rotation" -- a real jump, but no meaningful percent (would be infinite off a zero base)
    } else {
      pctChange = (recentAvg - priorAvg) / priorAvg;
    }
    const qualifies = pctChange === null ? recentAvg >= 5 : Math.abs(pctChange) >= thresholdPct; // the null case still needs a real minutes floor so garbage-time noise doesn't flag
    if(!qualifies) return;
    rows.push({
      player: playerName, team,
      recentAvg: Math.round(recentAvg*10)/10,
      priorAvg: Math.round(priorAvg*10)/10,
      pctChange, // null means "from zero" -- rendered specially, not as a percent
    });
  });
  const increasing = rows.filter(r => r.pctChange === null || r.pctChange > 0).sort((a,b)=>{
    if(a.pctChange===null && b.pctChange===null) return b.recentAvg - a.recentAvg;
    if(a.pctChange===null) return -1;
    if(b.pctChange===null) return 1;
    return b.pctChange - a.pctChange;
  });
  const decreasing = rows.filter(r => r.pctChange !== null && r.pctChange < 0).sort((a,b)=> a.pctChange - b.pctChange);
  return {increasing, decreasing};
}

function computeLeagueAdvancedRows(year){
  const rows = [];
  Object.keys(DATA.fullPlayerLogs).forEach(key=>{
    const sep = key.lastIndexOf('|');
    const playerName = key.slice(0, sep), team = key.slice(sep+1);
    const rec = DATA.fullPlayerLogs[key];
    const yearLog = rec.log.filter(g => g.date && g.date.startsWith(String(year)));
    if(!yearLog.some(g=>!g.dnp)) return;
    const advLog = computePlayerAdvancedLog({player: playerName, log: yearLog}, team).filter(r=>!r.dnp);
    if(!advLog.length) return;
    const last = advLog[advLog.length-1];
    const avg = arr => { arr = arr.filter(v=>v!==null && v!==undefined); return arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*1000)/1000 : null; };
    rows.push({
      team, player: playerName,
      usgPct: avg(advLog.map(r=>r.usgPct)),
      ptsEma: last.ptsEma, ptsStd: last.ptsStd, ptsIqr: last.ptsIqr,
      rebEma: last.rebEma, rebStd: last.rebStd, rebIqr: last.rebIqr,
      astEma: last.astEma, astStd: last.astStd, astIqr: last.astIqr,
      avgDvpPts: avg(advLog.map(r=>r.dvpPts)), avgDvpReb: avg(advLog.map(r=>r.dvpReb)), avgDvpAst: avg(advLog.map(r=>r.dvpAst)),
    });
  });
  return rows;
}

function findGameByTeamDate(team, date){
  return Object.values(DATA.games).find(g => (g.home===team || g.away===team) && g.date===date);
}

// One row per game in pl.log (same window as the box score table directly above it, and in
// the same chronological order), building EMA/StdDev/IQR progressively game-by-game \u2014 each
// row only ever uses that game and earlier ones, never future data, so this reflects what
// would actually have been knowable going into that game.
function computePlayerAdvancedLog(pl, team){
  const rows = [];
  const cumPts = [], cumReb = [], cumAst = [];
  pl.log.forEach(g=>{
    if(g.dnp){
      rows.push({date:g.date, opp:g.opp, homeAway:g.homeAway, dnp:true, min:null, usgPct:null,
        ptsEma:null, ptsStd:null, ptsIqr:null, rebEma:null, rebStd:null, rebIqr:null,
        astEma:null, astStd:null, astIqr:null, dvpPts:null, dvpReb:null, dvpAst:null});
      return;
    }
    cumPts.push(g.pts||0); cumReb.push(g.reb||0); cumAst.push(g.ast||0);
    const trailPts = cumPts.slice(-10), trailReb = cumReb.slice(-10), trailAst = cumAst.slice(-10);

    let usg = null;
    const gameRecord = findGameByTeamDate(team, g.date);
    if(gameRecord){
      const teamRows = gameRecord.rows.filter(r=>r.team===team && !r.dnp);
      const playerRow = teamRows.find(r=>r.player===pl.player);
      if(playerRow) usg = usgPctForGame(playerRow, teamGameAggFromRows(teamRows));
    }

    const oppShort = SHORT_TEAM_NAME[g.opp] || g.opp;
    const bucket = positionBucket(getPlayerPosition(pl.player, team));

    rows.push({
      date:g.date, opp:g.opp, homeAway:g.homeAway, dnp:false, min:g.min, usgPct: usg,
      ptsEma: emaOf(cumPts, Math.min(10,cumPts.length)), ptsStd: stdDevOf(trailPts), ptsIqr: iqrOf(trailPts),
      rebEma: emaOf(cumReb, Math.min(10,cumReb.length)), rebStd: stdDevOf(trailReb), rebIqr: iqrOf(trailReb),
      astEma: emaOf(cumAst, Math.min(10,cumAst.length)), astStd: stdDevOf(trailAst), astIqr: iqrOf(trailAst),
      dvpPts: dvpIndexAsOf(oppShort, 'pts', bucket, g.date), dvpReb: dvpIndexAsOf(oppShort, 'reb', bucket, g.date), dvpAst: dvpIndexAsOf(oppShort, 'ast', bucket, g.date),
    });
  });
  return rows;
}

// Same Total/Min/Max/Average/Median/Mode footer pattern used by the main box score table,
// factored out so the Vs Opponent table (and its advanced-metrics counterpart) can reuse it
// exactly rather than re-implementing it.
function buildStandardFooterRows(rows, statKeys){
  const footerRows = [];
  const labels = [
    {label:'TOTAL (games played)', fn: arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)*100)/100 : null},
    {label:'MIN (games played)', fn: arr => arr.length ? Math.min(...arr) : null},
    {label:'MAX (games played)', fn: arr => arr.length ? Math.max(...arr) : null},
    {label:'AVERAGE (games played)', fn: arr => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100)/100 : null},
    {label:'MEDIAN (games played)', fn: median},
    {label:'MODE (games played)', fn: mode},
  ];
  labels.forEach(({label, fn})=>{
    const values = {};
    statKeys.forEach(k=>{ values[k] = fn(statValues(rows, k)); });

}
