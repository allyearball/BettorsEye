  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr'); tr.style.cssText = 'border-bottom:1px solid var(--line);';
    const statusColor = r.status==='Out' ? 'var(--red)' : (r.status==='Day-To-Day' ? '#b8860b' : 'var(--green)');
    const tdName = document.createElement('td'); tdName.style.cssText = 'padding:5px;';
    const nameLink = document.createElement('a'); nameLink.href='javascript:void(0)'; nameLink.className='player-link'; nameLink.textContent=r.player;
    nameLink.addEventListener('click', ()=>goToPlayer(r.player, opp));
    tdName.appendChild(nameLink);
    tr.appendChild(tdName);
    const tdMin = document.createElement('td'); tdMin.style.cssText = 'padding:5px;text-align:center;'; tdMin.textContent = r.avgMin;
    const tdTier = document.createElement('td'); tdTier.style.cssText = 'padding:5px;text-align:center;'; tdTier.textContent = r.tier || '\u2014';
    const tdHeight = document.createElement('td'); tdHeight.style.cssText = 'padding:5px;text-align:center;'; tdHeight.textContent = r.height;
    const tdStatus = document.createElement('td'); tdStatus.style.cssText = `padding:5px;text-align:center;font-weight:700;color:${statusColor};`; tdStatus.textContent = r.status;
    tr.appendChild(tdMin); tr.appendChild(tdTier); tr.appendChild(tdHeight); tr.appendChild(tdStatus);
    tbody.appendChild(tr);
  });

  // Overall group classification -- minutes-weighted average height across everyone listed
  // above, classified the same way each individual player was, so you can see at a glance
  // whether this whole position group profiles as short/middle/tall for her, not just any one
  // player on it. Only meaningful with real minutes and real heights to weight by.
  if(groupTier){
    const tr = document.createElement('tr'); tr.style.cssText = 'background:#eef2fb;font-weight:700;border-top:2px solid var(--line);';
    const tdLabel = document.createElement('td'); tdLabel.style.cssText = 'padding:5px;'; tdLabel.textContent = 'Group (minutes-weighted)';
    const tdBlankMin = document.createElement('td'); tdBlankMin.style.cssText = 'padding:5px;';
    const tdGroupTier = document.createElement('td'); tdGroupTier.style.cssText = 'padding:5px;text-align:center;'; tdGroupTier.textContent = groupTier.charAt(0).toUpperCase()+groupTier.slice(1);
    const tdGroupHeight = document.createElement('td'); tdGroupHeight.style.cssText = 'padding:5px;text-align:center;'; tdGroupHeight.textContent = `${inchesToHeightStr(weightedHeight) || '\u2014'} (${weightedHeight.toFixed(1)}in)`;
    const tdBlankStatus = document.createElement('td'); tdBlankStatus.style.cssText = 'padding:5px;';
    [tdLabel, tdBlankMin, tdGroupTier, tdGroupHeight, tdBlankStatus].forEach(td=>tr.appendChild(td));
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  container.appendChild(table);
}

// New standalone section: "Estimated Share of Allowed/Gm vs [Opponent]" -- extracted out of
// what used to live inside the Next Opponent section above, now its own table so it can sit
// between Production vs Opposing Position Height and Next Opponent \u2014 Same Position, per request.
// Both share estimates, broken out by the height tier of the opposing position group she faced.
// Same calculation as the two headline numbers -- her share of her position group, applied to
// this opponent's Allowed/Gm -- just measured over only her games against short / middle / tall
// opposing groups instead of over the window as a whole. The Allowed/Gm side is unchanged (it's
// a property of the opponent, not of the tier); what varies by tier is HER share, which is the
// point: a guard whose production share climbs against taller opposing groups reads differently
// than one whose share collapses.
function buildShareByTierTable(container, playerName, team, opp, windowMode, heightTierData, highlightTier, mode){
  const TIERS = [{key:'shortest', label:'Shortest'}, {key:'middle', label:'Middle'}, {key:'tallest', label:'Tallest'}];
  const STATS = propStatPairs();
  const rec = DATA.fullPlayerLogs[playerName+'|'+team];
  if(!heightTierData || !heightTierData.allGames || !rec) return false;

  // The tier data is keyed by date (she plays at most one game a day), which is the same
  // assumption the tier detail page's own game-exclusion checkboxes already make.
  const windowed = windowMode && windowMode!=='all'
    ? heightTierData.allGames.slice(-windowMode)
    : heightTierData.allGames;
  const datesByTier = {};
  TIERS.forEach(t=>{ datesByTier[t.key] = new Set(); });
  windowed.forEach(g=>{ if(datesByTier[g.tier]) datesByTier[g.tier].add(g.date); });
  const logByDate = {};
  rec.log.filter(g=>!g.dnp).forEach(g=>{ logByDate[g.date] = g; });

  const wrap = document.createElement('div'); wrap.className='table-wrap'; wrap.style.marginTop='8px';
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th class="left">Opposing group height</th><th>GP</th>'
    + STATS.map(([,l])=>`<th>${l}</th>`).join('') + '</tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  let anyRow = false;
  TIERS.forEach(t=>{
    const games = [...datesByTier[t.key]].map(d=>logByDate[d]).filter(Boolean);
    const tr = document.createElement('tr');
    if(highlightTier === t.key){
      // Same visual language as the tier outline on the Production vs. Opposing Position Height
      // tables above: a box marks her next opponent's own group classification.
      tr.style.cssText = 'outline:2px solid var(--navy2);outline-offset:-2px;font-weight:700;';
    }
    const tdName = document.createElement('td'); tdName.className='left'; tdName.textContent = t.label;
    tr.appendChild(tdName);
    const tdGp = document.createElement('td'); tdGp.textContent = games.length; tr.appendChild(tdGp);
    STATS.forEach(([statKey])=>{
      const td = document.createElement('td');
      const node = games.length
        ? (mode==='minutes'
            ? buildHerShareNode(playerName, team, opp, statKey, windowMode, games)
            : buildHerProductionShareNode(playerName, team, opp, statKey, windowMode, games))
        : null;
      if(node){ td.appendChild(node); anyRow = true; } else { td.textContent = '—'; }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  if(!anyRow) return false;
  container.appendChild(wrap);
  return true;
}

function renderShareOfAllowedSection(container, playerName, team, opp, windowMode, heightTierData, highlightTier){
  container.innerHTML = '';
  const oppFull = FULL_TEAM_NAME[opp] || opp;
  // "Her Share" of the position group's Allowed/Gm -- matches whichever window (L5/L10/L15/
  // Season) is currently selected at the top of the page, same as everything else here. Two
  // versions shown together on purpose: minutes-based (a proxy, assumes production scales with
  // playing time) and production-based (the real thing, her actual share of the group's stats)
  // -- comparing them tells you something too, e.g. a much higher production share than minutes
  // share means she's more efficient/ball-dominant than her position-mates, not just on the floor more.
  const shareTitle = document.createElement('div'); shareTitle.style.cssText = 'font-weight:700;color:var(--navy2);font-size:12.5px;';
  shareTitle.textContent = `Her Estimated Share of ${oppFull}'s Allowed/Gm (by Minutes)`;
  container.appendChild(shareTitle);
  appendDefIcon(shareTitle, `Allowed/Gm above is for her ENTIRE position group (every player at her position on her team combined) \u2014 this estimates what fraction of that number might reasonably belong to her specifically, using her share of the group's total minutes played (over the same window selected at the top of the page) as a proxy for her share of the group's production. This is an OPPORTUNITY-share proxy, not a measured production share \u2014 a player more (or less) productive per minute than her position-mates would have a real share above (or below) this estimate. See the "by Production" version below for the more accurate alternative. Still more specific than the flat, undifferentiated team-wide number on its own.`);
  const shareRow = document.createElement('div'); shareRow.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;';
  propStatPairs().forEach(([statKey,label])=>{
    const node = buildHerShareNode(playerName, team, opp, statKey, windowMode);
    const item = document.createElement('div'); item.style.cssText = 'font-size:12.5px;';
    const lbl = document.createElement('b'); lbl.textContent = label+': ';
    item.appendChild(lbl);
    item.appendChild(node || document.createTextNode('\u2014'));
    shareRow.appendChild(item);
  });
  container.appendChild(shareRow);
  buildShareByTierTable(container, playerName, team, opp, windowMode, heightTierData, highlightTier, 'minutes');

  const prodShareTitle = document.createElement('div'); prodShareTitle.style.cssText = 'font-weight:700;color:var(--navy2);font-size:12.5px;margin-top:12px;';
  prodShareTitle.textContent = `Her Estimated Share of ${oppFull}'s Allowed/Gm (by Production)`;
  container.appendChild(prodShareTitle);
  appendDefIcon(prodShareTitle, `The more accurate version of the "by Minutes" estimate above \u2014 instead of assuming her share of the group's production matches her share of the group's minutes, this measures her ACTUAL share of the group's own points/rebounds/assists/3PM/PRA (over the same window selected at the top of the page) and applies that real share to ${oppFull}'s Allowed/Gm for her position. A player who scores or rebounds at a higher rate than her position-mates will show a higher share here than in the minutes-based version above \u2014 and a lower-usage, high-minutes role player will show the opposite. This is still her OWN team's recent production, not a measurement of how ${oppFull} specifically will defend her \u2014 no app has play-by-play tracking of who actually guarded whom.`);
  const prodShareRow = document.createElement('div'); prodShareRow.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;';
  propStatPairs().forEach(([statKey,label])=>{
    const node = buildHerProductionShareNode(playerName, team, opp, statKey, windowMode);
    const item = document.createElement('div'); item.style.cssText = 'font-size:12.5px;';
    const lbl = document.createElement('b'); lbl.textContent = label+': ';
    item.appendChild(lbl);
    item.appendChild(node || document.createTextNode('\u2014'));
    prodShareRow.appendChild(item);
  });
  container.appendChild(prodShareRow);
  buildShareByTierTable(container, playerName, team, opp, windowMode, heightTierData, highlightTier, 'production');
}

function buildHeightTierSection(container, playerName, team, pageWindowMode, titleEl){
  const heightData = computeHeightTierData(playerName, team);
  if(!heightData){
    const note = document.createElement('div'); note.style.cssText = 'color:var(--sub);font-size:12.5px;';
    note.textContent = 'Not enough games with identifiable opposing-position height data to break this out yet.';
    container.appendChild(note);
    return null;
  }
  if(titleEl) appendDefIcon(titleEl, `Proxy, not real defensive matchup data \u2014 this app has no play-by-play tracking of who actually guarded whom. "Shortest/Middle/Tallest" compares her production against opposing ${POSITION_LABEL[heightData.bucket]||heightData.bucket} groups (minutes-weighted average height of whichever of them played), grouped into thirds fixed from her full season so the tiers mean the same thing across every window below. Cutoffs: Shortest < ${heightData.p33.toFixed(1)}in, Middle ${heightData.p33.toFixed(1)}\u2013${heightData.p67.toFixed(1)}in (inclusive), Tallest > ${heightData.p67.toFixed(1)}in.`);

  // Driven entirely by the page-level Period selector at the top of the page now, not its own
  // separate toggle -- 'all' maps to null (heightTierStatsForWindow's convention for "full
  // season"), any number passes through unchanged.
  const activeSize = (pageWindowMode==='all' || pageWindowMode===undefined) ? null : pageWindowMode;
  let currentLines = null; // populated async below; re-renders once available
  let highlightTier = null; // set later via the returned .setHighlightTier(), once the async next-opponent lookup elsewhere on the page resolves
  const tableHolder = document.createElement('div');

  function renderTierTables(){
    tableHolder.innerHTML = '';
    const stats = heightTierStatsForWindow(heightData, activeSize);
    const STAT_LABELS = Object.assign({}, STAT_KEY_LABEL, {tpm:'3-Pointers Made', pra:'PRA'});
    const tiersToShow = [['shortest','Shortest'], ['middle','Middle'], ['tallest','Tallest']];
    const grid = document.createElement('div'); grid.style.cssText = 'display:flex;gap:16px;flex-wrap:wrap;';
    PROP_STAT_KEYS.forEach(statKey=>{
      const box = document.createElement('div'); box.style.cssText = 'flex:1;min-width:260px;';
      const title = document.createElement('div'); title.style.cssText = 'font-weight:700;font-size:12.5px;margin-bottom:4px;';
      let lineText;
      if(!currentLines) lineText = ' (O/U loading\u2026)';
      else if(currentLines.lines[statKey]===null || currentLines.lines[statKey]===undefined) lineText = ' (O/U \u2014)';
      else lineText = ` (O/U ${currentLines.lines[statKey]})`;
      title.textContent = STAT_LABELS[statKey] + lineText;
      box.appendChild(title);
      const table = document.createElement('table'); table.style.cssText = 'width:100%;border-collapse:collapse;font-size:12px;';
      table.innerHTML = '<thead><tr><th style="text-align:left;padding:4px;border-bottom:2px solid var(--line);">Tier</th><th style="padding:4px;border-bottom:2px solid var(--line);">N</th><th style="padding:4px;border-bottom:2px solid var(--line);">Avg</th><th style="padding:4px;border-bottom:2px solid var(--line);">StdDev</th><th style="padding:4px;border-bottom:2px solid var(--line);">Variance</th></tr></thead>';
      const tbody = document.createElement('tbody');
      tiersToShow.forEach(([tierKey,tierLabel])=>{
        const s = stats[tierKey][statKey];
        const tr = document.createElement('tr');
        tr.style.cssText = tierKey===highlightTier
          ? 'border-bottom:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--navy2);'
          : 'border-bottom:1px solid var(--line);';
        const tdTier = document.createElement('td'); tdTier.style.cssText = 'padding:4px;';
        const tierLink = document.createElement('a'); tierLink.href='javascript:void(0)'; tierLink.className='player-link'; tierLink.textContent = tierLabel;
        tierLink.addEventListener('click', ()=>renderHeightTierDetailPage(playerName, team, tierKey, activeSize, lastRender));
        tdTier.appendChild(tierLink);
        const tdN = document.createElement('td'); tdN.style.cssText = 'padding:4px;text-align:center;color:var(--sub);'; tdN.textContent = s.n;
        const tdAvg = document.createElement('td'); tdAvg.style.cssText = 'padding:4px;text-align:center;font-weight:700;'; tdAvg.textContent = s.avg!==null?s.avg:'\u2014';
        const tdStd = document.createElement('td'); tdStd.style.cssText = 'padding:4px;text-align:center;'; tdStd.textContent = s.stdDev!==null?s.stdDev:'\u2014';
        const tdVar = document.createElement('td'); tdVar.style.cssText = 'padding:4px;text-align:center;'; tdVar.textContent = s.variance!==null?s.variance:'\u2014';
        [tdTier, tdN, tdAvg, tdStd, tdVar].forEach(td=>tr.appendChild(td));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      box.appendChild(table);
      grid.appendChild(box);
    });
    tableHolder.appendChild(grid);
    if(highlightTier){
      if(!footnoteEl.dataset.built){
        footnoteEl.dataset.built = '1';
        footnoteEl.textContent = `The boxed row in each table above is her next opponent's group classification (Shortest/Middle/Tallest), based on the "Group (minutes-weighted)" line in Next Opponent \u2014 Same Position below.`;
      }
    }
  }

  const footnoteEl = document.createElement('div'); footnoteEl.className = 'footnote'; footnoteEl.style.marginTop = '8px';
  container.appendChild(tableHolder);
  container.appendChild(footnoteEl);
  renderTierTables();

  // Async: fetch her next-game lines and re-render once available, rather than blocking the
  // initial render on a network call.
  fetchHerNextGameLines(playerName, team).then(result=>{
    currentLines = result;
    renderTierTables();
  });

  // Exposed so the caller can apply the "next opponent's tier" outline once that separate async
  // lookup (elsewhere on the page) resolves -- re-runs renderTierTables so it takes effect even
  // if this fires after the initial render (which it always does, being async itself).
  heightData.setHighlightTier = (tier)=>{ highlightTier = tier; renderTierTables(); };
  return heightData;
}

const TIER_LABEL = {shortest:'Shortest', middle:'Middle', tallest:'Tallest'};
// Drill-down from one tier cell in buildHeightTierSection -- every game in that tier (within
// the same window that was active when it was clicked), one checkbox per game (checked by
// default), with Total/Min/Max/Average/Median/Mode recalculating live from only the checked
// rows -- same footer stat set this app already uses elsewhere (e.g. Opponent Totals by Game).
function renderHeightTierDetailPage(playerName, team, initialTier, initialWindowSize, returnTo, initialSeason){
  const activeSeason = initialSeason || CURRENT_SEASON;
  lastRender = () => renderHeightTierDetailPage(playerName, team, initialTier, initialWindowSize, returnTo, activeSeason);
  main.innerHTML = '';
  removeGameWindowStickyBar();

  const back = document.createElement('button'); back.className='backbtn'; back.textContent='\u2190 Back';
  back.addEventListener('click', ()=>navBack(()=>{ if(returnTo) returnTo(); else renderPlayerPage(playerName, team); }));
  main.appendChild(back);

  // Season selector -- lets you view this same breakdown for a prior year, or "All" for her
  // whole career combined, once historical seasons actually exist in DATA.historicalSeasons
  // (see getSeasonData/CURRENT_SEASON above computeHeightTierData). Re-renders the whole page
  // with the new season on change, same pattern as switching tiers/window elsewhere here.
  const seasonRow = document.createElement('div'); seasonRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:10px;';
  const seasonLbl = document.createElement('label'); seasonLbl.textContent = 'Season:'; seasonLbl.style.cssText = 'font-weight:700;color:var(--navy2);font-size:13px;';
  const seasonSelect = document.createElement('select');
  seasonSelect.style.cssText = 'padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:var(--sans);background:var(--panel);';
  availableSeasonsForDropdown().forEach(yr=>{
    const opt = document.createElement('option'); opt.value = yr; opt.textContent = yr===CURRENT_SEASON ? `${yr} (current)` : yr;
    if(yr===activeSeason) opt.selected = true;
    seasonSelect.appendChild(opt);
  });
  const allOpt = document.createElement('option'); allOpt.value = 'all'; allOpt.textContent = 'All (career)';
  if(activeSeason==='all') allOpt.selected = true;
  seasonSelect.appendChild(allOpt);
  seasonSelect.addEventListener('change', ()=>{
    renderHeightTierDetailPage(playerName, team, initialTier, initialWindowSize, returnTo, seasonSelect.value);
  });
  seasonRow.appendChild(seasonLbl); seasonRow.appendChild(seasonSelect);
  main.appendChild(seasonRow);

  const heightData = computeHeightTierData(playerName, team, activeSeason);
  if(heightData && heightData.noData){
    const head = document.createElement('div'); head.className='pagehead';
    head.innerHTML = `<h2>${playerName}</h2><div class="meta">${activeSeason} isn\u2019t loaded into this app yet \u2014 only ${CURRENT_SEASON} is available right now. Historical seasons will show up here automatically once they\u2019re added.</div>`;
    appendPlayerTeamByline(head, team, {block:true});
    main.appendChild(head);
    return;
  }
  if(!heightData){
    const head = document.createElement('div'); head.className='pagehead';
    head.innerHTML = `<h2>${playerName}</h2><div class="meta">Not enough games with identifiable opposing-position height data to break this out${activeSeason==='all'?' across her career so far':(activeSeason!==CURRENT_SEASON?' for '+activeSeason:'')}.</div>`;
    appendPlayerTeamByline(head, team, {block:true});
    main.appendChild(head);
    return;
  }

  // Stamps teamRec/oppRec onto the tier rows for the two record columns below. Idempotent, so
  // it's safe against the memoised heightData the Specials tab shares.
  attachGameRecords(heightData.allGames, team);

  let activeTier = initialTier;
  let activeSize = initialWindowSize;
  const head = document.createElement('div'); head.className='pagehead';
  main.appendChild(head);

  const windowRow = document.createElement('div'); windowRow.style.cssText = 'display:flex;gap:4px;margin:10px 0 6px;width:100%;';
  const tierRow = document.createElement('div'); tierRow.style.cssText = 'display:flex;gap:4px;margin:0 0 14px;width:100%;';
  const windowOptions = [{label:'L5', size:5}, {label:'L10', size:10}, {label:'L15', size:15}, {label:'Full', size:null}];
  const tierOptions = [{label:'Shortest', key:'shortest'}, {label:'Middle', key:'middle'}, {label:'Tallest', key:'tallest'}];

  const tableHolder = document.createElement('div');
  main.appendChild(tableHolder);

  // Sort state for the games table -- defaults to date, most-recent-first, same as before this
  // was made sortable. Persists across re-sorts (not reset by clicking a column), but resets
  // whenever the active tier or window changes, since that's effectively a different table.
  let sortKey = 'date', sortDir = 'desc';
  // Her next game's O/U lines, shown as a row under the header and used to colour the stat
  // cells. Populated by an async lookup below; null until it lands (and stays null if there
  // are no lines posted yet), which the row renders as "loading..." / "none posted".
  let currentLines = null, linesLoaded = false;
  // Which games have been unchecked (excluded from the footer totals), keyed by date since a
  // player only plays one game per day -- tracked outside renderTable so re-sorting doesn't
  // silently re-check everything. Reset (see windowOptions/tierOptions handlers below) when the
  // tier or window changes, since that's a different set of games entirely.
  let uncheckedDates = new Set();

  // Leading context columns (not player stats -- excluded from the summary footer, which spans
  // them with a single label cell) followed by her full box score line. Everything below is
  // generated from these two lists, so adding a stat is a one-line change here rather than an
  // edit in four places (header, body cell, footer cell, footer maths) that can drift apart.
  const LEAD_COLS = [
    {key:null, label:''},
    {key:'date', label:'Date', left:true, type:'string'},
    {key:'opp', label:'Opponent', left:true, type:'string'},
    // Keyed on the sort field, not the display field: this table has its own comparator, and
    // type:'number' on the win pct is what makes "10-5" sort above "9-6" here the same way
    // makeTable's col.sortBy does in the gamelog tables. Same trick for W/L, which sorts by margin.
    {key:'wlSort', label:'W/L', left:true, type:'number', fmt: (v, g)=> (g && g.wl) || '—', tone: wlTone},
    {key:'oppRecSort', label:'Opp Rec', left:true, type:'number', fmt: (v, g)=> (g && g.oppRec) || '—'},
    {key:'teamRecSort', label:'Team Rec', left:true, type:'number', fmt: (v, g)=> (g && g.teamRec) || '—'},
    {key:'oppHeight', label:'Opp Height', type:'number', fmt: v=>inchesToHeightStr(v) || '—'},
    {key:'homeAway', label:'H/A', left:true, type:'string'},
    {key:'starter', label:'Start', type:'number', fmt: v=>v?'Y':'N'},
  ];
  const STAT_COLS = [
    {key:'min', label:'MIN'}, {key:'pts', label:'PTS'},
    {key:'fgm', label:'FGM'}, {key:'fga', label:'FGA'}, {key:'fgPct', label:'FG%', pct:true, madeAtt:['fgm','fga']},
    {key:'tpm', label:'3PM'}, {key:'tpa', label:'3PA'}, {key:'tpPct', label:'3P%', pct:true, madeAtt:['tpm','tpa']},
    {key:'ftm', label:'FTM'}, {key:'fta', label:'FTA'}, {key:'ftPct', label:'FT%', pct:true, madeAtt:['ftm','fta']},
    {key:'oreb', label:'OREB'}, {key:'dreb', label:'DREB'}, {key:'reb', label:'REB'},
    {key:'ast', label:'AST'}, {key:'stl', label:'STL'}, {key:'blk', label:'BLK'},
    {key:'to', label:'TO'}, {key:'pf', label:'PF'}, {key:'plusMinus', label:'+/-'},
    {key:'pra', label:'PRA'}, {key:'pr', label:'P+R'}, {key:'pa', label:'P+A'}, {key:'ra', label:'R+A'},
  ].map(c=>Object.assign({type:'number'}, c));
  const SORT_COLS = LEAD_COLS.concat(STAT_COLS);

  function renderTable(){
    head.innerHTML = `<h2>${playerName} \u2014 vs. ${TIER_LABEL[activeTier]} Opposing ${POSITION_LABEL[heightData.bucket]||heightData.bucket} <span id="tierDetailInfoIcon"></span></h2>`;
    appendPlayerTeamByline(head, team, {block:true, season: activeSeason==='all' ? undefined : activeSeason});
    appendDefIcon(head.querySelector('#tierDetailInfoIcon'), `Cutoffs (full season, fixed): Shortest &lt; ${heightData.p33.toFixed(1)}in, Middle ${heightData.p33.toFixed(1)}\u2013${heightData.p67.toFixed(1)}in (inclusive), Tallest &gt; ${heightData.p67.toFixed(1)}in. Uncheck a game to exclude it from the totals below. Click a column header to sort.`);
    tableHolder.innerHTML = '';

    const windowed = activeSize ? heightData.allGames.slice(-activeSize) : heightData.allGames;
    const games = windowed.filter(g=>g.tier===activeTier).slice();
    games.sort((a,b)=>{
      const col = SORT_COLS.find(c=>c.key===sortKey);
      let av = a[sortKey], bv = b[sortKey];
      let d;
      if(col && col.type==='string'){ d = String(av||'').localeCompare(String(bv||'')); }
      else { d = (av===null||av===undefined?-Infinity:av) - (bv===null||bv===undefined?-Infinity:bv); }
      return sortDir==='asc' ? d : -d;
    });

    if(!games.length){
      const none = document.createElement('div'); none.style.cssText='color:var(--sub);font-size:13px;';
      none.textContent = 'No games in this tier for the selected window.';
      tableHolder.appendChild(none);
      return;
    }

    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table'); table.style.width='100%';
    const thead = document.createElement('thead');
    const theadRow = document.createElement('tr');
    SORT_COLS.forEach(col=>{
      const th = document.createElement('th');
      if(col.key===null){ theadRow.appendChild(th); return; }
      if(col.left) th.classList.add('left');
      th.style.cursor = 'pointer';
      const isActive = sortKey===col.key;
      th.textContent = col.label + (isActive ? (sortDir==='asc' ? ' \u25b2' : ' \u25bc') : '');
      th.addEventListener('click', ()=>{
        if(sortKey===col.key){ sortDir = sortDir==='asc' ? 'desc' : 'asc'; }
        else { sortKey = col.key; sortDir = 'desc'; } // new column: start most-to-least (or Z-to-A for text)
        renderTable();
      });
      theadRow.appendChild(th);
    });
    thead.appendChild(theadRow);
    const tbody = document.createElement('tbody');
    const checkboxes = [];

    // ---- Today's betting lines, pinned directly under the header ----
    // Lives in the tbody as its own first row and is re-emitted on every render, so it stays
    // put no matter which column the table is sorted by. It carries a colSpan'd label like the
    // summary rows do, which also keeps it out of the alignment/sticky passes' 1:1 cell mapping.
    const lineFor = key => (currentLines && currentLines.lines
      && currentLines.lines[key] !== null && currentLines.lines[key] !== undefined)
      ? currentLines.lines[key] : null;
    const linesTr = document.createElement('tr');
    linesTr.style.cssText = 'background:#fff8e6;font-weight:700;';
    const tdLineLabel = document.createElement('td');
    tdLineLabel.colSpan = LEAD_COLS.length; tdLineLabel.className = 'left';
    tdLineLabel.style.cssText = 'padding:6px 8px;font-size:11.5px;';
    if(!linesLoaded){
      tdLineLabel.textContent = 'Today’s line — loading…';
    } else if(!currentLines || !Object.values(currentLines.lines || {}).some(v=>v!==null && v!==undefined)){
      // Covers both "the lookup came back empty" and "it found her game but no lines posted yet".
      tdLineLabel.textContent = 'Today’s line — none posted';
    } else {
      const oppFull = FULL_TEAM_NAME[currentLines.opponent] || currentLines.opponent || '';
      // Lines can now come from different books (DK doesn't post PRA for everyone), so say which.
      // lineBooks is absent on entries cached before this existed -- fall back to no attribution.
      const booksUsed = [...new Set(Object.values(currentLines.lineBooks || {}))].filter(Boolean);
      const bookNote = booksUsed.length ? ' \u2014 ' + booksUsed.map(k=>BOOK_LABELS[k]||k).join(', ') : '';
      tdLineLabel.textContent = `Today’s line vs ${oppFull}${currentLines.date ? ' (' + currentLines.date + ')' : ''}${bookNote}`;
    }
    linesTr.appendChild(tdLineLabel);
    STAT_COLS.forEach(col=>{
      const td = document.createElement('td');
      td.style.cssText = 'text-align:center;padding:6px 8px;';
      const ln = lineFor(col.key);
      td.textContent = ln === null ? '—' : String(ln);
      if(ln === null) td.style.color = 'var(--sub)';
      linesTr.appendChild(td);
    });
    tbody.appendChild(linesTr);

    games.forEach(g=>{
      const tr = document.createElement('tr'); tr.style.cursor='pointer';
      const tdCb = document.createElement('td');
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = !uncheckedDates.has(g.date);
      cb.addEventListener('click', e=>e.stopPropagation());
      cb.addEventListener('change', ()=>{
        if(cb.checked) uncheckedDates.delete(g.date); else uncheckedDates.add(g.date);
        updateFooter();
      });
      checkboxes.push({cb, game:g});
      tdCb.appendChild(cb);
      tr.appendChild(tdCb);
      SORT_COLS.slice(1).forEach(col=>{   // slice(1): the checkbox cell is built above
        const td = document.createElement('td');
        if(col.left) td.classList.add('left'); else td.style.textAlign = 'center';
        const v = g[col.key];
        if(col.key === 'date' && g.gameId){
          const dateLink = document.createElement('a');
          dateLink.href = 'javascript:void(0)'; dateLink.className = 'player-link'; dateLink.textContent = g.date;
          // The whole row already navigates to the box score; the link exists so the date LOOKS
          // clickable (matching every other table in the app) -- stopPropagation keeps the two
          // from firing a double navigation.
          dateLink.addEventListener('click', e=>{ e.stopPropagation(); goToGameBox(g.gameId, lastRender); });
          td.appendChild(dateLink);
        } else if(col.key === 'opp' && g.opp){
          td.appendChild(teamLinkEl(g.opp, FULL_TEAM_NAME[g.opp] || g.opp, g.date ? g.date.slice(0,4) : undefined));
        } else if(col.fmt){
          td.textContent = col.fmt(v, g);
        } else if(col.pct){
          td.textContent = (v===null || v===undefined) ? '\u2014' : (v*100).toFixed(1)+'%';
        } else {
          td.textContent = (v===null || v===undefined) ? '\u2014' : v;
        }
        if(col.tone){
          const tone = col.tone(g);
          if(tone){ td.style.color = 'var(--' + tone + ')'; td.style.fontWeight = '700'; }
        }
        // Green when she cleared today's line for this stat that night, red when she didn't.
        // Only the five stats a line actually exists for (PTS/REB/AST/3PM/PRA) are ever tinted;
        // everything else is left alone rather than coloured against nothing.
        const ln = lineFor(col.key);
        if(ln !== null && typeof v === 'number'){
          if(v > ln){ td.style.background = 'var(--greenbg)'; td.style.color = 'var(--green)'; td.style.fontWeight = '700'; }
          else if(v < ln){ td.style.background = 'var(--redbg)'; td.style.color = 'var(--red)'; td.style.fontWeight = '700'; }
        }
        tr.appendChild(td);
      });
      if(g.gameId){ tr.addEventListener('click', ()=>goToGameBox(g.gameId, lastRender)); }
      tbody.appendChild(tr);
    });
    table.appendChild(thead); table.appendChild(tbody);
    wrap.appendChild(table);
    tableHolder.appendChild(wrap);

    const footerLabels = [
      {label:'TOTAL', fn: arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)*100)/100 : null},
      {label:'MIN', fn: arr => arr.length ? Math.min(...arr) : null},
      {label:'MAX', fn: arr => arr.length ? Math.max(...arr) : null},
      {label:'AVERAGE', fn: arr => arr.length ? Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*100)/100 : null},
      {label:'MEDIAN', fn: median},
      {label:'MODE', fn: mode},
    ];
    const footerRowEls = {};
    footerLabels.forEach(fl=>{
      const tr = document.createElement('tr'); tr.style.cssText='background:#eef2fb;font-weight:700;';
      const tdLabel = document.createElement('td');
      tdLabel.colSpan = LEAD_COLS.length; // spans checkbox + date + opponent + opp height + H/A + Start
      tdLabel.className='left'; tdLabel.style.padding='6px 8px'; tdLabel.textContent = fl.label;
      tr.appendChild(tdLabel);
      STAT_COLS.forEach(()=>{ const td=document.createElement('td'); td.style.textAlign='center'; td.style.padding='6px 8px'; tr.appendChild(td); });
      tbody.appendChild(tr);
      footerRowEls[fl.label] = { cells: [...tr.querySelectorAll('td')].slice(1) };
    });

    function updateFooter(){
      const checkedGames = checkboxes.filter(c=>c.cb.checked).map(c=>c.game);
      footerLabels.forEach(fl=>{
        const {cells} = footerRowEls[fl.label];
        STAT_COLS.forEach((col, i)=>{
          // Shooting percentages can't be summed, and averaging per-game percentages weights a
          // 1-for-2 night the same as a 9-for-18 one. TOTAL is left blank for them, and AVERAGE
          // is recomputed from the combined makes/attempts of exactly the games still checked --
          // which is the whole point of the checkboxes.
          if(col.pct){
            if(fl.label === 'TOTAL'){ cells[i].textContent = '\u2014'; return; }
            if(fl.label === 'AVERAGE'){
              const [madeKey, attKey] = col.madeAtt;
              const made = checkedGames.reduce((a,g)=>a+(g[madeKey]||0), 0);
              const att  = checkedGames.reduce((a,g)=>a+(g[attKey]||0), 0);
              cells[i].textContent = att ? (made/att*100).toFixed(1)+'%' : '\u2014';
              return;
            }
            // MIN/MAX/MEDIAN/MODE over the per-game percentages, which are meaningful as-is.
            const pvals = checkedGames.map(g=>g[col.key]).filter(v=>typeof v === 'number' && !Number.isNaN(v));
            const pr = fl.fn(pvals);
            cells[i].textContent = (pr===null || pr===undefined) ? '\u2014' : (pr*100).toFixed(1)+'%';
            return;
          }
          // Nulls filtered out rather than passed through -- a single missing value (an older
          // game with no plus/minus, say) would otherwise turn TOTAL and MIN/MAX into NaN.
          const vals = checkedGames.map(g=>g[col.key]).filter(v=>typeof v === 'number' && !Number.isNaN(v));
          const result = fl.fn(vals);
          cells[i].textContent = (result===null || result===undefined) ? '\u2014' : Number(result).toFixed(1);
        });
      });
    }
    updateFooter();
  }

  windowOptions.forEach(opt=>{
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    const isActive = ()=> opt.size===activeSize;
    btn.style.cssText = 'flex:1 1 0;min-width:0;padding:8px 2px;border-radius:5px;border:1px solid var(--line);font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;';
    function paint(){ btn.style.background = isActive()?'var(--navy2)':'var(--panel)'; btn.style.color = isActive()?'#fff':'var(--ink)'; }
    paint();
    btn.addEventListener('click', ()=>{ activeSize = opt.size; uncheckedDates = new Set(); [...windowRow.children].forEach(b=>b._paint&&b._paint()); renderTable(); });
    btn._paint = paint;
    windowRow.appendChild(btn);
  });
  tierOptions.forEach(opt=>{
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    const isActive = ()=> opt.key===activeTier;
    btn.style.cssText = 'flex:1 1 0;min-width:0;padding:8px 2px;border-radius:5px;border:1px solid var(--line);font-size:12px;cursor:pointer;font-family:var(--sans);white-space:nowrap;';
    function paint(){ btn.style.background = isActive()?'var(--navy2)':'var(--panel)'; btn.style.color = isActive()?'#fff':'var(--ink)'; }
    paint();
    btn.addEventListener('click', ()=>{ activeTier = opt.key; uncheckedDates = new Set(); [...tierRow.children].forEach(b=>b._paint&&b._paint()); renderTable(); });
    btn._paint = paint;
    tierRow.appendChild(btn);
  });
  main.insertBefore(tierRow, tableHolder);
  main.insertBefore(windowRow, tierRow);

  renderTable();

  // Async: her next game's O/U lines. Re-renders once they land rather than blocking the
  // initial paint -- same pattern buildHeightTierSection already uses for the same data.
  fetchHerNextGameLines(playerName, team).then(result=>{
    currentLines = result;
    linesLoaded = true;   // set even when result is null, so the row stops saying "loading"
    renderTable();
  });
}


function computeTeammateOutImpact(playerName, team){
  const rec = DATA.fullPlayerLogs[playerName+'|'+team];
  if(!rec) return [];
  const ownGames = rec.log.filter(g=>!g.dnp);
  if(ownGames.length < 4) return []; // too small a sample to split meaningfully at all

  const outTeammates = teamInjuries(team).filter(inj => injuryStatusSeverity(inj.status)==='out' && inj.player !== playerName);
  const results = [];
  outTeammates.forEach(inj=>{
    const tmRec = DATA.fullPlayerLogs[inj.player+'|'+team];
    if(!tmRec) return; // no log data for the teammate on file -- can't compute a split
    const playedDates = new Set(tmRec.log.filter(g=>!g.dnp).map(g=>g.date));
    const gamesWith = ownGames.filter(g=>playedDates.has(g.date));
    const gamesWithout = ownGames.filter(g=>!playedDates.has(g.date));
    if(gamesWithout.length < 2){
      results.push({teammate: inj.player, status: inj.status, insufficientSample:true, gamesWith: gamesWith.length, gamesWithout: gamesWithout.length});
      return;
    }
    function avgStat(games, statKey){
      const vals = games.map(g => statValue(g, statKey) || 0);
      return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    }
    // 3PM sits with the other individual stats, ahead of the PRA combination -- same order as
    // STAT_KEY_LABEL and the Specials market labels use everywhere else.
    const stats = PROP_STAT_KEYS.map(statKey=>{
      const withAvg = avgStat(gamesWith, statKey);
      const withoutAvg = avgStat(gamesWithout, statKey);
      return { statKey, withAvg, withoutAvg, delta: (withAvg!==null && withoutAvg!==null) ? withoutAvg-withAvg : null };
    });
    results.push({teammate: inj.player, status: inj.status, gamesWith: gamesWith.length, gamesWithout: gamesWithout.length, stats, insufficientSample:false});
  });
  return results;
}
function formatTeammateOutDelta(statKey, delta){
  if(delta===null || delta===undefined) return '\u2014';
  const rounded = Math.round(delta*10)/10;
  const sign = rounded>=0 ? '+' : '';
  if(Math.abs(rounded) < TEAMMATE_OUT_INSIGNIFICANT_THRESHOLD[statKey]) return `Insignificant (${sign}${rounded})`;
  return `${sign}${rounded}`;
}

// Distinct from injuryStatusSeverity (used elsewhere for general color-coding of any status) --
// this specifically identifies the two statuses that should make the injury indicator show up
// at all: officially ruled OUT for the game, or day-to-day. A merely "probable"/"questionable"
// note doesn't surface the indicator, per how this is meant to be used (a heads-up worth
// interrupting a bet decision for, not every minor note).
function noteworthyInjuryStatus(status){
  if(!status) return null;
  const s = String(status).toLowerCase();
  if(s.includes('out') || s.includes('injured reserve') || s.includes('suspension')) return 'out';
  if(s.includes('day-to-day') || s.includes('day to day')) return 'dayToDay';
  return null;
}

// ================= Season prop-line trend charts (player + team pages) =================
// Reuses the same ODDS_HISTORY snapshot archive that already powers the per-bet "Line
// History" page. A snapshot is only ever saved pre-tipoff (see the Worker's saveSnapshots),
// so for each game we just take whichever saved snapshot is closest to that game's tip-off
// and read the line off it \u2014 that's "the pregame line" for that game.
//
// Coverage caveat (real, not hypothetical): a snapshot only exists for a game/market if the
// app was actually browsed to a page that fetched that market before that game tipped off.
// There's no background job forcing a fetch for every upcoming game \u2014 it happens as a
// byproduct of normal use. So the chart below will have gaps for games nobody happened to
// check via the Odds page before they started, and will fill in more completely for whoever
// (or whatever automation) is opening the app regularly.
const LINE_TREND_MARKETS = [
  {mkey:'player_points', statKey:'pts', label:'Points', color:'#1c4b82'},
  {mkey:'player_rebounds', statKey:'reb', label:'Rebounds', color:'#1f9d55'},
  {mkey:'player_assists', statKey:'ast', label:'Assists', color:'#b3261e'},
  {mkey:'player_threes', statKey:'tpm', label:'Threes', color:'#a5760a'},
  {mkey:'player_points_rebounds_assists', statKey:'pra', label:'Pts+Reb+Ast', color:'#6a3fa0'},
  {mkey:'player_points_rebounds', statKey:'pr', label:'Pts+Reb', color:'#0f7b7b'},
  {mkey:'player_points_assists', statKey:'pa', label:'Pts+Ast', color:'#a1367a'},
  {mkey:'player_rebounds_assists', statKey:'ra', label:'Reb+Ast', color:'#7a5230'},
];

let _oddsHistoryCache = null;
// Pages through /history/export (see the Worker \u2014 it caps each response at ~40 records
// to stay under the Workers free-plan 50-subrequest-per-invocation limit), accumulating
// every record across as many calls as it takes. Cached after the first full fetch so
// switching between player/team pages in one session doesn't re-download it repeatedly.
// onProgress(recordsSoFar), if given, is called after each page so callers can show a
// live count instead of a static "Loading\u2026" that looks frozen on a large archive.
async function fetchOddsHistoryCached(onProgress){
  if(_oddsHistoryCache) return _oddsHistoryCache;
  const workerBase = (await loadSavedUrl()) || DEFAULT_WORKER_URL;
  let all = [];
  let cursor = null;
  let guard = 0; // hard stop so a Worker bug can't spin this forever
  while(guard++ < 200){
    const url = cursor ? `${workerBase}/history/export?cursor=${encodeURIComponent(cursor)}` : `${workerBase}/history/export`;
    const page = await fetchJson(url);
    if(page && page.error) throw new Error(page.error);
    all = all.concat(page.records || []);
    if(onProgress) onProgress(all.length);
    if(page.done || !page.cursor) break;
    cursor = page.cursor;
  }
  all.sort((a,b)=> (a.fetchedAt||'').localeCompare(b.fetchedAt||''));
  _oddsHistoryCache = all;
  return _oddsHistoryCache;
}

// Builds {pts:[{date,value}], reb:[...], ast:[...], tpm:[...], pra:[...]} for one player,
// one point per game (the DraftKings line at her last pre-tipoff snapshot for that game).
function buildPlayerLineSeries(playerName, team, history){
  const fullName = FULL_TEAM_NAME[team];
  const relevant = (history||[]).filter(snap => snap.homeTeam===fullName || snap.awayTeam===fullName);

  const latestByEvent = {};
  relevant.forEach(snap=>{
    const existing = latestByEvent[snap.eventId];
    if(!existing || snap.fetchedAt > existing.fetchedAt) latestByEvent[snap.eventId] = snap;
  });

  const series = {};
  LINE_TREND_MARKETS.forEach(m=>{ series[m.statKey] = []; });

  Object.values(latestByEvent).forEach(snap=>{
    const dk = (snap.data.bookmakers||[]).find(b=>b.key==='draftkings');
    if(!dk) return;
    const date = (snap.commenceTime||'').slice(0,10);
    if(!date) return;
    LINE_TREND_MARKETS.forEach(m=>{
      const market = (dk.markets||[]).find(mk=>mk.key===m.mkey);
      if(!market) return;
      const outcome = (market.outcomes||[]).find(o=>o.description===playerName);
      if(!outcome || outcome.point===undefined || outcome.point===null) return;
      series[m.statKey].push({date, value: outcome.point});
    });
  });

  LINE_TREND_MARKETS.forEach(m=>{ series[m.statKey].sort((a,b)=>a.date.localeCompare(b.date)); });
  return series;
}

// Renders a toggleable multi-series line chart into `container` for the given series map
// (see buildPlayerLineSeries). Stats with zero data points are omitted from the legend
// entirely rather than shown as an empty/misleading toggle.
function renderLineTrendChart(container, series){
  container.innerHTML = '';
  const activeMarkets = LINE_TREND_MARKETS.filter(m => (series[m.statKey]||[]).length > 0);
  if(activeMarkets.length===0){
    const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
    na.textContent = 'No tracked prop-line history yet for this player \u2014 lines are captured automatically as the Live Lines page is browsed before each game tips off, so this fills in on its own as the season goes on.';
    container.appendChild(na);
    return;
  }

  const checkboxState = {};
  activeMarkets.forEach(m=>{ checkboxState[m.statKey] = true; });

  const legend = document.createElement('div'); legend.style.cssText='display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;';
  const svgHolder = document.createElement('div');

  function buildSvg(){
    const W = 700, H = 280, padL = 40, padR = 16, padT = 16, padB = 28;
    const visibleMarkets = activeMarkets.filter(m=>checkboxState[m.statKey]);
    if(visibleMarkets.length===0) return '<div style="color:var(--sub);font-size:12px;padding:12px 0;">No stats selected.</div>';

    const allDates = Array.from(new Set(visibleMarkets.flatMap(m=>series[m.statKey].map(p=>p.date)))).sort();
    const allValues = visibleMarkets.flatMap(m=>series[m.statKey].map(p=>p.value));
    const minV = Math.min(...allValues), maxV = Math.max(...allValues);
    const vRange = (maxV - minV) || 1;
    const yFor = v => padT + (H-padT-padB) * (1 - (v-minV)/vRange);
    const xFor = d => {
      const idx = allDates.indexOf(d);
      return padL + (allDates.length<=1 ? (W-padL-padR)/2 : (W-padL-padR) * idx/(allDates.length-1));
    };

    let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:inherit;">`;
    for(let i=0;i<=4;i++){
      const v = minV + (vRange*i/4);
      const y = yFor(v);
      svg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`;
      svg += `<text x="${padL-6}" y="${(y+4).toFixed(1)}" font-size="10" text-anchor="end" fill="#5b6472">${Math.round(v*10)/10}</text>`;
    }
    const labelStep = Math.max(1, Math.ceil(allDates.length/6));
    allDates.forEach((d,i)=>{
      if(i%labelStep!==0 && i!==allDates.length-1) return;
      const x = xFor(d);
      svg += `<text x="${x.toFixed(1)}" y="${H-padB+16}" font-size="9" text-anchor="middle" fill="#5b6472">${d.slice(5)}</text>`;
    });

    visibleMarkets.forEach(m=>{
      const pts = series[m.statKey];
      if(pts.length===0) return;
      const path = pts.map((p,i)=> `${i===0?'M':'L'} ${xFor(p.date).toFixed(1)} ${yFor(p.value).toFixed(1)}`).join(' ');
      svg += `<path d="${path}" fill="none" stroke="${m.color}" stroke-width="2"/>`;
      pts.forEach(p=>{
        svg += `<circle cx="${xFor(p.date).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="3" fill="${m.color}"><title>${p.date}: ${p.value}</title></circle>`;
      });
    });
    svg += '</svg>';
    return svg;
  }
  function draw(){ svgHolder.innerHTML = buildSvg(); }

  activeMarkets.forEach(m=>{
    const lbl = document.createElement('label'); lbl.style.cssText=`display:flex;align-items:center;gap:5px;font-size:12px;color:${m.color};font-weight:700;cursor:pointer;`;
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    cb.addEventListener('change', ()=>{ checkboxState[m.statKey]=cb.checked; draw(); });
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(`${m.label} (${series[m.statKey].length})`));
    legend.appendChild(lbl);
  });

  container.appendChild(legend);
  container.appendChild(svgHolder);
  draw();
}

// 'pra' isn't a stored field on a game-log entry — it's derived on the fly from pts+reb+ast.
function statValue(g, statKey){
  if(COMBO_STAT_PARTS[statKey]) return comboFrom(g, statKey);
  return g[statKey];
}

// windowSize: 'all' | 15 | 10 | 5 — how many of the most recent games to look at
function windowSlice(arr, windowSize){
  if(windowSize==='all' || !windowSize) return arr;
  return arr.slice(Math.max(0, arr.length - windowSize));
}
// Team gameIds (from filterGameIdsByYearMonth) run most-recent-first (descending), unlike
// a player's game log which runs oldest-first \u2014 so "last N games" here means the first N
// entries, not the tail windowSlice takes for ascending-ordered arrays.
function windowSliceRecentFirst(arr, windowSize){
  if(windowSize==='all' || !windowSize) return arr;
  return arr.slice(0, windowSize);
}

function hitRateFor(playerName, team, statKey, line, windowSize){
  // line is the sportsbook point (e.g. 12.5). "Over" hits when actual >= ceil(line) for a .5 line.
  const threshold = Number.isInteger(line) ? line+1 : Math.ceil(line);
  const key = `${playerName}|${team}`;
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  const played = windowSlice(pl.log, windowSize).filter(g=>!g.dnp);
  const gp = played.length;
  if(gp===0) return {gp:0, hits:0, rate:0, found:true};
  const hits = played.filter(g=>{ const v=statValue(g,statKey); return v!==null && v>=threshold; }).length;
  return {gp, hits, rate: hits/gp, found:true};
}

// For DraftKings "milestone" alt lines (displayed as "20+", "22+", etc.) — unlike a standard
// Over/Under line, the point value here already IS the literal minimum to hit, so no ceil/+1
// adjustment is applied (that adjustment is specifically for .5-style Over/Under lines).
function altHitRateFor(playerName, team, statKey, threshold, windowSize){
  const key = `${playerName}|${team}`;
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  const played = windowSlice(pl.log, windowSize).filter(g=>!g.dnp);
  const gp = played.length;
  if(gp===0) return {gp:0, hits:0, rate:0, found:true};
  const hits = played.filter(g=>{ const v=statValue(g,statKey); return v!==null && v>=threshold; }).length;
  return {gp, hits, rate: hits/gp, found:true};
}

// Derives a windowed view ('all' | 15 | 10 | 5) from the full-season log on the fly.
function windowedPlayerLog(key, windowSize){
  const pl = DATA.fullPlayerLogs[key];
  if(!pl) return null;
  return { player: pl.player, team: pl.team, athleteId: pl.athleteId, log: windowSlice(pl.log, windowSize) };
}

function findPlayerTeam(playerName, teamA, teamB){
  if(DATA.fullPlayerLogs[`${playerName}|${teamA}`]) return teamA;
  if(DATA.fullPlayerLogs[`${playerName}|${teamB}`]) return teamB;
  return null;
}

// ---- Team-level hit-rate calculators, based on each team's own full-season game log (final scores only), windowed ----
function teamGameLog(team, windowSize){
  const log = DATA.fullTeamGames[team] || [];
  return windowSlice(log, windowSize);
}
// Season record always included; windowed record (matching whatever L5/L10/L15/Full Season is
// currently selected) appended alongside it, unless Full Season is selected -- in which case
// it'd just duplicate the season record already shown. Used anywhere a team name appears on
// the Live Lines page so every matchup shows both records next to each team.
function teamRecordParenText(team, windowSize){
  const seasonRec = DATA.teamRecords[team] && DATA.teamRecords[team].overall;
  if(!seasonRec) return '';
  let text = `${seasonRec.w}-${seasonRec.l}`;
  if(windowSize !== 'all'){
    const log = teamGameLog(team, windowSize);
    const w = log.filter(g=>g.teamPts>g.oppPts).length;
    const l = log.filter(g=>g.teamPts<g.oppPts).length;
    text += `, ${w}-${l} L${windowSize}`;
  }
  return ` (${text})`;
}
function teamMoneylineHitRate(team, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  const hits = log.filter(g=>g.teamPts>g.oppPts).length;
  return {gp, hits, rate: gp?hits/gp:0, found:true};
}
function teamSpreadHitRate(team, point, windowSize){
  const log = teamGameLog(team, windowSize); const gp = log.length;
  if(point===undefined||point===null) return {gp, hits:0, rate:0, found:false};
  const hits = log.filter(g=>((g.teamPts-g.oppPts)+point) > 0).length;

// ---- Half-aware versions, using h1Team/h1Opp/h2Team/h2Opp fields derived from play-by-play.
// Games where that data wasn't available (rare — e.g. a missing/incomplete pbp log) are simply
// excluded from the denominator rather than treated as a miss. ----
function teamGameLogHalf(team, windowSize, half){
  const log = teamGameLog(team, windowSize);
  const teamKey = half===1 ? 'h1TeamPts' : 'h2TeamPts';
  const oppKey = half===1 ? 'h1OppPts' : 'h2OppPts';
  return log.filter(g=>g[teamKey]!==null && g[teamKey]!==undefined && g[oppKey]!==null && g[oppKey]!==undefined)
            .map(g=>({teamPts:g[teamKey], oppPts:g[oppKey]}));
}
function teamMoneylineHitRateHalf(team, half, windowSize){
  const log = teamGameLogHalf(team, windowSize, half); const gp = log.length;
  const hits = log.filter(g=>g.teamPts>g.oppPts).length;
  return {gp, hits, rate: gp?hits/gp:0, found: gp>0};
}
function teamSpreadHitRateHalf(team, half, point, windowSize){

function americanToDecimal(price){
  if(price===undefined||price===null) return null;
  return price>0 ? 1+price/100 : 1+100/Math.abs(price);
}
function decimalToAmerican(dec){
  if(dec===null||dec===undefined||dec<=1) return null;
  if(dec>=2) return Math.round((dec-1)*100);
  return Math.round(-100/(dec-1));
}
// Top Bets ranking cutoff: a game stays eligible from before tipoff through this many real-
// world minutes after its scheduled commence_time, then drops out. This app has no live
// in-game clock feed (only final box scores, refreshed every ~10 min after games end), so
// this is a wall-clock approximation of "the first 5 minutes" \u2014 not the actual game clock.
// Worth knowing: a WNBA quarter is 10 minutes of game clock but commonly takes 25-30+ real
// minutes to play out once fouls/timeouts/reviews are included, so this grace window ends
// well before 5:00 actually shows on the in-arena clock \u2014 it's deliberately conservative.
const TOP_BETS_GRACE_MS = 5 * 60 * 1000;
function withinTopBetsWindow(commenceTime, now){
  const elapsedMs = now - new Date(commenceTime);
  return elapsedMs <= TOP_BETS_GRACE_MS; // true if not yet started, or started within the last 5 min
}

function fmtAmerican(price){
  if(price===null||price===undefined) return '\u2014';
  return (price>0?'+':'')+price;
}

    group.appendChild(lbl);
    const inputStyle = 'padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-size:12px;font-family:var(--sans);';
    if(col.type==='text'){
      const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Search\u2026';
      inp.style.cssText = inputStyle + 'width:120px;';
      inp.addEventListener('input', ()=>{ filterState[col.key] = inp.value.trim(); render(); });
      group.appendChild(inp);
    } else if(col.type==='select'){
      const sel = document.createElement('select');
      sel.style.cssText = inputStyle;
      const optAll = document.createElement('option'); optAll.value=''; optAll.textContent='All'; sel.appendChild(optAll);
      (col.options||[]).forEach(o=>{ const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
      sel.addEventListener('change', ()=>{ filterState[col.key] = sel.value; render(); });
      group.appendChild(sel);
    } else if(col.type==='numRange'){
      const rangeRow = document.createElement('div'); rangeRow.style.cssText='display:flex;gap:4px;';
      const minI = document.createElement('input'); minI.type='number'; minI.placeholder='Min'; minI.style.cssText = inputStyle + 'width:52px;';
      const maxI = document.createElement('input'); maxI.type='number'; maxI.placeholder='Max'; maxI.style.cssText = inputStyle + 'width:52px;';
      function upd(){ filterState[col.key] = { min: minI.value===''?null:parseFloat(minI.value), max: maxI.value===''?null:parseFloat(maxI.value) }; render(); }
      minI.addEventListener('input', upd); maxI.addEventListener('input', upd);
      rangeRow.appendChild(minI); rangeRow.appendChild(maxI);
      group.appendChild(rangeRow);
    }
    filterBar.appendChild(group);
  });
  const clearBtn = document.createElement('button'); clearBtn.textContent='Clear Filters';
  clearBtn.style.cssText = 'padding:6px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:12px;cursor:pointer;font-family:var(--sans);';
  clearBtn.addEventListener('click', ()=>{
    Object.keys(filterState).forEach(k=>delete filterState[k]);
    filterBar.querySelectorAll('input').forEach(i=>{ i.value=''; });
    filterBar.querySelectorAll('select').forEach(s=>{ s.value=''; });
    render();
  });
  filterBar.appendChild(clearBtn);

  const table = document.createElement('table'); table.style.width='100%';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  columns.forEach(col=>{ const th=document.createElement('th'); th.textContent=col.label; if(col.align==='left') th.classList.add('left'); if(DEF_COL_KEYS.includes(col.key)) th.classList.add('defcol'); appendDefIcon(th, col.def || STAT_DEFINITIONS[col.key]); trh.appendChild(th); });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement('tbody'); table.appendChild(tbody);
  const countDiv = document.createElement('div'); countDiv.style.cssText='font-size:11.5px;color:var(--sub);margin:2px 0 6px;';

  function passes(row){
    return columns.every(col=>{
      const f = filterState[col.key];
      if(f===undefined || f===null || f==='') return true;
      const val = row.filterValues[col.key];
      if(col.type==='text'){ if(val===null||val===undefined) return false; return String(val).toLowerCase().includes(String(f).toLowerCase()); }
      if(col.type==='select'){ return String(val)===String(f); }
      if(col.type==='numRange'){
        if(val===null||val===undefined) return false;
        if(f.min!==null && f.min!==undefined && val<f.min) return false;
        if(f.max!==null && f.max!==undefined && val>f.max) return false;
        return true;
      }
      return true;
    });
  }

  function render(){
    tbody.innerHTML='';
    const filtered = dataRows.filter(passes);
    filtered.forEach(row=>{
      const tr = document.createElement('tr');
      columns.forEach((col,i)=>{
        const td = document.createElement('td');
        if(col.align==='left') td.classList.add('left');
        if(DEF_COL_KEYS.includes(col.key)) td.classList.add('defcol');
        td.style.padding='5px 8px'; td.style.borderBottom='1px solid var(--line)'; td.style.fontSize='12.5px';
        if(col.align!=='left') td.style.textAlign='center';
        const cell = row.cells[i];
        if(cell instanceof Node) td.appendChild(cell); else td.textContent = (cell===undefined||cell===null) ? '\u2014' : cell;
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    countDiv.textContent = `${filtered.length} / ${dataRows.length} rows shown`;
  }

  wrapDiv.appendChild(filterBar);
  wrapDiv.appendChild(countDiv);
  wrapDiv.appendChild(table);
  container.appendChild(wrapDiv);
  render();
}

function resultBadge(hr){
  const span = document.createElement('span'); span.className='result neutral';
  span.style.display='inline-block'; span.style.padding='2px 8px'; span.style.borderRadius='4px'; span.style.fontSize='12px';
  if(!hr || !hr.found){ span.textContent='no data'; return span; }
  const pct = Math.round(hr.rate*100);
  if(hr.gp===0){ span.textContent='no games'; return span; }
  if(hr.rate >= 0.6){
    span.className = pct>=96 ? 'result gold' : 'result green';
    span.textContent = `${hr.hits}/${hr.gp} (${pct}% OVER)`;
  } else if(hr.rate <= 0.4){
    const underPct = 100-pct;
    span.className = underPct>=96 ? 'result gold' : 'result red';
    span.textContent = `${hr.hits}/${hr.gp} (${underPct}% UNDER)`;
  } else {
    span.className='result neutral'; span.textContent = `${hr.hits}/${hr.gp} (${pct}%)`;
  }
  return span;
}

// Shows L5/L10/L15 hit rates side by side (not just whichever window is currently selected via
// the sticky bar) -- every bet on the Odds page shows all three, each with its record in
// parentheses, so you can see at a glance whether a bet is consistent across windows or only
// hot/cold in one of them.
function singleWindowChip(lbl, hr){
  const chip = document.createElement('span'); chip.style.cssText = 'font-size:10.5px;white-space:nowrap;padding:1px 5px;border-radius:3px;display:inline-block;';
  if(!hr || !hr.found || hr.gp===0){
    chip.style.color = 'var(--sub)'; chip.style.background = '#f0f2f6';
    chip.textContent = lbl ? `${lbl}: \u2014` : '\u2014';
  } else {
    const pct = Math.round(hr.rate*100);
    chip.textContent = lbl ? `${lbl}: ${pct}% (${hr.hits}/${hr.gp})` : `${pct}% (${hr.hits}/${hr.gp})`;
    if(hr.rate>=0.6){ chip.style.color = 'var(--green)'; chip.style.background = 'var(--greenbg)'; }
    else if(hr.rate<=0.4){ chip.style.color = 'var(--red)'; chip.style.background = 'var(--redbg)'; }
    else { chip.style.color = 'var(--sub)'; chip.style.background = '#f0f2f6'; }
  }
  return chip;
}
function multiWindowBadge(hr5, hr10, hr15){

  wrap.appendChild(singleWindowChip('L5', hr5));
  wrap.appendChild(singleWindowChip('L10', hr10));
  wrap.appendChild(singleWindowChip('L15', hr15));
  return wrap;
}

async function fetchJson(url, options){
  const resp = await fetch(url, options);
  if(!resp.ok){
    const text = await resp.text().catch(()=> '');
    throw new Error(`HTTP ${resp.status}: ${text.slice(0,200)}`);
  }
  return resp.json();
}

// ---- Shared Worker URL persistence + default, used by both the Home page and the Odds page ----
const WORKER_URL_LS_KEY = 'wnba_odds_worker_url';
// Baked-in default Worker URL — since this is just an address (not a secret; your real API
// key lives inside the Worker's environment now), it's safe to hardcode so every device
// works immediately with no per-browser setup step.
const DEFAULT_WORKER_URL = 'https://odds-api-proxy.allyearball.workers.dev';

// ---- Auth token persistence, used by Bet Tracker's login/signup gate ----
// Unlike the Worker URL above, this genuinely is sensitive (it's what proves who you are to
// the Worker) -- it lives only in this browser's localStorage, is never baked into the app,
// and is sent only to your own Worker over HTTPS, never anywhere else.
const AUTH_TOKEN_LS_KEY = 'wnba_auth_token';
const AUTH_EMAIL_LS_KEY = 'wnba_auth_email';
const AUTH_VERIFIED_LS_KEY = 'wnba_auth_verified';
const AUTH_ADMIN_LS_KEY = 'wnba_auth_admin';
const AUTH_USERNAME_LS_KEY = 'wnba_auth_username';
const AUTH_FIRSTNAME_LS_KEY = 'wnba_auth_firstname';
const AUTH_LASTNAME_LS_KEY = 'wnba_auth_lastname';
const AUTH_BIRTHDAY_LS_KEY = 'wnba_auth_birthday';
function getAuthToken(){ return localStorage.getItem(AUTH_TOKEN_LS_KEY); }
function getAuthEmail(){ return localStorage.getItem(AUTH_EMAIL_LS_KEY); }
function isEmailVerified(){ return localStorage.getItem(AUTH_VERIFIED_LS_KEY) === '1'; }
function isAdminUser(){ return localStorage.getItem(AUTH_ADMIN_LS_KEY) === '1'; }

// Full mode has been removed entirely -- this app only has one layout now. Kept as a function
// (rather than replacing every call site with the literal string 'compact') so every existing
// isCompact/getLayoutMode()==='compact' check throughout the app keeps working unchanged, just
// permanently true.
function getLayoutMode(){
  return 'compact';
}
function getAuthUsername(){ return localStorage.getItem(AUTH_USERNAME_LS_KEY); }
function getAuthFirstName(){ return localStorage.getItem(AUTH_FIRSTNAME_LS_KEY); }
function getAuthLastName(){ return localStorage.getItem(AUTH_LASTNAME_LS_KEY); }
function getAuthBirthday(){ return localStorage.getItem(AUTH_BIRTHDAY_LS_KEY); }
function setAuthSession(token, email, emailVerified, isAdmin, profile){
  localStorage.setItem(AUTH_TOKEN_LS_KEY, token);
  localStorage.setItem(AUTH_EMAIL_LS_KEY, email);
  // emailVerified/isAdmin/profile are optional (some callers, like changePassword, don't know/
  // change them) -- when omitted, leave whatever was already stored alone rather than silently
  // resetting it.
  if(emailVerified !== undefined){
    localStorage.setItem(AUTH_VERIFIED_LS_KEY, emailVerified ? '1' : '0');
  }
  if(isAdmin !== undefined){
    localStorage.setItem(AUTH_ADMIN_LS_KEY, isAdmin ? '1' : '0');
  }
  if(profile){
    if(profile.username !== undefined) localStorage.setItem(AUTH_USERNAME_LS_KEY, profile.username || '');
    if(profile.firstName !== undefined) localStorage.setItem(AUTH_FIRSTNAME_LS_KEY, profile.firstName || '');
    if(profile.lastName !== undefined) localStorage.setItem(AUTH_LASTNAME_LS_KEY, profile.lastName || '');
    if(profile.birthday !== undefined) localStorage.setItem(AUTH_BIRTHDAY_LS_KEY, profile.birthday || '');
  }
}
function clearAuthSession(){
  localStorage.removeItem(AUTH_TOKEN_LS_KEY);
  localStorage.removeItem(AUTH_EMAIL_LS_KEY);
  localStorage.removeItem(AUTH_VERIFIED_LS_KEY);
  localStorage.removeItem(AUTH_ADMIN_LS_KEY);
  localStorage.removeItem(AUTH_USERNAME_LS_KEY);
  localStorage.removeItem(AUTH_FIRSTNAME_LS_KEY);
  localStorage.removeItem(AUTH_LASTNAME_LS_KEY);
  localStorage.removeItem(AUTH_BIRTHDAY_LS_KEY);
}
function isLoggedIn(){ return !!getAuthToken(); }
// Merges an Authorization header onto whatever headers a call already wants to send --
// spread this INTO the headers object of any fetchJson() call that hits an auth-gated route.
function authHeaders(){
  const token = getAuthToken();
  return token ? {'Authorization': `Bearer ${token}`} : {};
}

async function saveUrl(workerUrl){
  try{
    if(window.storage && window.storage.set){ await window.storage.set('odds_worker_url', workerUrl, false); }
  }catch(e){ /* fall through to localStorage */ }
  try{ localStorage.setItem(WORKER_URL_LS_KEY, workerUrl); }catch(e){ /* ignore */ }
}
async function loadSavedUrl(){
  try{
    if(window.storage && window.storage.get){
      const res = await window.storage.get('odds_worker_url', false);
      if(res && res.value) return res.value;
    }
  }catch(e){ /* fall through */ }
  try{ return localStorage.getItem(WORKER_URL_LS_KEY); }catch(e){ return null; }
}
