// ================= App Tracker page (auto-captured daily Top 30 snapshots) =================
/* ================= App Tracker: cumulative performance over time =================
   One running total per selected category: +1 on a win, -1 on a loss, nothing for a void or a
   pick that hasn't graded. Above zero means that category is net ahead on picks (NOT on money --
   this deliberately ignores price, so a -300 favourite and a +250 dog each move the line one
   step; the Bet Tracker's P/L column is where odds are weighted).

   Categories are the six bet types and the five prop stat types, so the two breakdown tables
   above and this chart answer the same question in two shapes. Sources (Standard / Advanced /
   Specials) are a separate axis and combine freely -- checking two of them pools their picks
   into one line rather than drawing two. */
const APP_TRACKER_CHART_START = '2026-08-05'; // Jon's chosen origin; earlier picks are excluded, not carried in as an opening balance
// Categorical slots 1-6 of the validated reference palette, in its published order. Validated for
// this app's white panel surface: adjacent CVD worst 9.1 (>=8), adjacent normal-vision worst 19.6
// (>=15). Three of them sit under 3:1 contrast on white, which obligates "relief" -- hence the
// direct end-labels and the Show data table toggle below, both of which are load-bearing, not
// decoration. Six is the cap on concurrent series; the palette is never cycled to invent a 7th.
const CHART_SERIES_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'];
const CHART_MAX_SERIES = CHART_SERIES_COLORS.length;

// A tracked bet's date on the field, which is what the x-axis is about -- NOT snapshotDate, which
// is when the app happened to capture the pick. They're usually the same day, but a snapshot taken
// after midnight UTC would otherwise land a pick on the wrong day. Falls back through the two other
// date carriers rather than dropping a row.
function appTrackerBetDate(b){
  if(b.gameDate) return b.gameDate;
  if(b.commenceTime){ try { return toEasternDateStr(b.commenceTime); } catch(e){ /* fall through */ } }
  return b.snapshotDate || null;
}

// Inclusive list of YYYY-MM-DD strings. Built by stepping a UTC date so no local DST shift can
// skip or duplicate a day.
function chartDateRange(startStr, endStr){
  const out = [];
  const d = new Date(startStr + 'T00:00:00Z');
  const end = new Date(endStr + 'T00:00:00Z');
  if(isNaN(d) || isNaN(end) || end < d) return out;
  while(d <= end){
    out.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
    if(out.length > 2000) break; // guard against a garbage end date walking forever
  }
  return out;
}

function buildAppTrackerChart(container, bets){
  const CATEGORIES = Object.entries(BET_TYPE_LABELS).map(([key, label])=>({key:'type:'+key, label, kind:'type', match: b=>b.betType===key}))
    .concat(Object.entries(STAT_KEY_LABEL).map(([key, label])=>({
      key:'stat:'+key, label,
      kind:'stat',
      match: b=>(b.betType==='player_prop' || b.betType==='player_prop_alt') && b.statKey===key,
    })));
  const CAT_BY_KEY = {};
  CATEGORIES.forEach(c=>{ CAT_BY_KEY[c.key] = c; });

  // Only categories that actually have a graded pick are offered -- an empty chip that draws a
  // flat zero line is a dead end, and there are eleven of them to wade through.
  const inRange = bets.filter(b=>{
    const d = appTrackerBetDate(b);
    return d && d >= APP_TRACKER_CHART_START;
  });
  const gradedInRange = inRange.filter(b=>b.result==='won' || b.result==='lost');
  const available = CATEGORIES.filter(c=>gradedInRange.some(c.match));

  const box = document.createElement('div');
  box.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;';
  const title = document.createElement('div'); title.className='section-title'; title.style.margin='0 0 4px';
  title.textContent = 'Performance Over Time';
  box.appendChild(title);
  appendDefIcon(title, 'A running tally per category: <b>+1 for every win, −1 for every loss</b>, with voids and ungraded picks left out. Above the zero line means that category is net ahead <i>on picks</i> — price is deliberately ignored here, so a heavy favourite and a longshot each move the line one step. Days start ' + APP_TRACKER_CHART_START + ' and a pick counts on its <b>game</b> date, not the day the app captured it. Ticking more than one source pools those picks into a single line rather than drawing one line each.');

  if(!available.length){
    const na = document.createElement('div'); na.style.cssText='font-size:13px;color:var(--sub);';
    na.textContent = 'No graded picks on or after ' + APP_TRACKER_CHART_START + ' yet — nothing to plot.';
    box.appendChild(na);
    container.appendChild(box);
    return;
  }

  // ---- state ----
  const selectedSources = new Set(APP_TRACKER_SOURCES);
  const selected = [];                 // category keys, in the order they were picked
  const colorOf = new Map();           // category key -> palette slot, HELD until deselected
  // Colour follows the entity, not its rank: a slot is claimed on selection and released only on
  // deselection, so toggling one series off never repaints the ones that stay.
  function claimColor(key){
    const taken = new Set(colorOf.values());
    for(let i=0; i<CHART_MAX_SERIES; i++){ if(!taken.has(i)){ colorOf.set(key, i); return i; } }
    return 0;
  }
  const firstDefault = available.find(c=>c.key==='type:player_prop') || available[0];
  selected.push(firstDefault.key); claimColor(firstDefault.key);

  let showTable = false;

  // ---- controls: one row above the chart ----
  const controls = document.createElement('div');
  controls.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin:10px 0 12px;';

  const srcRow = document.createElement('div');
  srcRow.style.cssText = 'display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;';
  const srcLbl = document.createElement('span');
  srcLbl.style.cssText = 'font-weight:700;color:var(--navy2);text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;';
  srcLbl.textContent = 'Include picks from';
  srcRow.appendChild(srcLbl);
  APP_TRACKER_SOURCES.forEach(src=>{
    const lab = document.createElement('label');
    lab.style.cssText = 'display:flex;align-items:center;gap:5px;cursor:pointer;';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = true;
    cb.style.cssText = 'cursor:pointer;width:15px;height:15px;';
    cb.addEventListener('change', ()=>{
      if(cb.checked) selectedSources.add(src); else selectedSources.delete(src);
      // Never let all three go dark -- an empty chart reads as broken rather than as a filter.
      if(!selectedSources.size){ selectedSources.add(src); cb.checked = true; return; }
      draw();
    });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(src==='advanced' ? 'Advanced' : APP_TRACKER_SOURCE_LABEL[src]));
    srcRow.appendChild(lab);
  });
  controls.appendChild(srcRow);

  const chipRow = document.createElement('div');
  chipRow.style.cssText = 'display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;';
  const chipLbl = document.createElement('span');
  chipLbl.style.cssText = 'font-weight:700;color:var(--navy2);text-transform:uppercase;font-size:10.5px;letter-spacing:.03em;padding-top:6px;';
  chipLbl.textContent = 'Show';
  chipRow.appendChild(chipLbl);
  const chips = new Map();
  available.forEach(cat=>{
    const chip = document.createElement('button');
    chip.textContent = cat.label + (cat.kind==='stat' ? ' • prop' : '');
    chip.addEventListener('click', ()=>{
      const at = selected.indexOf(cat.key);
      if(at >= 0){
        if(selected.length === 1) return;   // keep at least one line on screen
        selected.splice(at, 1); colorOf.delete(cat.key);
      } else {
        if(selected.length >= CHART_MAX_SERIES) return;
        selected.push(cat.key); claimColor(cat.key);
      }
      draw();
    });
    chips.set(cat.key, chip);
    chipRow.appendChild(chip);
  });
  controls.appendChild(chipRow);

  const capNote = document.createElement('div');
  capNote.style.cssText = 'font-size:11px;color:var(--sub);';
  controls.appendChild(capNote);
  box.appendChild(controls);

  // ---- chart shell ----
  const plotWrap = document.createElement('div');
  plotWrap.style.cssText = 'position:relative;';
  box.appendChild(plotWrap);

  const tooltip = document.createElement('div');
  tooltip.style.cssText = 'position:absolute;pointer-events:none;display:none;background:var(--panel);border:1px solid var(--line);'
    + 'border-radius:6px;padding:7px 9px;font-size:11.5px;box-shadow:0 2px 10px rgba(0,0,0,.13);z-index:5;min-width:120px;';
  plotWrap.appendChild(tooltip);

  const legend = document.createElement('div');
  legend.className = 'chart-legend'; // a stable hook: its DIRECT children are the legend items
  legend.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;';
  box.appendChild(legend);

  const tableToggle = document.createElement('button');
  tableToggle.style.cssText = 'margin-top:10px;padding:5px 11px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:11.5px;cursor:pointer;font-family:var(--sans);color:var(--navy2);font-weight:700;';
  tableToggle.addEventListener('click', ()=>{ showTable = !showTable; draw(); });
  box.appendChild(tableToggle);
  const tableHolder = document.createElement('div');
  box.appendChild(tableHolder);

  container.appendChild(box);

  // ---- series maths ----
  function seriesFor(catKey, days){
    const cat = CAT_BY_KEY[catKey];
    const perDay = new Map();
    inRange.forEach(b=>{
      if(!selectedSources.has(b.snapshotSource)) return;
      if(!cat.match(b)) return;
      if(b.result !== 'won' && b.result !== 'lost') return;
      const d = appTrackerBetDate(b);
      perDay.set(d, (perDay.get(d) || 0) + (b.result==='won' ? 1 : -1));
    });
    let running = 0;
    const points = days.map(d=>{
      running += (perDay.get(d) || 0);
      return {date: d, value: running, delta: perDay.get(d) || 0};
    });
    return {key: catKey, label: cat.label, points, final: running,
            color: CHART_SERIES_COLORS[colorOf.get(catKey) || 0]};
  }

  function draw(){
    // x runs to the last day that actually carries a graded pick, or today, whichever is later --
    // so the line never trails off into a flat stretch of future days.
    let lastDated = APP_TRACKER_CHART_START;
    inRange.forEach(b=>{
      if(b.result!=='won' && b.result!=='lost') return;
      if(!selectedSources.has(b.snapshotSource)) return;
      const d = appTrackerBetDate(b);
      if(d && d > lastDated) lastDated = d;
    });
    let today = APP_TRACKER_CHART_START;
    try { today = nowInEastern().dateStr; } catch(e){ /* keep the fallback */ }
    const end = today > lastDated ? today : lastDated;
    const days = chartDateRange(APP_TRACKER_CHART_START, end);

    chips.forEach((chip, key)=>{
      const on = selected.indexOf(key) >= 0;
      const atCap = !on && selected.length >= CHART_MAX_SERIES;
      const col = on ? CHART_SERIES_COLORS[colorOf.get(key) || 0] : null;
      chip.style.cssText = 'padding:5px 11px;border-radius:14px;font-size:12px;font-family:var(--sans);cursor:'
        + (atCap ? 'not-allowed' : 'pointer') + ';border:1px solid ' + (on ? col : 'var(--line)') + ';'
        + 'background:' + (on ? col : 'var(--panel)') + ';color:' + (on ? '#fff' : (atCap ? 'var(--sub)' : 'var(--ink)')) + ';'
        + 'font-weight:' + (on ? '700' : '400') + ';opacity:' + (atCap ? '.5' : '1') + ';';
      chip.disabled = atCap;
    });
    capNote.textContent = selected.length >= CHART_MAX_SERIES
      ? 'Showing the maximum of ' + CHART_MAX_SERIES + ' categories at once — untick one to swap another in.'
      : '';

    const series = selected.map(k=>seriesFor(k, days));

    plotWrap.querySelectorAll('svg').forEach(el=>el.remove());
    const W = 900, H = 340, padL = 46, padR = 96, padT = 14, padB = 34;
    const innerW = W - padL - padR, innerH = H - padT - padB;

    let lo = 0, hi = 0;
    series.forEach(s=>s.points.forEach(p=>{ if(p.value < lo) lo = p.value; if(p.value > hi) hi = p.value; }));
    if(lo === hi){ lo -= 1; hi += 1; }
    const span = hi - lo, pad = Math.max(1, Math.ceil(span * 0.12));
    lo -= pad; hi += pad;

    const xAt = i => padL + (days.length <= 1 ? innerW/2 : (i / (days.length - 1)) * innerW);
    const yAt = v => padT + innerH - ((v - lo) / (hi - lo)) * innerH;

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('role', 'img');
    svg.style.cssText = 'width:100%;height:auto;display:block;overflow:visible;';
    const mk = (tag, attrs)=>{ const el = document.createElementNS(NS, tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k, v)); return el; };

    // y gridlines on clean integers, hairline and recessive
    const tickStep = Math.max(1, Math.ceil((hi - lo) / 6));
    for(let v = Math.ceil(lo/tickStep)*tickStep; v <= hi; v += tickStep){
      const y = yAt(v);
      svg.appendChild(mk('line', {x1:padL, x2:padL+innerW, y1:y, y2:y, stroke:'var(--line)', 'stroke-width':1}));
      const t = mk('text', {x:padL-8, y:y+4, 'text-anchor':'end', 'font-size':11, fill:'var(--sub)'});
      t.textContent = (v > 0 ? '+' : '') + v;
      svg.appendChild(t);
    }
    // zero is the reading line for this chart -- a step darker than the grid, still not data ink
    svg.appendChild(mk('line', {x1:padL, x2:padL+innerW, y1:yAt(0), y2:yAt(0), stroke:'#9aa3b0', 'stroke-width':1.5}));

    const labelEvery = Math.max(1, Math.ceil(days.length / 8));
    days.forEach((d, i)=>{
      if(i % labelEvery !== 0 && i !== days.length-1) return;
      const t = mk('text', {x:xAt(i), y:H-12, 'text-anchor':'middle', 'font-size':11, fill:'var(--sub)'});
      t.textContent = Number(d.slice(5,7)) + '/' + Number(d.slice(8,10));
      svg.appendChild(t);
    });

    series.forEach(s=>{
      const dAttr = s.points.map((p,i)=>(i?'L':'M') + xAt(i).toFixed(1) + ' ' + yAt(p.value).toFixed(1)).join(' ');
      svg.appendChild(mk('path', {d:dAttr, fill:'none', stroke:s.color, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round'}));
      const lastI = s.points.length - 1;
      // end marker: r>=4 with a 2px surface ring so overlapping endpoints stay separable
      svg.appendChild(mk('circle', {cx:xAt(lastI), cy:yAt(s.points[lastI].value), r:4.5, fill:s.color, stroke:'var(--panel)', 'stroke-width':2}));
    });

    // Direct end-labels are the contrast relief for the light hues -- text in ink, identity from
    // the coloured line beside it. Skipped past 4 series, where they'd collide.
    if(series.length <= 4){
      const placed = [];
      series.slice().sort((a,b)=>b.final-a.final).forEach(s=>{
        let y = yAt(s.points[s.points.length-1].value) + 4;
        while(placed.some(p=>Math.abs(p - y) < 13)) y += 13;
        placed.push(y);
        svg.appendChild(mk('line', {x1:padL+innerW+8, x2:padL+innerW+20, y1:y-4, y2:y-4, stroke:s.color, 'stroke-width':2, 'stroke-linecap':'round'}));
        const t = mk('text', {x:padL+innerW+24, y:y, 'font-size':11, fill:'var(--ink)'});
        t.textContent = s.label + ' ' + (s.final>0?'+':'') + s.final;
        svg.appendChild(t);
      });
    }

    // crosshair + hit layer: the reader aims at a date, never at a 2px line
    const hair = mk('line', {x1:0, x2:0, y1:padT, y2:padT+innerH, stroke:'#9aa3b0', 'stroke-width':1, opacity:0});
    svg.appendChild(hair);
    const dots = mk('g', {opacity:0});
    svg.appendChild(dots);
    const hit = mk('rect', {x:padL, y:padT, width:innerW, height:innerH, fill:'transparent'});
    svg.appendChild(hit);

    function hideHover(){ hair.setAttribute('opacity', 0); dots.setAttribute('opacity', 0); tooltip.style.display='none'; }
    hit.addEventListener('pointerleave', hideHover);
    hit.addEventListener('pointermove', ev=>{
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(days.length-1, Math.round((px - padL) / (innerW || 1) * (days.length - 1))));
      const x = xAt(i);
      hair.setAttribute('x1', x); hair.setAttribute('x2', x); hair.setAttribute('opacity', 1);
      while(dots.firstChild) dots.removeChild(dots.firstChild);
      series.forEach(s=>{
        dots.appendChild(mk('circle', {cx:x, cy:yAt(s.points[i].value), r:4, fill:s.color, stroke:'var(--panel)', 'stroke-width':2}));
      });
      dots.setAttribute('opacity', 1);

      tooltip.textContent = '';
      const head = document.createElement('div');
      head.style.cssText = 'font-weight:700;color:var(--navy2);margin-bottom:4px;';
      head.textContent = days[i];
      tooltip.appendChild(head);
      series.forEach(s=>{
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:6px;white-space:nowrap;';
        const key = document.createElement('span');
        key.style.cssText = 'display:inline-block;width:12px;height:2px;border-radius:1px;flex:none;background:' + s.color + ';';
        const val = document.createElement('b');
        val.style.cssText = 'color:var(--ink);';
        const v = s.points[i].value;
        val.textContent = (v>0?'+':'') + v;
        const nm = document.createElement('span');
        nm.style.cssText = 'color:var(--sub);';
        nm.textContent = s.label;
        const dlt = document.createElement('span');
        dlt.style.cssText = 'color:var(--sub);margin-left:auto;padding-left:8px;';
        const dv = s.points[i].delta;
        dlt.textContent = dv ? '(' + (dv>0?'+':'') + dv + ' that day)' : '';
        row.appendChild(key); row.appendChild(val); row.appendChild(nm); row.appendChild(dlt);
        tooltip.appendChild(row);
      });
      tooltip.style.display = 'block';
      const leftPx = (x / W) * plotWrap.clientWidth;
      const flip = leftPx > plotWrap.clientWidth * 0.6;
      tooltip.style.left = flip ? (leftPx - tooltip.offsetWidth - 12) + 'px' : (leftPx + 12) + 'px';
      tooltip.style.top = '8px';
    });

    plotWrap.insertBefore(svg, tooltip);

    // legend: always present for two or more series
    legend.textContent = '';
    if(series.length >= 2){
      series.forEach(s=>{
        const item = document.createElement('span');
        item.style.cssText = 'display:flex;align-items:center;gap:6px;';
        const key = document.createElement('span');
        key.style.cssText = 'display:inline-block;width:16px;height:2px;border-radius:1px;background:' + s.color + ';';
        const nm = document.createElement('span'); nm.style.color = 'var(--ink)';
        nm.textContent = s.label + ' (' + (s.final>0?'+':'') + s.final + ')';
        item.appendChild(key); item.appendChild(nm);
        legend.appendChild(item);
      });
    }

    tableToggle.textContent = showTable ? 'Hide data table' : 'Show data table';
    tableHolder.textContent = '';
    if(showTable){
      const wrap = document.createElement('div'); wrap.className='table-wrap'; wrap.style.marginTop='8px';
      const table = document.createElement('table'); table.style.cssText='font-size:11.5px;width:100%;';
      const thead = document.createElement('thead');
      const htr = document.createElement('tr');
      const th0 = document.createElement('th'); th0.className='left'; th0.textContent='Date'; htr.appendChild(th0);
      series.forEach(s=>{ const th=document.createElement('th'); th.textContent=s.label; htr.appendChild(th); });
      thead.appendChild(htr); table.appendChild(thead);
      const tbody = document.createElement('tbody');
      // Only days where something actually moved -- a row per calendar day would be mostly repeats.
      days.forEach((d, i)=>{
        if(i !== days.length-1 && !series.some(s=>s.points[i].delta !== 0)) return;
        const tr = document.createElement('tr');
        const td0 = document.createElement('td'); td0.className='left'; td0.textContent = d; tr.appendChild(td0);
        series.forEach(s=>{
          const td = document.createElement('td'); td.style.textAlign='center';
          const v = s.points[i].value, dv = s.points[i].delta;
          td.textContent = (v>0?'+':'') + v + (dv ? ' (' + (dv>0?'+':'') + dv + ')' : '');
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      tableHolder.appendChild(wrap);
    }
  }

  draw();
}

async function renderAppTrackerPage(){

  }

  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\ud83d\udcca App Tracker <span id="appTrackerInfoIcon"></span></h2>`;
  main.appendChild(head);
  appendDefIcon(head.querySelector('#appTrackerInfoIcon'), `Every Top 30 recommendation (Standard + Advanced Analytics) this app has automatically captured, meant to be taken once per day pre-game. Auto-grades against this app's own historical box scores once each game concludes, same as the Bet Tracker.<br><br>How this works, honestly: the Top 30 lists are computed entirely in your browser using live odds and this app\u2019s season data \u2014 there\u2019s no backend process that can run that logic on a fixed clock independent of a browser being open. So instead, every time the Home page loads, the app checks whether today\u2019s snapshot (US Eastern date) has already been captured; if it\u2019s on or after 12:00pm ET and it hasn\u2019t, it captures the current Top 30 Standard and Top 30 Advanced lists right then, tagged as pending picks. That means the exact capture time is "whenever the Home page is first opened on or after noon ET that day," not a guaranteed 12:00:00 timestamp \u2014 opening the Home page at least once daily after noon ET is what keeps this consistent.`);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.marginBottom='14px';
  statusDiv.textContent = 'Loading snapshot history\u2026';
  main.appendChild(statusDiv);

  const summaryDiv = document.createElement('div'); main.appendChild(summaryDiv);
  const statsBoxDiv = document.createElement('div'); main.appendChild(statsBoxDiv);

  const actionsRow = document.createElement('div'); actionsRow.style.cssText='display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;';
  const refreshBtn = document.createElement('button'); refreshBtn.className='addbtn'; refreshBtn.textContent = '\ud83d\udd04 Refresh';
  const gradeBtn = document.createElement('button'); gradeBtn.className='addbtn'; gradeBtn.textContent = '\u2705 Auto-Grade Pending';
  const forceRegradeBtn = document.createElement('button'); forceRegradeBtn.className='addbtn'; forceRegradeBtn.textContent = '\u267b\ufe0f Force Re-check All Results';
  forceRegradeBtn.title = 'Re-grades every pick, including ones that already show a result \u2014 use this if a result looks wrong (a past grading bug could have assigned a result before the game had actually finished).';
  const deleteAllBtn = document.createElement('button'); deleteAllBtn.textContent = '\ud83d\uddd1\ufe0f Delete All Snapshots';
  deleteAllBtn.style.cssText = 'padding:8px 14px;border-radius:6px;border:1px solid var(--red);background:var(--panel);color:var(--red);font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:700;';
  actionsRow.appendChild(refreshBtn); actionsRow.appendChild(gradeBtn); actionsRow.appendChild(forceRegradeBtn);
  // App Tracker is shared/public data (not per-user), so wiping it affects every user, not just
  // whoever clicks the button -- admin-only, unlike Bet Tracker's own delete-all which only
  // ever touches that one user's own data.
  if(isAdminUser()) actionsRow.appendChild(deleteAllBtn);
  main.appendChild(actionsRow);

  const tableDiv = document.createElement('div'); main.appendChild(tableDiv);

  let bets = [];
  let sourceFilter = 'all'; // 'all' | one of APP_TRACKER_SOURCES
  let hidePending = false;
  let sortKey = null; // null = default (most recent snapshot date, then best rank); otherwise a column key to sort by, click-to-sort same as League Stats/Team pages
  let sortDir = 'desc';
  // Min-threshold filters (0-100 or null = no filter) on the point-in-time L5/L10/L15/Season
  // rates, so a bet only shows if its rate AT CAPTURE TIME was at least this -- e.g. "Min L10%:
  // 70" isolates only picks that were already showing 70%+ over their last 10 games when placed.
  const rateFilters = {rate5: null, rate10: null, rate15: null, rateAll: null};

  // Figures out, for each bet, whether the SAME bet (same player/team/stat/side/line) also
  // appears under the other source on the SAME snapshot date -- powers both the "Both" column
  // and (when viewing "All Sources") not listing a shared bet twice. Filtering to a single
  // source shows that source's full list (no hiding), with "Both" still shown for reference.
  function computeDisplayRows(allBets, filterVal){
    const byDate = {};
    allBets.forEach(b=>{
      if(!APP_TRACKER_SOURCES.includes(b.snapshotSource)) return;
      if(!byDate[b.snapshotDate]){
        byDate[b.snapshotDate] = {};
        APP_TRACKER_SOURCES.forEach(src=>{ byDate[b.snapshotDate][src] = []; });
      }
      byDate[b.snapshotDate][b.snapshotSource].push(b);
    });
    function findMatch(bet, otherSource){
      const key = betIdentityKey(bet);
      if(!key) return null;
      const list = (byDate[bet.snapshotDate] && byDate[bet.snapshotDate][otherSource]) || [];
      return list.find(o => betIdentityKey(o)===key) || null;
    }
    let rows = allBets.map(b=>{
      const otherSource = b.snapshotSource==='standard' ? 'advanced' : (b.snapshotSource==='advanced' ? 'standard' : null);
      const both = otherSource ? !!findMatch(b, otherSource) : false;
      return Object.assign({}, b, {_both: both});
    });
    if(filterVal==='all'){
      // Don't double-list a shared bet -- keep its 'standard' row (with Both checked), drop the matching 'advanced' row.
      rows = rows.filter(b => !(b.snapshotSource==='advanced' && findMatch(b,'standard')));
      // Specials is an independent shortlist that can overlap either of the other two. A
      // specials row is dropped from the combined view only when that exact bet is already
      // listed under standard or advanced -- a specials-ONLY pick is never hidden.
      rows = rows.filter(b => !(b.snapshotSource==='specials' && (findMatch(b,'standard') || findMatch(b,'advanced'))));
    } else if(APP_TRACKER_SOURCES.includes(filterVal)){
      rows = rows.filter(b=>b.snapshotSource===filterVal);
    }
    return rows;
  }

  async function autoGradeAllSnapshots(){
    let gradedCount = 0;
    for(const bet of bets){
      if(bet.result && bet.result!=='pending') continue;
      const result = gradeTrackedBet(bet); // snapshot entries are single-leg-shaped (isParlay:false), same as any straight tracked bet
      if(result){
        await appTrackerUpdate(bet.id, {result});
        bet.result = result;
        gradedCount++;
      }
    }
    return gradedCount;
  }
  // Unlike autoGradeAllSnapshots, this re-checks EVERY pick regardless of its current stored
  // result and overwrites it if the freshly computed result differs \u2014 the fix for a pick that
  // got graded incorrectly before its game had actually finished (a real bug that existed
  // before findHistoricalGame was corrected to never fuzzy-match a same-day-or-future game).
  // Auto-Grade Pending alone can't fix that, since it skips anything already marked non-pending
  // \u2014 a wrong result would otherwise stay wrong forever.
  async function forceRegradeAllSnapshots(){
    let changedCount = 0;
    for(const bet of bets){
      const result = gradeTrackedBet(bet);
      const newResult = result || 'pending';
      if(newResult !== (bet.result || 'pending')){
        await appTrackerUpdate(bet.id, {result: newResult});
        bet.result = newResult;
        changedCount++;
      }
    }
    return changedCount;
  }

  // When a pick turns out to be a confirmed DNP (result === 'void', set by gradeLeg above),
  // DraftKings would have voided that line before the game -- it never should have occupied a
  // real ranked slot. This shifts every OTHER pick from the same day+source that ranked worse
  // (a higher rank number) up by one, closing the gap, so "Top 30" becomes an honest "Top 29"
  // for that day rather than having a permanent hole at the voided pick's old rank. Idempotent:
  // uses a separately-stored originalSnapshotRank (captured once, never changed) so re-running
  // this on an already-corrected day is a no-op rather than shifting things twice.
  async function applyVoidRankShifts(){
    const groups = {};
    bets.forEach(b=>{
      if(!APP_TRACKER_SOURCES.includes(b.snapshotSource)) return;
      const key = b.snapshotDate+'|'+b.snapshotSource;
      (groups[key] = groups[key]||[]).push(b);
    });
    let shiftedCount = 0;
    for(const group of Object.values(groups)){
      for(const b of group){
        if(b.originalSnapshotRank===undefined || b.originalSnapshotRank===null){
          b.originalSnapshotRank = b.snapshotRank;
          await appTrackerUpdate(b.id, {originalSnapshotRank: b.originalSnapshotRank});
        }
      }
      const voidRanks = group.filter(b=>b.result==='void').map(b=>b.originalSnapshotRank);
      if(!voidRanks.length) continue;
      for(const b of group){
        if(b.result==='void') continue;
        const shiftCount = voidRanks.filter(vr=>vr < b.originalSnapshotRank).length;
        const newRank = b.originalSnapshotRank - shiftCount;
        if(newRank !== b.snapshotRank){
          b.snapshotRank = newRank;
          await appTrackerUpdate(b.id, {snapshotRank: newRank});
          shiftedCount++;
        }
      }
    }
    return shiftedCount;
  }

  async function refresh(){
    statusDiv.textContent = 'Loading snapshot history\u2026';
    try{
      bets = await appTrackerListAll();

  function renderSummary(){

    if(!bets.length) return;

      const heading = document.createElement('div');

      row.innerHTML = `<div><b>${list.length}</b> picks</div><div style="color:var(--green)"><b>${w}</b> won</div><div style="color:var(--red)"><b>${l}</b> lost</div>` + (v ? `<div style="color:var(--sub)"><b>${v}</b> void</div>` : '') + `<div style="color:var(--sub)"><b>${p}</b> pending</div>` + (pct!==null ? `<div><b>${pct}%</b> hit rate</div>` : '');
      card.appendChild(row);

    }

    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;';
    wrap.appendChild(buildStatCard('Total', bets));
    APP_TRACKER_SOURCES.forEach(src=>{
      const subset = bets.filter(b=>b.snapshotSource===src);

  // All-time record broken down by where a pick ranked. "Both" tier uses the Standard-side
  // rank for a shared bet (matching how the table below keeps only the Standard row for a
  // shared bet) -- consistent with the Both column/dedup logic elsewhere on this page.
  function renderTierAndRankStats(){
    statsBoxDiv.innerHTML = '';
    if(!bets.length) return;

    const dedupedForBoth = computeDisplayRows(bets, 'all'); // standard rows (with _both flag) + unmatched advanced rows
    const stdBets = bets.filter(b=>b.snapshotSource==='standard');
    const advBets = bets.filter(b=>b.snapshotSource==='advanced');
    const specialsBets = bets.filter(b=>b.snapshotSource==='specials');

    function record(list, rankMax){
      const subset = list.filter(b => b.snapshotRank && b.snapshotRank<=rankMax && b.result && b.result!=='pending');
      const w = subset.filter(b=>b.result==='won').length;
      const l = subset.filter(b=>b.result==='lost').length;
      return {w, l, pct: (w+l) ? Math.round((w/(w+l))*100) : null};
    }
    function fmtRecord(r){ return r.pct!==null ? `${r.w}-${r.l} (${r.pct}%)` : `${r.w}-${r.l}`; }

    const tierBox = document.createElement('div');
    tierBox.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;';
    const tierTitle = document.createElement('div'); tierTitle.className='section-title'; tierTitle.style.margin='0 0 10px'; tierTitle.textContent = 'All-Time Records';
    tierBox.appendChild(tierTitle);
    const tierTable = document.createElement('table'); tierTable.style.cssText = 'font-size:11px;table-layout:fixed;width:100%;';
    const tierRows = [
      ['Standard', stdBets],
      ['Advanced', advBets],
      ['Specials', specialsBets],
      ['Both', bothBets],   // 'Both' stays standard-and-advanced specifically, as before
    ];
    // Wrapped in real <thead>/<tbody> rather than left as bare <tr>s. innerHTML on a <table>
    // silently drops loose rows into an auto-created <tbody>, which left table.tHead null -- and
    // both syncTableHeaderAlignment() and applyStickyIdentityColumns() key off tHead, so this
    // table was skipped by them entirely and its right-aligned headers never got corrected to
    // match its centred data.
    let tierHtml = '<thead><tr><th class="left" style="padding:4px 2px;width:22%;"></th><th style="padding:4px 2px;width:26%;">Top 5</th><th style="padding:4px 2px;width:26%;">Top 10</th><th style="padding:4px 2px;width:26%;">Top 15</th></tr></thead><tbody>';
    tierRows.forEach(([label, list])=>{
      tierHtml += `<tr><td class="left" style="padding:4px 2px;font-weight:700;color:var(--navy2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</td>`
        + `<td style="padding:4px 2px;text-align:center;">${fmtRecord(record(list,5))}</td>`
        + `<td style="padding:4px 2px;text-align:center;">${fmtRecord(record(list,10))}</td>`
        + `<td style="padding:4px 2px;text-align:center;">${fmtRecord(record(list,15))}</td></tr>`;
    });
    tierHtml += '</tbody>';
    tierTable.innerHTML = tierHtml;
    tierBox.appendChild(tierTable);
    statsBoxDiv.appendChild(tierBox);

    // ---- Record by bet type / by prop stat, same shape as the Bet Tracker's analysis tables ----
    // Graded picks only: 'void' counts as neither a win nor a loss, and pending picks haven't
    // happened yet -- but the Picks column reports EVERY pick in the category, so a row reading
    // "2-1 (67%) ... 9 picks" is telling you six are still pending rather than hiding them.
    function gradedRecord(list){
      const w = list.filter(b=>b.result==='won').length;
      const l = list.filter(b=>b.result==='lost').length;
      return {w, l, pct: (w+l) ? Math.round((w/(w+l))*100) : null, picks: list.length};
    }
    // Rows whose category has no picks at all are dropped; a category with picks but nothing
    // graded yet is kept, showing 0-0, so you can see it exists and is still in flight.
    function buildBreakdownBox(title, defText, rows){
      const withPicks = rows.filter(r=>r.list.length > 0);
      if(!withPicks.length) return null;
      const box = document.createElement('div');
      box.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;';
      const t = document.createElement('div'); t.className='section-title'; t.style.margin='0 0 10px'; t.textContent = title;
      box.appendChild(t);
      if(defText) appendDefIcon(t, defText);
      const wrap = document.createElement('div'); wrap.className='table-wrap';
      const table = document.createElement('table'); table.style.cssText = 'font-size:11px;width:100%;';
      // Real thead/tbody, not loose <tr>s -- see the note on the All-Time Records table above for
      // why that distinction matters to the two DOM passes.
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th class="left">Category</th><th>Record</th><th>Hit Rate</th><th>Picks</th>'
        + APP_TRACKER_SOURCES.map(src=>`<th>${src==='advanced' ? 'Advanced' : APP_TRACKER_SOURCE_LABEL[src]}</th>`).join('')
        + '</tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      withPicks.forEach(r=>{
        const rec = gradedRecord(r.list);
        const tr = document.createElement('tr');
        const cells = [
          {text: r.label, left: true},
          {text: `${rec.w}-${rec.l}`},
          {text: rec.pct !== null ? rec.pct + '%' : '\u2014', sub: rec.pct === null},
          {text: String(rec.picks)},
        ];
        APP_TRACKER_SOURCES.forEach(src=>{
          const sub = gradedRecord(r.list.filter(b=>b.snapshotSource===src));
          // Record AND hit rate per source, same "W-L (NN%)" shape the All-Time Records table
          // above uses. The percentage is dropped rather than shown as 0% when nothing in that
          // cell has graded yet -- 0-0 (0%) would read as "this source never wins".
          const text = !sub.picks ? '\u2014'
            : (sub.pct !== null ? `${sub.w}-${sub.l} (${sub.pct}%)` : `${sub.w}-${sub.l}`);
          cells.push({text, sub: !sub.picks || sub.pct === null});
        });
        cells.forEach(c=>{
          const td = document.createElement('td');
          if(c.left) td.classList.add('left');
          td.style.cssText = 'padding:4px 6px;' + (c.left ? 'font-weight:700;color:var(--navy2);' : 'text-align:center;')
            + (c.sub ? 'color:var(--sub);' : '');
          td.textContent = c.text;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      box.appendChild(wrap);
      return box;
    }

    const byTypeBox = buildBreakdownBox(
      'All-Time Record by Bet Type',
      'Every pick this app has ever posted, grouped by what kind of bet it was. <b>Record</b> and <b>Hit Rate</b> count graded picks only (a void is neither a win nor a loss); <b>Picks</b> counts everything in that category including pending ones, so the two won\u2019t always tie. The last three columns split the same record and hit rate by which list the pick came from, so you can compare how Standard, Advanced and Specials are each doing on that bet type. Note that moneyline, spread and over/under picks are currently held back from the Standard list \u2014 those rows are history.',
      Object.entries(BET_TYPE_LABELS).map(([key, label])=>({label, list: bets.filter(b=>b.betType===key)})));
    if(byTypeBox) statsBoxDiv.appendChild(byTypeBox);

    const propBets = bets.filter(b=>b.betType==='player_prop' || b.betType==='player_prop_alt');
    const byStatBox = buildBreakdownBox(
      'Player Props \u2014 by Stat',
      'The player-prop rows above, broken down by which stat the prop was on. Same counting rules.',
      Object.entries(STAT_KEY_LABEL).map(([key, label])=>({label, list: propBets.filter(b=>b.statKey===key)})));
    if(byStatBox) statsBoxDiv.appendChild(byStatBox);

    buildAppTrackerChart(statsBoxDiv, bets);

    // By-rank (1-30) breakdown, Standard and Advanced side by side, collapsed by default since
    // it's 30 rows deep in each column -- most people won't want this open every visit.
    const rankWrap = document.createElement('div');
    rankWrap.style.cssText = 'background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px;';
    const rankHeaderRow = document.createElement('div');
    rankHeaderRow.style.cssText = 'display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;';
    const rankArrow = document.createElement('span');
    rankArrow.textContent = '\u25b8';
    rankArrow.style.cssText = 'font-size:18px;color:var(--navy2);display:inline-block;width:20px;flex-shrink:0;line-height:1;';
    const rankTitle = document.createElement('div'); rankTitle.className='section-title'; rankTitle.style.margin='0'; rankTitle.textContent = 'All-Time Record by Rank (1\u201330)';
    rankHeaderRow.appendChild(rankArrow); rankHeaderRow.appendChild(rankTitle);
    rankWrap.appendChild(rankHeaderRow);

    const rankContent = document.createElement('div');
    rankContent.style.cssText = 'display:none;margin-top:10px;';
    rankHeaderRow.addEventListener('click', ()=>{
      const isOpen = rankContent.style.display !== 'none';
      rankContent.style.display = isOpen ? 'none' : '';
      rankArrow.textContent = isOpen ? '\u25b8' : '\u25be';
    });

    function buildSourceGroup(label, list){
      const entries = [];
      for(let r=1; r<=30; r++){
        const rec = record(list.filter(b=>b.snapshotRank===r), 30);
        entries.push({r, rec}); // always all 30 -- ranks with no graded picks yet are shown greyed out, not hidden, so nothing ever looks "missing"
      }
      const group = document.createElement('div');
      const groupLabel = document.createElement('div'); groupLabel.style.cssText = 'font-weight:800;color:var(--navy2);font-size:13px;margin-bottom:6px;'; groupLabel.textContent = label;
      group.appendChild(groupLabel);
      const numCols = 3; // 3 columns x 10 ranks each = 30 ranks exactly every time (was 5x6 -- narrowed to fit a phone screen width, see the vertical stacking below too)
      const perCol = Math.ceil(entries.length / numCols); // = 10, always, since entries.length is always exactly 30
      const colsRow = document.createElement('div'); colsRow.style.cssText = 'display:flex;gap:10px;';
      for(let c=0; c<numCols; c++){
        const slice = entries.slice(c*perCol, (c+1)*perCol);
        if(!slice.length) continue;
        const colDiv = document.createElement('div'); colDiv.style.cssText = 'font-size:11px;line-height:1.7;flex:1;min-width:0;';
        slice.forEach(({r, rec})=>{
          const line = document.createElement('div');
          const hasData = rec.w+rec.l > 0;
          const rankSpan = document.createElement('span');
          rankSpan.style.cssText = `font-weight:800;color:${hasData ? 'var(--navy2)' : 'var(--sub)'};`;
          rankSpan.textContent = `#${r}:`;
          line.appendChild(rankSpan);
          const recSpan = document.createElement('span');
          if(!hasData) recSpan.style.color = 'var(--sub)';
          recSpan.textContent = ` ${fmtRecord(rec)}`;
          line.appendChild(recSpan);
          colDiv.appendChild(line);
        });
        colsRow.appendChild(colDiv);
      }
      group.appendChild(colsRow);
      return group;
    }
    const rankGrid = document.createElement('div');
    rankGrid.style.cssText = 'display:flex;flex-direction:column;gap:16px;';
    rankGrid.appendChild(buildSourceGroup('Standard', stdBets));
    rankGrid.appendChild(buildSourceGroup('Advanced', advBets));
    if(specialsBets.length) rankGrid.appendChild(buildSourceGroup('Specials', specialsBets));
    rankContent.appendChild(rankGrid);
    rankWrap.appendChild(rankContent);
    statsBoxDiv.appendChild(rankWrap);
  }

  function renderTable(){
    tableDiv.innerHTML = '';
    if(!bets.length){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
      na.textContent = 'No snapshots captured yet \u2014 the first one happens the next time the Home page is opened on or after 12:00pm ET.';
      tableDiv.appendChild(na);
      return;
    }

    const filterRow = document.createElement('div');
    filterRow.style.cssText = 'display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;';
    const srcLabel = document.createElement('label'); srcLabel.style.cssText = 'display:flex;align-items:center;gap:6px;';
    srcLabel.appendChild(document.createTextNode('Source:'));
    const srcSelect = document.createElement('select');
    srcSelect.style.cssText = 'padding:4px 8px;border-radius:5px;border:1px solid var(--line);font-family:var(--sans);font-size:12.5px;';
    [['all','All Sources']].concat(APP_TRACKER_SOURCES.map(src=>[src, APP_TRACKER_SOURCE_LABEL[src]])).forEach(([val,label])=>{
      const opt = document.createElement('option'); opt.value=val; opt.textContent=label;
      if(val===sourceFilter) opt.selected = true;
      srcSelect.appendChild(opt);
    });
    srcSelect.addEventListener('change', ()=>{ sourceFilter = srcSelect.value; renderTable(); });
    srcLabel.appendChild(srcSelect);
    filterRow.appendChild(srcLabel);

    const pendingLabel = document.createElement('label'); pendingLabel.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;';
    const pendingCb = document.createElement('input'); pendingCb.type='checkbox'; pendingCb.checked = hidePending;
    pendingCb.addEventListener('change', ()=>{ hidePending = pendingCb.checked; renderTable(); });
    pendingLabel.appendChild(pendingCb);
    pendingLabel.appendChild(document.createTextNode('Hide pending results'));
    filterRow.appendChild(pendingLabel);

    [['rate5','Min L5%'],['rate10','Min L10%'],['rate15','Min L15%'],['rateAll','Min Season%']].forEach(([fkey, flabel])=>{
      const lbl = document.createElement('label'); lbl.style.cssText = 'display:flex;align-items:center;gap:6px;';
      lbl.appendChild(document.createTextNode(flabel+':'));
      const inp = document.createElement('input'); inp.type='number'; inp.min='0'; inp.max='100'; inp.placeholder='any';
      inp.style.cssText = 'width:56px;padding:4px 6px;border-radius:5px;border:1px solid var(--line);font-family:var(--sans);font-size:12.5px;';
      if(rateFilters[fkey]!==null) inp.value = rateFilters[fkey];
      inp.addEventListener('change', ()=>{
        const v = inp.value.trim();
        rateFilters[fkey] = v==='' ? null : Math.max(0, Math.min(100, Number(v)));
        renderTable();
      });
      lbl.appendChild(inp);
      filterRow.appendChild(lbl);
    });
    const clearBtn = document.createElement('button'); clearBtn.textContent = 'Clear rate filters';
    clearBtn.style.cssText = 'padding:4px 10px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-size:12px;cursor:pointer;font-family:var(--sans);';
    clearBtn.addEventListener('click', ()=>{ rateFilters.rate5=rateFilters.rate10=rateFilters.rate15=rateFilters.rateAll=null; renderTable(); });
    filterRow.appendChild(clearBtn);

    tableDiv.appendChild(filterRow);

    let displayRows = computeDisplayRows(bets, sourceFilter);
    if(hidePending) displayRows = displayRows.filter(b => b.result && b.result!=='pending');
    // A bet with no value for a filtered rate (e.g. an older snapshot with no rateAll) can't be
    // verified as meeting the threshold, so it's excluded rather than assumed to pass.
    [['rate5','gp5'],['rate10','gp10'],['rate15','gp15'],['rateAll','gpAll']].forEach(([rk, gk])=>{
      if(rateFilters[rk]===null) return;
      displayRows = displayRows.filter(b => b[rk]!==null && b[rk]!==undefined && b[gk] && (b[rk]*100) >= rateFilters[rk]);
    });

    if(!displayRows.length){
      const na = document.createElement('div'); na.style.cssText='color:var(--sub);font-size:13px;';
      na.textContent = 'No snapshot picks match the current filters.';
      tableDiv.appendChild(na);
      return;
    }

    function fmtRateCell(rate, gp){
      if(rate===null || rate===undefined || gp===null || gp===undefined || gp===0) return '\u2014';
      const hits = Math.round(rate*gp);
      return `${Math.round(rate*100)}% (${hits}/${gp})`;
    }

    // Same default as before (most recent snapshot date, then best rank) unless a column
    // header has been clicked, in which case sort by that column -- same click-to-sort
    // pattern used on the League Stats and Team pages (arrow indicator, click again to
    // flip direction).
    const COLS = [
      {key:'snapshotDate', label:'Snapshot Date', left:true},
      {key:'snapshotSource', label:'Source', left:true},
      {key:'_both', label:'Both'},
      {key:'snapshotRank', label:'Rank'},
      {key:'label', label:'Bet', left:true, sortable:false},
      {key:'rate5', label:'L5%'},
      {key:'rate10', label:'L10%'},
      {key:'rate15', label:'L15%'},
      {key:'rateAll', label:'Season%'},
      {key:'gameLabel', label:'Game', left:true},
      {key:'commenceTime', label:'Game Time', left:true},
      {key:'price', label:'Price'},
      {key:'result', label:'Result'},
      {key:'final', label:'Final', left:true, sortable:false},
      {key:'actions', label:'', sortable:false},
    ];

    let sorted;
    if(sortKey){
      const col = COLS.find(c=>c.key===sortKey);
      sorted = displayRows.slice().sort((a,b)=>{
        let av = a[sortKey], bv = b[sortKey];
        if(av===null||av===undefined) av = col && col.left ? '' : -Infinity;
        if(bv===null||bv===undefined) bv = col && col.left ? '' : -Infinity;
        let d;
        if(typeof av==='string' || typeof bv==='string') d = String(av).localeCompare(String(bv));
        else d = av - bv;
        return sortDir==='asc' ? d : -d;
      });
    } else {
      sorted = displayRows.slice().sort((a,b)=> (b.snapshotDate||'').localeCompare(a.snapshotDate||'') || (a.snapshotRank||0)-(b.snapshotRank||0));
    }

    const wrap = document.createElement('div'); wrap.className='table-wrap';
    const table = document.createElement('table'); table.style.width='100%';
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    COLS.forEach(col=>{
      const th = document.createElement('th');
      if(col.left) th.classList.add('left');
      if(col.sortable===false || !col.label){
        th.textContent = col.label;
      } else {
        th.style.cursor = 'pointer'; th.style.userSelect = 'none';
        const labelSpan = document.createElement('span'); labelSpan.textContent = col.label;
        th.appendChild(labelSpan);
        const arrow = document.createElement('span'); arrow.style.marginLeft = '3px';
        arrow.textContent = sortKey===col.key ? (sortDir==='asc'?'\u25B2':'\u25BC') : '';
        th.appendChild(arrow);
        th.addEventListener('click', ()=>{
          if(sortKey===col.key){ sortDir = sortDir==='asc'?'desc':'asc'; }
          else { sortKey = col.key; sortDir = 'desc'; }
          renderTable();
        });
        if(['rate5','rate10','rate15','rateAll'].includes(col.key)){
          appendDefIcon(th, 'The hit rate over this window AS IT WAS AT THE MOMENT THIS BET WAS CAPTURED \u2014 frozen at that point, never recalculated using games played since. Older snapshots captured before this column existed will show \u2014 here.');
        }
      }
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);
    const tbody = document.createElement('tbody'); table.appendChild(tbody);
    sorted.forEach(bet=>{
      const tr = document.createElement('tr');
      const cellStyle = 'padding:6px 8px;border-bottom:1px solid var(--line);font-size:12.5px;';
      const tdDate = document.createElement('td'); tdDate.className='left'; tdDate.style.cssText=cellStyle; tdDate.textContent = bet.snapshotDate || '\u2014';
      const tdSource = document.createElement('td'); tdSource.className='left'; tdSource.style.cssText=cellStyle;
      tdSource.textContent = APP_TRACKER_SOURCE_LABEL[bet.snapshotSource] || bet.snapshotSource || 'Standard';
      const tdBoth = document.createElement('td'); tdBoth.style.cssText=cellStyle+'text-align:center;';
      if(bet._both){ tdBoth.textContent = '\u2713'; tdBoth.style.color = 'var(--green)'; tdBoth.style.fontWeight = '800'; tdBoth.title = 'Also appears in the other source on this same date'; }
      const tdRank = document.createElement('td'); tdRank.style.cssText=cellStyle+'text-align:center;font-weight:700;color:var(--navy2);'; tdRank.textContent = bet.snapshotRank||'\u2014';
      const tdBet = document.createElement('td'); tdBet.className='left'; tdBet.style.cssText=cellStyle; tdBet.appendChild(buildLegLabelNode(bet));
      // L5/L10/L15/Season hit rates AS THEY WERE AT THE MOMENT THIS BET WAS CAPTURED -- these
      // come directly from fields frozen onto the bet when it was originally built (rate5,
      // rate10, rate15, rateAll), never recomputed against today's data. Snapshots captured
      // before rateAll existed won't have a Season% value -- shows as "—", not a guess.
      const tdR5 = document.createElement('td'); tdR5.style.cssText=cellStyle+'text-align:center;'; tdR5.textContent = fmtRateCell(bet.rate5, bet.gp5);
      const tdR10 = document.createElement('td'); tdR10.style.cssText=cellStyle+'text-align:center;'; tdR10.textContent = fmtRateCell(bet.rate10, bet.gp10);
      const tdR15 = document.createElement('td'); tdR15.style.cssText=cellStyle+'text-align:center;'; tdR15.textContent = fmtRateCell(bet.rate15, bet.gp15);
      const tdRAll = document.createElement('td'); tdRAll.style.cssText=cellStyle+'text-align:center;'; tdRAll.textContent = fmtRateCell(bet.rateAll, bet.gpAll);
      const tdGame = document.createElement('td'); tdGame.className='left'; tdGame.style.cssText=cellStyle+'color:var(--sub);';
      tdGame.textContent = bet.gameLabel || bet.game || '\u2014';
      const tdTime = document.createElement('td'); tdTime.className='left'; tdTime.style.cssText=cellStyle; tdTime.textContent = fmtGameTimeOnly(bet.commenceTime);
      const tdPrice = document.createElement('td'); tdPrice.style.cssText=cellStyle+'text-align:center;'; tdPrice.textContent = fmtAmerican(bet.price);
      const tdResult = document.createElement('td'); tdResult.style.cssText=cellStyle+'text-align:center;';
      const resultWrap = document.createElement('div'); resultWrap.style.cssText='display:flex;align-items:center;justify-content:center;gap:5px;';
      resultWrap.appendChild(legResultIcon(bet.result)); resultWrap.appendChild(fmtResultBadge(bet.result));
      tdResult.appendChild(resultWrap);
      const tdFinal = document.createElement('td'); tdFinal.className='left'; tdFinal.style.cssText=cellStyle+'color:var(--sub);';
      if(bet.result && bet.result!=='pending'){
        const finalLabel = computeFinalValueLabel(bet);
        tdFinal.textContent = finalLabel || '\u2014';
      } else {
        tdFinal.textContent = '\u2014';
      }
      const tdActions = document.createElement('td'); tdActions.style.cssText=cellStyle+'text-align:center;white-space:nowrap;';
      const delBtn = document.createElement('button'); delBtn.textContent='Delete';
      delBtn.style.cssText='padding:3px 8px;border-radius:4px;border:1px solid var(--red);background:var(--panel);color:var(--red);font-size:11px;cursor:pointer;font-family:var(--sans);';
      delBtn.addEventListener('click', async ()=>{ if(!confirm('Delete this snapshot pick?')) return; await appTrackerDelete(bet.id); await refresh(); });
      tdActions.appendChild(delBtn);
      [tdDate,tdSource,tdBoth,tdRank,tdBet,tdR5,tdR10,tdR15,tdRAll,tdGame,tdTime,tdPrice,tdResult,tdFinal,tdActions].forEach(td=>tr.appendChild(td));
      tbody.appendChild(tr);
    });
    wrap.appendChild(table);
    tableDiv.appendChild(wrap);
  }

  await refresh();
}

async function renderBetTrackerPage(){
  lastRender = () => renderBetTrackerPage();
  main.innerHTML = '';
  removeGameWindowStickyBar();

  if(!isLoggedIn()){
    renderAuthGate(main, ()=>renderBetTrackerPage());
    return;
  }

  const head = document.createElement('div'); head.className='pagehead';
  head.innerHTML = `<h2>\ud83d\udcdd Bet Tracker <span id="betTrackerInfoIcon"></span></h2>`;

  appendDefIcon(head.querySelector('#betTrackerInfoIcon'), `A mock record of bets you've made or want to track \u2014 stored on your Worker, so it's the same list on any device. Auto-grades against this app's own historical box scores whenever the game is already in our data.`);

  const acctRow = document.createElement('div'); acctRow.style.cssText='display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12.5px;color:var(--sub);';

  main.appendChild(acctRow);
  renderVerifyEmailBanner(main);

  const statusDiv = document.createElement('div'); statusDiv.className='footnote'; statusDiv.style.marginBottom='14px';
  statusDiv.textContent = 'Loading your tracked bets\u2026';
  main.appendChild(statusDiv);

  const summaryDiv = document.createElement('div');
  main.appendChild(summaryDiv);

  const analysisDiv = document.createElement('div');
  main.appendChild(analysisDiv);

  const actionsRow = document.createElement('div'); actionsRow.style.cssText='display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;';
  const refreshBtn = document.createElement('button'); refreshBtn.className='addbtn'; refreshBtn.textContent = '\ud83d\udd04 Refresh';
  const gradeBtn = document.createElement('button'); gradeBtn.className='addbtn'; gradeBtn.textContent = '\u2705 Auto-Grade Pending Bets';
  const addFormBtn = document.createElement('button'); addFormBtn.className='addbtn'; addFormBtn.textContent = '+ Add Bet Manually';
  const importBtn = document.createElement('button'); importBtn.className='addbtn'; importBtn.textContent = '\u2b07 Import From Odds History';
  const screenshotBtn = document.createElement('button'); screenshotBtn.className='addbtn'; screenshotBtn.textContent = '\ud83d\udcf7 Upload Bet Screenshot(s)';
  const bulkJsonBtn = document.createElement('button'); bulkJsonBtn.className='addbtn'; bulkJsonBtn.textContent = '\ud83d\udcc4 Bulk Import JSON';
  const repairBtn = document.createElement('button'); repairBtn.className='addbtn'; repairBtn.textContent = '\ud83e\uddf9 Repair Missing Game Info';
  const deleteAllBtn = document.createElement('button'); deleteAllBtn.textContent = '\ud83d\uddd1\ufe0f Delete All Tracked Bets';
  deleteAllBtn.style.cssText = 'padding:8px 14px;border-radius:6px;border:1px solid var(--red);background:var(--panel);color:var(--red);font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:700;';
  actionsRow.appendChild(refreshBtn); actionsRow.appendChild(gradeBtn); actionsRow.appendChild(addFormBtn); actionsRow.appendChild(importBtn);
  actionsRow.appendChild(screenshotBtn); actionsRow.appendChild(bulkJsonBtn); actionsRow.appendChild(repairBtn); actionsRow.appendChild(deleteAllBtn);
  main.appendChild(actionsRow);

  // A bet (or any of its parlay legs) matches the free-text "Bet contains" filter if the
  // text appears in any leg's label \u2014 so searching a player name still surfaces parlays

  function betMatchesText(bet, needle){
    if(!needle) return true;
    const hay = needle.toLowerCase();
    if(bet.isParlay && Array.isArray(bet.legs)){
      return bet.legs.some(l => (l.label||'').toLowerCase().includes(hay));

  function applyFilters(list){

  function renderSummary(){

    const push = bets.filter(b=>b.result==='push').length;
    const pending = bets.filter(b=>!b.result || b.result==='pending').length;
    const hitRate = graded.length ? Math.round((won/graded.length)*100) : null;
    const totalPL = bets.reduce((acc,b)=>{

  // ---- Performance Analysis: date range + every breakdown ----
  let analysisRangeStart = null; // null = no lower bound (All Time)
  let analysisRangeEnd = null;
  // Checkbox filters from the By Bet Type / By Stat Type tables -- shared with the main
  // tracked-bets table below (applyFilters/renderTable), so checking a box narrows BOTH the
  // breakdown numbers and which bets/tickets show in the data table, not just one or the other.
  let selectedBetTypes = new Set();
  let selectedStatTypes = new Set();
  let selectedStructures = new Set(); // any of: 'pregame','live','straight','parlay' (broad, from table 1) or 'pregame-straight' etc (exact, from table 2)
  // A ticket can match multiple tags at once (e.g. a live parlay is tagged 'live', 'parlay',
  // AND 'live-parlay') -- so checking the broad "Live" box and the exact "Live Parlay" box
  // both correctly include the same tickets, and checking just "Live" doesn't require also
  // knowing which structure it was.
  function betStructureTags(bet){
    const isLive = bet.timing==='live';
    const isParlay = !!bet.isParlay;
    return [
      isLive ? 'live' : 'pregame',
      isParlay ? 'parlay' : 'straight',
      `${isLive?'live':'pregame'}-${isParlay?'parlay':'straight'}`,
    ];
  }
  // A leg matches if (no bet-type filter active, or its type is checked) AND (no stat-type
  // filter active, or -- for player props only -- its stat is checked). Checking a stat type
  // with no matching bet type still implicitly means "player props with this stat," since a
  // stat type is meaningless for anything else.
  function legMatchesTypeFilters(leg){
    if(selectedBetTypes.size && !selectedBetTypes.has(leg.betType)) return false;
    if(selectedStatTypes.size){
      if(leg.betType!=='player_prop' && leg.betType!=='player_prop_alt') return false;
      if(!selectedStatTypes.has(leg.statKey)) return false;
    }
    return true;
  }
  function matchesStructureFilter(betOrLeg){
    if(!selectedStructures.size) return true;
    return betStructureTags(betOrLeg).some(t=>selectedStructures.has(t)); // works for both a flattened leg (carries timing/isParlay, added in flattenLegs) and a straight ticket (already has them natively)
  }
  // A ticket matches if it's a straight bet that itself matches, or a parlay with AT LEAST
  // ONE leg matching -- showing the whole parlay for context rather than hiding it entirely
  // just because not every leg fits the filter. Structure (timing/isParlay) is a TICKET-level
  // property, so it's checked once per ticket rather than per leg.
  function betMatchesTypeFilters(bet){
    if(!selectedBetTypes.size && !selectedStatTypes.size && !selectedStructures.size) return true;
    if(!matchesStructureFilter(bet)) return false;
    if(!selectedBetTypes.size && !selectedStatTypes.size) return true;
    if(bet.isParlay && Array.isArray(bet.legs)) return bet.legs.some(legMatchesTypeFilters);
    return legMatchesTypeFilters(bet);
  }

  function flattenLegs(betList){
    const out = [];
    betList.forEach(b=>{
      if(b.isParlay && Array.isArray(b.legs)){
        b.legs.forEach(leg=>{
          // Trust this leg's own stored result if it has one (e.g. from a spreadsheet import
          // where the actual outcome is already known) \u2014 only fall back to re-deriving it
          // from box scores when it's genuinely still pending. Re-deriving unconditionally was
          // the bug: gradeLeg() silently returns null (counted as neither win nor loss) whenever
          // it can't cleanly match team/opponent/date/player against this app's box score data
          // (very common for "Live" in-game props, and guaranteed for any leg missing team info),
          // which quietly dropped already-known results out of these leg-level breakdowns even
          // though the bet count itself stayed accurate.
          const legResult = (leg.result && leg.result!=='pending') ? leg.result : gradeLeg(leg);
          // Carry the parent ticket's timing/isParlay onto each leg -- legs don't have their
          // own copy of these, but Pregame-vs-Live/Structure filtering needs to work at the
          // leg level too, same as bet-type/stat-type filtering already does.
          out.push(Object.assign({}, leg, {_legResult: legResult, timing: b.timing, isParlay: true}));
        });
      } else {
        const betResult = (b.result && b.result!=='pending') ? b.result : gradeTrackedBet(b);
        out.push(Object.assign({}, b, {_legResult: betResult}));
      }
    });
    return out;
  }
  function ticketStats(betList){
    const won = betList.filter(b=>b.result==='won').length;
    const lost = betList.filter(b=>b.result==='lost').length;
    const push = betList.filter(b=>b.result==='push').length;
    const graded = won+lost;
    const hitRate = graded ? Math.round((won/graded)*100) : null;
    const pl = betList.reduce((acc,b)=>{
      const stake = b.stake||10;
      if(b.result==='won') return acc + americanPayoutProfit(b.price, stake);
      if(b.result==='lost') return acc - stake;
      return acc;
    },0);
    return {won,lost,push,hitRate,pl,total:betList.length};
  }
  function legStats(legs){
    const won = legs.filter(l=>l._legResult==='won').length;
    const lost = legs.filter(l=>l._legResult==='lost').length;
    const graded = won+lost;
    const hitRate = graded ? Math.round((won/graded)*100) : null;
    return {won,lost,hitRate,total:legs.length};
  }
  function renderStatsTable(container, title, rows, showPL, checkboxConfig){

    table.appendChild(thead);
    const tbody = document.createElement('tbody'); table.appendChild(tbody);
    rows.forEach(r=>{
      if(r.stats.total===0 && !(checkboxConfig && checkboxConfig.selectedSet.has(r.key))) return; // skip empty categories entirely, unless it's checked (then keep it visible so unchecking is still possible)

        r.stats.hitRate!==null ? r.stats.hitRate+'%' : '\u2014',
      ];
      if(showPL) cells.push((r.stats.pl>=0?'+':'')+'$'+r.stats.pl.toFixed(2));

  function renderAnalysis(){
    analysisDiv.innerHTML = '';
    if(bets.length===0) return;

    const title = document.createElement('div'); title.className='section-title'; title.textContent = '\ud83d\udcca Performance Analysis';
    analysisDiv.appendChild(title);

    const rangeRow = document.createElement('div');
    rangeRow.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;';
    const rangeLabel = document.createElement('div'); rangeLabel.style.cssText='font-weight:700;color:var(--navy2);font-size:13px;'; rangeLabel.textContent='Range:';
    rangeRow.appendChild(rangeLabel);

    const PRESETS = [
      ['7d','Last 7 Days'], ['30d','Last 30 Days'], ['month','This Month'], ['year','This Year'], ['all','All Time'],
    ];
    let activePreset = 'all';
    const presetBtns = [];
    PRESETS.forEach(([key,lbl])=>{
      const b = document.createElement('button'); b.textContent = lbl;
      function setActive(){
        const isActive = key===activePreset;
        b.style.cssText = `padding:5px 12px;border-radius:5px;border:1px solid ${isActive?'var(--navy2)':'var(--line)'};background:${isActive?'var(--navy2)':'var(--panel)'};color:${isActive?'#fff':'var(--ink)'};font-size:12px;cursor:pointer;font-family:var(--sans);`;
      }
      b.addEventListener('click', ()=>{
        activePreset = key;
        const now = new Date();
        // These boundaries are compared against snapshotDate, which is an EASTERN date string
        // (nowInEastern().dateStr) -- so they have to be Eastern too. Deriving them from
        // toISOString() put them a day out for the whole 8pm-midnight ET window.
        const etDay = toEasternDateStr(now.toISOString());
        if(key==='7d'){ const d=new Date(now); d.setDate(d.getDate()-7); analysisRangeStart=toEasternDateStr(d.toISOString()); analysisRangeEnd=null; }
        else if(key==='30d'){ const d=new Date(now); d.setDate(d.getDate()-30); analysisRangeStart=toEasternDateStr(d.toISOString()); analysisRangeEnd=null; }
        else if(key==='month'){ analysisRangeStart = etDay.slice(0,8)+'01'; analysisRangeEnd=null; }
        else if(key==='year'){ analysisRangeStart = etDay.slice(0,4)+'-01-01'; analysisRangeEnd=null; }
        else { analysisRangeStart=null; analysisRangeEnd=null; }
        startInput.value = analysisRangeStart || '';
        endInput.value = analysisRangeEnd || '';
        presetBtns.forEach(pb=>pb.update());
        renderBreakdowns();
      });
      b.update = setActive;
      setActive();
      presetBtns.push(b);
      rangeRow.appendChild(b);
    });

    const startInput = document.createElement('input'); startInput.type='date';
    startInput.style.cssText='padding:5px;border:1px solid var(--line);border-radius:5px;font-size:12px;';
    const endInput = document.createElement('input'); endInput.type='date';
    endInput.style.cssText='padding:5px;border:1px solid var(--line);border-radius:5px;font-size:12px;';
    function customRangeChanged(){

      presetBtns.forEach(pb=>pb.update());
      analysisRangeStart = startInput.value || null;
      analysisRangeEnd = endInput.value || null;
